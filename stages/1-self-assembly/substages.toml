# stages/1-self-assembly/substages.toml -- the BOTTOM of the trace graph.
# Every fact here is falsifiable against the working tree: sha256, exact
# byte size and git mode for every source, tool, and committed binary.
# `veron trace` terminates on these records; `veron trace --verify` re-hashes
# every path named here and fails on any mismatch. Regenerated by
# rebaseline.sh derive; guarded by 1-self-assembly-verify on every push.
#
# MODE IS LOAD-BEARING AT STAGE 1: the committed binaries run on checkout
# only because git preserves 0755, and the elf-wrapper EMITS 0755 outputs
# by construction (openat mode 01ED + fchmod) -- so mode is part of the
# artifact contract, not decoration.

[[substage]]
id       = "1/1/self-assembler"
stage    = 1
arch     = "aarch64"
flavor   = "trunk"
root     = "self-assembly"

[[substage.input]]
role   = "source"
path   = "stages/1-self-assembly/self-assembler-arm64.s"
sha256 = "3e2ba52c208cd6fc7e371bcfa715ccfa4c356497833dafbf99ba19f5971a7a48"
bytes  = 48563
mode   = "0644"

[[substage.input]]
role   = "tool"                      # the mechanical GNU-as -> .s0 translator
path   = "tools/s0_selfhost.py"
sha256 = "6b2db52b7e8fc056d36fe3d67e2e980c2257c51662174bb0b78050f1b8dde864"
bytes  = 32294
mode   = "0755"

[[substage.input]]
role   = "builder"                   # SELF -- the self-assembly loop, as data.
ref    = "1/1/self-assembler"        # Repeats its own output hash: falsified
sha256 = "e97e2969cf88b11a4ed28d7b22c9154a155fe9c38d01e420ab09151f2938f550"
                                     # the moment gen1 != gen2.

[[substage.output]]
path   = "stages/1-self-assembly/self-assembler-arm64"
sha256 = "e97e2969cf88b11a4ed28d7b22c9154a155fe9c38d01e420ab09151f2938f550"
bytes  = 3730
mode   = "0755"

# THE RECIPE: literal argv, no shell. stdin/stdout are explicit fields
# because the pipeline is stdin->stdout by design and argv cannot spell a
# redirection. $W is the substage scratch dir (build/<stage>/<arch>/...).
# THE SELF-REFERENCE, AS DATA: the binary named in step "assemble" is the
# output this record declares -- sha e97e2969... runs the command that
# produces sha e97e2969... That loop is the stage's name.

[[substage.step]]
name   = "translate"
run    = ["python3", "tools/s0_selfhost.py", "xlate",
          "stages/1-self-assembly/self-assembler-arm64.s", "$W/sa.s0"]

[[substage.step]]
name   = "assemble"
run    = ["stages/1-self-assembly/self-assembler-arm64"]
stdin  = "$W/sa.s0"
stdout = "$W/gen.bin"

[[substage.step]]
name   = "wrap"
run    = ["stages/1-self-assembly/elf-wrapper-arm64", "$W/gen"]
stdin  = "$W/gen.bin"
# $W/gen == the declared output, byte-identical (replay-verified)

[substage.verify]
fixpoint   = "gen1 == gen2 == gen3, byte-identical"
regression = "builds spike stage-1 (1702 B) and stage-2 (23719 B) byte-identically to the committed spike pair (read-only oracle)"
roundtrip  = "reassemble/reconstruct/readback/crosscheck/plain-diff under pinned binutils 2.47 + LLVM 22.1.8 -- roundtrip.sh; mandatory in CI"

[[substage]]
id       = "1/2/elf-wrapper"
stage    = 1
arch     = "aarch64"
flavor   = "trunk"
root     = "self-assembly"

[[substage.input]]
role   = "source"
path   = "stages/1-self-assembly/elf-wrapper-arm64.s"
sha256 = "6e164349cc1b393b8ef704c1c7ec598341cc636fe781debf6eb9c1d6bbd6305d"
bytes  = 8234
mode   = "0644"

[[substage.input]]
role   = "tool"
path   = "tools/s0_selfhost.py"
sha256 = "6b2db52b7e8fc056d36fe3d67e2e980c2257c51662174bb0b78050f1b8dde864"
bytes  = 32294
mode   = "0755"

[[substage.input]]
role   = "builder"                   # assembled BY the self-assembler:
ref    = "1/1/self-assembler"        # committed elf-wrapper code bytes (429)
sha256 = "e97e2969cf88b11a4ed28d7b22c9154a155fe9c38d01e420ab09151f2938f550"
                                     # == self-assembler(elf-wrapper.s0), verified

[[substage.output]]
path   = "stages/1-self-assembly/elf-wrapper-arm64"
sha256 = "7466fae15a15825ee4b45ccd5c0b897bbe84c2b56d19b05f52b3f0940eed0774"
bytes  = 549
mode   = "0755"

[[substage.step]]
name   = "translate"
run    = ["python3", "tools/s0_selfhost.py", "xlate",
          "stages/1-self-assembly/elf-wrapper-arm64.s", "$W/ew.s0"]

[[substage.step]]
name   = "assemble"
run    = ["stages/1-self-assembly/self-assembler-arm64"]
stdin  = "$W/ew.s0"
stdout = "$W/ew.bin"

[[substage.step]]
name   = "wrap"          # the wrapper wraps its OWN code bytes
run    = ["stages/1-self-assembly/elf-wrapper-arm64", "$W/ew"]
stdin  = "$W/ew.bin"
# $W/ew == the declared output, byte-identical (replay-verified)

[substage.verify]
fixpoint   = "elfgen1 == elfgen2 == elfgen3 (wraps its own bytes to a fixpoint)"
builder    = "code bytes == self-assembler(elf-wrapper .s0), byte-identical"
roundtrip  = "same five checks, same pins -- roundtrip.sh"
