name: gcc-backend-backport-probe

# SPIKE. CAN gcc 4.8's AARCH64 BACKEND BE MOVED BACK INTO gcc 4.7?
#
# WHAT gcc-entrypoint-probe SETTLED. On aarch64 the two boundaries coincide:
#
#     oldest gcc with an aarch64 backend  = 4.8   (4.7 has ZERO aarch64:
#                                                  config.guess 0, config.sub 0,
#                                                  config.gcc 0, config/ has arm only)
#     oldest gcc requiring a C++ compiler = 4.8   (top-level configure is lenient,
#                                                  gcc/ SUBDIR configure enforces CXX)
#
# so there is no version that both targets our architecture and builds with a C
# compiler. That probe listed four escapes: cross-compile the entry point, find
# a C-buildable C++ compiler, patch 4.8 to build with C, or accept a borrowed
# rung.
#
# THIS SPIKE MEASURES A FIFTH, and the only one that closes the circle natively.
#
# EVERY gcc UP TO 4.7 IS WRITTEN IN C -- that is what the 4.8 boundary means. So
# gcc 4.7 does not merely give us a C compiler, it gives us a C++ COMPILER
# (g++ 4.7, full C++98) that was itself built from C. 4.8 asks for "an ISO C++98
# compiler"; g++ 4.7 is one. The only thing wrong with 4.7 here is the missing
# backend, and a gcc backend is a self-contained directory plus config entries:
#
#     tcc -> gcc 4.7 + backported aarch64 backend -> g++ 4.7 -> gcc 4.8 -> modern
#
# HOW TO MEASURE IT WITHOUT DOING IT. The cost of a backport is the cost of
# bridging whatever the backend↔middle-end interface changed between the two
# releases. That is measurable with a CONTROL:
#
#     How much did the EXISTING arm backend have to change from 4.7 to 4.8?
#
# arm is the right control: it is a live backend present in both releases,
# maintained by the same people who contributed aarch64, and it absorbs exactly
# the interface churn that a backported aarch64 would have to absorb. A small
# arm delta means the interface was stable across that release and the backport
# is mostly mechanical. A large one means the interface moved underneath it and
# this route is not cheap.
#
# WHICH 4.8? BOTH. 4.8.0 is the release the aarch64 port LANDED in, so it is the
# minimum interface distance from 4.7 and the honest subject for a backport
# measurement -- diffing against 4.8.5 conflates the port with four point
# releases of unrelated 4.8 development. But 4.8.5 is the last and most
# bug-fixed of the series and is the likelier BUILD target. Different questions,
# possibly different answers, so measure both and also diff the aarch64 backend
# 4.8.0 -> 4.8.5 to see how much the young port had to be fixed.
#
# Nothing here builds gcc. It is inventory and diff -- minutes, not hours.

on:
  push:
    paths:
      - '.github/workflows/gcc-backend-backport-probe.yml'
  workflow_dispatch:

concurrency:
  group: gcc-backend-backport-${{ github.ref }}
  cancel-in-progress: true

env:
  GNU: 'https://mirrors.kernel.org/gnu'

jobs:
  backport-size:
    name: 'How big is the aarch64 backport into 4.7?'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl bzip2 xz-utils diffstat

      - name: 'Fetch 4.7.4 and 4.8.5'
        run: |
          set -eu
          # g47 = last C-buildable. g480 = first with aarch64. g485 = last 4.8.
          for pair in "g47 4.7.4" "g480 4.8.0" "g485 4.8.5"; do
            set -- $pair
            mkdir -p "$1"
            curl -fsSL --retry 3 --connect-timeout 15 \
              -o "$1.tar.bz2" "$GNU/gcc/gcc-$2/gcc-$2.tar.bz2"
            tar xf "$1.tar.bz2" -C "$1" --strip-components=1
            echo "  $2 -> $1  $(du -sh "$1" | cut -f1)"
          done
          # Confirm the boundary rather than trusting it: 4.8.0 must have
          # aarch64 and 4.7.4 must not.
          for d in g47 g480 g485; do
            echo "  $d: aarch64 in config.gcc = $(grep -c aarch64 "$d/gcc/config.gcc" || true), config/aarch64 dir = $( [ -d "$d/gcc/config/aarch64" ] && echo yes || echo NO)"
          done

      - name: '1. INVENTORY: what exactly would be moved?'
        run: |
          set -u
          for d in g480 g485; do
            echo "  === gcc/config/aarch64 in $d ==="
            echo "    files : $(ls -1 $d/gcc/config/aarch64/ | wc -l)"
            echo "    C/H   : $(cat $d/gcc/config/aarch64/*.c $d/gcc/config/aarch64/*.h 2>/dev/null | wc -l) lines"
            echo "    .md   : $(cat $d/gcc/config/aarch64/*.md 2>/dev/null | wc -l) lines (machine description)"
            echo "    total : $(cat $d/gcc/config/aarch64/* 2>/dev/null | wc -l) lines"
          done
          echo
          echo "  === how much did the YOUNG port get fixed, 4.8.0 -> 4.8.5? ==="
          diff -ru g480/gcc/config/aarch64 g485/gcc/config/aarch64 > a64.diff 2>/dev/null || true
          diffstat -s a64.diff | sed 's/^/    /'
          echo "    A large delta here means backporting 4.8.0's backend inherits"
          echo "    bugs that 4.8.5 fixed -- in which case backport 4.8.5's version"
          echo "    and bridge the wider interface gap deliberately."
          echo
          ls -1 g480/gcc/config/aarch64/ | sed 's/^/    /'
          echo
          echo "  The .md files are read by gcc's generator programs (genemit,"
          echo "  genattrtab, ...) which emit C that is then compiled. ROADMAP.md"
          echo "  already flags those generators as real structure that any"
          echo "  hand-rolled build must reproduce -- they are also what makes a"
          echo "  backend portable between releases."
          echo
          echo "  === config entries outside that directory ==="
          for f in gcc/config.gcc config.sub config.guess gcc/configure.ac; do
            echo "    $f: $(grep -c aarch64 "g480/$f" 2>/dev/null || echo 0) mentions"
          done

      - name: '2. THE CONTROL: how much did the arm backend change 4.7 -> 4.8?'
        run: |
          set -u
          # arm is present in BOTH releases, maintained by the same people who
          # contributed aarch64, and absorbs exactly the interface churn a
          # backported aarch64 would have to absorb. Its delta is the proxy for
          # the backport's difficulty.
          # BOTH distances. 4.7.4 -> 4.8.0 is the real backport distance; the
          # 4.8.5 column shows how much of any delta is later 4.8 development
          # rather than the C-to-C++ release boundary itself.
          for tgt in arm vax; do
            for v in g480 g485; do
              diff -ru "g47/gcc/config/$tgt" "$v/gcc/config/$tgt" > "$tgt-$v.diff" 2>/dev/null || true
              printf '  %-4s 4.7.4 -> %-5s : %s\n' "$tgt" "${v#g}" \
                "$(diffstat -s "$tgt-$v.diff" | tr '\n' ' ')"
            done
          done
          echo
          echo "  --- arm, per-file, at the backport distance (4.7.4 -> 4.8.0) ---"
          diffstat arm-g480.diff 2>/dev/null | tail -20 | sed 's/^/    /'
          echo
          # A second control from the other direction: a backend that is NOT
          # under active development should change even less. If arm churned and
          # this did not, the churn is arm's own development rather than
          # interface change -- which would be good news for the backport.
          echo "  vax is the CONTROL FOR THE CONTROL: nobody was developing it,"
          echo "  so its delta is close to pure interface change."
          echo
          echo "  READ IT THIS WAY: arm's delta is (interface churn + arm's own"
          echo "  development). vax's delta is ~pure interface churn, because"
          echo "  nobody was developing vax. vax small => the interface held =>"
          echo "  a backported aarch64 mostly just works. vax large => the"
          echo "  middle-end moved and every backend had to be dragged along."

      - name: '3. THE INTERFACE ITSELF: target hooks 4.7 vs 4.8'
        run: |
          set -u
          # target.def is the machine-readable list of every hook a backend may
          # implement. Its delta is the interface delta, directly.
          # target.def entries look like:  DEFHOOK\n(hook_name,\n "doc" ...
          # so the name is the first token of the line after a DEFHOOK*.
          for v in 47 480 485; do
            grep -A1 -E '^DEFHOOK' "g$v/gcc/target.def" 2>/dev/null \
              | grep -oE '^\([a-z_][a-z0-9_]*' | tr -d '(' | sort -u > "hooks$v.txt" || true
            n=$(wc -l < "hooks$v.txt")
            echo "  target.def hooks in $v: $n"
            if [ "$n" -lt 50 ]; then
              echo "    *** PARSE LOOKS WRONG (expected hundreds). Raw sample:"
              head -12 "g$v/gcc/target.def" | sed 's/^/      /'
            fi
          done
          echo
          echo "  --- hooks in 4.8.0 but NOT in 4.7.4 (the backport distance) ---"
          comm -13 hooks47.txt hooks480.txt | head -30 | sed 's/^/    /'
          echo "    count: $(comm -13 hooks47.txt hooks480.txt | wc -l)"
          echo "    (for reference, 4.8.5 vs 4.7.4: $(comm -13 hooks47.txt hooks485.txt | wc -l))"
          echo
          echo "  --- of those, how many does the aarch64 backend actually use? ---"
          # SPELLING MATTERS HERE. target.def names hooks in lowercase
          # (add_stmt_cost), but a backend implements one as an UPPERCASE macro
          # carrying its group prefix:
          #     HOOK_VECTOR (TARGET_VECTORIZE, vectorize)
          #     DEFHOOK (add_stmt_cost, ...)  ->  TARGET_VECTORIZE_ADD_STMT_COST
          # Run 1 searched with `grep -w add_stmt_cost`, which matches neither
          # the case nor the word boundary, and returned 0 -- the same 0 it
          # would return if the answer were 21. Case-insensitive SUBSTRING is
          # the search that can actually find a hit.
          used=0
          : > needed.txt
          while IFS= read -r h; do
            [ -z "$h" ] && continue
            for d in g480 g485; do
              if grep -riq "$h" "$d/gcc/config/aarch64/" 2>/dev/null; then
                printf '%s (%s)\n' "$h" "$d" >> needed.txt; used=$((used+1)); break
              fi
            done
          done < <(comm -13 hooks47.txt hooks480.txt)
          sed 's/^/    /' needed.txt
          echo "    THE NUMBER THAT MATTERS: $used of the new hooks are referenced"
          echo "    by the backend and would have to be added to 4.7."
          echo
          # Positive control: a hook that certainly IS used proves the search works.
          echo "  --- search sanity check (must be non-zero) ---"
          for known in legitimate_address_p function_value rtx_costs; do
            printf '    %-24s %s\n' "$known" \
              "$(grep -ril "$known" g480/gcc/config/aarch64/ 2>/dev/null | wc -l) file(s)"
          done
          echo "    If those are all 0 the search is broken, not the answer."

      - name: '4. What else does the backend reach for that 4.7 may not have?'
        run: |
          set -u
          # Crude but sizing: identifiers the aarch64 backend calls that appear
          # nowhere in 4.7's gcc/ tree are things the backport would have to
          # bring with it or work around.
          cat g480/gcc/config/aarch64/*.c 2>/dev/null \
            | grep -oE '\b[a-z_][a-z0-9_]{6,}\b *\(' | tr -d ' (' \
            | sort -u > syms.txt
          echo "  distinct long identifiers used by the backend: $(wc -l < syms.txt)"
          : > missing.txt
          while IFS= read -r sym; do
            grep -rqw "$sym" g47/gcc/*.h g47/gcc/*.c 2>/dev/null || echo "$sym" >> missing.txt
          done < syms.txt
          tot=$(wc -l < missing.txt 2>/dev/null || echo 0)
          # Run 1 reported 223 absent and every visible one was the backend's
          # OWN static. Filtering the backend's own namespace is what turns this
          # from an upper bound into something worth reading.
          grep -vE '^(aarch64|aapcs)_' missing.txt > foreign.txt 2>/dev/null || true
          echo "  absent from 4.7's gcc/          : $tot"
          echo "  ... after removing aarch64_/aapcs_ (the backend's own): $(wc -l < foreign.txt)"
          echo
          echo "  --- the ones that are NOT the backend's own ---"
          sed 's/^/    /' foreign.txt
          echo
          echo "  These are the genuine middle-end dependencies. Some will still"
          echo "  be false positives (macros, or names defined in 4.7 headers this"
          echo "  grep does not read). The point is to catch a nasty surprise --"
          echo "  a whole subsystem absent from 4.7 -- not to be precise."

      - name: VERDICT
        run: |
          echo "  TWO ROUTES, TWO COSTS, BOTH NOW MEASURED:"
          echo
          echo "    backport aarch64 into 4.7   cost = interface delta (steps 2+3)"
          echo "      -> keeps the chain native AND C-only end to end,"
          echo "         and yields g++ 4.7 for free, which is what 4.8 wants."
          echo
          echo "    patch 4.8 to build with C   cost = its C++ surface"
          echo "      -> measured by gcc-entrypoint-probe job B."
          echo
          echo "  The backport wins on principle if its cost is comparable: it"
          echo "  needs no C++ anywhere, where patching 4.8 leaves us maintaining"
          echo "  a fork of a compiler against its own build system."
          echo
          echo "  If the arm delta is large but the vax delta is small, the churn"
          echo "  is arm's own development and the backport is cheaper than the"
          echo "  arm number suggests. Read step 2 before concluding."
          echo
          echo "  WHICH 4.8 TO BACKPORT FROM, decided by step 1's last diff:"
          echo "    aarch64 4.8.0 -> 4.8.5 small  = take 4.8.0's backend, shortest"
          echo "                                    interface distance to 4.7."
          echo "    aarch64 4.8.0 -> 4.8.5 large  = the initial port was buggy;"
          echo "                                    take 4.8.5's backend and pay"
          echo "                                    the wider gap deliberately."
