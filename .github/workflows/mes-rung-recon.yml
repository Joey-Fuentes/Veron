name: mes-rung-recon

# SPIKE. WHAT DOES BUILDING MES ACTUALLY REQUIRE?
#
# The pins are settled (livebootstrap-pins-probe, outcome 1): live-bootstrap
# 9a268c4 pins stage0-posix 45d90f59, which pins EXACTLY our three commits --
# M2-Planet bd2fe4b (1.13.1), M2libc 68a23cf, mescc-tools 5adfbf3. Its matching
# upper half is Mes 0.27.1 and tcc 0.9.27. So there is one coherent set and we
# are already on it.
#
# THIS WORKFLOW BUILDS NOTHING. It reads live-bootstrap's own Mes step and
# prints the recipe, because the last time we guessed at an upstream recipe we
# were wrong four times in a row (see UPSTREAM-PINS.md: "do not reconstruct
# upstream's recipe -- run their script and take the binary"). The Mes rung is
# the first one where we cannot simply run their script end to end, since ours
# has to substitute G1 as the compiler -- so we need to know precisely which
# commands they run, in what order, with what inputs.
#
# WHAT WE ALREADY KNOW GOES WRONG HERE. borrow-tcc's Part B stopped because Mes
# needs a GENERATED include/mes/config.h -- configure.sh plus @VERSION@
# substitution plus catm preprocessing -- i.e. live-bootstrap's mes-step driver,
# which needs kaem and catm from mescc-tools. So the questions this must answer:
#
#   1. what files does steps/mes-0.27.1/ contain, and what does its script do?
#   2. where does Mes's source come from (tarball? url? checksum?)
#   3. exactly how is include/mes/config.h produced?
#   4. which mescc-tools binaries does the step need (kaem, catm, blood-elf)?
#   5. what -f list / architecture flags does it pass to M2-Planet?
#
# Once those are on the page, the reference arm can be written against fact.

on:
  push:
    paths:
      - '.github/workflows/mes-rung-recon.yml'
  workflow_dispatch:

concurrency:
  group: mes-rung-recon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LB_SHA: 9a268c4c39cae952b268bc86da342be2175f03d4
      MES_VER: '0.27.1'
    steps:
      - uses: actions/checkout@v5

      - name: Fetch live-bootstrap at the confirmed pin
        run: |
          git clone https://github.com/fosslinux/live-bootstrap.git lb
          git -C lb checkout -q "$LB_SHA"
          echo "  lb pinned at: $(git -C lb rev-parse HEAD)  $(git -C lb log -1 --format=%cs)"
          echo "  confirming the chain still resolves to our pins:"
          S0=$(git -C lb ls-tree HEAD -- seed/stage0-posix | awk '{print $3}')
          echo "    stage0-posix $S0"

      - name: '1-2. The Mes step: what is in it, and where does the source come from?'
        run: |
          D=lb/steps/mes-$MES_VER
          [ -d "$D" ] || { echo "NO SUCH STEP: $D"; ls lb/steps | grep -i mes; exit 1; }
          echo "=== files in steps/mes-$MES_VER ==="
          find "$D" -type f | sed "s|^$D/|    |" | sort
          echo
          echo "=== sources (where the tarball comes from, and its checksum) ==="
          for f in "$D/sources" lb/steps/SHA256SUMS.sources lb/SHA256SUMS.sources; do
            if [ -f "$f" ]; then
              echo "  --- $f ---"
              grep -i mes "$f" | sed 's/^/    /' || true
            fi
          done
          echo
          echo "=== the SHIPPED config.h (this is what borrow-tcc Part B was missing) ==="
          sed -n '1,60p' "$D/files/config.h" | sed 's/^/    /'
          echo
          echo "=== published checksums for the x86 build -- this rung's proof.answer ==="
          head -20 "$D/mes-0.27.1.x86.checksums" | sed 's/^/    /'
          echo "    ... $(wc -l < "$D/mes-0.27.1.x86.checksums") entries total"

      - name: '3-5. The recipe itself'
        run: |
          D=lb/steps/mes-$MES_VER
          echo "############################################################"
          echo "### pass1.kaem -- THE BUILD RECIPE"
          echo "############################################################"
          sed 's/^/    /' "$D/pass1.kaem"
          echo
          echo "### the wait4 patch it applies"
          diff -u "$D/simple-patches/wait4.before" "$D/simple-patches/wait4.after" \
            | sed 's/^/    /' || true
          echo
          for f in $(find "$D" -type f \( -name '*.sh' -o -name 'pass*' \) ! -name 'pass1.kaem' | sort); do
            echo "############################################################"
            echo "### $f"
            echo "############################################################"
            sed 's/^/    /' "$f"
            echo
          done

      - name: 'What the recipe needs: config.h, kaem/catm, and the M2-Planet flags'
        run: |
          D=lb/steps/mes-$MES_VER
          echo "=== how is include/mes/config.h produced? ==="
          grep -rniE 'config\.h|configure|@VERSION@|version' "$D" | head -25 | sed 's/^/    /' || true
          echo
          echo "=== which mescc-tools binaries does it invoke? ==="
          for t in kaem catm blood-elf M1 hex2 get_machine mescc-tools-extra sha256sum; do
            n=$(grep -rc --include='*' -w "$t" "$D" 2>/dev/null | awk -F: '{s+=$2} END{print s+0}')
            if [ "$n" != 0 ]; then printf '    %-16s %s reference(s)\n' "$t" "$n"; fi
          done
          echo
          echo "=== M2-Planet invocations (architecture + -f list) ==="
          grep -rhoE 'M2-Planet[^|;&]*' "$D" | head -20 | sed 's/^/    /' || true
          echo
          echo "=== architecture assumptions in this step ==="
          grep -rniE 'x86|amd64|aarch64|arm|riscv|ARCH' "$D" | head -20 | sed 's/^/    /' || true
          echo
          echo "NOTE: MesCC has no native aarch64 backend (x86 + armhf only,"
          echo "      GNU Mes 0.27). Our rung therefore targets x86 at the"
          echo "      M2-Planet level -- G1 --architecture x86 -- exactly as"
          echo "      no-host-chain.yml was designed to do."

      - name: 'THE SUBSTITUTION POINT: Mes own kaem.x86, where M2-Planet is invoked'
        run: |
          set -u
          URL=$(awk '/mes-0.27.1.tar.gz/{print $2}' "lb/steps/mes-$MES_VER/sources")
          SUM=$(awk '/mes-0.27.1.tar.gz/{print $3}' "lb/steps/mes-$MES_VER/sources")
          echo "  fetching $URL"
          curl -sSL -o mes.tar.gz "$URL"
          echo "  expected sha256: $SUM"
          echo "  actual   sha256: $(sha256sum mes.tar.gz | cut -d' ' -f1)"
          sha256sum mes.tar.gz | grep -q "^$SUM " \
            && echo "  CHECKSUM OK" || { echo "  CHECKSUM MISMATCH"; exit 1; }
          tar xzf mes.tar.gz
          D=mes-$MES_VER
          echo
          echo "=== kaem scripts shipped with Mes ==="
          ls "$D" | grep -i kaem | sed 's/^/    /' || true
          echo
          echo "############################################################"
          echo "### kaem.x86 -- THIS is where M2-Planet builds mes-m2"
          echo "############################################################"
          sed 's/^/    /' "$D/kaem.x86"
          echo
          echo "=== every M2-Planet / M1 / hex2 / blood-elf invocation in it ==="
          grep -nE 'M2-Planet|M1 |hex2|blood-elf|catm' "$D/kaem.x86" | sed 's/^/    /' || true
          echo
          echo "=== kaem.run (the arena/base-address settings live-bootstrap patches) ==="
          [ -f "$D/kaem.run" ] && sed 's/^/    /' "$D/kaem.run" || echo "    (none)"
          echo
          echo "SUBSTITUTION POINT: wherever kaem.x86 calls M2-Planet, our rung"
          echo "  puts G1 (--architecture x86). G1 IS refM2P byte for byte, so the"
          echo "  reference arm and our arm share a compiler and differ only in"
          echo "  provenance -- which is the cleanest possible A/B for this rung."
          echo
          echo "GATE for this rung: /usr/bin/mes-m2 sha256"
          echo "  62895fcf68b21961e018c797b3144fc86f9dbd5a535776e9e68a01b3fd33de08"
          echo
          echo "TOOLS the recipe needs beyond mescc-tools (kaem, catm, M1, hex2,"
          echo "  blood-elf): replace, ungz, untar, simple-patch,"
          echo "  checksum-transcriber, match -- several from MESCC-TOOLS-EXTRA,"
          echo "  which stage0-posix pins at a151c245 and which we have never built."
