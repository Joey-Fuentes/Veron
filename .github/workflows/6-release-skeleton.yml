# 6-release-skeleton -- stage 6, the consumer release, on a runner.
#
# The stage lives in stages/6-release/build.sh, one phase per step below;
# the workflow adds what only a runner can: the evidence chain, publish,
# attestation, the maintenance gate. Every byte-shaping tool runs inside a
# box rooted at the released system itself (see build.sh); the airlock
# installs bubblewrap and fetches the stage-5 tools bundle (debugfs, zstd,
# qemu) so that nothing apt provides touches the image.
name: 6-release-skeleton

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry_run -- build and verify everything, publish nothing."
        type: boolean
        default: true
      publish_site:
        description: "deploy the storefront to GitHub Pages."
        type: boolean
        default: false
      boot_gate:
        description: "boot the image under OVMF (ahci and usb) and require dinit. Publishing needs it."
        type: boolean
        default: false
      maintenance_gate:
        description: "the user journey into maintenance mode, unmocked (apt qemu; a gate, not a byte-shaper)."
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: KVM -- hardware virtualization when the runner has it
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; echo "kvm: on"; else echo "kvm: absent -- TCG"; fi

      - name: AIRLOCK -- bubblewrap is the wall; the stage-5 tools bundle carries debugfs, zstd, qemu
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sh tools/fetch-tools.sh

      - name: 6 IN -- rootfs (stage 5), kernel + loader + modules (stage 4), firmware pins
        run: sh stages/6-release/build.sh in
      - name: 6 UNPACK -- the released system as a tree, with its own debugfs
        run: sh stages/6-release/build.sh unpack
      - name: 6 FW -- the firmware tree, in the box
        run: sh stages/6-release/build.sh fw
      - name: 6 IMAGE -- the A/B GPT image, in the box, twice, compared
        run: sh stages/6-release/build.sh image
      - name: 6 BOOT GATE -- the consumer path boots to init, ahci and usb, under the system's own OVMF
        if: ${{ inputs.boot_gate }}
        run: sh stages/6-release/build.sh boot
      - name: EVIDENCE -- the boot serials, whole, always
        if: ${{ always() && inputs.boot_gate }}
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial
          path: box6/boot/
          if-no-files-found: ignore

      - name: MAINTENANCE GATE -- a person enters maintenance mode, and the stick becomes writable
        if: ${{ inputs.maintenance_gate }}
        run: |
          set -eu
          # THE WHOLE JOURNEY, DRIVEN LIKE A PERSON DRIVES IT, NOTHING MOCKED:
          # see spikes/stage6/tools/veron-maintenance-gate for every step and
          # why. Normal desktop -> Super+Return -> `veron-flasher` -> click
          # "Reflash this boot device..." -> the machine reboots ITSELF into
          # RAM -> desktop again -> flasher again -> the stick is a target.
          # Three screenshots and the serial log upload whatever the verdict.
          #
          # WHY THIS EXISTS: maintenance mode worked on paper and did not come
          # up on bare metal (2026-08-21). The first run of this gate is the
          # reproduction; every later run is the regression test. It is a
          # separate step from BOOT GATE because it needs a display, a pointer,
          # USB attachment, a bigger RAM budget for the pivot, and a VM that is
          # ALLOWED to reboot -- four things the boot gate deliberately has not.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf inotify-tools >/dev/null
          # HOST QEMU AND HOST OVMF, BY REVERSION (Joe, 2026-08-24): the
          # wrapper-borne gate flip is withdrawn from this workflow -- it ran
          # the rootfs's own dynamic qemu under apt bwrap, a borrowed tool
          # introduced against the stated direction that gates use OUR tools.
          # The self-hosted gate returns when the tools bundle carries a
          # static bubblewrap (Rung H); until then the borrowed emulator is
          # stated here rather than smuggled through an exec shim.
          # KVM when the runner has it (GitHub's Linux runners do, behind a
          # root-only node); TCG otherwise. The gate prints which.
          mkdir -p out/maintenance-gate
          for img in box6/img/veron-x86_64.raw; do
            [ -e "$img" ] || { echo "no x86_64 image to test"; exit 1; }
            sh spikes/stage6/tools/veron-maintenance-gate \
              --image "$img" --out out/maintenance-gate --mem 6144 --kvm auto 2>&1
          done
      - name: EVIDENCE -- the maintenance journey
        if: ${{ always() && inputs.maintenance_gate }}
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-gate
          path: out/maintenance-gate/
          if-no-files-found: ignore

      - name: 6 PACK -- out/6 named by what was proven; .zst by this project's zstd; SHA256SUMS, PACKED-BY, BUDGET
        run: sh stages/6-release/build.sh pack

      - name: EVIDENCE-CHAIN -- the attestations and build logs of everything this release is made from
        run: |
          set -eu
          # THE CHAIN IS EIGHT STAGES, EACH WITH ONE DELIVERABLE AND ONE LOG.
          # RULED (Joe, 2026-08-19): not a graph walk over every pinned digest
          # -- that over-collected 41 intermediate runs. Resolve each stage's ONE
          # deliverable to its attestation, hence its run, hence its log. att-run.py
          # (python, Veron-native -- NOT jq) decodes the base64 DSSE payload for the
          # run id, so this same resolution verifies on-device. Writes stages.tsv
          # (stage/digest/run) which the Pages evidence viewer renders, no download.
          mkdir -p evidence/attestations evidence/logs
          : > evidence/stages.tsv
          resolve() {
            label=$1; dg=$2
            [ -n "$dg" ] || { echo "  $label: no digest -- skipped"; return; }
            sleep 1
            if timeout 30 gh api "repos/$GITHUB_REPOSITORY/attestations/sha256:$dg" \
                 > "evidence/attestations/$label.json" 2>/dev/null \
               && [ -s "evidence/attestations/$label.json" ] \
               && grep -q '"attestations"' "evidence/attestations/$label.json"; then
              rid=$(python3 tools/att-run.py "evidence/attestations/$label.json" | head -1)
              echo "  $label: $(echo "$dg" | cut -c1-16)  run $rid"
              printf '%s\t%s\t%s\n' "$label" "$dg" "$rid" >> evidence/stages.tsv
            else
              rm -f "evidence/attestations/$label.json"
              echo "  $label: $(echo "$dg" | cut -c1-16)  NO ATTESTATION"
            fi
          }
          echo "resolving the eight stages:"
          S1=$(awk '/self-assembler-arm64/{print $1; exit}' stages/1-self-assembly/BASELINE.txt)
          resolve "1-self-assembler" "$S1"
          S2=$(awk '/path.*"out\/2\/aarch64\/pico-c"/{f=1} f&&/sha256/{gsub(/[^0-9a-f]/,"",$3);print $3;exit}' stages/2-pico-c/substages.toml)
          resolve "2-pico-c" "$S2"
          S3M=$(awk '/path.*"out\/3\/aarch64\/tcc-arm64"/{f=1} f&&/sha256/{gsub(/[^0-9a-f]/,"",$3);print $3;exit}' stages/3-micro-c/substages.toml)
          resolve "3-micro-c" "$S3M"
          mkdir -p rel
          gh release download 3/latest-x86_64 -R "$GITHUB_REPOSITORY" -p 'ARTIFACT-SHA256' -D rel/3 --clobber 2>/dev/null || true
          S3C=$(grep -i 'tcc-amd64' rel/3/ARTIFACT-SHA256 2>/dev/null | grep -oE '[0-9a-f]{64}' | head -1)
          resolve "3-cross-tcc-amd64" "$S3C"
          gh release download 4/latest-x86_64 -R "$GITHUB_REPOSITORY" -p 'SYSROOT-SHA256' -D rel/4 --clobber 2>/dev/null || true
          S4=$(grep -oE '[0-9a-f]{64}' rel/4/SYSROOT-SHA256 2>/dev/null | head -1)
          resolve "4-sysroot" "$S4"
          gh release download 4/kernel-x86_64 -R "$GITHUB_REPOSITORY" -p '*SHA256*' -D rel/k --clobber 2>/dev/null || true
          S4K=$(grep -i 'vmlinuz\|KERNEL-GENERIC' rel/k/*SHA256* 2>/dev/null | grep -oE '[0-9a-f]{64}' | head -1)
          resolve "4-kernel" "$S4K"
          gh release download 5/latest-x86_64 -R "$GITHUB_REPOSITORY" -p 'PROVENANCE' -D rel/5 --clobber 2>/dev/null || true
          S5=$(sha256sum rel/5/PROVENANCE 2>/dev/null | cut -d' ' -f1)
          resolve "5-provenance" "$S5"
          printf '%s\t%s\t%s\n' "6-release" "this-release" "$GITHUB_RUN_ID" >> evidence/stages.tsv
          echo "  6-release: (this run) $GITHUB_RUN_ID"
          att=$(wc -l < evidence/stages.tsv)
          logs=0
          while IFS="$(printf '\t')" read -r label dg rid; do
            [ -n "$rid" ] || continue
            # STAGE 6 IS THIS RUN. Its own Actions logs do not exist until the
            # run completes, so the release job CANNOT fetch them -- that is
            # exactly why the pages job (needs: release) runs afterward and
            # captures this run's log then. Record 6-release in stages.tsv (the
            # page needs the row) but do not try to pull its log here.
            [ "$label" = "6-release" ] && { echo "  $label: log captured later by the pages job (run $rid)"; continue; }
            sleep 1
            timeout 120 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/logs" \
              > "evidence/logs/$label.zip" 2>/dev/null || true
            if [ -s "evidence/logs/$label.zip" ]; then
              logs=$((logs+1)); echo "  $label: log captured (run $rid)"
            else
              rm -f "evidence/logs/$label.zip"
              echo "  $label: log not yet retained by Actions (run $rid)"
            fi
          done < evidence/stages.tsv
          {
            echo "VERON EVIDENCE BUNDLE -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "the build chain as eight stages, seed to release:"
            echo
            sed 's/^/  /' evidence/stages.tsv
            echo
            echo "attestations/  the Sigstore bundle for each stage's deliverable."
            echo "logs/          one build log per stage, past artifact retention."
            echo "stages.tsv     stage <tab> digest <tab> run -- what the site renders."
          } > evidence/MANIFEST.txt
          echo "VERON-EVIDENCE-CHAIN  $att stages, $logs logs, bundled beside the release"
          # THE BOOT SERIAL joins the bundle: the stage-6 boot gate booted the
          # published image in qemu and captured boot-serial.log -- the machine
          # coming up, every service by name. The page renders it so a visitor
          # sees the release actually boot, not just a claim that it does.
          [ -f boot-serial.log ] && cp boot-serial.log evidence/boot-serial.log || true
          # PACKAGE THE BUNDLE for PUBLISH to upload and the pages job to render.
          mkdir -p out
          tar -czf out/evidence.tar.gz -C evidence .
          echo "  wrote out/evidence.tar.gz ($(stat -c%s out/evidence.tar.gz) bytes)"

      - name: EVIDENCE -- out/6 as an artifact, so any two runs can be compared file by file
        uses: actions/upload-artifact@v4
        with:
          name: release-out
          path: |
            out/6/SHA256SUMS
            out/6/PACKED-BY
            out/6/BUDGET
            box6/img/veron-x86_64.raw
          if-no-files-found: error

      - name: PUBLISH -- size-gate, immutable tag, moving latest
        if: ${{ !inputs.dry_run }}
        run: |
          set -eu
          # TWO STRUCTURAL REFUSALS BEFORE ANY BYTE UPLOADS: publishing
          # requires the boot gate to have run, and no .NOBOOT artifact
          # may ever reach a release -- the name exists so this line can
          # read it.
          [ "${{ inputs.boot_gate }}" = "true" ] \
            || { echo "publish without boot_gate is not a thing"; exit 1; }
          ! ls out/6/*.NOBOOT.img >/dev/null 2>&1 \
            || { echo "a .NOBOOT artifact cannot be published"; exit 1; }
          C7=${GITHUB_SHA::7}
          # out/6/SHA256SUMS and the .zst are made by `build.sh pack` with this project's zstd (out/6/PACKED-BY names it)
          for img in out/6/*.img; do
            [ -e "$img.zst" ] || { echo "$img has no .zst -- build.sh pack did not run"; exit 1; }
            size=$(stat -c %s "$img.zst")
            # GITHUB'S CEILING IS 2 GiB PER ASSET; the gate fails BEFORE an
            # upload half-succeeds, and says which escape hatch to take.
            [ "$size" -lt 2147483648 ] || {
              echo "$img.zst is $size bytes -- over the 2 GiB asset ceiling."
              echo "Shrink slots or move to the chunked layout (spec 12)."
              exit 1; }
            ( cd out && sha256sum "$(basename "$img")" "$(basename "$img").zst" ) >> out/SHA256SUMS
          done
          cat out/SHA256SUMS
          # RE-RELEASING THE SAME COMMIT IS ALLOWED, because the image is now
          # byte-reproducible (boot gate no longer mutates it). The invariant
          # worth keeping is NOT "the tag may never be created twice" -- that
          # was a workaround from when the build was non-deterministic. The real
          # invariant is "a given commit must never ship DIFFERENT bytes." So:
          # if the tag is new, create it; if it already exists, the newly built
          # image MUST match what is already published -- same bytes re-release
          # succeeds (idempotent), different bytes fail loudly (a real
          # reproducibility violation, the thing actually worth catching).
          our_sha=$(awk '/\.img$/{print $1; exit}' out/SHA256SUMS)
          if gh release view "release/$C7" >/dev/null 2>&1; then
            echo "  release/$C7 already exists -- verifying byte-identity"
            pub_line=$(gh release view "release/$C7" \
              --json body --jq '.body' 2>/dev/null | grep -m1 "\.img " || true)
            # the authoritative published digest lives in the release's
            # SHA256SUMS asset; fetch it and compare the .img line.
            tmp=$(mktemp -d)
            gh release download "release/$C7" -p SHA256SUMS -D "$tmp" --clobber 2>/dev/null || true
            pub_sha=$(awk '/\.img$/{print $1; exit}' "$tmp/SHA256SUMS" 2>/dev/null || true)
            rm -rf "$tmp"
            if [ -n "$pub_sha" ] && [ "$pub_sha" != "$our_sha" ]; then
              echo "  FAIL  commit $C7 already published DIFFERENT bytes:"
              echo "        published $pub_sha"
              echo "        rebuilt   $our_sha"
              echo "        same commit must yield the same image -- refusing to"
              echo "        overwrite an immutable release with different content."
              exit 1
            fi
            echo "  ok    rebuilt image matches the published release ($our_sha)"
            echo "  re-uploading assets (idempotent, --clobber)"
            gh release upload "release/$C7" \
              out/6/*.img.zst out/6/SHA256SUMS out/6/PACKED-BY out/6/BUDGET out/evidence.tar.gz --clobber
          else
            echo "  release/$C7 is new -- creating it"
            gh release create "release/$C7" \
              --title "Veron release/$C7" \
              --notes "Consumer release at commit $GITHUB_SHA. Digests in SHA256SUMS; provenance on the repository's attestation page." \
              out/6/*.img.zst out/6/SHA256SUMS out/6/PACKED-BY out/6/BUDGET out/evidence.tar.gz
          fi
          gh release delete "6/latest" --yes 2>/dev/null || true
          git push --delete origin "6/latest" 2>/dev/null || true
          gh release create "6/latest" \
            --title "Veron -- latest consumer release" \
            --notes "Moving pointer; the immutable record is release/$C7." \
            out/6/*.img.zst out/6/SHA256SUMS out/6/PACKED-BY out/6/BUDGET out/evidence.tar.gz

      - name: ATTEST -- provenance for everything published
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/6/*.img.zst
