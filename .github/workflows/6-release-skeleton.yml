# 6-release -- SKELETON. The shape is real; the unbuilt steps say so and
# exit loudly rather than pretending. Nothing publishes until dry_run is
# turned off ON PURPOSE, which will not happen until every placeholder
# below has become a real step. Committed now so the structure can be
# reviewed against docs/STAGE6-RELEASE.md while stage 5 finishes its relay.
#
# ONE STAGE 6 FOR EVERY ARCHITECTURE. This workflow is arch-common by
# ruling: it reads EVERY arch's current stage-5 and kernel releases,
# builds consumer images for whichever arches have inputs, and regenerates
# the ENTIRE site every run -- the storefront is a function of all current
# releases, never of what just ran.

name: 6-release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry_run -- build and verify everything, publish nothing. Stays true until the skeleton is fully fleshed.'
        type: boolean
        default: true
      publish_site:
        description: 'deploy the storefront to GitHub Pages. The site is honest about what does not exist yet, so it may go live before the images do.'
        type: boolean
        default: false
      boot_gate:
        description: 'boot every built image under OVMF and require dinit. Arm this once 4/kernel carries fragment v8 (EFI stub + baked cmdline); a passing gate is what retires the .NOBOOT name.'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # The arch list is data, not structure: adding an arch is one word
      # here once its stage-5 exists. Today x86_64 is the only populated
      # input; the loop below simply finds nothing for the others and says
      # so, which is the designed behavior, not a failure.
      ARCHES: "x86_64 aarch64"
      DRY_RUN: ${{ inputs.dry_run && 'yes' || 'no' }}

    steps:
      - uses: actions/checkout@v5

      - name: 'IN -- every arch''s current releases, digest- and attestation-verified'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p in
          found=0
          for arch in $ARCHES; do          f until every placeholder
# below has become a real step. Committed now so the structure can be
# reviewed against docs/STAGE6-RELEASE.md while stage 5 finishes its relay.
#
# ONE STAGE 6 FOR EVERY ARCHITECTURE. This workflow is arch-common by
# ruling: it reads EVERY arch's current stage-5 and kernel releases,
# builds consumer images for whichever arches have inputs, and regenerates
# the ENTIRE site every run -- the storefront is a function of all current
# releases, never of what just ran.

