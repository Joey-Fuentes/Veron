name: tcc-userland-arm64

# SPIKE. CAN OUR tcc PRODUCE A REAL, BOOTABLE arm64 USERLAND?
#
# THE INSIGHT THIS RESTS ON. The kernel and the userland are INDEPENDENT
# artifacts. Linux's syscall ABI is the contract and it is deliberately stable,
# so a GCC-built kernel neither knows nor cares which compiler produced the
# static binaries issuing svc #0 against it. A tcc-built musl+busybox userland
# on a GCC-built modern arm64 kernel is ordinary, not a compatibility hack.
#
# WHY THAT MATTERS. Research (see spikes/stage4/ROADMAP.md, leg 3) says a MODERN Linux
# kernel is out of tcc's reach: asm goto with outputs (arm64 get_user() needs
# it), jump labels, linker scripts, and an arm64 inline assembler that only
# became partially functional in a Feb 2026 tcc patch. But that is the KERNEL
# half. The USERLAND half -- a static init and shell -- needs only ordinary C
# plus a libc, which is squarely in tcc's range.
#
# So this spike proves the half we can have, and does it end to end:
#   1. tcc (mob) builds musl
#   2. tcc + musl build busybox, statically
#   3. the result RUNS natively on aarch64
#   4. it boots as PID 1 under a GCC-built kernel in qemu-system-aarch64
#
# Step 4 is the real claim. Everything before it is plumbing.
#
# NATIVE aarch64 THROUGHOUT -- ubuntu-24.04-arm, no cross-compiling, no x86.
#
# KNOWN RISK, stated up front so a failure is read correctly: musl ships .s/.S
# sources for aarch64, so this exercises tcc's arm64 INTEGRATED ASSEMBLER --
# historically a stub that errored "ARM asm not implemented", with a partial
# implementation only submitted Feb 2026 and described as "enough to compile
# musl 1.2.5". If musl fails on an .s file, that is the assembler, not the
# codegen, and the fix is upstream tcc rather than anything of ours.
#
# THAT Feb-2026 SERIES IS NOW VENDORED at spikes/stage3/patches/tcc-arm64-asm/
# and applied below if mob does not already carry it. Its author's claim --
# "enough to compile musl 1.2.5" -- is exactly this spike's step 1, so a musl
# failure now measures the gap between that claim and reality rather than the
# distance to a stub. See that directory's README for provenance, the unwrap
# the mailing-list archive made necessary, and the error strings to grep for.

on:
  push:
    paths:
      - '.github/workflows/tcc-userland-arm64.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'mob as-is, or mob rewound + the Feb-2026 arm64 asm series'
        type: choice
        options: [mob, mob-plus-series]
        default: mob-plus-series

concurrency:
  group: tcc-userland-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  MUSL_VER: '1.2.5'
  BUSYBOX_VER: '1.36.1'
  VARIANT: ${{ github.event.inputs.variant || 'mob-plus-series' }}
  # A version string is asserted after the fact; a hash makes the FETCH itself
  # verifiable, which is what sources/ and TRUST-BOUNDARY.md are about.
  # busybox's is computed from the 1.36.1 tarball. musl's is '-' because it has
  # not been verified here -- the fetcher prints the hash it gets so it can be
  # pinned, and inventing one would be worse than admitting it is missing.
  BUSYBOX_SHA256: 'b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314'
  # Measured by fetch-pinned.sh in run #21 from musl.libc.org, then pinned.
  # A mismatch from here on is a real signal rather than a shrug.
  MUSL_SHA256: 'a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4'

jobs:
  userland:
    runs-on: ubuntu-24.04-arm          # NATIVE aarch64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Confirm native aarch64
        run: |
          echo "  uname -m : $(uname -m)"
          echo "  gcc      : $(gcc -dumpmachine)"
          [ "$(uname -m)" = aarch64 ] || { echo "NOT aarch64"; exit 1; }

      - name: Cache upstream tarballs
        uses: actions/cache@v4
        with:
          path: dl
          key: upstream-musl${{ env.MUSL_VER }}-busybox${{ env.BUSYBOX_VER }}-v1

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl gcc make bzip2 xz-utils cpio file linux-libc-dev \
            qemu-system-arm qemu-utils

      - name: 'Build tcc (variant: mob / mob-plus-series)'
        run: |
          set -eu
          git clone -q git://repo.or.cz/tinycc.git tccsrc \
            || git clone -q https://repo.or.cz/tinycc.git tccsrc \
            || git clone -q https://github.com/TinyCC/tinycc.git tccsrc
          echo "  mob HEAD: $(git -C tccsrc rev-parse HEAD)"
          echo "  date    : $(git -C tccsrc log -1 --format=%ci)"
          echo "  variant : $VARIANT"

          # NO AUTO-DETECT. An earlier version of this step skipped the series
          # when arm64-tok.h was present, on the theory that its presence meant
          # the series was already upstream. It does not: mob has its OWN arm64
          # assembler with its own token header, and on `bic x1, x0, #1` that
          # assembler fails where the series succeeds. Which tree to measure is
          # a choice, so it is an input, not a guess.
          if [ "$VARIANT" = mob-plus-series ]; then
            # Base selection is blob-exact, not date- or ancestry-guessed; see
            # the header of apply-series.sh for why "just before mob's own
            # assembler landed" was the wrong tree and broke tccasm.c:1178.
            bash "$GITHUB_WORKSPACE/spikes/stage3/patches/tcc-arm64-asm/apply-series.sh" \
                 tccsrc || { echo "  PATCH FAILED -- refusing to measure a half-patched tree"; exit 1; }
          fi

          cd tccsrc && ./configure --cc=gcc >/dev/null && make -j"$(nproc)" >/dev/null
          ./tcc -v
          echo "TCC=$PWD/tcc"  >> "$GITHUB_ENV"
          echo "TCCDIR=$PWD"   >> "$GITHUB_ENV"

      - name: 'Assembler smoke test (REPORTING ONLY -- never fails the run)'
        continue-on-error: true
        run: |
          set -u
          cd tccsrc
          # This step used to exit 1 on a rejected instruction, which stopped the
          # run before the musl enumeration -- the thing actually worth having.
          # The assembler is PARTIAL by construction; a rejection here is data.
          probe() {
            printf '.text\n.globl _p\n_p:\n%s\n.Lx:\n    ret\n' "$1" > /tmp/one.s
            if ./tcc -B. -c /tmp/one.s -o /tmp/one.o 2>/tmp/one.err; then
              printf '    %-24s ok\n' "$1"
            else
              printf '    %-24s FAIL  %s\n' "$1" \
                "$(head -1 /tmp/one.err | sed 's/.*error: //')"
            fi
          }
          echo "  --- forms musl leans on ---"
          probe "mov x0, #7"
          probe "bic x1, x0, x2"
          probe "bic x1, x0, #1"
          probe "orr x2, x1, x0"
          probe "and x3, x0, #15"
          probe "cbz x2, .Lx"
          probe "tbz x0, #0, .Lx"
          probe "ldr x0, [x1, #8]"
          probe "stp x29, x30, [sp, #-16]!"
          probe "adrp x0, _p"
          echo
          echo "  --- C-level probes ---"
          rc=0; ./tcc -B. -run "$GITHUB_WORKSPACE/spikes/stage4/probes/kern.c" || rc=$?
          echo "    kern.c (inline asm)     exit=$rc (expect 0)"
          rc=0; ./tcc -B. -run "$GITHUB_WORKSPACE/spikes/stage4/probes/feat.c" || rc=$?
          echo "    feat.c (C constructs)   exit=$rc (expect 6)"

      - name: '1. tcc builds musl'
        continue-on-error: true
        run: |
          set -u
          # Run 2 died on curl(35) from musl.libc.org -- transient, not a build
          # problem. Retry, then fall back to git mirrors at the matching tag.
          # Bounded, cached, hash-checked. The chain this replaces spent
          # ~250s failing: unbounded curl retries, a dead barfooze mirror
          # (404), a 135s git stall, and a github clone that hit a credential
          # prompt -- then killed the job with exit 128 under bash -e.
          F="$GITHUB_WORKSPACE/tools/fetch-pinned.sh"
          chmod +x "$F"
          bash "$F" musl "dl/musl-$MUSL_VER.tar.gz" "$MUSL_SHA256" \
            "https://musl.libc.org/releases/musl-$MUSL_VER.tar.gz
             https://github.com/bminor/musl/archive/refs/tags/v$MUSL_VER.tar.gz" \
            "https://git.musl-libc.org/git/musl
             https://github.com/bminor/musl" \
            "v$MUSL_VER" || { echo "  musl unavailable"; exit 1; }
          [ -f musl/configure ] || { echo "  could not obtain musl source"; exit 1; }
          # Assert the pin here too -- musl's git tags are v1.2.5 so the branch
          # name happens to be right, but "happens to be" is not a guarantee.
          MUSL_GOT=$(cat musl/VERSION 2>/dev/null | tr -d '[:space:]')
          echo "  musl version: ${MUSL_GOT:-<unknown>} (pinned: $MUSL_VER)"
          [ "$MUSL_GOT" = "$MUSL_VER" ] || {
            echo "  PIN VIOLATION: got ${MUSL_GOT:-<unknown>}, expected $MUSL_VER"; exit 1; }
          echo "  musl source: $(du -sh musl | cut -f1)"
          cd musl
          set +e
          ./configure CC="$TCC -B$TCCDIR" --disable-shared \
            --prefix="$PWD/../muslroot" > conf.log 2>&1
          echo "  configure rc=$?"; tail -8 conf.log | sed 's/^/    /'
          # PASS 1: -k so it does NOT stop at the first missing instruction.
          # Run 1 died on ONE opcode (bic) and told us nothing about the rest;
          # the complete list is what sizes the work.
          timeout 1800 make -k -j"$(nproc)" > build.log 2>&1
          echo "  make -k rc=$?"
          echo
          # TWO WORDINGS, because the two assemblers word it differently:
          #   mob    : ARM64 instruction 'bic' not implemented
          #   series : unrecognized opcode X / unary opcode X / nullaryopcode X
          # A previous edit replaced the first pattern with the second on the
          # mistaken belief that mob did not emit it. mob emits exactly that.
          missing() {
            { grep -oE "instruction '[^']+' not implemented" "$1" \
                | sed "s/instruction '//; s/' not implemented//"
              grep -oE "unrecognized (nullaryopcode|unary opcode|opcode) [^ ,]+" "$1" \
                | awk '{print $NF}'
            } 2>/dev/null | sort -u
          }
          echo "  === EVERY arm64 mnemonic the assembler does not implement ==="
          missing build.log | sed 's/^/    /'
          echo "    distinct: $(missing build.log | wc -l)"
          echo
          echo "  === partial-implementation misses (mnemonic known, form not) ==="
          grep -oE "(unsupported extend/shift specifier|unexpected operand|immediate [-0-9]+ out of range|immediate out of range|invalid bitmask[^,]*|shift amount out of range|bitmask too large[^,]*)" build.log \
            | sed 's/[0-9a-f]\{4,\}/N/g' | sort | uniq -c | sort -rn | head -15 | sed 's/^/    /'
          echo
          echo "  === which .s files failed, and do C fallbacks exist? ==="
          for f in $(grep -oE '^src/[^:]+\.s' build.log | sort -u); do
            base=$(basename "$f" .s); dir=$(dirname "$(dirname "$f")")
            alt="$dir/$base.c"
            printf '    %-34s C fallback %s\n' "$f" \
              "$( [ -f "$alt" ] && echo "YES ($alt)" || echo no )"
          done
          echo
          echo "  === other (non-assembler) error classes ==="
          grep -oE 'error: [^,;]*' build.log | grep -v 'not implemented' \
            | sed 's/[0-9]\+/N/g' | sort | uniq -c | sort -rn | head -15 | sed 's/^/    /'
          echo
          echo "  objects built despite -k: $(find obj -name '*.o' 2>/dev/null | wc -l)"

          # PASS 2: musl ships portable C fallbacks for several arch files.
          # Drop the .s sources that tcc cannot assemble and let the generic C
          # versions be used -- a legitimate substitution, and one we NAME.
          echo
          echo "  === PASS 2: drop unassemblable .s, use musl's own C fallbacks ==="
          dropped=0
          for f in $(grep -oE '^src/[^:]+\.s' build.log | sort -u); do
            base=$(basename "$f" .s); dir=$(dirname "$(dirname "$f")")
            if [ -f "$dir/$base.c" ]; then
              rm -f "$f"; dropped=$((dropped+1)); echo "    dropped $f"
            fi
          done
          echo "    dropped $dropped file(s)"
          if [ "$dropped" -gt 0 ]; then
            timeout 1800 make -j"$(nproc)" > build2.log 2>&1
            echo "    rebuild rc=$?"
            tail -12 build2.log | sed 's/^/      /'
            missing build2.log | sed 's/^/      still missing: /'
          fi

          # PASS 3: _Complex. Run 1 turned up 66 "_Complex is not yet supported"
          # errors -- a limit of tcc's C FRONT END, not of its assembler, so no
          # amount of assembler patching touches them. They are confined to
          # src/complex/, which a static init and shell never reference, so
          # dropping that directory is a legitimate substitution -- and one we
          # NAME rather than quietly succeed around.
          if grep -q '_Complex is not yet supported' build.log build2.log 2>/dev/null; then
            echo
            echo "  === PASS 3: drop src/complex (tcc has no _Complex) ==="
            n=$(ls src/complex/*.c 2>/dev/null | wc -l)
            rm -f src/complex/*.c
            echo "    dropped $n complex-math source file(s)"
            echo "    NOTE: the resulting libc.a has no cacos/csqrt/etc. Nothing in"
            echo "    busybox or a PID-1 shell references them, but this libc is"
            echo "    NOT a complete musl and must not be described as one."
            timeout 1800 make -j"$(nproc)" > build3.log 2>&1
            echo "    rebuild rc=$?"
            tail -12 build3.log | sed 's/^/      /'
            missing build3.log | sed 's/^/      still missing: /'
          fi

          # Was: make install >/dev/null 2>&1 -- which hid a partial install.
          echo
          echo "  === make install ==="
          if make install > install.log 2>&1; then
            echo "    install rc=0"
          else
            echo "    install rc=$? -- tail follows"
            tail -12 install.log | sed 's/^/      /'
          fi
          echo "    lib: $(ls ../muslroot/lib 2>/dev/null | tr '\n' ' ')"
          echo "    bin: $(ls ../muslroot/bin 2>/dev/null | tr '\n' ' ')"
          echo "    crt: $(ls ../muslroot/lib/*.o 2>/dev/null | xargs -n1 basename 2>/dev/null | tr '\n' ' ')"

          # KERNEL UAPI HEADERS INTO THE SYSROOT.
          # musl ships the libc headers and nothing else. busybox also needs the
          # kernel's user-facing headers -- linux/fs.h, linux/netlink.h,
          # asm/types.h, mtd/mtd-user.h and friends -- which live in
          # /usr/include and are NOT part of musl. Before the shim passed
          # -nostdinc they were picked up incidentally from the host; now that
          # glibc's headers are correctly excluded, these have to be placed in
          # the sysroot deliberately. That is what a real musl sysroot looks
          # like: musl-cross-make installs kernel headers into it the same way.
          #
          # DECLARE THIS: they come from the host distro's linux-libc-dev. The
          # principled source is `make headers_install` from the pinned kernel
          # tree, which leg 3 of the roadmap will have; until then this is a
          # borrowed input and belongs in the ledger as one.
          MI="$PWD/../muslroot/include"
          TRIPLE=$(gcc -dumpmachine)
          copied=""
          for d in linux asm-generic mtd; do
            [ -d "/usr/include/$d" ] && cp -a "/usr/include/$d" "$MI/" && copied="$copied $d"
          done
          if [ -d "/usr/include/$TRIPLE/asm" ]; then
            cp -a "/usr/include/$TRIPLE/asm" "$MI/" && copied="$copied asm($TRIPLE)"
          elif [ -d "/usr/include/asm" ]; then
            cp -a "/usr/include/asm" "$MI/" && copied="$copied asm"
          fi
          echo "    uapi headers copied:$copied"
          echo "    linux/*.h: $(ls "$MI/linux" 2>/dev/null | wc -l)  asm/*.h: $(ls "$MI/asm" 2>/dev/null | wc -l)"
          set -e

      - name: '2. Does the tcc-built musl actually work?'
        continue-on-error: true
        run: |
          set -u
          MR="$PWD/muslroot"
          echo "  muslroot/lib: $(ls "$MR/lib" 2>/dev/null | tr '\n' ' ')"
          [ -f "$MR/lib/libc.a" ] || { echo "  no libc.a -- musl did not build"; exit 0; }
          echo "  libc.a: $(wc -c < "$MR/lib/libc.a") bytes, $(ar t "$MR/lib/libc.a" 2>/dev/null | wc -l) members"
          sudo apt-get install -y --no-install-recommends gdb >/dev/null 2>&1 || true

          LIBTCC1=""
          for c in "$TCCDIR/libtcc1.a" "$TCCDIR/arm64-libtcc1.a"; do
            [ -f "$c" ] && LIBTCC1="$c" && break
          done

          # A LADDER, not one test. Run 1 linked a static aarch64 ELF that died
          # with SIGILL (exit 132), and a single failing testcase cannot say
          # whether the fault is in tcc's codegen, in musl's startup, or in one
          # libc routine. Each rung below adds exactly one thing.
          #
          #   A  no libc at all -- raw _start and an exit syscall. Tests tcc's
          #      code generation and ELF output and nothing else.
          #   B  crt1.o + libc, main returns immediately. Adds musl's startup:
          #      __libc_start_main, TLS setup, auxv parsing.
          #   C  adds malloc/free and string.h.
          #   D  adds stdio -- the original testcase.
          #
          # The first rung that fails names the layer.
          mkdir -p lad && cd lad
          printf 'void _start(void){__asm__ volatile("mov x8,#93\\n mov x0,#7\\n svc #0");}\n' > a.c
          printf 'int main(void){return 7;}\n' > b.c
          printf '#include <stdlib.h>\n#include <string.h>\nint main(void){char*p=malloc(32);strcpy(p,"ok");free(p);return 7;}\n' > c.c
          printf '#include <stdio.h>\nint main(void){printf("musl works\\n");return 7;}\n' > d.c

          link_libc() {   # $1 = source, $2 = output
            "$TCC" -B"$TCCDIR" -g -static -nostdinc -nostdlib -I"$MR/include" \
              "$MR/lib/crt1.o" "$MR/lib/crti.o" "$1" \
              -L"$MR/lib" -lc $LIBTCC1 "$MR/lib/crtn.o" -o "$2" 2>&1
          }

          FIRSTFAIL=""
          for r in "A nolibc a.c" "B startup b.c" "C malloc c.c" "D stdio d.c"; do
            set -- $r; tag=$1; what=$2; src=$3
            if [ "$tag" = A ]; then
              out=$("$TCC" -B"$TCCDIR" -g -static -nostdlib -nostdinc -o "$tag" "$src" 2>&1) || true
            else
              out=$(link_libc "$src" "$tag") || true
            fi
            if [ ! -x "$tag" ]; then
              printf '  %s %-8s LINK FAILED  %s\n' "$tag" "$what" "$(printf '%s' "$out" | head -1)"
              [ -z "$FIRSTFAIL" ] && FIRSTFAIL="$tag"
              continue
            fi
            rc=0; ./"$tag" >/dev/null 2>&1 || rc=$?
            case $rc in
              7)   printf '  %s %-8s ok (exit 7)\n' "$tag" "$what" ;;
              132) printf '  %s %-8s SIGILL\n'  "$tag" "$what"; [ -z "$FIRSTFAIL" ] && FIRSTFAIL="$tag" ;;
              139) printf '  %s %-8s SIGSEGV\n' "$tag" "$what"; [ -z "$FIRSTFAIL" ] && FIRSTFAIL="$tag" ;;
              135) printf '  %s %-8s SIGBUS\n'  "$tag" "$what"; [ -z "$FIRSTFAIL" ] && FIRSTFAIL="$tag" ;;
              *)   printf '  %s %-8s exit=%s\n' "$tag" "$what" "$rc"; [ -z "$FIRSTFAIL" ] && FIRSTFAIL="$tag" ;;
            esac
          done

          echo
          if [ -z "$FIRSTFAIL" ]; then
            echo "  ALL RUNGS PASS -- a tcc-built musl works"
            exit 0
          fi

          # WATCH THE MACHINE. spikes/stage3/README.md's method note is explicit
          # that differential source-mutation produced four confident wrong
          # answers for one bug, and that trapping the fault and reading the
          # emitted instruction is what worked. Same rule here.
          echo "  === first failing rung: $FIRSTFAIL -- where exactly? ==="
          if command -v gdb >/dev/null 2>&1; then
            gdb -batch -q \
              -ex 'run' \
              -ex 'echo \n--- faulting pc ---\n' -ex 'info registers pc' \
              -ex 'echo \n--- instructions around it ---\n' -ex 'x/10i $pc-16' \
              -ex 'echo \n--- backtrace ---\n' -ex 'bt' \
              ./"$FIRSTFAIL" 2>&1 | tail -40 | sed 's/^/    /'
          else
            echo "    gdb unavailable; dmesg tail:"
            sudo dmesg 2>/dev/null | tail -5 | sed 's/^/    /' || true
          fi
          echo
          echo "  === objdump of the entry path ==="
          objdump -d --start-address=0x400000 ./"$FIRSTFAIL" 2>/dev/null \
            | grep -A12 '<_start>:' | head -16 | sed 's/^/    /' || true

      - name: '3. tcc + musl build busybox, static'
        continue-on-error: true
        run: |
          set -u
          MR="$PWD/muslroot"
          # THE LAST FALLBACK USED TO BE UNPINNED, and it fired. Run 1 of this
          # step went: busybox.net SSL timeout -> gentoo mirror 404 -> git
          # clone --branch 1.36.1 "Remote branch not found" (busybox git tags
          # use UNDERSCORES, 1_36_1) -> and then a bare clone of master, which
          # is 1.37.0.git. The whole run silently measured a different busybox,
          # and the compile error it produced (sha1_process_block64_shaNI) was
          # master-only code. In a project whose thesis is hermetic pinned
          # builds, a pin that can quietly drift is worse than no pin.
          BB_TAG=$(echo "$BUSYBOX_VER" | tr . _)     # 1.36.1 -> 1_36_1
          F="$GITHUB_WORKSPACE/tools/fetch-pinned.sh"
          chmod +x "$F"
          bash "$F" bb "dl/busybox-$BUSYBOX_VER.tar.bz2" "$BUSYBOX_SHA256" \
            "https://busybox.net/downloads/busybox-$BUSYBOX_VER.tar.bz2" \
            "https://git.busybox.net/busybox
             https://github.com/mirror/busybox" \
            "$BB_TAG" || { echo "  busybox unavailable"; exit 1; }
          [ -f bb/Makefile ] || { echo "  could not obtain busybox source"; exit 1; }

          # ASSERT THE PIN. Every fetch path above can succeed with the wrong
          # thing; only this catches it.
          BB_GOT=$(awk -F'= *' '/^VERSION =/{V=$2} /^PATCHLEVEL =/{P=$2} /^SUBLEVEL =/{S=$2}
                                END{gsub(/ /,"",V);gsub(/ /,"",P);gsub(/ /,"",S);print V"."P"."S}' bb/Makefile)
          echo "  busybox version: $BB_GOT (pinned: $BUSYBOX_VER)"
          [ "$BB_GOT" = "$BUSYBOX_VER" ] || {
            echo "  PIN VIOLATION: got $BB_GOT, expected $BUSYBOX_VER"; exit 1; }
          cd bb
          set +e
          make defconfig > /dev/null 2>&1
          # static, and point at musl rather than glibc
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/^CONFIG_STATIC=.*/CONFIG_STATIC=y/' .config
          # tcc chokes on a few hardening flags busybox enables by default
          # Was: an s/// with backslash-escaped slashes, which sed rejected with
          # "unknown option to `s'" -- so this flag was never actually set.
          # -D__GNUC__=4 -D__GNUC_MINOR__=0 IS THE FIX FOR "invalid array size".
          # busybox's include/platform.h does:
          #     #if !__GNUC_PREREQ(2,7)
          #     #  define __attribute__(x)      <-- ALL attributes become no-ops
          #     #endif
          # tcc does not define __GNUC__, so __GNUC_PREREQ is always 0 and every
          # attribute in busybox is silently discarded -- including __packed__.
          # The PACKED structs then get natural alignment, their sizes change,
          # and busybox's own compile-time size assertions fail as
          # "invalid array size" (tcc's wording for a negative array bound).
          # The __restrict redefinition warnings came from the guard above it.
          #
          # 4.0 EXACTLY, not higher: __GNUC_PREREQ(4,1) enables
          #     _Pragma("GCC visibility push(hidden)")
          # which tcc cannot parse ("identifier expected"), and which the
          # libiproute headers do use. 4.0 clears every gate tcc satisfies
          # (attributes, __restrict, always_inline) and none that it does not.
          # Verified by preprocessing platform.h at 4.1 and 4.0 and checking
          # which constructs come out.
          sed -i "s|^CONFIG_EXTRA_CFLAGS=.*|CONFIG_EXTRA_CFLAGS=\"-D__GNUC__=4 -D__GNUC_MINOR__=0\"|" .config
          # DISABLE tc. Not a tcc limitation -- verified: GCC fails on the same
          # file with the same error. TCA_CBQ_MAX and TCA_CBQ_RATE were removed
          # from the Linux uapi headers when the CBQ qdisc was dropped, and
          # busybox 1.36.1 predates that, so networking/tc.c references enum
          # members the runner's kernel headers no longer define. It is a
          # busybox-vs-kernel-headers version mismatch and belongs in the
          # ledger as a CONFIG CHOICE, not as a compiler capability gap.
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config

          # BUSYBOX ASSUMES A DEAD-CODE-ELIMINATING COMPILER. tcc is not one.
          #
          # busybox deliberately writes runtime `if` on a compile-time constant
          # rather than #if, and lets the optimizer drop the branch:
          #
          #     #if ENABLE_FEATURE_CLEAN_UP
          #     static void delete_eth_table(...) { ... }
          #     #else
          #     void delete_eth_table(...);        <- declared, NEVER defined
          #     #endif
          #     ...
          #     if (ENABLE_FEATURE_CLEAN_UP)      <- constant 0
          #             delete_eth_table(ch);     <- gcc deletes this call
          #
          # gcc folds the branch away so the call never reaches the linker. tcc
          # does no such optimisation, so the reference survives and the link
          # fails on a function that genuinely does not exist. Same idiom
          # produced 'sun_write_table' (STATIC_SUN becomes `extern` when
          # FEATURE_SUN_LABEL is off) and 'run_nofork_applet'.
          #
          # Enabling the three features makes the functions real, so nothing
          # depends on the optimiser. That is the honest fix: this is a genuine
          # capability difference, and it belongs in the ledger as one rather
          # than being worked around by disabling the applets that expose it.
          for c in FEATURE_CLEAN_UP FEATURE_SUN_LABEL FEATURE_PREFER_APPLETS; do
            sed -i "s/^# CONFIG_$c is not set/CONFIG_$c=y/" .config
          done
          yes '' | make oldconfig > /dev/null 2>&1
          echo "  tc applet: $(grep -c '^# CONFIG_TC is not set' .config) (1 = disabled)"
          for c in FEATURE_CLEAN_UP FEATURE_SUN_LABEL FEATURE_PREFER_APPLETS; do
            echo "  CONFIG_$c: $(grep -E "^(# )?CONFIG_$c[= ]" .config | head -1)"
          done

          # crt duplication diagnostic. Run 22 failed with '_start', '_start_c',
          # '_init' and '_fini' each "defined twice" -- all four are crt
          # symbols and busybox defines none of them, so something is supplying
          # them twice. These three lines say which.
          echo "  --- crt objects the shim injects ---"
          for o in crt1.o crti.o crtn.o; do
            echo "    $o: $(nm -g --defined-only "$MR/lib/$o" 2>/dev/null | awk '{print $3}' | tr '\n' ' ')"
          done
          # NAME the member rather than count it. Run 23 reported "1" here while
          # also reporting _start/_start_c/_init/_fini "defined twice"; those
          # errors vanished once the undefined-symbol errors were fixed, which
          # points at a cascade (tcc_error_noabort keeps going with a partly
          # populated symbol table) rather than a real second definition. If it
          # ever returns, this line says whether libc.a is the second source.
          echo "    libc.a crt-like members: $(ar t "$MR/lib/libc.a" 2>/dev/null | grep -E 'crt' | tr '\n' ' ')"
          # CC is a SHIM, not tcc directly: kbuild passes -Wp,-MD,<depfile>,
          # which tcc splits on commas so <depfile> becomes a second input file
          # ("cannot specify output file with -c many files"). The shim
          # translates it to tcc's own -MD -MF spelling. See the script header.
          CCW="$GITHUB_WORKSPACE/spikes/stage4/probes/tcc-cc-wrapper.sh"
          chmod +x "$CCW"
          # MUSLROOT makes the shim behave as musl-gcc would: -nostdinc and
          # musl's headers on every compile, and -nostdlib + musl's crt objects
          # + -L<muslroot>/lib -lc on every link. Without it busybox's own link
          # line (which has no -L and no -nostdlib) silently resolved -lm,
          # -lresolv and the implicit -lc against the SYSTEM glibc -- musl
          # headers over gcc-built glibc libraries.
          export MUSLROOT="$MR"
          export TCC_SHIM_DEBUG=1     # link invocations only; see the shim
          # -k, like the musl step: without it make stops at the first error and
          # a run reports 2 failures when there may be twenty. The point of this
          # step is the failure INVENTORY, not the first casualty.
          timeout 2400 make -k -j"$(nproc)" \
            CC="$CCW" \
            HOSTCC=gcc \
            SKIP_STRIP=y > build.log 2>&1
          echo "  make rc=$?"
          tail -25 build.log | sed 's/^/    /'
          echo "  --- error classes ---"
          grep -oE 'error: [^,;]*' build.log | sed 's/[0-9]\+/N/g' \
            | sort | uniq -c | sort -rn | head -20 | sed 's/^/    /'
          echo
          # A CLASS IS NOT A LOCATION. Run 2 reported "2 error: invalid array
          # size" and nothing else, which is unactionable: tcc raises that only
          # for a NEGATIVE constant array size, i.e. a BUILD_BUG_ON-style
          # compile-time assertion that is actually FAILING. Which assertion is
          # the whole question, so print the file, the line, and the source.
          echo "  --- every error, with its location ---"
          grep -oE '^[^ :]+:[0-9]+: error: .*' build.log | sort -u | head -20 | sed 's/^/    /'
          echo
          echo "  --- the offending source lines ---"
          grep -oE '^[^ :]+:[0-9]+: error:' build.log | sort -u | head -10 | while IFS= read -r loc; do
            f=${loc%%:*}; rest=${loc#*:}; ln=${rest%%:*}
            [ -f "$f" ] || continue
            echo "    == $f:$ln =="
            start=$(( ln > 4 ? ln - 4 : 1 ))
            sed -n "${start},$((ln + 1))p" "$f" | sed "s/^/        /"
          done
          if ! [ -x busybox ]; then
            # Re-run the target that ACTUALLY failed, not a hardcoded one:
            # applets/applets.o was the run-1 failure and now succeeds, so the
            # V=1 retry was showing a passing build.
            TGT=$(grep -oE '\*\*\* \[[^]:]+:[0-9]+: [^]]+\] Error' build.log \
                   | sed 's/.*: //; s/\] Error//' | grep -v '^$' | head -1)
            echo "  --- first failing target: ${TGT:-<none parsed>} ---"
            if [ -n "$TGT" ]; then
              timeout 300 make V=1 CC="$CCW" HOSTCC=gcc SKIP_STRIP=y \
                "$TGT" 2>&1 | tail -20 | sed 's/^/    /'
            fi
          fi
          if [ -x busybox ]; then
            echo "  BUILT busybox: $(wc -c < busybox) bytes"
            echo "  --- is it really musl, not the system libc? ---"
            if command -v readelf >/dev/null 2>&1; then
              readelf -p .comment busybox 2>/dev/null | head -5 | sed 's/^/    /' || true
            fi
            strings busybox 2>/dev/null | grep -im2 "musl\|GCC:" | sed 's/^/    /' || true
            file busybox | sed 's/^/    /'
            ./busybox | head -3 | sed 's/^/    /'
            echo "    applets: $(./busybox --list 2>/dev/null | wc -l)"
          fi
          set -e

      - name: '4. THE CLAIM: boot it as PID 1 under a GCC-built kernel'
        continue-on-error: true
        run: |
          set -u
          BB="$PWD/bb/busybox"
          [ -x "$BB" ] || { echo "  no busybox -- cannot boot"; exit 0; }

          # The kernel here is Ubuntu's, built by GCC. That is the POINT: the
          # syscall ABI is the contract, so a tcc-built userland runs on it
          # unmodified. Nothing about the kernel needs to come from our chain
          # for this half of the Linux leg to be proven.
          KERNEL=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          if [ -z "$KERNEL" ]; then
            sudo apt-get install -y --no-install-recommends linux-image-generic >/dev/null 2>&1
            KERNEL=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          fi
          [ -n "$KERNEL" ] || { echo "  no kernel image available"; exit 0; }
          echo "  kernel: $KERNEL"

          # /boot/vmlinuz-* is mode 0600 root-only on Azure images, so the
          # runner user cannot read it: "regular file, no read permission".
          # Copy it out with sudo rather than running qemu as root.
          sudo cp "$KERNEL" kernel.img && sudo chmod a+r kernel.img
          file kernel.img | sed 's/^/    /'

          # Ubuntu ships the arm64 kernel gzip-compressed. qemu can load that,
          # but decompressing removes a variable from a step that is already
          # the least deterministic in the job.
          if file kernel.img | grep -qi gzip; then
            gunzip -c kernel.img > Image 2>/dev/null || zcat kernel.img > Image
            KIMG=Image
            echo "    decompressed: $(wc -c < Image) bytes"
          else
            KIMG=kernel.img
          fi

          rm -rf initramfs && mkdir -p initramfs/bin initramfs/proc initramfs/sys
          cp "$BB" initramfs/bin/busybox
          ( cd initramfs && ./bin/busybox --install -s bin 2>/dev/null || true )
          cp "$GITHUB_WORKSPACE/spikes/stage4/probes/init.sh" initramfs/init
          chmod +x initramfs/init initramfs/bin/busybox
          ( cd initramfs && find . | cpio -o -H newc 2>/dev/null | gzip > ../initramfs.cpio.gz )
          echo "  initramfs: $(wc -c < initramfs.cpio.gz) bytes"

          set +e
          # -nic none: without it qemu wants the virtio network option ROM
          # ("failed to find romfile efi-virtio.rom", shipped in ipxe-qemu) and
          # refuses to start. An initramfs that mounts /proc and prints a marker
          # has no use for a NIC.
          qemu-system-aarch64 --version | head -1 | sed 's/^/  /'

          # CPU MODEL LADDER. `-cpu max` turns on every optional ARM feature
          # this qemu knows about, and Linux 6.17 is new enough to use ones it
          # mishandles -- run 26 aborted inside qemu itself:
          #
          #   ERROR:target/arm/internals.h:767:regime_is_user:
          #   code should not be reached
          #
          # That is a qemu assertion, not a kernel or userland fault. cortex-a72
          # is plain ARMv8.0 and the most heavily exercised model for `virt`
          # boots, so it is tried first; the others follow only if it fails.
          booted=no
          for cpu in cortex-a72 neoverse-n1 max; do
            echo "  --- trying -cpu $cpu ---"
            timeout 180 qemu-system-aarch64 \
              -machine virt -cpu "$cpu" -m 512 -nographic -no-reboot -nic none \
              -kernel "$KIMG" -initrd initramfs.cpio.gz \
              -append "console=ttyAMA0 rdinit=/init panic=1" \
              > boot.log 2>&1
            rc=$?
            echo "    qemu rc=$rc"
            if grep -q 'VERON BOOT OK' boot.log; then booted=yes; break; fi
            echo "    --- tail ---"
            tail -12 boot.log | sed 's/^/      /'
          done
          echo
          echo "  --- boot log tail ---"
          tail -40 boot.log | sed 's/^/    /'
          echo
          if grep -q 'VERON BOOT OK' boot.log; then
            echo "  PASS: a tcc-built userland booted as PID 1 on a gcc-built"
            echo "        arm64 kernel. The userland half of the Linux leg is done."
          else
            echo "  did not reach the marker -- see the log above"
          fi
          set -e

      - name: VERDICT
        run: |
          echo "  tcc variant           : $VARIANT"
          echo "  musl built by tcc     : $( [ -f muslroot/lib/libc.a ] && echo yes || echo NO )"
          echo "  busybox built by tcc  : $( [ -x bb/busybox ] && echo yes || echo NO )"
          echo "  booted as PID 1       : $( grep -q 'VERON BOOT OK' boot.log 2>/dev/null && echo yes || echo NO )"
          echo
          echo "  This spike deliberately does NOT attempt to build a kernel with"
          echo "  tcc. Research says a modern arm64 kernel needs asm goto WITH"
          echo "  OUTPUTS (for get_user()), jump labels and linker scripts, none of"
          echo "  which tcc has. Splitting the Linux leg at the syscall ABI lets us"
          echo "  bank the half that is actually reachable today."
