name: tcc-userland-arm64

# SPIKE. CAN OUR tcc PRODUCE A REAL, BOOTABLE arm64 USERLAND?
#
# THE INSIGHT THIS RESTS ON. The kernel and the userland are INDEPENDENT
# artifacts. Linux's syscall ABI is the contract and it is deliberately stable,
# so a GCC-built kernel neither knows nor cares which compiler produced the
# static binaries issuing svc #0 against it. A tcc-built musl+busybox userland
# on a GCC-built modern arm64 kernel is ordinary, not a compatibility hack.
#
# WHY THAT MATTERS. Research (see spikes/stage3/ROADMAP.md) says a MODERN Linux
# kernel is out of tcc's reach: asm goto with outputs (arm64 get_user() needs
# it), jump labels, linker scripts, and an arm64 inline assembler that only
# became partially functional in a Feb 2026 tcc patch. But that is the KERNEL
# half. The USERLAND half -- a static init and shell -- needs only ordinary C
# plus a libc, which is squarely in tcc's range.
#
# So this spike proves the half we can have, and does it end to end:
#   1. tcc (mob) builds musl
#   2. tcc + musl build busybox, statically
#   3. the result RUNS natively on aarch64
#   4. it boots as PID 1 under a GCC-built kernel in qemu-system-aarch64
#
# Step 4 is the real claim. Everything before it is plumbing.
#
# NATIVE aarch64 THROUGHOUT -- ubuntu-24.04-arm, no cross-compiling, no x86.
#
# KNOWN RISK, stated up front so a failure is read correctly: musl ships .s/.S
# sources for aarch64, so this exercises tcc's arm64 INTEGRATED ASSEMBLER --
# historically a stub that errored "ARM asm not implemented", with a partial
# implementation only submitted Feb 2026 and described as "enough to compile
# musl 1.2.5". If musl fails on an .s file, that is the assembler, not the
# codegen, and the fix is upstream tcc rather than anything of ours.
#
# THAT Feb-2026 SERIES IS NOW VENDORED at spikes/stage3/patches/tcc-arm64-asm/
# and applied below if mob does not already carry it. Its author's claim --
# "enough to compile musl 1.2.5" -- is exactly this spike's step 1, so a musl
# failure now measures the gap between that claim and reality rather than the
# distance to a stub. See that directory's README for provenance, the unwrap
# the mailing-list archive made necessary, and the error strings to grep for.

on:
  push:
    paths:
      - '.github/workflows/tcc-userland-arm64.yml'
  workflow_dispatch:

concurrency:
  group: tcc-userland-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  MUSL_VER: '1.2.5'
  BUSYBOX_VER: '1.36.1'

jobs:
  userland:
    runs-on: ubuntu-24.04-arm          # NATIVE aarch64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Confirm native aarch64
        run: |
          echo "  uname -m : $(uname -m)"
          echo "  gcc      : $(gcc -dumpmachine)"
          [ "$(uname -m)" = aarch64 ] || { echo "NOT aarch64"; exit 1; }

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl gcc make bzip2 xz-utils cpio file \
            qemu-system-arm qemu-utils

      - name: 'Build tcc (mob) natively, with the arm64 assembler patched in'
        run: |
          set -eu
          git clone -q git://repo.or.cz/tinycc.git tccsrc \
            || git clone -q https://repo.or.cz/tinycc.git tccsrc \
            || git clone -q https://github.com/TinyCC/tinycc.git tccsrc
          echo "  mob HEAD: $(git -C tccsrc rev-parse HEAD)"
          echo "  date    : $(git -C tccsrc log -1 --format=%ci)"

          # THE DECISIVE CHECK. arm64-tok.h is CREATED by the Feb-2026 assembler
          # series, so its presence is what says whether mob already carries it.
          # Do NOT test for arm64-asm.c: that file exists in mob either way, and
          # unpatched it is titled "ARM64 dummy assembler for TCC" with an
          # asm_opcode that is one tcc_error("ARM asm not implemented.").
          # tcc-aarch64-probe tests for the file and so reported "inline asm on
          # arm64: yes" against a tree with no assembler in it at all.
          P="$GITHUB_WORKSPACE/spikes/stage3/patches/tcc-arm64-asm"
          if [ -f tccsrc/arm64-tok.h ]; then
            echo "  arm64-tok.h PRESENT -- the series is already upstream; not patching"
            echo "TCC_ASM=upstream" >> "$GITHUB_ENV"
          else
            echo "  arm64-tok.h ABSENT -- mob ships the dummy; applying the series"
            head -5 tccsrc/arm64-asm.c | sed 's/^/    /'
            # Order matters: 0003 carries 0002's subst_asm_operand signature as
            # CONTEXT, so it cannot apply to a tree without 0002.
            for p in "$P"/000*.patch; do
              echo "    applying $(basename "$p")"
              git -C tccsrc apply --3way "$p" || git -C tccsrc apply "$p" || {
                echo "  PATCH FAILED. Refusing to build an unpatched tcc -- a musl"
                echo "  failure from a dummy assembler would be unreadable."
                exit 1; }
            done
            echo "TCC_ASM=patched" >> "$GITHUB_ENV"
          fi
          [ -f tccsrc/arm64-tok.h ] || { echo "  no arm64-tok.h after patching"; exit 1; }

          cd tccsrc && ./configure --cc=gcc >/dev/null && make -j"$(nproc)" >/dev/null
          ./tcc -v
          echo "TCC=$PWD/tcc"  >> "$GITHUB_ENV"
          echo "TCCDIR=$PWD"   >> "$GITHUB_ENV"

      - name: 'GATE: the integrated arm64 assembler is real'
        run: |
          set -eu
          cd tccsrc
          echo "  assembler source: $TCC_ASM"
          # Cheap and decisive: if these fail, musl will fail 25 minutes from now
          # for the same reason, so fail here instead.
          cat > /tmp/probe.s <<'ASMEOF'
          .text
          .globl probe
          probe:
              mov  x0, #7
              bic  x1, x0, #1
              orr  x2, x1, x0
              cbz  x2, 1f
              tbz  x0, #0, 1f
          1:  ret
          ASMEOF
          ./tcc -B. -c /tmp/probe.s -o /tmp/probe.o \
            && echo "  .s file assembles     : yes (incl. bic, cbz, tbz)" \
            || { echo "  .s file assembles     : NO"; exit 1; }
          ./tcc -B. -run "$GITHUB_WORKSPACE/spikes/stage3/probes/kern.c" \
            && echo "  inline asm from C     : yes (kern.c exit=0)" \
            || { echo "  inline asm from C     : NO (kern.c exit=$?)"; exit 1; }
          rc=0; ./tcc -B. -run "$GITHUB_WORKSPACE/spikes/stage3/probes/feat.c" || rc=$?
          echo "  C feature probe       : feat.c exit=$rc (expect 6)"

      - name: '1. tcc builds musl'
        continue-on-error: true
        run: |
          set -u
          # Run 2 died on curl(35) from musl.libc.org -- transient, not a build
          # problem. Retry, then fall back to git mirrors at the matching tag.
          mkdir -p musl
          got=no
          for u in "https://musl.libc.org/releases/musl-$MUSL_VER.tar.gz" \
                   "https://ftp.barfooze.de/pub/sabotage/tarballs/musl-$MUSL_VER.tar.gz"; do
            echo "  trying $u"
            if curl -fsSL --retry 4 --retry-delay 3 --retry-connrefused \
                 --connect-timeout 20 -o musl.tar.gz "$u"; then
              tar xf musl.tar.gz -C musl --strip-components=1 && got=yes && break
            fi
          done
          if [ "$got" = no ]; then
            echo "  tarballs unreachable -- cloning the git mirror at v$MUSL_VER"
            rm -rf musl
            git clone -q --depth 1 --branch "v$MUSL_VER" \
              https://git.musl-libc.org/git/musl musl \
              || git clone -q --depth 1 --branch "v$MUSL_VER" \
                   https://github.com/bminor/musl musl
          fi
          [ -f musl/configure ] || { echo "  could not obtain musl source"; exit 1; }
          echo "  musl source: $(du -sh musl | cut -f1)"
          cd musl
          set +e
          ./configure CC="$TCC -B$TCCDIR" --disable-shared \
            --prefix="$PWD/../muslroot" > conf.log 2>&1
          echo "  configure rc=$?"; tail -8 conf.log | sed 's/^/    /'
          # PASS 1: -k so it does NOT stop at the first missing instruction.
          # Run 1 died on ONE opcode (bic) and told us nothing about the rest;
          # the complete list is what sizes the work.
          timeout 1800 make -k -j"$(nproc)" > build.log 2>&1
          echo "  make -k rc=$?"
          echo
          # THE PATTERN MATTERS. The old grep looked for "instruction 'X' not
          # implemented", a string NEITHER tcc emits -- which is why run 1
          # reported a single opcode instead of a list. The patched assembler
          # says "unrecognized opcode X" / "unrecognized unary opcode X" /
          # "unrecognized nullaryopcode X"; an unpatched mob says "ARM asm not
          # implemented." and names nothing at all.
          RX="unrecognized (nullaryopcode|unary opcode|opcode) [^ ,]+"
          echo "  === EVERY arm64 mnemonic the assembler does not know ==="
          grep -oE "$RX" build.log | awk '{print $NF}' | sort -u | sed 's/^/    /'
          echo "    distinct unknown mnemonics: $(grep -oE "$RX" build.log | awk '{print $NF}' | sort -u | wc -l)"
          if grep -q 'ARM asm not implemented' build.log; then
            echo "    *** UNPATCHED assembler -- the gate step should have caught this"
          fi
          echo
          echo "  === partial-implementation misses (mnemonic known, form not) ==="
          grep -oE "(unsupported extend/shift specifier|unexpected operand|immediate [-0-9]+ out of range|immediate out of range|invalid bitmask[^,]*|shift amount out of range|bitmask too large[^,]*)" build.log \
            | sed 's/[0-9a-f]\{4,\}/N/g' | sort | uniq -c | sort -rn | head -15 | sed 's/^/    /'
          echo
          echo "  === which .s files failed, and do C fallbacks exist? ==="
          for f in $(grep -oE '^src/[^:]+\.s' build.log | sort -u); do
            base=$(basename "$f" .s); dir=$(dirname "$(dirname "$f")")
            alt="$dir/$base.c"
            printf '    %-34s C fallback %s\n' "$f" \
              "$( [ -f "$alt" ] && echo "YES ($alt)" || echo no )"
          done
          echo
          echo "  === other (non-assembler) error classes ==="
          grep -oE 'error: [^,;]*' build.log | grep -v 'not implemented' \
            | sed 's/[0-9]\+/N/g' | sort | uniq -c | sort -rn | head -15 | sed 's/^/    /'
          echo
          echo "  objects built despite -k: $(find obj -name '*.o' 2>/dev/null | wc -l)"

          # PASS 2: musl ships portable C fallbacks for several arch files.
          # Drop the .s sources that tcc cannot assemble and let the generic C
          # versions be used -- a legitimate substitution, and one we NAME.
          echo
          echo "  === PASS 2: drop unassemblable .s, use musl's own C fallbacks ==="
          dropped=0
          for f in $(grep -oE '^src/[^:]+\.s' build.log | sort -u); do
            base=$(basename "$f" .s); dir=$(dirname "$(dirname "$f")")
            if [ -f "$dir/$base.c" ]; then
              rm -f "$f"; dropped=$((dropped+1)); echo "    dropped $f"
            fi
          done
          echo "    dropped $dropped file(s)"
          if [ "$dropped" -gt 0 ]; then
            timeout 1800 make -j"$(nproc)" > build2.log 2>&1
            echo "    rebuild rc=$?"
            tail -12 build2.log | sed 's/^/      /'
            grep -oE "$RX" build2.log | awk '{print $NF}' | sort -u | sed 's/^/      still missing: /'
          fi
          make install > /dev/null 2>&1
          echo "  installed: $(ls ../muslroot/lib 2>/dev/null | tr '\n' ' ')"
          set -e

      - name: '2. Does the tcc-built musl actually work?'
        continue-on-error: true
        run: |
          set -u
          MR="$PWD/muslroot"
          [ -f "$MR/lib/libc.a" ] || { echo "  no libc.a -- musl did not build"; exit 0; }
          printf '#include <stdio.h>\n#include <string.h>\n#include <stdlib.h>\nint main(void){char*p=malloc(32);strcpy(p,"musl works");printf("%%s\\n",p);free(p);return 7;}\n' > t.c
          set +e
          "$MR/bin/musl-gcc" -static -o t t.c 2>&1 | sed 's/^/    /' \
            || "$TCC" -B"$TCCDIR" -static -I"$MR/include" -L"$MR/lib" -o t t.c 2>&1 | sed 's/^/    /'
          file t | sed 's/^/    /'
          ./t; echo "    exit=$? (expect 7)"
          set -e

      - name: '3. tcc + musl build busybox, static'
        continue-on-error: true
        run: |
          set -u
          MR="$PWD/muslroot"
          mkdir -p bb
          got=no
          for u in "https://busybox.net/downloads/busybox-$BUSYBOX_VER.tar.bz2" \
                   "https://mirrors.kernel.org/gentoo/distfiles/busybox-$BUSYBOX_VER.tar.bz2"; do
            echo "  trying $u"
            if curl -fsSL --retry 4 --retry-delay 3 --retry-connrefused \
                 --connect-timeout 20 -o bb.tar.bz2 "$u"; then
              tar xf bb.tar.bz2 -C bb --strip-components=1 && got=yes && break
            fi
          done
          if [ "$got" = no ]; then
            echo "  tarballs unreachable -- cloning the git mirror"
            rm -rf bb
            git clone -q --depth 1 --branch "${BUSYBOX_VER}" \
              https://git.busybox.net/busybox bb \
              || git clone -q --depth 1 https://github.com/mirror/busybox bb
          fi
          [ -f bb/Makefile ] || { echo "  could not obtain busybox source"; exit 1; }
          cd bb
          set +e
          make defconfig > /dev/null 2>&1
          # static, and point at musl rather than glibc
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/^CONFIG_STATIC=.*/CONFIG_STATIC=y/' .config
          # tcc chokes on a few hardening flags busybox enables by default
          sed -i 's/^CONFIG_EXTRA_CFLAGS=.*/CONFIG_EXTRA_CFLAGS="-I..\\/muslroot\\/include"/' .config
          yes '' | make oldconfig > /dev/null 2>&1
          timeout 2400 make -j"$(nproc)" \
            CC="$TCC -B$TCCDIR" \
            HOSTCC=gcc \
            SKIP_STRIP=y > build.log 2>&1
          echo "  make rc=$?"
          tail -25 build.log | sed 's/^/    /'
          echo "  --- error classes ---"
          grep -oE 'error: [^,;]*' build.log | sed 's/[0-9]\+/N/g' \
            | sort | uniq -c | sort -rn | head -20 | sed 's/^/    /'
          if [ -x busybox ]; then
            echo "  BUILT busybox: $(wc -c < busybox) bytes"
            file busybox | sed 's/^/    /'
            ./busybox | head -3 | sed 's/^/    /'
            echo "    applets: $(./busybox --list 2>/dev/null | wc -l)"
          fi
          set -e

      - name: '4. THE CLAIM: boot it as PID 1 under a GCC-built kernel'
        continue-on-error: true
        run: |
          set -u
          BB="$PWD/bb/busybox"
          [ -x "$BB" ] || { echo "  no busybox -- cannot boot"; exit 0; }

          # The kernel here is Ubuntu's, built by GCC. That is the POINT: the
          # syscall ABI is the contract, so a tcc-built userland runs on it
          # unmodified. Nothing about the kernel needs to come from our chain
          # for this half of the Linux leg to be proven.
          KERNEL=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          if [ -z "$KERNEL" ]; then
            sudo apt-get install -y --no-install-recommends linux-image-generic >/dev/null 2>&1
            KERNEL=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          fi
          [ -n "$KERNEL" ] || { echo "  no kernel image available"; exit 0; }
          echo "  kernel: $KERNEL"
          file "$KERNEL" | sed 's/^/    /'

          rm -rf initramfs && mkdir -p initramfs/bin initramfs/proc initramfs/sys
          cp "$BB" initramfs/bin/busybox
          ( cd initramfs && ./bin/busybox --install -s bin 2>/dev/null || true )
          cp "$GITHUB_WORKSPACE/spikes/stage3/probes/init.sh" initramfs/init
          chmod +x initramfs/init initramfs/bin/busybox
          ( cd initramfs && find . | cpio -o -H newc 2>/dev/null | gzip > ../initramfs.cpio.gz )
          echo "  initramfs: $(wc -c < initramfs.cpio.gz) bytes"

          set +e
          timeout 180 qemu-system-aarch64 \
            -machine virt -cpu max -m 512 -nographic -no-reboot \
            -kernel "$KERNEL" -initrd initramfs.cpio.gz \
            -append "console=ttyAMA0 rdinit=/init panic=1" \
            > boot.log 2>&1
          echo "  qemu rc=$?"
          echo "  --- boot log tail ---"
          tail -40 boot.log | sed 's/^/    /'
          echo
          if grep -q 'VERON BOOT OK' boot.log; then
            echo "  PASS: a tcc-built userland booted as PID 1 on a gcc-built"
            echo "        arm64 kernel. The userland half of the Linux leg is done."
          else
            echo "  did not reach the marker -- see the log above"
          fi
          set -e

      - name: VERDICT
        run: |
          echo "  arm64 assembler       : $TCC_ASM"
          echo "  musl built by tcc     : $( [ -f muslroot/lib/libc.a ] && echo yes || echo NO )"
          echo "  busybox built by tcc  : $( [ -x bb/busybox ] && echo yes || echo NO )"
          echo "  booted as PID 1       : $( grep -q 'VERON BOOT OK' boot.log 2>/dev/null && echo yes || echo NO )"
          echo
          echo "  This spike deliberately does NOT attempt to build a kernel with"
          echo "  tcc. Research says a modern arm64 kernel needs asm goto WITH"
          echo "  OUTPUTS (for get_user()), jump labels and linker scripts, none of"
          echo "  which tcc has. Splitting the Linux leg at the syscall ABI lets us"
          echo "  bank the half that is actually reachable today."
