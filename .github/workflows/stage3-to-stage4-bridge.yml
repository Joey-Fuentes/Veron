# THE BRIDGE. Stage 3's tcc, carried up to the rung stage 4 starts from.
#
# WHAT THIS IS FOR. Stage 3 ends at mc-tcc. Stage 4 begins at a tcc and reaches
# a booting Linux. Both work. What has never been demonstrated is that they are
# the SAME CHAIN -- because stage 4's tcc is built by host gcc
# (`./configure --cc=gcc`, stage4-complete.yml:191) and stage 4's box binds the
# whole of host /usr read-only (`chain/box.sh:85`). This job runs the join: the
# seed's own tcc, in a box with no host compiler, no host binutils and no host
# libc, climbing until it reaches gcc 4.7.4 -- which is exactly where stage 4's
# rung 1 already is. The OVERLAP is the deliverable. Once this reaches 4.7.4
# the two jobs describe one continuous ladder and can be merged.
#
# It deliberately stops there. Everything above 4.7.4 -- gcc 10, gcc 15, the
# kernel, the boot -- is already proven by stage4-complete and re-proving it
# here would only lengthen the failure surface.
#
# ---------------------------------------------------------------------------
# WHAT "HERMETIC" MEANS HERE, AND WHERE IT IS STRICTER THAN STAGE 4
#
# stage4-complete's own accounting (spikes/stage3/WHAT-STAGE-4-NEEDS.md §1):
#
#     the guarantee stage 4 currently makes is "no host compiler",
#     not "no host dependencies".
#
# It binds /usr, so every `#include <stdio.h>` resolves against host glibc
# headers, every link pulls crt1.o and libc from /usr/lib, and `as`, `ld`, `ar`
# and `ranlib` are host binutils -- `binutils` is in `chain/env0.sh`'s BORROWED
# list. This box binds none of that. It is stage 3's box: a hand-assembled root
# with busybox, the shared objects busybox itself needs to execute, and nothing
# else. No /usr/include exists in it at all.
#
# THAT IS WHY THERE IS A LIBC RUNG. Removing host /usr removes the libc that
# binutils and gcc link their own binaries against, so one has to be built
# first, and it has to be built by the only compiler in the box. glibc cannot
# be: it requires GCC specifically -- IFUNC resolvers, symbol versioning,
# __builtin_*, GCC-only asm constraints -- which is why hermetic-gcc47.yml
# builds a gcc cross-toolchain FIRST and cross-compiles glibc with that, and
# why every glibc pin in sources/lfs.toml is paired with a gcc version. musl is
# here because it is the libc a tcc can build, not because it is the flavour.
# It leaves the chain the moment gcc 4.7.4 exists; ARCHITECTURE.md §6 forks at
# libc and glibc/GNU is instantiated above this rung, not below it.
#
# ---------------------------------------------------------------------------
# THE TWO TIERS, AND WHY binutils IS NOT IN EITHER
#
# Stage 3's split is kept exactly:
#
#   TIER 1  BUDGET_PATH    touches artifact bytes.  MUST STAY EMPTY.
#   TIER 2  BUDGET_DRIVER  drives the build, touches no artifact byte.
#
# `as`, `ld`, `ar`, `ranlib` and any compiler are tier 1 by definition -- they
# decide what ends up in the output -- so binutils CANNOT be borrowed. It is
# built, by mc-tcc, at rung 4. The SEAL step enumerates every executable in the
# box and fails the run if anything not declared here appears, which is what
# stops binutils reappearing by accident through a configure script that finds
# it on PATH.
#
# TIER 2 IS ONE BINARY -- busybox -- exactly as stage 3 declares it. make is
# not borrowed either, and that costs an ordering decision rather than a line
# in a budget.
#
# THE CIRCULARITY, AND HOW live-bootstrap BREAKS IT. make is an ordinary C
# program, so it needs a libc; musl's own build is driven by make. Neither can
# go first. live-bootstrap's answer is that the early rungs are not driven by
# make at all -- `kaem` reads a flat list of literal commands with no Makefile,
# no variables and no dependency graph, and it is one of the mescc-tools
# binaries this repo already vendors at the pin stage 3 uses
# (spikes/reference/mescc-tools/Kaem; mes-rung.yml drives the whole mes build
# with it). Only once a libc exists does live-bootstrap build GNU make, after
# which ordinary autoconf builds work.
#
# Rung 2 does the same thing in shell rather than in kaem, because busybox sh
# is already declared and kaem would have to be built first to save nothing.
# musl's build is a compile of every .c in the tree, an `ar`, three crt files
# and two generated headers -- small enough to spell out, which is precisely
# why it can be the rung that comes before make.
#
# ---------------------------------------------------------------------------
# WHY THE CLIMB IS `uses:` AND NOT COPIED
#
# The stage-3 climb is ~1000 lines of in-box script. Copying it here would
# duplicate it and the copy would drift -- the same failure this repo already
# records for lists kept beside the thing they describe. So the climb job below
# CALLS stage3-hermetic-arm64.yml unmodified and takes mc-tcc from its
# artifact. If the climb changes, this job climbs the new way for free, and
# GATE 1's byte-identity check still runs where it always did.
#
# EVERY RUNG REPORTS, ONLY THE SEAL GATES. This is a measurement job while the
# frontier is moving. A rung that fails prints why and the next one is skipped
# with a reason; the run still ends green. The one hard failure is the SEAL,
# because a host tool leaking in makes every number above it meaningless.

name: stage3-to-stage4-bridge

on:
  workflow_dispatch:
    inputs:
      trace_applets:
        description: 'wrap every applet to record which ones the chain actually uses'
        type: boolean
        required: false
        default: false
  # NOT on push. It is long and it is a measurement, not a gate. The gates are
  # stage3-hermetic-arm64 and stage4-complete; this job exists to show they
  # meet.

# NO concurrency GROUP, DELIBERATELY.
#
# The group used to be "bridge-${{ github.ref }}" -- the same key for every
# run on main -- so a second dispatch queued behind the first instead of
# starting. These rungs now take well over an hour, and the whole value of
# workflow_dispatch here is running several experiments at once: a rung fix and
# a version bump do not interact, and waiting to learn about the second until
# the first finishes doubles every round.
#
# What that group was protecting against does not apply. There is no shared
# state between runs: each gets its own runner, its own box, and its own
# $GITHUB_WORKSPACE, and nothing is uploaded any more. The cache is
# actions/cache, which is already concurrency-safe and keyed on the version
# set. Two runs racing on it produce the same bytes.

env:
  # musl: the bootstrap libc. Pinned in sources/musl.toml with its sha256 and
  # its declared substitutions (9 aarch64 .s files fall back to portable C,
  # src/complex/*.c dropped for _Complex).
  TCC_SHA: 5ec0e6f84b47ebd8c269b581712666313f5edaef
  MUSL_VER: '1.2.5'
  # make is built in-chain because busybox has none and nothing else is
  # borrowed. 3.82 is live-bootstrap's pin; confirm against their manifest
  # before treating this as pinned rather than chosen.
  # make 3.82 is live-bootstrap's first make (step #25, built by kaem under
  # tcc, before binutils exists) and is the version known to build this way.
  # They rebuild it later because 3.82 "randomly segfaults while building the
  # Linux kernel" -- irrelevant here, since this job stops at gcc 4.7.4.
  MAKE_VER: '3.82'
  # A SECOND make, BUILT PROPERLY ONCE binutils EXISTS. 3.82 comes up first
  # from live-bootstrap's kaem command list because nothing else can, and it
  # drives musl and binutils fine -- then took a Bus error building libgcc.
  # live-bootstrap rebuilds it too, "using the build system and GCC, which
  # means that it does not randomly segfault".
  #
  # 4.4, AND THIS IS A RETURN RATHER THAN A NEW GUESS. 4.4 was tried first and
  # failed at lib/fnmatch.c:154 on __P -- glibc's <sys/cdefs.h> macro. That is
  # now supplied by the shim rung 2 installs and force-included by cc-static,
  # so the one thing that blocked it is gone.
  #
  # 4.2.1 was live-bootstrap's pin and it does not survive musl here. Its
  # BUNDLED glob cost five substitutions -- getlogin, getlogin_r, __P, __ptr_t
  # -- and switching to the system glob then hit the real wall:
  #
  #     dir.c:1305: error: field not found: gl_opendir
  #
  # gl_opendir is a glob_t member from GNU's GLOB_ALTDIRFUNC extension. musl's
  # glob is POSIX and has no such field, so make_cv_sys_gnu_glob=yes was
  # asserting something untrue and the bundled glob is not optional for 4.2.1.
  # live-bootstrap does not hit any of this because their pass1.sh runs
  # `autoreconf -fi` first and their libc at that rung is not musl.
  #
  # 4.3 dropped the bundled glob entirely and 4.4 keeps it dropped, using
  # gnulib instead -- which is GNU-complete and is what Alpine builds against
  # musl as a matter of course.
  MAKE_ALT: '4.4'
  # 3.82 AND ONLY 3.82. This is live-bootstrap's version and, more to the
  # point, the version their steps/make-3.82/pass1.kaem command list is written
  # against -- 27 files with per-file -D flags that stand in for a configure
  # that cannot run here. 4.4 was fetched for a while as a second guess at a
  # tar problem that turned out to be the archive format; it has no recipe
  # behind it and is gone.
  # The rest are stage 4's OWN versions, copied deliberately. If they drift
  # apart the overlap stops being an overlap.
  # BINUTILS 2.30, NOT STAGE 4's 2.46, AND THAT DIVERGENCE IS DELIBERATE.
  #
  # Stage 4 does not build binutils at all -- `binutils` is in chain/env0.sh's
  # BORROWED list and comes from the host, so its version was never a tcc
  # question. This job is the first thing in the tree that asks a tcc to
  # COMPILE binutils, and tcc has a known ceiling there.
  #
  # live-bootstrap's first binutils is 2.30 (steps/manifest, step #81), reached
  # only after musl and the whole autotools chain. Its older sysa/ layout used
  # 2.14, chosen because 2.14 "seems to be the limit for tcc". A 2024
  # guix-devel report puts the modern edge lower than our stage-4 pin: "I'm
  # using latest versions of all packages, except Binutils, whose version 2.43
  # does not link the object files from TCC."
  #
  # 2.46 was copied here from stage4-complete on the assumption that matching
  # its versions made the overlap real. It does not: the overlap is at gcc
  # 4.7.4, and binutils below that is an implementation detail each side is
  # free to satisfy its own way -- stage 4 by borrowing, this job by building.
  # Pinning a version no tcc has been shown to compile would have failed rung 4
  # and looked like a compiler defect.
  # QUOTED, BECAUSE YAML READS 2.30 AS A NUMBER. Unquoted it becomes the float
  # 2.3, the trailing zero is gone, and the fetch asks ftp.gnu.org for
  # binutils-2.3.tar.xz and gets a 404. 2.46.0 survived only because two dots
  # make it a string. Every version below is quoted so none of them depends on
  # how many dots it happens to have.
  BINUTILS: '2.30'
  GMP_VER: '6.3.0'
  MPFR_VER: '4.2.2'
  MPC_VER: '1.3.1'
  GCC47: '4.7.4'
  # 4.8.5 IS NOT A RUNG. gcc 4.7.4 HAS NO aarch64 BACKEND -- stage 4 logs
  # "4.7.4 aarch64 mentions in config.gcc (expect 0)" -- so 4.8.5's backend is
  # transplanted into it by spikes/stage4/probes/backport-aarch64.sh, which
  # already exists and which stage 4 already relies on. 4.8.5 is fetched only
  # as the donor tree. 4.8.5 rather than 4.8.0 for the reason that script's
  # header measures: the backend/middle-end interface does not move within the
  # 4.8 series, so 4.8.5 is no further from 4.7 while carrying ~1800 lines of
  # fixes.
  GCC48: '4.8.5'
  # gcc 10 IS BUILT BY g++ 4.7.4, which is the entire reason 4.7 is the entry
  # point: it is the last gcc written in C, so tcc can reach it, and its C++
  # front end is what carries the chain upward. Every gcc after 4.7 is C++ and
  # cannot be built by a C compiler at all. Stage 4's version, so the overlap
  # stays an overlap.
  GCC10: '10.2.0'
  # CHAPTER 5 IS A DIFFERENT TOOLCHAIN. gcc 15 and a modern binutils, cross to
  # LFS_TGT, against a glibc sysroot -- stage 4's versions so the overlap holds.
  # BINUTILS above is 2.30 because tcc has a ceiling; nothing here is built by
  # tcc, so chapter 5 uses 2.46 as stage 4 does.
  GCC15: '15.2.0'
  BINUTILS_LFS: '2.46.0'
  GLIBC: '2.43'
  # EVERY VERSION HERE COMES FROM ONE BOOK, AND THAT IS THE POINT.
  #
  # spikes/stage4/books/LFS-BOOK-r13_0-156-systemd is the development snapshot
  # this chain follows, and it specifies:
  #
  #     Linux 7.1.3   Perl 5.42.2   Glibc 2.43   Binutils 2.46   GCC 15.2.0
  #
  # We had drifted on two of them -- perl 5.42.0 from the STABLE 13.0 book, and
  # kernel 7.1.5 from nowhere in particular. Mixing books is how a pairing
  # nobody tested becomes the thing being debugged: glibc 2.43's
  # upstream_fixes patch exists precisely to reconcile a libc with a kernel it
  # was not shipped against, and stage 4's comment calls it "THE PRICE OF
  # LINUX 7". Taking one book's whole set means that price is the book's
  # problem rather than ours.
  #
  # KHDR AND KERNEL DIVERGE ON PURPOSE, AND THIS IS THE ONE PLACE WE LEAVE THE
  # BOOK DELIBERATELY.
  #
  # The book pairs 7.1.3 with both. We take its headers at 7.1.3 and boot
  # 7.1.5, because stage4-complete already builds and boots exactly that
  # pairing -- glibc 2.43 with the upstream_fixes patch, 7.1.3-era headers,
  # 7.1.5 kernel -- so it is tested rather than hoped for.
  #
  # A KERNEL MAY ALWAYS BE NEWER THAN THE HEADERS ITS LIBC WAS COMPILED
  # AGAINST. That is the normal direction: the kernel's syscall ABI is stable
  # forward, so a libc built against older headers runs on a newer kernel. The
  # reverse is what breaks. Keeping them as two variables makes that a
  # property we state rather than one we get by accident, and it is the shape
  # every later bump will take -- linux-next against a released glibc is the
  # same question with a bigger gap.
  #
  # WHEN IT DOES BREAK, IT LOOKS LIKE THIS: glibc's build stops with
  # "redefined [-Werror]" on a type both the kernel headers and the libc
  # declare. Rung 13 greps for exactly that and says so, because the message
  # names a symbol rather than the pairing that caused it. stage 4's own
  # fallback is to drop the headers back to the version the book pairs with
  # this glibc -- i.e. set KHDR and KERNEL equal -- and keep booting the newer
  # one.
  KHDR: '7.1.3'
  KERNEL: '7.1.5'
  # glibc's minimum-kernel setting -- unrelated to either of the above.
  ENABLE_KERNEL: '5.4'
  # perl IS BUILT EARLIER THAN LFS PUTS IT. The book has it in chapter 7,
  # inside the chroot, because chapters 5 and 6 borrow the host's. This box has
  # no host: rung 10 already printed "/bin/sh: perl: not found", and glibc and
  # the kernel both need it. Stage 4's version and stage 4's recipe.
  PERL_VER: '5.42.2'
  # The kernel's own prerequisites. kconfig is generated by flex and bison;
  # m4 comes first because both need it; bc is not optional because
  # kernel/time/Makefile pipes CONFIG_HZ through it to generate timeconst.h.
  M4_VER: '1.4.21'
  BC_VER: '7.0.3'
  BISON_VER: '3.8.2'
  FLEX_VER: '2.6.4'
  BUSYBOX_VER: '1.36.1'

jobs:

  # ===================================================================
  # THE CLIMB. stage3-hermetic-arm64, unmodified, called as a reusable
  # workflow. Produces mc-tcc and the byte-identity gate that says our
  # seed-built compiler matches upstream.
  # ===================================================================
  climb:
    uses: ./.github/workflows/stage3-hermetic-arm64.yml

  # ===================================================================
  # THE BRIDGE. A fresh sealed box, mc-tcc carried in as an input, and
  # the climb continued to gcc 4.7.4.
  # ===================================================================
  bridge:
    needs: climb
    runs-on: ubuntu-24.04-arm          # NATIVE aarch64, no emulation
    # 20 RUNGS INCLUDING FOUR gcc BUILDS AND A KERNEL. 330 was set when this
    # job stopped at gcc 4.7.4; gcc 15 pass 1 alone can take an hour. GitHub's
    # hard ceiling for a job is 360 minutes, so this is the most that can be
    # asked for -- if the ladder does not fit, it has to be split across jobs
    # rather than given more time.
    timeout-minutes: 360
    env:
      # TIER 1 -- ON THE BUILD PATH. STAYS EMPTY. No compiler, no assembler,
      # no linker, no archiver. binutils is built at rung 4, never borrowed.
      BUDGET_PATH: ''
      # TIER 2 -- DRIVES THE BUILD, TOUCHES NO ARTIFACT BYTE. ONE BINARY,
      # exactly as stage3-hermetic-arm64 declares. make is NOT here: it is
      # built at rung 3, and rung 2 is hand-driven so that it can be.
      BUDGET_DRIVER: 'busybox'
      # OFF BY DEFAULT. Wrapping every applet in a shell script costs a fork
      # per invocation, and a build this size invokes them tens of thousands of
      # times -- it would roughly double the ladder. Turned on deliberately,
      # once, to produce the applet list for the handmade config.
      TRACE_APPLETS: ${{ inputs.trace_applets && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      # --- AIRLOCK: everything needing a network happens here -------------
      - name: Install (airlock only -- none of this enters the box)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap busybox-static git curl xz-utils file cpio qemu-system-arm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true

      - name: Take mc-tcc from the climb
        uses: actions/download-artifact@v4
        with:
          name: stage3-hermetic-arm64
          path: climb-out

      - name: 'What the climb handed us'
        run: |
          set -eu
          MC=climb-out/mc-tcc
          if [ ! -s "$MC" ]; then
            echo "  the climb produced no mc-tcc -- nothing to bridge from"
            ls -la climb-out || true
            exit 1
          fi
          chmod 0755 "$MC"
          echo "  mc-tcc: $(wc -c < "$MC") bytes  $(sha256sum "$MC" | cut -c1-16)"
          echo "  $(file -b "$MC")"
          # THE ONLY THING THAT CROSSES. The climb's box is gone; what comes
          # over is one binary and its hash, which is the same discipline the
          # oracle uses in stage3-hermetic-arm64.

      # THE CACHE HOLDS dl/, NOT pins/, AND THE DIFFERENCE MATTERS.
      #
      # Later steps MUTATE pins: the repack rewrites V7 tarballs as ustar, and
      # the backport derivation deletes gcc 4.8.5 and adds two derived files.
      # Caching pins would save that mutated state and the next run would
      # restore a directory with the donor already gone -- a cache that breaks
      # the job on its second run and looks like a source problem.
      #
      # So dl/ is downloads only and is never written to after the fetch; pins/
      # is rebuilt from it every run and is free to be mangled.
      #
      # Keyed on the version set, so bumping any version misses and refetches.
      # These are pinned immutable release tarballs, so re-downloading 200 MB
      # every run buys nothing and costs a whole run each time an upstream is
      # briefly unreachable -- which is what happened: 134 seconds to fail to
      # reach musl.libc.org, and the job with it.
      - uses: actions/cache@v4
        with:
          path: dl
          key: pins-${{ env.MUSL_VER }}-${{ env.MAKE_VER }}-${{ env.MAKE_ALT }}-${{ env.BINUTILS }}-${{ env.GMP_VER }}-${{ env.MPFR_VER }}-${{ env.MPC_VER }}-${{ env.GCC47 }}-${{ env.GCC48 }}-${{ env.GCC10 }}-${{ env.GCC15 }}-${{ env.GLIBC }}-${{ env.KHDR }}-${{ env.PERL_VER }}-${{ env.KERNEL }}-v3

      - name: Fetch pinned upstreams (airlock -- nothing here enters the box)
        run: |
          set -eu
          mkdir -p dl && cd dl

          # MIRRORS, AND A SHORT CONNECT TIMEOUT SO A DEAD ONE COSTS SECONDS.
          #
          # A run died with
          #
          #     curl: (28) Failed to connect to musl.libc.org port 443
          #           after 134279 ms
          #
          # -- two and a half minutes to discover one host was down, and then
          # the whole job with it. tools/clone-pinned.sh already does this for
          # git ("the first mirror that answers"); this is the same idea for
          # tarballs. --connect-timeout 20 means an unreachable mirror costs 20
          # seconds, not 134.
          #
          # ftpmirror.gnu.org is GNU's own round-robin redirector and is tried
          # first for that reason; ftp.gnu.org is the canonical host and goes
          # last because it is the one that is busy.
          GNU_MIRRORS="https://ftpmirror.gnu.org
                       https://mirrors.kernel.org/gnu
                       https://mirror.csclub.uwaterloo.ca/gnu
                       https://ftp.gnu.org/gnu"
          MUSL_MIRRORS="https://musl.libc.org/releases
                        https://distfiles.macports.org/musl
                        https://ftp.barfooze.de/pub/sabotage/tarballs"

          fetch() {   # $1 = newline-separated mirror list, $2 = path under each
            _out=$(basename "$2")
            if [ -s "$_out" ]; then
              printf '  cached  %-30s %10s bytes\n' "$_out" "$(wc -c < "$_out")"
              return 0
            fi
            for _m in $1; do
              if curl -fsSL --connect-timeout 20 --max-time 900 --retry 2 \
                      -o "$_out.part" "$_m/$2" 2>/dev/null; then
                mv "$_out.part" "$_out"
                printf '  fetched %-30s %10s bytes  from %s\n' \
                  "$_out" "$(wc -c < "$_out")" "$_m"
                return 0
              fi
              echo "    no answer from $_m"
            done
            rm -f "$_out.part"
            echo "  ALL MIRRORS FAILED for $2"
            return 1
          }

          fetch "$MUSL_MIRRORS" "musl-$MUSL_VER.tar.gz"
          fetch "$GNU_MIRRORS"  "make/make-$MAKE_VER.tar.gz"
          fetch "$GNU_MIRRORS"  "make/make-$MAKE_ALT.tar.gz"
          fetch "$GNU_MIRRORS"  "binutils/binutils-$BINUTILS.tar.xz"
          fetch "$GNU_MIRRORS"  "gmp/gmp-$GMP_VER.tar.xz"
          fetch "$GNU_MIRRORS"  "mpfr/mpfr-$MPFR_VER.tar.xz"
          fetch "$GNU_MIRRORS"  "mpc/mpc-$MPC_VER.tar.gz"
          fetch "$GNU_MIRRORS"  "gcc/gcc-$GCC47/gcc-$GCC47.tar.bz2"
          fetch "$GNU_MIRRORS"  "gcc/gcc-$GCC48/gcc-$GCC48.tar.bz2"
          fetch "$GNU_MIRRORS"  "gcc/gcc-$GCC10/gcc-$GCC10.tar.xz"
          fetch "$GNU_MIRRORS"  "gcc/gcc-$GCC15/gcc-$GCC15.tar.xz"
          fetch "$GNU_MIRRORS"  "binutils/binutils-$BINUTILS_LFS.tar.xz"
          fetch "$GNU_MIRRORS"  "glibc/glibc-$GLIBC.tar.xz"
          fetch "$GNU_MIRRORS"  "m4/m4-$M4_VER.tar.xz"
          fetch "$GNU_MIRRORS"  "bison/bison-$BISON_VER.tar.xz"

          # The kernel and the two glibc patches are not on a GNU mirror.
          for u in "https://www.cpan.org/src/5.0/perl-$PERL_VER.tar.xz" \
                   "https://github.com/gavinhoward/bc/releases/download/$BC_VER/bc-$BC_VER.tar.xz" \
                   "https://github.com/westes/flex/releases/download/v$FLEX_VER/flex-$FLEX_VER.tar.gz" \
                   "https://busybox.net/downloads/busybox-$BUSYBOX_VER.tar.bz2" \
                   "https://cdn.kernel.org/pub/linux/kernel/v${KHDR%%.*}.x/linux-$KHDR.tar.xz" \
                   "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL%%.*}.x/linux-$KERNEL.tar.xz" \
                   "https://www.linuxfromscratch.org/patches/lfs/13.0/glibc-fhs-1.patch" \
                   "https://www.linuxfromscratch.org/patches/lfs/13.0/glibc-$GLIBC-upstream_fixes-1.patch"; do
            b=$(basename "$u")
            if [ -s "$b" ]; then
              printf '  cached  %-30s %10s bytes\n' "$b" "$(wc -c < "$b")"
              continue
            fi
            if curl -fsSL --connect-timeout 20 --max-time 900 --retry 2 -o "$b.part" "$u" 2>/dev/null; then
              mv "$b.part" "$b"
              printf '  fetched %-30s %10s bytes\n' "$b" "$(wc -c < "$b")"
            else
              rm -f "$b.part"
              echo "  FETCH FAILED: $u"
            fi
          done

          echo "  --- what came in ---"
          sha256sum ./*.tar.* 2>/dev/null | sed 's/^/    /'
          # HASHES ARE PRINTED, NOT YET ENFORCED. sources/musl.toml carries
          # musl's; the rest belong in sources/*.toml before this job is
          # anything but exploratory. With a cache in play that matters MORE,
          # not less -- a cache hit means nobody re-fetched the bytes, so the
          # only thing standing between the job and a corrupted cache entry
          # would be a hash check that does not exist yet.

          # pins/ IS THE WORKING COPY. Everything downstream mutates it; dl/ is
          # left exactly as fetched so the cache stays clean.
          cd ..
          rm -rf pins && mkdir -p pins
          cp dl/*.tar.* pins/
          # THE PATCHES ARE NOT TARBALLS. `cp dl/*.tar.*` would leave
          # glibc-fhs-1.patch and glibc-*-upstream_fixes-1.patch behind in dl/,
          # and rung 13 would report "not in /in -- fetch it" about files that
          # had been fetched perfectly well.
          cp dl/*.patch pins/ 2>/dev/null || true
          echo "  pins/ rebuilt from dl/: $(ls pins | wc -l) files, $(du -sh pins | cut -f1)"

      - name: 'AIRLOCK: derive the aarch64 backport as PATCHES the box can apply'
        run: |
          set -eu
          # THE BOX GETS PATCHES, NOT A PRE-PATCHED TREE.
          #
          # Shipping an already-transplanted gcc would work and would be wrong:
          # what enters the box should be the pinned upstream source plus a
          # NAMED, REVIEWABLE delta, exactly as spikes/stage3/patches/ does for
          # tcc and m2libc. A patched tarball hides the delta inside an opaque
          # blob and there is nothing left to review.
          #
          # WHY THE DERIVATION IS HERE AND THE APPLICATION IS THERE.
          # backport-aarch64.sh is ~200 lines of embedded python plus
          # expand_int_iterators.py (306 lines) and port_gcc47_api.py; it
          # rewrites gcc source, so it is tier 1 and cannot run in the box.
          # Deriving a patch from pinned inputs is the same class of operation
          # as drop_asm.py in stage3-hermetic-arm64 -- "a source edit, not a
          # compilation". APPLYING that patch needs only busybox tar and
          # busybox patch, which the box already has.
          #
          # THIS STEP IS MEANT TO BE RETIRED. The two artifacts it produces are
          # uploaded; commit them under spikes/stage4/patches/gcc47-aarch64/
          # and delete this step, and then no python touches the pipeline at
          # all -- the patches become pinned inputs like every other.
          mkdir -p bp && cd bp
          tar -jxf "../pins/gcc-$GCC47.tar.bz2"; mv "gcc-$GCC47" stock
          tar -jxf "../pins/gcc-$GCC47.tar.bz2"
          tar -jxf "../pins/gcc-$GCC48.tar.bz2"
          echo "  before: $(grep -c aarch64 "gcc-$GCC47/gcc/config.gcc" || true) aarch64 mentions in config.gcc"
          bash "$GITHUB_WORKSPACE/spikes/stage4/probes/backport-aarch64.sh" \
            "gcc-$GCC47" "gcc-$GCC48" | sed 's/^/    /'
          echo "  after:  $(grep -c aarch64 "gcc-$GCC47/gcc/config.gcc" || true) aarch64 mentions in config.gcc"

          # SPLIT THE DELTA IN TWO, because the two halves want different tools.
          #   NEW files      -> a tar overlay. busybox tar is proven here; a
          #                     unified diff creating 37 files from /dev/null
          #                     leans on busybox patch far harder than it needs to.
          #   CHANGED files  -> a real patch, small and readable, over the
          #                     handful of files 4.7.4 already had.
          : > /tmp/new.txt; : > /tmp/chg.txt
          ( cd "gcc-$GCC47" && find . -type f | sort ) > /tmp/all.txt
          while IFS= read -r f; do
            if [ ! -f "stock/$f" ]; then
              printf '%s\n' "$f" >> /tmp/new.txt
            elif ! cmp -s "stock/$f" "gcc-$GCC47/$f"; then
              printf '%s\n' "$f" >> /tmp/chg.txt
            fi
          done < /tmp/all.txt
          echo "  new files:     $(wc -l < /tmp/new.txt)"
          echo "  changed files: $(wc -l < /tmp/chg.txt)"
          sed 's/^/    /' /tmp/chg.txt

          tar -czf "../pins/gcc47-aarch64-newfiles.tar.gz" \
              -C "gcc-$GCC47" -T /tmp/new.txt
          : > "../pins/gcc47-aarch64-changed.patch"
          while IFS= read -r f; do
            diff -u "stock/$f" "gcc-$GCC47/$f" \
              | sed -e "1s|^--- .*|--- a/${f#./}|" -e "2s|^+++ .*|+++ b/${f#./}|" \
              >> "../pins/gcc47-aarch64-changed.patch" || true
          done < /tmp/chg.txt

          cd ..
          rm -f "pins/gcc-$GCC48.tar.bz2"
          rm -rf bp
          echo "  --- what the box will apply ---"
          printf '    %-34s %10s bytes\n' gcc47-aarch64-newfiles.tar.gz "$(wc -c < pins/gcc47-aarch64-newfiles.tar.gz)"
          printf '    %-34s %10s bytes\n' gcc47-aarch64-changed.patch  "$(wc -c < pins/gcc47-aarch64-changed.patch)"
          sha256sum pins/gcc47-aarch64-* | sed 's/^/    /'

      - name: 'AIRLOCK: build the busybox this box will use'
        run: |
          set -eu
          # OUR busybox, NOT UBUNTU's, AND THE PROBE MEASURED WHY.
          #
          #     ours: 400 applets, 2.18 MB, statically linked
          #     Ubuntu's: 272
          #       split   ours=yes  ubuntu=no
          #       comm    ours=yes  ubuntu=no
          #       tsort   ours=yes  ubuntu=no
          #
          # split and comm cost two full rounds at rung 11.5 -- perl's
          # Configure needs both, Ubuntu's build has neither, and the failure
          # reads as "not found", which looks like a PATH fault rather than an
          # applet that was compiled out. rungs.sh still builds its own split
          # and comm, and with this they become belt-and-braces rather than the
          # only source.
          #
          # THE REAL POINT IS DECLARATION. The box's single host binary was
          # whatever Ubuntu happened to ship; now it is one we built from a
          # pinned tarball with a config in this file. "The box has no split"
          # stops being a discovery.
          #
          # CONFIG_TC IS OFF because busybox 1.36.1's tc.c is 2023 code against
          # 2026 kernel headers -- TCA_CBQ_MAX and struct tc_cbq_lssopt were
          # removed upstream. A build sysroot has no use for traffic shaping.
          BB=1.36.1
          mkdir -p dl && cd dl
          [ -s "busybox-$BB.tar.bz2" ] || \
            curl -fsSL --connect-timeout 20 --retry 2 \
              -O "https://busybox.net/downloads/busybox-$BB.tar.bz2"
          cd ..
          rm -rf bbsrc && mkdir bbsrc
          tar xf "dl/busybox-$BB.tar.bz2" -C bbsrc --strip-components=1
          cd bbsrc
          make defconfig > /dev/null 2>&1
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          for sym in SPLIT COMM JOIN PASTE EXPAND UNEXPAND FOLD NL TSORT \
                     CMP DIFF PATCH AWK SED GREP SORT UNIQ TR CUT; do
            sed -i "s/^# CONFIG_$sym is not set/CONFIG_$sym=y/" .config
            grep -q "^CONFIG_$sym=y" .config || echo "CONFIG_$sym=y" >> .config
          done
          for sym in SSL_CLIENT FEATURE_WGET_OPENSSL TLS TC; do
            sed -i "s/^CONFIG_$sym=y/# CONFIG_$sym is not set/" .config
          done
          yes '' | make oldconfig > /dev/null 2>&1 || true
          # VERIFY AFTER oldconfig -- it re-derives symbols and has undone
          # exactly this edit before, in this repository, three runs running.
          _bad=0
          for sym in STATIC SPLIT COMM; do
            grep -q "^CONFIG_$sym=y" .config || { echo "  CONFIG_$sym did not survive oldconfig"; _bad=1; }
          done
          [ "$_bad" = 0 ] || exit 1
          make -j"$(nproc)" > b.log 2>&1 || {
            echo "  --- errors ---"
            grep -oE '^[^ :]+\.(c|h):[0-9]+' b.log | cut -d: -f1 | sort | uniq -c | sort -rn | head -6 | sed 's/^/    /'
            tail -20 b.log | sed 's/^/    /'; exit 1; }
          cd ..
          cp bbsrc/busybox veron-busybox
          echo "  busybox: $(wc -c < veron-busybox) bytes, $(./veron-busybox --list | wc -l) applets"
          echo "  static:  $(file -b veron-busybox | grep -o 'statically linked' || echo NO)"
          echo "  --- the two that cost rounds ---"
          for a in split comm; do
            printf '    %-6s ours=%-3s ubuntu=%s\n' "$a" \
              "$(./veron-busybox --list | grep -qx "$a" && echo yes || echo no)" \
              "$(/bin/busybox --list | grep -qx "$a" && echo yes || echo no)"
          done

      - name: Assemble the box
        run: |
          set -eu
          BOX="$PWD/box"; echo "BOX=$BOX" >> "$GITHUB_ENV"
          mkdir -p "$BOX"/bin "$BOX"/lib "$BOX"/work "$BOX"/out \
                   "$BOX"/src "$BOX"/in "$BOX"/tmp "$BOX"/proc "$BOX"/dev

          # TIER 1 is empty, so this loop copies nothing. It stays because the
          # SEAL reads the same variable and the two must not describe
          # different sets.
          for t in $BUDGET_PATH; do
            cp -L "$(command -v "$t")" "$BOX/bin/$t"
          done
          for t in $BUDGET_DRIVER; do
            cp -L "$(command -v "$t")" "$BOX/bin/$t"
          done

          # Only the shared objects the tier-2 binaries need to EXECUTE. This
          # is not a libc for building against: there are no headers and no
          # crt files, and rung 3 is what proves that.
          for b in "$BOX"/bin/*; do
            ldd "$b" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}'
          done | sort -u > /tmp/needed
          while read -r l; do [ -f "$l" ] && cp -L "$l" "$BOX/lib/" || true; done < /tmp/needed
          mkdir -p "$BOX"/usr/lib && cp -a "$BOX"/lib/. "$BOX"/usr/lib/ 2>/dev/null || true

          # EVERY APPLET busybox HAS, ASKED FOR RATHER THAN GUESSED.
          #
          # This was a hand-written list and it was short. binutils' libiberty
          # stopped at
          #
          #     touch stamp-picdir
          #     make[2]: *** [stamp-picdir] Error 127
          #
          # -- 127 is "command not found", and `touch` was simply not in it. A
          # build this size will reach for dozens of ordinary utilities and
          # guessing which ones is a round each. `busybox --list` is the
          # authoritative answer and costs one line.
          #
          # TWO ARE NOT LINKED -- `ar` and `strings` -- because both are tier 1
          # by this job's definition: they decide what bytes end up in an
          # artifact, and busybox's ar can only READ archives, never create one.
          #
          # NOT LINKING THEM DOES NOT REMOVE THEM, and that is worth stating
          # plainly rather than leaving as an assumption. Ubuntu's
          # busybox-static is built with FEATURE_SH_STANDALONE, so its ash
          # dispatches any applet it knows BY NAME without consulting PATH.
          # rung 4's smoke test proved it: with ar unlinked and the SEAL
          # reporting 269 applets, `ar cru` still reached busybox and answered
          # "ar: invalid option -- 'r'".
          #
          # So every claim of the form "the box does not have X" holds only if
          # BUSYBOX does not have X. Where a real tool is needed, the answer is
          # to give it a name busybox has no applet for and point the build at
          # it explicitly -- which is what rung 4 does with tcc-ar and AR=.
          # Not linking these two still helps: it keeps them off PATH for
          # anything that is not busybox's own shell.
          for a in $("$BOX/bin/busybox" --list); do
            case "$a" in
              ar|strings) continue ;;
              busybox)    continue ;;
            esac
            if [ "${TRACE_APPLETS:-0}" = 1 ]; then
              # A WRAPPER THAT LOGS ITSELF AND THEN GETS OUT OF THE WAY.
              #
              # The eventual goal is a handmade busybox config containing
              # exactly the applets this chain needs -- allnoconfig plus a list,
              # so the config file IS the declaration rather than defconfig
              # minus a few seds.
              #
              # THAT LIST CANNOT BE DEDUCED FROM THE LOGS. rungs.sh invokes
              # maybe 25 applets and they are all visible. But configure is
              # generated shell that reaches for tr, expr, basename, sort, uniq
              # and a dozen more in branches that depend on what it finds;
              # Makefiles call more; the kernel's scripts/ is a small userland
              # of its own. None of it appears unless it FAILS -- which is how
              # split and comm were found, one round each.
              #
              # So measure instead. Each applet becomes a two-line wrapper that
              # appends its name to a log and then execs the real busybox, so
              # the chain runs exactly as it would otherwise and the log is the
              # precise set that was invoked. Not deduced: recorded.
              #
              # exec, NOT a call -- the wrapper must not sit in the process tree
              # holding a pipe open. A build this size runs applets in pipelines
              # tens of thousands of times.
              printf '#!/bin/busybox sh\necho %s >> /out/applets-used.txt\nexec /bin/busybox %s "$@"\n' \
                "$a" "$a" > "$BOX/bin/$a"
              chmod 0755 "$BOX/bin/$a"
            else
              ln -sf busybox "$BOX/bin/$a"
            fi
          done
          echo "  applets linked: $(find "$BOX/bin" -type l | wc -l)"
          echo "  excluded on purpose: ar strings  (tier 1 -- rung 4 builds them)"

          # WHICH APPLETS THIS busybox DOES NOT HAVE, NAMED BEFORE ANYTHING
          # NEEDS THEM.
          #
          # perl's Configure died on two of them:
          #
          #     ./Configure: line 2135: split: not found
          #     I don't know where 'comm' is, and my life depends on it.
          #
          # Both are real busybox applets -- but they are compile-time options,
          # and Ubuntu's busybox-static is built without them. `busybox --list`
          # reported 269 and the loop linked all 269; the ones missing were
          # never on the list to begin with, so nothing here was wrong and
          # nothing looked wrong either.
          #
          # A build reaching for one of these gets "not found" from the shell,
          # which reads as a PATH problem rather than as a busybox that was
          # compiled without the applet. Printing the gap here turns the next
          # occurrence into one line of reading.
          #
          # This is the same class as `patch -d` and `tr -dc`: what busybox
          # supports is a property of THIS BINARY, not of busybox.
          # gawk AS A WRAPPER, BECAUSE m4 AND bison BOTH PROBE FOR IT BY NAME.
          #
          # busybox has awk and not gawk, and a symlink will not do: it
          # dispatches on argv[0], so a link named gawk makes it answer
          # "gawk: applet not found". The tool-probe hit exactly that and it
          # read like a missing tool rather than a wrong link.
          #
          # busybox awk handles what these configures use -- ENVIRON, -f, gsub,
          # printf, match, all measured in tool-probe -- so the wrapper is
          # honest rather than a stand-in for something absent.
          # rm FIRST, EVEN THOUGH IT IS SAFE TODAY. busybox has no gawk applet,
          # so the loop above creates no symlink here and `>` has nothing to
          # write through. But that is a fact about busybox's applet list, not
          # about this code -- and in tool-probe the identical line truncated
          # the busybox BINARY, because there the name was symlinked first. The
          # error it produced named the wrapper and read as a permissions
          # problem.
          rm -f "$BOX/bin/gawk"
          printf '#!/bin/busybox sh\nexec /bin/busybox awk "$@"\n' > "$BOX/bin/gawk"
          chmod 0755 "$BOX/bin/gawk"
          echo "  gawk -> busybox awk (wrapper, not a symlink: argv[0] dispatch)"

          echo "  --- POSIX tools this busybox does NOT have ---"
          missing=""
          for a in split comm join csplit paste expand unexpand fold fmt nl \
                   pr tsort col cmp uniq tr od dd printf tee; do
            "$BOX/bin/busybox" --list | grep -qx "$a" || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "   $missing"
            echo "    A rung that needs one of these will report \"not found\", which"
            echo "    reads as a PATH fault. It is not: the applet was compiled out."
          else
            echo "    none of the commonly-needed ones are missing"
          fi

          # mc-tcc's -B directory: tcc's own source tree, where it looks for
          # libtcc1.a and include/. Same pin and same five arm64 patches the
          # climb compiled. libtcc1.a is BUILT at rung 0 by mc-tcc itself.
          cp -a tccsrc "$BOX/work/tccsrc"
          rm -f "$BOX/work/tccsrc/libtcc1.a"
          cp -L climb-out/mc-tcc "$BOX/work/mc-tcc"
          chmod 0755 "$BOX/work/mc-tcc"

          echo "  box laid out: $(du -sh "$BOX" | cut -f1)"
          echo "  /usr/include present? $( [ -d "$BOX/usr/include" ] && echo YES || echo no )"

      - name: 'AIRLOCK: repack V7 tarballs as ustar (busybox tar requires the magic)'
        run: |
          set -eu
          # MEASURED, NOT ASSUMED THIS TIME. The out-of-sandbox probe ran the
          # box's own busybox on the same files and printed their headers:
          #
          #   musl-1.2.5   name: pax_global_heade  type: g  magic: ustar\0 00  -> OK
          #   make-3.82    name: make-3.82/        type: 5  magic: \0 x8       -> FAILED
          #   make-4.4     name: make-4.4/         type: 5  magic: \0 x8       -> FAILED
          #
          # GNU make's release tarballs are V7 format and carry NO ustar magic.
          # busybox's get_header_tar requires it and refuses them; host GNU tar
          # reads them because it handles V7. musl's is PAX/ustar, which is why
          # exactly one archive in the set worked and the rest of this job spent
          # six runs on it.
          #
          # I HAD THIS RIGHT ONCE AND THREW IT AWAY. The earlier repack was
          # removed after a local test showed every GNU tar output format except
          # v7 writes the magic -- which is true, and which tests what GNU tar
          # CAN write rather than what these tarballs ARE. Wrong experiment,
          # confident conclusion. The probe tests the actual files.
          #
          # Repacking changes the container, not the contents: the archive is a
          # pinned input, host tar reads it identically either way, and the box
          # still extracts and builds everything itself.
          cd pins
          for f in *.tar.gz *.tar.xz *.tar.bz2; do
            [ -f "$f" ] || continue
            stem=${f%%.tar.*}
            case "$f" in
              *.gz)  before=$(gzip  -dc "$f" | dd bs=1 skip=257 count=5 2>/dev/null) ;;
              *.xz)  before=$(xz    -dc "$f" | dd bs=1 skip=257 count=5 2>/dev/null) ;;
              *.bz2) before=$(bzip2 -dc "$f" | dd bs=1 skip=257 count=5 2>/dev/null) ;;
            esac
            if [ "$before" = "ustar" ]; then
              printf '  %-26s already ustar -- left alone\n' "$f"
              continue
            fi
            d=$(mktemp -d)
            tar xf "$f" -C "$d"
            ( cd "$d" && tar czf "$OLDPWD/$stem.repacked.tar.gz" --format=ustar ./* )
            rm -rf "$d" "$f"
            mv "$stem.repacked.tar.gz" "$stem.tar.gz"
            after=$(gzip -dc "$stem.tar.gz" | dd bs=1 skip=257 count=5 2>/dev/null)
            printf '  %-26s V7 -> ustar  [%s] -> [%s]  %s bytes\n' \
              "$f" "$before" "$after" "$(wc -c < "$stem.tar.gz")"
            [ "$after" = ustar ] || { echo "  REPACK DID NOT TAKE for $f"; exit 1; }
          done
          echo "  --- what the box will see in /in ---"
          ls -1 . | sed 's/^/    /'

      - name: 'PROBE: the exact tar command, outside bubblewrap'
        run: |
          set -eu
          # THE SAME BINARY, THE SAME FILE, NO SANDBOX.
          #
          # In the box, `tar -zxf /in/make-4.4.tar.gz` is refused with "invalid
          # tar magic" while the identical call opens musl-1.2.5.tar.gz. Three
          # runs of diagnostics inside the box have not settled why, and two of
          # those diagnostics turned out to be broken themselves. So run the
          # command outside, where host tools are available to check the answer.
          #
          # This discriminates in one step:
          #   busybox fails here too      -> busybox tar vs this tarball
          #   busybox works here          -> something about the box, not the file
          #   host tar fails too          -> the download is bad
          B="$BOX/bin/busybox"
          echo "  busybox: $("$B" 2>&1 | head -1)"
          echo
          for f in pins/musl-*.tar.gz pins/make-*.tar.gz; do
            [ -f "$f" ] || continue
            echo "  ===== $f  ($(wc -c < "$f") bytes) ====="
            echo "    first 4 bytes: $(dd if="$f" bs=1 count=4 2>/dev/null | od -An -tx1 | tr -s ' ')"

            # 1. host GNU tar, listing only
            if tar -tzf "$f" > /dev/null 2>/tmp/hosttar.err; then
              echo "    host tar -tzf     : OK  ($(tar -tzf "$f" 2>/dev/null | wc -l) members)"
            else
              echo "    host tar -tzf     : FAILED  $(head -1 /tmp/hosttar.err)"
            fi

            # 2. the box's busybox, same flags, no sandbox
            rm -rf /tmp/bbx && mkdir -p /tmp/bbx
            if ( cd /tmp/bbx && "$B" tar -zxf "$OLDPWD/$f" ) 2>/tmp/bbtar.err; then
              echo "    busybox tar -zxf  : OK  ($(ls /tmp/bbx | tr '\n' ' '))"
            else
              echo "    busybox tar -zxf  : FAILED  $(head -2 /tmp/bbtar.err | tr '\n' ' ')"
            fi

            # 3. busybox on the DECOMPRESSED bytes, which separates the -z path
            #    from the archive itself
            gzip -dc "$f" > /tmp/probe.tar
            rm -rf /tmp/bbx2 && mkdir -p /tmp/bbx2
            if ( cd /tmp/bbx2 && "$B" tar -xf /tmp/probe.tar ) 2>/tmp/bbtar2.err; then
              echo "    busybox tar -xf   : OK on the decompressed file"
            else
              echo "    busybox tar -xf   : FAILED  $(head -2 /tmp/bbtar2.err | tr '\n' ' ')"
            fi

            # 4. the header fields, carved with dd and formatted with od
            echo "    name  (0)   : $(dd if=/tmp/probe.tar bs=1 count=16      2>/dev/null | od -c | head -1)"
            echo "    type  (156) : $(dd if=/tmp/probe.tar bs=1 skip=156 count=1 2>/dev/null | od -c | head -1)"
            echo "    magic (257) : $(dd if=/tmp/probe.tar bs=1 skip=257 count=8 2>/dev/null | od -c | head -1)"
            echo "    host tar says format: $(tar -tvf /tmp/probe.tar 2>/dev/null | head -1)"
            rm -f /tmp/probe.tar
            echo
          done

      - name: 'SEAL: enumerate every executable in the box and enforce the budget'
        run: |
          set -eu
          echo "  === TIER 1: ON THE BUILD PATH ==="
          if [ -z "$BUDGET_PATH" ]; then
            echo "    EMPTY -- no compiler, no assembler, no linker, no archiver."
            echo "    binutils is BUILT at rung 4, not borrowed. If it appears"
            echo "    below, a configure script found it and this run is void."
          fi
          for t in $BUDGET_PATH; do
            printf '    %-12s %10s  %s\n' "$t" "$(wc -c < "$BOX/bin/$t")" \
              "$(sha256sum "$BOX/bin/$t" | cut -c1-16)"
          done
          echo "  === TIER 2: DRIVER (touches no artifact byte) ==="
          echo "    busybox is now one WE BUILT, from a pinned tarball with the"
          echo "    config in this file -- not whatever the runner's distro"
          echo "    shipped. Its applet list is declared rather than inherited."
          for t in $BUDGET_DRIVER; do
            printf '    %-12s %10s  %s\n' "$t" "$(wc -c < "$BOX/bin/$t")" \
              "$(sha256sum "$BOX/bin/$t" | cut -c1-16)"
          done
          echo "  === TIER 3: CARRIED FROM THE CLIMB ==="
          printf '    %-12s %10s  %s\n' mc-tcc "$(wc -c < "$BOX/work/mc-tcc")" \
            "$(sha256sum "$BOX/work/mc-tcc" | cut -c1-16)"

          # EVERY REAL EXECUTABLE IN THE BOX, against what was declared.
          # gawk IS DECLARED, because it is a real file in /bin rather than a
          # symlink and the check below would otherwise fail it as undeclared.
          # It is not a host binary: it is a two-line wrapper this workflow
          # writes, calling the busybox we built. Saying so here keeps the SEAL
          # meaning "nothing arrived that we did not put there" rather than
          # quietly widening to "nothing arrived except the things we forgot".
          printf '%s\n' $BUDGET_PATH $BUDGET_DRIVER gawk | sort -u > /tmp/declared
          find "$BOX/bin" -type f -printf '%f\n' | sort -u > /tmp/actual
          if ! undeclared=$(comm -13 /tmp/declared /tmp/actual) || [ -n "$undeclared" ]; then
            echo "  UNDECLARED EXECUTABLES IN THE BOX:"
            printf '%s\n' "$undeclared" | sed 's/^/    /'
            exit 1
          fi
          echo "  SEALED. $(wc -l < /tmp/declared) declared entries in /bin:"
          echo "    busybox  -- built by this workflow from a pinned tarball"
          echo "    gawk     -- a wrapper around it, written by this workflow"
          echo "  $(printf '%s' "$BUDGET_PATH" | wc -w) of them on the build path."

      - name: 'IN THE BOX: mc-tcc -> musl -> binutils -> gmp/mpfr/mpc -> gcc 4.7.4'
        run: |
          set -eu
          bwrap \
            --unshare-all \
            --die-with-parent \
            --setenv PATH /bin \
            --setenv HOME /work \
            --setenv LC_ALL POSIX \
            --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --setenv LD_LIBRARY_PATH /lib \
            --setenv CC_BIN /work/mc-tcc \
            --setenv TCCDIR /work/tccsrc \
            --setenv ARM mc-tcc \
            --bind "$BOX" / \
            --ro-bind "$PWD/spikes" /src \
            --ro-bind "$PWD/pins" /in \
            --bind "$BOX/out" /out \
            --proc /proc --dev /dev --tmpfs /tmp \
            --chdir /work \
            /bin/sh /src/stage4/bridge/rungs.sh

      - name: 'THE APPLET SET: what the chain actually invoked'
        if: always()
        run: |
          set -eu
          L=box/out/applets-used.txt
          if [ "${TRACE_APPLETS:-0}" != 1 ]; then
            echo "  tracing was off. Dispatch with trace_applets=true to record"
            echo "  the applet set -- it roughly doubles the run, so it is a"
            echo "  deliberate one-off rather than something every run pays for."
            exit 0
          fi
          if [ ! -s "$L" ]; then
            echo "  tracing was on but nothing was recorded. Either the box never"
            echo "  started, or /out was not writable from inside it."
            exit 0
          fi
          total=$(wc -l < "$L")
          sort -u "$L" > /tmp/used.txt
          used=$(wc -l < /tmp/used.txt)
          have=$(./veron-busybox --list | wc -l)
          echo "  invocations recorded : $total"
          echo "  distinct applets used: $used"
          echo "  applets compiled in  : $have"
          echo
          echo "  --- the set, which is the config ---"
          tr '\n' ' ' < /tmp/used.txt | fold -w 72 -s | sed 's/^/    /'
          echo
          echo "  --- by frequency, most-used first ---"
          sort "$L" | uniq -c | sort -rn | head -25 | sed 's/^/    /'
          echo
          echo "  --- compiled in but NEVER invoked ($((have - used))) ---"
          ./veron-busybox --list | sort > /tmp/have.txt
          comm -23 /tmp/have.txt /tmp/used.txt | tr '\n' ' ' | fold -w 72 -s | sed 's/^/    /'
          echo
          echo "  --- as a busybox config ---"
          while read -r a; do
            printf '    CONFIG_%s=y\n' "$(echo "$a" | tr 'a-z-' 'A-Z_')"
          done < /tmp/used.txt | head -60
          echo
          echo "  READ THIS AS A FLOOR, NOT A SPEC. It records the applets the"
          echo "  paths that RAN invoked. A rung that failed early under-reports"
          echo "  everything above it, and a configure branch not taken this time"
          echo "  may be taken next time -- autoconf picks tools by what it"
          echo "  finds. The list is a measured lower bound on a set that was"
          echo "  previously being guessed at one round per missing tool."
          echo
          echo "  Some names are not applets: busybox's own symbol for a few"
          echo "  differs from the command name. Check each against --list"
          echo "  before writing the final config."

      - name: 'BUDGET: what this run still borrowed from the host'
        if: always()
        run: |
          set -eu
          echo "  on the build path : ${BUDGET_PATH:-EMPTY -- nothing}"
          echo "  driving the build : $BUDGET_DRIVER"
          echo ""
          echo "  NOT BOUND, and that is the difference from stage 4:"
          echo "    /usr/include   host glibc headers      -- absent"
          echo "    /usr/lib       crt1.o, libc            -- absent"
          echo "    binutils       as, ld, ar, ranlib      -- absent (built at rung 4)"
          echo ""
          echo "    make           GNU make               -- absent (built at rung 3.5)"
          echo ""
          echo "  busybox is the only host binary in this box, which is exactly"
          echo "  what stage3-hermetic-arm64 declares. Removing it is the same"
          echo "  unowned work it is there."

      - name: 'BOOT: the kernel this chain built, under qemu, outside the box'
        if: always()
        run: |
          set -u
          # qemu IS A VERIFIER, NOT A BUILD TOOL, and it stays outside the box
          # for the same reason stage 4 keeps it outside: nothing it does
          # contributes a byte to any artifact. It reads what rung 20 left in
          # /out and reports whether that boots.
          IMG=box/out/Image
          IRD=box/out/initramfs.cpio.gz
          if [ ! -s "$IMG" ] || [ ! -s "$IRD" ]; then
            echo "  no Image or initramfs -- the rungs did not reach 20"
            exit 0
          fi
          echo "  Image:     $(stat -c%s "$IMG") bytes"
          echo "  initramfs: $(stat -c%s "$IRD") bytes"
          echo "  booting on qemu-system-aarch64 -M virt ..."
          # -M virt with cortex-a57: the bare form is right for -M virt.
          # rdinit=/init because the initramfs is the whole root.
          set +e
          timeout 600 qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -smp 2 -m 2048 \
            -nographic -no-reboot -nic none \
            -kernel "$IMG" \
            -initrd "$IRD" \
            -append "console=ttyAMA0 earlycon rdinit=/init panic=1 loglevel=7" \
            2>&1 | tee /tmp/boot.log | sed 's/^/    /'
          set -e
          echo
          if grep -q "VERON-BOOT-OK" /tmp/boot.log; then
            echo "  BOOTED. The kernel this chain built ran its own userland."
            grep -A3 "VERON-GCC-IN-GUEST" /tmp/boot.log | sed 's/^/    /' || true
          else
            echo "  did not reach VERON-BOOT-OK -- last 25 lines:"
            tail -25 /tmp/boot.log | sed 's/^/    /'
          fi
