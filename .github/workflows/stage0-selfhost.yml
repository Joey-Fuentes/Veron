name: stage0-selfhost

# SPIKE. CAN stage0-as ASSEMBLE ITS OWN SOURCE?
#
# THE POINT. stage0-as is a mnemonic assembler written in GNU `as` syntax, so
# `as` and `ld` are needed to build it -- the last two host tools on Veron's
# build path (see stage3-hermetic-arm64.yml's BUDGET_PATH). If its source were
# expressed in stage0-as's OWN input language, stage0-as could assemble itself,
# and the host tools would be needed only to birth the very first binary. That
# binary can then be committed as verified hex and checked by round-trip
# disassembly, which is what TRUST-BOUNDARY.md means by "the assembler is
# untrusted by design".
#
# THIS WORKFLOW DOES NOT CLOSE THAT. It MEASURES it, because the first estimate
# was wrong and wrong in the expensive direction.
#
#   mnemonic-level count : 27 distinct mnemonics, 25 in the documented table
#                          -> "the gap is b.gt and b.le, 8 lines"
#   operand-form count   : 43 distinct (mnemonic, operand-shape) pairs, and
#                          251 lines use shapes the table does not list
#
# The same source line count, two answers an order of magnitude apart. Counting
# mnemonics hides that `orr w0,w1,w2,lsl #5`, `movz w0,#x,lsl #16`,
# `lsl w0,w1,#4` and `ldr w0,[x1,w2,uxtw #2]` are different instructions from
# the `orr`/`movz`/`lsl`/`ldr` the table documents. AGENTS.md's rule is measure,
# do not estimate; this is what that rule is for.
#
# AND THE DOCUMENTED TABLE IS ALSO NOT THE ANSWER. spikes/stage0-as/README.md
# is documentation; what stage0-as accepts is a property of the binary. Roughly
# 150 of those 251 lines are simply w-register spellings of forms the table
# gives in x-register terms (`mov w0, w1` vs `mov x<d> x<n>`), and stage0-as may
# well take them already. Nobody knows, and guessing is how the first estimate
# went wrong twice.
#
# So: PROBE FIRST. One minimal test per form, assembled BOTH ways -- by GNU `as`
# and by stage0-as -- and byte-compared. That is exactly how
# stage2-mini-c-demo settles individual instruction encodings, and it turns
# "does it support this?" into a checksum.
#
# EVERY STEP HERE IS NON-GATING ON PURPOSE. This is a measurement spike. It
# reports ground truth so the next commit can be aimed; it does not yet assert
# anything. The GATE section at the bottom is written and switched off, and
# turns on by itself the day the gap reaches zero.
#
# WHAT THE ANSWER LOOKS LIKE EITHER WAY. Each unsupported form has two possible
# fixes and the probe tells you which is cheaper:
#   - teach stage0-as the form (it already has the shift and register-encoding
#     machinery -- movk with a shift is in the table), or
#   - rewrite those source lines into forms it already takes (`lsl w0,w1,#4`
#     becomes a mov of 4 into a scratch register plus the register-shift form).
# Character literals (#'x', 62 uses) and the one .equ are pure source-side text
# substitutions the translator already handles, and cost the assembler nothing.

on:
  push:
    paths:
      - 'spikes/stage0-as/**'
      - 'spikes/elf/**'
      - 'tools/s0_selfhost.py'
      - '.github/workflows/stage0-selfhost.yml'
      - '!spikes/**/*.md'
  workflow_dispatch:

concurrency:
  group: stage0-selfhost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selfhost:
    runs-on: ubuntu-24.04-arm          # NATIVE aarch64 -- no qemu in the way
    # 20 MINUTES WAS RIGHT UNTIL r22 ADDED A BINUTILS BUILD. Compiling binutils
    # from source on a 4-core arm64 runner takes 10-20 minutes, so the job was
    # being killed mid-build -- and because actions/cache only SAVES on a
    # successful job, the cache never populated and every subsequent run
    # rebuilt from scratch and died the same way. A self-sustaining failure
    # loop, not a hang.
    timeout-minutes: 90
    env:
      SRC: spikes/stage0-as/stage0-as.aarch64.s
      # Instructions whose disassembly is not their source spelling. Folding the
      # movz shifts into their immediates took this from 27 to 2; what is left
      # is `adr x27, symtab` printing as `__bss_start` (two names, one address)
      # and one branch. Lower it whenever the number falls; never raise it
      # without saying why in the same commit.
      # Was 2 against binutils 2.42. Pinning 2.47 raised it to 57: the newer
      # disassembler prints large immediates signed (-0x2d800000 for what 2.42
      # called 3531603968) and picks the OTHER of two labels sharing an address.
      # The first was a normaliser gap and is fixed; the second was a real
      # ambiguity in the source and the duplicate label is gone. Both were
      # invisible under 2.42 -- which is the argument for pinning a current tool
      # and for cross-checking two of them.
      # ZERO. Both decoders now read every instruction back as the source
      # wrote it: llvm-objdump 22.1.8 was already exact at 695/695, and GNU
      # objdump 2.47's single remaining difference was `adr x27, symtab`
      # printed as `__bss_start` -- the same byte under two names. bss_origin
      # now absorbs that collision. From here the round-trip is exact by
      # construction and any commit that spoils it fails this step.
      ROUNDTRIP_BUDGET: '0'
      # PINNED TOOLCHAINS, NOT WHATEVER THE RUNNER SHIPS. The first round-trip
      # runs used Ubuntu's binutils 2.42-4ubuntu2.10 -- a distro package, on a
      # distro schedule, whose alias preferences could change under us with no
      # commit of ours. For a check whose whole purpose is to make a committed
      # binary auditable, the tool doing the auditing has to be pinned too.
      #
      # binutils 2.47 released 2026-07-26 and notably adds new disassembler
      # options; LLVM 22.1.8 is llvmorg-22.1.8, 2026-06-16.
      BINUTILS_VER: '2.47'
      LLVM_VER: '22.1.8'
      # Build with the pinned `as`/`ld` as well as verify with them. OFF for the
      # first run ON PURPOSE: pinning the assembler may change stage0-as's bytes
      # relative to the 2.42 baseline, and changing the verifier and the builder
      # in one commit would leave no way to tell which caused what. Flip to
      # 'true' once the verification result is known.
      PIN_BUILD_TOOLCHAIN: 'false'
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils python3

      - name: Build the reference stage0-as and elf
        run: |
          set -eu
          # ONCE THE BINARIES ARE COMMITTED, VERIFY THOSE, NOT FRESH ONES.
          # Rebuilding from source and checking the rebuild proves the source
          # is self-consistent and says nothing about the artifact in the
          # repository -- which is the thing that will actually be run.
          if [ -x spikes/stage0-as/stage0-as ] && [ -x spikes/elf/elf ]; then
            echo "  committed binaries present -- verifying THOSE"
            cp spikes/stage0-as/stage0-as stage0-as
            cp spikes/elf/elf elf
            as -o s0.o "$SRC"
            for _b in stage0-as elf; do
              printf '  %-14s %8s  %s  (committed)\n' "$_b" \
                "$(wc -c < "$_b")" "$(sha256sum "$_b" | cut -c1-16)"
            done
            exit 0
          fi
          as -o s0.o "$SRC"
          ld -static -o stage0-as s0.o
          as -o elf.o spikes/elf/elf.aarch64.s
          ld -static -o elf elf.o
          printf '  %-14s %8s  %s\n' stage0-as "$(wc -c < stage0-as)" \
            "$(sha256sum stage0-as | cut -c1-16)"
          printf '  %-14s %8s  %s\n' elf "$(wc -c < elf)" \
            "$(sha256sum elf | cut -c1-16)"

      - name: Cache the pinned toolchains
        uses: actions/cache@v4
        with:
          path: |
            pinned
          # v2: v1 predates llvm-mc. Adding a file to a cached DIRECTORY does
          # not change the key, so the stale cache kept winning and llvm-mc was
          # never there -- "No such file or directory" on every run. Bump the
          # key whenever the contents of the cached tree change.
          key: pinned-binutils-${{ env.BINUTILS_VER }}-llvm-${{ env.LLVM_VER }}-v2

      # NOTE FOR ANYONE WATCHING A RUN: this is the slow step, not the one above
      # it. On a cold cache it compiles binutils from source and takes 10-20
      # minutes; on a warm cache it takes seconds. The step before it, "Build
      # the reference stage0-as and elf", is four assembler invocations and
      # finishes instantly -- it was misread as the slow one because this step's
      # output used to be suppressed entirely.
      - name: 'Pin the disassemblers -- SLOW ON A COLD CACHE (builds binutils)'
        run: |
          set -eu
          P="$PWD/pinned"; echo "P=$P" >> "$GITHUB_ENV"
          if [ -x "$P/bin/objdump" ] && [ -x "$P/bin/llvm-objdump" ]; then
            echo "  restored from cache"
          else
            mkdir -p "$P/bin" src
            sudo apt-get install -y --no-install-recommends \
              curl xz-utils build-essential texinfo bison flex
            # --- GNU binutils, from source: there is no distro package for a
            # release this new, and the point is to control the version.
            curl -fsSL --retry 3 --max-time 600 \
              "https://ftp.gnu.org/gnu/binutils/binutils-$BINUTILS_VER.tar.xz" \
              -o src/binutils.tar.xz
            tar -C src -xf src/binutils.tar.xz
            mkdir -p src/b && cd src/b
            ../binutils-$BINUTILS_VER/configure --prefix="$P" \
              --disable-nls --disable-gdb --disable-gdbserver \
              --disable-sim --disable-werror >/dev/null
            # SHOW PROGRESS. `make >/dev/null` printed nothing for fifteen
            # minutes, which is indistinguishable from a hang -- and it was
            # reported as one. A heartbeat costs nothing and makes a long step
            # legible.
            make -j"$(nproc)" > "$GITHUB_WORKSPACE/binutils-build.log" 2>&1 &
            mk=$!
            while kill -0 "$mk" 2>/dev/null; do
              sleep 30
              printf '    [%s] still building: %s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(tail -1 "$GITHUB_WORKSPACE/binutils-build.log" | cut -c1-90)"
            done
            wait "$mk" || {
              echo "  binutils build FAILED -- last 20 lines:"
              tail -20 "$GITHUB_WORKSPACE/binutils-build.log" | sed 's/^/    /'
              exit 1
            }
            make install > /dev/null
            cd "$GITHUB_WORKSPACE"
            # --- LLVM, prebuilt for Linux ARM64: we need one binary from it.
            curl -fsSL --retry 3 --max-time 900 \
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VER/LLVM-$LLVM_VER-Linux-ARM64.tar.xz" \
              -o src/llvm.tar.xz
            tar -C src -xf src/llvm.tar.xz
            for t in llvm-objdump llvm-mc; do
              cp "$(find src -name "$t" -type f | head -1)" "$P/bin/"
            done
          fi
          echo "  --- versions now pinned ---"
          "$P/bin/as" --version | head -1 | sed 's/^/    /'
          "$P/bin/objdump" --version | head -1 | sed 's/^/    /'
          "$P/bin/llvm-objdump" --version | grep -i version | head -1 | sed 's/^/    /'
          "$P/bin/llvm-mc" --version | grep -i version | head -1 | sed 's/^/    /'
          echo "  --- what the runner would have given us ---"
          as --version | head -1 | sed 's/^/    /'

      - name: 'LEG 1: assemble the source with BOTH assemblers'
        run: |
          set -eu
          . tools/ab.sh
          # THE FIRST LEG OF THE TRIANGLE. Everything else verifies a binary
          # that ONE assembler produced. If that assembler encodes something
          # its own disassembler decodes back the same way, the round-trip is
          # self-consistent and still wrong. Two independent assemblers
          # producing identical .text removes that hole.
          #
          # GNU ld links both, so the ASSEMBLER is the only variable.
          "$P/bin/as" -o s0-gnu.o "$SRC"
          "$P/bin/llvm-mc" -triple=aarch64-linux-gnu -filetype=obj \
            -o s0-llvm.o "$SRC" 2> llvm-mc.err || true
          ab_rule 'LEG 1 -- source assembled two ways'
          ab_art 'source' "$SRC"
          if [ ! -s s0-llvm.o ]; then
            echo "    llvm-mc could not assemble the source:"
            head -6 llvm-mc.err | sed 's/^/      /'
            echo "    (GNU-as directives it may not share -- a finding, not a"
            echo "     blocker; the rest of the checks continue on the GNU build)"
          else
            for t in gnu llvm; do
              "$P/bin/objcopy" -O binary --only-section=.text "s0-$t.o" "s0-$t.text"
              ab_art "  .text via $t" "s0-$t.text"
            done
            if cmp -s s0-gnu.text s0-llvm.text; then
              echo "    IDENTICAL -- two independent assemblers agree on every byte."
            else
              echo "    DIFFER at byte $(cmp s0-gnu.text s0-llvm.text 2>&1 | sed 's/.*byte //; s/,.*//')"
              echo "    Two assemblers disagreeing about what the source MEANS is"
              echo "    a finding about the source, not about either tool."
            fi
          fi

      - name: 'CENSUS: what forms does stage0-as''s own source use?'
        run: python3 tools/s0_selfhost.py census "$SRC"

      - name: 'PROBE: settle every form against the real binary'
        run: |
          set -eu
          python3 tools/s0_selfhost.py probes "$SRC" probes
          echo
          printf '  %-6s %-34s %5s  %s\n' 'MNEM' 'OPERAND FORM' 'USES' 'VERDICT'
          ok=0; bad=0; rej=0; inc=0; lines_ok=0; lines_tot=0
          while IFS="$(printf '\t')" read -r id uses mnem form; do
            lines_tot=$((lines_tot + uses))
            # REFERENCE: GNU as. If IT cannot assemble the case, the case is
            # bad and proves nothing about stage0-as -- say INCONCLUSIVE rather
            # than blaming our assembler for our own test.
            if ! as -o "probes/$id.o" "probes/$id.s" 2>"probes/$id.aserr"; then
              printf '  %-6s %-34s %5s  INCONCLUSIVE (GNU as rejected the case)\n' \
                "$mnem" "$form" "$uses"
              inc=$((inc + 1)); continue
            fi
            objcopy -O binary --only-section=.text "probes/$id.o" "probes/$id.ref"
            set +e
            ./stage0-as < "probes/$id.s0" > "probes/$id.ours" 2>"probes/$id.err"
            rc=$?
            set -e
            if [ "$rc" != 0 ] || [ ! -s "probes/$id.ours" ]; then
              printf '  %-6s %-34s %5s  REJECTED by stage0-as (rc=%s)\n' \
                "$mnem" "$form" "$uses" "$rc"
              rej=$((rej + 1)); continue
            fi
            # compare only the instruction under test: the first four bytes
            dd if="probes/$id.ref"  of="probes/$id.r4" bs=4 count=1 2>/dev/null
            dd if="probes/$id.ours" of="probes/$id.o4" bs=4 count=1 2>/dev/null
            # THIRD OPINION: the bench model. spikes/bench/s0as.py is what
            # local development is written against, and its README already
            # records two real bugs it masked. Run 1 measured a three-way
            # disagreement on `mov w0 w1` -- bench aa0103e0, stage0-as
            # d2800000, GNU as 2a0103e0 -- and `sub w0 w1 w2` where the model
            # is correctly strict and the real assembler silently emits a
            # different instruction. An inner loop that disagrees with ground
            # truth is worse than no inner loop, so print it every run.
            ours_hex=$(od -An -tx1 "probes/$id.o4" | tr -d ' \n')
            bench=$(python3 tools/s0_bench_check.py "$(head -1 "probes/$id.s0")")
            if [ "$bench" = "$ours_hex" ]; then bmark='bench=same'
            elif [ "$bench" = raise ]; then bmark='bench=REJECTS'
            else bmark="bench=DIFFERS($bench)"; fi
            if cmp -s "probes/$id.r4" "probes/$id.o4"; then
              printf '  %-6s %-30s %5s  ok     %s\n' \
                "$mnem" "$form" "$uses" "$bmark"
              ok=$((ok + 1)); lines_ok=$((lines_ok + uses))
            else
              printf '  %-6s %-30s %5s  WRONG  ours=%s ref=%s  %s\n' \
                "$mnem" "$form" "$uses" "$ours_hex" \
                "$(od -An -tx1 "probes/$id.r4" | tr -d ' \n')" "$bmark"
              bad=$((bad + 1))
            fi
          done < probes/index.tsv
          echo
          echo "  forms: $ok ok, $bad wrong bytes, $rej rejected, $inc inconclusive"
          echo "  source lines covered by forms that encode correctly: $lines_ok / $lines_tot"
          echo
          echo "  WRONG BYTES is the interesting column. A rejected form is a"
          echo "  missing feature; a form that is accepted and encodes DIFFERENTLY"
          echo "  is a bug, and it would have been silently inherited by every"
          echo "  binary a self-hosted stage0-as ever produced."
          echo "$lines_ok" > lines_ok.txt

      - name: 'PROBE: does stage0-as ever say no?'
        run: |
          set -eu
          # RUN 1 FOUND 0 REJECTED OUT OF 43 FORMS. stage0-as accepts everything
          # and emits something for input it does not understand. `b.gt` comes
          # out as `b.ge` -- cond 0xa, not 0xc -- because the mnemonic match
          # stops after `b.g`; `mov w0 w1` comes out as `movz x0, #0` because
          # `w1` falls through to the immediate parser and reads as zero.
          #
          # Nothing above stage0-as emits those forms today: stage1-as.s0 and
          # stage2-mini-c.s1 contain no b.gt or b.le, which is why the ladder is
          # correct and 426/426 holds. But stage0-as's OWN source uses them
          # eight times, so a self-host attempt would have assembled cleanly and
          # produced an assembler with eight inverted comparisons inside it.
          #
          # An assembler that guesses cannot be measured -- you cannot tell a
          # missing feature from a wrong answer without byte-comparing every
          # instruction, which is why this sat undiscovered. Fix this BEFORE
          # adding forms and the table above becomes a progress meter.
          accepted=0; n=0
          # Labels are ONE character (symtab is indexed by byte value), so the
          # target is `t`, not `tgt`. With `tgt` these cases were rejected for
          # the wrong reason -- the stray `gt` line -- which would have masked a
          # regression in the checks they are actually here to make.
          for junk in 'frobnicate x0 x1' 'b.zz t' 'mov' 'mov q0 q1' \
                      'add x0' 'ldr x0 x1 x2 x3' '.quad 7'; do
            n=$((n + 1))
            printf '%s\n:t\n' "$junk" > junk.s0
            set +e
            ./stage0-as < junk.s0 > junk.bin 2>/dev/null
            rc=$?
            set -e
            sz=$(wc -c < junk.bin 2>/dev/null || echo 0)
            if [ "$rc" = 0 ]; then
              printf '  %-22s ACCEPTED rc=0, emitted %s bytes   <-- silent\n' \
                "$junk" "$sz"
              accepted=$((accepted + 1))
            else
              printf '  %-22s rejected rc=%s\n' "$junk" "$rc"
            fi
          done
          echo
          echo "  $accepted of $n nonsense inputs accepted silently. Target is 0."

      - name: 'ROUND-TRIP: do the bytes disassemble back to the source?'
        run: |
          set -eu
          # THIS IS THE CHECK THE WHOLE TRUST STORY RESTS ON, AND IT HAD NEVER
          # BEEN RUN ON THIS BINARY. TRUST-BOUNDARY.md says the assembler is
          # untrusted by design and README.md says the seed is verified against
          # its source by round-trip disassembly rather than trusted -- but
          # stage0-roundtrip.yml only ever disassembled
          # spikes/stage0-arm64/stage0-handencoded.aarch64.s, eight `.inst`
          # words proving the METHOD. The 695-instruction assembler the ladder
          # actually stands on was never checked.
          #
          # It matters most now: the plan is to COMMIT this binary and verify it
          # by disassembly. A committed binary whose disassembly nobody has
          # compared to the source is exactly the opaque artifact the project
          # exists to avoid.
          # BOTH DISASSEMBLERS, PINNED. Agreeing with one decoder proves the
          # source matches that decoder's opinion; it does not prove the opinion
          # is right. Two independent implementations agreeing is the stronger
          # claim, and it is the one a committed seed needs.
          "$P/bin/objdump" -d stage0-as > stage0-as.dis
          "$P/bin/llvm-objdump" -d stage0-as > stage0-as.llvm.dis

          echo "  --- A. MECHANICAL: disassemble, REASSEMBLE, compare bytes ---"
          # Unambiguous by construction: it proves the disassembly denotes the
          # same machine code, whatever spelling it chose. It does NOT prove the
          # disassembly resembles our source, which is check B.
          #
          # The first attempt piped objdump's text straight into `as` and it
          # choked on `adr x19,410dd4` and `b.le 4000e8` -- a bare hex address
          # is not a label, and stripping the `<symbol>` annotation had removed
          # the only thing that made it one. So give every instruction a label
          # derived from its own address and rewrite targets to match: all
          # labels then move together and PC-relative encodings are preserved.
          # Compare against the LINKED .text, which is what was disassembled.
          "$P/bin/objcopy" -O binary --only-section=.text stage0-as orig.bin
          # Read .text's VMA rather than guessing it from the first instruction.
          tbase=$("$P/bin/objdump" -h stage0-as \
                  | awk '$2==".text"{print $4; exit}')
          echo "    .text VMA 0x$tbase, $(wc -c < orig.bin) bytes"
          python3 tools/s0_roundtrip.py relist stage0-as.dis orig.bin redis.s "$tbase"

          # TWO ASSEMBLERS, NOT ONE. Round-tripping through the same toolchain
          # that produced the binary is a weak check -- a systematic quirk would
          # cancel itself out. Feeding one disassembly to two independent
          # assemblers and requiring both to reproduce the original bytes does
          # not have that hole. The THIRD assembler is stage0-as itself, which
          # is the self-host gate at the bottom of this file: it needs the .s0
          # translation, and the probe table above says how far that is from
          # complete.
          # set +e FOR THE WHOLE LOOP. The previous version ran the assembler
          # under `set -eu`, so a failed assembly killed the step before the
          # branch that reports WHY -- exit 1, no diagnostic, nothing to read.
          # A verification step that cannot describe its own failure is not
          # much of a verification step.
          fail_a=0
          set +e
          for tool in gnu llvm; do
            case "$tool" in
              gnu)  "$P/bin/as" -o "redis-$tool.o" redis.s 2>"redis-$tool.err" ;;
              llvm) "$P/bin/llvm-mc" -triple=aarch64-linux-gnu -filetype=obj \
                      -o "redis-$tool.o" redis.s 2>"redis-$tool.err" ;;
            esac
            if [ ! -s "redis-$tool.o" ]; then
              echo "    $tool: ASSEMBLY FAILED"
              head -4 "redis-$tool.err" | sed 's/^/      /'
              fail_a=$((fail_a + 1)); continue
            fi
            # LINK AT THE ORIGINAL VMA. The out-of-.text targets are absolute
            # `.set`s, so the PC-relative arithmetic in `adr` is only right if
            # the section sits where it sat in the original. Assembling alone
            # left `adr x19, inbuf` pointing at zero -- the same silent
            # zero-immediate failure as the .ascii case, one section further
            # out. GNU ld does the linking for BOTH so the ASSEMBLER is the
            # only variable between the two arms.
            # --defsym for every target outside .text; the assembler left them
            # undefined on purpose so the LINKER computes the displacement.
            set -- -Ttext="$(cat redis.s.base)" --entry=0
            while read -r d; do set -- "$@" --defsym "$d"; done < redis.s.defs
            "$P/bin/ld" "$@" -o "redis-$tool.elf" "redis-$tool.o" \
              2>"redis-$tool.lderr" || {
                echo "    $tool: LINK FAILED"
                head -4 "redis-$tool.lderr" | sed 's/^/      /'
                fail_a=$((fail_a + 1)); continue; }
            "$P/bin/objcopy" -O binary --only-section=.text \
              "redis-$tool.elf" "redis-$tool.bin"
            if cmp -s "redis-$tool.bin" orig.bin; then
              printf '    %-5s PASS  %s bytes reproduce the original exactly\n' \
                "$tool" "$(wc -c < "redis-$tool.bin")"
            else
              off=$(cmp "redis-$tool.bin" orig.bin 2>&1 | sed 's/.*differ: byte //; s/,.*//')
              printf '    %-5s DIFFERS at byte %s (sizes %s vs %s)\n' "$tool" "$off" \
                "$(wc -c < "redis-$tool.bin")" "$(wc -c < orig.bin)"
              fail_a=$((fail_a + 1))
            fi
          done
          set -e
          if [ "$fail_a" = 0 ]; then
            echo "    both assemblers reproduce the binary from its own disassembly."
          fi
          . tools/ab.sh
          # SAY WHETHER IT MATCHES; DO NOT MAKE THE READER COMPARE HEX STRINGS.
          # The reassembled .text shas were already equal to the original's, but
          # nothing in the output said so -- the claim rested on someone noticing
          # the same 16 characters three times. A verification step should state
          # its verdict.
          verdict() {   # verdict <label> <file> <reference-or-->
            _v='-'
            if [ "$3" != '-' ] && [ -f "$2" ] && [ -f "$3" ]; then
              if cmp -s "$2" "$3"; then _v='MATCHES the original'
              else _v='DIFFERS'; fi
            elif [ "$3" = 'n/a' ]; then _v='n/a -- different text layout'
            fi
            printf '  %-26s %12s  %-16s  %s\n' "$1" \
              "$(ab_size "$2")" "$(ab_sha "$2")" "$_v"
          }
          printf '\n  === EVERY ARTIFACT IN THE ROUND TRIP ===\n'
          printf '  %-26s %12s  %-16s  %s\n' 'ARTIFACT' 'BYTES' 'SHA256[0:16]' 'vs ORIGINAL .text'
          verdict 'source .s'            "$SRC"               -
          verdict 'binary stage0-as'     stage0-as            -
          verdict '  .text extracted'    orig.bin             orig.bin
          verdict 'disasm objdump'       stage0-as.dis        n/a
          verdict 'disasm llvm-objdump'  stage0-as.llvm.dis   n/a
          verdict 'relisted .s'          redis.s              -
          verdict 'reasm .text via gnu'  redis-gnu.bin        orig.bin
          verdict 'reasm .text via llvm' redis-llvm.bin       orig.bin
          echo
          echo "  --- A2. THE WHOLE BINARY, NOT JUST .text ---"
          # .text matching is a real result but it is not the claim a committed
          # seed needs: the artifact that gets committed is the whole file, and
          # an ELF whose .text is verified while its e_entry is not has an
          # unverified field deciding what actually runs. So reconstruct
          # everything the disassembly can account for -- real symbol names,
          # .rodata bytes, .bss sizes, global bindings -- link it the same way,
          # and compare the files.
          "$P/bin/objdump" -t stage0-as > stage0-as.syms
          "$P/bin/objdump" -h stage0-as > stage0-as.secs
          "$P/bin/objcopy" -O binary --only-section=.rodata stage0-as \
            rodata.bin 2>/dev/null || : > rodata.bin
          set +e
          python3 tools/s0_rebuild.py stage0-as.dis stage0-as.syms \
            stage0-as.secs rodata.bin rebuild.s
          # SEPARATE THE TWO STDERRs AND SHOW THE ERRORS, NOT THE FIRST FIVE
          # LINES. The previous version merged assembler and linker output and
          # printed head -5, which was three harmless `.space 0` warnings --
          # so the run reported "rebuild did not assemble/link" and then showed
          # nothing about why. Which of the two failed was not even visible.
          _asok=0; _ldok=0
          # ASSEMBLE TO THE SAME OBJECT NAME. `as` records the object it was
          # asked to produce as a FILE symbol, so `-o rebuild.o` put
          # "rebuild.o" where the original has "s0.o" -- a 24-byte symbol slot
          # matching, a strtab differing. Reproducing a build means reproducing
          # its output names too; a subdirectory keeps it clear of the real one.
          # THE FILE SYMBOL NAMES THE OBJECT THE *LINKER* WAS GIVEN. Assembling
          # to rb/s0.o and then copying it back to rebuild.o before linking
          # undid the fix one line later -- ld saw "rebuild.o" and recorded it.
          # Assemble AND link inside rb/, referring to the object by the bare
          # name the original build used.
          mkdir -p rb && cp rebuild.s rb/ 2>/dev/null || true
          ( cd rb && "$P/bin/as" -o s0.o rebuild.s ) 2>rebuild.as.err && _asok=1
          if [ "$_asok" = 1 ]; then
            set -- 
            while read -r a; do set -- "$@" "$a"; done < rebuild.s.secs
            echo "    linking at the original addresses: $*"
            ( cd rb && "$P/bin/ld" "$@" -o ../rebuild.elf s0.o ) \
              2>rebuild.ld.err && _ldok=1
          fi
          if [ "$_asok" = 0 ] || [ "$_ldok" = 0 ]; then
            [ "$_asok" = 0 ] && echo "    ASSEMBLER failed:" \
                             || echo "    assembler ok; LINKER failed:"
            for _e in rebuild.as.err rebuild.ld.err; do
              [ -s "$_e" ] || continue
              echo "    --- $_e"
              grep -i -m6 'error\|undefined\|overlap\|out of range' "$_e" \
                | sed 's/^/      /' || tail -6 "$_e" | sed 's/^/      /'
            done
          fi
          if [ "$_ldok" = 1 ]; then
            printf '    %-26s %12s  %-16s  %s\n' 'binary stage0-as' \
              "$(wc -c < stage0-as)" "$(sha256sum stage0-as | cut -c1-16)" 'the original'
            _v='DIFFERS'
            cmp -s rebuild.elf stage0-as && _v='MATCHES the original'
            printf '    %-26s %12s  %-16s  %s\n' 'binary REASSEMBLED' \
              "$(wc -c < rebuild.elf)" "$(sha256sum rebuild.elf | cut -c1-16)" "$_v"
            if [ "$_v" = DIFFERS ]; then
              echo "    per-section, to localise it:"
              for sec in .text .rodata; do
                "$P/bin/objcopy" -O binary --only-section=$sec stage0-as \
                  "o$sec.bin" 2>/dev/null || : > "o$sec.bin"
                "$P/bin/objcopy" -O binary --only-section=$sec rebuild.elf \
                  "r$sec.bin" 2>/dev/null || : > "r$sec.bin"
                if cmp -s "o$sec.bin" "r$sec.bin"; then
                  printf '      %-10s %8s bytes  identical\n' "$sec" "$(wc -c < "o$sec.bin")"
                else
                  printf '      %-10s %8s vs %-8s DIFFERS\n' "$sec" \
                    "$(wc -c < "o$sec.bin")" "$(wc -c < "r$sec.bin")"
                  # NAME THE FIRST DIFFERING INSTRUCTION. Two runs have now
                  # been spent guessing at why .text differs; the binaries are
                  # right here and can be asked. Print the offending word from
                  # each side, disassembled, so the cause is read rather than
                  # inferred.
                  _off=$(cmp "o$sec.bin" "r$sec.bin" 2>&1 \
                         | sed 's/.*differ: byte //; s/,.*//')
                  _ins=$(( (_off - 1) / 4 ))
                  _addr=$(printf '%x' $(( 0x$(sed -n "s/^-T${sec#.}=0x//p" \
                           rebuild.s.secs | head -1) + _ins * 4 )))
                  echo "        first difference at byte $_off = word $_ins, addr 0x$_addr"
                  echo "        original    : $(grep -m1 "^ *$_addr:" stage0-as.dis | sed 's/^ *//')"
                  "$P/bin/objdump" -d rebuild.elf > rebuild.dis 2>/dev/null || true
                  echo "        reassembled : $(grep -m1 "^ *$_addr:" rebuild.dis | sed 's/^ *//')"
                fi
              done
                # STOP REASONING ABOUT ELF STRUCTURE SIZES AND LOOK AT THE BYTES.
              # The last several rounds were spent inferring causes that the two
              # files could have been asked about directly. Compare them.
              echo
              echo "    --- where do the two files actually differ? ---"
              "$P/bin/objdump" -h rebuild.elf > rebuild.secs 2>/dev/null || true
              "$P/bin/objdump" -t rebuild.elf > rebuild.syms 2>/dev/null || true
              # AN EMPTY DIFF IS NOT EVIDENCE OF A MATCH IF THE PROBE NEVER
              # LOOKED. The previous version compared `objdump -h`, which lists
              # only allocatable sections -- .text .rodata .bss -- so .symtab,
              # .strtab and .shstrtab were never in the comparison, and both
              # diffs came back empty while the files differed by 24 bytes.
              # readelf -S and -s list every section header and every symbol.
              # The COUNTS are printed too, because "the diff was empty" and
              # "there was nothing to diff" look identical in a log.
              for _w in S s; do
                "$P/bin/readelf" -W -$_w stage0-as   > "o.$_w.txt" 2>/dev/null || true
                "$P/bin/readelf" -W -$_w rebuild.elf > "r.$_w.txt" 2>/dev/null || true
              done
              echo "    section headers: original $(grep -c '^  \[' o.S.txt) vs rebuilt $(grep -c '^  \[' r.S.txt)"
              diff <(awk '/^  \[/ {print $3, $6, $7}' o.S.txt) \
                   <(awk '/^  \[/ {print $3, $6, $7}' r.S.txt) \
                | head -14 | sed 's/^/      /'
              echo "    symbols: original $(grep -c '^ *[0-9]*:' o.s.txt) vs rebuilt $(grep -c '^ *[0-9]*:' r.s.txt)"
              diff <(awk '/^ *[0-9]+:/ {print $2, $4, $5, $8}' o.s.txt | sort) \
                   <(awk '/^ *[0-9]+:/ {print $2, $4, $5, $8}' r.s.txt | sort) \
                | head -14 | sed 's/^/      /'
              echo "    first 12 differing bytes (a size change cascades, so"
              echo "    the first offset is the meaningful one):"
              cmp -l stage0-as rebuild.elf 2>/dev/null | head -12 \
                | while read -r off a b; do
                    printf '      offset %-8s original 0%-4s rebuilt 0%s\n' "$off" "$a" "$b"
                  done
              _fd=$(cmp stage0-as rebuild.elf 2>&1 | sed 's/.*differ: byte //; s/,.*//')
              echo "    first difference at byte $_fd; sections and their file offsets:"
              awk '$2 ~ /^\./ {printf "      %-12s size %-8s file-off %s\n", $2, $3, $6}' \
                stage0-as.secs
              echo "    A section-level match with a named metadata difference is a"
              echo "    far more precise statement than \"we only checked .text\"."
            fi
          fi
          set -e
          echo
          echo "  SCOPE, STATED PLAINLY. What is compared is the .text SECTION,"
          echo "  not the whole ELF. The reassembled object carries our own"
          echo "  address-derived labels rather than the original symbol names,"
          echo "  has no .bss, and its section headers differ -- so a whole-file"
          echo "  comparison would fail for reasons that say nothing about the"
          echo "  code. The claim being made is: THE CODE IS REPRODUCED EXACTLY."
          echo "  The ELF container is not reconstructed and is not claimed to be."
          echo
          echo "  The two DISASSEMBLY FILES have different shas and must: they are"
          echo "  different text layouts of the same instruction stream. Equality"
          echo "  there is asserted on the stream, by check C."
          echo
          echo "  --- B. AUDITABLE: does a human see what the source says? ---"
          # THE RATCHET. $ROUNDTRIP_BUDGET is how many instructions currently
          # fail to read back as written. It may fall and must never rise.
          # RUN ALL THREE, THEN DECIDE. The first version let the budget check
          # exit non-zero in the middle of a `set -eu` step, so a failure
          # against GNU objdump meant the llvm-objdump run and the cross-check
          # never happened at all -- the two most informative checks were
          # skipped precisely when something was wrong. Collect, then fail.
          rc_gnu=0; rc_llvm=0
          echo "  ...against GNU objdump $BINUTILS_VER:"
          set +e
          python3 tools/s0_roundtrip.py "$SRC" stage0-as.dis \
            --budget "$ROUNDTRIP_BUDGET"; rc_gnu=$?
          echo
          echo "  ...against llvm-objdump $LLVM_VER:"
          python3 tools/s0_roundtrip.py "$SRC" stage0-as.llvm.dis \
            --budget "$ROUNDTRIP_BUDGET"; rc_llvm=$?
          echo
          echo "  --- E. PLAIN DIFF: canonical source vs canonical disassembly ---"
          # THE COMMENT CARRIES THE READABILITY; THE CODE CARRIES THE EXACTNESS.
          # Keep the commented file as the human artifact, strip it to a
          # canonical form, and round-trip THAT. Anywhere exactness costs
          # readability -- writing `#65` where `#'"'"'A'"'"'` reads better -- the reason
          # goes in a comment directly above the line, which survives in the
          # source and disappears from the comparison.
          #
          # The result is a `diff` of two files rather than a semantic
          # comparison decided by a normaliser. That matters because a
          # normaliser that is itself wrong manufactures findings in the thing
          # being measured, which happened twice here already.
          #
          # Only things that emit no instruction are removed, from both sides
          # by the same rules. Immediates and mnemonics pass through untouched:
          # if the source says #0 and the decoder says #0x0, that is a REAL
          # difference and must appear in the diff.
          "$P/bin/objdump" -d --no-show-raw-insn --no-addresses stage0-as \
            > canon-gnu.dis 2>/dev/null || \
            "$P/bin/objdump" -d --no-show-raw-insn stage0-as > canon-gnu.dis
          # NO --no-print-imm-hex. Hex is llvm-objdump's DEFAULT -- made so in
          # 2022 explicitly to bring it in line with GNU objdump -- and forcing
          # decimal is what drove the two decoders apart in the first place.
          # GNU prints hex unconditionally, so hex is the only base where a
          # SINGLE source style can satisfy both, and that is worth far more
          # than matching whichever base the source happens to use today.
          "$P/bin/llvm-objdump" -d --no-show-raw-insn --no-leading-addr \
            stage0-as > canon-llvm.dis 2>/dev/null || \
            "$P/bin/llvm-objdump" -d --no-show-raw-insn stage0-as > canon-llvm.dis
          python3 tools/s0_canon.py source "$SRC" > canon-src.txt
          for t in gnu llvm; do
            python3 tools/s0_canon.py disasm "canon-$t.dis" > "canon-$t.txt"
            n=$(diff "canon-src.txt" "canon-$t.txt" | grep -c '^[<>]' || true)
            if [ "$n" = 0 ]; then
              printf '    %-5s IDENTICAL -- %s canonical lines, plain diff clean\n' \
                "$t" "$(wc -l < canon-src.txt)"
            else
              printf '    %-5s %s differing lines of %s\n' "$t" "$n" \
                "$(wc -l < canon-src.txt)"
              # CLASSIFY, DO NOT JUST PRINT THE FIRST TWELVE. The raw head of a
              # diff shows whichever class happens to come first and hides the
              # rest -- which is how 492 and 274 differing lines got read as
              # "the immediate base" when the source's own mix predicts 255 and
              # 132. The gap between predicted and observed is a class nobody
              # has named, and a decision made without it is a guess.
              python3 tools/s0_canon.py classify canon-src.txt "canon-$t.txt" \
                | sed 's/^/      /'
            fi
          done
          echo
          echo "  --- E2. DO THE TWO CANONICAL DISASSEMBLIES MATCH EACH OTHER? ---"
          # THE QUESTION THAT DECIDES WHETHER ONE SOURCE STYLE CAN SATISFY BOTH.
          # Checks B and C compare NORMALISED instruction streams, so they say
          # the decoders agree about meaning. This asks whether they agree
          # CHARACTER FOR CHARACTER once both are canonicalised -- because if
          # they do not, no source text exists that both will diff clean
          # against, and the plain-diff goal has to pick one decoder and say so.
          ndd=$(diff canon-gnu.txt canon-llvm.txt | grep -c '^[<>]' || true)
          if [ "$ndd" = 0 ]; then
            echo "    IDENTICAL -- one source style can satisfy BOTH decoders."
          else
            echo "    $ndd differing lines between the two decoders:"
            python3 tools/s0_canon.py classify canon-gnu.txt canon-llvm.txt \
              | sed 's/^/      /'
            echo "    Classes here are decoder-vs-decoder, nothing to do with our"
            echo "    source. Anything left is a hard limit on matching both."
          fi
          echo
          echo "  Each difference is either a decoder flag we have not set or a"
          echo "  source line to rewrite WITH A COMMENT saying why. Neither is"
          echo "  something to paper over in the comparison."
          echo

          echo "  --- D0. CAN THE DECODERS BE ASKED TO PRINT OUR SPELLING? ---"
          # I claimed the formatting differences were unfixable presentation
          # choices. That was answered from memory and it was wrong: both tools
          # have options that change exactly those choices, most importantly
          # llvm-objdump's --no-print-imm-hex (hex has been its default since
          # 2022, and the flag turns it off). So MEASURE the option space rather
          # than assert a ceiling. Each flag is probed against --help first, so
          # an unsupported one is reported instead of failing the run.
          try_opts() {   # try_opts <tool> <binpath> <label> <opts...>
            _t="$1"; _b="$2"; _l="$3"; shift 3
            for f in "$@"; do
              case "$f" in -*)
                # PROBE THE FLAG, DO NOT GREP THE HELP. `objdump --help` does
                # not necessarily spell every option the way the command line
                # takes it, and the previous grep declared GNU's
                # --no-show-raw-insn unsupported when it plainly is. Running it
                # on a trivial input answers the question directly.
                "$_b" -d "$f" stage0-as >/dev/null 2>&1 || {
                  printf '    %-34s flag %s not accepted\n' "$_l" "$f"
                  return; } ;;
              esac
            done
            "$_b" -d "$@" stage0-as > "opt-$_t.dis" 2>/dev/null || {
              printf '    %-34s FAILED to run\n' "$_l"; return; }
            # USE THE CANONICALISER, NOT THE VERBATIM PROBE. The probe's line
            # pattern requires a leading address, so the moment --no-addresses
            # or --no-leading-addr does its job the parser sees zero
            # instructions and reports "0 of 0 (0.0%)" -- a perfect score for
            # an empty comparison. s0_canon.py reads both layouts.
            python3 tools/s0_canon.py disasm "opt-$_t.dis" > "opt-$_t.txt"
            _n=$(diff canon-src.txt "opt-$_t.txt" | grep -c '^[<>]' || true)
            _l2=$(wc -l < "opt-$_t.txt")
            printf '    %-34s %s lines, %s differing\n' "$_l" "$_l2" "$_n"
          }
          echo "  GNU objdump $BINUTILS_VER:"
          try_opts g1 "$P/bin/objdump" "plain -d"                     
          try_opts g2 "$P/bin/objdump" "+no-show-raw-insn"  --no-show-raw-insn
          try_opts g3 "$P/bin/objdump" "+no-addresses"      --no-show-raw-insn --no-addresses
          echo "  llvm-objdump $LLVM_VER:"
          try_opts l1 "$P/bin/llvm-objdump" "plain -d"
          try_opts l2 "$P/bin/llvm-objdump" "+no-show-raw-insn" --no-show-raw-insn
          try_opts l3 "$P/bin/llvm-objdump" "+no-leading-addr"  --no-show-raw-insn --no-leading-addr
          try_opts l4 "$P/bin/llvm-objdump" "+no-print-imm-hex" --no-show-raw-insn --no-leading-addr --no-print-imm-hex
          echo
          echo "  The last row is the interesting one: --no-print-imm-hex prints"
          echo "  decimal immediates, which is what the source writes. If it moves"
          echo "  the number materially, the remaining gap is small enough that"
          echo "  writing the source to match is worth considering."
          echo

          echo "  --- D. HOW CLOSE IS THE TEXT, BEFORE NORMALISING? ---"
          # Check B asks "does a human read the same meaning". This asks the
          # stricter question: does the disassembly come back CHARACTER FOR
          # CHARACTER as the source wrote it? It will not, and not because
          # anything is wrong -- objdump and llvm-objdump choose their own
          # number formats, their own target rendering, their own spacing, and
          # nothing on the source side can influence that.
          #
          # It is measured because it is the SPECIFICATION for the hand-written
          # disassembler TRUST-BOUNDARY.md calls "small and diverse-
          # implementable". Whatever classes appear here are exactly the
          # formatting rules ours would adopt to make the round-trip a plain
          # `diff` rather than a normalised comparison.
          echo "  objdump $BINUTILS_VER:"
          python3 tools/s0_roundtrip.py verbatim "$SRC" stage0-as.dis
          echo "  llvm-objdump $LLVM_VER:"
          python3 tools/s0_roundtrip.py verbatim "$SRC" stage0-as.llvm.dis
          echo
          echo "  --- C. DO THE TWO DISASSEMBLERS AGREE WITH EACH OTHER? ---"
          python3 tools/s0_roundtrip.py crosscheck stage0-as.dis stage0-as.llvm.dis
          set -e
          echo
          if [ "$rc_gnu" != 0 ] || [ "$rc_llvm" != 0 ]; then
            echo "  round-trip budget exceeded (gnu rc=$rc_gnu, llvm rc=$rc_llvm)"
            exit 1
          fi
          echo "  both decoders within budget."

      - name: 'ROUND-TRIP: elf, the OTHER binary as+ld builds'
        continue-on-error: true
        run: |
          set -eu
          # stage3-hermetic-arm64 runs four host-tool commands and TWO are for
          # elf. Committing a verified stage0-as while elf still needs `as` and
          # `ld` would not move BUDGET_PATH at all -- it is both or neither, and
          # elf has never been round-tripped.
          #
          # The checks live in tools/roundtrip.sh rather than being copied from
          # the block above: every lesson in that block is specific to nothing
          # about stage0-as, and a copy would drift with the copy staying green.
          # Non-gating for now -- elf's own gap is measured first.
          chmod +x tools/roundtrip.sh
          tools/roundtrip.sh spikes/elf/elf.aarch64.s elf "$P" || true

      - name: 'REGRESSION: does this stage0-as still build stage 1 and stage 2?'
        run: |
          set -eu
          # THE QUESTION IS NOT "DOES IT STILL BUILD". Every change queued for
          # stage0-as moves the bytes of stage1 and stage2, because both use the
          # affected forms -- measured, not assumed:
          #
          #     mov  W i    57     cmp  W i    39     mov  W X   14
          #     ldrb W X X 162     str  W X    86     ldr  W X   64
          #
          # Fixing the sf bit re-encodes ~110 instructions that already exist in
          # the ladder. They will assemble. The question is whether they still
          # MEAN the same thing, and a green build does not answer that.
          #
          # So two checks, in order:
          #   1. bytes vs LADDER-BASELINE   -- did anything move, and what
          #   2. emitted assembly           -- does stage 2 still produce the
          #                                    SAME OUTPUT for the same input
          # (2) is the one that matters. stage2's own binary may legitimately
          # change while what it emits must not.
          B=spikes/stage0-as/LADDER-BASELINE.txt
          ./stage0-as < spikes/stage1-as/stage1-as.s0 | ./elf stage1
          ./stage1 < spikes/stage2-mini-c/stage2-mini-c.s1 | ./stage0-as | ./elf stage2
          [ -x stage1 ] && [ -x stage2 ] || { echo "  FAIL: ladder did not build"; exit 1; }

          moved=0
          for a in stage0-as elf stage1 stage2; do
            want=$(awk -v n="$a" '$1==n {print $3}' "$B")
            got=$(sha256sum "$a" | cut -c1-16)
            sz=$(wc -c < "$a")
            if [ "$want" = "$got" ]; then
              printf '  %-10s %8s  %s  unchanged\n' "$a" "$sz" "$got"
            else
              printf '  %-10s %8s  %s  MOVED (baseline %s)\n' "$a" "$sz" "$got" "$want"
              moved=$((moved + 1))
            fi
          done
          echo

          # BEHAVIOURAL EQUIVALENCE. Compile a fixed set of programs and hash
          # what stage 2 EMITS. These cover the forms most at risk from an sf-bit
          # or register-parsing change: byte loads, char compares, w-register
          # moves, shifts and calls.
          i=0; drift=0
          for prog in \
            'int main(){return 42;}' \
            'int main(){char c;c=65;return c;}' \
            'int main(){char s[4];s[0]=65;return s[0];}' \
            'int main(){int i;int s;s=0;i=0;while(i<5){s=s+i;i=i+1;}return s;}' \
            'int f(int n){if(n<2){return n;}return f(n-1)+f(n-2);}int main(){return f(10);}' \
            'int main(){char* s;s="hi";return s[0];}' \
            'int main(){return 12&10;}' \
            'int main(){return 1<<4;}'; do
            i=$((i + 1))
            printf '%s' "$prog" > r.c
            ./stage2 < r.c > "r$i.s"
            got=$(sha256sum "r$i.s" | cut -c1-16)
            want=$(awk -v n="emit-$i" '$1==n {print $3}' "$B")
            if [ -z "$want" ]; then
              printf '  emit-%-2s %8s  %s  (no baseline -- record it)\n' \
                "$i" "$(wc -c < "r$i.s")" "$got"
            elif [ "$want" = "$got" ]; then
              printf '  emit-%-2s %8s  %s  unchanged\n' \
                "$i" "$(wc -c < "r$i.s")" "$got"
            else
              printf '  emit-%-2s %8s  %s  CHANGED (baseline %s)\n' \
                "$i" "$(wc -c < "r$i.s")" "$got" "$want"
              drift=$((drift + 1))
            fi
          done
          echo
          if [ "$drift" != 0 ]; then
            echo "  FAIL: $drift of 8 emitted-output fingerprints CHANGED."
            echo "  stage 2 no longer produces the same assembly for the same input."
            echo "  That is a semantic change, not an encoding change. Do not"
            echo "  re-baseline it -- find out which instruction form moved, using"
            echo "  the per-form table above, and decide whether the new meaning is"
            echo "  the intended one. stage3-hermetic-arm64 on this commit is the"
            echo "  second opinion: it runs 426 conformance tests and the"
            echo "  byte-identical M2-Planet gate."
            exit 1
          fi
          echo "  all 8 emitted-output fingerprints unchanged -- behaviour preserved."
          echo
          if [ "$moved" = 0 ]; then
            echo "  $moved artifacts moved -- ladder byte-identical to baseline."
          else
            echo "  $moved artifact(s) moved. Expected while stage0-as is being"
            echo "  changed; NOT expected otherwise. Cross-check against the"
            echo "  stage3-hermetic-arm64 run for the same commit: it re-runs 426"
            echo "  conformance tests, the canon fixpoint, and the byte-identical"
            echo "  M2-Planet gate, and it is triggered by spikes/stage0-as/** so"
            echo "  it will already have run."
          fi

      - name: 'XLATE: mechanical GNU-as -> .s0 translation'
        run: |
          set -eu
          # Untranslatable lines are emitted as `### NEEDS: ...` markers, never
          # dropped. A translator that quietly skips what it does not understand
          # produces an assembler with a hole in it that assembles most things.
          python3 tools/s0_selfhost.py xlate "$SRC" stage0-as.s0
          echo
          echo "  first 20 translated lines:"
          grep -v '^###' stage0-as.s0 | head -20 | sed 's/^/    /'
          echo
          echo "  remaining NEEDS markers: $(grep -c '^###' stage0-as.s0 || true)"

      - name: 'PROBE: how far does the translation get through stage0-as?'
        continue-on-error: true
        run: |
          set -eu
          # Feed it the translatable subset alone. This will NOT produce a
          # working assembler while NEEDS markers remain -- the point is to see
          # whether stage0-as parses what we hand it, separately from whether
          # what we hand it is complete.
          grep -v '^###' stage0-as.s0 > partial.s0
          echo "  feeding $(wc -l < partial.s0) translated lines to stage0-as"
          set +e
          ./stage0-as < partial.s0 > partial.bin 2> partial.err
          rc=$?
          set -e
          echo "  stage0-as rc=$rc, emitted $(wc -c < partial.bin 2>/dev/null || echo 0) bytes"
          [ -s partial.err ] && head -5 partial.err | sed 's/^/    ! /'
          echo
          # THIS STEP'S ORIGINAL CONCLUSION WAS WRONG AND IS RETRACTED HERE.
          # It read "a clean rc means the syntax translation is right". Run 2
          # showed stage0-as returns rc=0 for `frobnicate x0 x1` -- and emits
          # ZERO bytes for it. An unrecognised line does not fail; it VANISHES.
          # So rc=0 says nothing at all, and neither does a plausible byte count.
          #
          # Until the rejection probe above reads 0, the only trustworthy signal
          # is the per-form byte comparison. Word count is printed as a weak
          # cross-check: instruction lines in, words out, and a shortfall means
          # lines were silently dropped.
          words=$(( $(wc -c < partial.bin 2>/dev/null || echo 0) / 4 ))
          instr=$(grep -cvE '^:|^\.' partial.s0 || true)
          echo "  instruction lines in: $instr   words out: $words"
          if [ "$words" -lt "$instr" ]; then
            echo "  SHORTFALL of $((instr - words)) -- that many lines were silently dropped."
          fi

      - name: 'GATE (off until the gap is zero): self-host and fixpoint'
        continue-on-error: true
        run: |
          set -eu
          if grep -q '^###' stage0-as.s0; then
            n=$(grep -c '^###' stage0-as.s0)
            echo "  SKIP: $n lines still need forms stage0-as does not take."
            echo "  This gate turns on by itself when that reaches zero. What it"
            echo "  will then assert, in order:"
            echo "    1. stage0-as assembles stage0-as.s0 -> gen1 code bytes"
            echo "    2. gen1 == objcopy -O binary of the as+ld build, byte for byte"
            echo "    3. gen1 assembles stage0-as.s0 again -> gen2; gen2 == gen1"
            echo "    4. gen1 still builds stage1 and stage2 to identical bytes"
            echo "  (2) is the one that matters: it proves the translation"
            echo "  preserved meaning, as a checksum rather than an argument."
            exit 0
          fi
          objcopy -O binary --only-section=.text s0.o reference.bin
          ./stage0-as < stage0-as.s0 > gen1.bin
          ./elf gen1 < gen1.bin || true
          printf '  %-24s %8s  %s\n' 'reference (as+ld .text)' \
            "$(wc -c < reference.bin)" "$(sha256sum reference.bin | cut -c1-16)"
          printf '  %-24s %8s  %s\n' 'gen1 (stage0-as on .s0)' \
            "$(wc -c < gen1.bin)" "$(sha256sum gen1.bin | cut -c1-16)"
          if cmp -s gen1.bin reference.bin; then
            echo "  PASS: stage0-as reproduces its own code bytes from .s0 source."
          else
            echo "  FAIL: the translation changed the emitted code."
            cmp gen1.bin reference.bin 2>&1 | head -2 | sed 's/^/    /'
            exit 1
          fi
          ./gen1 < stage0-as.s0 > gen2.bin
          cmp -s gen2.bin gen1.bin \
            && echo "  PASS: gen2 == gen1 -- FIXPOINT." \
            || { echo "  FAIL: not a fixpoint."; exit 1; }

      - name: 'WHERE THIS LEAVES THE HOST BUDGET'
        if: always()
        run: |
          echo "  stage3-hermetic-arm64 currently declares BUDGET_PATH='as ld'."
          echo
          echo "  Self-hosting stage0-as does NOT by itself remove them: something"
          echo "  must still produce the FIRST stage0-as binary. What it does buy"
          echo "  is the right to commit that binary, because a committed binary"
          echo "  that reproduces itself from committed source is checkable in a"
          echo "  way a committed binary alone is not:"
          echo
          echo "    round-trip disassembly   the bytes decode to the source we wrote"
          echo "    self-host fixpoint       the source rebuilds those exact bytes"
          echo
          echo "  Only then does removing 'as ld' from BUDGET_PATH mean anything."
          echo "  Doing it before would just move the trust off the build path and"
          echo "  into a binary nobody can check."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0-selfhost
          path: |
            stage0-as
            elf
            stage0-as.s0
            probes/index.tsv
          if-no-files-found: warn
