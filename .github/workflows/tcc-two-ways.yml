# tcc BUILT TWO WAYS, PUT THROUGH THE SAME TESTS.
#
# The gcc side is the CONTROL, and it runs first for a reason: if the harness
# is wrong, that is where it shows, on a compiler nobody doubts. Any result
# from the micro-c side is only worth reading once the same steps have
# succeeded on a tcc built by gcc.
#
# THREE THINGS ARE MEASURED, identically on both sides:
#
#   1. tcc's own test file        tcctest.c compiled, run, output diffed
#                                 against tests/tcctest.ref
#   2. SELF-COMPILATION FIXPOINT  gen1 = tcc built by the compiler under test
#                                 gen2 = tcc built by gen1
#                                 gen3 = tcc built by gen2
#                                 gen2 and gen3 should be byte-identical --
#                                 that is what "fixpoint" means, and it is a
#                                 much stronger statement than "it compiles"
#   3. size and sha256 of every generation
#
# WHAT IS EXPECTED. gcc's tcc should pass everything. micro-c's tcc is not
# expected to: `int` is eight bytes in micro-c, so every struct tcc lays out
# differs from what a normal compiler produces and every libc call crosses an
# ABI boundary wrongly; float, double and long double are one integer type.
# The value is in WHERE it stops and with what message, measured the same way
# as the control.
name: tcc two ways

on:
  push:
    paths:
      - 'spikes/stage3/**'
      - '.github/workflows/tcc-two-ways.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04-arm      # native aarch64; nothing is emulated
    timeout-minutes: 90
    env:
      M2PLANET_SHA: bd2fe4b0659fd0ad3f476a5ad0ef801bd134665d
      TCC_SHA:      5ec0e6f84b47ebd8c269b581712666313f5edaef
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git >/dev/null
          gcc --version | head -1

      - name: Fetch pinned tcc
        run: |
          set -eu
          git clone -q https://repo.or.cz/tinycc.git tcc-src \
            || git clone -q https://github.com/TinyCC/tinycc.git tcc-src
          git -C tcc-src checkout -q "$TCC_SHA"
          for p in spikes/stage3/patches/tcc-arm64-asm/[0-9]*.patch; do
            git -C tcc-src apply --ignore-whitespace "../$p" \
              || { echo "FAIL: $(basename "$p")"; exit 1; }
          done
          echo "  tcc $(git -C tcc-src rev-parse --short HEAD) + arm64 patches"

      # =================================================================
      # CONTROL: gcc builds tcc, and tcc is put through its own tests.
      # =================================================================
      - name: 'CONTROL: gcc builds tcc'
        run: |
          set -eu
          cp -r tcc-src gcc-tcc
          cd gcc-tcc
          ./configure --cc=gcc >/dev/null 2>&1
          make -j"$(nproc)" >/dev/null 2>&1 || make >/dev/null
          ls -l tcc | awk '{print "  gcc-built tcc: "$5" bytes"}'
          sha256sum tcc | awk '{print "  sha256: "$1}'

      - name: 'CONTROL: tcc own test suite (test1, test2, test3)'
        continue-on-error: true
        run: |
          set -eu
          cd gcc-tcc
          # tcc SHIPS these and they are exactly the questions asked here.
          #
          #   test.ref  tcctest.c compiled by the HOST cc and run -- the
          #             reference output. It is GENERATED, not committed, which
          #             is why the first attempt at this job could not find it.
          #   test1     tcc -run tcctest.c            vs test.ref
          #   test2     tcc -run tcc.c -run tcctest.c vs test.ref
          #             ^ tcc compiles TCC, and that tcc runs the test
          #   test3     three levels deep
          #
          # test2 and test3 ARE the self-compilation fixpoint, done through
          # -run rather than by writing binaries. Hand-rolling it was a mistake.
          make -C tests test.ref >/dev/null 2>&1 || make -C tests test.ref || true
          for t in test1 test2 test3; do
            echo "  --- $t ---"
            make -C tests "$t" 2>&1 | tail -6 || echo "  $t FAILED"
          done

      - name: 'CONTROL: full test suite'
        continue-on-error: true
        run: |
          set -eu
          cd gcc-tcc
          make test 2>&1 | tail -45 || true

      # THIS ONE IS A HARD GATE, and it is the only control step that is.
      # The header of this file says a micro-c result is worth reading only
      # once the same steps have succeeded on a compiler nobody doubts.
      # Nothing enforced that: every control step was continue-on-error, so a
      # broken yardstick produced a green run and unreadable numbers below it.
      - name: 'CONTROL: self-compilation, sizes and hashes'
        run: |
          set -eu
          cd gcc-tcc
          report() { printf '  %-5s %9s bytes  sha256 %s\n' "$1" "$(stat -c%s "$2")" "$(sha256sum "$2" | cut -c1-32)"; }
          # gen1 is the gcc-built tcc. Each generation compiles tcc.c with the
          # PREVIOUS generation, which is what tcc's own Makefile does for
          # tcc2 -- not a fresh ./configure, which was the other mistake.
          cp tcc gen1; report gen1 gen1
          set +e
          ./gen1 -B. -I. -DONE_SOURCE=1 tcc.c -o gen2 2>&1 | head -5
          set -e
          if [ -x gen2 ]; then
            report gen2 gen2
            set +e
            ./gen2 -B. -I. -DONE_SOURCE=1 tcc.c -o gen3 2>&1 | head -5
            set -e
            if [ -x gen3 ]; then
              report gen3 gen3
              if cmp -s gen2 gen3; then
                echo "  FIXPOINT: gen2 and gen3 are byte-identical"
              else
                echo "  NO FIXPOINT: gen2 and gen3 differ ($(cmp -l gen2 gen3 2>/dev/null | wc -l) bytes)"
                echo "  THE CONTROL MOVED. Nothing measured on the subject side"
                echo "  is interpretable until this is explained."
                exit 1
              fi
            else
              echo "  gen2 could not build gen3"; exit 1
            fi
          else
            echo "  gen1 could not build gen2"; exit 1
          fi

      - name: 'SUBJECT: build micro-c from the pin plus our patches'
        run: |
          set -eu
          git clone -q https://github.com/oriansj/M2-Planet.git m2
          git -C m2 checkout -q "$M2PLANET_SHA"
          git -C m2 submodule update --init --recursive -q
          n=0
          for p in spikes/stage3/patches/m2-planet/[0-9]*.patch \
                   spikes/stage3/patches/micro-c-experiments/EXPERIMENT-*.patch; do
            [ -e "$p" ] || continue
            git -C m2 apply --ignore-whitespace --check "../$p" \
              || { echo "FAIL: $(basename "$p") does not apply"; exit 1; }
            git -C m2 apply --ignore-whitespace "../$p"
            n=$((n + 1))
          done
          # BUMPED TO 13 with EXPERIMENT-zz-global-array-address-of.patch.
          # The bound has to move with the series or a silently-missing patch
          # passes the check, and a missing codegen patch looks exactly like a
          # codegen bug.
          [ "$n" -ge 18 ] || { echo "FAIL: only $n patches"; exit 1; }
          cd m2
          gcc -w -o ../micro-c cc.c cc_core.c cc_emit.c cc_globals.c \
                               cc_macro.c cc_reader.c cc_strings.c cc_types.c \
                               M2libc/bootstrappable.c
          echo "  micro-c built from $n patches"

      - name: 'SUBJECT: micro-c compiles tcc'
        run: |
          set -eu
          # THERE ARE TWO COPIES OF M2libc IN THIS JOB AND THE PATCHES ONLY
          # EVER REACHED ONE OF THEM.
          #
          #   spikes/reference/m2libc   vendored, supplies the .c files that
          #                             become m2libc.M1
          #   m2/M2libc                 M2-Planet's submodule at the pin, and
          #                             the -I the libtcc.c COMPILE uses
          #
          # A patch to stdarg.h landed in the first and the second is what
          # libtcc.c actually includes, so a header fix was invisible to the
          # thing it was written for. Found by the va_copy fix appearing to do
          # nothing. Both get the series now.
          #
          # They are also different revisions -- ca023d8 vendored against
          # 68a23cfd in the submodule (see spikes/reference/README.md) -- so
          # they are NOT interchangeable and the -I is deliberately left
          # pointing at the submodule rather than swapped.
          apply_m2libc_series() {
            for p in "$GITHUB_WORKSPACE"/spikes/stage3/patches/m2libc/[0-9]*.patch; do
              [ -e "$p" ] || continue
              (cd "$1" && git apply --ignore-whitespace "$p") \
                || { echo "FAIL: $(basename "$p") in $1"; exit 1; }
            done
          }

          M=spikes/reference/m2libc
          rm -rf m2libc-patched && cp -r "$M" m2libc-patched
          apply_m2libc_series m2libc-patched
          apply_m2libc_series m2/M2libc
          echo "  m2libc series applied to m2libc-patched AND m2/M2libc"
          grep -n 'define va_copy' m2/M2libc/stdarg.h | sed 's/^/    submodule: /'
          M=m2libc-patched

          cp -r tcc-src mc-tcc
          # DEBUG MARKERS inside libtcc, so a fault names a statement rather
          # than a function. Applied to the micro-c copy only; the control's
          # tree is untouched, so the comparison stays honest.
          for p in spikes/stage3/patches/tcc-debug/[0-9]*.patch; do
            [ -e "$p" ] || continue
            (cd mc-tcc && git apply --ignore-whitespace "../$p") \
              && echo "  applied $(basename "$p")" \
              || echo "  skipped $(basename "$p") -- does not apply"
          done
          cd mc-tcc
          # ./configure GENERATES config.h, which tcc.h includes on line 27.
          # The local rehearsal used an already-configured tree and so never
          # noticed; CI starts from a fresh clone and does.
          ./configure --cpu=arm64 >/dev/null 2>&1 || true
          [ -f config.h ] || { echo "FAIL: configure did not produce config.h"; exit 1; }
          cc -DC2STR conftest.c -o c2str.exe && ./c2str.exe include/tccdefs.h tccdefs_.h
          cd ..

          L="$PWD/spikes/stage3/micro-c-libc"
          cd mc-tcc
          ../micro-c --architecture aarch64 --expand-includes --max-string 65536 \
            -D ONE_SOURCE=1 -D TCC_TARGET_ARM64=1 -D TCC_TARGET_LINUX=1 \
            -D CONFIG_TCC_STATIC=1 -I . -I "$L" -I ../m2/M2libc \
            -f libtcc.c -o ../libtcc.M1
          cd ..

          H="-f $M/stdarg.h -f $M/sys/types.h -f $M/stddef.h -f $M/signal.h -f $M/sys/utsname.h"
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$M/ctype.c" $H \
            -f "$M/aarch64/linux/unistd.c" -f "$M/aarch64/linux/fcntl.c" \
            -f "$M/fcntl.c" -f "$M/stdlib.c" -f "$M/string.c" \
            -f "$M/stdio.h" -f "$M/stdio.c" -f "$M/bootstrappable.c" -o m2libc.M1

          # THE REAL RUNTIME, not the stubs. strtoX, qsort, getenv, strerror
          # and a setjmp/longjmp pair written for micro-c's own calling
          # convention. Without these tcc compiles nothing: setjmp wraps every
          # compilation and qsort orders switch cases.
          ./micro-c --architecture aarch64 --max-string 65536 \
            -I spikes/stage3/micro-c-libc \
            -f spikes/stage3/micro-c-libc/impl/runtime.c -o runtime.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f spikes/stage3/micro-c-libc/impl/setjmp-aarch64.c -o setjmp.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f spikes/stage3/micro-c-libc/impl/main-tcc.c -o maintcc.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f spikes/stage3/micro-c-libc/impl/main-compile-only.c -o compileonly.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f spikes/stage3/micro-c-libc/impl/main-06-realloc.c -o realloc.M1
          echo "  libtcc $(grep -c '^:FUNCTION_' libtcc.M1) functions, runtime $(grep -c '^:FUNCTION_' runtime.M1)"

      - name: 'SUBJECT: assemble and link'
        run: |
          set -eu
          T=spikes/reference/mescc-tools
          cp -r "$T" mescc && mkdir -p mescc/M2libc
          cp spikes/reference/m2libc/bootstrappable.c spikes/reference/m2libc/bootstrappable.h mescc/M2libc/
          # ASSERT THE SED MATCHED. If upstream changes this literal the sed
          # silently no-ops and the result is a truncation that reads like a
          # codegen bug. Same discipline as the patch-count check above.
          grep -q 'max_string = 4096,' mescc/M1-macro.c \
            || { echo "FAIL: M1-macro.c no longer contains 'max_string = 4096,'"; \
                 grep -n 'max_string' mescc/M1-macro.c; exit 1; }
          sed -i 's/max_string = 4096,/max_string = 262144,/' mescc/M1-macro.c
          grep -q 'max_string = 262144,' mescc/M1-macro.c || { echo "FAIL: sed did not apply"; exit 1; }
          gcc -w -o M1 mescc/M1-macro.c mescc/stringify.c mescc/M2libc/bootstrappable.c
          gcc -w -o hex2 mescc/hex2_linker.c mescc/hex2_word.c mescc/hex2.c mescc/M2libc/bootstrappable.c

          # Code before strings, or a function lands on an address that is not
          # a multiple of four and every call to it is SIGBUS.
          join() {
            out="$1"; shift
            : > "$out.code"; : > "$out.strs"
            for f in "$@"; do
              sed '/^# Program strings$/,$d' "$f" >> "$out.code"
              sed -n '/^# Program strings$/,$p' "$f" >> "$out.strs"
            done
            cat "$out.code" "$out.strs" > "$out"; rm -f "$out.code" "$out.strs"
          }
          join all.M1 libtcc.M1 m2libc.M1 runtime.M1 setjmp.M1 maintcc.M1
          join co.M1  libtcc.M1 m2libc.M1 runtime.M1 setjmp.M1 compileonly.M1
          # The realloc probe needs NO libtcc -- it is 58 KB and tests only the
          # allocator, so a failure there cannot be blamed on tcc.
          join rl.M1  m2libc.M1 runtime.M1 setjmp.M1 realloc.M1

          D=spikes/reference/m2libc/aarch64
          ./M1 -f $D/aarch64_defs.M1 -f $D/libc-full.M1 -f all.M1 \
               --little-endian --architecture aarch64 -o all.hex2
          ./hex2 --architecture aarch64 --little-endian --base-address 0x400000 \
                 -f $D/ELF-aarch64.hex2 -f all.hex2 -o mc-tcc-bin
          chmod +x mc-tcc-bin
          ./M1 -f $D/aarch64_defs.M1 -f $D/libc-full.M1 -f co.M1 \
               --little-endian --architecture aarch64 -o co.hex2
          ./hex2 --architecture aarch64 --little-endian --base-address 0x400000 \
                 -f $D/ELF-aarch64.hex2 -f co.hex2 -o mc-compile-only
          chmod +x mc-compile-only
          ./M1 -f $D/aarch64_defs.M1 -f $D/libc-full.M1 -f rl.M1 \
               --little-endian --architecture aarch64 -o rl.hex2
          ./hex2 --architecture aarch64 --little-endian --base-address 0x400000 \
                 -f $D/ELF-aarch64.hex2 -f rl.hex2 -o mc-realloc
          chmod +x mc-realloc
          printf '  micro-c tcc: %s bytes  sha %s\n' \
            "$(stat -c%s mc-tcc-bin)" "$(sha256sum mc-tcc-bin | cut -c1-16)"

      - name: 'SUBJECT: vocabulary check, EVERY architecture'
        run: |
          set -eu
          # Does every macro micro-c can emit actually exist for the
          # architecture it is emitting for? M2libc's *_defs.M1 files are the
          # ground truth.
          #
          # This exists because the same failure kept recurring one
          # architecture at a time -- mov_x15,x1 missing on aarch64,
          # mov_rbx,r15 missing on amd64, add_x16,x14,x16 missing on aarch64 --
          # each found by assembling or running, each costing a round trip.
          # They are all "that instruction does not exist here", and that
          # question can be answered statically for every target at once.
          #
          # It finds no logic bugs. It closes one whole class.
          chmod +x spikes/stage3/tools/vocabulary.sh
          sh spikes/stage3/tools/vocabulary.sh \
            "$PWD/micro-c" "$PWD/spikes/reference/m2libc"

      - name: 'SUBJECT: differential test, NATIVELY on aarch64'
        continue-on-error: true
        run: |
          set -eu
          # THE SAME CASES THE DEVELOPMENT MACHINE RUNS ON amd64, RUN HERE ON
          # aarch64. That matters because the two architectures disagree about
          # what is legal: amd64 tolerates unaligned loads and aarch64 faults
          # on them, so a whole class of bug is invisible locally and fatal
          # here.
          #
          # This is also the answer to being stuck. Six CI rounds were spent
          # adding one marker each to narrow WHERE a fault was. One round of
          # this checks every case at once, on the machine where the faults
          # actually happen, and names the construct rather than the function.
          chmod +x spikes/stage3/tools/difftest.sh
          mkdir -p mescc-bin && cp M1 hex2 mescc-bin/
          set +e
          ARCH=aarch64 sh spikes/stage3/tools/difftest.sh \
            "$PWD/micro-c" "$PWD/spikes/reference/m2libc" "$PWD/mescc-bin"
          echo "$?" > "$GITHUB_WORKSPACE/difftest-rc.txt"
          set -e
          echo "  (a failure here names a C construct, not a tcc function)"
          # THE RESULT IS RECORDED, NOT ACTED ON HERE. Failing at this point
          # would abort the job and skip every probe and the instrumented run
          # below -- so the round would cost as much and tell us less. The
          # gate is the last step instead, after all the evidence is in.

      - name: 'SUBJECT: does realloc work'
        continue-on-error: true
        run: |
          set -eu
          # realloc GROWING a block is the one allocator path nothing has
          # tested: tcc_malloc is realloc(0, n), which only calls malloc.
          # cstr_cat inside tcc_split_path grows buffers, and tcc_split_path is
          # the last thing both probes got through before dying at DIFFERENT
          # later points -- which is what memory corruption looks like.
          set +e
          ./mc-realloc 2> /tmp/rl-marks.txt
          rc=$?
          set -e
          echo "  markers: $(tr '\n' ' ' < /tmp/rl-marks.txt)"
          echo "  exit: $rc"
          case "$rc" in
            42) echo "  realloc GROWS AND PRESERVES correctly" ;;
             2) echo "  malloc failed" ;;
             3) echo "  realloc returned NULL" ;;
             4) echo "  CONTENTS LOST across the move -- realloc is broken" ;;
             *) if [ "$rc" -gt 128 ]; then echo "  SIGNAL $((rc - 128)) inside realloc"; fi ;;
          esac

      - name: 'SUBJECT: compile WITHOUT linking'
        continue-on-error: true
        run: |
          set -eu
          # TCC_OUTPUT_MEMORY skips the crt paths and crtbegin, so this is the
          # PARSER and CODE GENERATOR with no linker involved. Worth separating:
          # a compiler that compiles but cannot link is a much better position
          # than one that cannot compile, and a test that does both at once
          # cannot tell you which you have.
          set +e
          ./mc-compile-only 2> /tmp/co-marks.txt
          rc=$?
          set -e
          echo "  markers: $(tr '\n' ' ' < /tmp/co-marks.txt)"
          echo "  last libtcc marker: $(grep -aoE '^T[0-9A-F]' /tmp/co-marks.txt | tail -1)"
          echo "  exit: $rc"
          case "$rc" in
            42) echo "  IT COMPILED A FUNCTION -- parser and codegen work" ;;
             2) echo "  tcc_new returned NULL" ;;
             3) echo "  tcc_set_output_type failed" ;;
             4) echo "  tcc_compile_string reported an error" ;;
             *) if [ "$rc" -gt 128 ]; then echo "  SIGNAL $((rc - 128))"; fi ;;
          esac

      - name: 'SUBJECT: does it compile anything at all'
        continue-on-error: true
        run: |
          set -eu
          echo 'int main(void){ return 0; }' > /tmp/trivial.c
          set +e
          ./mc-tcc-bin /tmp/trivial.c -o /tmp/trivial-out 2> /tmp/marks.txt
          rc=$?
          set -e
          # The driver brackets each libtcc call with a marker on stderr, so
          # the last one printed names the last call that RETURNED.
          #
          #   D1 entering tcc_new     D2 tcc_new returned
          #   D3 output type set      D4 about to add the input file
          #   D5 file added, about to write output
          #   D6 output written
          echo "  markers: $(tr '\n' ' ' < /tmp/marks.txt)"
          echo "  exit: $rc"
          if [ "$rc" -gt 128 ]; then echo "  SIGNAL $((rc - 128))"; fi
          # D markers come from our driver, T markers from inside libtcc.
          echo "  last libtcc marker: $(grep -aoE '^T[0-9A-F]' /tmp/marks.txt | tail -1)"
          # A marker names the last point that EXECUTED. If the next one did
          # not print, the fault is anywhere between them -- including deep
          # inside a call that never returned. "DID NOT RETURN FROM" is what
          # the evidence supports; "DIED IN" was a stronger claim than the
          # data, and reading it that way cost rounds before.
          case "$(grep -aoE '^T[0-9A-F]' /tmp/marks.txt | tail -1)" in
            T1) echo "  did not get past: tcc_add_sysinclude_path" ;;
            T3) echo "  did not get past: tccelf_new" ;;
            T5) echo "  did not get past: tcc_add_library_path" ;;
            T7) echo "  did not get past: tcc_split_path" ;;
            T9) echo "  did not get past: the if (or state was corrupted earlier)" ;;
            TA) echo "  did not get past: tccelf_add_crtbegin -- LINKER work" ;;
            TB) echo "  did not get past: the return from tcc_set_output_type" ;;
            TC) echo "  tcc_set_output_type completed; lost on the way back" ;;
            "") echo "  no libtcc marker printed -- died before the first one" ;;
          esac
          # The D markers only bracket the DRIVER's calls, so D2 means "past
          # tcc_new", not "died in tcc_set_output_type" -- a T marker after it
          # says where it actually got to.
          case "$(grep -aoE '^D[0-9]' /tmp/marks.txt | tail -1)" in
            D1) echo "  past: entering tcc_new" ;;
            D2) echo "  past: tcc_new returned" ;;
            D3) echo "  past: output type set" ;;
            D4) echo "  past: options handled, about to add the input file" ;;
            D5) echo "  past: file added, about to write output" ;;
            D6) echo "  past: output written" ;;
            *)  echo "  died before the first marker" ;;
          esac
          # `[ -f x ] && ls ...` as the LAST line means a missing file exits the
          # step non-zero -- so "it produced nothing", which is a RESULT, was
          # being rendered as the step having broken.
          if [ -f /tmp/trivial-out ]; then
            ls -l /tmp/trivial-out | awk '{print "  produced "$5" bytes"}'
          else
            echo "  produced no output file"
          fi

      - name: 'SUBJECT: tcctest.c, the same file the control used'
        continue-on-error: true
        run: |
          set -eu
          cd mc-tcc
          # The same source and the same reference the control was measured
          # against. test.ref was generated during the control step above.
          # NOT `... | head -30`. A pipeline's $? is the LAST command's, so
          # rc was head's status -- always 0 -- and the SIGNAL branch below
          # could never fire. Capture, then show a slice of the capture.
          set +e
          ../mc-tcc-bin -B. -I. -Iinclude tests/tcctest.c -o /tmp/tcctest-mc \
            > /tmp/tcctest-build.log 2>&1
          rc=$?
          set -e
          head -30 /tmp/tcctest-build.log
          echo "  ($(wc -l < /tmp/tcctest-build.log) lines total, full log in the artifact)"
          echo "  exit: $rc"
          if [ "$rc" -gt 128 ]; then echo "  SIGNAL $((rc - 128))"; fi
          if [ -x /tmp/tcctest-mc ]; then
            /tmp/tcctest-mc > /tmp/tcctest-mc.out 2>&1 || true
            if [ -f ../gcc-tcc/tests/test.ref ]; then
              diff -u ../gcc-tcc/tests/test.ref /tmp/tcctest-mc.out > /tmp/mc.diff \
                && echo "  MATCHES the reference output exactly" \
                || echo "  differs from the reference: $(grep -c '^[+-]' /tmp/mc.diff) lines"
            fi
          else
            echo "  no binary produced"
          fi

      - name: 'SUBJECT: self-compilation, sizes and hashes'
        continue-on-error: true
        run: |
          set -eu
          report() { printf '  %-5s %9s bytes  sha256 %s\n' "$1" "$(stat -c%s "$2")" "$(sha256sum "$2" | cut -c1-32)"; }
          report gen1 mc-tcc-bin
          cd mc-tcc
          set +e
          ../mc-tcc-bin -B. -I. -DONE_SOURCE=1 -DTCC_TARGET_ARM64=1 \
                        -DTCC_TARGET_LINUX=1 tcc.c -o /tmp/gen2-mc \
                        > /tmp/gen2-build.log 2>&1
          rc=$?
          set -e
          head -20 /tmp/gen2-build.log
          echo "  gen2 exit: $rc"
          if [ "$rc" -gt 128 ]; then echo "  gen2 died on SIGNAL $((rc - 128))"; fi
          if [ -x /tmp/gen2-mc ]; then
            report gen2 /tmp/gen2-mc
            set +e
            /tmp/gen2-mc -B. -I. -DONE_SOURCE=1 tcc.c -o /tmp/gen3-mc \
              > /tmp/gen3-build.log 2>&1
            rc3=$?
            set -e
            head -10 /tmp/gen3-build.log
            echo "  gen3 exit: $rc3"
            if [ -x /tmp/gen3-mc ]; then
              report gen3 /tmp/gen3-mc
              cmp -s /tmp/gen2-mc /tmp/gen3-mc \
                && echo "  FIXPOINT: gen2 and gen3 are byte-identical" \
                || echo "  NO FIXPOINT: gen2 and gen3 differ"
            else
              echo "  gen2 could not build gen3"
            fi
          else
            echo "  self-compilation not reached"
          fi

      - name: 'DEBUG: which STATEMENT faults, every one instrumented'
        if: always()
        continue-on-error: true
        run: |
          set -eu
          # AUTOMATIC instrumentation: a marker after EVERY statement of the
          # function, not the six or eight a human places by hand.
          #
          # Hand placement cost a round per refinement and still ended with
          # "somewhere in tcc_set_output_type" after several of them. The
          # placement is mechanical, so this does all of it at once and the
          # LAST marker printed names the exact line.
          # THE WHOLE COMPILE PATH, not one function.
          #
          # Instrumenting a single function is only useful while you already
          # know which one. When the failure moved out of tcc_set_output_type
          # and into tcc_compile there were no markers there at all, so the
          # report had nothing to say and it looked like the fault had gone
          # invisible. It had not -- the instrument did not reach it.
          # TWO FILES, EACH WITH ITS OWN MARKER LETTER.
          #
          # The fault moved out of libtcc.c into preprocess_start, which lives
          # in tccpp.c -- and instrumenting one file cannot see it. Each file
          # gets a distinct prefix because both number their markers from 1.
          FUNC="${DEBUG_FUNC:-tcc_set_output_type,tcc_compile,tcc_compile_string}"
          # tok_alloc IS INCLUDED because "P45 did not print" means the CALL
          # did not return -- the fault can be anywhere inside it, not in the
          # argument that was being computed. Reading the marker as naming the
          # call site was a mistake worth not repeating.
          PPFUNC="${DEBUG_PPFUNC:-preprocess_start,tccpp_new,tok_alloc,tok_alloc_new}"

          : > marker-map.txt
          python3 spikes/stage3/tools/instrument.py --map --prefix L \
            mc-tcc/libtcc.c "$FUNC" >> marker-map.txt \
            || { echo "  could not instrument $FUNC"; exit 0; }
          python3 spikes/stage3/tools/instrument.py --map --prefix P \
            mc-tcc/tccpp.c "$PPFUNC" >> marker-map.txt \
            || echo "  (could not instrument $PPFUNC in tccpp.c)"

          echo "  --- marker map ($(wc -l < marker-map.txt) statements) ---"
          cat marker-map.txt

          python3 spikes/stage3/tools/instrument.py --prefix L \
            mc-tcc/libtcc.c "$FUNC" > /tmp/inst.c 2>/dev/null
          cp /tmp/inst.c mc-tcc/libtcc.c
          python3 spikes/stage3/tools/instrument.py --prefix P \
            mc-tcc/tccpp.c "$PPFUNC" > /tmp/instpp.c 2>/dev/null \
            && cp /tmp/instpp.c mc-tcc/tccpp.c

          # THE MAP IS PRINTED, THEN NOTHING HAPPENS FOR ABOUT A MINUTE.
          #
          # What follows is a full micro-c recompile of libtcc.c -- the same
          # ~55 seconds step 10 takes -- and it emits nothing while it runs.
          # In a live log the last line is the final marker of the map, so the
          # job reads as hung at whatever tccpp_new statement happened to be
          # last. Saying so costs one line.
          echo "  --- recompiling instrumented libtcc.c (about a minute, silent) ---"
          L="$PWD/spikes/stage3/micro-c-libc"
          cd mc-tcc
          ../micro-c --architecture aarch64 --expand-includes --max-string 65536 \
            -D ONE_SOURCE=1 -D TCC_TARGET_ARM64=1 -D TCC_TARGET_LINUX=1 \
            -D CONFIG_TCC_STATIC=1 -I . -I "$L" -I ../m2/M2libc \
            -f libtcc.c -o ../inst.M1
          cd ..

          join2() {
            out="$1"; shift
            : > "$out.code"; : > "$out.strs"
            for f in "$@"; do
              sed '/^# Program strings$/,$d' "$f" >> "$out.code"
              sed -n '/^# Program strings$/,$p' "$f" >> "$out.strs"
            done
            cat "$out.code" "$out.strs" > "$out"; rm -f "$out.code" "$out.strs"
          }
          join2 inst-all.M1 inst.M1 m2libc.M1 runtime.M1 setjmp.M1 compileonly.M1
          D=spikes/reference/m2libc/aarch64
          ./M1 -f $D/aarch64_defs.M1 -f $D/libc-full.M1 -f inst-all.M1 \
               --little-endian --architecture aarch64 -o inst.hex2
          ./hex2 --architecture aarch64 --little-endian --base-address 0x400000 \
                 -f $D/ELF-aarch64.hex2 -f inst.hex2 -o tcc-inst
          chmod +x tcc-inst

          set +e
          ./tcc-inst 2> inst-marks.txt
          rc=$?
          set -e
          last=$(grep -aoE '^[LP][0-9]+' inst-marks.txt | tail -1)
          echo "  --- result ---"
          echo "  markers printed: $(grep -acE '^[LP][0-9]+' inst-marks.txt), exit $rc"
          echo "  LAST STATEMENT THAT COMPLETED: $last"
          grep "^$last " marker-map.txt || true

          # WHETHER THIS IS A FAULT OR A CLEAN FINISH.
          #
          # A function that returns normally also stops at its last marker,
          # because nothing runs after a return. The distinguishing evidence is
          # whether a marker from a LATER function appeared -- and that has to
          # be judged against which functions were instrumented, not against a
          # hardcoded C3. An earlier version checked for C3 unconditionally and
          # announced "returned normally" while the process was dumping core.
          #
          # So: say what is known and let the map speak, rather than asserting.
          # ONE PATTERN, DEFINED ONCE. The previous version used
          # '^[LP][0-9]+' to find the last marker and '^[LTCDMR][0-9A-F]*'
          # to print the trail -- so the trail could not see P markers at
          # all, which is exactly where the fault now is. Any prefix letter
          # followed by at least one digit, and nothing else.
          MRE='^[A-Z][0-9]+'

          echo "  markers seen, in order:"
          grep -aoE "$MRE" inst-marks.txt | tr '\n' ' ' | fold -w 100 | sed 's/^/    /'
          echo

          # THE LAST MARKER IS NOT THE FURTHEST ONE WHEN THERE IS A LOOP.
          # tccpp_new walks tcc_keywords, so every marker in that body prints
          # once per keyword. The count says WHICH ITERATION faulted, which is
          # the difference between "it dies in the keyword loop" and "it dies
          # on keyword 3".
          echo "  --- marker frequency (a count > 1 means a loop body) ---"
          grep -aoE "$MRE" inst-marks.txt | sort | uniq -c | sort -k2,2V \
            | awk '{printf "    %-6s x%s\n", $2, $1}'

          # The last statement alone does not say which BRANCH was taken to
          # reach it. The preceding few do.
          echo "  --- last 8 statements that completed ---"
          for m in $(grep -aoE "$MRE" inst-marks.txt | tail -8); do
            grep "^$m " marker-map.txt || echo "    $m (not in map)"
          done
          if [ "$rc" -gt 128 ]; then
            echo "  exit $rc is SIGNAL $((rc - 128)): the fault is at or just after that line"
          elif [ "$rc" != 0 ]; then
            echo "  exit $rc is not a signal, so something called exit() --"
            echo "  an error path was taken rather than a crash"
          else
            echo "  exit 0: it ran to completion"
          fi


      # Evidence, and it must survive a red gate -- hence if: always().
      # A step without it is SKIPPED when an earlier step fails, and the whole
      # point of this one is to be read on the round where things are broken.
      - name: 'SUBJECT: what micro-c EMITS for &global[i] vs &local[i]'
        if: always()
        continue-on-error: true
        run: |
          set -eu
          # THE DIFFTEST SAYS WHICH CONSTRUCT IS WRONG. THIS SAYS HOW.
          #
          # Case 24 (&global[i]) fails; case 25, the identical shape on a
          # local, passes; case 18 indexes a global array of structs and
          # passes. That localises the bug but not to a line of cc_core.c,
          # and "the base was loaded instead of decayed" and "the index was
          # not scaled" are two different one-line fixes that look the same
          # from outside.
          #
          # ROUND 4 ADDS THE POINTER-TO-STRUCT SHAPES, and they are the
          # reason this step exists again.
          #
          # &g[i] on long and long* is fixed and passing (cases 24, 29, 30).
          # The same shape on an array of pointers TO A STRUCT segfaults
          # (cases 28 and 31) -- while tcc's own `TokenSym *hash_ident[16384]`,
          # which is that shape, started working in the same run. Those two
          # facts do not fit together and no amount of reasoning from outside
          # will settle which one is misleading.
          #
          # What settles it is the SCALE CONSTANT. postfix_expr_array emits
          #     mov_x14,N ; mul_x0,x14,x0
          # and N is the element width it chose. For `struct Big* t[64]` the
          # right N is 8 and the wrong one is sizeof(struct Big) = 48. Reading
          # N off the emission answers it directly instead of by inference.
          #
          # bigptr_* is the failing shape, longptr_* the passing one, and
          # plain_bigptr the control that never went through Address_of.
          cat > /tmp/shape.c <<'ENDC'
          struct Big { long a; long b; long c; long d; long e; long f; };

          static long        g[4];
          static struct Big  items[4];
          static struct Big* bigtab[64];
          static long*       longtab[64];
          static long        target;

          long via_global(void)
          {
              long* p;
              p = &g[2];
              return *p;
          }

          long via_local(void)
          {
              long l[4];
              long* p;
              l[2] = 7;
              p = &l[2];
              return *p;
          }

          long plain_global(void)
          {
              return g[2];
          }

          long decay_global(void)
          {
              long* p;
              p = g;
              return p[2];
          }

          /* THE FAILING SHAPE: an array of pointers to a 48-byte struct.
             Right scale 8, wrong scale 48. */
          long bigptr_addr(void)
          {
              struct Big** pp;
              struct Big*  q;
              pp = &bigtab[40];
              q = *pp;
              return q->a;
          }

          /* the same access WITHOUT address-of -- this path was always
             correct, so its scale constant is the reference */
          long plain_bigptr(void)
          {
              struct Big* q;
              q = bigtab[40];
              return q->a;
          }

          /* THE PASSING SHAPE: identical but the element points at a long,
             where ->size and ->type->size are both 8 and no choice between
             them can be observed. */
          long longptr_addr(void)
          {
              long** pp;
              long*  q;
              pp = &longtab[40];
              q = *pp;
              return *q;
          }

          int main(void)
          {
              g[2] = 5;
              items[0].a = 11;
              target = 22;
              bigtab[40] = &items[0];
              longtab[40] = &target;
              return via_global() + via_local() + plain_global() + decay_global()
                   + bigptr_addr() + plain_bigptr() + longptr_addr();
          }
          ENDC
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f /tmp/shape.c -o /tmp/shape.M1 || { echo "  micro-c refused it"; exit 0; }

          # THE SCALE CONSTANTS, PULLED OUT FIRST. The full emissions are
          # below and worth reading, but the one number this round turns on
          # is N in `mov_x14,N` immediately before a `mul`.
          echo "  --- element width chosen per function ---"
          awk '
            /^:FUNCTION_/ { fn = substr($0, 11) }
            /^mov_x14,/   { last = $0 }
            /^mul_x0,x14,x0/ { printf "    %-16s %s\n", fn, last }
          ' /tmp/shape.M1
          echo "    (bigptr_addr should match plain_bigptr; 8 is right, 48 is wrong)"

          for f in bigptr_addr plain_bigptr longptr_addr via_global plain_global decay_global via_local; do
            echo "  ===== $f ====="
            awk -v want=":FUNCTION_$f" '
              $0 == want { on = 1 }
              on && /^:FUNCTION_/ && $0 != want { exit }
              on { print "    " $0 }
            ' /tmp/shape.M1
          done
          cp /tmp/shape.M1 "$GITHUB_WORKSPACE/shape.M1"

      # =================================================================
      # THE GATE. Runs last so that a red job still carries a full round of
      # evidence: every probe, the instrumented run, and the artifact.
      #
      # difftest is the only subject-side measurement that is a PASS/FAIL
      # question rather than a "how far did it get" one, which is what makes
      # it gateable at all. The KNOWN GAP category is what makes it safe:
      # a documented gap failing does not fail the run, so green stays
      # meaningful without anyone having to remember which failure is the
      # acceptable one.
      # =================================================================
      - name: 'GATE: differential test must be clean'
        if: always()
        run: |
          set -eu
          if [ ! -f difftest-rc.txt ]; then
            echo "  difftest did not run -- nothing to gate on, and that is"
            echo "  itself a failure: the step above must always record a result"
            exit 1
          fi
          rc=$(cat difftest-rc.txt)
          if [ "$rc" = 0 ]; then
            echo "  difftest clean on aarch64"
          else
            echo "  DIFFTEST FAILED (exit $rc). A failure here names a C"
            echo "  construct that micro-c compiles differently from gcc."
            echo "  Read the 'differential test' step above for which one."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcc-two-ways
          path: |
            mc-tcc-bin
            all.M1
            marker-map.txt
            inst-marks.txt
            /tmp/marks.txt
            /tmp/co-marks.txt
            /tmp/rl-marks.txt
            /tmp/tcctest-build.log
            /tmp/gen2-build.log
            /tmp/gen3-build.log
            /tmp/mc.diff
          if-no-files-found: warn
