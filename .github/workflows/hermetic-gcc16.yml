name: hermetic-gcc16

# ============================================================================
# THE BLEEDING SYSTEM.  A gcc 16.1.0 box that builds an -rc kernel and boots it.
# ============================================================================
#
# WHAT THIS IS FOR
#
#     tcc -> gcc 4.7 -> gcc 10 -> gcc 16  ->  kernel + userland + boot
#            gcc47      gcc10     ^^^^^^^^^^ THIS BOX
#
# The LFS DEVELOPMENT book's pins (r13.0-156 -- gcc 16.1.0, binutils 2.46.1)
# and linux v7.2-rc4 straight from git rather than a tarball.
#
# SEPARATE FILE, ON PURPOSE. Sharing one workflow with the stable box would
# mean a failure in 16.1 or in an -rc kernel obscures whether the 13.0 baseline
# still works. Keeping them apart is what lets this one fail without costing
# the other.
#
# WHAT THE DEV BOOK CHANGES over 13.0, and it is only two things:
#   --disable-fixincludes   on both gcc passes
#   --enable-kernel=5.10    for glibc, up from 5.4
#
# WHAT THIS IS NOT
#
#   * NOT proof that gcc 10 can build gcc 16 -- that is hermetic-gcc10's second
#     attempt. This box starts from a host-built cross toolchain on purpose, so
#     a failure here is the SYSTEM's and not the ladder's.
#
# HOW TO RUN IT
#
#   push        edits to THIS FILE ONLY -- this box never triggers another and
#               no other box triggers it
#   dispatch    with rebuild_sysroot=yes to throw away the cached sysroot
#
# ----------------------------------------------------------------------------
# WHAT RUN 30192158996 (2026-07-26) ACTUALLY SAID, and what changed because
# of it.  That run went green.  It produced no kernel and no boot.
# ----------------------------------------------------------------------------
#
# 1. THE JOB REPORTED SUCCESS WITH NO KERNEL.  The kernel step ends in
#    `... | sed 's/^/    /'`, and a pipeline exits with its LAST command's
#    status.  The step ran `exit 1` -- it printed "That is a finding, not
#    something to retry." -- sed exited 0, and GitHub called the step green.
#    The initramfs was then assembled, QEMU was handed an Image that had never
#    been written, and the log read "DID NOT REACH USERSPACE", which sounds
#    like a kernel that boots badly rather than one that was never built.
#    The upload step is the tell: "there will be 2 files uploaded", not 3.
#    Every box invocation now reads ${PIPESTATUS[0]} explicitly, and every box
#    script is written to a file and run by path rather than embedded in a
#    quoted one-liner.
#
#    NOT with a blanket `set -o pipefail`, which was tried in run 30209118941
#    and broke the box in a new way within six seconds. Under pipefail,
#        yes '' | make oldconfig > /dev/null 2>&1
#    fails: make finishes, closes the pipe, `yes` takes SIGPIPE and exits 141,
#    and pipefail promotes that to the pipeline's status. Every stream was
#    redirected, so the step died having printed NOTHING AT ALL. Verified:
#    `set -euo pipefail; yes | head -1 >/dev/null` exits 141; the same line
#    under plain `set -eu` exits 0. pipefail would also have turned every
#    `grep … | head | sed` diagnostic into a step abort whenever the grep
#    matched nothing -- killing the error report exactly when it is needed.
#    A blunt global setting was the wrong instrument; check the one status
#    that matters instead.
#
# 2. THE CERTS HUNT NEVER RAN.  Its output was four empty headings:
#        its Kconfig definition:            <nothing>
#        every select/imply of it:          <nothing>
#        does defconfig set it?             <nothing>
#        what .config says now:  CONFIG_SYSTEM_TRUSTED_KEYRING=y
#    Only the last one printed, and it is the only one that did not use
#    `grep --include`.  `--include` is a GNU extension; the box runs BusyBox,
#    whose grep does not implement it, so every search silently matched
#    nothing and the run concluded "no ENABLED selector found" about a search
#    that never happened.  That exact trap is written down in
#    spikes/stage4/README.md and it was still in this file.
#
# 3. libstdc++ WENT TO /usr/lib64.  The book's x86_64 step
#        sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64
#    has an aarch64 counterpart this box never applied, so glibc landed in
#    /usr/lib (forced by libc_cv_slibdir) and libstdc++ landed beside it in a
#    directory nothing searches.  The step printed the paths and looked fine:
#    `ls ... | sed ... || echo "NO libstdc++"` can never fire its fallback --
#    the `||` sees sed's status -- and the `find` on the next line runs
#    unconditionally.  So the lib64 paths in that output were the FALLBACK
#    diagnostic printing, not the check passing.
#
# 4. QEMU'S romfile ERROR IS OURS TO FIX, not the runner's.  `-M virt` adds a
#    default virtio-net-pci whose option ROM ships in `ipxe-qemu` -- a
#    RECOMMENDED package, and this workflow installs with
#    --no-install-recommends.  This boot needs no network at all, so the NIC
#    is removed with `-nic none` and the package is installed as well.
#
# 5. NOTHING WAS CACHED.  The full sysroot took 36 minutes to reach a kernel
#    step that then failed in 5 seconds.  The sysroot is now cached behind a
#    completeness marker, so a kernel-only iteration costs minutes.
#
# ============================================================================

on:
  # CALLABLE, so stage4-complete can ORDER these jobs instead of
  # reimplementing them. Nothing below changes: this workflow still
  # runs standalone on push and on dispatch exactly as before.
  # github.event.inputs is null when called, and every reference to it
  # in this file already has a `|| 'default'` fallback, so the defaults
  # apply and no input plumbing is needed.
  workflow_call:
    outputs:
      sysroot_hash:
        description: 'the gcc 16.1.0 sysroot that booted'
        value: ${{ jobs.bleeding.outputs.sysroot_hash }}
  push:
    paths:
      - '.github/workflows/hermetic-gcc16.yml'
  workflow_dispatch:
    inputs:
      rebuild_sysroot:
        description: 'Discard the cached sysroot and rebuild chapters 5 and 6'
        type: choice
        options: ['no', 'yes']
        default: 'no'

# A NEW PUSH MUST NOT KILL A RUNNING BUILD. Cancelling in flight is right for a
# fast check and wrong for a multi-hour box: one push to fix a typo cancelled
# four in-flight hermetic runs and restarted them from zero. Long jobs queue
# instead. (The setting is spelled out below rather than named here, because a
# key:value written in prose is what a later grep will match first.)
concurrency:
  group: hermetic-gcc16-${{ github.ref }}
  cancel-in-progress: false

env:
  GNU: 'https://mirrors.kernel.org/gnu'
  # The DEVELOPMENT patch directory -- this box tracks the dev book, so its
  # patches live under /development, not under a release number.
  LFS_PATCH: 'https://www.linuxfromscratch.org/patches/lfs/development'
  LFS_TGT: 'aarch64-veron-linux-gnu'
  # LFS development book r13.0-156, chapter 3
  BINUTILS_VER: '2.46.1'
  GCC_VER: '16.1.0'
  GLIBC_VER: '2.43'
  KHDR_VER: '7.1.3'
  GMP_VER: '6.3.0'
  MPFR_VER: '4.2.2'
  # THE DEV BOOK PINS 1.4.1 AND THE GNU MIRRORS DO NOT HAVE IT -- not on
  # mirrors.kernel.org, not on ftp.gnu.org. Tracking a development book means
  # occasionally pinning something that has not been published yet. 1.3.1 is
  # LFS 13.0's pin, is definitely mirrored, and is far past gcc's minimum of
  # mpc 0.8.0, so it changes nothing about whether gcc 16.1 builds.
  MPC_VER: '1.3.1'
  M4_VER: '1.4.21'
  BISON_VER: '3.8.2'
  FLEX_VER: '2.6.4'
  PERL_VER: '5.42.2'
  BC_VER: '7.0.3'
  # LFS dev book chapter 3. THE BOX NEEDS THIS BECAUSE THE KERNEL DOES:
  # certs/extract-cert is a hostprog that includes <openssl/bio.h>, and
  # it is built whenever CONFIG_SYSTEM_TRUSTED_KEYRING is on -- which no
  # amount of Kconfig disabling reliably prevents, because the symbol is
  # reached by `select` from a chain that olddefconfig rebuilds. LFS has
  # openssl by chapter 8 and builds its kernel in chapter 10; this box
  # stopped at chapter 6, so it was missing a package the book's own
  # kernel step assumes. That is the actual gap, and this closes it.
  OPENSSL_VER: '4.0.1'
  # the image itself
  KTAG: 'v7.2-rc4'
  KSHA: '1590cf0'
  # BUMP THIS WHENEVER CHAPTER 5 OR 6 CHANGES. It is the only thing standing
  # between a recipe edit and a cache full of sysroots built by the old recipe.
  # A cache key that tracked the file hash would invalidate on every comment,
  # which is the same as having no cache at all; a key that tracks nothing
  # silently serves a stale tree. An explicit, reviewable salt is the honest
  # middle -- and forgetting to bump it is visible in the diff.
  SYSROOT_EPOCH: '2026-07-26-a'

jobs:
  bleeding:
    outputs:
      sysroot_hash: ${{ steps.chain_seal.outputs.hash }}
    name: 'gcc 16.1 sysroot -> linux v7.2-rc4 -> QEMU'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap curl git bzip2 xz-utils gcc g++ make bison flex \
            texinfo m4 perl python3 file gawk cpio qemu-system-arm
          # THE OPTION ROMS. Every boot attempt from this box has died on
          #   qemu-system-aarch64: failed to find romfile "efi-virtio.rom"
          # which is a packaging fact about the runner, not about the image:
          # ipxe-qemu is a RECOMMENDED dependency of qemu-system-arm and the
          # line above deliberately skips recommends. The BOOT step also drops
          # the NIC entirely, so this is belt and braces on the one thing that
          # has blocked every single boot -- and it must not be able to fail
          # the run on its own.
          sudo apt-get install -y --no-install-recommends ipxe-qemu \
            || echo "  ipxe-qemu unavailable -- relying on -nic none instead"

      - name: 'Layout, environment, and the box itself'
        run: |
          set -eu
          S="$PWD/sysroot"
          echo "S=$S" >> "$GITHUB_ENV"
          echo "W=$PWD" >> "$GITHUB_ENV"
          # IDEMPOTENT, because a restored cache lands on top of this and a
          # second run must not fail on "File exists".
          mkdir -pv "$S"/{etc,var,tools,work} "$S"/usr/{bin,lib,sbin,include}
          for i in bin lib sbin; do ln -sfnv usr/$i "$S/$i"; done
          # PATH once, for every later step.
          echo "$S/tools/bin" >> "$GITHUB_PATH"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          # The box is defined HERE because steps well before the "box" step use
          # it -- busybox installs its applets from inside. Callers always use
          # "$W/box16.sh": several steps cd into a source tree first, and a
          # relative path resolves there instead.
          cat > box16.sh <<'EOS'
          #!/bin/sh
          set -eu
          S=${S:?box16.sh: S not set}
          exec bwrap \
            --unshare-all --die-with-parent --new-session --clearenv \
            --setenv PATH /usr/bin:/usr/sbin:/tools/bin \
            --setenv HOME /work --setenv LC_ALL POSIX --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --bind "$S" / --proc /proc --dev /dev --tmpfs /tmp --tmpfs /run \
            --chdir /work "$@"
          EOS
          chmod +x box16.sh
          echo "  LFS_TGT: $LFS_TGT   host: $(gcc -dumpmachine)"
          echo "  gcc $GCC_VER / glibc $GLIBC_VER / binutils $BINUTILS_VER"
          echo "  image kernel: $KTAG ($KSHA)"
          echo "  sysroot epoch: $SYSROOT_EPOCH"

      # ---------------------------------------------------------------- cache
      # RESTORE AND SAVE ARE SPLIT ON PURPOSE. actions/cache saves at post-job
      # whatever happened, so a run that dies half way publishes a half-built
      # sysroot under the same key -- and then never replaces it, because the
      # key already exists. Restoring by prefix and saving under a run-unique
      # key means a good tree can always supersede a bad one.
      - name: 'Restore the sysroot if one was ever finished'
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            sysroot/tools
            sysroot/usr
            sysroot/etc
            sysroot/var
          key: gcc16-sysroot-${{ env.SYSROOT_EPOCH }}-${{ github.run_id }}
          restore-keys: |
            gcc16-sysroot-${{ env.SYSROOT_EPOCH }}-

      - name: 'Accept the restored tree ONLY if it is marked complete'
        run: |
          set -eu
          matched='${{ steps.restore.outputs.cache-matched-key }}'
          force='${{ github.event.inputs.rebuild_sysroot }}'
          echo "  restore key matched: ${matched:-<none>}"
          drop() {
            echo "  $1"
            rm -rf "$S/tools" "$S/usr" "$S/etc" "$S/var"
            mkdir -p "$S"/{etc,var,tools,work} "$S"/usr/{bin,lib,sbin,include}
            for i in bin lib sbin; do ln -sfn usr/$i "$S/$i"; done
          }
          if [ "$force" = "yes" ]; then
            drop "rebuild_sysroot=yes -- discarding whatever was restored"
          elif [ -f "$S/etc/.sysroot-complete" ]; then
            echo "  COMPLETE sysroot restored: $(du -sh "$S" | cut -f1)"
            echo "  chapters 5 and 6 will be skipped"
            if [ -f "$S/etc/.tools-complete" ]; then
              echo "  m4/bison/flex/perl/bc are present too"
            else
              echo "  kernel build tools absent -- they will be rebuilt"
            fi
          else
            drop "no completeness marker -- the restored tree is not trusted"
          fi
          # Report what a later step will key off, so the log says it once.
          echo "  skip chapter 5+6: $([ -f "$S/etc/.sysroot-complete" ] && echo yes || echo no)"
          echo "  skip box tools:   $([ -f "$S/etc/.tools-complete" ] && echo yes || echo no)"
          # If BOTH markers came back, this run will build nothing worth saving
          # and the cache should be left alone. If either is missing, this run
          # will produce something the cache does not have -- most importantly
          # openssl, which is a five-minute build nobody should repeat 20 times.
          if [ -f "$S/etc/.sysroot-complete" ] && [ -f "$S/etc/.tools-complete" ]; then
            echo "CACHE_IS_CURRENT=1" >> "$GITHUB_ENV"
            echo "  the cache is already current; nothing new to save"
          fi

      - name: 'Fetch everything (no network exists inside the box)'
        run: |
          set -eu
          # curl -f EXITS 22 ON A 404 AND SAYS NOTHING ELSE. The run died with
          # "Process completed with exit code 22" and the only clue was which
          # basename had been echoed last -- mpc-1.4.1.tar.gz, pinned by the
          # development book but not present at that mirror path. Try the
          # mirror, then ftp.gnu.org, then the other archive extension, and
          # name every URL that was attempted before giving up.
          get() {
            base=$(basename "$1"); echo "  $base"
            # The extension flip must be ONE substitution, not two in sequence:
            # `s/gz/xz/; s/xz/gz/` on the same string flips it and flips it
            # back, which is why the failure above listed the original URL
            # twice and never actually tried the other extension.
            case "$1" in
              *.tar.gz) alt=$(printf '%s' "$1" | sed 's/\.tar\.gz$/.tar.xz/') ;;
              *.tar.xz) alt=$(printf '%s' "$1" | sed 's/\.tar\.xz$/.tar.gz/') ;;
              *)        alt="$1" ;;
            esac
            gnu=$(printf '%s' "$1" | sed 's|https://mirrors.kernel.org/gnu|https://ftp.gnu.org/gnu|')
            # --http1.1 + --retry-all-errors: hermetic-gcc10 run 1 died on a
            # 110 MB kernel tarball with "curl: (92) HTTP/2 stream ...
            # PROTOCOL_ERROR". Exit 92 is not one of the statuses plain
            # --retry covers, so the retry budget never applied.
            kern=$(printf '%s' "$1" | sed 's|https://cdn.kernel.org|https://mirrors.edge.kernel.org|')
            for u in "$1" "$gnu" "$kern" "$alt"; do
              curl -fsSL --http1.1 --retry 3 --retry-all-errors --retry-delay 3 \
                --connect-timeout 15 --max-time 900 -O "$u" 2>/tmp/curl.err && return 0
            done
            echo "    COULD NOT FETCH."
            echo "    last curl error: $(tail -1 /tmp/curl.err 2>/dev/null)"
            echo "    tried:"
            printf '      %s\n' "$1" "$gnu" "$kern" "$alt"
            return 1
          }

          if [ -f "$S/etc/.sysroot-complete" ]; then
            echo "  --- toolchain sources not needed: sysroot came from cache ---"
          else
            get "$GNU/binutils/binutils-$BINUTILS_VER.tar.xz"
            get "$GNU/gcc/gcc-$GCC_VER/gcc-$GCC_VER.tar.xz"
            get "$GNU/glibc/glibc-$GLIBC_VER.tar.xz"
            # THE DEV BOOK REQUIRES TWO GLIBC PATCHES. Its chapter 5 says, in
            # as many words: "Now fix glibc to build against Linux 7:" and then
            # patches. Without them the build dies on misc/umount.o with
            # "cc1: all warnings being treated as errors", because glibc
            # compiles itself with -Werror and a Linux 7 UAPI header changes a
            # warning into a hard error. The version set was never wrong; a
            # STEP was missing.
            get "$LFS_PATCH/glibc-$GLIBC_VER-upstream_fixes-1.patch"
            get "$LFS_PATCH/glibc-fhs-1.patch"
            get "$GNU/gmp/gmp-$GMP_VER.tar.xz"
            get "$GNU/mpfr/mpfr-$MPFR_VER.tar.xz"
            get "$GNU/mpc/mpc-$MPC_VER.tar.gz"
            get "$GNU/make/make-4.4.1.tar.gz"
            get "https://busybox.net/downloads/busybox-1.36.1.tar.bz2"
            get "https://cdn.kernel.org/pub/linux/kernel/v${KHDR_VER%%.*}.x/linux-$KHDR_VER.tar.xz"
          fi

          if [ -f "$S/etc/.tools-complete" ]; then
            echo "  --- m4/bison/flex/perl/bc not needed: already in the box ---"
          else
            get "$GNU/m4/m4-$M4_VER.tar.xz"
            get "$GNU/bison/bison-$BISON_VER.tar.xz"
            get "https://github.com/westes/flex/releases/download/v$FLEX_VER/flex-$FLEX_VER.tar.gz"
            get "https://www.cpan.org/src/5.0/perl-$PERL_VER.tar.xz"
            get "https://github.com/gavinhoward/bc/releases/download/$BC_VER/bc-$BC_VER.tar.xz"
            get "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VER/openssl-$OPENSSL_VER.tar.gz"
          fi

          echo "  --- linux $KTAG from git ---"
          rm -rf ksrc
          # NOT `git clone … | grep -v <progress> || true`. That is how the
          # 94,843-line "Updating files: 32%" spam gets suppressed, and it also
          # makes a failed clone exit 0 -- the failure would then surface two
          # lines later as a confusing rev-parse error about a directory that
          # was never created. Log to a file instead: same quiet output, and a
          # clone failure stays a clone failure.
          if ! git clone --depth 1 --branch "$KTAG" \
               https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git \
               ksrc > /tmp/clone.log 2>&1; then
            echo "    CLONE FAILED:"
            tail -15 /tmp/clone.log | sed 's/^/      /'
            exit 1
          fi
          got=$(git -C ksrc rev-parse --short HEAD)
          echo "    $KTAG -> $got  (expected $KSHA)"
          # PIN BY COMMIT, NOT BY TAG. rc tags are re-cut more readily than
          # release tags; if this ever stops matching, the tree under test has
          # changed and that is worth knowing loudly rather than silently.
          case "$got" in
            "$KSHA"*) echo "    commit matches the pin" ;;
            *) echo "    COMMIT MISMATCH -- the tag has moved since this was pinned"
               echo "    continuing, but the result is about $got, not $KSHA" ;;
          esac

      # ------------------------------------------------------- LFS chapter 5
      - name: '5.2 binutils pass 1'
        run: |
          set -eu
          if [ -f "$S/etc/.sysroot-complete" ]; then echo "  (cached sysroot -- skipped)"; exit 0; fi
          die() { echo "  --- $1 ---"; grep -nE "Error [0-9]|configure: error|error:" "$2" | head -10 | sed 's/^/    /'; tail -12 "$2" | sed 's/^/    /'; exit 1; }
          tar xf "binutils-$BINUTILS_VER.tar.xz"
          mkdir -p b-bu1
          cd b-bu1
          "../binutils-$BINUTILS_VER/configure" --prefix="$S/tools" \
            --with-sysroot="$S" --target="$LFS_TGT" --disable-nls \
            --enable-gprofng=no --disable-werror --enable-new-dtags \
            --enable-default-hash-style=gnu > c.log 2>&1 || die configure c.log
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make install > i.log 2>&1 || die install i.log
          echo "  $(ls "$S/tools/bin" | wc -l) cross binaries"

      - name: '5.3 gcc 16.1 pass 1'
        run: |
          set -eu
          if [ -f "$S/etc/.sysroot-complete" ]; then echo "  (cached sysroot -- skipped)"; exit 0; fi
          die() { echo "  --- $1 ---"; grep -nE "Error [0-9]|configure: error|error:" "$2" | head -10 | sed 's/^/    /'; tail -12 "$2" | sed 's/^/    /'; exit 1; }
          tar xf "gcc-$GCC_VER.tar.xz"
          ( cd "gcc-$GCC_VER"
            tar xf "../gmp-$GMP_VER.tar.xz"
            mv "gmp-$GMP_VER" gmp
            tar xf "../mpfr-$MPFR_VER.tar.xz"
            mv "mpfr-$MPFR_VER" mpfr
            tar xf "$(ls ../mpc-$MPC_VER.tar.* | head -1)"
            mv "mpc-$MPC_VER" mpc

            # THE 64-BIT LIBDIR. The book has this step and writes it for the
            # only architecture it supports:
            #     case $(uname -m) in
            #       x86_64) sed -e '/m64=/s/lib64/lib/' \
            #                   -i.orig gcc/config/i386/t-linux64 ;;
            #     esac
            # The aarch64 file that does the same job is t-aarch64-linux:
            #     MULTILIB_OSDIRNAMES = mabi.lp64=../lib64
            # Skipping it is why the last run put glibc in /usr/lib (forced by
            # libc_cv_slibdir) and libstdc++ in /usr/lib64, which is a
            # directory this sysroot has no symlink to and nothing searches.
            # Nothing in the book covers aarch64, so this is OUR delta and it
            # is recorded here rather than inferred from the diff.
            #
            # ASSERT THE ANCHOR. A sed that matches nothing ships an unchanged
            # file and looks exactly like a sed that did not work.
            t=gcc/config/aarch64/t-aarch64-linux
            [ -f "$t" ] || { echo "  $t is missing -- gcc has moved this file"; exit 1; }
            grep -q 'mabi\.lp64=' "$t" || {
              echo "  $t has no mabi.lp64= line. It now reads:"
              sed 's/^/    /' "$t"; exit 1; }
            sed -e '/mabi\.lp64=/s|lib64|lib|' -i.orig "$t"
            echo "  64-bit libdir: $(grep 'mabi\.lp64=' "$t")" )

          mkdir -p b-gcc1 && cd b-gcc1
          # --disable-fixincludes is the dev book's addition over 13.0.
          "../gcc-$GCC_VER/configure" --target="$LFS_TGT" --prefix="$S/tools" \
            --with-glibc-version="$GLIBC_VER" --with-sysroot="$S" \
            --with-newlib --without-headers --enable-default-pie \
            --enable-default-ssp --disable-nls --disable-shared \
            --disable-multilib --disable-threads --disable-libatomic \
            --disable-libgomp --disable-libquadmath --disable-libssp \
            --disable-libvtv --disable-libstdcxx --disable-fixincludes \
            --enable-languages=c,c++ > c.log 2>&1 || die configure c.log
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make install > i.log 2>&1 || die install i.log
          # The full internal limits.h. Without it a --without-headers gcc has a
          # self-contained one with no PATH_MAX, and binutils pass 2 dies on
          # ld/ldmain.c naming a macro rather than the include chain.
          LIMH=$(dirname "$("$LFS_TGT-gcc" -print-libgcc-file-name)")
          wrote=0
          for d in include include-fixed; do
            [ -d "$LIMH/$d" ] || continue
            cat "../gcc-$GCC_VER/gcc/limitx.h" "../gcc-$GCC_VER/gcc/glimits.h" \
                "../gcc-$GCC_VER/gcc/limity.h" > "$LIMH/$d/limits.h"
            wrote=$((wrote+1))
          done
          # A LOOP THAT `continue`S PAST EVERY ITERATION IS NOT A STEP. With
          # --disable-fixincludes there may be no include-fixed at all, and if
          # `include` ever moves too this would write nothing and say nothing.
          [ "$wrote" -gt 0 ] || { echo "  limits.h written to NO directory under $LIMH"; ls "$LIMH" | sed 's/^/    /'; exit 1; }
          echo "  limits.h written to $wrote director(y|ies) under $LIMH"
          "$LFS_TGT-gcc" --version | head -1 | sed 's/^/  /'

      - name: '5.4 linux API headers'
        run: |
          set -eu
          if [ -f "$S/etc/.sysroot-complete" ]; then echo "  (cached sysroot -- skipped)"; exit 0; fi
          tar xf "linux-$KHDR_VER.tar.xz"
          cd "linux-$KHDR_VER"
          make mrproper > /dev/null 2>&1
          make ARCH=arm64 headers > /dev/null 2>&1
          find usr/include -type f ! -name '*.h' -delete
          cp -r usr/include "$S/usr"
          echo "  headers: $(find "$S/usr/include" -name '*.h' | wc -l)"
          for h in asm/unistd.h linux/version.h; do
            [ -f "$S/usr/include/$h" ] || { echo "  $h MISSING"; exit 1; }
          done

      - name: '5.5 glibc, cross-compiled into the sysroot'
        run: |
          set -eu
          if [ -f "$S/etc/.sysroot-complete" ]; then echo "  (cached sysroot -- skipped)"; exit 0; fi
          die() { echo "  --- $1 ---"; grep -nE "Error [0-9]|configure: error" "$2" | head -10 | sed 's/^/    /'; tail -12 "$2" | sed 's/^/    /'; exit 1; }
          tar xf "glibc-$GLIBC_VER.tar.xz"
          # The book applies FHS first, then the upstream fixes, both with -Np1.
          ( cd "glibc-$GLIBC_VER"
            for pat in "glibc-fhs-1.patch" "glibc-$GLIBC_VER-upstream_fixes-1.patch"; do
              [ -f "$W/$pat" ] || { echo "  MISSING $pat -- the fetch step did not get it"; exit 1; }
              if patch -Np1 -i "$W/$pat" > "$W/$pat.log" 2>&1; then
                echo "  applied $pat"
              else
                echo "  FAILED to apply $pat"; tail -12 "$W/$pat.log"; exit 1
              fi
            done )
          mkdir -p b-glibc && cd b-glibc
          echo "rootsbindir=/usr/sbin" > configparms
          # --enable-kernel=5.10 is the dev book's value; 13.0 says 5.4.
          "../glibc-$GLIBC_VER/configure" --prefix=/usr --host="$LFS_TGT" \
            --build="$(../glibc-$GLIBC_VER/scripts/config.guess)" \
            --enable-kernel=5.10 --with-headers="$S/usr/include" \
            --disable-nscd libc_cv_slibdir=/usr/lib \
            > c.log 2>&1 || die configure c.log
          # glibc records CC in config.make, not Makefile. Checking the wrong
          # file once produced "host build in disguise" about a good cross build.
          cc=$(sed -n 's/^CC *= *//p' config.make Makefile 2>/dev/null | head -1)
          echo "  CC: ${cc:-<undetermined>}"
          case "$cc" in
            *"$LFS_TGT"*) echo "  cross compiler confirmed" ;;
            *) echo "  not the cross compiler, or undetermined"; exit 1 ;;
          esac
          # PREFER THE COMPILER DIAGNOSTIC. die() greps "Error [0-9]|configure: error",
          # and make prints several of those per real failure, so the head limit filled
          # with make summary lines and the actual message never appeared.
          if ! make -j"$(nproc)" > b.log 2>&1; then
            echo "  --- the warning that became an error ---"
            grep -nE "error:|warning:" b.log | grep -v "make\[" | head -14 | sed "s/^/    /"
            echo "  --- make errors ---"
            grep -nE "\*\*\* \[" b.log | head -4 | sed "s/^/    /"
            echo "  --- tail ---"
            tail -15 b.log | sed "s/^/    /"
            exit 1
          fi
          make DESTDIR="$S" install > i.log 2>&1 || die install i.log
          # The book's own follow-up: ldd hard-codes a loader path that is
          # wrong once /usr is the root of a sysroot rather than a prefix.
          sed '/RTLDLIST=/s@/usr@@g' -i "$S/usr/bin/ldd"
          # LFS's own sanity check, at the seam where both earlier sysroots stopped
          echo 'int main(void){return 0;}' > /tmp/lt.c
          if "$LFS_TGT-gcc" /tmp/lt.c -o /tmp/lt 2> /tmp/lt.err; then
            readelf -l /tmp/lt | grep -A1 'program interpreter' | sed 's/^/  /'
          else
            echo "  CANNOT LINK:"; head -6 /tmp/lt.err | sed 's/^/    /'
            "$LFS_TGT-gcc" -print-search-dirs | head -3 | sed 's/^/    /'
            ls "$S/usr/lib" | head -10 | sed 's/^/    /'; exit 1
          fi

      - name: '5.6 libstdc++'
        run: |
          set -eu
          if [ -f "$S/etc/.sysroot-complete" ]; then echo "  (cached sysroot -- skipped)"; exit 0; fi
          die() { echo "  --- $1 ---"; grep -nE "Error [0-9]|configure: error|error:" "$2" | head -10 | sed 's/^/    /'; tail -12 "$2" | sed 's/^/    /'; exit 1; }
          command -v "$LFS_TGT-g++" > /dev/null || { echo "  cross g++ not on PATH"; exit 1; }
          mkdir -p b-libstdcxx && cd b-libstdcxx
          # CXX=$LFS_TGT-gcc IS THE BOOK'S, AND IT IS NOT COSMETIC. It says:
          # the default $LFS_TGT-g++ "would automatically specify linking
          # against libstdc++ when invoking the linker, but in our case
          # libstdc++ is not installed yet so some checks in the configure
          # script would misbehave".
          "../gcc-$GCC_VER/libstdc++-v3/configure" --host="$LFS_TGT" \
            --build="$(../gcc-$GCC_VER/config.guess)" \
            CXX="$LFS_TGT-gcc" --prefix=/usr \
            --disable-multilib --disable-nls --disable-libstdcxx-pch \
            --with-gxx-include-dir="/tools/$LFS_TGT/include/c++/$GCC_VER" \
            > c.log 2>&1 || die configure c.log
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make DESTDIR="$S" install > i.log 2>&1 || die install i.log
          # "Remove the libtool archive files because they are harmful for
          # cross-compilation" -- the book, verbatim, and never done here.
          rm -fv "$S"/usr/lib/lib{stdc++{,exp,fs},supc++}.la 2>/dev/null || true
          # THE CHECK THAT COULD NOT FAIL. This used to be
          #     ls .../usr/lib/libstdc++* | sed ... || echo "NO libstdc++"
          # where the `||` reads sed's status, never the ls's, so the fallback
          # was unreachable -- and the `find` below it ran unconditionally.
          # The lib64 paths in the last run's log were that fallback printing,
          # which read exactly like the check passing.
          if [ -e "$S/usr/lib/libstdc++.so.6" ]; then
            echo "  libstdc++ in /usr/lib:"
            ls "$S"/usr/lib/libstdc++.so.* | sed 's/^/    /'
          else
            echo "  NO libstdc++.so.6 IN /usr/lib. Where it went instead:"
            find "$S" -name 'libstdc++.so*' 2>/dev/null | head -8 | sed 's/^/    /'
            echo "  If these are under /usr/lib64 the t-aarch64-linux sed in 5.3"
            echo "  did not take effect on this gcc."
            exit 1
          fi

      # ------------------------------------------------------- LFS chapter 6
      - name: '6.x userland: BusyBox, make, binutils pass 2, gcc pass 2'
        run: |
          set -eu
          if [ -f "$S/etc/.sysroot-complete" ]; then echo "  (cached sysroot -- skipped)"; exit 0; fi
          die() { echo "  --- $1 ---"; grep -nE "Error [0-9]|configure: error|error:" "$2" | head -10 | sed 's/^/    /'; tail -12 "$2" | sed 's/^/    /'; exit 1; }

          # SAY WHERE YOU ARE. This step runs four builds over ~18 minutes and
          # used to print nothing until the very end, so when it died in six
          # seconds the log was completely empty and the only way to locate the
          # failure was to count how long the step had taken. One echo per
          # package makes the last line printed the answer.
          echo "  --- busybox ---"
          # SPLIT, NOT `tar … && cd …`. set -e does not fire on the left of
          # an &&, so a failed tar would fall through to a cd that succeeds
          # against whatever the previous run left behind, and the build would
          # run in a stale tree. Same reason every other tar below is on its
          # own line.
          tar xf busybox-1.36.1.tar.bz2
          cd busybox-1.36.1
          make defconfig > /dev/null 2>&1
          # `yes` ALWAYS DIES OF SIGPIPE HERE -- make closes the pipe when it is
          # done -- so this line is only safe while the shell is NOT running
          # under pipefail. It is the line that killed run 30209118941 in six
          # seconds with no output at all. Left as-is deliberately: the status
          # that matters is make's, and that is what a plain pipeline reports.
          yes '' 2>/dev/null | make oldconfig > /dev/null 2>&1
          for sym in CONFIG_TC CONFIG_TLS CONFIG_SSL_CLIENT \
                     CONFIG_FEATURE_WGET_HTTPS CONFIG_FEATURE_WGET_OPENSSL; do
            sed -i "s/^$sym=y/# $sym is not set/" .config
          done
          # BusyBox reads CONFIG_EXTRA_CFLAGS, not EXTRA_CFLAGS.
          sed -i 's|^CONFIG_EXTRA_CFLAGS=.*|CONFIG_EXTRA_CFLAGS="-D_GNU_SOURCE"|' .config
          grep -q '^CONFIG_EXTRA_CFLAGS="-D_GNU_SOURCE"' .config \
            || { echo "  CONFIG_EXTRA_CFLAGS did not take"; exit 1; }
          make -j"$(nproc)" CROSS_COMPILE="$LFS_TGT-" > b.log 2>&1 || die busybox b.log
          cp busybox "$S/usr/bin/"
          # From INSIDE: this binary needs the sysroot's glibc, which is newer
          # than the runner's, so the host cannot execute it.
          S="$S" "$W/box16.sh" /usr/bin/busybox --install -s /usr/bin
          n=$(ls "$S/usr/bin" | wc -l); echo "  applets: $n"
          [ "$n" -gt 100 ] || { echo "  --install did not run"; exit 1; }

          echo "  --- make ---"
          cd "$W"
          tar xf make-4.4.1.tar.gz
          mkdir -p b-make && cd b-make
          # make keeps config.guess in build-aux/, as the book says. The
          # top-level path fails silently and configure runs with --build=.
          ../make-4.4.1/configure --prefix=/usr --host="$LFS_TGT" \
            --build="$(../make-4.4.1/build-aux/config.guess)" --disable-nls \
            > c.log 2>&1 || die configure c.log
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make DESTDIR="$S" install > i.log 2>&1 || die install i.log

          echo "  --- binutils pass 2 ---"
          cd "$W"
          # THE BOOK'S ltmain.sh WORKAROUND, and the reason it exists is
          # hermeticity: "This inconsistency may cause produced binaries
          # mistakenly linked against libraries from the host distro."
          # A bare line number is exactly the anchor that silently edits the
          # wrong line, so it is checked before it is used and reported when
          # it does not hold.
          lt="binutils-$BINUTILS_VER/ltmain.sh"
          if sed -n '6031p' "$lt" | grep -q 'add_dir'; then
            sed -i '6031s/\$add_dir//' "$lt"
            echo "  ltmain.sh:6031 patched (host-libdir contamination guard)"
          else
            echo "  ltmain.sh:6031 does not mention \$add_dir -- book patch SKIPPED"
            echo "    that line reads: $(sed -n '6031p' "$lt")"
            echo "    (not fatal: it is a workaround, and binutils may have moved it)"
          fi
          mkdir -p b-bu2 && cd b-bu2
          "../binutils-$BINUTILS_VER/configure" --prefix=/usr \
            --build="$(../binutils-$BINUTILS_VER/config.guess)" --host="$LFS_TGT" \
            --disable-nls --enable-shared --enable-gprofng=no --disable-werror \
            --enable-64-bit-bfd --enable-new-dtags --enable-default-hash-style=gnu \
            > c.log 2>&1 || die configure c.log
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make DESTDIR="$S" install > i.log 2>&1 || die install i.log
          # Book: "harmful for cross compilation", plus the static libs.
          rm -fv "$S"/usr/lib/lib{bfd,ctf,ctf-nobfd,opcodes,sframe}.{a,la} 2>/dev/null || true

          echo "  --- gcc pass 2 ---"
          cd "$W"
          mkdir -p b-gcc2 && cd b-gcc2
          # target_configargs=... is the book's, and it is what gives the
          # target libgcc/libstdc++ POSIX threads; without it they inherit
          # pass 1's --disable-threads.
          "../gcc-$GCC_VER/configure" --build="$(../gcc-$GCC_VER/config.guess)" \
            --host="$LFS_TGT" --target="$LFS_TGT" \
            LDFLAGS_FOR_TARGET=-L"$PWD/$LFS_TGT/libgcc" \
            target_configargs=gcc_cv_target_thread_file=posix \
            --prefix=/usr --with-build-sysroot="$S" --enable-default-pie \
            --enable-default-ssp --disable-nls --disable-multilib \
            --disable-libatomic --disable-libgomp --disable-libquadmath \
            --disable-libsanitizer --disable-libssp --disable-libvtv \
            --disable-fixincludes --enable-languages=c,c++ \
            > c.log 2>&1 || die configure c.log
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make DESTDIR="$S" install > i.log 2>&1 || die install i.log
          ln -sfv gcc "$S/usr/bin/cc"
          echo "  sysroot: $(du -sh "$S" | cut -f1)"

      - name: 'THE LADDER: is the box self-sufficient?'
        run: |
          set -u
          set +e
          rung() { name=$1; shift
            out=$(S="$S" "$W/box16.sh" "$@" 2>&1); rc=$?
            case "$out" in *"not found"*|*"No such file"*) rc=127 ;; esac
            [ $rc -eq 0 ] && printf '  %-16s OK    %s\n' "$name" "$(printf '%s' "$out" | head -1 | cut -c1-50)" \
                          || printf '  %-16s FAIL  %s\n' "$name" "$(printf '%s' "$out" | head -1 | cut -c1-50)"; }
          rung shell   /bin/sh -c true
          rung make    /usr/bin/make --version
          rung as      /usr/bin/as --version
          rung ld      /usr/bin/ld --version
          rung gcc     /usr/bin/gcc --version
          mkdir -p "$S/work"
          printf 'int main(void){return 42;}\n' > "$S/work/t.c"
          S="$S" "$W/box16.sh" /usr/bin/gcc -o /work/t /work/t.c 2>&1 | head -5 | sed 's/^/    /'
          S="$S" "$W/box16.sh" /work/t; rc=$?
          echo "  compile+run: exit=$rc (expect 42)"
          # A CHECK THAT CANNOT FAIL IS NOT A CHECK. This number was printed
          # and never read, so a box with a broken compiler would go on to
          # spend half an hour failing to build a kernel for reasons that had
          # nothing to do with the kernel.
          if [ "$rc" -ne 42 ]; then
            echo "  the box cannot compile and run a C program -- stopping here"
            exit 1
          fi
          # THE MARKER IS THE DEFINITION OF "COMPLETE", and it is written here
          # rather than at the end of chapter 6 on purpose: a tree that builds
          # is not the same as a tree that works, and only this proves the
          # second. Nothing without this file is ever restored from cache.
          date -u +%FT%TZ > "$S/etc/.sysroot-complete"
          echo "SYSROOT_COMPLETE=1" >> "$GITHUB_ENV"
          echo "  marked complete"

      - name: 'TEST THE COMPILER INSIDE the box'
        run: |
          set -eu
          # BEFORE THE KERNEL, DELIBERATELY. A broken compiler should cost one
          # minute here rather than eleven minutes of kernel build ending in a
          # confusing error a long way from its cause.
          cat > "$S/work/gcctest.sh" <<'GEOF'
          #!/bin/sh
          # Compiler acceptance, run INSIDE the box by the sysroot's own gcc.
          #
          # WHAT THIS IS AND IS NOT. The reference way to test a gcc built from source
          # is GCC's own DejaGnu suite (`make -k check`, ~100k tests, which LFS runs at
          # 8.32 after building Tcl, Expect and DejaGnu) and gcc's 3-stage bootstrap
          # comparison, where stage2 and stage3 must come out byte-identical. Neither is
          # here yet: the first needs three packages this box does not have, the second
          # is a recorded deferral (`--disable-bootstrap`).
          #
          # What this is instead: the checks that catch a broken toolchain in one minute
          # rather than in an eleven-minute kernel build with a confusing error. Every
          # one of them is a thing that has actually gone wrong in a bootstrap somewhere
          # -- wrong start files, a libgcc without unwinding, a libstdc++ nothing can
          # link, threads configured to `none`, an optimiser that changes an answer.
          #
          # NO `set -e`. A suite that stops at the first failure reports one fact per
          # run; this one reports all of them and exits non-zero at the end.

          pass=0; fail=0
          ok()  { pass=$((pass+1)); printf '  PASS  %s\n' "$1"; }
          bad() { fail=$((fail+1)); printf '  FAIL  %s\n' "$1"
                  [ -n "$2" ] && printf '        %s\n' "$2"; }
          # Run a command, pass if it exits 0.
          try() { n=$1; shift
                  if "$@" > /tmp/t.log 2>&1; then ok "$n"
                  else bad "$n" "$(head -3 /tmp/t.log | tr '\n' ' ' | cut -c1-140)"; fi; }
          # Compile+run, pass if it exits 0 AND prints what we expect.
          cr() { n=$1; want=$2; src=$3; shift 3
                 if ! gcc "$src" -o /tmp/a "$@" > /tmp/t.log 2>&1; then
                   bad "$n" "compile: $(grep -m1 'error:' /tmp/t.log | cut -c1-130)"; return; fi
                 got=$(/tmp/a 2>&1); rc=$?
                 if [ $rc -ne 0 ]; then bad "$n" "ran, exit=$rc: $(echo "$got" | head -1)"
                 elif [ "$got" != "$want" ]; then bad "$n" "wanted [$want] got [$got]"
                 else ok "$n"; fi; }

          mkdir -p /work/gcctest /work/guest-bin
          cd /work/gcctest

          echo "=== 0. what is actually installed in this box ==="
          real=0; links=0
          for f in /usr/bin/*; do
            if [ -L "$f" ]; then links=$((links+1)); else real=$((real+1)); fi
          done
          echo "  /usr/bin holds $real real programs and $links busybox applet symlinks"
          echo "  the real programs:"
          for f in /usr/bin/* /usr/sbin/*; do
            [ -L "$f" ] && continue
            [ -f "$f" ] || continue
            echo "    $(ls -ld "$f" | tr -s ' ' | cut -d' ' -f5) $(basename "$f")"
          done | sort -k2 | sed 's/^/  /'
          echo "  shared libraries in /usr/lib:"
          for f in /usr/lib/*.so*; do
            [ -f "$f" ] && echo "    $(ls -ld "$f" | tr -s ' ' | cut -d' ' -f5) $(basename "$f")"
          done
          echo "  /usr is $(du -sh /usr 2>/dev/null | cut -f1), /tools is $(du -sh /tools 2>/dev/null | cut -f1)"

          echo "=== 1. identity ==="
          echo "  gcc:      $(gcc --version | head -1)"
          echo "  g++:      $(g++ --version | head -1)"
          echo "  target:   $(gcc -dumpmachine)"
          echo "  version:  $(gcc -dumpversion)"
          echo "  ld:       $(ld --version | head -1)"
          echo "  as:       $(as --version | head -1)"
          echo "  configure line:"
          gcc -v 2>&1 | tr ' ' '\n' | grep -- '^--' | sed 's/^/      /'

          echo "=== 2. the driver can find its own parts ==="
          for p in cc1 cc1plus collect2; do
            f=$(gcc -print-prog-name=$p)
            case "$f" in
              /*) [ -x "$f" ] && ok "$p exists ($f)" || bad "$p" "driver names $f, not executable" ;;
              *)  bad "$p" "driver could not resolve it (said '$f')" ;;
            esac
          done
          for o in crt1.o crti.o crtn.o crtbegin.o libc.so libgcc.a; do
            f=$(gcc -print-file-name=$o)
            case "$f" in
              /*) [ -e "$f" ] && ok "$o found" || bad "$o" "driver names $f, missing" ;;
              *)  bad "$o" "not found (driver echoed the bare name)" ;;
            esac
          done

          echo "=== 3. LFS's own toolchain sanity check, all six parts ==="
          # The book runs these after glibc and treats any deviation as fatal. This box
          # only ever ran the first one.
          echo 'int main(){}' | gcc -x c - -v -Wl,--verbose > dummy.log 2>&1
          if readelf -l a.out 2>/dev/null | grep -q 'program interpreter'; then
            ok "links, and has a program interpreter"
            echo "        $(readelf -l a.out | sed -n 's/.*program interpreter: \(.*\)\]/\1/p')"
          else
            bad "link + interpreter" "$(tail -3 dummy.log | tr '\n' ' ')"
          fi
          n=$(grep -E -c "/usr/lib.*/S?crt[1in].*succeeded" dummy.log)
          [ "$n" -ge 3 ] && ok "start files: $n of Scrt1.o/crti.o/crtn.o from /usr/lib" \
                         || bad "start files" "only $n matched -- wrong crt files would be silent"
          grep -q "^ /usr/include" dummy.log && ok "header search reaches /usr/include" \
                                             || bad "header search" "no /usr/include in the include chain"
          grep -q 'SEARCH_DIR("/usr/lib")\|SEARCH_DIR("=/usr/lib")' dummy.log \
            && ok "linker searches /usr/lib" || bad "linker search path" "no /usr/lib SEARCH_DIR"
          grep -q "/lib.*/libc.so.6 " dummy.log && ok "uses the sysroot libc.so.6" \
                                                || bad "libc" "libc.so.6 not opened from the sysroot"
          grep -q "found ld-linux" dummy.log && ok "dynamic linker resolved" \
                                             || bad "dynamic linker" "no 'found ld-linux' line"

          echo "=== 4. codegen: the same answer at every optimisation level ==="
          # A DIFFERENCE HERE IS A MISCOMPILE, which is the failure mode a bootstrap
          # most needs to catch and the one a smoke test never will. The program is
          # deliberately free of undefined behaviour, so every level must agree.
          cat > corpus.c <<'CEOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <math.h>
          #include <setjmp.h>
          #include <stdarg.h>
          #include <stdint.h>
          #include <limits.h>

          struct big { long long a; double b; char c[7]; short d; };
          struct bits { unsigned x:3, y:5, z:17; };

          static struct big by_value(struct big s) { s.a += 1; s.b *= 2.0; s.d ^= 0x5a5a; return s; }
          static long long va(int n, ...) {
            va_list ap; long long t = 0; va_start(ap, n);
            for (int i = 0; i < n; i++) t += va_arg(ap, int);
            va_end(ap); return t;
          }
          static jmp_buf jb;
          static void thrower(int v) { longjmp(jb, v); }
          static int cmp(const void *a, const void *b) {
            int x = *(const int *)a, y = *(const int *)b; return (x > y) - (x < y);
          }
          static unsigned long long fib(int n) { return n < 2 ? n : fib(n-1) + fib(n-2); }

          int main(void) {
            unsigned long long h = 1469598103934665603ULL;
            #define MIX(v) do { h ^= (unsigned long long)(v); h *= 1099511628211ULL; } while (0)

            for (long long i = 1; i <= 5000; i++) MIX(i * 2654435761LL % 1000003LL);

            struct big s = { 42, 1.5, "abcdef", 0x1234 };
            struct big r = by_value(s);
            MIX(r.a); MIX((long long)(r.b * 1000)); MIX(r.d); MIX(strlen(r.c));

            struct bits b = { 5, 17, 100000 };
            MIX(b.x); MIX(b.y); MIX(b.z);

            MIX(va(5, 1, 2, 3, 4, 5));

            volatile int jv = 0;
            if ((jv = setjmp(jb)) == 0) thrower(99);
            MIX(jv);

            int n = 64, *arr = malloc(n * sizeof *arr);
            for (int i = 0; i < n; i++) arr[i] = (i * 7919) % 251;
            qsort(arr, n, sizeof *arr, cmp);
            for (int i = 0; i < n; i++) MIX(arr[i]);
            free(arr);

            int vn = 17; int vla[vn];
            for (int i = 0; i < vn; i++) vla[i] = i * i;
            for (int i = 0; i < vn; i++) MIX(vla[i]);

            double d = 0.0;
            for (int i = 1; i <= 200; i++) d += sqrt((double)i) / (double)i;
            MIX((long long)(d * 1e6));
            MIX((long long)(pow(2.0, 30.0)));
            long double ld = 1.0L; for (int i = 1; i <= 20; i++) ld *= 1.0000001L;
            MIX((long long)(ld * 1e9));

            MIX(fib(24));

            uint64_t u = 0xdeadbeefcafebabeULL;
            MIX(u >> 13); MIX((uint32_t)u * 2654435761u); MIX(__builtin_popcountll(u));
            MIX(INT_MAX); MIX((int)((unsigned)INT_MAX + 1u));

            char buf[64]; snprintf(buf, sizeof buf, "%lld/%.3f/%s", r.a, r.b, r.c);
            for (const char *p = buf; *p; p++) MIX(*p);

            printf("%llu\n", h);
            return 0;
          }
          CEOF
          base=""
          for opt in -O0 -O1 -O2 -O3 -Os "-O2 -flto" "-O2 -fno-inline" "-O3 -funroll-loops"; do
            if ! gcc $opt corpus.c -o /tmp/c -lm > /tmp/t.log 2>&1; then
              bad "corpus $opt" "compile: $(grep -m1 'error:' /tmp/t.log | cut -c1-120)"; continue; fi
            got=$(/tmp/c); rc=$?
            if [ $rc -ne 0 ]; then bad "corpus $opt" "exit=$rc"; continue; fi
            if [ -z "$base" ]; then base=$got; ok "corpus $opt -> $got (reference)"
            elif [ "$got" = "$base" ]; then ok "corpus $opt agrees"
            else bad "corpus $opt" "MISCOMPILE: got $got, -O0 said $base"; fi
          done

          echo "=== 5. runtime libraries ==="
          cat > thr.c <<'CEOF'
          #include <stdio.h>
          #include <pthread.h>
          #include <stdatomic.h>
          static atomic_int counter;
          static pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER;
          static long guarded;
          static void *w(void *p) {
            (void)p;
            for (int i = 0; i < 10000; i++) {
              atomic_fetch_add(&counter, 1);
              pthread_mutex_lock(&m); guarded++; pthread_mutex_unlock(&m);
            }
            return NULL;
          }
          int main(void) {
            pthread_t t[4];
            for (int i = 0; i < 4; i++) if (pthread_create(&t[i], NULL, w, NULL)) return 2;
            for (int i = 0; i < 4; i++) pthread_join(t[i], NULL);
            printf("%d %ld\n", atomic_load(&counter), guarded);
            return 0;
          }
          CEOF
          # THREADS ARE NOT A FORMALITY HERE. gcc pass 1 is built --disable-threads, and
          # the target libgcc/libstdc++ inherit that unless the book's
          # target_configargs=gcc_cv_target_thread_file=posix is passed to pass 2. If
          # that flag ever goes missing this test is what says so.
          cr "pthreads + C11 atomics" "40000 40000" thr.c -O2 -pthread

          printf 'int main(void){return 0;}\n' > st.c
          try "static link (-static)" gcc -O2 -static st.c -o /tmp/st
          [ -x /tmp/st ] && try "static binary runs" /tmp/st

          cat > lib.c <<'CEOF'
          int libfn(int x) { return x * 3 + 1; }
          CEOF
          cat > usr.c <<'CEOF'
          #include <stdio.h>
          extern int libfn(int);
          int main(void) { printf("%d\n", libfn(13)); return 0; }
          CEOF
          if gcc -O2 -fPIC -shared lib.c -o libveron.so > /tmp/t.log 2>&1; then
            ok "build a shared library"
            if gcc -O2 usr.c -o /tmp/dyn -L. -lveron -Wl,-rpath,"$PWD" > /tmp/t.log 2>&1; then
              got=$(/tmp/dyn 2>&1)
              [ "$got" = "40" ] && ok "link against and call into a .so" \
                                || bad "call into a .so" "got [$got]"
            else bad "link against a .so" "$(grep -m1 . /tmp/t.log)"; fi
          else bad "build a shared library" "$(grep -m1 . /tmp/t.log)"; fi

          cat > dl.c <<'CEOF'
          #include <stdio.h>
          #include <dlfcn.h>
          int main(void) {
            void *h = dlopen("./libveron.so", RTLD_NOW);
            if (!h) { printf("dlopen: %s\n", dlerror()); return 1; }
            int (*f)(int) = (int (*)(int))dlsym(h, "libfn");
            if (!f) { printf("dlsym failed\n"); return 1; }
            printf("%d\n", f(13)); dlclose(h); return 0;
          }
          CEOF
          cr "dlopen + dlsym" "40" dl.c -O2 -ldl

          echo "=== 6. C++ ==="
          cat > cxx.cpp <<'CEOF'
          #include <iostream>
          #include <vector>
          #include <map>
          #include <string>
          #include <algorithm>
          #include <memory>
          #include <stdexcept>
          #include <numeric>
          struct Base { virtual ~Base() = default; virtual int id() const { return 1; } };
          struct Derived : Base { int id() const override { return 2; } };
          template <typename T> T twice(T v) { return v + v; }
          int main() {
            std::vector<int> v(64);
            std::iota(v.begin(), v.end(), 1);
            std::sort(v.begin(), v.end(), [](int a, int b) { return a % 7 < b % 7; });
            long sum = std::accumulate(v.begin(), v.end(), 0L);
            std::map<std::string, int> m{{"a", 1}, {"b", 2}};
            m["c"] = 3;
            std::unique_ptr<Base> p(new Derived);
            Derived *d = dynamic_cast<Derived *>(p.get());
            int caught = 0;
            try { throw std::runtime_error("x"); } catch (const std::exception &) { caught = 1; }
            std::cout << sum << " " << m.size() << " " << (d ? d->id() : 0) << " "
                      << caught << " " << twice(std::string("ab")) << "\n";
            return 0;
          }
          CEOF
          for std in c++17 c++20 c++23; do
            if g++ -std=$std -O2 cxx.cpp -o /tmp/x > /tmp/t.log 2>&1; then
              got=$(/tmp/x 2>&1)
              [ "$got" = "2080 3 2 1 abab" ] && ok "C++ STL/RTTI/EH at -std=$std" \
                || bad "C++ at -std=$std" "got [$got]"
            else
              bad "C++ at -std=$std" "$(grep -m1 'error:' /tmp/t.log | cut -c1-130)"
            fi
          done
          try "static libstdc++" g++ -O2 -static-libstdc++ cxx.cpp -o /tmp/xs
          try "fully static C++"  g++ -O2 -static cxx.cpp -o /tmp/xss

          # EXCEPTIONS ACROSS A SHARED LIBRARY BOUNDARY. This is the check that a
          # libgcc built without unwind support cannot pass, and it is the open question
          # the gcc 4.7 leg has been carrying: cc1plus existing is not the same as g++
          # being able to link and unwind.
          cat > thrower.cpp <<'CEOF'
          #include <stdexcept>
          void boom() { throw std::runtime_error("from the .so"); }
          CEOF
          cat > catcher.cpp <<'CEOF'
          #include <iostream>
          #include <stdexcept>
          void boom();
          int main() {
            try { boom(); }
            catch (const std::runtime_error &e) { std::cout << e.what() << "\n"; return 0; }
            std::cout << "NOT CAUGHT\n"; return 1;
          }
          CEOF
          if g++ -O2 -fPIC -shared thrower.cpp -o libboom.so > /tmp/t.log 2>&1 \
             && g++ -O2 catcher.cpp -o /tmp/eh -L. -lboom -Wl,-rpath,"$PWD" >> /tmp/t.log 2>&1; then
            got=$(/tmp/eh 2>&1)
            [ "$got" = "from the .so" ] && ok "C++ exception thrown in a .so, caught in main" \
              || bad "cross-.so exception" "got [$got]"
          else
            bad "cross-.so exception" "$(grep -m1 'error:\|undefined' /tmp/t.log | cut -c1-130)"
          fi

          echo "=== 7. determinism ==="
          # Criterion 2 in miniature, and nearly free. The box sets SOURCE_DATE_EPOCH=0,
          # so two compilations of one file must produce identical bytes. If they do not,
          # nothing above this rung can be reproducible either.
          gcc -O2 -c corpus.c -o /tmp/o1.o 2>/dev/null
          gcc -O2 -c corpus.c -o /tmp/o2.o 2>/dev/null
          if cmp -s /tmp/o1.o /tmp/o2.o; then ok "same input twice -> byte-identical .o"
          else bad "determinism" "two compilations of one file differ"; fi

          echo "=== 8. binaries staged for the guest ==="
          # Built here, executed inside QEMU later. Compiling in the box proves the
          # compiler works; running the result under our own kernel, outside bwrap,
          # proves the ABI does.
          gcc -O2 corpus.c -o /work/guest-bin/veron-corpus -lm 2>/dev/null \
            && ok "staged veron-corpus (dynamic C)" || bad "staging veron-corpus"
          gcc -O2 -static st.c -o /work/guest-bin/veron-static 2>/dev/null \
            && ok "staged veron-static (static C)" || bad "staging veron-static"
          g++ -O2 cxx.cpp -o /work/guest-bin/veron-cxx 2>/dev/null \
            && ok "staged veron-cxx (dynamic C++)" || bad "staging veron-cxx"
          # The expected corpus checksum travels with them, so the guest checks a value
          # rather than merely checking that something ran.
          /work/guest-bin/veron-corpus > /work/guest-bin/corpus.expected 2>/dev/null
          echo "  corpus checksum: $(cat /work/guest-bin/corpus.expected)"

          echo "=== compiler: $pass passed, $fail failed ==="
          [ "$fail" -eq 0 ]
          GEOF
          chmod +x "$S/work/gcctest.sh"
          S="$S" "$W/box16.sh" /bin/sh /work/gcctest.sh 2>&1 | sed 's/^/    /'
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "  the compiler suite reported failures (exit $rc)"; exit 1; }

      - name: 'TEST THE USERLAND INSIDE the box'
        run: |
          set -eu
          # THE BOX'S ENTIRE USERLAND IS ONE BUSYBOX AND ~400 APPLETS, and
          # until now not one of them was ever tested. Every configure script,
          # every Makefile and the initramfs builder itself run on those
          # applets: if busybox's sed -i were subtly wrong, gcc's build would
          # fail somewhere unrecognisable. THE LADDER checked five things --
          # shell, make, as, ld, gcc -- and stopped.
          #
          # The same script runs again inside QEMU later, so the two
          # transcripts are directly comparable: one userland, two kernels.
          cat > "$S/work/utest.sh" <<'UEOF'
          #!/bin/sh
          # A SHELL SESSION ON THIS SYSTEM, PRINTED AS ONE.
          #
          # WHY THIS EXISTS. Everything above it tested the compiler and the kernel, and
          # nothing at all tested the userland -- which in this box is one busybox and
          # roughly 400 applets. Those applets are what every configure script, every
          # Makefile and the initramfs builder itself run on, and not one of them had
          # ever been exercised. When one turned out to be missing from the boot image,
          # the console said `cp: not found` and the reporting layer threw the line away
          # between a `head -30` and a `tail -40`.
          #
          # So this does not just assert. It SHOWS: every command is echoed with a
          # prompt and its real output follows, the way it would look if you were sat at
          # the machine. Where there is a known-correct answer it is checked as well, and
          # the check is what the run stands or falls on -- but the transcript is what
          # makes the result readable by a person.
          #
          # The same script runs in the box under bwrap and in the guest under QEMU. Two
          # very different environments, one set of expectations.

          P=0; F=0
          ok() { P=$((P+1)); echo "VERON-TEST PASS $1"; }
          no() { F=$((F+1)); echo "VERON-TEST FAIL $1${2:+ -- $2}"; }

          # show: run it and display it. For things worth looking at but with no single
          # correct answer -- a directory listing, free memory, the mount table.
          show() { echo; echo "  \$ $1"; eval "$1" 2>&1 | sed 's/^/    /'; }
          # chk: the same, and then hold the output to an expected value.
          chk() {
            d=$1; w=$2; c=$3
            echo; echo "  \$ $c"
            g=$(eval "$c" 2>&1)
            echo "$g" | sed 's/^/    /'
            if [ "$g" = "$w" ]; then ok "$d"; else no "$d" "expected [$w]"; fi
          }
          # have: an applet that is absent must say so out loud, not fail obscurely
          # three lines later. This is the check that was missing.
          have() {
            for a in $1; do
              if command -v "$a" > /dev/null 2>&1; then :; else no "applet '$a' is missing"; fi
            done
          }

          T=${T:-/tmp}/utest
          rm -rf "$T"; mkdir -p "$T"; cd "$T" || exit 1

          echo "==================== who and where ===================="
          show "uname -a"
          show "id"
          show "hostname 2>/dev/null || echo '(no hostname applet)'"
          show "date -u '+%Y-%m-%d %H:%M:%S UTC'"
          show "cat /proc/cmdline"
          show "head -3 /proc/cpuinfo"
          show "grep -E 'MemTotal|MemFree' /proc/meminfo"
          show "free 2>/dev/null | head -3"
          show "uptime 2>/dev/null || cat /proc/uptime"

          echo
          echo "==================== what is on the disk ===================="
          show "ls -la /"
          show "cat /proc/mounts"
          show "df -h 2>/dev/null | head -6"
          show "ls -la /usr/lib"
          show "ls /bin | head -30"
          show "ls /bin | wc -l"

          echo
          echo "==================== the userland itself ===================="
          show "busybox | head -2"
          show "busybox --list | wc -l"
          show "busybox --list | head -40 | tr '\\n' ' '"
          have "sh cat ls cp mv rm mkdir ln find xargs chmod"
          have "sed grep awk cut tr sort uniq head tail wc tee"
          have "tar gzip gunzip cpio md5sum sha256sum"
          have "date env printf expr test seq basename dirname readlink"
          have "ps kill sleep sync dmesg mount umount"

          echo
          echo "==================== files ===================="
          chk "mkdir -p and a write reach the disk" "hello from veron" \
              "mkdir -p a/b/c && echo 'hello from veron' > a/b/c/f && cat a/b/c/f"
          chk "cp preserves content" "hello from veron" "cp a/b/c/f copy && cat copy"
          chk "mv renames" "hello from veron" "mv copy moved && cat moved"
          chk "ln -s and readlink" "moved" "ln -s moved link && readlink link"
          chk "rm removes" "gone" "rm -f moved && [ ! -e moved ] && echo gone"
          chk "chmod is honoured" "executable" \
              "printf '#!/bin/sh\\necho executable\\n' > s.sh && chmod +x s.sh && ./s.sh"
          chk "find by name" "./a/b/c/f" "find ./a -type f -name f"
          chk "find piped through xargs" "hello from veron" "find ./a -type f | xargs cat"
          show "ls -la a/b/c"

          echo
          echo "==================== text processing ===================="
          printf 'pear 4\napple 10\nbanana 7\napple 3\ncherry 7\n' > fruit.txt
          show "cat fruit.txt"
          chk "grep matches"            "apple 10"        "grep '^apple 10' fruit.txt"
          chk "grep -c counts"          "2"               "grep -c apple fruit.txt"
          chk "grep -v inverts"         "3"               "grep -v apple fruit.txt | wc -l"
          chk "sed substitutes"         "APPLE 10"        "sed -n '2s/apple/APPLE/p' fruit.txt"
          chk "sed -i edits in place"   "kiwi 4"          "cp fruit.txt e.txt && sed -i 's/pear/kiwi/' e.txt && head -1 e.txt"
          chk "sed deletes"             "4"               "sed '1d' fruit.txt | wc -l"
          chk "awk picks a field"       "10"              "awk '\$1==\"apple\"{print \$2; exit}' fruit.txt"
          chk "awk sums a column"       "31"              "awk '{s+=\$2} END{print s}' fruit.txt"
          chk "awk BEGIN/END and NR"    "5 lines"         "awk 'END{print NR\" lines\"}' fruit.txt"
          chk "sort is alphabetical"    "apple 10"        "sort fruit.txt | head -1"
          chk "sort -n is numeric"      "10"              "awk '{print \$2}' fruit.txt | sort -n | tail -1"
          chk "uniq -c counts runs"     "2 apple"         "awk '{print \$1}' fruit.txt | sort | uniq -c | tr -s ' ' | sed 's/^ //' | grep apple"
          chk "cut by delimiter"        "banana"          "cut -d' ' -f1 fruit.txt | sed -n 3p"
          chk "cut by character"        "app"             "cut -c1-3 fruit.txt | sed -n 2p"
          chk "tr translates"           "PEAR 4"          "head -1 fruit.txt | tr 'a-z' 'A-Z'"
          chk "wc counts"               "5 10 42"         "wc fruit.txt | tr -s ' ' | sed 's/^ //' | cut -d' ' -f1-3"
          chk "head and tail"           "cherry 7"        "head -5 fruit.txt | tail -1"
          chk "tee writes and passes"   "pear 4"          "head -1 fruit.txt | tee teed.txt > /dev/null && cat teed.txt"

          echo
          echo "==================== the shell itself ===================="
          chk "arithmetic expansion"   "42"      'echo $((6 * 7))'
          chk "parameter expansion"    "veron"   'v=veron.tar.gz; echo ${v%%.*}'
          chk "command substitution"   "5"       'echo $(wc -l < fruit.txt)'
          chk "for loop"               "1 2 3"   'r=""; for i in 1 2 3; do r="$r $i"; done; echo ${r# }'
          chk "while read"             "5"       'n=0; while read -r l; do n=$((n+1)); done < fruit.txt; echo $n'
          chk "case"                   "matched" 'case veron in ver*) echo matched;; *) echo no;; esac'
          chk "functions"              "144"     'sq() { echo $(($1 * $1)); }; sq 12'
          chk "here-doc"               "inline"  'cat <<EOF
          inline
          EOF'
          chk "exit status"            "0 1"     'true; a=$?; false; b=$?; echo "$a $b"'
          chk "pipeline"               "3"       'seq 1 3 | wc -l'

          echo
          echo "==================== archives and checksums ===================="
          chk "md5sum, known vector"    "900150983cd24fb0d6963f7d28e17f72" \
              "printf abc | md5sum | cut -d' ' -f1"
          chk "sha256sum, known vector" "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad" \
              "printf abc | sha256sum | cut -d' ' -f1"
          show "tar czf a.tar.gz a"
          show "tar tzf a.tar.gz"
          chk "tar round-trips its content" "hello from veron" \
              "mkdir -p x && tar xzf a.tar.gz -C x && cat x/a/b/c/f"
          chk "gzip round-trips"        "hello from veron" \
              "gzip -c a/b/c/f > g.gz && gunzip -c g.gz"
          chk "cpio round-trips"        "hello from veron" \
              "mkdir -p y && (cd a && find . | cpio -o -H newc 2>/dev/null) > a.cpio && (cd y && cpio -i -H newc < ../a.cpio 2>/dev/null) && cat y/b/c/f"

          echo
          echo "==================== processes and signals ===================="
          show "ps | head -12"
          chk "a subshell runs"        "forked"  'sh -c "echo forked"'
          chk "exit codes propagate"   "7"       'sh -c "exit 7"; echo $?'
          sleep 30 &
          bg=$!
          if kill -TERM "$bg" 2>&1; then
            wait "$bg" 2>/dev/null
            [ -d "/proc/$bg" ] && no "SIGTERM did not reap the child" || ok "signals reap a child"
          else
            no "kill(2) failed"
          fi
          show "sync && echo synced"

          echo "==================== the network stack ===================="
          # NOT SILENCED. `ip link set lo up 2>/dev/null || ifconfig lo up 2>/dev/null`
          # hid the reason the loopback test failed -- the applet was not in the image at
          # all -- and the run reported "loopback down" as if the kernel were at fault.
          show "ip link set lo up 2>&1 || ifconfig lo up 2>&1"
          show "ip addr show lo 2>&1 || ifconfig lo 2>&1"
          show "cat /sys/class/net/lo/operstate 2>&1 || echo '(no /sys here)'"
          # SKIPPED, NOT FAILED, WHERE IT CANNOT APPLY. The box is bwrap with --proc but
          # no /sys at all, so /sys/class/net does not exist there and never will. A test
          # that reports failure for an environment it was never meant to run in teaches
          # people to ignore failures.
          if [ -e /sys/class/net/lo/operstate ]; then
            st=$(cat /sys/class/net/lo/operstate 2>/dev/null)
            case "$st" in
              up|unknown) ok "loopback is up (operstate=$st)" ;;
              *)          no "loopback is $st" ;;
            esac
          else
            echo "VERON-TEST SKIP loopback state -- no /sys in this environment"
          fi

          echo
          echo "==================== $LABEL: $P passed, $F failed ===================="
          # Hand the tally back to whoever invoked us, so a caller can fold it into its
          # own verdict instead of re-parsing a console it cannot see.
          [ -n "$TALLY" ] && echo "$P $F" > "$TALLY"
          [ "$F" -eq 0 ]
          UEOF
          chmod +x "$S/work/utest.sh"
          LABEL="userland in the box" S="$S" "$W/box16.sh" \
            /bin/sh -c 'LABEL="userland in the box" T=/tmp exec /bin/sh /work/utest.sh' 2>&1 | sed 's/^/    /'
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "  the userland suite reported failures (exit $rc)"; exit 1; }

      - name: 'Stage the kernel and its build tools into the box'
        run: |
          set -eu
          if [ -f "$S/etc/.tools-complete" ]; then
            echo "  build tools already in the box -- staging the kernel only"
          else
            for t in m4-$M4_VER bison-$BISON_VER flex-$FLEX_VER perl-$PERL_VER \
                     bc-$BC_VER openssl-$OPENSSL_VER; do
              d="$S/work/$t"; rm -rf "$d"; mkdir -p "$d"
              # ls the glob: get() may have fallen back to the other extension.
              f=$(ls ${t}.tar.* 2>/dev/null | head -1)
              [ -n "$f" ] || { echo "  no tarball for $t"; exit 1; }
              tar xf "$f" -C "$d" --strip-components=1
            done
          fi
          rm -rf "$S/work/linux"
          cp -r ksrc "$S/work/linux"
          echo "  staged: $(ls "$S/work" | tr '\n' ' ')"

      - name: 'Build m4, bison, flex, perl, bc INSIDE the box'
        run: |
          set -eu
          if [ -f "$S/etc/.tools-complete" ]; then
            echo "  (cached -- skipped)"
            echo "TOOLS_COMPLETE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # WRITTEN TO A FILE, NOT EMBEDDED. The old form was a single-quoted
          # shell string spliced with '"$VAR"' at five points; a quoted heredoc
          # cannot get that wrong and the script is readable as a script.
          cat > "$S/work/tools.sh" <<TEOF
          #!/bin/sh
          set -e
          M4_VER=$M4_VER
          BISON_VER=$BISON_VER
          FLEX_VER=$FLEX_VER
          PERL_VER=$PERL_VER
          BC_VER=$BC_VER
          OPENSSL_VER=$OPENSSL_VER
          TEOF
          cat >> "$S/work/tools.sh" <<'TEOF'
          for p in m4-$M4_VER bison-$BISON_VER flex-$FLEX_VER; do
            echo "=== $p ==="; cd /work/$p
            ./configure --prefix=/usr > c.log 2>&1 || { tail -10 c.log; exit 1; }
            make -j$(nproc) > b.log 2>&1 || { grep -E "error:|Error [0-9]" b.log | head -6; exit 1; }
            make install > i.log 2>&1 || { tail -8 i.log; exit 1; }
          done
          # bc USED TO BE `make && make install` WITH NO || exit, and set -e
          # does not fire on the left-hand side of an &&: a failing bc printed
          # nothing and the run carried on. The kernel needs bc to generate
          # kernel/time/timeconst.h, so that failure would have surfaced an
          # hour later as a kernel error with no connection to this step.
          #
          # CC='gcc -std=c99' IS THE BOOK'S, VERBATIM, AND IT IS THE WHOLE FIX.
          # Chapter 8.15 writes
          #     CC='gcc -std=c99' ./configure --prefix=/usr -G -O3 -r
          # and says of it, in as many words: "This parameter specifies the
          # compiler and C standard to use." Building without it under gcc 16
          # gives:
          #     ./src/data.c:920:29: error: 'falseUL' undeclared here
          #     ./src/data.c:920:43: error: 'trueUL' undeclared here
          # gcc 15 changed the default C dialect to -std=gnu23, where `true`
          # and `false` are KEYWORDS rather than <stdbool.h> macros. bc writes
          # BC_PARSE_EXPR_ENTRY(false, false, true, ...), whose expansion runs
          # each argument through UINTMAX_C(), which is `c ## UL`. While false
          # was a macro it expanded to 0 first and pasted as 0UL; as a keyword
          # it pastes literally, and `falseUL` is not a thing.
          #
          # This is the first place the C23 default has bitten, and it is worth
          # naming as a class rather than an incident: the box compiler is two
          # dialects ahead of a lot of what it is asked to build. bc is the
          # ONLY package the book overrides the standard for -- checked across
          # all eleven chapters -- so it is fixed here and nowhere else.
          #
          # -r IS DROPPED, and that is our deviation, not the book's. -r links
          # bc against Readline, which LFS has by 8.15 because chapter 8 builds
          # it earlier. This box has BusyBox, glibc, binutils, gcc, make, m4,
          # bison and flex, and no Readline at all. Line editing is of no use
          # to a bc the kernel invokes from a Makefile.
          # UNLINK THE BUSYBOX APPLETS BEFORE INSTALLING OVER THEM.
          # `busybox --install -s /usr/bin` left /usr/bin/bc and /usr/bin/dc as
          # symlinks to /usr/bin/busybox. Installing to a path that is a symlink
          # FOLLOWS it, so a tool writing its binary to /usr/bin/bc writes
          # through the link and lands on busybox -- which is the shell, ls,
          # sed, grep and tar this entire box is made of. There is no more
          # destructive failure available here, and it would present as
          # everything breaking at once for no visible reason.
          rm -f /usr/bin/bc /usr/bin/dc
          echo "=== bc ==="; cd /work/bc-$BC_VER
          # The tarball ships `configure` as a wrapper around `configure.sh`;
          # the book calls the former. Prefer it, fall back, and never guess.
          cfg=./configure
          [ -x "$cfg" ] || cfg=./configure.sh
          [ -x "$cfg" ] || { echo "  bc has neither configure nor configure.sh"; ls; exit 1; }
          PREFIX=/usr CC='gcc -std=c99' "$cfg" --prefix=/usr -G -O3 > c.log 2>&1 \
            || { echo "  bc configure failed ($cfg):"; tail -20 c.log; exit 1; }
          make -j$(nproc) > b.log 2>&1 || { grep -E "error:|Error [0-9]" b.log | head -10; exit 1; }
          make install > i.log 2>&1 || { tail -8 i.log; exit 1; }
          # PROVE IT IS THE REAL ONE. `command -v bc` cannot tell the difference
          # between this bc and a busybox applet symlink -- which is what the
          # previous run's "bc: /usr/bin/bc" actually proved, i.e. nothing. A
          # regular file means the install landed; a symlink means busybox is
          # still answering.
          [ -f /usr/bin/bc ] && [ ! -L /usr/bin/bc ] || {
            echo "  /usr/bin/bc is not a regular file -- busybox still owns it"
            ls -l /usr/bin/bc; exit 1; }
          echo "=== perl ==="; cd /work/perl-$PERL_VER
          ./Configure -des -Dprefix=/usr -Dcc=gcc > c.log 2>&1 || { tail -14 c.log; exit 1; }
          make -j$(nproc) > b.log 2>&1 || { grep -E "error:|Error [0-9]" b.log | head -6; exit 1; }
          make install > i.log 2>&1 || { tail -8 i.log; exit 1; }
          # OPENSSL LAST, because its Configure is a perl script and perl is
          # built immediately above.
          #
          # THE BOOK'S LINE, MINUS ONE THING. Chapter 8.49 says:
          #   ./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib \
          #            shared zlib-dynamic
          # zlib-dynamic is DROPPED and that is a declared substitution: it
          # wants a zlib, which the book builds at 8.5 and this box does not
          # have. Nothing the kernel asks of libcrypto goes near compression.
          #
          # install_sw replaces the book's `make MANSUFFIX=ssl install`, which
          # also renders man pages through pod2man; install_sw is the headers,
          # the libraries and the openssl binary, which is exactly what certs/
          # wants and nothing else. The INSTALL_LIBS edit is the book's own
          # `INSTALL_LIBS=` -- it keeps the static libraries out.
          echo "=== openssl $OPENSSL_VER ==="; cd /work/openssl-$OPENSSL_VER
          ./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared \
            > c.log 2>&1 || { echo "  openssl config failed:"; tail -15 c.log; exit 1; }
          make -j$(nproc) > b.log 2>&1 \
            || { grep -E "error:|Error [0-9]" b.log | head -10; exit 1; }
          sed -i "/INSTALL_LIBS/s/libcrypto.a libssl.a//" Makefile
          make install_sw > i.log 2>&1 || { tail -12 i.log; exit 1; }

          echo "=== what the kernel build will actually invoke ==="
          bad=0
          for t in m4 bison flex perl bc; do
            if command -v $t > /dev/null 2>&1; then
              echo "  $t: $(command -v $t)"
            else
              echo "  $t: NOT ON PATH"; bad=1
            fi
          done
          # TEST WHAT THE KERNEL DOES, NOT WHETHER A FILE EXISTS. Both of the
          # things below are exact reproductions of a kernel build step, which
          # is the only check that cannot pass while the real thing fails.
          #
          # bc: the kernel generates kernel/time/timeconst.h by piping HZ
          # through its own timeconst.bc. Run that very script.
          tc=/work/linux/kernel/time/timeconst.bc
          if [ -f "$tc" ] && echo 250 | bc -q "$tc" > /tmp/tc.out 2>&1; then
            echo "  bc: timeconst.bc -> $(head -1 /tmp/tc.out)"
          else
            echo "  bc: THE KERNEL'S OWN timeconst.bc FAILED:"
            head -5 /tmp/tc.out 2>/dev/null | sed 's/^/      /'
            bad=1
          fi
          # openssl: certs/extract-cert.c is a hostprog whose first act is to
          # include <openssl/bio.h>, and the run before last died on exactly
          # that line. Compile and link the same thing.
          cat > /tmp/ossl.c <<'OSSLEOF'
          #include <openssl/bio.h>
          #include <openssl/pem.h>
          #include <openssl/err.h>
          int main(void) { BIO *b = BIO_new(BIO_s_mem()); BIO_free(b); return 0; }
          OSSLEOF
          if gcc /tmp/ossl.c -lcrypto -o /tmp/ossl > /tmp/ossl.log 2>&1 && /tmp/ossl; then
            echo "  openssl: $(openssl version 2>&1 | head -1)"
            echo "  openssl: <openssl/bio.h> compiles, -lcrypto links, binary runs"
          else
            echo "  openssl: WHAT certs/extract-cert DOES STILL FAILS:"
            head -10 /tmp/ossl.log | sed 's/^/      /'
            bad=1
          fi
          [ $bad -eq 0 ]
          TEOF
          chmod +x "$S/work/tools.sh"
          S="$S" "$W/box16.sh" /bin/sh /work/tools.sh 2>&1 | sed 's/^/    /'
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "  the tools script exited $rc"; exit 1; }
          date -u +%FT%TZ > "$S/etc/.tools-complete"
          echo "TOOLS_COMPLETE=1" >> "$GITHUB_ENV"

      - name: 'Build linux ${{ env.KTAG }} INSIDE the box'
        run: |
          set -eu
          cat > "$S/work/kbuild.sh" <<'KEOF'
          #!/bin/sh
          set -e
          cd /work/linux
          # The book opens with this and says not to trust a freshly untarred
          # tree. This one came out of git, but the rule costs nothing.
          make mrproper > /dev/null 2>&1
          echo "=== defconfig ==="
          make ARCH=arm64 defconfig > /dev/null 2>&1

          # REWRITE THE LINE. DO NOT USE scripts/config.
          # That script is #!/bin/bash and this box has BusyBox ash and no bash
          # at all, so every call to it failed silently and the sed after the
          # `|| true` was doing all the work -- a fallback that was really the
          # implementation. It also means `--set-str` never once ran. Deleting
          # whichever form of the line exists and appending the one we want
          # needs nothing but sed: kconfig takes the last assignment it reads,
          # and olddefconfig re-derives everything that depends on it.
          set_cfg() {
            sed -i "/^CONFIG_$1=/d; /^# CONFIG_$1 is not set\$/d" .config
            if [ "$2" = y ]; then echo "CONFIG_$1=y" >> .config
            else echo "# CONFIG_$1 is not set" >> .config; fi
          }

          # THREE SETTINGS. THAT IS THE WHOLE LIST, AND THE SHORTNESS IS THE
          # POINT -- every previous version of this step fought the Kconfig
          # graph and lost.
          #
          # WERROR is the book's FIRST required item, chapter 10.3:
          #   "[ ] Compile the kernel with warnings as errors [WERROR]"
          # It defaults to y, and this is the box pairing a compiler released
          # this year with an -rc kernel.
          #
          # DEVTMPFS and DEVTMPFS_MOUNT are further down the same list. Without
          # them the initramfs has no /dev/console -- a cpio can only carry a
          # device node if it was built by real root, and this one is built in
          # a user namespace -- so init starts with no stdin, stdout or stderr
          # and every echo it makes goes nowhere. The console then looks
          # IDENTICAL to a kernel that never reached userspace.
          #
          # AND NOTHING ABOUT certs/. Previous runs disabled MODULES,
          # MODULE_SIG, the keyrings, KEXEC and SYSTEM_DATA_VERIFICATION to
          # keep certs/extract-cert from being built, because it needs openssl.
          # olddefconfig restored the keyring every time, because it is reached
          # by `select` and disabling a selected symbol can never work. The box
          # now HAS openssl, so extract-cert builds the way it does on any
          # normal system and there is nothing left to fight. `make Image` does
          # not build modules either way, so MODULES=y costs this build nothing.
          set_cfg WERROR n
          set_cfg DEVTMPFS y
          set_cfg DEVTMPFS_MOUNT y

          # olddefconfig re-derives dependent symbols after a hand edit. It
          # answers new symbols with their defaults and reads nothing from
          # stdin -- the `yes "" |` this used to have contributed only
          # "yes: Broken pipe" to the log.
          make ARCH=arm64 olddefconfig > /dev/null 2>&1

          # VERIFY AFTER olddefconfig, because olddefconfig is what silently
          # undid the same edit three runs running, and a sed that matches
          # nothing changes nothing and says nothing.
          echo "=== config ==="
          bad=0
          if grep -q "^CONFIG_WERROR=y" .config; then
            echo "  WERROR came back on after olddefconfig"; bad=1
          else
            echo "  WERROR off"
          fi
          for s in DEVTMPFS DEVTMPFS_MOUNT BLK_DEV_INITRD RD_GZIP \
                   SERIAL_AMBA_PL011_CONSOLE BINFMT_ELF; do
            if grep -q "^CONFIG_$s=y" .config; then
              echo "  $s=y"
            else
              echo "  $s IS NOT SET -- this boot cannot work without it"; bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "  --- what the config actually says ---"
            grep -E "^(# )?CONFIG_(WERROR|DEVTMPFS|BLK_DEV_INITRD|RD_GZIP|SERIAL_AMBA_PL011|BINFMT_ELF)" .config || true
            exit 1
          fi
          # Reported, not acted on: these are what needed a host tool the box
          # used to lack, and it is worth seeing their state in the log now
          # that openssl means they no longer have to be off.
          echo "=== for the record (not enforced) ==="
          for s in MODULES SYSTEM_TRUSTED_KEYRING DEBUG_INFO_BTF; do
            if grep -q "^CONFIG_$s=y" .config; then echo "  $s=y"; else echo "  $s off"; fi
          done

          echo "=== building Image ==="
          make ARCH=arm64 -j$(nproc) Image > b.log 2>&1 || {
            echo "--- compiler diagnostics ---"
            grep -E "error:|fatal error|No rule to make target" b.log | grep -v "^make" | head -20
            echo "--- make errors ---"
            grep -E "\*\*\* \[" b.log | head -6
            echo "--- tail (NOT the error: with -j the last lines are whatever finished last) ---"
            tail -25 b.log
            cp .config /work/kernel.config 2>/dev/null || true
            tail -3000 b.log > /work/kernel-build.log 2>/dev/null || true
            exit 1; }
          cp arch/arm64/boot/Image /work/Image
          cp .config /work/kernel.config
          tail -3000 b.log > /work/kernel-build.log
          echo "Image: $(wc -c < /work/Image) bytes"
          echo "built by: $(gcc --version | head -1)"
          KEOF
          chmod +x "$S/work/kbuild.sh"
          # THIS IS THE STEP WHOSE exit 1 RUN 30192158996 THREW AWAY. The
          # pipeline reported sed's status, the job went green, and QEMU was
          # handed an Image that had never been written. PIPESTATUS[0] is the
          # box script's own status, read immediately after the pipeline and
          # before anything else can overwrite it. Piping to sed is kept
          # because a 25-minute build should stream, not buffer.
          S="$S" "$W/box16.sh" /bin/sh /work/kbuild.sh 2>&1 | sed 's/^/    /'
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "  the kernel build script exited $rc"; exit 1; }
          [ -f "$S/work/Image" ] || { echo "  no Image on disk after a successful build step"; exit 1; }

      - name: 'Assemble the initramfs INSIDE the box'
        run: |
          set -eu
          cat > "$S/work/mkir.sh" <<'IEOF'
          #!/bin/sh
          set -e
          # THE INITRAMFS HAD NO C LIBRARY IN IT, AND COULD NEVER HAVE BOOTED.
          # It carried one file -- a dynamically linked, PIE busybox -- plus symlinks to
          # it. busybox's PT_INTERP names /lib/ld-linux-aarch64.so.1 and that loader was
          # not in the archive, so the kernel could not exec /init and panicked:
          #     Run /init as init process
          #     Failed to execute /init (error -2)
          #     Kernel panic - not syncing: No working init found.
          # -2 is ENOENT, and nothing in that message mentions a library: it reads as a
          # broken init SCRIPT. The 624,847-byte archive was the tell -- that is the size
          # of a busybox and nothing else.
          #
          # Copying in the sysroot's own loader and libc is also the stronger claim. A
          # statically linked busybox would boot too, but it would only show that the
          # compiler works. This shows the glibc THIS BOX BUILT running as PID 1 under
          # the kernel THIS BOX BUILT, on the real kernel ABI, outside bwrap.
          rm -rf /work/ir
          mkdir -p /work/ir/bin /work/ir/dev /work/ir/proc /work/ir/sys /work/ir/usr/lib /work/ir/mnt /work/ir/tmp
          # Mirror the sysroot's own layout, so whichever of the two paths a binary names
          # resolves to the same place.
          ln -s usr/lib /work/ir/lib
          cp /usr/bin/busybox /work/ir/bin/

          # The compiler suite built these in the box; running them in the guest is what
          # turns "the compiler works" into "its output runs on our kernel".
          for b in /work/guest-bin/veron-corpus /work/guest-bin/veron-cxx /work/guest-bin/veron-static; do
            [ -f "$b" ] || { echo "  $b was not staged by the compiler step"; exit 1; }
            cp "$b" /work/ir/bin/
          done
          cp /work/guest-bin/corpus.expected /work/ir/
          # The same userland tour the box runs, so the two transcripts are comparable.
          cp /work/utest.sh /work/ir/utest.sh
          chmod +x /work/ir/utest.sh

          # EVERY LIBRARY EVERY BINARY ASKS FOR, read out of the binaries rather than
          # listed by hand. veron-cxx drags in libstdc++ and libgcc_s, which no hand
          # written list would have thought to include until it failed in the guest.
          INTERP=""
          libs=""
          for b in /work/ir/bin/busybox /work/ir/bin/veron-corpus /work/ir/bin/veron-cxx; do
            i=$(readelf -l "$b" | sed -n "s/.*interpreter: \(.*\)\]/\1/p")
            [ -n "$i" ] && INTERP=$i
            for l in $(readelf -d "$b" | sed -n "s/.*Shared library: \[\(.*\)\]/\1/p"); do
              case " $libs " in *" $l "*) ;; *) libs="$libs $l" ;; esac
            done
          done
          echo "  PT_INTERP: ${INTERP:-<none: statically linked>}"
          if [ -n "$INTERP" ]; then
            # PUT THE LOADER AT THE PATH THE ELF NAMES, whatever that path is. Our
            # triplet gives /lib/ld-linux-aarch64.so.1 and /lib is the symlink made
            # above, so it lands in usr/lib either way -- but DERIVING the directory
            # instead of assuming it is what makes this survive a change of
            # architecture. Tested against an x86-64 binary, whose PT_INTERP is
            # /lib64/..., where assuming /lib fails.
            mkdir -p "/work/ir$(dirname "$INTERP")"
            cp -L "$INTERP" "/work/ir$INTERP"
          fi
          for l in $libs; do
            if [ -e "/usr/lib/$l" ]; then
              cp -L "/usr/lib/$l" /work/ir/usr/lib/
              echo "    + $l"
            else
              echo "    ! $l NOT FOUND in /usr/lib"; exit 1
            fi
          done
          # A copy that silently went nowhere looks exactly like no copy, and this is the
          # check whose absence cost a whole run.
          [ -z "$INTERP" ] || [ -e "/work/ir$INTERP" ] || {
            echo "  the loader did not land at $INTERP"; exit 1; }
          for l in $libs; do
            [ -e "/work/ir/usr/lib/$l" ] || { echo "  $l did not land"; exit 1; }
          done
          echo "  image libs: $(ls /work/ir/usr/lib | tr '\n' ' ')"

          # INSTALL EVERY APPLET BUSYBOX HAS, rather than a list someone curated.
          # The curated list is how the last run failed: `cp` and `ip` were used by the
          # test script and were not on it, so the image had no `cp`, the console said
          # "cp: not found", and the harness reported a tmpfs fault and a downed
          # loopback -- two wrong conclusions from one missing symlink. The list was
          # verified against busybox, which is backwards; nothing verified the SCRIPTS
          # against the list. Installing all of them removes the class outright, and
          # costs about 400 symlinks in a 16 MB image.
          applets=$(/work/ir/bin/busybox --list 2>/dev/null)
          n=$(printf '%s\n' "$applets" | grep -c .)
          # `busybox --list` behind a `||` fallback once gave this project an
          # eight-applet userland that passed the first three rungs. No fallback: if the
          # list is implausible, stop.
          [ "$n" -gt 100 ] || { echo "  busybox --list returned only $n names"; exit 1; }
          cd /work/ir/bin
          for a in $applets; do
            # NEVER symlink busybox onto itself -- `ln -sf busybox busybox` replaces the
            # one real binary in the image with a link to nothing.
            [ "$a" = busybox ] && continue
            ln -sf busybox "$a"
          done
          cd /work/ir
          echo "  applets installed: $n"

          # NOW CHECK THE OTHER DIRECTION: everything the scripts in this image invoke
          # must exist. This is the assertion whose absence cost the last run.
          need_bin="sh cat ls cp mv rm mkdir ln find xargs chmod sed grep awk cut tr
                    sort uniq head tail wc tee tar gzip gunzip cpio md5sum sha256sum
                    date env printf expr seq basename dirname readlink ps kill sleep
                    sync dmesg mount umount poweroff"
          absent=""
          for c in $need_bin; do
            [ -e "/work/ir/bin/$c" ] || absent="$absent $c"
          done
          [ -z "$absent" ] || { echo "  this busybox has no:$absent -- the scripts need them"; exit 1; }
          # Nice to have, and reported rather than required: the transcript says so
          # itself if one is missing, instead of a test failing for the wrong reason.
          for c in ip ifconfig df free id hostname uptime diff od; do
            [ -e "/work/ir/bin/$c" ] || echo "  note: no '$c' applet in this busybox"
          done

          # bwrap is unprivileged, so mknod is unavailable here -- that is what
          # CONFIG_DEVTMPFS_MOUNT is for. Try anyway, and say which of the two ends up
          # carrying /dev/console.
          if mknod dev/console c 5 1 2>/dev/null; then
            echo "  /dev/console created in the image"
          else
            echo "  no mknod in the box -- /dev/console comes from CONFIG_DEVTMPFS_MOUNT"
          fi

          cat > init <<'INITEOF'
          #!/bin/sh
          # PID 1, AND A TEST HARNESS. Reaching userspace proves the kernel loads and the
          # loader resolves; it proves nothing about whether the system WORKS. Most of
          # the work is delegated to /utest.sh, which prints an actual shell session --
          # every command echoed with its output -- because a transcript a person can
          # read is worth more than a column of PASS lines, and because the one time a
          # command was missing the reporting threw the evidence away.
          #
          # No `set -e`: one failure must not hide the other forty.
          mount -t devtmpfs none /dev 2>/dev/null
          # Only redirect if there is something to redirect TO. An exec onto a missing
          # device kills the shell, and a kernel that booted perfectly then prints
          # nothing and reads as a kernel that never started.
          [ -c /dev/console ] && exec > /dev/console 2>&1 < /dev/console
          mount -t proc none /proc 2>/dev/null
          mount -t sysfs none /sys 2>/dev/null
          mount -t tmpfs none /mnt 2>/dev/null

          P=0; F=0
          ok() { P=$((P+1)); echo "VERON-TEST PASS $1"; }
          no() { F=$((F+1)); echo "VERON-TEST FAIL $1${2:+ -- $2}"; }
          chk() { if [ "$2" = "$3" ]; then ok "$1"; else no "$1" "wanted [$3] got [$2]"; fi; }

          echo "VERON-BOOT-OK $(uname -srm)"
          echo "VERON-KERNEL $(cat /proc/version)"
          echo "VERON-LIBC $(/lib/ld-linux-aarch64.so.1 --version 2>&1 | head -1)"

          # ---- the visible session -------------------------------------------------
          LABEL="userland in the guest" T=/tmp TALLY=/tmp/ut.tally sh /utest.sh
          if [ -r /tmp/ut.tally ]; then
            read up uf < /tmp/ut.tally
            P=$((P + up)); F=$((F + uf))
          else
            no "the userland tour did not report a tally"
          fi

          echo
          echo "==================== devices and storage ===================="
          grep -q . /proc/cpuinfo 2>/dev/null && ok "/proc is mounted and populated" || no "/proc"
          [ -d /sys/kernel ] && ok "/sys is mounted" || no "/sys"
          for d in null zero console urandom; do
            [ -c /dev/$d ] && ok "/dev/$d is a character device" || no "/dev/$d"
          done
          z=$(dd if=/dev/zero bs=1 count=4 2>/dev/null | tr -d '\0' | wc -c)
          chk "/dev/zero reads as zeroes" "$z" "0"
          r=$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | wc -c)
          chk "/dev/urandom yields entropy" "$r" "32"
          mkdir -p /mnt/t
          if dd if=/dev/urandom of=/mnt/t/blob bs=1024 count=4096 2>/dev/null; then
            a=$(md5sum < /mnt/t/blob | cut -d' ' -f1)
            cp /mnt/t/blob /mnt/t/blob2
            b=$(md5sum < /mnt/t/blob2 | cut -d' ' -f1)
            chk "4 MiB write, copy and read back on tmpfs" "$a" "$b"
          else
            no "tmpfs write"
          fi

          echo
          echo "==================== binaries this box's gcc produced ===================="
          # THE POINT OF THE WHOLE EXERCISE. These were compiled inside bwrap by the
          # sysroot's own gcc; here they run on the real kernel, on real hardware
          # interfaces, with no bwrap anywhere. A checksum computed in the box and
          # recomputed here has to agree.
          echo "  \$ /bin/veron-corpus"
          got=$(/bin/veron-corpus 2>&1); echo "    $got"
          chk "dynamic C binary reproduces its checksum" "$got" "$(cat /corpus.expected 2>/dev/null)"
          echo "  \$ /bin/veron-cxx"
          gotx=$(/bin/veron-cxx 2>&1); echo "    $gotx"
          chk "C++ binary: STL, RTTI and exceptions" "$gotx" "2080 3 2 1 abab"
          echo "  \$ /bin/veron-static; echo \$?"
          gots=$(/bin/veron-static; echo $?); echo "    $gots"
          chk "static C binary runs" "$gots" "0"

          echo
          echo "==================== time and kernel health ===================="
          u1=$(cut -d. -f1 /proc/uptime); sleep 1; u2=$(cut -d. -f1 /proc/uptime)
          [ "$u2" -ge "$u1" ] && ok "monotonic uptime advances ($u1 -> $u2)" || no "uptime"
          # A KERNEL CAN BOOT AND STILL BE UNWELL. Anything in this list means a
          # toolchain or config problem that a "did it boot" check sails straight past.
          noise=$(dmesg 2>/dev/null | grep -E "BUG:|Oops|Call trace:|kernel NULL pointer|unable to handle|WARNING:" | head -5)
          if [ -z "$noise" ]; then
            ok "no BUG/Oops/WARNING/Call trace in dmesg"
          else
            no "dmesg is not clean"; echo "$noise" | sed 's/^/    /'
          fi
          echo "  \$ dmesg | tail -8"
          dmesg 2>/dev/null | tail -8 | sed 's/^/    /'

          echo
          echo "VERON-SECTION inventory"
          echo "  kernel:    $(uname -r)"
          echo "  cmdline:   $(cat /proc/cmdline)"
          echo "  cpus:      $(grep -c ^processor /proc/cpuinfo)"
          echo "  memory:    $(grep MemTotal /proc/meminfo)"
          echo "  applets:   $(busybox --list | wc -l) available in this busybox"
          echo "  libraries:"
          # `ls -l DIR` lists the directory's CONTENTS, not the directory -- which turned
          # this inventory into a recursive dump the first time it ran. -d, and regular
          # files only.
          for f in /usr/lib/*; do
            [ -f "$f" ] && echo "    $(ls -ld "$f" | tr -s ' ' | cut -d' ' -f5,9)"
          done
          echo "  mounts:"
          cat /proc/mounts | sed 's/^/    /'

          echo
          echo "VERON-RESULT $([ "$F" -eq 0 ] && echo PASS || echo FAIL) $P passed, $F failed"
          echo "VERON-INIT-DONE"
          poweroff -f
          INITEOF
          chmod +x init

          # cpio AND gzip SEPARATELY, AND cpio's STDERR KEPT. As one pipeline the exit
          # status is gzip's, so a cpio that failed outright still produced a file -- an
          # empty archive gzips to about 20 bytes, which is non-empty, so a size check
          # passes and QEMU is handed an image with no init in it. That is the SAME
          # "Failed to execute /init" console message as a missing loader, from an
          # unrelated cause. Reproduced by running this script where cpio was absent.
          find . | cpio -o -H newc > /work/initramfs.cpio 2> /tmp/cpio.err || {
            echo "  cpio failed:"; head -5 /tmp/cpio.err | sed 's/^/    /'; exit 1; }
          gzip -9 -c /work/initramfs.cpio > /work/initramfs.cpio.gz
          rm -f /work/initramfs.cpio
          echo "initramfs: $(wc -c < /work/initramfs.cpio.gz) bytes"
          gzip -dc /work/initramfs.cpio.gz | cpio -t > /tmp/ir.list 2>/dev/null || true
          echo "contents: $(wc -l < /tmp/ir.list) entries"
          # REQUIRE THE THINGS THE BOOT CANNOT START WITHOUT, by looking inside the
          # finished archive rather than at the directory it was built from. Matching on
          # a trailing component rather than an exact string because cpio implementations
          # differ on the leading "./" -- busybox's omits it.
          need="init busybox veron-corpus veron-cxx veron-static corpus.expected utest.sh"
          [ -z "$INTERP" ] || need="$need $(basename "$INTERP")"
          for w in $need; do
            grep -qE "(^|/)$w\$" /tmp/ir.list || { echo "  MISSING FROM THE IMAGE: $w"; exit 1; }
          done
          echo "  verified in the image: $need"
          IEOF
          chmod +x "$S/work/mkir.sh"
          S="$S" "$W/box16.sh" /bin/sh /work/mkir.sh 2>&1 | sed 's/^/    /'
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || { echo "  the initramfs script exited $rc"; exit 1; }
          [ -s "$S/work/initramfs.cpio.gz" ] || { echo "  no initramfs was produced"; exit 1; }

      - name: 'BOOT IT'
        run: |
          set -u
          if [ ! -f "$S/work/Image" ]; then
            echo "  NO KERNEL IMAGE -- nothing to boot."
            exit 1
          fi
          echo "  Image:     $(wc -c < "$S/work/Image") bytes"
          echo "  initramfs: $(wc -c < "$S/work/initramfs.cpio.gz") bytes"
          set +e
          # QEMU on the host: a test harness, not part of the build. Everything
          # it loads was produced inside a box with no /usr bound.
          #
          # -nic none IS THE FIX FOR THE ROMFILE ERROR. Every boot attempt from
          # this box has died on
          #     failed to find romfile "efi-virtio.rom"
          # which is -M virt's default virtio-net-pci wanting an option ROM
          # from ipxe-qemu, a RECOMMENDED package that --no-install-recommends
          # skips. Nothing in this boot needs a network, so the right answer is
          # to remove the device rather than to satisfy it. The Install step
          # also fetches the package, so either alone is sufficient.
          #
          # earlycon is BARE, with no address. -M virt generates its own DTB and
          # the kernel takes the PL011 address from it; hardcoding 0x9000000
          # would be a guess that silently writes nowhere if QEMU ever moves
          # the UART. earlycon gives console output from before the real driver
          # probes, which is the difference between "panicked, here is why" and
          # silence.
          timeout 300 qemu-system-aarch64 -M virt -cpu cortex-a57 -m 1024 \
            -nographic -no-reboot -nic none \
            -kernel "$S/work/Image" -initrd "$S/work/initramfs.cpio.gz" \
            -append "console=ttyAMA0 earlycon rdinit=/init panic=1 loglevel=7" \
            > qemu.log 2>&1
          rc=$?
          echo "  qemu rc=$rc"
          echo "  ---- the kernel's own first words ----"
          head -12 qemu.log | sed 's/^/    /'
          echo
          echo "  ---- everything the system said once init took over ----"
          # NOT A head/tail WINDOW. The one run where a command was missing
          # from the image, the guest printed "cp: not found" and that line
          # fell between `head -30` and `tail -40` while `grep VERON-` dropped
          # it -- so the run reported a tmpfs fault and a downed loopback, two
          # wrong conclusions drawn from evidence this step had thrown away.
          # The userspace session is bounded, and it is the entire point of
          # the test. Print all of it.
          sed -n '/Run \/init as init process/,$p' qemu.log | sed 's/^/    /'
          echo
          if ! grep -q 'VERON-BOOT-OK' qemu.log; then
            echo "  DID NOT REACH USERSPACE. What the console did say:"
            grep -nE "Kernel panic|Unable to mount|No filesystem|Failed to execute|unable to open an initial console|Attempted to kill init|romfile|Bad magic|Synchronous Exception" \
              qemu.log | head -12 | sed 's/^/    /'
            echo "  (qemu.log is in the artifact in full)"
            exit 1
          fi

          # REACHING USERSPACE IS THE START OF THE TEST, NOT THE RESULT OF IT.
          # This step used to pass on one grep for a marker init printed before
          # doing anything, which cannot distinguish a working system from a
          # kernel that merely got as far as exec. init now runs a battery and
          # reports each result; the host requires every one of them.
          failed=$(grep -c '^VERON-TEST FAIL' qemu.log || true)
          result=$(grep -h '^VERON-RESULT' qemu.log | head -1)
          if [ -z "$result" ]; then
            # init started and did not finish: a test hung, or the kernel took
            # it out part way. That is not a pass, and it is not the same thing
            # as never having booted either.
            echo "  init began but never reported a verdict -- it did not finish."
            echo "  last thing the console said:"
            tail -5 qemu.log | sed 's/^/    /'
            exit 1
          fi
          echo "  $result"
          if [ "${failed:-0}" -ne 0 ] || ! echo "$result" | grep -q PASS; then
            echo
            echo "  THE SYSTEM BOOTED AND IS NOT HEALTHY. Failing checks:"
            grep '^VERON-TEST FAIL' qemu.log | sed 's/^/    /'
            exit 1
          fi
          echo
          echo "  gcc $GCC_VER, built in a box with no host filesystem, built"
          echo "  linux $KTAG. It booted, and every check inside it passed."

      # Only ever cache a tree that PROVED it works: SYSROOT_COMPLETE comes from
      # THE LADDER and only after compile-and-run returns 42, and TOOLS_COMPLETE
      # only after bc has run the kernel's own timeconst.bc and <openssl/bio.h>
      # has compiled and linked. CACHE_IS_CURRENT suppresses a pointless re-save
      # when the restored tree already had both, so the key is written once per
      # thing actually built rather than once per run. always() is spelled out
      # because any `if:` drops GitHub's implicit success(), and this must still
      # run when the kernel or the boot failed -- the box is good either way,
      # and that is precisely when not having to rebuild it matters.
      - name: 'Save the box for the next run'
        if: always() && env.SYSROOT_COMPLETE == '1' && env.TOOLS_COMPLETE == '1' && env.CACHE_IS_CURRENT != '1'
        uses: actions/cache/save@v4
        with:
          path: |
            sysroot/tools
            sysroot/usr
            sysroot/etc
            sysroot/var
          key: gcc16-sysroot-${{ env.SYSROOT_EPOCH }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermetic-gcc16-image
          path: |
            qemu.log
            sysroot/work/Image
            sysroot/work/initramfs.cpio.gz
            sysroot/work/kernel.config
            sysroot/work/kernel-build.log
          if-no-files-found: warn

      # ---------------------------------------------------------------- chain
      # THE HAND-OFF, SAID OUT LOUD. hermetic-gcc10 already notes that "prefix is
      # how two workflows quietly hand each other a sysroot" -- this is the same
      # hand-off with the quiet taken out. The tree gets a content hash, the hash
      # becomes a workflow output, and stage4-complete asserts that what the next
      # rung consumed is what this rung produced. Standalone runs just print it.
      - name: 'Seal this rung for the chain'
        id: chain_seal
        if: always()
        run: |
          set -eu
          T=sysroot
          if [ -d "$T" ]; then
            H=$(sh spikes/stage4/chain/seal.sh hash "$T")
          else
            H=none
            echo "  no $T -- this run produced nothing to hand on"
          fi
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "  bleeding sealed: $H"
