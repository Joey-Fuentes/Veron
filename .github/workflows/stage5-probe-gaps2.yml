name: stage5-probe-gaps2

# THE PACKAGES THE DEPENDENCY SCAN FOUND, AND THE URLS THAT WERE WRONG.
#
# `probe deps` read what every remaining package declares and produced one
# finding that changes the plan: FOUR packages want libudev and nothing in any
# batch provides it. busybox does not cover it -- `mdev` creates device nodes,
# while libinput, mesa, wlroots and yambar link libudev.so and call
# udev_enumerate_scan_devices(). No libudev means no input, which means no
# compositor. libudev-zero implements that API with no daemon.
#
# Also here: brotli (gnutls, libsoup, nghttp2 -- and freetype's WOFF2, which
# was deferred with a note to revisit), libidn2, json-c, orc, libutf8proc, and
# three URLs that were simply wrong last time.
#
# AND THE TWO THAT PUBLISH NO TARBALL. libsfdo and dinit only push git tags.
# Both halves of pinning them are automatic and neither was being recorded:
# `probe source` reads the repository URL out of Arch's PKGBUILD, and
# `git ls-remote refs/tags/<tag>^{}` resolves the tag to the commit it names.
# The ^{} matters -- without it an annotated tag resolves to the TAG OBJECT,
# a different hash than the commit, and `git archive` would produce something
# else entirely.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Which group to probe'
        type: choice
        options: ['all', 'gaps', 'fixes']
        default: 'all'

concurrency:
  group: stage5-probe-gaps2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 'Select'
        run: |
          set -eu
          cd spikes/stage5
          awk -v want="${{ inputs.batch }}" '
            /^# batch:/ { cur = $3; next }
            /^#/ || /^[[:space:]]*$/ { next }
            (want == "all" || want == cur) { print }
          ' gap-urls.txt > gap.txt
          echo "  $(wc -l < gap.txt) URLs"
          sed 's|^|    |' gap.txt

      - name: 'Probe them'
        run: |
          set -eu
          cd spikes/stage5
          python3 -u tools/probe.py batch gap.txt --out probed-gaps2.tsv || true

      # ASK, DO NOT GUESS. libxkbcommon and nss have each had a URL invented
      # for them twice, and both times the package was fine and the path was
      # wrong -- four of the last six fetch failures in this project were
      # guessed paths. `latest` asks the forge what it published; `index`
      # reads the directory listing. Then the URLs those return are probed
      # for real, in the same run, so nothing needs re-entering by hand.
      - name: 'Ask where libxkbcommon and nss actually live'
        run: |
          set -eu
          cd spikes/stage5
          python3 -u tools/probe.py latest github:xkbcommon/libxkbcommon \
            | tee /tmp/xkb.txt || true
          echo ""
          # ftp.mozilla.org returned nothing the index parser could read.
          # archive.mozilla.org serves the same tree with a plain listing, so
          # try both rather than assuming which one answers -- guessing a URL
          # is what has failed four times here already.
          for host in https://archive.mozilla.org https://ftp.mozilla.org; do
            python3 -u tools/probe.py index \
              "$host/pub/security/nss/releases/" --name nss \
              | tee -a /tmp/nss-dir.txt || true
          done
          echo ""
          # NSPR TOO. The plan lists nspr and nss as separate packages, so the
          # plain nss tarball is the right one -- but that leaves nspr with no
          # URL anywhere, which would have surfaced as a missing pin later.
          for host in https://archive.mozilla.org https://ftp.mozilla.org; do
            python3 -u tools/probe.py index "$host/pub/nspr/releases/" \
              --name nspr | tee -a /tmp/nspr-dir.txt || true
          done

      - name: 'Probe whatever they said'
        run: |
          set -eu
          cd spikes/stage5
          : > found.txt
          # The asset line from `latest` is "    asset  <name>" then a URL on
          # the following line; take any https URL that names a tarball.
          # Skip the auto-generated archive; if that is all there is, fall
          # back to xkbcommon.org, which publishes real signed tarballs.
          u=$(grep -B1 -ohE 'https://\S+\.(tar\.(gz|xz|bz2)|tgz)' /tmp/xkb.txt \
              | grep -v 'api.github.com/repos' | head -1 || true)
          v=$(grep -ohE 'xkbcommon-[0-9]+\.[0-9]+\.[0-9]+' /tmp/xkb.txt \
              | grep -v beta | head -1 | sed 's/xkbcommon-//' || true)
          if [ -n "$u" ]; then echo "$u" >> found.txt
          elif [ -n "$v" ]; then
            echo "https://xkbcommon.org/download/libxkbcommon-$v.tar.xz" >> found.txt
          fi
          # NSS publishes a release DIRECTORY per version; the tarball lives
          # one level further down in src/. Resolve that rather than assuming
          # which NSPR version it is paired with -- the pairing is exactly
          # what was guessed wrong last time.
          rel=$(grep -ohE 'NSS_[0-9_]+_RTM' /tmp/nss-dir.txt | sort -V | tail -1 || true)
          if [ -n "$rel" ]; then
            host=$(grep -ohE 'https://(archive|ftp)\.mozilla\.org' /tmp/nss-dir.txt | head -1)
            host=${host:-https://archive.mozilla.org}
            base="$host/pub/security/nss/releases/$rel/src/"
            echo "  newest NSS release directory: $rel"
            python3 -u tools/probe.py index "$base" --name nss \
              | tee /tmp/nss-src.txt || true
              # The PLAIN nss tarball, not the -with-nspr- bundle: the plan
            # lists nspr and nss as separate packages, and the bundle would
            # make one tarball answer for two ledger records.
            grep -ohE "https://\S+nss-[0-9.]+\.tar\.gz" /tmp/nss-src.txt \
              | grep -v with-nspr | sort -V | tail -1 >> found.txt || true
          fi
          nrel=$(grep -ohE 'v4\.[0-9]+' /tmp/nspr-dir.txt | sort -V | tail -1 || true)
          if [ -n "$nrel" ]; then
            nhost=$(grep -ohE 'https://(archive|ftp)\.mozilla\.org' /tmp/nspr-dir.txt | head -1)
            nhost=${nhost:-https://archive.mozilla.org}
            nbase="$nhost/pub/nspr/releases/$nrel/src/"
            echo "  newest NSPR release directory: $nrel"
            python3 -u tools/probe.py index "$nbase" --name nspr \
              | tee /tmp/nspr-src.txt || true
            grep -ohE "https://\S+nspr-[0-9.]+\.tar\.gz" /tmp/nspr-src.txt \
              | sort -V | tail -1 >> found.txt || true
          fi

          echo "  --- resolved ---"
          sed 's|^|    |' found.txt
          [ -s found.txt ] && python3 -u tools/probe.py batch found.txt \
            --out probed-found.tsv || echo "  nothing resolved"

      - name: 'Find the repository for the two with no tarball'
        run: |
          set -eu
          cd spikes/stage5
          # THE REPOSITORY URL IS DISCOVERABLE, not something to hardcode:
          # Arch's PKGBUILD records it, and `probe source` already reads it.
          python3 -u tools/probe.py source libsfdo dinit utf8proc || true

      - name: 'Resolve their tags to commits'
        run: |
          set -eu
          echo ""
          echo "  === GIT-PINNED RECIPES ==="
          for spec in \
            'https://gitlab.freedesktop.org/vyivel/libsfdo.git#v0.1.4' \
            'https://github.com/davmac314/dinit.git#v0.22.1'; do
            url="${spec%%#*}"; tag="${spec##*#}"
            out=$(git ls-remote "$url" "refs/tags/$tag" "refs/tags/$tag^{}" 2>&1 || true)
            # ^{} dereferences an annotated tag to the commit it points at.
            # Without it the answer is the tag OBJECT's hash, which is not
            # what git archive takes and not what the tree hashes to.
            c=$(echo "$out" | awk '/\^\{\}$/{print $1}' | head -1)
            [ -n "$c" ] || c=$(echo "$out" | awk 'NR==1{print $1}')
            if [ -z "$c" ]; then echo "  could not resolve $url @ $tag"; continue; fi
            echo ""
            echo "  # $url @ $tag"
            echo "  [source]"
            echo "  kind   = \"git\""
            echo "  url    = \"$url\""
            echo "  commit = \"$c\""
            echo "  tag    = \"$tag\"   # informational -- the commit is the pin"
          done

      - name: 'The table'
        if: always()
        run: |
          set -eu
          cd spikes/stage5
          echo "  === PROBED ==="
          for f in probed-gaps2.tsv probed-found.tsv; do
            [ -s "$f" ] || continue
            awk -F'\t' 'NR>1 {printf "  %-24s %-12s %-18s %s\n", $1, $3, substr($4,1,16), $6}' "$f"
          done
          echo ""
          echo "  === NO SIGNATURE ==="
          for f in probed-gaps2.tsv probed-found.tsv; do
            [ -s "$f" ] || continue
            awk -F'\t' 'NR>1 && $5=="none" {print "    " $1}' "$f"
          done
          echo ""
          echo "  === FAILED ==="
          for f in probed-gaps2.tsv probed-found.tsv; do
            [ -s "$f" ] || continue
            awk -F'\t' '$1=="FAILED" {print "    " $2}' "$f"
          done
          echo ""
          echo "  === WHAT THESE DECLARE ==="
          { ls packages; grep -v '^#' provided-names.txt; } > /tmp/have.txt
          python3 tools/probe.py deps probed-gaps2.tsv probed-found.tsv \
            --have /tmp/have.txt 2>/dev/null | tail -25
