name: stage5-probe-gaps2

# THE PACKAGES THE DEPENDENCY SCAN FOUND, AND THE URLS THAT WERE WRONG.
#
# `probe deps` read what every remaining package declares and produced one
# finding that changes the plan: FOUR packages want libudev and nothing in any
# batch provides it. busybox does not cover it -- `mdev` creates device nodes,
# while libinput, mesa, wlroots and yambar link libudev.so and call
# udev_enumerate_scan_devices(). No libudev means no input, which means no
# compositor. libudev-zero implements that API with no daemon.
#
# Also here: brotli (gnutls, libsoup, nghttp2 -- and freetype's WOFF2, which
# was deferred with a note to revisit), libidn2, json-c, orc, libutf8proc, and
# three URLs that were simply wrong last time.
#
# AND THE TWO THAT PUBLISH NO TARBALL. libsfdo and dinit only push git tags.
# Both halves of pinning them are automatic and neither was being recorded:
# `probe source` reads the repository URL out of Arch's PKGBUILD, and
# `git ls-remote refs/tags/<tag>^{}` resolves the tag to the commit it names.
# The ^{} matters -- without it an annotated tag resolves to the TAG OBJECT,
# a different hash than the commit, and `git archive` would produce something
# else entirely.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Which group to probe'
        type: choice
        options: ['all', 'gaps', 'fixes']
        default: 'all'

concurrency:
  group: stage5-probe-gaps2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # THE PARSERS BEFORE THE NETWORK. Four runs were spent concluding that
      # archive.mozilla.org returned nothing when it returned everything --
      # the href parsing was wrong, not the host. A fixture answers that in a
      # second and does not need anyone to be up.
      - name: 'Check the probe parses what hosts actually serve'
        run: |
          set -eu
          cd spikes/stage5
          python3 tools/probe.py selftest

      - name: 'Select'
        run: |
          set -eu
          cd spikes/stage5
          awk -v want="${{ inputs.batch }}" '
            /^# batch:/ { cur = $3; next }
            /^#/ || /^[[:space:]]*$/ { next }
            (want == "all" || want == cur) { print }
          ' gap-urls.txt > gap.txt
          echo "  $(wc -l < gap.txt) URLs"
          sed 's|^|    |' gap.txt

      - name: 'Probe them'
        run: |
          set -eu
          cd spikes/stage5
          python3 -u tools/probe.py batch gap.txt --out probed-gaps2.tsv || true

      # ASK, DO NOT GUESS. libxkbcommon and nss have each had a URL invented
      # for them twice, and both times the package was fine and the path was
      # wrong -- four of the last six fetch failures in this project were
      # guessed paths. `latest` asks the forge what it published; `index`
      # reads the directory listing. Then the URLs those return are probed
      # for real, in the same run, so nothing needs re-entering by hand.
      # ASK THE FORGE. Guessing URLs for these has now failed seven times
      # across five runs -- xkbcommon.org twice, Mozilla's ftp layout twice,
      # a GitHub archive path, and an NSS version that was three years stale.
      # Every one of those was an invented path rather than a missing package.
      - name: 'Ask where nss and nspr are published'
        run: |
          set -eu
          cd spikes/stage5
          # NSS IS ON GITHUB, which nothing here had established -- and asking
          # immediately corrected the version too: NSS_3_126_RTM, not the
          # 3.112 that had been assumed and typed into a URL twice.
          python3 -u tools/probe.py latest github:mozilla/nss \
            | tee /tmp/nss.txt || true
          echo ""
          python3 -u tools/probe.py latest github:nss-dev/nspr \
            | tee /tmp/nspr.txt || true
          echo ""
          # And where the packagers fetch them, as a second opinion on both.
          python3 -u tools/probe.py source nss nspr libxkbcommon \
            | tee /tmp/src.txt || true

      # WALK THE DIRECTORY TREE. archive.mozilla.org publishes a directory
      # per release with the tarball and its sha files in src/ one level
      # down -- confirmed at /pub/nspr/releases/v4.39/src/. `index` now reads
      # those listings, so this descends instead of guessing the layout.
      - name: 'Descend into the Mozilla release directories'
        run: |
          set -eu
          cd spikes/stage5
          : > moz.txt
          for what in security/nss nspr; do
            top="https://archive.mozilla.org/pub/$what/releases/"
            python3 -u tools/probe.py index "$top" --name "${what##*/}" \
              > /tmp/top.txt 2>&1 || true
            sed 's|^|    |' /tmp/top.txt
            rel=$(awk '/^ *dir /{print $2}' /tmp/top.txt | tail -1 || true)
            [ -n "$rel" ] || { echo "  no release directory under $top"; continue; }
            echo "  newest: $rel"
            python3 -u tools/probe.py index "$top$rel/src/" \
              --name "${what##*/}" > /tmp/src.txt 2>&1 || true
            sed 's|^|    |' /tmp/src.txt
            # Take real tarballs only, and for NSS prefer the plain one over
            # the -with-nspr- bundle: the plan lists nspr and nss separately,
            # and a bundle would make one tarball answer for two records.
            grep -ohE 'https://\S+\.tar\.(gz|xz|bz2)' /tmp/src.txt \
              | grep -v with-nspr | sort -V | tail -1 >> moz.txt || true
          done
          echo "  --- mozilla tarballs ---"
          sed 's|^|    |' moz.txt

      - name: 'Probe whatever real assets they named'
        run: |
          set -eu
          cd spikes/stage5
          : > found.txt
          # ONLY REAL UPLOADED ASSETS. An AUTO-GENERATED line is a forge
          # rebuilding a tarball on demand, and its checksum has shifted under
          # the whole ecosystem before -- pinning one would be pinning
          # something nobody controls.
          for f in /tmp/nss.txt /tmp/nspr.txt; do
            [ -f "$f" ] || continue
            grep -v 'AUTO-GENERATED' "$f" \
              | grep -ohE 'https://\S+\.(tar\.(gz|xz|bz2)|tgz)' \
              | grep -v 'api.github.com' >> found.txt || true
          done
          # Packager URLs as a fallback, since they point at whatever actually
          # serves these today.
          grep -ohE 'https://\S+\.(tar\.(gz|xz|bz2)|tgz)' /tmp/src.txt 2>/dev/null \
            | grep -v '\$' >> found.txt || true
          [ -f moz.txt ] && cat moz.txt >> found.txt || true
          sort -u found.txt -o found.txt
          echo "  --- real assets found ---"
          sed 's|^|    |' found.txt
          if [ -s found.txt ]; then
            python3 -u tools/probe.py batch found.txt --out probed-found.tsv || true
          else
            echo "  none -- these publish no pinnable tarball either"
          fi

      - name: 'Find the repository for the two with no tarball'
        run: |
          set -eu
          cd spikes/stage5
          # THE REPOSITORY URL IS DISCOVERABLE, not something to hardcode:
          # Arch's PKGBUILD records it, and `probe source` already reads it.
          python3 -u tools/probe.py source libsfdo dinit utf8proc || true

      - name: 'Resolve their tags to commits'
        run: |
          set -eu
          echo ""
          echo "  === GIT-PINNED RECIPES ==="
          # libxkbcommon JOINS THESE TWO. It publishes no tarball anywhere
          # we can reach, so the commit is the pin and tools/fetch-git.sh
          # generates the tarball deterministically -- same treatment, same
          # reasoning, and strictly stronger than pinning an archive a forge
          # regenerates on request.
          for spec in \
            'https://gitlab.freedesktop.org/vyivel/libsfdo.git#v0.1.4' \
            'https://github.com/davmac314/dinit.git#v0.22.1' \
            'https://github.com/xkbcommon/libxkbcommon.git#xkbcommon-1.13.2'; do
            url="${spec%%#*}"; tag="${spec##*#}"
            out=$(git ls-remote "$url" "refs/tags/$tag" "refs/tags/$tag^{}" 2>&1 || true)
            # ^{} dereferences an annotated tag to the commit it points at.
            # Without it the answer is the tag OBJECT's hash, which is not
            # what git archive takes and not what the tree hashes to.
            c=$(echo "$out" | awk '/\^\{\}$/{print $1}' | head -1)
            [ -n "$c" ] || c=$(echo "$out" | awk 'NR==1{print $1}')
            if [ -z "$c" ]; then echo "  could not resolve $url @ $tag"; continue; fi
            echo ""
            echo "  # $url @ $tag"
            echo "  [source]"
            echo "  kind   = \"git\""
            echo "  url    = \"$url\""
            echo "  commit = \"$c\""
            echo "  tag    = \"$tag\"   # informational -- the commit is the pin"
          done

      - name: 'The table'
        if: always()
        run: |
          set -eu
          cd spikes/stage5
          echo "  === PROBED ==="
          for f in probed-gaps2.tsv probed-found.tsv; do
            [ -s "$f" ] || continue
            awk -F'\t' 'NR>1 {printf "  %-24s %-12s %-18s %s\n", $1, $3, substr($4,1,16), $6}' "$f"
          done
          echo ""
          echo "  === NO SIGNATURE ==="
          for f in probed-gaps2.tsv probed-found.tsv; do
            [ -s "$f" ] || continue
            awk -F'\t' 'NR>1 && $5=="none" {print "    " $1}' "$f"
          done
          echo ""
          echo "  === FAILED ==="
          for f in probed-gaps2.tsv probed-found.tsv; do
            [ -s "$f" ] || continue
            awk -F'\t' '$1=="FAILED" {print "    " $2}' "$f"
          done
          echo ""
          echo "  === WHAT THESE DECLARE ==="
          { ls packages; grep -v '^#' provided-names.txt; } > /tmp/have.txt
          python3 tools/probe.py deps probed-gaps2.tsv probed-found.tsv \
            --have /tmp/have.txt 2>/dev/null | tail -25
