# BUILD tcc WITH micro-c, THEN ASSEMBLE, LINK AND RUN IT.
#
# WHAT CHANGED AND WHY. This job used to walk tcc's source looking for the next
# construct micro-c rejected, and it ran on x86 because nothing was executed --
# only parsed. Both of those are now out of date: libtcc.c compiles end to end,
# and the interesting question has moved from "does it parse" to "does the
# output work".
#
# So this runs on a NATIVE aarch64 runner, like most of this repo already does.
# No qemu: the binary being produced is aarch64 and the runner is aarch64.
#
# WHAT THE STAGES PROVE, IN ORDER. Each one catches a class the one before it
# cannot, which is the whole reason for going all the way to execution:
#
#   compile    the front end accepts tcc's C
#   assemble   every emitted macro EXISTS in M2libc's aarch64 vocabulary --
#              which is far narrower than the instruction set, and where four
#              real bugs were found that parsing never could
#   link       every symbol resolves
#   run        the thing actually starts
#
# WHAT IT DOES NOT PROVE. The runtime is 34 functions of M2libc plus 25 STUBS
# that are deliberately wrong -- strtoX returns 0, setjmp/longjmp do nothing,
# qsort does not sort. micro-c also maps float to a word-sized integer and
# makes `int` eight bytes. A tcc built here starts; it does not work, and it is
# not supposed to yet. The point is that the PIPELINE closes, so that when the
# unsound items are fixed there is something to fix them in.
name: micro-c builds tcc

on:
  push:
    paths:
      - 'spikes/stage3/**'
      - '.github/workflows/micro-c-builds-tcc.yml'
  pull_request:
    paths:
      - 'spikes/stage3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # NATIVE aarch64. The old x86 runner was correct while this only parsed;
    # it cannot run what it now produces.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      M2PLANET_SHA: bd2fe4b0659fd0ad3f476a5ad0ef801bd134665d
      TCC_SHA:      5ec0e6f84b47ebd8c269b581712666313f5edaef
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git >/dev/null

      - name: Build micro-c from the pin plus our patch series
        run: |
          set -eu
          git clone -q https://github.com/oriansj/M2-Planet.git m2
          git -C m2 checkout -q "$M2PLANET_SHA"
          git -C m2 submodule update --init --recursive -q

          # EVERY patch, in order, and a HARD FAIL on any that does not apply.
          # This job previously carried on past a failure and reported a wall
          # that was really a stale patch; the series is checked before it is
          # applied, and the count is asserted at the end so a file silently
          # dropped from the series is caught too.
          n=0
          for p in spikes/stage3/patches/m2-planet/[0-9]*.patch \
                   spikes/stage3/patches/micro-c-experiments/EXPERIMENT-*.patch; do
            [ -e "$p" ] || continue
            git -C m2 apply --ignore-whitespace --check "../$p" \
              || { echo "FAIL: $(basename "$p") does not apply to $M2PLANET_SHA"; exit 1; }
            git -C m2 apply --ignore-whitespace "../$p"
            n=$((n + 1))
          done
          echo "  applied $n patches to M2-Planet $(git -C m2 rev-parse --short HEAD)"
          [ "$n" -ge 12 ] || { echo "FAIL: expected at least 12 patches, applied $n"; exit 1; }

          cd m2
          gcc -w -o ../micro-c cc.c cc_core.c cc_emit.c cc_globals.c \
                               cc_macro.c cc_reader.c cc_strings.c cc_types.c \
                               M2libc/bootstrappable.c
          cd ..
          ./micro-c --version 2>/dev/null || true
          echo "  micro-c built"

      - name: Fetch pinned tcc and apply the arm64 series
        run: |
          set -eu
          git clone -q https://repo.or.cz/tinycc.git tcc \
            || git clone -q https://github.com/TinyCC/tinycc.git tcc
          git -C tcc checkout -q "$TCC_SHA"
          n=0
          for p in spikes/stage3/patches/tcc-arm64-asm/[0-9]*.patch; do
            git -C tcc apply --ignore-whitespace --check "../$p" \
              || { echo "FAIL: $(basename "$p") does not apply"; exit 1; }
            git -C tcc apply --ignore-whitespace "../$p"
            n=$((n + 1))
          done
          [ "$n" = 5 ] || { echo "FAIL: applied $n tcc patches, expected 5"; exit 1; }

          cd tcc
          ./configure --cpu=arm64 >/dev/null 2>&1 || true
          # tccdefs_.h is GENERATED by tcc's own build, from a tiny host C
          # program. Reaching tcc from the seed means c2str has to come from the
          # ladder too -- a real hermetic-build dependency, not scaffolding.
          cc -DC2STR conftest.c -o c2str.exe
          ./c2str.exe include/tccdefs.h tccdefs_.h
          echo "  tcc $(git rev-parse --short HEAD) + $n patches, tccdefs_.h generated"

      - name: 'STAGE 1: compile libtcc.c'
        run: |
          set -eu
          L="$PWD/spikes/stage3/micro-c-libc"
          cd tcc
          ../micro-c --architecture aarch64 --expand-includes --max-string 65536 \
            -D ONE_SOURCE=1 -D TCC_TARGET_ARM64=1 -D TCC_TARGET_LINUX=1 \
            -D CONFIG_TCC_STATIC=1 \
            -I . -I "$L" -I ../m2/M2libc \
            -f libtcc.c -o ../libtcc.M1
          cd ..
          echo "  libtcc.c -> $(wc -l < libtcc.M1) lines, $(grep -c '^:FUNCTION_' libtcc.M1) functions"

      - name: 'STAGE 1b: compile M2libc and the link stubs with micro-c'
        run: |
          set -eu
          M=spikes/reference/m2libc
          for f in stdlib.c string.c ctype.c fcntl.c; do
            ./micro-c --architecture aarch64 --expand-includes --max-string 65536 \
              -I "$M" -f "$M/$f" -o "m2_${f%.c}.M1"
          done
          # stdio.c uses FILE without including its own header; M2-Planet's build
          # passes the header separately, so this does too.
          ./micro-c --architecture aarch64 --expand-includes --max-string 65536 \
            -I "$M" -f "$M/stdio.h" -f "$M/stdio.c" -o m2_stdio.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f spikes/stage3/micro-c-libc/impl/stubs.c -o stubs.M1
          cat libtcc.M1 m2_*.M1 stubs.M1 > all.M1
          echo "  combined: $(grep -c '^:FUNCTION_' all.M1) functions"

      - name: 'STAGE 2: assemble with M1'
        run: |
          set -eu
          T=spikes/reference/mescc-tools
          cp -r "$T" mescc && cp $T/../m2libc/*.c $T/../m2libc/*.h mescc/M2libc/ 2>/dev/null || true
          mkdir -p mescc/M2libc
          cp spikes/reference/m2libc/bootstrappable.c spikes/reference/m2libc/bootstrappable.h mescc/M2libc/

          # M1's max_string is 4096 and tcc has a 19,572-character byte string
          # (tcc_keywords, 433 lines of macro expansion). Raised for this job
          # only; M1 is scaffolding here, not part of the ladder.
          sed -i 's/max_string = 4096,/max_string = 262144,/' mescc/M1-macro.c

          gcc -w -o M1 mescc/M1-macro.c mescc/stringify.c mescc/M2libc/bootstrappable.c
          gcc -w -o hex2 mescc/hex2_linker.c mescc/hex2_word.c mescc/hex2.c mescc/M2libc/bootstrappable.c

          D=spikes/reference/m2libc/aarch64
          ./M1 -f $D/aarch64_defs.M1 -f $D/libc-full.M1 -f all.M1 \
               --little-endian --architecture aarch64 -o all.hex2
          echo "  assembled: $(wc -l < all.hex2) lines"

      - name: 'STAGE 3: link with hex2'
        run: |
          set -eu
          D=spikes/reference/m2libc/aarch64
          ./hex2 --architecture aarch64 --little-endian --base-address 0x400000 \
                 -f $D/ELF-aarch64.hex2 -f all.hex2 -o tcc-microc
          chmod +x tcc-microc
          ls -l tcc-microc | awk '{print "  binary: "$5" bytes"}'
          file tcc-microc || true

      - name: 'STAGE 4: run it'
        run: |
          set -eu
          echo "  runner is $(uname -m) -- the binary is aarch64, so this is native"
          # THE BAR IS DELIBERATELY LOW. main() calls tcc_new() and returns; the
          # runtime underneath is 25 deliberately-wrong stubs. What is being
          # asked is whether the binary STARTS and returns -- that the ELF is
          # valid, the entry point is right, and the first real call into
          # compiled tcc code does not fault. It is not a test that tcc works.
          set +e
          ./tcc-microc
          rc=$?
          set -e
          echo "  exit code: $rc"
          if [ "$rc" -gt 128 ]; then
            echo "  KILLED BY SIGNAL $((rc - 128)) -- it started and then faulted."
            echo "  That is a real result and it is recorded, not swallowed."
            exit 1
          fi
          echo "  it ran"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micro-c-tcc
          path: |
            tcc-microc
            all.M1
            all.hex2
          if-no-files-found: warn
