# BUILD tcc WITH micro-c, THEN ASSEMBLE, LINK AND RUN IT.
#
# WHAT CHANGED AND WHY. This job used to walk tcc's source looking for the next
# construct micro-c rejected, and it ran on x86 because nothing was executed --
# only parsed. Both of those are now out of date: libtcc.c compiles end to end,
# and the interesting question has moved from "does it parse" to "does the
# output work".
#
# So this runs on a NATIVE aarch64 runner, like most of this repo already does.
# No qemu: the binary being produced is aarch64 and the runner is aarch64.
#
# WHAT THE STAGES PROVE, IN ORDER. Each one catches a class the one before it
# cannot, which is the whole reason for going all the way to execution:
#
#   compile    the front end accepts tcc's C
#   assemble   every emitted macro EXISTS in M2libc's aarch64 vocabulary --
#              which is far narrower than the instruction set, and where four
#              real bugs were found that parsing never could
#   link       every symbol resolves
#   run        the thing actually starts
#
# WHAT IT DOES NOT PROVE. The runtime is 34 functions of M2libc plus 25 STUBS
# that are deliberately wrong -- strtoX returns 0, setjmp/longjmp do nothing,
# qsort does not sort. micro-c also maps float to a word-sized integer and
# makes `int` eight bytes. A tcc built here starts; it does not work, and it is
# not supposed to yet. The point is that the PIPELINE closes, so that when the
# unsound items are fixed there is something to fix them in.
name: micro-c builds tcc

on:
  push:
    paths:
      - 'spikes/stage3/**'
      - '.github/workflows/micro-c-builds-tcc.yml'
  pull_request:
    paths:
      - 'spikes/stage3/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # NATIVE aarch64. The old x86 runner was correct while this only parsed;
    # it cannot run what it now produces.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      M2PLANET_SHA: bd2fe4b0659fd0ad3f476a5ad0ef801bd134665d
      TCC_SHA:      5ec0e6f84b47ebd8c269b581712666313f5edaef
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git >/dev/null

      - name: Build micro-c from the pin plus our patch series
        run: |
          set -eu
          git clone -q https://github.com/oriansj/M2-Planet.git m2
          git -C m2 checkout -q "$M2PLANET_SHA"
          git -C m2 submodule update --init --recursive -q

          # EVERY patch, in order, and a HARD FAIL on any that does not apply.
          # This job previously carried on past a failure and reported a wall
          # that was really a stale patch; the series is checked before it is
          # applied, and the count is asserted at the end so a file silently
          # dropped from the series is caught too.
          n=0
          for p in spikes/stage3/patches/m2-planet/[0-9]*.patch \
                   spikes/stage3/patches/micro-c-experiments/EXPERIMENT-*.patch; do
            [ -e "$p" ] || continue
            git -C m2 apply --ignore-whitespace --check "../$p" \
              || { echo "FAIL: $(basename "$p") does not apply to $M2PLANET_SHA"; exit 1; }
            git -C m2 apply --ignore-whitespace "../$p"
            n=$((n + 1))
          done
          echo "  applied $n patches to M2-Planet $(git -C m2 rev-parse --short HEAD)"
          [ "$n" -ge 12 ] || { echo "FAIL: expected at least 12 patches, applied $n"; exit 1; }

          cd m2
          gcc -w -o ../micro-c cc.c cc_core.c cc_emit.c cc_globals.c \
                               cc_macro.c cc_reader.c cc_strings.c cc_types.c \
                               M2libc/bootstrappable.c
          cd ..
          ./micro-c --version 2>/dev/null || true
          echo "  micro-c built"

      - name: Fetch pinned tcc and apply the arm64 series
        run: |
          set -eu
          git clone -q https://repo.or.cz/tinycc.git tcc \
            || git clone -q https://github.com/TinyCC/tinycc.git tcc
          git -C tcc checkout -q "$TCC_SHA"
          n=0
          for p in spikes/stage3/patches/tcc-arm64-asm/[0-9]*.patch; do
            git -C tcc apply --ignore-whitespace --check "../$p" \
              || { echo "FAIL: $(basename "$p") does not apply"; exit 1; }
            git -C tcc apply --ignore-whitespace "../$p"
            n=$((n + 1))
          done
          [ "$n" = 5 ] || { echo "FAIL: applied $n tcc patches, expected 5"; exit 1; }

          cd tcc
          ./configure --cpu=arm64 >/dev/null 2>&1 || true
          # tccdefs_.h is GENERATED by tcc's own build, from a tiny host C
          # program. Reaching tcc from the seed means c2str has to come from the
          # ladder too -- a real hermetic-build dependency, not scaffolding.
          cc -DC2STR conftest.c -o c2str.exe
          ./c2str.exe include/tccdefs.h tccdefs_.h
          echo "  tcc $(git rev-parse --short HEAD) + $n patches, tccdefs_.h generated"

      - name: 'STAGE 1: compile libtcc.c'
        run: |
          set -eu
          L="$PWD/spikes/stage3/micro-c-libc"
          cd tcc
          ../micro-c --architecture aarch64 --expand-includes --max-string 65536 \
            -D ONE_SOURCE=1 -D TCC_TARGET_ARM64=1 -D TCC_TARGET_LINUX=1 \
            -D CONFIG_TCC_STATIC=1 \
            -I . -I "$L" -I ../m2/M2libc \
            -f libtcc.c -o ../libtcc.M1
          cd ..
          echo "  libtcc.c -> $(wc -l < libtcc.M1) lines, $(grep -c '^:FUNCTION_' libtcc.M1) functions"

      - name: 'STAGE 1b: compile M2libc and the link stubs with micro-c'
        run: |
          set -eu
          M=spikes/reference/m2libc

          # M2libc IS PATCHED TOO. free(NULL) exits(1) upstream instead of
          # doing nothing, and tcc relies on the standard behaviour. Applied to
          # a COPY so the vendored reference tree stays pristine.
          rm -rf m2libc-patched && cp -r "$M" m2libc-patched
          for p in spikes/stage3/patches/m2libc/[0-9]*.patch; do
            [ -e "$p" ] || continue
            (cd m2libc-patched && git apply --ignore-whitespace "../$p") \
              || { echo "FAIL: $(basename "$p") does not apply to M2libc"; exit 1; }
            echo "  applied $(basename "$p") to M2libc"
          done
          M=m2libc-patched

          # ONE INVOCATION, IN M2libc's OWN ORDER.
          #
          # Compiling these as separate translation units and concatenating the
          # results defined GLOBAL__envp, __init_malloc and __init_io THREE
          # TIMES each -- every file that includes the headers re-emits them.
          # The startup stub then wrote envp into one copy and malloc read
          # another, and the binary took SIGBUS before reaching main. A bare
          # `int main(){return 0;}` faulted; nothing this project compiled was
          # at fault.
          #
          # The order is taken from M2libc's own test0106, plus string.c, which
          # that test does not need and libtcc does (memcpy). Header files
          # appear as -f arguments because that is how M2-Planet is fed types
          # that have no .c of their own.
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$M/ctype.c" \
            -f "$M/stdarg.h" \
            -f "$M/sys/types.h" \
            -f "$M/stddef.h" \
            -f "$M/signal.h" \
            -f "$M/sys/utsname.h" \
            -f "$M/aarch64/linux/unistd.c" \
            -f "$M/aarch64/linux/fcntl.c" \
            -f "$M/fcntl.c" \
            -f "$M/stdlib.c" \
            -f "$M/string.c" \
            -f "$M/stdio.h" \
            -f "$M/stdio.c" \
            -f "$M/bootstrappable.c" \
            -o m2libc.M1

          # Two SMALLER M2libc builds, for the bisect. The jump from A (236
          # bytes) to B (fifty thousand) is too large to learn much from.
          # THE FLOOR IS stdlib.c. Anything smaller fails to LINK -- ctype.c
          # and unistd.c both reach for malloc -- which is why the previous
          # ladder had a rung that reported "hex2 FAILED" and told us nothing.
          # A rung that cannot link is not a rung.
          #
          # Locally: 14,478 with stdlib, 22,374 adding string, 49,711 adding
          # stdio, against A's 248.
          H="-f $M/stdarg.h -f $M/sys/types.h -f $M/stddef.h -f $M/signal.h -f $M/sys/utsname.h"
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$M/ctype.c" $H \
            -f "$M/aarch64/linux/unistd.c" -f "$M/aarch64/linux/fcntl.c" \
            -f "$M/fcntl.c" -f "$M/stdlib.c" -o m2_min.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$M/ctype.c" $H \
            -f "$M/aarch64/linux/unistd.c" -f "$M/aarch64/linux/fcntl.c" \
            -f "$M/fcntl.c" -f "$M/stdlib.c" -f "$M/string.c" -o m2_nostdio.M1

          ./micro-c --architecture aarch64 --max-string 65536 \
            -f spikes/stage3/micro-c-libc/impl/stubs.c -o stubs.M1

          # ASSERT NO DUPLICATES. This is the bug that cost two CI rounds, and
          # it is invisible until the thing runs, so check it here.
          for sym in GLOBAL__envp FUNCTION___init_malloc FUNCTION___init_io; do
            n=$(grep -c "^:$sym" m2libc.M1 || true)
            [ "$n" = 1 ] || { echo "FAIL: $sym defined $n times, expected 1"; exit 1; }
          done
          echo "  M2libc: $(grep -c '^:FUNCTION_' m2libc.M1) functions, no duplicate globals"

          # ORDER MATTERS: all CODE, then all STRINGS.
          #
          # micro-c emits each object as code followed by its string pool. In a
          # CONCATENATION that puts one object's strings immediately before the
          # next object's code, and a string pool is an arbitrary number of
          # bytes -- so the next function starts on an address that is not a
          # multiple of four. On aarch64 a branch to an unaligned instruction
          # is SIGBUS, which is why the ladder ran at 248 bytes and faulted at
          # 14,478.
          #
          # Splitting at the marker and emitting all code first keeps every
          # label aligned. The compiler also pads its own global string data
          # now; both are needed, because either one alone still leaves an odd
          # number of bytes somewhere ahead of a function.
          join_objs() {
            out="$1"; shift
            : > "$out.code"; : > "$out.strs"
            for f in "$@"; do
              if grep -q '^# Program strings$' "$f"; then
                sed '/^# Program strings$/,$d' "$f" >> "$out.code"
                sed -n '/^# Program strings$/,$p' "$f" >> "$out.strs"
              else
                cat "$f" >> "$out.code"
              fi
            done
            cat "$out.code" "$out.strs" > "$out"
            rm -f "$out.code" "$out.strs"
          }

          join_objs all.M1 libtcc.M1 m2libc.M1 stubs.M1
          echo "  combined: $(grep -c '^:FUNCTION_' all.M1) functions"

      - name: 'STAGE 2: assemble with M1'
        run: |
          set -eu
          T=spikes/reference/mescc-tools
          cp -r "$T" mescc && cp $T/../m2libc/*.c $T/../m2libc/*.h mescc/M2libc/ 2>/dev/null || true
          mkdir -p mescc/M2libc
          cp spikes/reference/m2libc/bootstrappable.c spikes/reference/m2libc/bootstrappable.h mescc/M2libc/

          # M1's max_string is 4096 and tcc has a 19,572-character byte string
          # (tcc_keywords, 433 lines of macro expansion). Raised for this job
          # only; M1 is scaffolding here, not part of the ladder.
          sed -i 's/max_string = 4096,/max_string = 262144,/' mescc/M1-macro.c

          gcc -w -o M1 mescc/M1-macro.c mescc/stringify.c mescc/M2libc/bootstrappable.c
          gcc -w -o hex2 mescc/hex2_linker.c mescc/hex2_word.c mescc/hex2.c mescc/M2libc/bootstrappable.c

          D=spikes/reference/m2libc/aarch64
          ./M1 -f $D/aarch64_defs.M1 -f $D/libc-full.M1 -f all.M1 \
               --little-endian --architecture aarch64 -o all.hex2
          echo "  assembled: $(wc -l < all.hex2) lines"

      - name: 'STAGE 3+4: bisect by LINK SET'
        run: |
          # ORDER MATTERS: all CODE, then all STRINGS.
          #
          # micro-c emits each object as code followed by its string pool. In a
          # CONCATENATION that puts one object's strings immediately before the
          # next object's code, and a string pool is an arbitrary number of
          # bytes -- so the next function starts on an address that is not a
          # multiple of four. On aarch64 a branch to an unaligned instruction
          # is SIGBUS, which is why the ladder ran at 248 bytes and faulted at
          # 14,478.
          #
          # Splitting at the marker and emitting all code first keeps every
          # label aligned. The compiler also pads its own global string data
          # now; both are needed, because either one alone still leaves an odd
          # number of bytes somewhere ahead of a function.
          join_objs() {
            out="$1"; shift
            : > "$out.code"; : > "$out.strs"
            for f in "$@"; do
              if grep -q '^# Program strings$' "$f"; then
                sed '/^# Program strings$/,$d' "$f" >> "$out.code"
                sed -n '/^# Program strings$/,$p' "$f" >> "$out.strs"
              else
                cat "$f" >> "$out.code"
              fi
            done
            cat "$out.code" "$out.strs" > "$out"
            rm -f "$out.code" "$out.strs"
          }

          set -eu
          D=spikes/reference/m2libc/aarch64
          P=spikes/stage3/micro-c-libc/impl
          echo "  runner is $(uname -m); the binary is aarch64, so this is native"
          echo

          # WHAT VARIES HERE IS WHAT IS LINKED, not what main does.
          #
          # The first bisect varied main and linked everything in every case,
          # so all three faulted identically and it proved nothing except that
          # `int main(){return 0;}` faults -- which was itself the finding: the
          # problem is not in tcc's code.
          #
          #   A  libc-core + bare              the toolchain and ELF header
          #   B  libc-core + M2libc + bare      our compiler's output at all
          #   C  libc-full + M2libc + bare      envp and __init_malloc startup
          #   D  C + stubs                      the stub file
          #   E  D + libtcc.M1                  tcc's 350k lines
          #   F  E, main calls tcc_new          tcc's code actually running
          #
          # libc-full's _start calls __init_malloc, so it cannot be linked
          # without M2libc -- which is why B uses libc-core. Locally, A links
          # to a 236-byte binary; if something that small faults, nothing above
          # it is worth reading.
          #
          # The first to fault is the answer.
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$P/main-00-nothing.c" -o bare.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$P/main-01-malloc.c" -o mallocit.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$P/main-02-tccmalloc.c" -o tccmal.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$P/main-03-mallocz.c" -o mallocz.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$P/main-04-strdup.c" -o strdupit.M1
          ./micro-c --architecture aarch64 --max-string 65536 \
            -f "$P/main-01-tccnew.c" -o callit.M1

          run_probe() {
            nm="$1"; core="$2"; shift 2
            join_objs "$nm.M1" "$@"
            ./M1 -f $D/aarch64_defs.M1 -f "$D/$core" -f "$nm.M1" \
                 --little-endian --architecture aarch64 -o "$nm.hex2" 2>/dev/null \
              || { printf '  %-34s M1 FAILED -- BROKEN RUNG\n' "$nm"; echo "$nm" >> broken.txt; return 0; }
            ./hex2 --architecture aarch64 --little-endian --base-address 0x400000 \
                   -f $D/ELF-aarch64.hex2 -f "$nm.hex2" -o "$nm" 2>/dev/null \
              || { printf '  %-34s hex2 FAILED -- BROKEN RUNG\n' "$nm"; echo "$nm" >> broken.txt; return 0; }
            chmod +x "$nm"
            set +e
            ./"$nm" >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" = 42 ]; then
              # 42 comes from a raw exit syscall inside main. Nothing else in
              # the binary can produce it, so it is proof main was REACHED --
              # which `exit 0` never was.
              printf '  %-34s MAIN RAN (exit 42)     (%s bytes)\n' "$nm" "$(stat -c%s "$nm")"
            elif [ "$rc" = 0 ]; then
              printf '  %-34s exit 0 -- main did NOT reach its syscall (%s bytes)\n' "$nm" "$(stat -c%s "$nm")"
            elif [ "$rc" -gt 128 ]; then
              printf '  %-34s SIGNAL %-3s             (%s bytes)\n' "$nm" "$((rc - 128))" "$(stat -c%s "$nm")"
              echo "$nm" >> faults.txt
            else
              printf '  %-34s exit %-3s (ran)         (%s bytes)\n' "$nm" "$rc" "$(stat -c%s "$nm")"
            fi
          }

          : > faults.txt
          : > broken.txt
          # A2 and A3 sit between A and B. B moved when the M2libc composition
          # changed, and the gap is too large to learn from: A links 248 bytes,
          # B links 49,711. The ladder is 248 / 1,312 / 22,374 / 49,711, so
          # whichever step faults names a specific part of M2libc.
          run_probe A-bare-core     libc-core.M1  bare.M1
          run_probe A2-stdlib       libc-core.M1  m2_min.M1 bare.M1
          run_probe A3-plus-string  libc-core.M1  m2_nostdio.M1 bare.M1
          run_probe B-m2libc-core   libc-core.M1  m2libc.M1 bare.M1
          run_probe C-m2libc-full   libc-full.M1  m2libc.M1 bare.M1
          run_probe D-plus-stubs    libc-full.M1  m2libc.M1 stubs.M1 bare.M1
          run_probe E-plus-libtcc   libc-full.M1  libtcc.M1 m2libc.M1 stubs.M1 bare.M1
          # E2 sits between E and F: same link set, but main calls MALLOC
          # rather than tcc_new. tcc_new's first act is an allocation, so if
          # the allocator is broken then F faults for a reason that has nothing
          # to do with tcc and reading tccgen.c would be wasted effort.
          run_probe E2-malloc       libc-full.M1  libtcc.M1 m2libc.M1 stubs.M1 mallocit.M1
          # E3 is the narrowest step into tcc there is. tcc_malloc is
          #     return reallocator(0, size);
          # an INDIRECT call through a global function pointer initialised with
          # a function name -- something micro-c only learned to emit at
          # libtcc.c:265, right at the end of the walk, and which nothing has
          # exercised since. E2 already proved the underlying malloc works, so
          # if E3 faults the fault is the indirect call, not the allocator and
          # not tcc's logic.
          run_probe E3-tcc_malloc   libc-full.M1  libtcc.M1 m2libc.M1 stubs.M1 tccmal.M1
          # E4: tcc_mallocz(8192) -- a BIG allocation plus memset, which is
          # literally tcc_new's first statement. E3 only proved 64 bytes.
          run_probe E4-mallocz      libc-full.M1  libtcc.M1 m2libc.M1 stubs.M1 mallocz.M1
          # E5: tcc_strdup -- the only call tcc_new makes past its allocation
          # that can be reached without a TCCState. tcc_set_options is
          # #ifdef'd out here, so if E5 passes, all that is left inside
          # tcc_new is writing fields into the struct itself.
          run_probe E5-strdup       libc-full.M1  libtcc.M1 m2libc.M1 stubs.M1 strdupit.M1
          run_probe F-call-tcc_new  libc-full.M1  libtcc.M1 m2libc.M1 stubs.M1 callit.M1

          echo
          # A RUNG THAT CANNOT LINK IS NOT A RUNG. The previous ladder had one
          # that printed "hex2 FAILED" and was skipped, so the step it was
          # supposed to isolate went unmeasured and the bisect silently lost
          # its resolution. That is now a failure in its own right.
          if [ -s broken.txt ]; then
            echo "  BROKEN RUNG(S): $(tr '\n' ' ' < broken.txt)"
            echo "  The ladder has a gap; fix the link set before reading the faults."
            exit 1
          fi
          if [ -s faults.txt ]; then
            echo "  FIRST FAULT: $(head -1 faults.txt)"
            echo "  Everything before it ran, which is what makes that mean something."
            exit 1
          fi
          echo "  every link set ran"

      - name: 'DEBUG: which statement in tcc_new faults'
        if: always()
        run: |
          set -eu
          # Rebuild libtcc.c with raw-syscall markers through tcc_new, so the
          # exit code names the STATEMENT. This runs whether or not the ladder
          # passed, because when F is the only failure this is the only thing
          # that advances it.
          #
          # The LAST marker printed names the last statement that survived.
          #
          # The first version of this used EXIT syscalls, which was useless: an
          # exit marker ends the process, so only the first could ever fire and
          # it reported the position of that marker rather than the fault.
          # These write to stderr and carry on.
          cd tcc
          git apply --ignore-whitespace ../spikes/stage3/patches/tcc-debug/0001-DEBUG-markers-in-tcc_new.patch \
            || { echo "  debug patch does not apply -- skipping"; exit 0; }
          cd ..
          L="$PWD/spikes/stage3/micro-c-libc"
          cd tcc
          ../micro-c --architecture aarch64 --expand-includes --max-string 65536 \
            -D ONE_SOURCE=1 -D TCC_TARGET_ARM64=1 -D TCC_TARGET_LINUX=1 \
            -D CONFIG_TCC_STATIC=1 -I . -I "$L" -I ../m2/M2libc \
            -f libtcc.c -o ../dbg.M1
          cd ..
          D=spikes/reference/m2libc/aarch64
          join_objs() {
            out="$1"; shift
            : > "$out.code"; : > "$out.strs"
            for f in "$@"; do
              if grep -q '^# Program strings$' "$f"; then
                sed '/^# Program strings$/,$d' "$f" >> "$out.code"
                sed -n '/^# Program strings$/,$p' "$f" >> "$out.strs"
              else
                cat "$f" >> "$out.code"
              fi
            done
            cat "$out.code" "$out.strs" > "$out"; rm -f "$out.code" "$out.strs"
          }
          join_objs dbgall.M1 dbg.M1 m2libc.M1 stubs.M1 callit.M1
          ./M1 -f $D/aarch64_defs.M1 -f $D/libc-full.M1 -f dbgall.M1 \
               --little-endian --architecture aarch64 -o dbg.hex2
          ./hex2 --architecture aarch64 --little-endian --base-address 0x400000 \
                 -f $D/ELF-aarch64.hex2 -f dbg.hex2 -o tcc-dbg
          chmod +x tcc-dbg
          set +e
          ./tcc-dbg 2> markers.txt
          rc=$?
          set -e
          echo "  markers printed: $(tr '\n' ' ' < markers.txt)"
          echo "  exit: $rc"
          last=$(tail -1 markers.txt 2>/dev/null || true)
          case "$last" in
            M50) echo "  FAULTS AT: s->ppfp = stdout" ;;
            M51) echo "  FAULTS AT: s->include_stack_ptr = s->include_stack" ;;
            M52) echo "  FAULTS AT: tcc_set_lib_path" ;;
            M53) echo "  tcc_new COMPLETED -- the fault is after it" ;;
            *)   echo "  no marker printed at all -- the fault is BEFORE the field writes," ;
                 echo "  or write() itself does not work here" ;;
          esac

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micro-c-tcc
          path: |
            A-bare-core
            F-call-tcc_new
            libtcc.M1
          if-no-files-found: warn
