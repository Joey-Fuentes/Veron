name: 3-micro-c-build
# THE REAL STAGE-3 CHAIN, natively: pico-c compiles micro-c, pico-c builds
# M1 and hex2, micro-c compiles tcc, our M1 and hex2 link it -> tcc-arm64.
# Extracted from stage0-stage4-complete-amd64.yml (the TRUE zero-budget
# form); the workflow is a caller of stages/3-micro-c/build.sh, the same
# script that runs on a laptop or a phone.
#
# Triggers on stage 1 binaries and stage 2 deliberately: stage 3 consumes
# them, so their re-baseline must re-prove this chain -- staleness by
# design, same as 2-pico-c-verify.
on:
  push:
    branches: ['**']
    paths:
      - 'stages/3-micro-c/**'
      - 'stages/2-pico-c/**'
      - 'stages/1-self-assembly/self-assembler-arm64'
      - 'stages/1-self-assembly/elf-wrapper-arm64'
      - 'tools/drop_asm.py'
      - 'tools/include_closure.py'
      - 'tools/octal_to_decimal.py'
      - 'tools/defines_to_enums.py'
      - 'tools/clone-pinned.sh'
      - '.github/workflows/3-micro-c-build.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install (airlock deps for the scripts)
        run: |
          sudo apt-get update
          # `patch` is gone from this list on purpose (2026-08-25): the build
          # applies ONE condensed patch by strict git apply. If it ever needs
          # patch(1) again, that is a stale patch to regenerate with
          # stages/3-micro-c/tcc/condense.sh, not a package to install.
          sudo apt-get install -y --no-install-recommends python3 git file
      - name: 'STAGE 2: rebuild to records (stage 3 consumes out/2)'
        run: ./stages/2-pico-c/verify.sh
      - name: 'STAGE 3 in/: materialize inputs (adopted-first; else pin-true fetch)'
        run: sh stages/3-micro-c/build.sh in
      - name: 'STAGE 3 chain: seed-rooted micro-c, M1, hex2, then tcc-arm64'
        run: sh stages/3-micro-c/build.sh chain
      - name: 'THE NUMBERS: every artifact, exact size, sha, mode'
        run: |
          set -eu
          echo "  stage-3 artifact ladder (builders above, outputs below):"
          for f in out/3/aarch64/micro-c out/3/aarch64/M1 \
                   out/3/aarch64/hex2 out/3/aarch64/tcc-arm64; do
            printf '    %-12s %10s bytes  sha256 %s  mode %s\n' \
              "$(basename "$f")" "$(wc -c < "$f")" \
              "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c %04a "$f")"
          done
          file -b out/3/aarch64/tcc-arm64 | cut -c1-70
      - name: 'Collect the artifacts (for records + off-runner comparison)'
        uses: actions/upload-artifact@v4
        with:
          name: stage-3-aarch64
          path: out/3/aarch64/
          retention-days: 14
      # Provenance after the gates, main only -- same honesty split as
      # stages 1 and 2: the attestation says who/where; the records (minted
      # from these numbers next) say how.
      - name: 'ATTEST: bind the chain outputs to this workflow identity'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            out/3/aarch64/tcc-arm64
            out/3/aarch64/micro-c
            out/3/aarch64/M1
            out/3/aarch64/hex2
            out/3/aarch64/substages.toml

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # release upload -- this job only
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stage-3-aarch64
          path: a
      # THE CONSUMPTION BOUNDARY (design: publish where the next stage
      # consumes): 3/latest-aarch64 carries the CONTRACT -- the compiler,
      # the records that prove it, and the digest file consumers verify.
      # The tag stays fixed; assets clobber; identity is content, not tag.
      - name: 'PUBLISH: 3/latest-aarch64 (tcc-arm64 + records + digests)'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir rel && cp a/tcc-arm64 a/substages.toml rel/
          ( cd rel && sha256sum tcc-arm64 substages.toml > ARTIFACT-SHA256 )
          cat rel/ARTIFACT-SHA256
          gh release view 3/latest-aarch64 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create 3/latest-aarch64 --repo "$GITHUB_REPOSITORY" \
                 --latest=false \
                 --title "3/latest-aarch64: the stage-3 handoff" \
                 --notes "The stage 3 -> stage 4 contract for aarch64: tcc-arm64, its run-emitted substage records, and ARTIFACT-SHA256. Consumers fetch these into in/, verify the digests, and cross-check substages.toml against the committed record. Assets update on every green main build; identity is the content, never the tag."
          gh release upload 3/latest-aarch64 --repo "$GITHUB_REPOSITORY" \
            --clobber rel/tcc-arm64 rel/substages.toml rel/ARTIFACT-SHA256
