name: gcc47-libgcc-ice

# THE ICE THAT BLOCKS THE gcc LEG
#
#   g474/libgcc/unwind-dw2.c: In function 'uw_init_context_1':
#   g474/libgcc/unwind-dw2.c:1490:44: internal compiler error: Segmentation fault
#
# 104 libgcc objects compile, then the backported compiler segfaults. No
# libgcc.a means xgcc cannot link, which means: no stage 2, no fixpoint without
# borrowing gcc 13's runtime, no g++ 4.7, and no rung above. Three separate
# results are queued behind this one file.
#
# WHAT IS ALREADY KNOWN, so this spike does not re-measure it:
#   - It is NOT tcc. The ICE reproduces identically under the host gcc 13 and
#     under our tcc -- same file, same line 1490, same column 44, after the same
#     104 objects. Two compilers agreeing on where to crash means the fault is
#     in the source they both compiled, and that source is the transplant.
#   - It is a SEGFAULT, not an assertion. gcc 4.7 is full of gcc_assert and
#     internal_error; reaching neither and taking SIGSEGV points at an
#     out-of-bounds access rather than a check the middle-end knows how to make.
#
# THE ucontext HYPOTHESIS IS DEAD -- FALSIFIED 2026-07-26, INDEPENDENTLY.
#
# hermetic-gcc47 built gcc 4.7.4 + the transplant inside an LFS 7.5 box whose
# libc is glibc 2.19, which PREDATES the 2.26 `struct ucontext` -> `ucontext_t`
# rename. The box verified the premise before running the experiment --
#
#   47:typedef struct ucontext
#   PREMISE HOLDS: the struct tag exists at this glibc.
#
# -- and the compiler still died in the same place, unpatched:
#
#   /work/g474/libgcc/unwind-dw2.c:1490:44: internal compiler error: Segmentation fault
#
# Same file, same line, same column, on a libc where the renamed-type theory
# cannot apply. So the ICE is NOT environmental and step 2 below is no longer a
# hypothesis under test -- keep it only as a way to get PAST the fault and reach
# the rungs above, and treat a green step 2 as a workaround rather than a
# diagnosis. THE REAL QUESTION IS NOW STEP 5's BACKTRACE.
#
# WHERE uw_init_context_1 SITS, and why the transplant is the suspect. That
# function is almost entirely target-driven builtins --
# __builtin_dwarf_cfa, __builtin_init_dwarf_reg_size_table,
# __builtin_unwind_init, __builtin_extract_return_addr. Expanding the second
# walks the TARGET's description of its DWARF frame registers:
# DWARF_FRAME_REGISTERS, DWARF_FRAME_REGNUM, the return-column macros. A 4.8
# backend describing its registers one way, against a 4.7 middle-end sizing an
# array another way, writes past the end of that array. That is a hypothesis
# with a named mechanism, not a diagnosis, and this spike exists to replace it
# with a backtrace.
#
# WHAT THIS RUN PRODUCES, cheapest first:
#
#   1. THE CONTROL, NOW READ (2026-07-26). Vanilla 4.8.5 and the transplanted
#      4.7.4 fail DIFFERENTLY, and that is the point:
#
#        c474 (transplant)  104 objects  unwind-dw2.c:1490:44
#                                        internal compiler error: Segmentation fault
#        c485 (vanilla)     129 objects  md-unwind-support.h:42:21
#                                        error: field 'uc' has incomplete type
#
#      The control fails with a CLEAN DIAGNOSTIC -- the ordinary
#      struct-ucontext-against-a-modern-glibc problem, exactly what the era
#      theory predicted. The transplant takes SIGSEGV instead, at a different
#      object count, in a different place. Two different faults, so the
#      control's failure does not explain the transplant's, and "the transplant
#      is implicated" now has a contrast behind it rather than an assertion.
#      (The era theory itself was separately falsified at glibc 2.19 -- see
#      above.)
#
#      Historical note: this used to say the control's error "was never captured
#      because the grep matched nothing". It is captured now. Until it existed,
#      is unsupported: 4.8.5 failing the same way would mean the cause is the
#      environment, not the backport. This runs it and prints it.
#
#   2. A STANDALONE REPRODUCER. Preprocess unwind-dw2.c with libgcc's own flags
#      and check the ICE survives on the .i. A self-contained file that crashes
#      the compiler can be shrunk, attached to a report, and re-tested in
#      seconds instead of after a 20-minute libgcc build.
#
#   3. A BACKTRACE. cc1 is rebuilt with -g for this -- the sandboxed arms use
#      CFLAGS=-O2 with no debug info, so gdb currently has nothing to say. The
#      frame that faults names the pass, and the pass names the fix.
#
#   4. A FLAG BISECT. -O0/-O1/-O2, -fexceptions on and off, -g on and off. If it
#      survives -O0 the fault is in an optimiser; if it needs -fexceptions the
#      unwinder path is implicated directly.
#
#   5. THE REWRITE LOG. tools/port_gcc47_api.py changed 24 call sites and 22 of
#      them are plus_constant losing its leading mode argument. Prologue and CFA
#      code is exactly where those live, so the rewritten sites in
#      aarch64.c are printed next to 4.8.5's originals.

on:
  push:
    paths:
      - '.github/workflows/gcc47-libgcc-ice.yml'
  workflow_dispatch:

# A NEW PUSH MUST NOT KILL A RUNNING BUILD. Cancelling in flight is right for a
# fast check and wrong for a multi-hour box: one push to fix a typo cancelled
# four in-flight hermetic runs and restarted them from zero. Long jobs queue
# instead. (The setting is spelled out below rather than named here, because a
# key:value written in prose is what a later grep will match first.)
concurrency:
  group: gcc47-libgcc-ice-${{ github.ref }}
  cancel-in-progress: false

env:
  GNU: 'https://mirrors.kernel.org/gnu'
  GNU2: 'https://ftpmirror.gnu.org'
  SHA474: '92e61c6dc3a0a449e62d72a38185fda550168a86702dea07125ebd3ec3996282'
  SHA485: '22fb1e7e0f68a63cee631d85b20461d1ea6bda162f03096350e38c8d427ecf23'

jobs:
  ice:
    name: 'diagnose unwind-dw2.c:1490'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl git bzip2 xz-utils gcc g++ make bison flex texinfo m4 perl \
            file binutils gdb python3

      - name: 'Fetch gcc and transplant'
        run: |
          set -eu
          F=tools/fetch-pinned.sh
          bash "$F" g474 "$HOME/.cache/veron/gcc-4.7.4.tar.bz2" "$SHA474" \
            "$GNU/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2 $GNU2/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2" "" "" | sed 's/^/  /'
          bash "$F" g485 "$HOME/.cache/veron/gcc-4.8.5.tar.bz2" "$SHA485" \
            "$GNU/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2 $GNU2/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2" "" "" | sed 's/^/  /'
          # Keep a pristine copy of the 4.8.5 backend for the diff in step 5.
          cp -a g485/gcc/config/aarch64 pristine-aarch64
          bash spikes/stage4/probes/backport-aarch64.sh g474 g485 2>&1 | tee transplant.log | tail -6
          echo "W=$PWD" >> "$GITHUB_ENV"

      - name: 'Prerequisites'
        run: |
          set -eu
          mkdir -p prefix
          curl -sSL -o gmp.tar.xz "$GNU/gmp/gmp-6.2.1.tar.xz"
          mkdir -p gmp && tar xf gmp.tar.xz -C gmp --strip-components=1
          ( cd gmp && ./configure --disable-shared --disable-assembly \
              --prefix="$W/prefix" > c.log 2>&1 && make -j"$(nproc)" > b.log 2>&1 \
            && make install > /dev/null 2>&1 ) && echo "  gmp ok"
          for p in mpfr-4.1.0 mpc-1.2.1; do
            case $p in mpfr*) u="$GNU/mpfr/$p.tar.xz" ;; mpc*) u="$GNU/mpc/$p.tar.gz" ;; esac
            curl -sSL -o "$p.tar" "$u"; mkdir -p "$p"
            tar xf "$p.tar" -C "$p" --strip-components=1 2>/dev/null
            ( cd "$p" && ./configure --disable-shared --with-gmp="$W/prefix" \
                --prefix="$W/prefix" > c.log 2>&1 && make -j"$(nproc)" > b.log 2>&1 \
              && make install > /dev/null 2>&1 ) && echo "  $p ok"
          done

      - name: 'Build BOTH compilers, with -g so gdb has something to say'
        run: |
          set -eu
          # The sandboxed arms build with CFLAGS=-O2 and no -g, which is right
          # for comparing binaries and useless for debugging one. -g here.
          for pair in "g474 c474" "g485 c485"; do
            set -- $pair
            src=$1; out=$2
            echo "  ===== $src ====="
            mkdir -p "$out" && cd "$out"
            "$W/$src/configure" CFLAGS="-g -O2" CXX="g++ -std=gnu++98" \
              --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu \
              --target=aarch64-unknown-linux-gnu \
              --prefix="$W/out-$out" --enable-languages=c \
              --disable-multilib --disable-bootstrap --disable-werror \
              --disable-libsanitizer --disable-libgomp --disable-libquadmath \
              --disable-libssp --disable-libatomic --disable-shared \
              --with-gmp="$W/prefix" --with-mpfr="$W/prefix" --with-mpc="$W/prefix" \
              > conf.log 2>&1 || { tail -20 conf.log; exit 1; }
            timeout 7200 make -j"$(nproc)" -Otarget MAKEINFO=true all-gcc > build.log 2>&1 || true
            echo "    cc1: $( [ -x gcc/cc1 ] && wc -c < gcc/cc1 || echo MISSING)"
            cd "$W"
          done

      - name: '1. libgcc UNPATCHED, both compilers -- where does each stop?'
        continue-on-error: true
        run: |
          set -u
          set +e
          # Run 1 of this spike answered the control question and the answer was
          # neither of the two I offered. VANILLA 4.8.5 also fails, at the SAME
          # object, but cleanly:
          #
          #   md-unwind-support.h:42:21: error: field 'uc' has incomplete type
          #
          # md-unwind-support.h is libgcc's build-time copy of the target's
          # md_unwind_header -- for us config/aarch64/linux-unwind.h -- which
          # declares `struct ucontext uc;` inside struct rt_sigframe. glibc 2.26
          # renamed that type to ucontext_t and dropped the struct tag, so on any
          # current system the field has no type. It is the standard blocker for
          # building any pre-9 gcc today and has nothing to do with the backport.
          #
          # The transplant copied that header into 4.7.4 as well. So both trees
          # meet the same broken declaration and 4.8.5 DIAGNOSES it while 4.7.4
          # SEGFAULTS on it. This step records both, unpatched, as the baseline.
          for t in c474 c485; do
            echo "  ===== $t ====="
            ( cd "$W/$t" && timeout 3600 make -k -j"$(nproc)" MAKEINFO=true \
                all-target-libgcc > libgcc-unpatched.log 2>&1 )
            echo "    objects : $(find "$W/$t" -path '*libgcc*' -name '*.o' | wc -l)"
            echo "    libgcc.a: $(find "$W/$t" -name libgcc.a | head -1 || echo 'NOT BUILT')"
            grep -nE 'internal compiler error|error:|Error [0-9]' "$W/$t/libgcc-unpatched.log" \
              | head -4 | sed 's/^/      /'
          done

      - name: '2. THE PAYLOAD: reproduce the ICE and take a backtrace'
        # ORDER MATTERS AND IT USED TO BE WRONG. This ran AFTER the ucontext
        # patch, which mutates the same build tree -- so when that step broke
        # md-unwind-support.h the reproduction compiled nothing, the
        # preprocessed file came out 0 lines, the ">100 lines" guard skipped the
        # flag bisect, and the backtrace this whole workflow exists for was
        # never taken. A diagnostic must run on the ORIGINAL failing tree,
        # before any attempt to get past the fault.
        continue-on-error: true
        run: |
          set -u
          set +e
          # RUN 1 RE-RAN THE COMPILE FROM $W/c474. Its flags are `-I .` and
          # `-I ../.././gcc`, both relative to the LIBGCC BUILD DIRECTORY, so
          # every downstream step died on `tconfig.h: No such file or directory`
          # -- not an ICE, a wrong cwd. The .i was 4 lines, gdb reported "No
          # stack", and the flag bisect printed ICE seven times for a cc1 it
          # could not exec. cd first.
          LG=$(find "$W/c474" -type d -path '*aarch64*/libgcc' | head -1)
          [ -n "$LG" ] || { echo "  no libgcc build dir"; exit 0; }
          echo "  libgcc build dir: $LG"
          CMD=$(grep -oE '[^ ]*xgcc [^&|]*unwind-dw2\.c' "$W/c474/libgcc-patched.log" \
                "$W/c474/libgcc-unpatched.log" 2>/dev/null | sed 's/^[^:]*://' | tail -1)
          [ -n "$CMD" ] || { echo "  no compile line found -- it may have succeeded"; exit 0; }
          cd "$LG"
          echo "  --- reproduce ---"
          eval "$CMD" 2>&1 | head -5 | sed 's/^/    /'
          # Keep the -B flags: without them xgcc cannot find cc1, which is what
          # produced run 1's "error trying to exec 'cc1'".
          DRV=$(printf '%s' "$CMD" | grep -oE '^[^ ]*xgcc( -B[^ ]*)*')
          echo "  --- preprocess, from here ---"
          # A REGEX CANNOT DO THIS AND THE OLD ONE DID NOT.
          #   sed 's/ -M[TDPF][^ ]*//g'
          # matches the FLAG `-MT` and stops, because its argument is a SEPARATE
          # token. So `-MT unwind-dw2.o` lost the flag and left the filename
          # behind, xgcc took it as an INPUT file, and the run died on
          #   xgcc: error: unwind-dw2.o: No such file or directory
          # -- 0 lines of preprocessed source, the >100 guard skipped, no
          # backtrace. Filter TOKENS instead, where "flag plus its argument" is
          # something you can actually express.
          PP=""
          skip=0
          for tok in $CMD; do
            if [ "$skip" = 1 ]; then skip=0; continue; fi
            case "$tok" in
              -o|-MT|-MF|-MQ)   skip=1;      continue ;;
              -MD|-MP|-MMD|-MG)              continue ;;
              -c)               PP="$PP -E"; continue ;;
              *)                PP="$PP $tok" ;;
            esac
          done
          eval "$PP" > "$W/unwind-dw2.i" 2>"$W/pp.err"
          echo "    $(wc -l < "$W/unwind-dw2.i") lines  (stderr: $(head -c 120 "$W/pp.err"))"

          # THE BACKTRACE IS NOT GATED ON THE PREPROCESS. It used to sit inside
          # `if [ lines -gt 100 ]`, so a broken .i took the backtrace down with
          # it -- twice. gdb needs the cc1 command line and nothing else, and
          # that comes from the ORIGINAL compile, which already reproduces the ICE.
          echo "  --- backtrace (independent of the .i above) ---"
          CC1LINE=$(eval "$CMD -v" 2>&1 | grep -oE '[^ ]*cc1 .*' | tail -1)
          if [ -n "$CC1LINE" ]; then
            # shellcheck disable=SC2086
            gdb --batch -ex run -ex 'bt 30' --args $CC1LINE 2>&1 \
              | grep -E '^#|Program received|signal|SIGSEGV' | head -34 | sed 's/^/    /'
          else
            echo "    could not extract a cc1 line -- CMD was:"
            printf '      %s\n' "$CMD" | cut -c1-200
          fi

          if [ "$(wc -l < "$W/unwind-dw2.i")" -gt 100 ]; then
            echo "  --- flag bisect on the standalone .i ---"
            for f in "-O0" "-O1" "-O2" "-O2 -fexceptions" "-O0 -fexceptions" "-O2 -g -fexceptions -fPIC"; do
              rm -f /tmp/x.s
            out=$($DRV -S $f "$W/unwind-dw2.i" -o /tmp/x.s 2>&1)
            # CLASSIFY ON THE WHOLE OUTPUT, NOT LINE 1. The previous run reported
            # "other" for all six flag sets because head -1 is
            #   unwind-dw2.c: In function 'uw_init_context_1':
            # and the "internal compiler error" line comes after it. Six ICEs read
            # as six unknowns.
            case "$out" in
              *"internal compiler error"*) r="ICE" ;;
              "")                          r="ok"  ;;
              *)                           r="other: $(printf '%s' "$out" | grep -m1 -E 'error|warning' | cut -c1-60)" ;;
            esac
              printf '    %-26s %s\n' "$f" "$r"
            done
          else
            echo "  --- flag bisect SKIPPED: .i is $(wc -l < "$W/unwind-dw2.i") lines ---"
            echo "      stderr was: $(head -c 200 "$W/pp.err")"
          fi

      - name: '3. THE FAULT SITE: what expand_builtin_frame_address touches'
        # BEFORE THE PATCH STEP, for the same reason the backtrace is: this
        # re-runs the compile under gdb, and a diagnostic must see the tree the
        # fault was found in. The source files it reads are not touched by the
        # ucontext patch either way, but the rule is worth keeping intact
        # rather than relying on that staying true.
        continue-on-error: true
        run: |
          set -u
          set +e
          # THE BACKTRACE LANDED, AND IT FALSIFIED THIS FILE'S OWN SUSPECT.
          # The header guessed __builtin_init_dwarf_reg_size_table and the
          # DWARF_FRAME_REGISTERS sizing. It is not that:
          #
          #   #0  expand_builtin_frame_address (fndecl=..., exp=<optimized out>)
          #         at gcc/builtins.c:4581
          #   #1  expand_expr_real_1 ... at gcc/expr.c:10035
          #
          # and unwind-dw2.c:1490 col 44 is
          #   void *ra = __builtin_extract_return_addr (__builtin_return_address (0));
          #                                             ^ here
          # so the path is __builtin_return_address(0) -> expand_builtin_frame_address
          # -> expand_builtin_return_addr -> RETURN_ADDR_RTX -> the BACKEND.
          #
          # The differential is now clean: with the ucontext header fixed,
          # 4.8.5 builds libgcc (1,256,134 bytes) and 4.7.4 + transplant still
          # segfaults in the same place. Same source, same header fix, one
          # compiler. This step prints the three places that path passes
          # through so the next reading is source, not inference.
          echo "  ===== 1. the fault site, 4.7.4's builtins.c ====="
          sed -n '4560,4600p' "$W/g474/gcc/builtins.c" | cat -n \
            | awk '{printf "    %d\t%s\n", $1+4559, substr($0, index($0,$2))}'
          echo
          echo "  ===== 2. expand_builtin_return_addr, same file ====="
          awk '/^expand_builtin_return_addr/,/^}/' "$W/g474/gcc/builtins.c" \
            | head -45 | sed 's/^/    /'
          echo
          echo "  ===== 3. the backend hook it calls ====="
          echo "  RETURN_ADDR_RTX / frame macros as the TRANSPLANTED aarch64.h defines them:"
          grep -nE '#define (RETURN_ADDR_RTX|INITIAL_FRAME_ADDRESS_RTX|DYNAMIC_CHAIN_ADDRESS|FRAME_ADDR_RTX|SETUP_FRAME_ADDRESSES)' \
            "$W/g474/gcc/config/aarch64/aarch64.h" | sed 's/^/    /' || echo "    none defined"
          echo
          echo "  aarch64_return_addr, as transplanted:"
          awk '/^aarch64_return_addr/,/^}/' "$W/g474/gcc/config/aarch64/aarch64.c" | sed 's/^/    /'
          echo
          echo "  ===== 4. did the transplant REWRITE that function? ====="
          # port_gcc47_api.py touched 24 call sites; if one of them is on this
          # path that is the answer, and if none are the fault is 4.7's own
          # middle-end meeting a 4.8 backend convention.
          awk '/^aarch64_return_addr/,/^}/' "$W/pristine-aarch64/aarch64.c" > /tmp/orig.txt 2>/dev/null
          awk '/^aarch64_return_addr/,/^}/' "$W/g474/gcc/config/aarch64/aarch64.c" > /tmp/now.txt
          if diff -u /tmp/orig.txt /tmp/now.txt > /tmp/d.txt 2>&1 && [ ! -s /tmp/d.txt ]; then
            echo "    UNCHANGED by the transplant -- the fault is the 4.7 middle-end"
            echo "    meeting a 4.8 backend convention, not one of our rewrites."
          else
            echo "    REWRITTEN by the transplant:"
            sed 's/^/      /' /tmp/d.txt | head -20
          fi
          echo
          echo "  ===== 5. THE HYPOTHESIS THIS RUN PRODUCED ====="
          # WHAT THE BACKTRACE ACTUALLY SHOWED. builtins.c:4581 is
          #
          #   4568   if (tem == NULL)          <- passed, so tem is NOT null
          #   4581   if (!REG_P (tem)          <- SIGSEGV dereferencing tem
          #
          # so `tem` is a NON-NULL GARBAGE POINTER, and it came from line 4564,
          # expand_builtin_return_addr -> RETURN_ADDR_RTX -> aarch64_return_addr,
          # whose body is
          #
          #   return get_hard_reg_initial_val (Pmode, LR_REGNUM);
          #
          # and which section 4 just proved the transplant never touched.
          #
          # A NON-NULL GARBAGE POINTER OUT OF A FUNCTION RETURNING rtx HAS ONE
          # CLASSIC CAUSE ON LP64: no visible declaration. C89 then assumes the
          # function returns `int`, the 64-bit rtx is TRUNCATED TO 32 BITS, and
          # the result is neither null nor valid -- it passes the null check and
          # faults on first dereference. Exactly the shape above.
          #
          # And it would be a WARNING, not an error, which is why the transplant
          # built with "0 errors, 471 warnings" and nobody read them.
          echo "  -- implicit declarations in the c474 compiler build --"
          if [ -f "$W/c474/build.log" ]; then
            grep -nE "implicit declaration" "$W/c474/build.log" | head -20 | sed 's/^/    /'
            n=$(grep -c "implicit declaration" "$W/c474/build.log" 2>/dev/null || echo 0)
            echo "    total implicit declarations: $n"
            echo "  -- any of them in the aarch64 backend? --"
            grep -nE "aarch64.*implicit declaration|implicit declaration.*aarch64" \
              "$W/c474/build.log" | head -10 | sed 's/^/    /' || echo "    none matched"
            echo "  -- specifically get_hard_reg_initial_val --"
            grep -n "get_hard_reg_initial_val" "$W/c474/build.log" | head -6 | sed 's/^/    /' \
              || echo "    not mentioned in the build log"
          else
            echo "    no c474/build.log -- the compiler build step writes it; check the path"
          fi
          echo
          echo "  -- where is get_hard_reg_initial_val DECLARED, in each tree? --"
          for g in g474 g485; do
            echo "    $g:"
            grep -rn "get_hard_reg_initial_val" "$W/$g/gcc"/*.h 2>/dev/null | head -4 | sed 's/^/      /' \
              || echo "      declared in no top-level header"
          done
          echo
          echo "  -- what does aarch64.c include? --"
          sed -n '1,60p' "$W/g474/gcc/config/aarch64/aarch64.c" | grep -n '#include' | sed 's/^/    /'
          echo
          echo "  ===== 6. richer gdb at the fault ====="
          LG=$(find "$W/c474" -type d -path '*aarch64*/libgcc' | head -1)
          CMD=$(grep -oE '[^ ]*xgcc [^&|]*unwind-dw2\.c' "$W/c474/libgcc-unpatched.log" 2>/dev/null \
                | sed 's/^[^:]*://' | tail -1)
          if [ -n "$LG" ] && [ -n "$CMD" ]; then
            cd "$LG"
            CC1LINE=$(eval "$CMD -v" 2>&1 | grep -oE '[^ ]*cc1 .*' | tail -1)
            # shellcheck disable=SC2086
            # `tem` IS THE VARIABLE THAT MATTERS -- print it, and print the
            # frame with locals. The include-search dump from the earlier `-v`
            # used to fill the head limit before anything useful appeared, so
            # filter it out rather than raising the limit.
            [ -n "$CC1LINE" ] && gdb --batch \
              -ex run -ex 'frame 0' -ex 'p tem' -ex 'p/x tem' \
              -ex 'info locals' -ex 'info args' -ex 'bt full 2' \
              --args $CC1LINE 2>&1 \
              | grep -vE '^\[|^Reading|^Downloading|^ignoring |^ *#include|^ +/|^End of search|^GNU C|^\tcompiled|^GGC|^Compiler exec|search starts here' \
              | head -45 | sed 's/^/    /'
          else
            echo "    could not rebuild the cc1 line"
          fi

      - name: '4. FALSIFIED HYPOTHESIS (kept as a way past): patch ucontext_t'
        # RUNS AFTER THE BACKTRACE, DELIBERATELY -- it mutates the build tree,
        # so everything diagnostic has already happened by here.
        continue-on-error: true
        run: |
          set -u
          set +e
          # One substitution, in one header, declared. If both trees then get
          # past unwind-dw2.o, the ICE was a 2026 glibc meeting a 2012 header
          # and the backport is exonerated. If 4.8.5 proceeds and 4.7.4 still
          # segfaults, the transplant is back in the frame and step 4 has a
          # backtrace to offer.
          for g in g474 g485; do
            h="$W/$g/libgcc/config/aarch64/linux-unwind.h"
            [ -f "$h" ] || { echo "  $g: no linux-unwind.h"; continue; }
            echo "  --- $g before ---"
            grep -n 'ucontext' "$h" | head -4 | sed 's/^/    /'
            sed -i 's/\bstruct ucontext\b/ucontext_t/g' "$h"
            echo "  --- $g after ---"
            grep -n 'ucontext' "$h" | head -4 | sed 's/^/    /'
          done
          for t in c474 c485; do
            echo "  ===== rebuilding libgcc in $t ====="
            # DO NOT DELETE md-unwind-support.h. This used to, on the belief
            # that "libgcc remakes it from the source header" -- it does not.
            # That file is written by libgcc's CONFIGURE, not by make, so
            # deleting it leaves no rule to rebuild it and the very next compile
            # dies on
            #   unwind-dw2.c:376:31: fatal error: md-unwind-support.h: No such file
            # which is exactly what destroyed the backtrace this workflow exists
            # to produce. Patch it in place if it is a copy of the source header;
            # leave it if it is an include shim, since the source patch above
            # already covers that case.
            MD=$(find "$W/$t" -name md-unwind-support.h | head -1)
            if [ -n "$MD" ] && grep -q 'struct ucontext' "$MD"; then
              sed -i 's/\bstruct ucontext\b/ucontext_t/g' "$MD"
              echo "    md-unwind-support.h is a COPY -- patched in place"
            elif [ -n "$MD" ]; then
              echo "    md-unwind-support.h is an include shim -- source patch covers it"
            else
              echo "    md-unwind-support.h absent -- configure never wrote one"
            fi
            find "$W/$t" -path '*libgcc*' -name 'unwind-dw2.o' -delete
            ( cd "$W/$t" && timeout 3600 make -k -j"$(nproc)" MAKEINFO=true \
                all-target-libgcc > libgcc-patched.log 2>&1 )
            echo "    objects : $(find "$W/$t" -path '*libgcc*' -name '*.o' | wc -l)"
            LA=$(find "$W/$t" -name libgcc.a | head -1)
            echo "    libgcc.a: ${LA:-NOT BUILT}"
            [ -n "$LA" ] && echo "    size    : $(wc -c < "$LA") bytes"
            grep -nE 'internal compiler error|error:|Error [0-9]' "$W/$t/libgcc-patched.log" \
              | head -4 | sed 's/^/      /'
          done
          echo
          echo "  VERDICT:"
          A=$(find "$W/c485" -name libgcc.a | head -1)
          B=$(find "$W/c474" -name libgcc.a | head -1)
          if [ -n "$B" ]; then
            echo "    4.7.4 + transplant now BUILDS libgcc. The ICE was the"
            echo "    ucontext rename, not the backport. The borrowed gcc-13"
            echo "    runtime can go, and stage 2 is unblocked."
          elif [ -n "$A" ]; then
            echo "    4.8.5 builds, 4.7.4 still does not. The header was A bug"
            echo "    but not THE bug -- see the backtrace below."
          else
            echo "    Neither builds. The patch was necessary but not sufficient."
          fi

      - name: '5. What the transplant rewrote near the prologue'
        continue-on-error: true
        run: |
          set -u
          set +e
          echo "  --- what port_gcc47_api.py changed ---"
          grep -iE 'plus_constant|assign_stack_temp|is_leaf|rewrote|call site' \
            "$W/transplant.log" | head -25 | sed 's/^/    /'
          echo
          echo "  --- rewritten sites in aarch64.c vs 4.8.5's originals ---"
          # 22 of the 24 rewrites are plus_constant losing its leading mode
          # argument, and prologue/CFA code is where those live.
          diff -u "$W/pristine-aarch64/aarch64.c" "$W/g474/gcc/config/aarch64/aarch64.c" \
            > "$W/aarch64-c.diff" 2>&1
          echo "    total diff lines: $(wc -l < "$W/aarch64-c.diff")"
          echo "    hunks touching prologue/CFA/frame:"
          grep -nE '^@@|prologue|cfa|frame_|RTX_FRAME_RELATED' "$W/aarch64-c.diff" \
            | grep -iE 'prologue|cfa|frame' | head -15 | sed 's/^/      /'
          echo
          echo "  --- unwind-dw2.c around the fault ---"
          sed -n '1470,1500p' "$W/g474/libgcc/unwind-dw2.c" | cat -n \
            | awk '{printf "    %d\t%s\n", $1+1469, substr($0, index($0,$2))}' | head -32

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ice-evidence
          # THESE NAMES MUST MATCH WHAT THE STEPS ACTUALLY WRITE. Three of the
          # six did not: c474/libgcc.log and c485/libgcc.log have never existed
          # (the steps write libgcc-unpatched.log and libgcc-patched.log), and
          # ice-cmd.txt is written by nothing at all. if-no-files-found: warn
          # meant they vanished quietly -- which is how the libgcc logs came to
          # be missing from every evidence bundle this workflow has produced.
          path: |
            unwind-dw2.i
            pp.err
            aarch64-c.diff
            transplant.log
            c474/libgcc-unpatched.log
            c474/libgcc-patched.log
            c485/libgcc-unpatched.log
            c485/libgcc-patched.log
            c474/build.log
            c485/build.log
          if-no-files-found: warn
