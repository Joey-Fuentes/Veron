name: gcc47-libgcc-ice

# THE ICE THAT BLOCKS THE gcc LEG
#
#   g474/libgcc/unwind-dw2.c: In function 'uw_init_context_1':
#   g474/libgcc/unwind-dw2.c:1490:44: internal compiler error: Segmentation fault
#
# 104 libgcc objects compile, then the backported compiler segfaults. No
# libgcc.a means xgcc cannot link, which means: no stage 2, no fixpoint without
# borrowing gcc 13's runtime, no g++ 4.7, and no rung above. Three separate
# results are queued behind this one file.
#
# WHAT IS ALREADY KNOWN, so this spike does not re-measure it:
#   - It is NOT tcc. The ICE reproduces identically under the host gcc 13 and
#     under our tcc -- same file, same line 1490, same column 44, after the same
#     104 objects. Two compilers agreeing on where to crash means the fault is
#     in the source they both compiled, and that source is the transplant.
#   - It is a SEGFAULT, not an assertion. gcc 4.7 is full of gcc_assert and
#     internal_error; reaching neither and taking SIGSEGV points at an
#     out-of-bounds access rather than a check the middle-end knows how to make.
#
# WHERE uw_init_context_1 SITS, and why the transplant is the suspect. That
# function is almost entirely target-driven builtins --
# __builtin_dwarf_cfa, __builtin_init_dwarf_reg_size_table,
# __builtin_unwind_init, __builtin_extract_return_addr. Expanding the second
# walks the TARGET's description of its DWARF frame registers:
# DWARF_FRAME_REGISTERS, DWARF_FRAME_REGNUM, the return-column macros. A 4.8
# backend describing its registers one way, against a 4.7 middle-end sizing an
# array another way, writes past the end of that array. That is a hypothesis
# with a named mechanism, not a diagnosis, and this spike exists to replace it
# with a backtrace.
#
# WHAT THIS RUN PRODUCES, cheapest first:
#
#   1. THE CONTROL NOBODY HAS READ. Arm A of hermetic-enumerate-host -- vanilla
#      4.8.5, native aarch64 backend, no transplant -- also failed to build
#      libgcc, at 129 objects, and its error was never captured because the grep
#      matched nothing. Until that message exists, "the transplant is at fault"
#      is unsupported: 4.8.5 failing the same way would mean the cause is the
#      environment, not the backport. This runs it and prints it.
#
#   2. A STANDALONE REPRODUCER. Preprocess unwind-dw2.c with libgcc's own flags
#      and check the ICE survives on the .i. A self-contained file that crashes
#      the compiler can be shrunk, attached to a report, and re-tested in
#      seconds instead of after a 20-minute libgcc build.
#
#   3. A BACKTRACE. cc1 is rebuilt with -g for this -- the sandboxed arms use
#      CFLAGS=-O2 with no debug info, so gdb currently has nothing to say. The
#      frame that faults names the pass, and the pass names the fix.
#
#   4. A FLAG BISECT. -O0/-O1/-O2, -fexceptions on and off, -g on and off. If it
#      survives -O0 the fault is in an optimiser; if it needs -fexceptions the
#      unwinder path is implicated directly.
#
#   5. THE REWRITE LOG. tools/port_gcc47_api.py changed 24 call sites and 22 of
#      them are plus_constant losing its leading mode argument. Prologue and CFA
#      code is exactly where those live, so the rewritten sites in
#      aarch64.c are printed next to 4.8.5's originals.

on:
  push:
    paths:
      - '.github/workflows/gcc47-libgcc-ice.yml'
  workflow_dispatch:

# A NEW PUSH MUST NOT KILL A RUNNING BUILD. Cancelling in flight is right for a
# fast check and wrong for a multi-hour box: one push to fix a typo cancelled
# four in-flight hermetic runs and restarted them from zero. Long jobs queue
# instead. (The setting is spelled out below rather than named here, because a
# key:value written in prose is what a later grep will match first.)
concurrency:
  group: gcc47-libgcc-ice-${{ github.ref }}
  cancel-in-progress: false

env:
  GNU: 'https://mirrors.kernel.org/gnu'
  GNU2: 'https://ftpmirror.gnu.org'
  SHA474: '92e61c6dc3a0a449e62d72a38185fda550168a86702dea07125ebd3ec3996282'
  SHA485: '22fb1e7e0f68a63cee631d85b20461d1ea6bda162f03096350e38c8d427ecf23'

jobs:
  ice:
    name: 'diagnose unwind-dw2.c:1490'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl git bzip2 xz-utils gcc g++ make bison flex texinfo m4 perl \
            file binutils gdb python3

      - name: 'Fetch gcc and transplant'
        run: |
          set -eu
          F=tools/fetch-pinned.sh
          bash "$F" g474 "$HOME/.cache/veron/gcc-4.7.4.tar.bz2" "$SHA474" \
            "$GNU/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2 $GNU2/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2" "" "" | sed 's/^/  /'
          bash "$F" g485 "$HOME/.cache/veron/gcc-4.8.5.tar.bz2" "$SHA485" \
            "$GNU/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2 $GNU2/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2" "" "" | sed 's/^/  /'
          # Keep a pristine copy of the 4.8.5 backend for the diff in step 5.
          cp -a g485/gcc/config/aarch64 pristine-aarch64
          bash spikes/stage4/probes/backport-aarch64.sh g474 g485 2>&1 | tee transplant.log | tail -6
          echo "W=$PWD" >> "$GITHUB_ENV"

      - name: 'Prerequisites'
        run: |
          set -eu
          mkdir -p prefix
          curl -sSL -o gmp.tar.xz "$GNU/gmp/gmp-6.2.1.tar.xz"
          mkdir -p gmp && tar xf gmp.tar.xz -C gmp --strip-components=1
          ( cd gmp && ./configure --disable-shared --disable-assembly \
              --prefix="$W/prefix" > c.log 2>&1 && make -j"$(nproc)" > b.log 2>&1 \
            && make install > /dev/null 2>&1 ) && echo "  gmp ok"
          for p in mpfr-4.1.0 mpc-1.2.1; do
            case $p in mpfr*) u="$GNU/mpfr/$p.tar.xz" ;; mpc*) u="$GNU/mpc/$p.tar.gz" ;; esac
            curl -sSL -o "$p.tar" "$u"; mkdir -p "$p"
            tar xf "$p.tar" -C "$p" --strip-components=1 2>/dev/null
            ( cd "$p" && ./configure --disable-shared --with-gmp="$W/prefix" \
                --prefix="$W/prefix" > c.log 2>&1 && make -j"$(nproc)" > b.log 2>&1 \
              && make install > /dev/null 2>&1 ) && echo "  $p ok"
          done

      - name: 'Build BOTH compilers, with -g so gdb has something to say'
        run: |
          set -eu
          # The sandboxed arms build with CFLAGS=-O2 and no -g, which is right
          # for comparing binaries and useless for debugging one. -g here.
          for pair in "g474 c474" "g485 c485"; do
            set -- $pair
            src=$1; out=$2
            echo "  ===== $src ====="
            mkdir -p "$out" && cd "$out"
            "$W/$src/configure" CFLAGS="-g -O2" CXX="g++ -std=gnu++98" \
              --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu \
              --target=aarch64-unknown-linux-gnu \
              --prefix="$W/out-$out" --enable-languages=c \
              --disable-multilib --disable-bootstrap --disable-werror \
              --disable-libsanitizer --disable-libgomp --disable-libquadmath \
              --disable-libssp --disable-libatomic --disable-shared \
              --with-gmp="$W/prefix" --with-mpfr="$W/prefix" --with-mpc="$W/prefix" \
              > conf.log 2>&1 || { tail -20 conf.log; exit 1; }
            timeout 7200 make -j"$(nproc)" -Otarget MAKEINFO=true all-gcc > build.log 2>&1 || true
            echo "    cc1: $( [ -x gcc/cc1 ] && wc -c < gcc/cc1 || echo MISSING)"
            cd "$W"
          done

      - name: '1. libgcc UNPATCHED, both compilers -- where does each stop?'
        continue-on-error: true
        run: |
          set -u
          set +e
          # Run 1 of this spike answered the control question and the answer was
          # neither of the two I offered. VANILLA 4.8.5 also fails, at the SAME
          # object, but cleanly:
          #
          #   md-unwind-support.h:42:21: error: field 'uc' has incomplete type
          #
          # md-unwind-support.h is libgcc's build-time copy of the target's
          # md_unwind_header -- for us config/aarch64/linux-unwind.h -- which
          # declares `struct ucontext uc;` inside struct rt_sigframe. glibc 2.26
          # renamed that type to ucontext_t and dropped the struct tag, so on any
          # current system the field has no type. It is the standard blocker for
          # building any pre-9 gcc today and has nothing to do with the backport.
          #
          # The transplant copied that header into 4.7.4 as well. So both trees
          # meet the same broken declaration and 4.8.5 DIAGNOSES it while 4.7.4
          # SEGFAULTS on it. This step records both, unpatched, as the baseline.
          for t in c474 c485; do
            echo "  ===== $t ====="
            ( cd "$W/$t" && timeout 3600 make -k -j"$(nproc)" MAKEINFO=true \
                all-target-libgcc > libgcc-unpatched.log 2>&1 )
            echo "    objects : $(find "$W/$t" -path '*libgcc*' -name '*.o' | wc -l)"
            echo "    libgcc.a: $(find "$W/$t" -name libgcc.a | head -1 || echo 'NOT BUILT')"
            grep -nE 'internal compiler error|error:|Error [0-9]' "$W/$t/libgcc-unpatched.log" \
              | head -4 | sed 's/^/      /'
          done

      - name: '2. THE HYPOTHESIS: ucontext_t. Patch both trees and rebuild.'
        continue-on-error: true
        run: |
          set -u
          set +e
          # One substitution, in one header, declared. If both trees then get
          # past unwind-dw2.o, the ICE was a 2026 glibc meeting a 2012 header
          # and the backport is exonerated. If 4.8.5 proceeds and 4.7.4 still
          # segfaults, the transplant is back in the frame and step 4 has a
          # backtrace to offer.
          for g in g474 g485; do
            h="$W/$g/libgcc/config/aarch64/linux-unwind.h"
            [ -f "$h" ] || { echo "  $g: no linux-unwind.h"; continue; }
            echo "  --- $g before ---"
            grep -n 'ucontext' "$h" | head -4 | sed 's/^/    /'
            sed -i 's/\bstruct ucontext\b/ucontext_t/g' "$h"
            echo "  --- $g after ---"
            grep -n 'ucontext' "$h" | head -4 | sed 's/^/    /'
          done
          for t in c474 c485; do
            echo "  ===== rebuilding libgcc in $t ====="
            # The generated copy is stale; libgcc remakes it from the source
            # header, but delete it so there is no doubt which one was used.
            find "$W/$t" -name md-unwind-support.h -delete
            find "$W/$t" -path '*libgcc*' -name 'unwind-dw2.o' -delete
            ( cd "$W/$t" && timeout 3600 make -k -j"$(nproc)" MAKEINFO=true \
                all-target-libgcc > libgcc-patched.log 2>&1 )
            echo "    objects : $(find "$W/$t" -path '*libgcc*' -name '*.o' | wc -l)"
            LA=$(find "$W/$t" -name libgcc.a | head -1)
            echo "    libgcc.a: ${LA:-NOT BUILT}"
            [ -n "$LA" ] && echo "    size    : $(wc -c < "$LA") bytes"
            grep -nE 'internal compiler error|error:|Error [0-9]' "$W/$t/libgcc-patched.log" \
              | head -4 | sed 's/^/      /'
          done
          echo
          echo "  VERDICT:"
          A=$(find "$W/c485" -name libgcc.a | head -1)
          B=$(find "$W/c474" -name libgcc.a | head -1)
          if [ -n "$B" ]; then
            echo "    4.7.4 + transplant now BUILDS libgcc. The ICE was the"
            echo "    ucontext rename, not the backport. The borrowed gcc-13"
            echo "    runtime can go, and stage 2 is unblocked."
          elif [ -n "$A" ]; then
            echo "    4.8.5 builds, 4.7.4 still does not. The header was A bug"
            echo "    but not THE bug -- see the backtrace below."
          else
            echo "    Neither builds. The patch was necessary but not sufficient."
          fi

      - name: '3. If it still fails: reproduce it from the RIGHT directory'
        continue-on-error: true
        run: |
          set -u
          set +e
          # RUN 1 RE-RAN THE COMPILE FROM $W/c474. Its flags are `-I .` and
          # `-I ../.././gcc`, both relative to the LIBGCC BUILD DIRECTORY, so
          # every downstream step died on `tconfig.h: No such file or directory`
          # -- not an ICE, a wrong cwd. The .i was 4 lines, gdb reported "No
          # stack", and the flag bisect printed ICE seven times for a cc1 it
          # could not exec. cd first.
          LG=$(find "$W/c474" -type d -path '*aarch64*/libgcc' | head -1)
          [ -n "$LG" ] || { echo "  no libgcc build dir"; exit 0; }
          echo "  libgcc build dir: $LG"
          CMD=$(grep -oE '[^ ]*xgcc [^&|]*unwind-dw2\.c' "$W/c474/libgcc-patched.log" \
                "$W/c474/libgcc-unpatched.log" 2>/dev/null | sed 's/^[^:]*://' | tail -1)
          [ -n "$CMD" ] || { echo "  no compile line found -- it may have succeeded"; exit 0; }
          cd "$LG"
          echo "  --- reproduce ---"
          eval "$CMD" 2>&1 | head -5 | sed 's/^/    /'
          # Keep the -B flags: without them xgcc cannot find cc1, which is what
          # produced run 1's "error trying to exec 'cc1'".
          DRV=$(printf '%s' "$CMD" | grep -oE '^[^ ]*xgcc( -B[^ ]*)*')
          echo "  --- preprocess, from here ---"
          PP=$(printf '%s' "$CMD" | sed 's/ -o [^ ]*//; s/ -c / -E /; s/ -M[TDPF][^ ]*//g; s/ [^ ]*\.dep//')
          eval "$PP" > "$W/unwind-dw2.i" 2>"$W/pp.err"
          echo "    $(wc -l < "$W/unwind-dw2.i") lines  (stderr: $(head -c 120 "$W/pp.err"))"
          if [ "$(wc -l < "$W/unwind-dw2.i")" -gt 100 ]; then
            echo "  --- flag bisect on the standalone .i ---"
            for f in "-O0" "-O1" "-O2" "-O2 -fexceptions" "-O0 -fexceptions" "-O2 -g -fexceptions -fPIC"; do
              rm -f /tmp/x.s
              out=$($DRV -S $f "$W/unwind-dw2.i" -o /tmp/x.s 2>&1 | head -1)
              # Classify on the MESSAGE. Run 1 called a missing cc1 an ICE
              # because it only checked whether the output file existed.
              case "$out" in
                *"internal compiler error"*) r="ICE" ;;
                "")                          r="ok"  ;;
                *)                           r="other: $(printf '%s' "$out" | cut -c1-60)" ;;
              esac
              printf '    %-26s %s\n' "$f" "$r"
            done
            echo "  --- backtrace ---"
            CC1LINE=$(eval "$CMD -v" 2>&1 | grep -oE '[^ ]*cc1 .*' | tail -1)
            # shellcheck disable=SC2086
            [ -n "$CC1LINE" ] && gdb --batch -ex run -ex 'bt 25' --args $CC1LINE 2>&1 \
              | grep -E '^#|Program received|signal' | head -30 | sed 's/^/    /'
          fi

      - name: '5. What the transplant rewrote near the prologue'
        continue-on-error: true
        run: |
          set -u
          set +e
          echo "  --- what port_gcc47_api.py changed ---"
          grep -iE 'plus_constant|assign_stack_temp|is_leaf|rewrote|call site' \
            "$W/transplant.log" | head -25 | sed 's/^/    /'
          echo
          echo "  --- rewritten sites in aarch64.c vs 4.8.5's originals ---"
          # 22 of the 24 rewrites are plus_constant losing its leading mode
          # argument, and prologue/CFA code is where those live.
          diff -u "$W/pristine-aarch64/aarch64.c" "$W/g474/gcc/config/aarch64/aarch64.c" \
            > "$W/aarch64-c.diff" 2>&1
          echo "    total diff lines: $(wc -l < "$W/aarch64-c.diff")"
          echo "    hunks touching prologue/CFA/frame:"
          grep -nE '^@@|prologue|cfa|frame_|RTX_FRAME_RELATED' "$W/aarch64-c.diff" \
            | grep -iE 'prologue|cfa|frame' | head -15 | sed 's/^/      /'
          echo
          echo "  --- unwind-dw2.c around the fault ---"
          sed -n '1470,1500p' "$W/g474/libgcc/unwind-dw2.c" | cat -n \
            | awk '{printf "    %d\t%s\n", $1+1469, substr($0, index($0,$2))}' | head -32

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ice-evidence
          path: |
            unwind-dw2.i
            ice-cmd.txt
            aarch64-c.diff
            transplant.log
            c474/libgcc.log
            c485/libgcc.log
          if-no-files-found: warn
