name: llvm-timing

# HOW LONG DOES LLVM TAKE? The second half of the same question wpe-timing
# asks.
#
# LLVM is now certain rather than optional: llvmpipe is the only usable
# software rasterizer, and without it a machine with no supported GPU cannot
# run the browser at all. STAGE5.md predicted this -- "llvm arrives through
# mesa, not by choice" -- and the escape hatch it named (accept software
# rendering without llvmpipe) is closed, because softpipe is upstream's own
# "slow but accurate, mostly useful for testing".
#
# So the remaining question is only whether it FITS. LLVM and WPE are the two
# multi-hour builds in stage 5, and if their sum exceeds a hosted runner then
# self-hosted CI stops being optional -- a bigger commitment than any package
# in the set.
#
# DELIBERATELY NOT HERMETIC, same as wpe-timing: apt supplies the toolchain,
# LLVM comes from a pinned tarball, and the answer being measured is compile
# time. Nothing here enters the ladder.
#
# WHAT IS BUILT IS WHAT MESA NEEDS, NOT ALL OF LLVM. llvmpipe wants the core
# libraries and the native target only -- no clang, no lld, no lldb, no
# compiler-rt, and one target rather than the two dozen LLVM builds by
# default. Building all of LLVM would measure a number nobody needs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'LLVM version'
        required: false
        default: '22.1.8'
      targets:
        description: 'LLVM_TARGETS_TO_BUILD (native only is what llvmpipe needs)'
        required: false
        default: 'AArch64'
      build_type:
        description: 'CMake build type'
        type: choice
        options: [Release, MinSizeRel, RelWithDebInfo]
        default: Release
      full:
        description: 'Build ALL targets and projects (the pessimistic number)'
        type: boolean
        default: false
      jobs:
        description: 'Parallel jobs (blank = nproc)'
        required: false
        default: ''

concurrency:
  group: llvm-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - name: 'What this runner is'
        run: |
          set -eu
          echo "  arch      $(uname -m)"
          echo "  cpus      $(nproc)"
          echo "  memory    $(awk '/MemTotal/{printf "%.1f GB\n", $2/1048576}' /proc/meminfo)"
          echo "  disk free $(df -h --output=avail / | tail -1 | tr -d ' ')"
          echo "  gcc       $(gcc --version | head -1)"
          echo ""
          echo "  MEMORY MATTERS MORE HERE THAN FOR WPE. LLVM's linker steps are"
          echo "  memory-hungry, and a parallel build that exhausts RAM dies with"
          echo "  a compiler 'Killed' rather than an out-of-memory message. If"
          echo "  this fails, check for Killed before assuming it is too slow."

      - name: 'Toolchain from apt (NOT hermetic -- see the header)'
        run: |
          set -eu
          sudo apt-get update -qq
          need() {
            for p in "$@"; do
              if apt-cache show "$p" >/dev/null 2>&1; then echo "$p"
              else echo "  NOT AVAILABLE: $p" >&2; fi
            done
          }
          # One wrong name must not cost the run -- the wpe-timing lesson.
          sudo apt-get install -y -qq $(need \
            build-essential cmake ninja-build python3 pkg-config \
            zlib1g-dev libzstd-dev libxml2-dev)
          echo "  apt done"

      # ONE SOURCE ARCHIVE, THE ONE UPSTREAM DOCUMENTS.
      #
      # This used to fetch the SPLIT component tarballs -- llvm-$V.src.tar.xz
      # plus cmake-$V.src.tar.xz -- and the second was fetched inside an
      # `if curl ... 2>/dev/null` that swallowed its own failure. A missing
      # companion does not look like a missing download; it looks like an
      # LLVM build error, because llvm/CMakeLists.txt includes ../cmake.
      #
      # LLVM's release page names exactly one source archive:
      #
      #   "To get all the llvm-project source code for this release, choose
      #    llvm-project-<V>.src.tar.xz"
      #
      # It is self-contained -- cmake/ is inside it -- so the companion
      # problem stops existing. It is also what BLFS builds, which puts a
      # second packager on the same route. ~160 MB against 77 MB is the cost.
      #
      # NOT the /archive/refs/tags/ tarball. GitHub generates those on demand
      # and does not guarantee their bytes: on 2023-01-30 a Git 2.38 upgrade
      # changed the compressor and every checksum for every existing tag moved
      # at once. Their own guidance afterwards was to use release ASSETS if
      # you depend on stable hashes. The auto-archive also carries no .sig and
      # downloads named after the tag rather than the project.
      #
      # NOT LLVM-$V-Linux-ARM64.tar.xz either. That is a PREBUILT BINARY
      # toolchain -- upstream says so plainly, "contains LLVM binaries for
      # Arm64 Linux". It would put an opaque vendor binary underneath mesa,
      # and unlike linux-firmware, LLVM can be built from source.
      #
      # THE DIGEST BELOW IS EMPTY AND THAT IS HONEST. Runs 83733772717,
      # 83734996374 and 83923847938 each measured
      # d9022ddadb40a15015f6b27e6549a7144704ded8828ba036ffe4b8165707de21
      # for the SPLIT llvm-21.1.8.src.tar.xz. That is a different artifact
      # from this one, so it does not carry over. The first run after this
      # change measures the monorepo and prints it; add a case arm then.
      - name: 'Fetch the pinned LLVM source, and verify it'
        run: |
          set -eu
          V='${{ inputs.version }}'
          BASE="https://github.com/llvm/llvm-project/releases/download/llvmorg-$V"
          TARBALL="llvm-project-$V.src.tar.xz"

          # PINS FOR THIS ARTIFACT. These are the digests GitHub publishes
          # for the uploaded release assets -- REPORTED, not measured here,
          # which is exactly why they are checked on every run rather than
          # trusted. A wrong value fails this step immediately instead of
          # building something nobody described.
          #
          # They are for llvm-project-$V.src.tar.xz. The d9022dda... digest
          # this workflow printed on runs 83733772717 / 83734996374 /
          # 83923847938 was for the SPLIT llvm-$V.src.tar.xz at 21.1.8 and
          # does not carry over -- different artifact, different bytes.
          case "$V" in
            22.1.8)
              WANT=922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888
              WANT_SIG=052eeebd58a2df67db066c6defb3ae67572bdf098d3064b8ed111b5385d45910
              ;;
            *) WANT=''; WANT_SIG='' ;;
          esac

          echo "  $BASE/$TARBALL"
          curl -4 -fL --connect-timeout 20 --retry 3 -o src.tar.xz \
            "$BASE/$TARBALL"
          GOT=$(sha256sum src.tar.xz | cut -d' ' -f1)
          echo "  bytes  $(stat -c%s src.tar.xz)"
          echo "  sha256 $GOT"
          if [ -n "$WANT" ]; then
            [ "$GOT" = "$WANT" ] || {
              echo "LLVM SHA256 MISMATCH"
              echo "  want $WANT"
              echo "  got  $GOT"
              exit 1
            }
            echo "  VERIFIED against the pin"
          else
            echo ""
            echo "  NO PIN FOR $V YET. Add a case arm above with the sha256"
            echo "  printed here before treating this run as reproducible."
            echo "  A digest that is printed and never compared is a"
            echo "  measurement nobody is using -- which is how llvm ended up"
            echo "  the one package in the set with no pin anywhere."
          fi

          # THE SIGNATURE EXISTS, WHICH IS RARE HERE. Most pins in this set
          # record `signature = none`. LLVM publishes a detached GPG .sig for
          # every release asset, with keys at releases.llvm.org/release-keys.asc.
          #
          # PINNING THE .sig IS NOT VERIFYING THE SIGNATURE, and the difference
          # is worth stating rather than blurring. Checking its sha256 fixes
          # WHICH signature file we mean; `gpg --verify` against the published
          # keys is a separate act and belongs in the recipe's airlock, where
          # fetching is allowed and where the keyring can be pinned too.
          echo "  $BASE/$TARBALL.sig"
          curl -4 -fL --connect-timeout 20 --retry 3 -o src.tar.xz.sig \
            "$BASE/$TARBALL.sig" || { echo "SIGNATURE NOT FETCHED"; exit 1; }
          GOTS=$(sha256sum src.tar.xz.sig | cut -d' ' -f1)
          echo "  sig sha256 $GOTS"
          if [ -n "$WANT_SIG" ]; then
            [ "$GOTS" = "$WANT_SIG" ] || {
              echo "SIGNATURE SHA256 MISMATCH"; echo "  got $GOTS"; exit 1; }
            echo "  signature file VERIFIED against the pin"
          fi

          tar xf src.tar.xz
          mv "llvm-project-$V.src" llvm-project-src
          echo "  unpacked -> llvm-project-src (cmake/ included, no companion needed)"

      - name: 'Configure'
        run: |
          set -eu
          S=$(date +%s)
          if [ "${{ inputs.full }}" = "true" ]; then
            EXTRA="-DLLVM_TARGETS_TO_BUILD=all"
          else
            # WHAT MESA ACTUALLY NEEDS. llvmpipe uses the core libraries and
            # the native target; everything below is off because it is not on
            # mesa's path, and leaving it on would measure a build nobody in
            # this project would run.
            EXTRA="-DLLVM_TARGETS_TO_BUILD=${{ inputs.targets }}"
          fi
          # -S points INSIDE the monorepo: llvm/ is the project root and
          # it includes ../cmake from the same tree.
          cmake -S llvm-project-src/llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DLLVM_ENABLE_PROJECTS= \
            -DLLVM_ENABLE_RUNTIMES= \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            $EXTRA 2>&1 | tee configure.log
          RC=${PIPESTATUS[0]}
          echo "CONFIGURE_SECONDS=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"
          if [ "$RC" != 0 ]; then
            echo ""
            echo "  CONFIGURE FAILED -- nothing was measured. The cause:"
            grep -B2 -A6 "CMake Error" configure.log | head -30
            exit 1
          fi

      - name: 'Build, with progress'
        run: |
          set -eu
          J='${{ inputs.jobs }}'; [ -n "$J" ] || J=$(nproc)
          echo "  ninja -j$J"
          S=$(date +%s)
          ( while true; do sleep 300
              echo "  [tick $(( ($(date +%s) - S) / 60 ))m] disk $(df -h --output=avail / | tail -1 | tr -d ' ')  mem $(awk '/MemAvailable/{printf "%.1fG", $2/1048576}' /proc/meminfo)"
            done ) &
          TICKER=$!
          set +e
          ninja -C build -j"$J" 2>&1 | tail -c 2000000 > build.log
          RC=${PIPESTATUS[0]}
          set -e
          kill $TICKER 2>/dev/null || true
          echo "BUILD_SECONDS=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"
          echo "BUILD_RC=$RC" >> "$GITHUB_ENV"
          echo "  ninja rc=$RC"
          tail -25 build.log

      # DOES THIS BUILD ACTUALLY SATISFY MESA? The configure spike showed mesa
      # asking for twelve LLVM modules by name:
      #   bitwriter core engine executionengine instcombine mcdisassembler
      #   mcjit native scalaropts transformutils coroutines lto
      # Ten are core libraries or come with LLVM_TARGETS_TO_BUILD=AArch64.
      # Two are worth checking rather than reasoning about: mcdisassembler
      # needs AArch64Disassembler, and lto needs LLVMLTO -- and this build sets
      # LLVM_ENABLE_PROJECTS to nothing.
      #
      # If either is missing, LLVM has to grow and the 27-minute number moves,
      # which is exactly the kind of thing that should be found here and not
      # three batches later when mesa refuses to configure.
      - name: 'Does this LLVM satisfy mesa?'
        if: always()
        run: |
          set -eu
          LC=$(find build/bin -name llvm-config -type f 2>/dev/null | head -1)
          [ -n "$LC" ] || { echo "  no llvm-config -- the build did not get that far"; exit 0; }
          echo "  llvm-config: $LC"
          echo "  version:     $("$LC" --version)"
          echo ""
          HAVE=$("$LC" --components)
          fail=0
          for m in bitwriter core engine executionengine instcombine                    mcdisassembler mcjit native scalaropts transformutils                    coroutines lto; do
            case " $HAVE " in
              *" $m "*) echo "  ok       $m" ;;
              *) echo "  MISSING  $m"; fail=1 ;;
            esac
          done
          echo ""
          # The real test: ask llvm-config to resolve the exact set mesa asks
          # for. A component can be listed and still fail to link.
          if "$LC" --libs bitwriter core engine executionengine instcombine                    mcdisassembler mcjit native scalaropts transformutils                    coroutines lto > /dev/null 2>&1; then
            echo "  ok       llvm-config resolves mesa's full module list"
          else
            echo "  FAILED   llvm-config cannot resolve mesa's module list:"
            "$LC" --libs bitwriter core engine executionengine instcombine                   mcdisassembler mcjit native scalaropts transformutils                   coroutines lto 2>&1 | head -5
            fail=1
          fi
          echo ""
          if [ "$fail" = 0 ]; then
            echo "  THE SCOPED BUILD IS ENOUGH FOR MESA. core + AArch64, no"
            echo "  clang, no lld, no lldb -- and the 27-minute number stands."
          else
            echo "  THIS BUILD IS NOT ENOUGH FOR MESA. Whatever is missing has"
            echo "  to be enabled, and the build time will move with it."
            exit 1
          fi

      - name: 'THE NUMBERS'
        if: always()
        run: |
          set -eu
          echo "  =============================================="
          echo "  runner        ubuntu-24.04-arm, $(nproc) cpus"
          echo "  llvm          ${{ inputs.version }}"
          echo "  targets       ${{ inputs.targets }}${{ inputs.full && ' (FULL: all targets)' || '' }}"
          echo "  build type    ${{ inputs.build_type }}"
          echo "  configure     ${CONFIGURE_SECONDS:-?} s"
          echo "  build         $(( ${BUILD_SECONDS:-0} / 60 )) min  (rc=${BUILD_RC:-?})"
          echo "  build tree    $(du -sh build 2>/dev/null | cut -f1)"
          echo "  =============================================="
          echo ""
          if [ "${BUILD_RC:-1}" = 0 ]; then
            echo "  ADD THIS TO wpe-timing's NUMBER. Together they are the two"
            echo "  multi-hour builds in stage 5, and their sum against 6 hours"
            echo "  is what decides whether hosted runners suffice."
          else
            grep -iE "no space|ENOSPC|Killed|virtual memory exhausted|internal compiler" build.log | head -5 || true
            echo "  'Killed' means MEMORY, not time -- retry with fewer jobs."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm-timing
          path: |
            configure.log
            build.log
          retention-days: 30
