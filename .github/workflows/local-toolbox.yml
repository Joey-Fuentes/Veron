# PACK THE TWO THINGS A SANDBOX CANNOT FETCH FOR ITSELF.
#
# The assistant's sandbox has no network at all -- every host returns 403 with
# `x-deny-reason: host_not_allowed` -- and no qemu. That is why every stage-3
# diagnosis had to go through a CI round: micro-c could be built locally only
# after M2-Planet was vendored at the pin, and aarch64 binaries still cannot be
# RUN there at all.
#
# This job produces one artifact containing:
#
#   qemu-aarch64-static     so aarch64 binaries can be executed on an x86_64
#                           host by invoking the emulator directly -- no
#                           binfmt_misc registration, no root
#   tcc-<pin>-arm64.tar.gz  the pinned tcc tree, arm64 patches applied and
#                           ./configure already run, so the GENERATED files
#                           (config.h, tccdefs_.h) are present
#
# With both, `ARCH=aarch64 difftest.sh` runs locally in about a second per
# case, and micro-c can compile libtcc.c and the result can actually be run --
# which is the loop this repository has been paying three minutes a round for.
#
# RUN IT WITH workflow_dispatch. It is a utility, not part of any build, and
# nothing else in the tree depends on it.
name: local toolbox

on:
  workflow_dispatch:

permissions:
  contents: write        # `gh release upload` publishes the toolbox

jobs:
  pack:
    # x86_64 ON PURPOSE, and asserted below. On an arm64 runner
    # qemu-aarch64-static is an aarch64 binary that emulates aarch64, which is
    # useless to an x86_64 host. This is the one job in the repo that must NOT
    # run on ubuntu-24.04-arm.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TCC_SHA: 5ec0e6f84b47ebd8c269b581712666313f5edaef
      # PINNED, AND MIRRORED LIKE EVERY OTHER SOURCE. Until now the emulator
      # came from `apt-get install qemu-user-static` and there was no system
      # emulator at all -- so the one tool used to check that this chain's
      # output runs was the one thing in the repository with no provenance.
      #
      # ONCE STAGE 5 BOOTS, THIS BECOMES A RECIPE. qemu's build dependencies
      # -- glib, pixman, zlib, meson, ninja, python -- are ALREADY stage-5
      # packages, all six built and tested. At that point qemu is compiled by
      # the compiler this chain produced, against libraries this chain built,
      # and the emulator traces to stage 0 like everything else.
      QEMU_VER: '11.0.3'
      # PENDING UNTIL A RUN MEASURES IT. This value is not guessable and must
      # never be typed from memory -- two recipes in this repository already
      # carry a comment about a digest that was invented rather than read, and
      # a wrong one here would be a pinned lie about the only tool used to
      # check that the chain's output runs.
      #
      # MEASURED AND PINNED. Both values came from a run that fetched the
      # files and printed what it saw; neither was typed from memory.
      #
      # An earlier pin here was qemu 9.2.4 with a correctly measured digest --
      # measured honestly, and still the wrong pin, because the VERSION was
      # recalled rather than read from download.qemu.org. PENDING catches an
      # invented digest and cannot catch an invented version.
      QEMU_SHA256: 'da5fcffc32762820568b828ed430a728864d34d50b6d2f30358597760cbb0523'
      # The signature's own digest, so it can be located and checked later
      # rather than merely known to exist. llvm's pin carries the same.
      QEMU_SIG_SHA256: '719f32c491ee724629f7d5918a6ff04ddc115d92a597b504cc4f12191e4a5e77'
      # THE SAME TARBALL stage5-isolate ALREADY PINS, mirrored with two
      # routes. Built here as well so the sandbox ships beside the emulator
      # rather than existing only inside a runner that is then destroyed.
      BWRAP_VER: '0.11.0'
      BWRAP_SHA256: '988fd6b232dafa04b8b8198723efeaccdb3c6aa9c1c7936219d5791a8b7a8646'
    steps:
      - uses: actions/checkout@v5

      - name: 'ASSERT: the runner is x86_64'
        run: |
          set -eu
          arch=$(uname -m)
          echo "  runner arch: $arch"
          if [ "$arch" != "x86_64" ]; then
            echo "FAIL: this job must run on an x86_64 runner."
            echo "      A qemu-aarch64-static built for aarch64 emulates aarch64"
            echo "      on aarch64 -- it cannot help an x86_64 sandbox."
            exit 1
          fi

      - name: Install
        run: |
          set -eu
          sudo apt-get update -qq
          # qemu-user-static IS GONE FROM THIS LIST. It used to be copied out
          # of /usr/bin, which put an opaque host binary in an artifact this
          # repository ships -- below the bar TRUST-BOUNDARY.md sets for
          # tier 2, where busybox sits: "the source is ours to choose and
          # PINNED; the compiler that turned it into a binary is the
          # runner's." An apt binary meets neither half.
          #
          # What remains from apt is qemu's own build surface. That is the
          # same position busybox is in, and it is stated rather than implied.
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu git \
            meson ninja-build python3-venv pkg-config \
            libglib2.0-dev libpixman-1-dev zlib1g-dev \
            libglib2.0-dev-bin \
            libmount-dev libblkid-dev libselinux1-dev \
            libpcre2-dev libffi-dev >/dev/null

      - name: 'Fetch qemu at its pin, through the mirror'
        run: |
          set -eu
          mkdir -p dl
          url="https://download.qemu.org/qemu-${QEMU_VER}.tar.xz"
          if [ "$QEMU_SHA256" = PENDING ]; then
            # MEASURE, REPORT, REFUSE. Building from an unverified tarball
            # would produce a working emulator with no provenance, which is
            # the state this change exists to end.
            curl -fsSL -o "dl/qemu-${QEMU_VER}.tar.xz" "$url"
            got=$(sha256sum "dl/qemu-${QEMU_VER}.tar.xz" | cut -d' ' -f1)
            # THE SIGNATURE IS PUBLISHED, SO ITS DIGEST IS RECORDED TOO.
            # qemu signs its releases; llvm's pin carries the .sig digest
            # beside the tarball's for the same reason -- a signature nobody
            # can locate later is a signature nobody checked.
            sig=""
            if curl -fsSL -o "dl/qemu-${QEMU_VER}.tar.xz.sig" "$url.sig" 2>/dev/null; then
              sig=$(sha256sum "dl/qemu-${QEMU_VER}.tar.xz.sig" | cut -d' ' -f1)
            fi
            echo ""
            echo "  qemu ${QEMU_VER} sha256, measured by this run:"
            echo "    $got"
            [ -n "$sig" ] && echo "  its .sig sha256: $sig"
            echo ""
            echo "  Put it in QEMU_SHA256 above, add it to sources/MIRRORS.tsv,"
            echo "  and dispatch again. Refusing to build from an unverified"
            echo "  tarball."
            exit 1
          fi
          python3 tools/mirror.py fetch \
            "$QEMU_SHA256" "qemu-${QEMU_VER}.tar.xz" \
            --url "$url" --dest dl
          # THE SIGNATURE IS FETCHED AND ITS DIGEST CHECKED, WHICH IS NOT THE
          # SAME AS VERIFYING IT. Verifying would need qemu's signing key in
          # the trust boundary, and that is a decision this job does not make.
          # What this does is ensure the .sig we can hand an auditor is the
          # one that was published beside this tarball -- llvm-timing.yml
          # printed a digest for three runs and nothing compared it, which is
          # how llvm stayed unpinned.
          if curl -fsSL -o "dl/qemu-${QEMU_VER}.tar.xz.sig" "$url.sig"; then
            got=$(sha256sum "dl/qemu-${QEMU_VER}.tar.xz.sig" | cut -d' ' -f1)
            if [ "$got" = "$QEMU_SIG_SHA256" ]; then
              echo "  signature digest matches the pin"
            else
              echo "  SIGNATURE DIGEST MISMATCH"
              echo "    wanted $QEMU_SIG_SHA256"
              echo "    got    $got"
              exit 1
            fi
          fi
          tar -xf "dl/qemu-${QEMU_VER}.tar.xz"

      - name: 'Build qemu from that source: system AND user, one tree'
        run: |
          set -eu
          mkdir -p out
          cd "qemu-${QEMU_VER}"
          # ONE SOURCE, BOTH TARGETS. aarch64-softmmu is what boots an Image;
          # aarch64-linux-user is what runs a binary. They were previously two
          # different provenances -- one apt package and nothing at all -- and
          # are now one pinned tarball.
          #
          # --static IS ATTEMPTED AND NOT REQUIRED. A static qemu is one file
          # that runs anywhere, which is the whole point of a toolbox
          # artifact; but Ubuntu ships no static glib, so it may not link.
          # Falling back to dynamic and packing the libraries alongside is
          # worse for portability and still better than an apt binary, so the
          # fallback is taken rather than the job failed.
          COMMON="--target-list=aarch64-softmmu,aarch64-linux-user
                  --disable-docs --disable-gtk --disable-sdl --disable-vnc
                  --disable-spice --disable-curses --disable-opengl
                  --disable-virglrenderer --disable-libssh --disable-bzip2
                  --disable-snappy --disable-lzo --disable-curl
                  --disable-guest-agent --disable-tools --disable-capstone
                  --disable-vde --disable-brlapi --disable-tpm"
          # THE FALLBACK IS ON THE WHOLE BUILD, NOT ON configure. The first
          # attempt fell back only when `./configure --static` failed -- and
          # static configure SUCCEEDED, then the link died three thousand
          # targets later:
          #
          #   /usr/bin/ld: cannot find -lmount
          #
          # glib's static build pulls libmount, libblkid, libselinux, pcre2
          # and libffi, and a missing .a for any of them surfaces at link
          # time, not at configure time. A fallback that cannot see the
          # failure it exists for is decoration.
          attempt() {
            rm -rf build
            ./configure $1 $COMMON > "cfg-$2.log" 2>&1 \
              && ninja -C build > "build-$2.log" 2>&1
          }
          if attempt --static static; then
            echo "  static: configured and linked"
            LINK=static
          else
            echo "  static build FAILED -- falling back to dynamic"
            # GREP THE WHOLE LOG, NOT ITS TAIL. `tail -6 | grep` printed
            # NOTHING on the run that mattered: a link error sits thousands
            # of lines above the end of a 3189-target ninja log, so the six
            # last lines are ninja's summary and contain no error at all.
            # The step reported "static build FAILED" and said nothing about
            # why, which is the failure-that-reports-nothing shape this
            # project keeps finding in its own tooling.
            grep -hiE "cannot find -l|undefined reference|error:" \
              cfg-static.log build-static.log 2>/dev/null \
              | sort -u | head -12 | sed 's/^/    /' \
              || echo "    (no recognisable error line -- see the artifact)"
            cp cfg-static.log build-static.log ../out/ 2>/dev/null || true
            attempt "" dynamic || {
              echo "  dynamic build FAILED too"
              tail -20 build-dynamic.log 2>/dev/null | sed 's/^/    /'
              exit 1
            }
            LINK=dynamic
          fi
          cd ..
          cp "qemu-${QEMU_VER}/build/qemu-system-aarch64" out/
          cp "qemu-${QEMU_VER}/build/qemu-aarch64" out/qemu-aarch64-static
          # pc-bios IS NOT OPTIONAL, AND A BINARY WITHOUT IT LOOKS BROKEN.
          # qemu-system loads firmware and option ROMs from its data
          # directory at RUN time; packing only the executable produced
          #
          #   qemu-system-aarch64: failed to find romfile "efi-virtio.rom"
          #
          # which reads like a qemu bug and is a packaging omission. The
          # emulator is invoked with -L pointing here.
          # build/pc-bios, NOT THE SOURCE pc-bios. qemu ships its firmware
          # COMPRESSED -- edk2-aarch64-code.fd.bz2 -- and decompresses it
          # during the build; those "Generating pc-bios/edk2-*.fd with a
          # custom command" lines in the ninja log are exactly that. Copying
          # the source directory packs the .bz2 and qemu then cannot find the
          # firmware, which is how a boot reported `efi: UEFI not found` with
          # the file apparently right there.
          #
          # Both are merged: the build tree has the decompressed firmware, the
          # source tree has everything the build did not touch.
          cp -r "qemu-${QEMU_VER}/pc-bios" out/pc-bios
          cp -f "qemu-${QEMU_VER}"/build/pc-bios/*.fd out/pc-bios/ 2>/dev/null || true
          cp -f "qemu-${QEMU_VER}"/build/pc-bios/*.bin out/pc-bios/ 2>/dev/null || true
          find out/pc-bios -name '*.dtb' -delete 2>/dev/null || true
          # THE ONE THIS PROJECT ACTUALLY NEEDS, checked rather than assumed:
          # aarch64 UEFI, without which -bios has nothing to load and the
          # kernel's EFI stub cannot be exercised at all.
          [ -s out/pc-bios/edk2-aarch64-code.fd ] \
            && printf '  edk2-aarch64-code.fd: %s bytes\n' \
                 "$(stat -c%s out/pc-bios/edk2-aarch64-code.fd)" \
            || echo "  WARNING: no decompressed edk2-aarch64-code.fd -- EFI boot untestable"
          printf '  pc-bios: %s files, %s\n' \
            "$(find out/pc-bios -type f | wc -l)" "$(du -sh out/pc-bios | cut -f1)"
          chmod +x out/qemu-system-aarch64 out/qemu-aarch64-static
          echo "  link mode: $LINK"
          for b in qemu-system-aarch64 qemu-aarch64-static; do
            printf '  %-24s %s bytes\n' "$b" "$(stat -c%s out/$b)"
            printf '  %-24s %s\n' "" "$(file -b out/$b | cut -c1-70)"
          done
          if [ "$LINK" = dynamic ]; then
            # PACK WHAT IT NEEDS, or the artifact is a binary that will not
            # start on the machine it was made for.
            mkdir -p out/lib
            for b in out/qemu-system-aarch64 out/qemu-aarch64-static; do
              ldd "$b" | awk '/=> \//{print $3}'
            done | sort -u | while read -r l; do cp -L "$l" out/lib/; done
            cp -L /lib64/ld-linux-x86-64.so.2 out/lib/ 2>/dev/null || true
            # A LOADER SHIM, SO THE HOST'S glibc DOES NOT HAVE TO MATCH.
            # A dynamic binary hard-codes its interpreter path, so on a host
            # with an older glibc it fails with a symbol error rather than a
            # missing-file one. Invoking the PACKED loader explicitly and
            # pointing it at the packed libraries sidesteps that entirely --
            # which is what makes the dynamic fallback genuinely usable
            # locally rather than merely produced.
            #
            # printf, NOT A HEREDOC: an unindented EOF terminator inside a
            # YAML block scalar ends the BLOCK, and the workflow stops
            # parsing. Caught by the yaml check, not by the run.
            for b in qemu-system-aarch64 qemu-aarch64-static; do
              {
                printf '#!/bin/sh\n'
                printf 'd=$(cd "$(dirname "$0")" && pwd)\n'
                printf 'exec "$d/lib/ld-linux-x86-64.so.2" \\\n'
                printf '  --library-path "$d/lib" "$d/%s" -L "$d/pc-bios" "$@"\n' "$b"
              } > "out/$b.sh"
              chmod +x "out/$b.sh"
            done
            printf '  packed %s shared libraries + loader shims\n' "$(ls out/lib | wc -l)"
          fi

      # BUBBLEWRAP, STATIC, BECAUSE THE SANDBOX IS AS MUCH A TOOL AS THE
      # EMULATOR AND WE WERE THROWING IT AWAY.
      #
      # stage5-isolate already builds bwrap from this pinned tarball -- and
      # deliberately NOT from apt, because the whole result depends on
      # --overlay-src existing, which is a property of the version. Then it
      # installs it into the runner and the runner is destroyed. So the
      # argument that convinced us not to trust the host's bwrap was never
      # extended to anyone else: a person reproducing a Veron build still has
      # to get bwrap from whatever their distro ships.
      #
      # Static here rather than dynamic: bwrap's only dependency is libcap,
      # apt ships libcap.a, and one file that runs anywhere is the entire
      # point of a toolbox artifact.
      - name: 'Build bubblewrap from its pin, static'
        run: |
          set -eu
          # meson IS INSTALLED IN THE Install STEP, NOT HERE, AND THAT IS WHY
          # THIS FAILED. qemu ships its own meson inside the tarball and runs
          # it from a venv, so building qemu proved nothing about the system
          # having one -- and bubblewrap, which uses the system meson, died
          # with `meson: command not found` immediately after a qemu build
          # that had just run meson several thousand times.
          sudo apt-get install -y -qq libcap-dev >/dev/null
          python3 tools/mirror.py fetch \
            "$BWRAP_SHA256" "bubblewrap-${BWRAP_VER}.tar.xz" \
            --url "https://github.com/containers/bubblewrap/releases/download/v${BWRAP_VER}/bubblewrap-${BWRAP_VER}.tar.xz" \
            --dest dl
          tar -xf "dl/bubblewrap-${BWRAP_VER}.tar.xz"
          cd "bubblewrap-${BWRAP_VER}"
          # STATIC IS ATTEMPTED AND FALLS BACK, LIKE qemu's. A static bwrap
          # failing must not take the emulator down with it -- and it just
          # did: `meson: command not found` in this step aborted a job whose
          # qemu build had already succeeded, so the whole artifact was lost
          # to a missing package in a later step.
          bw() {
            rm -rf _b
            meson setup _b --prefix=/usr --buildtype=release \
              -Dtests=false -Dman=disabled -Dpython=/usr/bin/python3 \
              $1 > "cfg-$2.log" 2>&1 && ninja -C _b > "b-$2.log" 2>&1
          }
          if bw "-Dc_link_args=-static" static; then
            echo "  bwrap: static"
          else
            echo "  bwrap static FAILED -- falling back to dynamic"
            grep -hiE "cannot find|undefined reference|error:" \
              cfg-static.log b-static.log 2>/dev/null \
              | sort -u | head -6 | sed 's/^/    /'
            bw "" dynamic || {
              echo "  bwrap dynamic FAILED too"
              tail -15 b-dynamic.log 2>/dev/null | sed 's/^/    /'
              exit 1
            }
            echo "  bwrap: dynamic -- NOT portable, needs libcap on the host"
          fi
          cd ..
          cp "bubblewrap-${BWRAP_VER}/_b/bwrap" out/
          chmod +x out/bwrap
          printf '  %s\n' "$(file -b out/bwrap | cut -c1-70)"
          # THE FLAG THE SPIKE DEPENDS ON, CHECKED HERE TOO. isolate asserts
          # --overlay-src exists before it trusts a composed root; the copy
          # people download deserves the same assertion.
          out/bwrap --version | sed 's/^/  /'
          out/bwrap --help 2>&1 | grep -q -- '--overlay-src' \
            && echo "  --overlay-src present" \
            || { echo "  this bwrap has no --overlay-src"; exit 1; }
          out/bwrap --unshare-all --ro-bind / / /bin/true \
            && echo "  it sandboxes: --unshare-all ran a command"

      - name: 'PROVE IT: run an aarch64 binary on this x86_64 runner'
        run: |
          set -eu
          # A claim that the emulator "is included" is not the same as the
          # emulator working. Build a real aarch64 static binary and run it
          # under the copy that is about to be uploaded, not under the system
          # one, and check the exit code rather than that it printed something.
          echo 'int main(void) { return 42; }' > /tmp/t42.c
          aarch64-linux-gnu-gcc -static -O0 -o /tmp/t42.aarch64 /tmp/t42.c
          printf '  built: %s\n' "$(file -b /tmp/t42.aarch64 | cut -c1-70)"
          set +e
          ./out/qemu-aarch64-static /tmp/t42.aarch64
          rc=$?
          set -e
          echo "  exit: $rc"
          [ "$rc" = 42 ] || { echo "FAIL: expected 42"; exit 1; }
          echo "  aarch64 executed on x86_64 via the packed emulator"

      - name: 'PROVE IT: boot a kernel with the system emulator'
        run: |
          set -eu
          # THE USER EMULATOR RUNNING A BINARY DOES NOT SHOW THAT THE SYSTEM
          # EMULATOR BOOTS. They are different programs from the same tree,
          # and only one of them can answer the question this artifact now
          # exists for -- whether a stage-4 Image comes up locally.
          #
          # The stage-4 release is the input, because that is exactly what a
          # local run would boot. If no release exists yet the check is
          # skipped rather than failed: this job predates the release step and
          # must not start depending on it.
          export PATH="$PWD/out:$PATH"
          if [ -d out/lib ]; then export LD_LIBRARY_PATH="$PWD/out/lib"; fi
          out/qemu-system-aarch64 --version | head -1 | sed 's/^/  /'
          if gh release download stage4/latest --pattern Image \
               --pattern 'initramfs.cpio.gz' --dir bootcheck 2>/dev/null; then
            # -L FOR THE ROMS, -nic none BECAUSE THE DEFAULT MACHINE ADDS A
            # NIC WHOSE OPTION ROM WE DO NOT NEED. The stage-4 initramfs test
            # touches no network; leaving the NIC on cost a romfile lookup
            # and nothing else.
            timeout 600 out/qemu-system-aarch64 -machine virt -cpu max \
              -L out/pc-bios -nic none \
              -m 2048 -nographic -no-reboot \
              -device virtio-gpu-pci -device virtio-keyboard-pci \
              -kernel bootcheck/Image -initrd bootcheck/initramfs.cpio.gz \
              -append "console=ttyAMA0 rdinit=/init panic=1" \
              > boot.log 2>&1 || true
            tail -25 boot.log | sed 's/^/    /'
            grep -q VERON-DONE boot.log \
              && echo "  VERON-TOOLBOX-BOOT-OK  the packed emulator booted stage 4" \
              || { echo "  VERON-TOOLBOX-BOOT-FAIL"; exit 1; }
          else
            echo "  no stage4/latest release yet -- boot check skipped"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 'PROVE IT: the user emulator still runs an aarch64 binary'
        run: |
          set -eu
          # And the repo's own committed aarch64 artifact, which is the thing
          # that will actually be run locally.
          if [ -x spikes/stage0-as/stage0-as ]; then
            set +e
            ./out/qemu-aarch64-static spikes/stage0-as/stage0-as >/dev/null 2>&1
            echo "  stage0-as loads and runs under it (exit $?)"
            set -e
          fi

      - name: 'Pack tcc at the pin, arm64 patches applied and configured'
        run: |
          set -eu
          # ONE helper, not three copies -- tools/clone-pinned.sh. It orders
          # the mirrors, retries, fetches ONLY the pinned commit, and then
          # VERIFIES that what landed is the pin. That last step is what makes
          # the order below a speed choice rather than a trust choice; see the
          # header of that file for the argument and its limits.
          #
          # GitHub first because repo.or.cz resets the connection often enough
          # to need two attempts per run, and a full clone of tinycc from it
          # was costing minutes for a tree we use one commit of.
          #
          # sources/tcc.toml is the authority on this list; it is duplicated
          # here because the workflow cannot read toml.
          . "$GITHUB_WORKSPACE/tools/clone-pinned.sh"
          clone_pinned tcc-src "$TCC_SHA" \
            "https://github.com/TinyCC/tinycc.git https://repo.or.cz/tinycc.git"
          echo "  tcc $(git -C tcc-src rev-parse --short HEAD)"

          n=0
          for p in spikes/stage3/patches/tcc-arm64-asm/[0-9]*.patch; do
            [ -e "$p" ] || continue
            git -C tcc-src apply --ignore-whitespace "../$p" \
              || { echo "FAIL: $(basename "$p") does not apply"; exit 1; }
            n=$((n + 1))
          done
          echo "  $n arm64 assembler patches applied"

          cd tcc-src
          # THE GENERATED FILES ARE THE POINT. tcc.h includes config.h on line
          # 27, and it does not exist in the repository -- ./configure writes
          # it. tccdefs_.h is produced by c2str.exe from include/tccdefs.h.
          # A raw clone is missing both, and that is exactly the failure this
          # workflow's sibling hit on its first run.
          # --triplet, for the same reason tcc-two-ways passes it: with an
          # explicit --cpu, configure takes its "can only make guesses" branch
          # and produces triplet arm64-linux-gnu. Debian's directory is
          # aarch64-linux-gnu, so tcc's crt search points at nothing and every
          # link fails with "file 'crt1.o' not found". This job cross-configures
          # on x86_64, so it can never detect the right value on its own.
          ./configure --cpu=arm64 --triplet=aarch64-linux-gnu >/dev/null 2>&1 || true
          [ -f config.h ] || { echo "FAIL: configure produced no config.h"; exit 1; }
          cc -DC2STR conftest.c -o c2str.exe
          ./c2str.exe include/tccdefs.h tccdefs_.h
          [ -s tccdefs_.h ] || { echo "FAIL: tccdefs_.h is empty"; exit 1; }
          echo "  config.h and tccdefs_.h generated"
          rm -rf .git c2str.exe
          cd ..

          tar -czf out/tcc-arm64-configured.tar.gz tcc-src
          printf '  %s bytes\n' "$(stat -c%s out/tcc-arm64-configured.tar.gz)"

      - name: 'Manifest'
        run: |
          set -eu
          {
            echo "veron local toolbox"
            echo
            echo "built by .github/workflows/local-toolbox.yml"
            echo "runner: $(uname -m) $(lsb_release -ds 2>/dev/null || echo linux)"
            echo "date:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "qemu-system-aarch64  (+ .sh shim)"
            echo "  $(out/qemu-system-aarch64 --version 2>/dev/null | head -1 || echo 'see the shim')"
            echo "  boot a Veron image with:"
            echo "      ./qemu-system-aarch64.sh -machine virt -cpu max -m 2048 \\"
            echo "        -nographic -no-reboot -nic none \\"
            echo "        -device virtio-gpu-pci -device virtio-keyboard-pci \\"
            echo "        -kernel Image -initrd initramfs.cpio.gz \\"
            echo "        -append 'console=ttyAMA0 rdinit=/init panic=1'"
            echo "  the .sh shim uses the PACKED loader and libraries, so the"
            echo "  host's glibc does not have to match the one this was built"
            echo "  against. Use it in preference to the bare binary."
            echo
            echo "bwrap  (static)"
            echo "  $(out/bwrap --version 2>/dev/null || echo 'not built')"
            echo "  the sandbox stage5-isolate composes per-package build"
            echo "  roots with. --overlay-src is checked at build time."
            echo
            echo "pc-bios/"
            echo "  qemu's firmware and option ROMs. -L points at it; the"
            echo "  shims already do. Without it qemu reports a missing"
            echo "  romfile and looks broken."
            echo
            echo "qemu-aarch64-static  (+ .sh shim)"
            echo "  $(out/qemu-aarch64-static --version | head -1)"
            echo "  run an aarch64 binary on x86_64 with:"
            echo "      ./qemu-aarch64-static ./some-aarch64-binary"
            echo "  no binfmt registration and no root are needed when the"
            echo "  emulator is invoked explicitly."
            echo
            echo "tcc-arm64-configured.tar.gz"
            echo "  tinycc at $TCC_SHA"
            echo "  spikes/stage3/patches/tcc-arm64-asm applied"
            echo "  ./configure --cpu=arm64 already run, so config.h and"
            echo "  tccdefs_.h are present -- a raw clone has neither and"
            echo "  tcc.h:27 includes config.h."
            echo "  .git removed."
            echo
            echo "sha256"
            (cd out && sha256sum *) | sed 's/^/  /'
          } > out/MANIFEST.txt
          cat out/MANIFEST.txt

      # PUBLISH IT, FOR THE SAME REASON THE SYSROOT IS PUBLISHED. A 30-day
      # artifact behind a login is not something a person can be pointed at.
      # Anyone who wants to run or build Veron on a foreign host needs qemu
      # and bubblewrap; the whole argument for building them from our pins
      # rather than taking the host's is wasted if the result is thrown away
      # with the runner.
      - name: 'Publish the toolbox'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              -czf veron-toolbox.tar.gz -C out .
          printf '  %s\n' "$(du -h veron-toolbox.tar.gz | cut -f1)"
          gh release create toolbox/latest --title 'Veron toolbox' \
            --notes 'qemu (system + user), bubblewrap and tcc, built from pinned sources. See MANIFEST.txt inside.' \
            2>/dev/null || true
          if gh release upload toolbox/latest veron-toolbox.tar.gz --clobber; then
            echo "VERON-TOOLBOX-PUBLISHED"
          else
            # NOT FATAL. The artifact still carries everything; a failed
            # release costs a re-dispatch, not the build.
            echo "VERON-TOOLBOX-UNPUBLISHED -- the artifact stands"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: veron-local-toolbox
          path: out/
          if-no-files-found: error
          compression-level: 6
