name: hermetic-2-sysroot

# HERMETIC LADDER, STEP 2: THE LFS METHOD, NOT STATIC LINKING.
#
# THREE RUNS WERE SPENT ON THE WRONG TECHNIQUE. The first version of this file
# tried to make every binary in the sysroot statically linked, so it would run
# in a box that binds nothing. That failed three times, each time differently,
# and the reasons are worth keeping because they are all libtool:
#
#   run 2  LDFLAGS="-static"      tools came out dynamic. libtool INTERCEPTS a
#                                 bare -static and reads it as "prefer static
#                                 libtool libraries", removing it from the real
#                                 link. The flag never reached the linker.
#   run 3  LDFLAGS="-all-static"  libtool's actual flag -- but the top-level
#                                 make re-runs sub-configures, so it landed on
#                                 `gcc -all-static conftest.c`, which gcc
#                                 rejects. Every later test then died with
#                                 "Link tests are not allowed after
#                                 GCC_NO_EXECUTABLES."
#   run 4  CC="gcc -static"       dynamic again: libtool strips -static from
#                                 ANYWHERE in the command, including from CC.
#
# LFS 13.0 DOES NOT LINK ANYTHING STATICALLY. Its isolation comes from three
# things acting together, and the book states the principle outright: cross
# compilation is not needed for a same-machine build, but it has one great
# advantage -- anything that is cross-compiled cannot depend on the host
# environment.
#
#   1. A TRIPLET THE HOST DOES NOT HAVE.  LFS_TGT=$(uname -m)-lfs-linux-gnu.
#      Ours is aarch64-veron-linux-gnu. The host is aarch64-unknown-linux-gnu,
#      so the two search-path trees do not overlap at any point. There is
#      nothing to leak through, by construction rather than by policy.
#   2. --with-sysroot=$LFS, so the compiler looks for target libraries inside
#      the sysroot instead of /usr.
#   3. A LIBC BUILT INTO THE SYSROOT, cross-compiled with --host=$LFS_TGT. The
#      tools stay dynamically linked; they simply find their loader and their
#      libc inside the sysroot, at the paths they were told to expect.
#
# WHY glibc AND NOT musl. musl appears elsewhere in this repository because
# tcc-userland-arm64 needed a libc tcc could build; that was a spike about tcc,
# not a decision about this. LFS uses glibc, gcc knows how to cross-compile it,
# and musl would need a triplet (…-linux-musl) that gcc's config.sub does not
# recognise without patching -- the same class of problem the aarch64 backport
# already solved once. glibc is the lower-risk choice here.
#
# WHY THE TEMPORARY COMPILER IS NOT 4.8.5. It cannot be: glibc 2.39 requires
# gcc 6.2 or newer to build, so a 2013 compiler cannot produce the libc that
# makes the sysroot self-sufficient. The temporary toolchain is therefore a
# current gcc, and **4.8.5 becomes the first thing built INSIDE the box** --
# which is still a hermetically built 4.8.5, one layer later than asked.
#
# WHAT THIS RUN PROVES IF IT PASSES: a compiler, an assembler, a linker and a
# shell userland that were all cross-compiled against a libc in the sysroot,
# running with no /usr, no /etc, no host loader and no network -- and able to
# compile and run a program. That is LFS chapters 5-7 in one job, with BusyBox
# standing in for chapter 6's seventeen packages.
#
# STILL BORROWED, and unavoidably at this rung: the host gcc builds the cross
# toolchain, exactly as LFS chapter 5 does. Removing that means reaching a
# compiler from the seed, which is leg 1.

on:
  push:
    paths:
      - '.github/workflows/hermetic-2-sysroot.yml'
  workflow_dispatch:
    inputs:
      lfs_set:
        description: 'which tested set: 13.0 (gcc 15.2) or dev (gcc 16.1)'
        required: false
        default: '13.0'

concurrency:
  group: hermetic-2-${{ github.ref }}
  cancel-in-progress: true

env:
  GNU: 'https://mirrors.kernel.org/gnu'
  LFS_TGT: 'aarch64-veron-linux-gnu'
  # THE BOOK'S TESTED SET. Defaults are LFS 13.0; `lfs_set: dev` switches to
  # the development book (r13.0-156), which pins gcc 16.1. TWO SETS, ONE
  # RECIPE: the books' configure lines differ in exactly two places, so this is
  # a switch rather than a second file. (The PERIOD book is a separate
  # workflow, because there the OPTIONS differ too, not just the pins.) Run 1 used gcc 13.2 with
  # glibc 2.39 -- a pairing I chose from memory, not from the book -- and glibc
  # died on `wctomb.c:57:1: error: 'artificial' attribute ignored
  # [-Werror=attributes]`. glibc builds itself with -Werror, so a compiler that
  # diagnoses one construct differently from the one it was released against
  # stops the build outright. These versions are a combination somebody has
  # already run end to end; ours was not.
  BINUTILS: '2.46.0'
  GCCVER: '15.2.0'
  GLIBC: '2.43'
  KERNEL: '6.18.10'
  GMP: '6.3.0'
  MPFR: '4.2.2'
  MPC: '1.3.1'

jobs:
  sysroot:
    name: 'cross toolchain -> sysroot -> a box with no /usr'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap curl git bzip2 xz-utils gcc g++ make bison flex \
            texinfo m4 perl python3 file gawk

      - name: 'Layout and environment (LFS ch. 4)'
        run: |
          set -eu
          S="$PWD/sysroot"
          echo "S=$S"   >> "$GITHUB_ENV"
          echo "W=$PWD" >> "$GITHUB_ENV"
          # LFS's minimal layout, including the /bin -> usr/bin symlinks. The
          # loader ends up at /usr/lib and is reached through /lib, which is
          # what every binary's PT_INTERP will name.
          mkdir -pv "$S"/{etc,var,tools,work} "$S"/usr/{bin,lib,sbin,include}
          for i in bin lib sbin; do ln -sv usr/$i "$S/$i"; done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          # LFS chapter 4 sets PATH ONCE for the whole session. Run 2 set it in
          # two build steps out of six, so libstdc++'s configure could not find
          # aarch64-veron-linux-gnu-g++, autoconf FELL BACK TO THE HOST g++
          # without complaint, and gcc 13.3 was handed gcc 15.2's headers --
          # "explicit template argument list not allowed". A missing cross
          # compiler does not announce itself; it is silently replaced by the
          # host's, which is the exact failure this whole workflow exists to
          # prevent.
          echo "$S/tools/bin" >> "$GITHUB_PATH"
          # The two tested sets. Nothing here is chosen by us: each row is a
          # combination one of the books has run end to end. hermetic-2 already
          # lost a run to a pairing picked from memory (gcc 13.2 + glibc 2.39,
          # dead on -Werror=attributes), which is the whole reason these are
          # copied rather than composed.
          if [ "${{ github.event.inputs.lfs_set }}" = "dev" ]; then
            {
              echo "BINUTILS=2.46.1"; echo "GCCVER=16.1.0"; echo "GLIBC=2.43"
              echo "KERNEL=7.1.3";    echo "MPC=1.4.1"
              echo "ENABLE_KERNEL=5.10"
              echo "EXTRA_GCC=--disable-fixincludes"
            } >> "$GITHUB_ENV"
            echo "  set: LFS dev (r13.0-156) -- gcc 16.1.0"
          else
            {
              echo "ENABLE_KERNEL=5.4"; echo "EXTRA_GCC="
            } >> "$GITHUB_ENV"
            echo "  set: LFS 13.0 -- gcc 15.2.0"
          fi
          echo "  LFS_TGT: $LFS_TGT   (host is $(gcc -dumpmachine))"
          echo "  the two triplets differ, which is the isolation"

      - name: 'Fetch everything (no network exists past this point)'
        run: |
          set -eu
          get() { echo "  $1"; curl -fsSL --retry 3 -O "$1"; }
          get "$GNU/binutils/binutils-$BINUTILS.tar.xz"
          get "$GNU/gcc/gcc-$GCCVER/gcc-$GCCVER.tar.xz"
          get "$GNU/glibc/glibc-$GLIBC.tar.xz"
          get "$GNU/gmp/gmp-$GMP.tar.xz"
          get "$GNU/mpfr/mpfr-$MPFR.tar.xz"
          get "$GNU/mpc/mpc-$MPC.tar.gz"
          get "$GNU/make/make-4.4.1.tar.gz"
          get "https://busybox.net/downloads/busybox-1.36.1.tar.bz2"
          # v6.x vs v7.x: the directory follows the version, and the dev book
          # pins linux 7.1.3.
          get "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL%%.*}.x/linux-$KERNEL.tar.xz"
          ls -la *.tar.* | awk '{print "    "$5"  "$9}'

      # ---------------------------------------------------- LFS 5.2
      - name: '5.2 binutils pass 1 (cross)'
        run: |
          set -eu
          tar xf "binutils-$BINUTILS.tar.xz"
          mkdir -p b-binutils1 && cd b-binutils1
          "../binutils-$BINUTILS/configure" \
            --prefix="$S/tools" \
            --with-sysroot="$S" \
            --target="$LFS_TGT" \
            --disable-nls --enable-gprofng=no --disable-werror \
            --enable-new-dtags --enable-default-hash-style=gnu \
            > c.log 2>&1 || { tail -20 c.log; exit 1; }
          make -j"$(nproc)" > b.log 2>&1 || { echo "  --- errors ---"; grep -nE "error:|Error [0-9]|configure: error" b.log | head -12 | sed "s/^/    /"; echo "  --- tail ---"; tail -25 b.log | sed "s/^/    /"; exit 1; }
          make install > /dev/null 2>&1
          ls "$S/tools/bin" | sed 's/^/    /'

      # ---------------------------------------------------- LFS 5.3
      - name: '5.3 gcc pass 1 (cross, no headers, no libc)'
        run: |
          set -eu
          tar xf "gcc-$GCCVER.tar.xz"
          cd "gcc-$GCCVER"
          # LFS extracts gmp/mpfr/mpc INTO the gcc tree so they are built
          # in-tree. That is simpler and more reliable than a separate prefix,
          # and it is what the book does.
          tar xf "../gmp-$GMP.tar.xz"   && mv "gmp-$GMP" gmp
          tar xf "../mpfr-$MPFR.tar.xz" && mv "mpfr-$MPFR" mpfr
          tar xf "../mpc-$MPC.tar.gz"   && mv "mpc-$MPC" mpc
          cd "$W"
          mkdir -p b-gcc1 && cd b-gcc1
          # --without-headers/--with-newlib: there is no libc yet. c,c++ because
          # binutils pass 2 and much else needs a C++ compiler, and libstdc++
          # comes next.
          "../gcc-$GCCVER/configure" \
            --target="$LFS_TGT" \
            --prefix="$S/tools" \
            --with-glibc-version="$GLIBC" \
            --with-sysroot="$S" \
            --with-newlib --without-headers \
            --enable-default-pie --enable-default-ssp \
            --disable-nls --disable-shared --disable-multilib \
            --disable-threads --disable-libatomic --disable-libgomp \
            --disable-libquadmath --disable-libssp --disable-libvtv \
            --disable-libstdcxx --enable-languages=c,c++ $EXTRA_GCC \
            > c.log 2>&1 || { tail -25 c.log; exit 1; }
          make -j"$(nproc)" > b.log 2>&1 || { echo "  --- errors ---"; grep -nE "error:|Error [0-9]|configure: error" b.log | head -12 | sed "s/^/    /"; echo "  --- tail ---"; tail -30 b.log | sed "s/^/    /"; exit 1; }
          make install > /dev/null 2>&1
          "$S/tools/bin/$LFS_TGT-gcc" --version | head -1 | sed 's/^/    /'
          "$S/tools/bin/$LFS_TGT-gcc" -dumpmachine | sed 's/^/    targets: /'

      # ---------------------------------------------------- LFS 5.4
      - name: '5.4 linux API headers'
        run: |
          set -eu
          tar xf "linux-$KERNEL.tar.xz"
          cd "linux-$KERNEL"
          make mrproper > /dev/null 2>&1
          make headers > /dev/null 2>&1
          find usr/include -type f ! -name '*.h' -delete
          cp -r usr/include "$S/usr"
          echo "  headers: $(find "$S/usr/include" -name '*.h' | wc -l) files"

      # ---------------------------------------------------- LFS 5.5
      - name: '5.5 glibc (cross-compiled INTO the sysroot)'
        run: |
          set -eu
          # WHICH COMPILER DID configure ACTUALLY PICK? Host and target are both
          # aarch64 here, so a native build and a cross build produce the same
          # ELF interpreter name and the readelf check below cannot tell them
          # apart. Only the recorded CC can.
          crosscheck() {  # $1 = build dir
            # glibc records CC in config.make, autotools in Makefile, and
            # configure's own answer lands in config.log. Check all three:
            # hermetic-3 lost a run to looking in only one and calling the
            # silence a failure.
            cc=$(sed -n 's/^CC *= *//p' "$1/config.make" "$1/Makefile" 2>/dev/null | head -1)
            [ -n "$cc" ] || cc=$(sed -n "s/^ac_cv_prog_CC='\\{0,1\\}//p" "$1/config.log" 2>/dev/null | head -1 | tr -d "'")
            echo "  configure selected CC: ${cc:-<unknown>}"
            case "$cc" in
              *"$LFS_TGT"*) echo "  cross compiler confirmed" ;;
              *) echo "  NOT THE CROSS COMPILER -- this is a host build wearing"
                 echo "  a cross build's name. Stopping."; return 1 ;;
            esac
          }
          tar xf "glibc-$GLIBC.tar.xz"
          mkdir -p b-glibc && cd b-glibc
          echo "rootsbindir=/usr/sbin" > configparms
          # --host=$LFS_TGT with --build=config.guess is what makes glibc
          # configure itself as a cross build, using the tools in $S/tools.
          "../glibc-$GLIBC/configure" \
            --prefix=/usr \
            --host="$LFS_TGT" \
            --build="$(../glibc-$GLIBC/scripts/config.guess)" \
            --enable-kernel="$ENABLE_KERNEL" \
            --with-headers="$S/usr/include" \
            --disable-nscd \
            libc_cv_slibdir=/usr/lib \
            > c.log 2>&1 || { tail -25 c.log; exit 1; }
          cd "$W"; crosscheck b-glibc || exit 1; cd b-glibc
          make -j"$(nproc)" > b.log 2>&1 || { echo "  --- errors ---"; grep -nE "error:|Error [0-9]|configure: error" b.log | head -12 | sed "s/^/    /"; echo "  --- tail ---"; tail -30 b.log | sed "s/^/    /"; exit 1; }
          make DESTDIR="$S" install > i.log 2>&1
          echo "  loader: $(ls "$S"/usr/lib/ld-linux-* 2>/dev/null || echo MISSING)"
          echo "  libc  : $(ls "$S"/usr/lib/libc.so.* 2>/dev/null | head -1 || echo MISSING)"
          # LFS's sanity check: the cross compiler must produce something whose
          # interpreter lives in the SYSROOT, not on the host.
          echo 'int main(){return 42;}' > /tmp/s.c
          "$S/tools/bin/$LFS_TGT-gcc" /tmp/s.c -o /tmp/s
          echo "  --- interpreter of a cross-built binary ---"
          readelf -l /tmp/s | grep -A1 'program interpreter' | sed 's/^/    /'

      # ---------------------------------------------------- LFS 5.6
      - name: '5.6 libstdc++ (needs the libc that now exists)'
        run: |
          set -eu
          echo "  PATH has tools/bin: $(command -v "$LFS_TGT-g++" || echo NO)"
          command -v "$LFS_TGT-g++" > /dev/null \
            || { echo "  the cross g++ is not on PATH -- configure would"; \
                 echo "  silently use the host's instead"; exit 1; }
          mkdir -p b-libstdcxx && cd b-libstdcxx
          "../gcc-$GCCVER/libstdc++-v3/configure" \
            --host="$LFS_TGT" --build="$(../gcc-$GCCVER/config.guess)" \
            --prefix=/usr --disable-multilib --disable-nls \
            --disable-libstdcxx-pch \
            --with-gxx-include-dir="/tools/$LFS_TGT/include/c++/$GCCVER" \
            > c.log 2>&1 || { tail -25 c.log; exit 1; }
          make -j"$(nproc)" > b.log 2>&1 || { echo "  --- errors ---"; grep -nE "error:|Error [0-9]|configure: error" b.log | head -12 | sed "s/^/    /"; echo "  --- tail ---"; tail -25 b.log | sed "s/^/    /"; exit 1; }
          make DESTDIR="$S" install > /dev/null 2>&1
          rm -fv "$S"/usr/lib/lib{stdc++{,exp,fs},supc++}.la 2>/dev/null || true
          echo "  libstdc++: $(ls "$S"/usr/lib/libstdc++.so.* 2>/dev/null | head -1 || echo MISSING)"

      # ------------------------------------------- LFS ch.6, abridged
      - name: '6.x userland: BusyBox, make, binutils pass 2 (all cross)'
        run: |
          set -eu
          export PATH="$S/tools/bin:$PATH"
          # LFS chapter 6 builds seventeen packages to get a shell and the text
          # tools. BusyBox is one package that supplies sh, sed, grep, awk, tar
          # and the coreutils, and tcc-userland-arm64 already proved it builds
          # and boots. A declared substitution, not an oversight.
          tar xf busybox-1.36.1.tar.bz2 && cd busybox-1.36.1
          make defconfig > /dev/null 2>&1
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          # glibc guards LONG_BIT behind __USE_XOPEN, and BusyBox 1.36.1's
          # tls_aesgcm.c reaches for it without the feature macro:
          #   networking/tls_aesgcm.c:78: error: 'LONG_BIT' undeclared
          # A build sysroot has no use for HTTPS, so drop the TLS code rather
          # than patch around a feature-test mismatch. Fewer applets is also
          # the right direction for something we are trying to keep enumerable.
          sed -i 's/^CONFIG_TLS=y/# CONFIG_TLS is not set/' .config
          sed -i 's/^CONFIG_FEATURE_WGET_HTTPS=y/# CONFIG_FEATURE_WGET_HTTPS is not set/' .config
          yes '' | make oldconfig > /dev/null 2>&1
          # gcc 14 PROMOTED -Wimplicit-function-declaration and
          # -Wincompatible-pointer-types FROM WARNINGS TO ERRORS by default.
          # BusyBox 1.36.1 is from 2023 and predates that. LFS's own chapter 6
          # packages are version-matched to gcc 15.2; BusyBox is our
          # substitution for those seventeen packages, so it is the one thing
          # here that nobody has tested against this compiler. Demote them.
          make -j"$(nproc)" CROSS_COMPILE="$LFS_TGT-" \
            EXTRA_CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion" \
            > b.log 2>&1 || {
              # RUN 4 PRINTED `tail -20` AND IT CONTAINED NO ERROR AT ALL --
              # with -j4 the last lines of the log are whatever finished last,
              # not what failed. Grep for the failure; show the tail only as
              # context.
              echo "  --- errors ---"
              grep -nE "error:|Error [0-9]|\*\*\*" b.log | head -15 | sed "s/^/    /"
              echo "  --- last lines ---"
              tail -6 b.log | sed "s/^/    /"
              exit 1; }
          cp busybox "$S/usr/bin/"
          ( cd "$S/usr/bin" && for a in $(../../../busybox-1.36.1/busybox --list 2>/dev/null || echo sh ls cat sed grep awk tar gzip); do
              [ -e "$a" ] || ln -sf busybox "$a"; done )
          echo "  busybox: $(file "$S/usr/bin/busybox" | cut -c1-90)"
          cd "$W"

          tar xf make-4.4.1.tar.gz
          mkdir -p b-make && cd b-make
          ../make-4.4.1/configure --prefix=/usr --host="$LFS_TGT" \
            --build="$(../make-4.4.1/build-aux/config.guess)" --disable-nls \
            > c.log 2>&1 || { tail -20 c.log; exit 1; }
          make -j"$(nproc)" > b.log 2>&1 && make DESTDIR="$S" install > /dev/null 2>&1
          cd "$W"

          mkdir -p b-binutils2 && cd b-binutils2
          ../binutils-$BINUTILS/configure --prefix=/usr \
            --build="$(../binutils-$BINUTILS/config.guess)" --host="$LFS_TGT" \
            --disable-nls --enable-shared --enable-gprofng=no \
            --disable-werror --enable-64-bit-bfd --enable-new-dtags \
            --enable-default-hash-style=gnu \
            > c.log 2>&1 || { tail -20 c.log; exit 1; }
          make -j"$(nproc)" > b.log 2>&1 || { echo "  --- errors ---"; grep -nE "error:|Error [0-9]|configure: error" b.log | head -12 | sed "s/^/    /"; echo "  --- tail ---"; tail -25 b.log | sed "s/^/    /"; exit 1; }
          make DESTDIR="$S" install > /dev/null 2>&1
          echo "  as: $(file "$S/usr/bin/as" | cut -c1-90)"

      - name: '6.x gcc pass 2 (a compiler that RUNS in the sysroot)'
        run: |
          set -eu
          export PATH="$S/tools/bin:$PATH"
          # Canadian cross: built on the host, runs on LFS_TGT, targets
          # LFS_TGT. Pass 1's compiler runs on the HOST and is linked against
          # the host libc; this one runs inside the box.
          mkdir -p b-gcc2 && cd b-gcc2
          "../gcc-$GCCVER/configure" \
            --build="$(../gcc-$GCCVER/config.guess)" \
            --host="$LFS_TGT" --target="$LFS_TGT" \
            LDFLAGS_FOR_TARGET=-L"$PWD/$LFS_TGT/libgcc" \
            --prefix=/usr --with-build-sysroot="$S" \
            --enable-default-pie --enable-default-ssp \
            --disable-nls --disable-multilib --disable-libatomic \
            --disable-libgomp --disable-libquadmath --disable-libsanitizer \
            --disable-libssp --disable-libvtv --enable-languages=c,c++ $EXTRA_GCC \
            > c.log 2>&1 || { tail -25 c.log; exit 1; }
          make -j"$(nproc)" > b.log 2>&1 || { echo "  --- errors ---"; grep -nE "error:|Error [0-9]|configure: error" b.log | head -12 | sed "s/^/    /"; echo "  --- tail ---"; tail -30 b.log | sed "s/^/    /"; exit 1; }
          make DESTDIR="$S" install > /dev/null 2>&1
          ln -sfv gcc "$S/usr/bin/cc"
          echo "  gcc: $(file "$S/usr/bin/gcc" | cut -c1-90)"

      - name: 'THE BOX: bind the sysroot as / and nothing else'
        run: |
          set -eu
          cat > box2.sh <<'EOS'
          #!/bin/sh
          # No /usr bind. No /etc bind. The sysroot IS the filesystem.
          # PATH mirrors LFS's chroot: /usr/bin:/usr/sbin, plus /tools/bin.
          set -eu
          S=${S:?box2.sh: S not set}
          exec bwrap \
            --unshare-all --die-with-parent --new-session \
            --clearenv \
            --setenv PATH /usr/bin:/usr/sbin:/tools/bin \
            --setenv HOME /work \
            --setenv LC_ALL POSIX \
            --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --bind "$S" / \
            --proc /proc --dev /dev \
            --tmpfs /tmp --tmpfs /run \
            --chdir /work \
            "$@"
          EOS
          chmod +x box2.sh
          echo "  sysroot: $(du -sh "$S" | cut -f1)"
          du -sh "$S"/* 2>/dev/null | sed 's/^/    /'

      - name: 'THE LADDER'
        continue-on-error: true
        run: |
          set -u
          set +e
          rung() {
            name=$1; shift
            out=$(S="$S" ./box2.sh "$@" 2>&1); rc=$?
            case "$out" in *"not found"*|*"No such file"*|*"cannot execute"*) rc=127 ;; esac
            [ $rc -eq 0 ] && printf '  %-30s OK    %s\n' "$name" "$(printf '%s' "$out" | head -1 | cut -c1-46)" \
                          || printf '  %-30s FAIL  %s\n' "$name" "$(printf '%s' "$out" | head -1 | cut -c1-52)"
          }
          rung "1. shell"          /bin/sh -c 'echo alive'
          rung "2. coreutils"      /bin/ls /
          rung "3. sed/grep/awk"   /bin/sh -c 'echo x | sed s/x/y/ | grep -q y && echo ok'
          rung "4. make"           /usr/bin/make --version
          rung "5. as"             /usr/bin/as --version
          rung "6. ld"             /usr/bin/ld --version
          rung "7. gcc"            /usr/bin/gcc --version
          echo
          echo "  --- 8. compile and run, entirely inside ---"
          mkdir -p "$S/work"
          printf 'int main(void){return 42;}\n' > "$S/work/t.c"
          S="$S" ./box2.sh /usr/bin/gcc -o /work/t /work/t.c 2>&1 | head -6 | sed 's/^/    /'
          if [ -x "$S/work/t" ]; then
            S="$S" ./box2.sh /work/t; echo "    ran: exit=$? (expect 42)"
          else
            echo "    no binary produced"
          fi
          echo
          echo "  --- 9. a configure script, the real test of the userland ---"
          cp -r "make-4.4.1" "$S/work/mk" 2>/dev/null
          S="$S" ./box2.sh /bin/sh -c \
            'mkdir -p /work/cm && cd /work/cm && /work/mk/configure --disable-nls >cfg.log 2>&1; echo "configure rc=$?"; tail -4 cfg.log' \
            2>&1 | head -10 | sed 's/^/    /'

      - name: 'WHAT THIS DID AND DID NOT REMOVE'
        if: always()
        run: |
          echo "  Removed vs step 1: /usr, /etc, the host loader, ld.so.cache,"
          echo "  and every host binary. The box binds the sysroot and nothing."
          echo
          echo "  The isolation is NOT static linking -- three runs were lost to"
          echo "  that. It is LFS's method: a triplet the host does not have"
          echo "  ($LFS_TGT vs $(gcc -dumpmachine)), --with-sysroot, and a glibc"
          echo "  cross-compiled into the sysroot so the tools find their loader"
          echo "  and libc inside it."
          echo
          echo "  Still borrowed: the host gcc built the cross toolchain, as LFS"
          echo "  chapter 5 does. Removing that is leg 1 (seed -> tcc)."
          echo "  Substituted: BusyBox for LFS chapter 6's seventeen packages."
          echo "  Next: build gcc 4.8.5 INSIDE this box."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sysroot-logs
          path: |
            box2.sh
            b-*/c.log
            b-*/b.log
          if-no-files-found: warn
