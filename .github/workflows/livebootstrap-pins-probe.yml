name: livebootstrap-pins-probe

# SPIKE. WHICH live-bootstrap commit pairs with OUR M2-Planet pin?
#
# We pinned M2-Planet to 1.13.1 (bd2fe4b) and mescc-tools to 5adfbf3 for the
# hand-off. live-bootstrap moves as a COORDINATED SET -- its M2-Planet, mes,
# tcc and mescc-tools versions are chosen to work together -- and
# livebootstrap-pass1.yml currently clones its `main` with no pin at all. Taking
# a Mes version from a floating main while feeding it our separately-pinned
# M2-Planet is two independently-drifting pin sets in one chain, which is the
# same class of mistake as e2c63c3 (repinned M2-Planet, left nine workflows
# pointing at a file that no longer existed).
#
# So: DERIVE the pairing, do not guess it.
#
# HOW. live-bootstrap records each step as a directory `steps/<name>-<version>/`,
# so the question "which commit uses M2-Planet 1.13.1" is answerable by reading
# the tree at a commit -- no manifest-format assumptions, just `git ls-tree`.
# The version is non-decreasing over history, so the search is a BISECT: find
# the FIRST commit whose M2-Planet is >= our pin, in ~log2(N) reads.
#
# THREE OUTCOMES, all first-class:
#   1. a commit pins >= 1.13.1  -> print its whole set (mescc-tools/mes/tcc)
#   2. HEAD is still older      -> NO pairing exists; print the CLOSEST set
#                                  (the newest live-bootstrap has ever pinned)
#   3. the tree shape changed   -> report it rather than silently finding nothing
#
# Nothing here builds anything. It answers one question cheaply so the Mes rung
# starts from a known-consistent set instead of a hopeful one.
#
# RUN 1 FINDING (lb HEAD 9a268c4, 2026-04-20). steps/ yields mes 0.27.1 and
# tcc 0.9.27, but NO M2-Planet and NO mescc-tools. That is not a layout change:
# live-bootstrap's steps/ BEGINS at Mes. Everything below it -- hex0, M1, hex2,
# M2-Planet, mescc-tools -- comes from the stage0-posix SUBMODULE, so our pin's
# counterpart is one level down. This pass LOCATES it rather than assuming a
# second time.

on:
  push:
    paths:
      - '.github/workflows/livebootstrap-pins-probe.yml'
  workflow_dispatch:

concurrency:
  group: livebootstrap-pins-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # our pins, from the hand-off
      OUR_M2PLANET_VER: '1.13.1'
      OUR_M2PLANET_SHA: bd2fe4b0659fd0ad3f476a5ad0ef801bd134665d
      OUR_MESCC_SHA: 5adfbf3
    steps:
      - uses: actions/checkout@v5

      - name: Fetch live-bootstrap (FULL history -- the bisect needs it)
        run: |
          git clone https://github.com/fosslinux/live-bootstrap.git lb
          echo "  commits on first-parent history: $(git -C lb rev-list --count --first-parent HEAD)"
          echo "  HEAD: $(git -C lb rev-parse HEAD)"
          echo "  HEAD date: $(git -C lb log -1 --format=%ci)"

      - name: 'Resolve the chain: live-bootstrap -> stage0-posix -> M2-Planet'
        run: |
          set -u
          OURS="$OUR_M2PLANET_SHA"

          # --- clone the two levels below live-bootstrap ---
          S0_URL=$(git -C lb config -f .gitmodules --get submodule.seed/stage0-posix.url)
          echo "  stage0-posix url: $S0_URL"
          git clone -q "$S0_URL" s0
          S0_HEAD=$(git -C lb ls-tree HEAD -- seed/stage0-posix | awk '{print $3}')
          echo "  stage0-posix pinned by lb HEAD: $S0_HEAD"
          echo
          echo "  --- stage0-posix's own submodules at that pin ---"
          git -C s0 show "$S0_HEAD:.gitmodules" 2>/dev/null | sed 's/^/    /' || \
            echo "    (no .gitmodules -- M2-Planet may be vendored, listing tree)"
          git -C s0 ls-tree -r "$S0_HEAD" | awk '$2=="commit"{printf "    %-30s %s\n",$4,$3}'
          echo

          M2_URL=$(git -C s0 config -f <(git -C s0 show "$S0_HEAD:.gitmodules") \
                   --get submodule.M2-Planet.url 2>/dev/null || true)
          [ -n "$M2_URL" ] || M2_URL=https://github.com/oriansj/M2-Planet
          echo "  M2-Planet url: $M2_URL"
          git clone -q "$M2_URL" m2
          git -C m2 fetch -q --tags 2>/dev/null || true

          # m2_of_lb <lb-sha> -> the M2-Planet commit that lb pins, via stage0-posix
          m2_of_lb() {
            local s0sha m2sha
            s0sha=$(git -C lb ls-tree "$1" -- seed/stage0-posix 2>/dev/null | awk '{print $3}')
            [ -n "$s0sha" ] || return 1
            git -C s0 cat-file -e "$s0sha^{commit}" 2>/dev/null || return 1
            m2sha=$(git -C s0 ls-tree -r "$s0sha" 2>/dev/null \
                    | awk '$2=="commit" && $4 ~ /M2-Planet/ {print $3; exit}')
            [ -n "$m2sha" ] || return 1
            printf '%s' "$m2sha"
          }
          describe() {  # a readable name for an M2-Planet commit
            git -C m2 describe --tags "$1" 2>/dev/null \
              || git -C m2 log -1 --format='%cs %h' "$1" 2>/dev/null \
              || echo '<unknown>'
          }

          echo "=== THE CHAIN AT live-bootstrap HEAD ==="
          HEAD_M2=$(m2_of_lb HEAD || true)
          printf '    %-22s %s\n' 'lb HEAD'        "$(git -C lb rev-parse HEAD)"
          printf '    %-22s %s\n' 'stage0-posix'   "$S0_HEAD"
          printf '    %-22s %s  %s\n' 'M2-Planet (theirs)' "${HEAD_M2:-<not found>}" "$(describe "${HEAD_M2:-HEAD}")"
          printf '    %-22s %s  %s\n' 'M2-Planet (OURS)'   "$OURS" "$(describe "$OURS")"
          echo

          if [ -z "${HEAD_M2:-}" ]; then
            echo "OUTCOME 3: could not resolve M2-Planet through stage0-posix."
            git -C s0 ls-tree -r --name-only "$S0_HEAD" | head -30 | sed 's/^/    /'
            exit 0
          fi
          if [ "$HEAD_M2" = "$OURS" ]; then
            echo "OUTCOME 1: live-bootstrap HEAD pins EXACTLY our M2-Planet."
            echo "  Mes 0.27.1 / tcc 0.9.27 at this commit are the matching set."
            exit 0
          fi

          # THE PREDICATE. Version strings are fragile; ancestry is exact and
          # monotonic: if our commit is an ancestor of theirs, theirs is
          # newer-or-equal. That is precisely what the bisect needs.
          if git -C m2 merge-base --is-ancestor "$OURS" "$HEAD_M2" 2>/dev/null; then
            echo "  Their M2-Planet is NEWER than ours (ours is an ancestor)."
            echo "  Bisecting live-bootstrap for the FIRST commit at or past our pin..."
            newer=yes
          elif git -C m2 merge-base --is-ancestor "$HEAD_M2" "$OURS" 2>/dev/null; then
            echo "OUTCOME 2: NO live-bootstrap commit reaches our M2-Planet pin."
            echo "  Even HEAD pins an OLDER M2-Planet than ours."
            echo
            echo "  CLOSEST AVAILABLE SET (live-bootstrap HEAD):"
            printf '    %-14s %s  %s\n' 'M2-Planet' "$HEAD_M2" "$(describe "$HEAD_M2")"
            printf '    %-14s %s\n' 'stage0-posix' "$S0_HEAD"
            printf '    %-14s %s\n' 'mes' '0.27.1'
            printf '    %-14s %s\n' 'tcc' '0.9.27'
            echo "    behind ours by: $(git -C m2 rev-list --count "$HEAD_M2".."$OURS") commits"
            echo
            echo "  DECISION: move our M2-Planet pin back to theirs so the set is"
            echo "  coherent, or keep ours and accept Mes built by a newer compiler"
            echo "  than upstream tests together."
            exit 0
          else
            echo "OUTCOME 3: our pin and theirs are on DIVERGENT branches (neither"
            echo "  is an ancestor of the other). That needs a human decision."
            exit 0
          fi

          mapfile -t C < <(git -C lb rev-list --first-parent --reverse HEAD)
          lo=0; hi=$(( ${#C[@]} - 1 )); n=0
          while [ "$lo" -lt "$hi" ]; do
            mid=$(( (lo + hi) / 2 )); n=$(( n + 1 ))
            v=$(m2_of_lb "${C[$mid]}" || true)
            if [ -n "$v" ] && git -C m2 merge-base --is-ancestor "$OURS" "$v" 2>/dev/null
            then hi=$mid; else lo=$(( mid + 1 )); fi
            printf '    probe %-2s %s  M2=%s -> %s..%s\n' "$n" \
              "$(git -C lb log -1 --format=%cs "${C[$mid]}")" "$(describe "${v:-HEAD}")" "$lo" "$hi"
          done
          F="${C[$lo]}"
          echo
          echo "OUTCOME 1: first live-bootstrap commit at or past our M2-Planet pin"
          printf '    %-14s %s  (%s)\n' 'lb commit' "$F" "$(git -C lb log -1 --format=%cs "$F")"
          printf '    %-14s %s\n' 'stage0-posix' "$(git -C lb ls-tree "$F" -- seed/stage0-posix | awk '{print $3}')"
          printf '    %-14s %s  %s\n' 'M2-Planet' "$(m2_of_lb "$F")" "$(describe "$(m2_of_lb "$F")")"
          for st in mes tcc; do
            printf '    %-14s %s\n' "$st" "$(git -C lb ls-tree -r --name-only "$F" -- steps/ \
              | sed -n "s|^steps/$st-\([0-9][0-9.]*\)/.*|\1|p" | sort -V -u | tail -1)"
          done
          echo
          echo "  USE THIS live-bootstrap COMMIT for the Mes rung: $F"
