name: tcc-gcc-miscompile-check

# DID tcc MISCOMPILE THE COMPILER?
#
# RUN 2 RESULT, AND WHY IT IS NOT YET AN ANSWER.
#
#   gate 0  control (-O2 vs -O1)             ok
#   gate 1  generated sources                7 of 21 DIFFER
#   gate 2  gcc's own translation units      233 of 333 DIFFER
#   gate 3  libgcc's translation units       16 of 16 identical
#
# Two of those numbers are probably the harness again, and this run is built to
# settle that rather than argue about it.
#
#   GATE 2 WAS CONFOUNDED. The flags are scraped from the build log and they
#   begin `-I. -I.`, which is relative to the working directory. Run 2 invoked
#   xgcc_H from bH/gcc and xgcc_T from bT/gcc, so each compiler read ITS OWN
#   generated headers -- including insn-codes.h and insn-flags.h, which gate 1
#   had just reported as differing, and which most of gcc's sources include.
#   Different input, different output. That says nothing about codegen.
#
#   FIX: run BOTH compilers from the SAME directory, so the compiler binary is
#   the only variable. That is what gate 2 was supposed to be.
#
#   GATE 1 HAD NO CONTROL. Seven files differ; the obvious reading is that tcc
#   miscompiled a generator. But gcc 4.7's generators hash and sort their way
#   through the machine description, and hashing on pointer values gives an
#   order that depends on heap layout -- which differs between two binaries
#   built by different compilers, and can differ between two RUNS of one binary
#   under ASLR. If the generators are not reproducible, comparing their output
#   across trees measures the allocator.
#
#   FIX: run each generator TWICE in the SAME tree and compare. H vs H. If that
#   differs, the file is nondeterministic and H vs T tells us nothing about it.
#   This is the control gate 1 should have had, and its absence is the same
#   mistake as run 1's: a verdict with no evidence the comparison could tell
#   "same" from "different".
#
# GATE 3 IS THE ONE CLEAN RESULT SO FAR, and it is clean in a way that supports
# the confound theory: libgcc's sources do not include insn-codes.h or
# insn-flags.h, so its 16 translation units were the only ones both compilers
# saw identical input for -- and they agreed.
#
# ---------------------------------------------------------------------------
# A REAL BUG, FOUND BY THE STEP THAT WAS NOT PART OF THE TEST.
#
#   g474/libgcc/unwind-dw2.c: In function 'uw_init_context_1':
#   g474/libgcc/unwind-dw2.c:1490:44: internal compiler error: Segmentation fault
#
# THE BACKPORTED COMPILER ICEs, in the arm built by the HOST gcc. tcc is not
# involved. This is why libgcc never finishes, why libgcc.a does not exist, and
# why run 1's stage 2 could not configure. It is a transplant bug --
# uw_init_context_1 is dwarf2 unwinder setup, exactly the kind of
# backend<->middle-end interface the backport crossed.
#
# Fixing it is not this workflow's job, but one cheap question is worth asking:
# does the tcc-built compiler ICE in the SAME place? Two compilers failing
# identically is still agreement; a different failure would be a real
# divergence. The last step asks that and nothing else, replacing the
# ten-minute full `make` that has already told us all it can.

on:
  push:
    # BRANCHES ONLY -- NEVER TAGS. Without this a `push:` with only a
    # `paths:` filter still fires on TAG pushes, because a tag carries the
    # whole commit and its paths match. Creating one mirror release tag
    # (`gh release create src/<tarball>`) therefore kicked off 19 workflows
    # at once. `branches: ['**']` matches every branch and no tag.
    branches: ['**']
    paths:
      - '.github/workflows/tcc-gcc-miscompile-check.yml'
  workflow_dispatch:

# A NEW PUSH MUST NOT KILL A RUNNING BUILD. Cancelling in flight is right for a
# fast check and wrong for a multi-hour box: one push to fix a typo cancelled
# four in-flight hermetic runs and restarted them from zero. Long jobs queue
# instead. (The setting is spelled out below rather than named here, because a
# key:value written in prose is what a later grep will match first.)
concurrency:
  group: tcc-gcc-miscompile-${{ github.ref }}
  cancel-in-progress: false

env:
  GNU: 'https://mirrors.kernel.org/gnu'
  GNU2: 'https://ftpmirror.gnu.org'
  SHA474: '92e61c6dc3a0a449e62d72a38185fda550168a86702dea07125ebd3ec3996282'
  SHA485: '22fb1e7e0f68a63cee631d85b20461d1ea6bda162f03096350e38c8d427ecf23'

jobs:
  ddc:
    name: 'differential: host-gcc-built cc1 vs tcc-built cc1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: 'Confirm this is really aarch64'
        run: |
          set -eu
          echo "  uname -m : $(uname -m)"
          [ "$(uname -m)" = aarch64 ] || { echo "  NOT aarch64 -- aborting"; exit 1; }

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl git bzip2 xz-utils gcc make bison flex texinfo m4 perl \
            file binutils

      - name: 'Build OUR arm64 tcc'
        run: |
          set -eu
          git clone -q git://repo.or.cz/tinycc.git tccsrc \
            || git clone -q https://repo.or.cz/tinycc.git tccsrc
          bash spikes/stage3/patches/tcc-arm64-asm/apply-series.sh tccsrc | tail -3
          cd tccsrc
          ./configure --cc=gcc > /dev/null
          make -j"$(nproc)" > /dev/null
          ./tcc -v
          ./tcc -v 2>&1 | grep -q AArch64 || { echo "  tcc is not an AArch64 build"; exit 1; }
          echo "TCC=$PWD/tcc"  >> "$GITHUB_ENV"
          echo "TCCDIR=$PWD"   >> "$GITHUB_ENV"

      - name: 'Fetch gcc (hash-verified) and transplant the backend'
        run: |
          set -eu
          F=tools/fetch-pinned.sh
          bash "$F" g474 "$HOME/.cache/veron/gcc-4.7.4.tar.bz2" "$SHA474" \
            "$GNU/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2 $GNU2/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2" "" "" | sed 's/^/  /'
          bash "$F" g485 "$HOME/.cache/veron/gcc-4.8.5.tar.bz2" "$SHA485" \
            "$GNU/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2 $GNU2/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2" "" "" | sed 's/^/  /'
          bash spikes/stage4/probes/backport-aarch64.sh g474 g485 | tail -4
          echo "W=$PWD" >> "$GITHUB_ENV"
          mkdir -p man diffs

      - name: 'Prerequisites, per arm, by that arm''s compiler'
        run: |
          set -eu
          for arm in H T; do
            case $arm in
              H) CC="gcc" ;;
              T) CC="$TCC -B$TCCDIR" ;;
            esac
            mkdir -p "prefix-$arm"
            echo "  ===== $arm ====="
            curl -sSL -o gmp.tar.xz "$GNU/gmp/gmp-6.2.1.tar.xz"
            rm -rf gmp && mkdir -p gmp && tar xf gmp.tar.xz -C gmp --strip-components=1
            ( cd gmp && ./configure CC="$CC" --disable-shared --disable-assembly \
                --prefix="$W/prefix-$arm" > c.log 2>&1 \
              && make -j"$(nproc)" > b.log 2>&1 && make install > /dev/null 2>&1 \
              && echo "    gmp ok" ) || { echo "    gmp FAILED for $arm"; exit 1; }
            for p in mpfr-4.1.0 mpc-1.2.1; do
              case $p in
                mpfr*) u="$GNU/mpfr/$p.tar.xz" ;;
                mpc*)  u="$GNU/mpc/$p.tar.gz"  ;;
              esac
              curl -sSL -o "$p.tar" "$u"
              rm -rf "$p" && mkdir -p "$p" && tar xf "$p.tar" -C "$p" --strip-components=1 2>/dev/null
              ( cd "$p" && ./configure CC="$CC" --disable-shared \
                  --with-gmp="$W/prefix-$arm" --prefix="$W/prefix-$arm" > c.log 2>&1 \
                && make -j"$(nproc)" > b.log 2>&1 && make install > /dev/null 2>&1 \
                && echo "    $p ok" ) || { echo "    $p FAILED for $arm"; exit 1; }
            done
          done

      - name: 'Build gcc twice: all-gcc only'
        run: |
          set -eu
          for arm in H T; do
            case $arm in
              H) CC="gcc" ;;
              T) CC="$TCC -B$TCCDIR" ;;
            esac
            echo "  ===== $arm ====="
            mkdir -p "b$arm" && cd "b$arm"
            set +e
            "$W/g474/configure" CC="$CC" \
              --build=aarch64-unknown-linux-gnu \
              --host=aarch64-unknown-linux-gnu \
              --target=aarch64-unknown-linux-gnu \
              --prefix="$W/out-$arm" --enable-languages=c \
              --disable-multilib --disable-bootstrap --disable-werror \
              --disable-libsanitizer --disable-libgomp --disable-libquadmath \
              --disable-libssp --disable-libatomic --disable-shared \
              --with-gmp="$W/prefix-$arm" --with-mpfr="$W/prefix-$arm" \
              --with-mpc="$W/prefix-$arm" > conf.log 2>&1
            rc=$?; echo "    configure rc=$rc"
            [ "$rc" -eq 0 ] || { tail -20 conf.log | sed 's/^/      /'; exit 1; }
            timeout 7200 make -j"$(nproc)" -Otarget MAKEINFO=true all-gcc > build.log 2>&1
            echo "    make rc=$?  errors: $(grep -cE '\berror:' build.log || true)"
            grep -E '\berror:' build.log | head -5 | sed 's/^/      /'
            echo "    cc1 : $( [ -x gcc/cc1 ] && wc -c < gcc/cc1 || echo MISSING)"
            set -e
            [ -x gcc/cc1 ] && [ -x gcc/xgcc ] || { echo "    cannot continue"; exit 1; }
            cd "$W"
          done

      - name: 'Extract the compile flags from the build itself'
        run: |
          set -eu
          L=$(grep -m1 -E ' -c .*[/ ]tree\.c' bH/build.log || true)
          [ -n "$L" ] || L=$(grep -m1 -E ' -c .*\.c( |$)' bH/build.log || true)
          [ -n "$L" ] || { echo "  no compile line found"; exit 1; }
          FLAGS=$(for t in $L; do case "$t" in -I*|-D*) printf '%s ' "$t";; esac; done)
          echo "  extracted: $(printf '%s' "$FLAGS" | wc -w) -I/-D flags"
          # The leading `-I. -I.` is why run 2's gate 2 meant nothing. It stays,
          # because it is what the build really uses. What changes is that both
          # compilers now run from the SAME directory, so `.` is one place.
          printf '%s\n' "$FLAGS" > "$W/flags.txt"

      - name: 'GATE 0 (control): the comparison must be able to fail'
        if: always()
        continue-on-error: true
        run: |
          set -eu
          cd "$W/bH/gcc"
          FLAGS=$(cat "$W/flags.txt")
          set +e
          ./xgcc -B./ -S $FLAGS -O2 "$W/g474/gcc/tree.c" -o /tmp/c-O2.s 2>/dev/null
          ./xgcc -B./ -S $FLAGS -O1 "$W/g474/gcc/tree.c" -o /tmp/c-O1.s 2>/dev/null
          set -e
          if [ ! -s /tmp/c-O2.s ] || [ ! -s /tmp/c-O1.s ]; then
            echo "  CONTROL INCONCLUSIVE: could not compile the control file."
            echo "G0=inconclusive" >> "$GITHUB_ENV"; exit 0
          fi
          if cmp -s /tmp/c-O2.s /tmp/c-O1.s; then
            echo "  CONTROL FAILED: -O2 and -O1 gave identical assembly."
            echo "G0=BROKEN" >> "$GITHUB_ENV"; exit 1
          fi
          echo "  CONTROL OK: same compiler, -O2 vs -O1, assembly differs as it must."
          echo "G0=ok" >> "$GITHUB_ENV"

      - name: 'GATE 1a (control): are the generators even deterministic?'
        if: always()
        continue-on-error: true
        run: |
          set -eu
          set +e
          # H vs H: regenerate each file IN THE SAME TREE and compare against
          # what is already there. If it changes, the generator is not
          # reproducible and comparing its output ACROSS trees measures the
          # allocator rather than the compiler.
          #
          # RUN 3 FAILED HERE BY PARSING THE MAKEFILE. `md_file` is literally
          #     md_file = $(srcdir)/config/aarch64/aarch64.md
          # and sed does not expand make variables, so the path never existed
          # and the control reported "not run". Guessing each generator's
          # argument list was the wrong approach anyway -- genattrtab and
          # genrecog do not all take the same arguments.
          #
          # ASK make INSTEAD. Delete the stamp file and request the target: the
          # build system then runs the generator exactly as it did the first
          # time, with whatever arguments that takes. gcc pipes the output
          # through move-if-change, so the file on disk is REPLACED only if the
          # content actually differs -- which is precisely the comparison we
          # want, performed by gcc's own machinery.
          cd "$W/bH/gcc"
          nd=0; det=0; miss=0
          : > "$W/man/nondeterministic.txt"
          for pair in insn-emit.c:s-emit insn-recog.c:s-recog \
                      insn-extract.c:s-extract insn-output.c:s-output \
                      insn-attrtab.c:s-attrtab insn-codes.h:s-codes \
                      insn-flags.h:s-flags; do
            f=${pair%%:*}; s=${pair##*:}
            if [ ! -f "$f" ]; then miss=$((miss+1)); printf '    %-16s absent\n' "$f"; continue; fi
            cp "$f" "/tmp/first-$f"
            rm -f "$s"
            timeout 900 make -s MAKEINFO=true "$f" > "/tmp/regen-$f.log" 2>&1
            rc=$?
            if [ "$rc" -ne 0 ] || [ ! -s "$f" ]; then
              miss=$((miss+1))
              printf '    %-16s could not regenerate (rc=%s)\n' "$f" "$rc"
              head -3 "/tmp/regen-$f.log" | sed 's/^/        /'
              continue
            fi
            if cmp -s "/tmp/first-$f" "$f"; then
              det=$((det+1)); printf '    %-16s reproducible\n' "$f"
            else
              nd=$((nd+1)); printf '    %-16s NOT REPRODUCIBLE (same tree, regenerated)\n' "$f"
              echo "$f" >> "$W/man/nondeterministic.txt"
              diff "/tmp/first-$f" "$f" > "$W/diffs/regen-$f.diff" 2>&1
              echo "        diff lines: $(wc -l < "$W/diffs/regen-$f.diff")"
              head -6 "$W/diffs/regen-$f.diff" | sed 's/^/          /'
            fi
          done
          echo "  reproducible: $det   not reproducible: $nd   not measured: $miss"
          # Two empty files compare equal. A control that can report "clean"
          # because it measured nothing is the exact failure this gate exists to
          # prevent, so not-measured is its own state and never counts as pass.
          if [ "$nd" -gt 0 ]; then
            echo "  -> gate 1b is UNINTERPRETABLE for those files."
            echo "G1A=nondeterministic" >> "$GITHUB_ENV"
          elif [ "$det" -eq 0 ]; then
            echo "  -> nothing was measured; gate 1b has no control."
            echo "G1A=n/a" >> "$GITHUB_ENV"
          else
            echo "  -> $det files reproduce, so a gate 1b difference in them is real."
            echo "G1A=deterministic" >> "$GITHUB_ENV"
          fi

      - name: 'GATE 1b: the generated sources, H vs T'
        if: always()
        continue-on-error: true
        run: |
          set -eu
          set +e
          n=0; d=0
          for f in $(cd bH/gcc && ls insn-*.c insn-*.h tm.h tm_p.h gtype-desc.c 2>/dev/null); do
            [ -f "bT/gcc/$f" ] || continue
            n=$((n+1))
            if ! cmp -s "bH/gcc/$f" "bT/gcc/$f"; then
              d=$((d+1))
              echo "    DIFFERS: $f"
              diff "bH/gcc/$f" "bT/gcc/$f" > "diffs/gen-$f.diff" 2>&1
              # PRINT the difference. Run 2 printed names only, and a name
              # cannot distinguish a reordered table from a wrong one.
              echo "      diff lines: $(wc -l < "diffs/gen-$f.diff")   first few:"
              head -10 "diffs/gen-$f.diff" | sed 's/^/        /'
            fi
          done
          echo "  compared: $n   differing: $d"
          if [ "$n" -eq 0 ]; then echo "G1=n/a" >> "$GITHUB_ENV"
          elif [ "$d" -eq 0 ]; then echo "  IDENTICAL"; echo "G1=identical" >> "$GITHUB_ENV"
          else echo "G1=DIFFER" >> "$GITHUB_ENV"; fi

      - name: 'GATE 1c: WHY the generated sources differ -- the pattern set'
        if: always()
        continue-on-error: true
        run: |
          set -eu
          set +e
          # RUN 3 ANSWERED GATE 1b's QUESTION IN ITS OWN DIFF, and the answer is
          # not a miscompilation:
          #
          #   insn-codes.h   H: #define CODE_FOR_loadwb_pairsi_si CODE_FOR_nothing
          #                  T:         CODE_FOR_loadwb_pairsi_si = <a real number>
          #   insn-emit.c    T has gen_loadwb_pairsi_si; H does not
          #   everything else  case 603 -> case 607, output_51 -> output_55,
          #                  gen_split_1872 -> gen_split_1876   (a +4 shift)
          #
          # CODE_FOR_nothing is how gcc records a pattern it DROPPED because its
          # condition is constant-false at compile time. The H build proved four
          # conditions false and deleted those patterns; the T build did not, so
          # every insn code after them shifts by four and six files change
          # without a single instruction changing.
          #
          # The mechanism is gcc's own: genconditions writes gencondmd.c, which
          # folds insn conditions at compile time -- and it can only do that when
          # the compiler building it is GCC. Built by anything else, no condition
          # is known false and no pattern is dropped. Same family as the missing
          # dead-code elimination in TCC-USERLAND.md, and benign in the same way:
          # the extra patterns carry conditions that are false at run time too,
          # so they never match. Gates 2 and 3 are what confirm that.
          #
          # This gate stops it being a story. Count it.
          for arm in H T; do
            f="b$arm/gcc/insn-codes.h"
            [ -f "$f" ] || { echo "  $arm: no insn-codes.h"; continue; }
            printf '  %s  patterns dropped as constant-false: %s   live: %s\n' \
              "$arm" \
              "$(grep -c 'CODE_FOR_nothing$' "$f" || true)" \
              "$(grep -cE '^  CODE_FOR_[A-Za-z0-9_]+ = [0-9]+,' "$f" || true)"
          done
          echo "  --- patterns H dropped and T kept ---"
          grep -oE 'CODE_FOR_[A-Za-z0-9_]+' bH/gcc/insn-codes.h 2>/dev/null \
            | sort -u > /tmp/hc.txt
          grep -E 'CODE_FOR_nothing$' bH/gcc/insn-codes.h 2>/dev/null \
            | grep -oE 'CODE_FOR_[A-Za-z0-9_]+' | grep -v 'CODE_FOR_nothing' \
            | sort -u > /tmp/h-dropped.txt
          grep -E 'CODE_FOR_nothing$' bT/gcc/insn-codes.h 2>/dev/null \
            | grep -oE 'CODE_FOR_[A-Za-z0-9_]+' | grep -v 'CODE_FOR_nothing' \
            | sort -u > /tmp/t-dropped.txt
          echo "    dropped only by H: $(comm -23 /tmp/h-dropped.txt /tmp/t-dropped.txt | wc -l)"
          comm -23 /tmp/h-dropped.txt /tmp/t-dropped.txt | head -12 | sed 's/^/      /'
          echo "    dropped only by T: $(comm -13 /tmp/h-dropped.txt /tmp/t-dropped.txt | wc -l)"
          comm -13 /tmp/h-dropped.txt /tmp/t-dropped.txt | head -12 | sed 's/^/      /'
          # If the ONLY difference is patterns H dropped and T kept, the T
          # compiler is a superset that carries dead entries -- not a different
          # compiler. If T dropped something H kept, that is the opposite and
          # would be serious.
          onlyT=$(comm -13 /tmp/h-dropped.txt /tmp/t-dropped.txt | wc -l)
          if [ "$onlyT" -eq 0 ]; then
            echo "  T drops nothing H keeps -- T is a superset, carrying dead patterns."
            echo "G1C=superset" >> "$GITHUB_ENV"
          else
            echo "  T DROPPED patterns H KEPT. That is not the benign direction."
            echo "G1C=asymmetric" >> "$GITHUB_ENV"
          fi

      - name: 'GATE 2: same directory, same headers, only the compiler differs'
        if: always()
        continue-on-error: true
        run: |
          set -eu
          set +e
          # BOTH compilers run from bH/gcc, so `-I.` resolves to one place and
          # both read the SAME generated headers. Whatever gate 1b says about
          # those headers is now irrelevant here: the only difference between
          # the two invocations is which cc1 runs.
          FLAGS=$(cat "$W/flags.txt")
          XH="$W/bH/gcc/xgcc -B$W/bH/gcc/"
          XT="$W/bT/gcc/xgcc -B$W/bT/gcc/"
          cd "$W/bH/gcc"
          same=0; diff_n=0; skip=0
          : > "$W/man/gate2-differing.txt"
          for src in "$W"/g474/gcc/*.c; do
            b=$(basename "$src" .c)
            $XH -S $FLAGS -O2 "$src" -o /tmp/H.s 2>/dev/null; rcH=$?
            $XT -S $FLAGS -O2 "$src" -o /tmp/T.s 2>/dev/null; rcT=$?
            if [ $rcH -ne 0 ] && [ $rcT -ne 0 ]; then skip=$((skip+1)); continue; fi
            if [ $rcH -ne $rcT ]; then
              diff_n=$((diff_n+1))
              echo "$b (H rc=$rcH T rc=$rcT -- one compiler failed)" >> "$W/man/gate2-differing.txt"
              continue
            fi
            if cmp -s /tmp/H.s /tmp/T.s; then
              same=$((same+1))
            else
              diff_n=$((diff_n+1)); echo "$b" >> "$W/man/gate2-differing.txt"
              diff /tmp/H.s /tmp/T.s > "$W/diffs/gate2-$b.diff" 2>&1
            fi
          done
          echo "  translation units: identical=$same  differing=$diff_n  not in this build=$skip"
          if [ $((same + diff_n)) -eq 0 ]; then echo "G2=n/a" >> "$GITHUB_ENV"
          elif [ "$diff_n" -eq 0 ]; then
            echo "  IDENTICAL across all $same translation units."
            echo "G2=identical" >> "$GITHUB_ENV"
          else
            echo "  differing:"; head -20 "$W/man/gate2-differing.txt" | sed 's/^/    /'
            echo "  --- the smallest difference, in full ---"
            f=$(ls -S "$W"/diffs/gate2-*.diff 2>/dev/null | tail -1)
            [ -n "${f:-}" ] && { echo "    $f"; head -25 "$f" | sed 's/^/    /'; }
            echo "G2=DIFFER" >> "$GITHUB_ENV"
          fi

      - name: 'GATE 3: libgcc''s sources, same directory'
        if: always()
        continue-on-error: true
        run: |
          set -eu
          set +e
          FLAGS=$(cat "$W/flags.txt")
          XH="$W/bH/gcc/xgcc -B$W/bH/gcc/"
          XT="$W/bT/gcc/xgcc -B$W/bT/gcc/"
          cd "$W/bH/gcc"
          same=0; diff_n=0; skip=0
          : > "$W/man/gate3-differing.txt"
          for src in "$W"/g474/libgcc/*.c "$W"/g474/libgcc/config/aarch64/*.c; do
            [ -f "$src" ] || continue
            b=$(basename "$src" .c)
            $XH -S $FLAGS -O2 "$src" -o /tmp/H.s 2>/dev/null; rcH=$?
            $XT -S $FLAGS -O2 "$src" -o /tmp/T.s 2>/dev/null; rcT=$?
            if [ $rcH -ne 0 ] && [ $rcT -ne 0 ]; then skip=$((skip+1)); continue; fi
            if [ $rcH -ne $rcT ] || ! cmp -s /tmp/H.s /tmp/T.s; then
              diff_n=$((diff_n+1)); echo "$b" >> "$W/man/gate3-differing.txt"
              diff /tmp/H.s /tmp/T.s > "$W/diffs/gate3-$b.diff" 2>&1
            else
              same=$((same+1))
            fi
          done
          echo "  translation units: identical=$same  differing=$diff_n  skipped=$skip"
          if [ $((same + diff_n)) -eq 0 ]; then echo "G3=n/a" >> "$GITHUB_ENV"
          elif [ "$diff_n" -eq 0 ]; then
            echo "  IDENTICAL across all $same translation units."
            echo "G3=identical" >> "$GITHUB_ENV"
          else
            head -20 "$W/man/gate3-differing.txt" | sed 's/^/    /'
            echo "G3=DIFFER" >> "$GITHUB_ENV"
          fi

      - name: 'THE ICE: does the tcc-built compiler fail the same way?'
        if: always()
        continue-on-error: true
        run: |
          set -eu
          set +e
          # RUN 3 GOT THIS WRONG TWICE.
          #
          #   1. It compiled unwind-dw2.c with GCC's OWN build flags, and libgcc
          #      needs libgcc's: both arms died on `libgcc_tm.h: No such file or
          #      directory`, which is a missing include path, not an ICE. The
          #      flags for libgcc live in the libgcc build directory, which
          #      all-gcc never creates.
          #
          #   2. Its comparison then printed "ASYMMETRIC: one compiled it and
          #      the other did not" when NEITHER had. Both failed identically
          #      and the harness called that a divergence -- the same class of
          #      bug as reporting a missing file as a difference.
          #
          # Ask the build system instead. `make all-target-libgcc` configures
          # libgcc, generates libgcc_tm.h, and compiles with the right flags --
          # and stops exactly where run 2's full make stopped.
          for arm in H T; do
            echo "  ----- $arm -----"
            ( cd "$W/b$arm" && timeout 3600 make -k -j"$(nproc)" MAKEINFO=true \
                all-target-libgcc > "$W/libgcc-$arm.log" 2>&1 )
            echo "    make rc=$?"
            echo "    objects built: $(find "$W/b$arm" -path '*libgcc*' -name '*.o' 2>/dev/null | wc -l)"
            echo "    libgcc.a     : $(find "$W/b$arm" -name libgcc.a 2>/dev/null | head -1 || echo 'NOT BUILT')"
            grep -E 'internal compiler error|fatal error|error:' "$W/libgcc-$arm.log" \
              | head -4 | sed 's/^/      /'
            # Normalise the arm's own build path out so the two are comparable.
            grep -oE '[^ ]*\.c:[0-9]+:[0-9]+: (internal compiler error|fatal error|error):.*' \
              "$W/libgcc-$arm.log" | sed "s|$W/b$arm|<build>|g" | sort -u \
              > "$W/man/libgcc-fail-$arm.txt"
          done
          echo "  ----- comparison -----"
          if [ ! -s "$W/man/libgcc-fail-H.txt" ] && [ ! -s "$W/man/libgcc-fail-T.txt" ]; then
            echo "    NEITHER failed -- libgcc built under both compilers."
          elif diff -q "$W/man/libgcc-fail-H.txt" "$W/man/libgcc-fail-T.txt" > /dev/null 2>&1; then
            echo "    BOTH failed, identically:"
            head -3 "$W/man/libgcc-fail-H.txt" | sed 's/^/      /'
            echo "    Agreement in failure is still agreement -- the compilers match."
          else
            echo "    THE TWO FAIL DIFFERENTLY. That is a real divergence:"
            diff "$W/man/libgcc-fail-H.txt" "$W/man/libgcc-fail-T.txt" | head -10 | sed 's/^/      /'
          fi

      - name: 'VERDICT'
        if: always()
        run: |
          set -eu
          printf '  %-40s %s\n' 'gate 0   comparison can fail'       "${G0:-not reached}"
          printf '  %-40s %s\n' 'gate 1a  generators reproducible?'  "${G1A:-not reached}"
          printf '  %-40s %s\n' 'gate 1b  generated sources H vs T'  "${G1:-not reached}"
          printf '  %-40s %s\n' 'gate 1c  pattern set'               "${G1C:-not reached}"
          printf '  %-40s %s\n' 'gate 2   gcc TUs, same headers'     "${G2:-not reached}"
          printf '  %-40s %s\n' 'gate 3   libgcc TUs, same headers'  "${G3:-not reached}"
          echo
          if [ "${G0:-}" != ok ]; then
            echo "  The control did not pass. Nothing above it is evidence."
            exit 1
          fi
          if [ "${G2:-}" = identical ] && [ "${G3:-}" = identical ]; then
            echo "  NO MISCOMPILATION DETECTED IN CODEGEN."
            echo "  Given identical input, the tcc-built cc1 and the gcc-built cc1"
            echo "  emit identical assembly for every translation unit in gcc and"
            echo "  in libgcc."
            echo
            case "${G1C:-}" in
              superset)
                echo "  Gate 1b's differing files are accounted for: the tcc-built"
                echo "  tree keeps patterns the gcc-built tree proved constant-false"
                echo "  and dropped, which shifts every insn code after them. Dead"
                echo "  entries in a table, not different code -- and gates 2 and 3"
                echo "  are what make that a measurement rather than a claim." ;;
              asymmetric)
                echo "  BUT gate 1c found patterns the tcc-built tree DROPPED and the"
                echo "  gcc-built tree kept. That is the dangerous direction: a"
                echo "  missing pattern is a compiler that cannot emit an"
                echo "  instruction. Investigate before trusting this." ;;
              *)
                echo "  Gate 1c did not run, so gate 1b's differences are unexplained." ;;
            esac
          else
            echo "  Not clean. Before concluding anything: check whether ALL units"
            echo "  differ. All differing is a harness signature -- runs 1 and 2"
            echo "  were both lost to exactly that."
          fi
          echo
          echo "  Separately, and not a tcc question: the backported compiler ICEs"
          echo "  on libgcc/unwind-dw2.c at uw_init_context_1 under the host gcc"
          echo "  too. libgcc cannot be built until that is fixed."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-diffs
          path: |
            man
            diffs
          if-no-files-found: warn
