name: gcc-entrypoint-probe

# SPIKE. WHERE CAN OUR CHAIN ENTER gcc ON AARCH64?
#
# WHAT gcc-chain-probe TURNED UP. Building gcc 4.7.4 on aarch64 dies at
# configure with "cannot guess build type" -- UNAME_MACHINE = aarch64, and its
# 2013 config.guess does not know the architecture. The likely reason is that
# AArch64 support landed in GCC 4.8, contributed by ARM in March 2013.
#
# AND 4.8 IS ALSO THE RELEASE THAT SWITCHED TO C++. If both are true then on
# aarch64:
#
#     oldest gcc with an aarch64 backend  = 4.8
#     oldest gcc requiring a C++ compiler = 4.8      <- the same version
#
# ...which is a genuine gap: the last C-buildable gcc cannot target our
# architecture, and the first gcc that can needs a C++ compiler nothing below it
# provides. tcc does not do C++.
#
# BUT BOTH HALVES ARE INFERENCE, NOT MEASUREMENT, and today has been a long
# argument for not acting on inference. "4.7 has no aarch64 backend" is read off
# a config.guess failure that an explicit --build= might sidestep. "4.8 needs
# C++" is read off release notes. This probe settles both by looking.
#
#   JOB A  Does gcc 4.7.4 ship an aarch64 backend at all? Does 4.8.5? What does
#          each declare about C++? Cheap -- extract and grep, no building.
#
#   JOB B  If the gap is real, can tcc get gcc 4.8 configured anyway? gcc's
#          CORE being C++ means CXX is required even for --enable-languages=c,
#          but that is exactly the kind of received claim worth testing. Also
#          retries GMP with --disable-assembly, which is the obvious reason it
#          failed under tcc last time (hand-written asm paths).
#
# RUN 1 RESULT -- ONE CLAIM CONFIRMED, ONE REFUTED.
#   CONFIRMED: gcc 4.7.4 has NO aarch64 anywhere (config/ has arm only;
#     config.guess 0, config.sub 0, config.gcc 0). 4.8.5 has it everywhere
#     (25 hits in config.gcc). No --build= rescues 4.7 -- it is a dead end here.
#   REFUTED: 4.8.5 does NOT demand C++11 or hard-require CXX. install.texi says
#     "ISO C++98 compiler", configure has zero hard CXX requirements, gcc/ is
#     360 .c files and 0 .cc, and it CONFIGURED CLEANLY with CC=tcc and
#     CXX=/bin/false (rc=0, merely noting "using the GNU C++ compiler... no").
#   Also: tcc built GMP (--disable-assembly), MPFR and MPC -- all three
#     prerequisites installed.
#   So the entry point may be gcc 4.8 built directly by tcc, with no C++ rung
#   and no cross-arch detour. Configure passing is not building, so run 2 makes
#   it and reports where it lands.
#
# RUN 2 RESULT -- THE "REFUTED" WAS WRONG. Building gcc 4.8 with CXX=/bin/false
# fails: "error: C++ compiler missing or inoperational". The TOP-LEVEL configure
# is lenient and passes; the gcc/ SUBDIRECTORY configure enforces CXX, and that
# is where it dies. So gcc 4.8 does require a working C++ compiler and the gap
# on aarch64 is real: 4.7 has no backend, 4.8 needs C++.
#   BUT gcc 4.8's gcc/ is 360 .c files and 0 .cc -- the same sources 4.7 built
#   with a C compiler. Run 3 satisfies configure with the host g++ and then
#   overrides CXX with tcc at BUILD time, so every resulting error is a genuine
#   C++-ism. The count of error classes is the size of the "patch 4.8 to build
#   with C" option -- the only escape that keeps the chain native aarch64.
#
# FOUR ROADMAPS HANG ON THE ANSWER: cross-compile the entry point (reintroduces
# the arch detour we just deleted), find a C-buildable C++ compiler, patch 4.8
# to build with C, or accept one labelled borrowed rung. Do not pick before
# measuring.

on:
  push:
    paths:
      - '.github/workflows/gcc-entrypoint-probe.yml'
  workflow_dispatch:

# A NEW PUSH MUST NOT KILL A RUNNING BUILD. Cancelling in flight is right for a
# fast check and wrong for a long probe. Long jobs queue instead.
concurrency:
  group: gcc-entrypoint-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  GNU: 'https://mirrors.kernel.org/gnu'

jobs:

  backend-boundary:
    name: 'A: which gcc versions have aarch64, and which demand C++'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl bzip2 xz-utils

      - name: 'Fetch 4.7.4 and 4.8.5 (the suspected boundary)'
        run: |
          set -eu
          curl -sSL -o g47.tar.bz2 "$GNU/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2"
          curl -sSL -o g48.tar.bz2 "$GNU/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2"
          mkdir -p g47 g48
          tar xf g47.tar.bz2 -C g47 --strip-components=1
          tar xf g48.tar.bz2 -C g48 --strip-components=1
          echo "  4.7.4 $(du -sh g47 | cut -f1)   4.8.5 $(du -sh g48 | cut -f1)"

      - name: 'THE FIRST CLAIM: does 4.7 have an aarch64 backend?'
        run: |
          for v in 47 48; do
            echo "=== gcc $v ==="
            echo "  --- gcc/config entries mentioning aarch64/arm ---"
            ls "g$v/gcc/config" | grep -iE 'aarch64|^arm$' | sed 's/^/    /' || echo "    (none)"
            echo "  --- does config.guess know aarch64? ---"
            grep -c aarch64 "g$v/config.guess" | sed 's/^/    matches: /'
            echo "  --- is aarch64 a recognised target in config.sub? ---"
            grep -c aarch64 "g$v/config.sub" | sed 's/^/    matches: /'
            echo "  --- listed in gcc/config.gcc? ---"
            grep -c 'aarch64' "g$v/gcc/config.gcc" | sed 's/^/    matches: /'
            echo
          done
          echo "  If 4.7 shows zero across the board and 4.8 shows nonzero, the"
          echo "  boundary is confirmed and no --build= flag can rescue 4.7."

      - name: 'THE SECOND CLAIM: does 4.8 require a C++ compiler?'
        run: |
          for v in 47 48; do
            echo "=== gcc $v ==="
            echo "  --- what install.texi says about the build compiler ---"
            grep -iE 'ISO C\+\+|C\+\+ compiler|written in C\+\+|bootstrap.*C\+\+' \
              "g$v/gcc/doc/install.texi" | head -8 | sed 's/^/    /' || echo "    (nothing)"
            echo "  --- does configure hard-require CXX? ---"
            grep -cE 'no acceptable C\+\+ compiler|CXX.*required|AC_PROG_CXX' \
              "g$v/configure" | sed 's/^/    matches: /'
            echo "  --- how much of gcc/ is actually C++ source? ---"
            printf '    .c files:  %s\n' "$(find g$v/gcc -maxdepth 1 -name '*.c' | wc -l)"
            printf '    .cc files: %s\n' "$(find g$v/gcc -maxdepth 1 -name '*.cc' | wc -l)"
            echo
          done

  tcc-reaches-gcc48:
    name: 'B: can tcc configure gcc 4.8 on aarch64?'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl bzip2 xz-utils gcc make m4 texinfo

      - name: 'Build tcc (mob) -- our pin d9d02c56'
        run: |
          git clone -q git://repo.or.cz/tinycc.git tccsrc \
            || git clone -q https://repo.or.cz/tinycc.git tccsrc
          echo "  mob HEAD: $(git -C tccsrc rev-parse HEAD)"
          cd tccsrc && ./configure --cc=gcc >/dev/null && make -j"$(nproc)" >/dev/null
          ./tcc -v
          echo "TCC=$PWD/tcc"    >> "$GITHUB_ENV"
          echo "TCCDIR=$PWD"     >> "$GITHUB_ENV"

      - name: 'GMP again, this time with --disable-assembly'
        continue-on-error: true
        run: |
          set -u
          # Last run GMP configured fine under tcc and then failed to build.
          # GMP ships hand-written assembly per micro-architecture, which is the
          # obvious suspect -- --disable-assembly forces the portable C paths.
          curl -sSL -o gmp.tar.xz "$GNU/gmp/gmp-6.2.1.tar.xz"
          mkdir -p gmp && tar xf gmp.tar.xz -C gmp --strip-components=1
          cd gmp
          set +e
          ./configure CC="$TCC -B$TCCDIR" --disable-shared --disable-assembly \
            --prefix="$PWD/../prefix" > conf.log 2>&1
          echo "  configure rc=$?"; tail -6 conf.log | sed 's/^/    /'
          timeout 1800 make -j"$(nproc)" > build.log 2>&1
          echo "  make rc=$?"; tail -12 build.log | sed 's/^/    /'
          echo "  --- error classes ---"
          grep -oE 'error: [^,;]*' build.log | sed 's/[0-9]\+/N/g' \
            | sort | uniq -c | sort -rn | head -12 | sed 's/^/    /'
          make install >/dev/null 2>&1 && echo "  INSTALLED"
          set -e

      - name: 'MPFR + MPC on top (MPFR already worked under tcc)'
        continue-on-error: true
        run: |
          set -u
          for p in mpfr-4.1.0 mpc-1.2.1; do
            case $p in mpfr*) u="$GNU/mpfr/$p.tar.xz";; mpc*) u="$GNU/mpc/$p.tar.gz";; esac
            echo "############ $p ############"
            curl -sSL -o "$p.tar" "$u" && mkdir -p "$p" \
              && tar xf "$p.tar" -C "$p" --strip-components=1 2>/dev/null
            ( cd "$p"; set +e
              ./configure CC="$TCC -B$TCCDIR" --disable-shared \
                --with-gmp="$PWD/../prefix" --prefix="$PWD/../prefix" > conf.log 2>&1
              echo "  configure rc=$?"; tail -5 conf.log | sed 's/^/    /'
              timeout 1200 make -j"$(nproc)" > build.log 2>&1
              echo "  make rc=$?"; tail -6 build.log | sed 's/^/    /'
              make install >/dev/null 2>&1 && echo "  INSTALLED"; set -e )
          done
          ls prefix/lib 2>/dev/null | sed 's/^/    /' || echo "    (no prefix/lib)"

      - name: 'THE TEST: configure gcc 4.8.5 with tcc and NO C++ compiler'
        continue-on-error: true
        run: |
          set -u
          curl -sSL -o g48.tar.bz2 "$GNU/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2"
          mkdir -p g48 && tar xf g48.tar.bz2 -C g48 --strip-components=1
          mkdir -p b48 && cd b48
          set +e
          # CXX deliberately pointed at nothing: if gcc 4.8 truly needs a C++
          # compiler, configure must say so plainly. That message is the finding.
          ../g48/configure CC="$TCC -B$TCCDIR" CXX=/bin/false \
            --build=aarch64-unknown-linux-gnu \
            --prefix="$PWD/../gcc48" --enable-languages=c \
            --disable-multilib --disable-bootstrap --disable-libsanitizer \
            --disable-libgomp --disable-libquadmath \
            --with-gmp="$PWD/../prefix" --with-mpfr="$PWD/../prefix" \
            --with-mpc="$PWD/../prefix" > conf.log 2>&1
          echo "  configure rc=$?"
          echo "  --- what did it say about C++? ---"
          grep -inE 'C\+\+|CXX|acceptable' conf.log | head -15 | sed 's/^/    /'
          echo "  --- tail ---"
          tail -20 conf.log | sed 's/^/    /'
          set -e

      - name: 'THE REAL TEST: make it. configure passing is not building.'
        continue-on-error: true
        run: |
          set -u
          cd b48
          set +e
          timeout 4500 make -j"$(nproc)" > build.log 2>&1
          rc=$?
          echo "  make rc=$rc  (124 = timed out)"
          echo "  --- last 40 lines ---"
          tail -40 build.log | sed 's/^/    /'
          echo
          echo "  --- error classes, most frequent first ---"
          grep -oE 'error: [^,;]*' build.log | sed 's/[0-9]\+/N/g' \
            | sort | uniq -c | sort -rn | head -25 | sed 's/^/    /'
          echo
          echo "  --- did it ever reach for a C++ compiler? ---"
          grep -inE '/bin/false|C\+\+|\.cc |g\+\+' build.log | head -12 | sed 's/^/    /'
          echo
          echo "  --- what got built? ---"
          find . \( -name 'cc1' -o -name 'xgcc' -o -name 'genmodes' \) 2>/dev/null \
            | head | sed 's/^/    /'
          echo "    objects: $(find . -name '*.o' | wc -l)"
          set -e

      - name: 'HOW MUCH C++ IS ACTUALLY IN THERE? (configure with g++, BUILD with tcc)'
        continue-on-error: true
        run: |
          set -u
          # THE REAL QUESTION. gcc 4.8's gcc/ is 360 .c files and 0 .cc -- the
          # same sources 4.7 built with a C COMPILER, now merely compiled BY a
          # C++ compiler. So "tcc cannot build gcc 4.8" may be a build-system
          # requirement rather than a language one.
          #
          # Satisfy configure with the host g++ (so the CXX probe passes), then
          # OVERRIDE CXX at build time with tcc. Every error tcc then emits is a
          # genuine C++-ism in the source. Count them by class: that number is
          # the size of the "patch 4.8 to build with C" option, which is the only
          # escape that keeps the chain native aarch64.
          sudo apt-get install -y --no-install-recommends g++ >/dev/null 2>&1 || true
          mkdir -p b48c && cd b48c
          set +e
          ../g48/configure CC="$TCC -B$TCCDIR" \
            --build=aarch64-unknown-linux-gnu \
            --prefix="$PWD/../gcc48c" --enable-languages=c \
            --disable-multilib --disable-bootstrap --disable-libsanitizer \
            --disable-libgomp --disable-libquadmath \
            --with-gmp="$PWD/../prefix" --with-mpfr="$PWD/../prefix" \
            --with-mpc="$PWD/../prefix" > conf.log 2>&1
          echo "  configure (with real g++) rc=$?"
          tail -6 conf.log | sed 's/^/    /'
          echo
          echo "  --- now BUILD with tcc standing in for the C++ compiler ---"
          timeout 3600 make -j"$(nproc)" CXX="$TCC -B$TCCDIR" > build.log 2>&1
          echo "  make rc=$? (124 = timed out)"
          echo
          echo "  --- error classes: THIS IS THE MEASUREMENT ---"
          grep -oE 'error: [^,;]*' build.log | sed 's/[0-9]\+/N/g' \
            | sort | uniq -c | sort -rn | head -30 | sed 's/^/    /'
          echo
          echo "  --- distinct files that failed ---"
          grep -oE '^[^ :]+\.c(c)?:' build.log | sort -u | head -25 | sed 's/^/    /'
          echo "    distinct failing files: $(grep -oE '^[^ :]+\.c(c)?:' build.log | sort -u | wc -l)"
          echo "    objects built anyway   : $(find . -name '*.o' | wc -l)"
          echo
          echo "  A SHORT list of error classes over FEW files means patching 4.8"
          echo "  to build with C is tractable, and the chain stays native."
          echo "  A long tail means the C++ dependency is real and the roadmap"
          echo "  must take a borrowed C++ rung or a cross-compiled entry point."
          set -e

      - name: 'VERDICT'
        run: |
          echo "  Job A settles whether 4.7 can target aarch64 at all."
          echo "  Job B settles whether 4.8 can be configured without C++."
          echo
          echo "  BOTH NEGATIVE -> the gap is real, and the roadmap must pick one:"
          echo "    cross-compile the entry point (reintroduces the arch detour)"
          echo "    find a C-buildable C++ compiler for aarch64"
          echo "    patch 4.8 to build with C"
          echo "    accept one labelled borrowed rung, as we do for as/objdump"
          echo
          echo "  EITHER POSITIVE -> the gap closes and the direct path stays native."

  diff-4748:
    name: 'C: what actually changed between 4.7 and 4.8, and is 4.8 still C?'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl bzip2 xz-utils gcc diffutils \
            libgmp-dev libmpfr-dev libmpc-dev
          # gcc's configure hard-requires GMP/MPFR/MPC. Without them it exits
          # before generating config.h, and the C-compatibility measurement
          # silently measures nothing (run 1 of this step did exactly that).

      - name: Fetch 4.7.4, 4.8.0 and 4.8.5
        run: |
          set -eu
          for v in 4.7.4 4.8.0 4.8.5; do
            curl -sSL -o "g$v.tar.bz2" "$GNU/gcc/gcc-$v/gcc-$v.tar.bz2"
            mkdir -p "g$v" && tar xf "g$v.tar.bz2" -C "g$v" --strip-components=1
            echo "  $v extracted"
          done

      - name: '1. The two changes are DISJOINT: backend vs build language'
        run: |
          echo "=== files ONLY in 4.8.5's gcc/, i.e. what the release added ==="
          ( cd g4.7.4/gcc && find . -type f | sort ) > /tmp/f47
          ( cd g4.8.5/gcc && find . -type f | sort ) > /tmp/f48
          echo "  4.7.4 gcc/ files : $(wc -l < /tmp/f47)"
          echo "  4.8.5 gcc/ files : $(wc -l < /tmp/f48)"
          echo "  added in 4.8     : $(comm -13 /tmp/f47 /tmp/f48 | wc -l)"
          echo "  of those, under config/aarch64/: $(comm -13 /tmp/f47 /tmp/f48 | grep -c 'config/aarch64' || echo 0)"
          echo
          echo "  --- the aarch64 backend is self-contained: ---"
          comm -13 /tmp/f47 /tmp/f48 | grep 'config/aarch64' | sed 's/^/    /'

      - name: '2. Did 4.7 have a C build path that 4.8 deleted?'
        run: |
          for v in 4.7.4 4.8.0 4.8.5; do
            echo "=== $v ==="
            printf '    enable-build-with-cxx in configure.ac : %s\n' \
              "$(grep -c 'build-with-cxx' g$v/gcc/configure.ac 2>/dev/null || echo 0)"
            printf '    enable-build-with-cxx in configure    : %s\n' \
              "$(grep -c 'build-with-cxx' g$v/gcc/configure 2>/dev/null || echo 0)"
            printf '    ENABLE_BUILD_WITH_CXX in Makefile.in  : %s\n' \
              "$(grep -c 'ENABLE_BUILD_WITH_CXX' g$v/gcc/Makefile.in 2>/dev/null || echo 0)"
            grep -m3 -A2 'build-with-cxx' "g$v/gcc/configure.ac" 2>/dev/null | sed 's/^/      /' || true
            echo
          done
          echo "  4.7 shipped the C++ build as an OPT-IN alongside a working C path."
          echo "  If 4.8 merely removed the switch, restoring it is small. If the"
          echo "  sources drifted C++-only, that is a different size of job."

      - name: '3. THE NUMBER: genuine C++ constructs, with 4.7 as the baseline'
        run: |
          set +e
          # TWO FAILED ATTEMPTS TAUGHT THE LESSON. Syntax-checking gcc's sources
          # needs config.h (a Makefile rule, not config.status) AND tm.h,
          # insn-config.h etc, which the gen* programs produce -- i.e. building
          # most of the tree just to run a check. Wrong instrument.
          #
          # COUNT THE CONSTRUCTS INSTEAD. C++ is STRICTER than C, so code written
          # to compile as C++ is usually already valid C; what would actually
          # break a C compiler is C++ FEATURES. Those are greppable, need no
          # headers, and 4.7 -- whose sources are known C-buildable -- gives the
          # noise floor. If 4.8 scores like 4.7, 4.8's sources are no less C
          # than the ones 4.7 compiled with a C compiler.
          probe() {   # probe <label> <regex>
            printf '  %-34s' "$1"
            for v in 4.7.4 4.8.0 4.8.5; do
              n=$(grep -rlE "$2" g$v/gcc/*.c 2>/dev/null | wc -l)
              printf ' %-10s' "$n"
            done
            printf '\n'
          }
          printf '  %-34s %-10s %-10s %-10s\n' 'C++ construct (files containing)' '4.7.4' '4.8.0' '4.8.5'
          printf '  %-34s %-10s %-10s %-10s\n' '--------------------------------' '-----' '-----' '-----'
          probe 'class <name> {'            '^[[:space:]]*class[[:space:]]+[A-Za-z_]'
          probe 'template'                  '^[[:space:]]*template[[:space:]]*<'
          probe 'namespace'                 '^[[:space:]]*namespace[[:space:]]+'
          probe 'access specifiers'         '^[[:space:]]*(public|private|protected):'
          probe 'operator overloading'      '[[:space:]]operator[[:space:]]*[-+*/=<>()]'
          probe 'new / delete operators'    '[^_a-zA-Z](new|delete)[[:space:]]+[A-Za-z_]'
          probe 'scope resolution ::'       '[A-Za-z_]::[A-Za-z_]'
          probe 'reinterpret/static_cast'   '(reinterpret|static|dynamic|const)_cast'
          probe 'try / catch / throw'       '^[[:space:]]*(try|catch|throw)[[:space:]{(]'
          echo
          for v in 4.7.4 4.8.0 4.8.5; do
            printf '  gcc-%s: %s .c files, %s .cc files\n' "$v" \
              "$(ls g$v/gcc/*.c 2>/dev/null | wc -l)" \
              "$(ls g$v/gcc/*.cc 2>/dev/null | wc -l)"
          done
          echo
          echo "  --- where any hits actually are (4.8.0) ---"
          grep -rlE '^[[:space:]]*(class[[:space:]]+[A-Za-z_]|template[[:space:]]*<|namespace[[:space:]]+)' \
            g4.8.0/gcc/*.c 2>/dev/null | head -15 | sed 's/^/    /'
          echo
          echo "  IF 4.8 SCORES LIKE 4.7 across the board, its sources are still C"
          echo "  and the C++ requirement is BUILD-SYSTEM POLICY. Then the cheap"
          echo "  move is not restoring --enable-build-with-cxx (9 sites across"
          echo "  configure.ac/configure/Makefile.in) but simply satisfying"
          echo "  configure with any C++ compiler and then: make CXX=\"\$TCC\"."
          echo "  The build system does not care what CXX is; it just runs it."
          set -e

      - name: '4. Did the backend exist anywhere in a 4.7.x tree?'
        run: |
          echo "  4.7.4 config/ arm-family dirs:"
          ls g4.7.4/gcc/config | grep -iE 'arm|aarch' | sed 's/^/    /' || echo "    none"
          echo "  4.8.0 config/ arm-family dirs:"
          ls g4.8.0/gcc/config | grep -iE 'arm|aarch' | sed 's/^/    /' || echo "    none"
          echo
          echo "  aarch64 backend file count, 4.8.0 vs 4.8.5:"
          printf '    4.8.0: %s files, %s lines\n' \
            "$(find g4.8.0/gcc/config/aarch64 -type f 2>/dev/null | wc -l)" \
            "$(cat g4.8.0/gcc/config/aarch64/* 2>/dev/null | wc -l)"
          printf '    4.8.5: %s files, %s lines\n' \
            "$(find g4.8.5/gcc/config/aarch64 -type f 2>/dev/null | wc -l)" \
            "$(cat g4.8.5/gcc/config/aarch64/* 2>/dev/null | wc -l)"
          echo
          echo "  If the backend is a few thousand lines in a self-contained dir,"
          echo "  BACKPORTING IT ONTO 4.7 is a real option -- 4.7 keeps its C build"
          echo "  path and gains the target, and the chain stays native with no"
          echo "  C++ rung at all."
