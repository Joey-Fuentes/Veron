name: wpe-timing

# HOW LONG DOES WPE WEBKIT ACTUALLY TAKE? A measurement, not a build.
#
# The browser decision rests on a number nobody has: whether WPE fits a hosted
# runner at all. Estimates range from "a few hours" to "a full day on a Pi",
# which is not good enough to plan around -- and the answer decides whether
# stage 5 needs self-hosted runners, which is a bigger commitment than any
# package.
#
# DELIBERATELY NOT HERMETIC. Dependencies come from apt, because the question
# is "how long does the ENGINE take to compile", not "can we bootstrap its
# dependency tree" -- and mixing the two would measure neither. WPE itself is
# built from a pinned source tarball, since that is the part being timed.
#
# Nothing here enters the ladder, nothing is published as an artifact for
# building against, and the BUDGET claim does not apply. This is a stopwatch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'WPE WebKit version'
        required: false
        default: '2.52.5'
      gstreamer:
        description: 'Build with GStreamer (media). Off = no video/audio, fewer deps'
        type: boolean
        default: false
      build_type:
        description: 'CMake build type'
        type: choice
        options: [Release, RelWithDebInfo, MinSizeRel]
        default: Release
      jobs:
        description: 'Parallel jobs (blank = nproc)'
        required: false
        default: ''

concurrency:
  group: wpe-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # The hosted cap is 6h. 350 gives the reporting steps room to run even if
    # the compile is still going -- a run that dies at the cap with no numbers
    # would answer nothing.
    timeout-minutes: 350
    steps:
      - name: 'What this runner is'
        run: |
          set -eu
          echo "  arch      $(uname -m)"
          echo "  cpus      $(nproc)"
          echo "  memory    $(awk '/MemTotal/{printf "%.1f GB\n", $2/1048576}' /proc/meminfo)"
          echo "  disk free $(df -h --output=avail / | tail -1 | tr -d ' ')"
          echo "  gcc       $(gcc --version | head -1)"
          echo ""
          echo "  DISK IS THE CONSTRAINT TO WATCH. A WebKit build tree runs to"
          echo "  several GB and a hosted runner has limited free space; a"
          echo "  build that dies on ENOSPC at hour three still answers the"
          echo "  question, but only if the number above is recorded."

      - name: 'Dependencies from apt (NOT hermetic -- see the header)'
        run: |
          set -eu
          sudo apt-get update -qq

          # ONE WRONG NAME MUST NOT COST THE EXPERIMENT. The first attempt
          # died on three packages that do not exist on Ubuntu 24.04 arm64
          # (libbacktrace-dev is part of gcc, not a package; the libwpe ones
          # are not published for this arch) -- and `apt-get install` fails
          # the whole set atomically, so a five-hour measurement was lost to a
          # typo before a single file compiled. Install what exists, report
          # what does not, and let configure be the thing that decides whether
          # a missing library actually matters.
          need() {
            for p in "$@"; do
              if apt-cache show "$p" >/dev/null 2>&1; then
                echo "$p"
              else
                echo "  NOT AVAILABLE: $p" >&2
              fi
            done
          }

          PKGS=$(need \
            build-essential cmake ninja-build pkg-config \
            ruby perl python3 gperf bison flex unifdef \
            libglib2.0-dev libsoup-3.0-dev libicu-dev libharfbuzz-dev \
            libfreetype-dev libfontconfig-dev libxml2-dev libxslt1-dev \
            libsqlite3-dev libpng-dev libjpeg-dev libwebp-dev zlib1g-dev \
            libgcrypt20-dev libtasn1-6-dev libepoxy-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libegl-dev libgles-dev libgbm-dev libdrm-dev \
            libinput-dev libudev-dev \
            libatk1.0-dev libatk-bridge2.0-dev \
            libseccomp-dev libsysprof-capture-4-dev \
            libwpe-1.0-dev libwpebackend-fdo-1.0-dev)

          if [ "${{ inputs.gstreamer }}" = "true" ]; then
            PKGS="$PKGS $(need libgstreamer1.0-dev \
              libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev)"
          fi

          echo "  installing $(echo "$PKGS" | wc -w) packages"
          sudo apt-get install -y -qq $PKGS
          echo "  apt done"

      - name: 'Fetch the pinned WPE source tarball'
        id: src
        run: |
          set -eu
          V='${{ inputs.version }}'
          URL="https://wpewebkit.org/releases/wpewebkit-$V.tar.xz"
          echo "  $URL"
          # IPv4: ftp.gnu.org taught us that an AAAA record plus no IPv6 route
          # fails instantly with ENETUNREACH rather than timing out.
          curl -4 -fL --connect-timeout 20 --retry 3 -o wpe.tar.xz "$URL"
          SHA=$(sha256sum wpe.tar.xz | cut -d' ' -f1)
          echo "  bytes  $(stat -c%s wpe.tar.xz)"
          echo "  sha256 $SHA"
          echo "  ^ RECORD THIS. It is the pin a recipe would use, and it is"
          echo "    the one useful artifact of a non-hermetic run."
          tar xf wpe.tar.xz
          mv "wpewebkit-$V" src
          echo "  source lines (rough): $(find src -name '*.cpp' -o -name '*.h' -o -name '*.c' | wc -l) files"

      # USE_LIBBACKTRACE also defaults ON and hard-fails without libbacktrace,
      # which Ubuntu does not package at all (it ships inside gcc). It only
      # improves crash backtraces. USE_SYSPROF_CAPTURE is pre-emptively off
      # for the same reason -- profiling, not function.
      #
      # USE_LIBHYPHEN defaults ON and hard-fails configure without libhyphen
      # -- "libhyphen is needed for USE_LIBHYPHEN". It only provides CSS
      # hyphenation of justified text, so it is off here; if you want that
      # quality later, libhyphen is one small C library, not a stack.
      #
      # ENABLE_WPE_LEGACY_API=OFF is what makes libwpe and WPEBackend-fdo
      # unnecessary: 2.52 added building exclusively on WPEPlatform. Neither
      # library is packaged for Ubuntu arm64, so this is the configuration
      # that can actually be measured here -- and it is also the one Igalia
      # recommends new projects adopt, since the legacy path is deprecated
      # when WPEPlatform becomes default in 2.54.
      # THE WHOLE MENU, BEFORE GUESSING AT IT. Two runs were spent finding
      # one default-ON option at a time -- USE_LIBHYPHEN, then
      # USE_LIBBACKTRACE -- each costing a round trip to learn a single line
      # of OptionsWPE.cmake. The file lists every option and its default; read
      # it once and the guessing stops.
      - name: 'Every build option WPE offers, and its default'
        run: |
          set -eu
          echo "  --- options declared in OptionsWPE.cmake ---"
          grep -hoE '(WEBKIT_OPTION_DEFINE|WEBKIT_OPTION_DEFAULT_PORT_VALUE)\([A-Z_]+ [^)]*' \
            src/Source/cmake/OptionsWPE.cmake 2>/dev/null \
            | sed 's/WEBKIT_OPTION_[A-Z_]*(//' | sort -u | head -80 || true
          echo ""
          echo "  --- options that HARD-FAIL when their library is absent ---"
          grep -nE 'is (required|needed) for' src/Source/cmake/OptionsWPE.cmake || true

      - name: 'Configure'
        run: |
          set -eu
          S=$(date +%s)
          cmake -S src -B build -G Ninja \
            -DPORT=WPE \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_WPE_PLATFORM=ON \
            -DENABLE_WPE_LEGACY_API=OFF \
            -DENABLE_JOURNALD_LOG=OFF \
            -DENABLE_INTROSPECTION=OFF \
            -DENABLE_DOCUMENTATION=OFF \
            -DENABLE_SPELLCHECK=OFF \
            -DENABLE_GAMEPAD=OFF \
            -DENABLE_WEBDRIVER=OFF \
            -DUSE_LIBSECRET=OFF \
            -DUSE_AVIF=OFF \
            -DUSE_JPEGXL=OFF \
            -DUSE_LCMS=OFF \
            -DUSE_LIBHYPHEN=OFF \
            -DUSE_LIBBACKTRACE=OFF \
            -DUSE_SYSPROF_CAPTURE=OFF \
            -DENABLE_MINIBROWSER=ON \
            $( [ "${{ inputs.gstreamer }}" = "true" ] || echo "-DUSE_GSTREAMER=OFF" ) \
            2>&1 | tee configure.log
          RC=${PIPESTATUS[0]}
          echo "CONFIGURE_SECONDS=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"
          if [ "$RC" != 0 ]; then
            # FAIL LOUDLY HERE. `|| true` let a broken configure hand ninja an
            # empty tree, which reported as "build 0 min, rc=1" -- indis-
            # tinguishable from a compile failure, and pointing at the wrong
            # step entirely.
            echo ""
            echo "  CONFIGURE FAILED -- nothing was measured. The cause:"
            grep -B2 -A6 "CMake Error" configure.log | head -30
            exit 1
          fi
          echo ""
          echo "  --- what configure decided ---"
          grep -iE "^-- (Enabling|Disabling)|error|not found" configure.log | head -40 || true

      - name: 'Build, with progress'
        run: |
          set -eu
          J='${{ inputs.jobs }}'; [ -n "$J" ] || J=$(nproc)
          echo "  ninja -j$J"
          S=$(date +%s)
          # A background ticker, because ninja's own output is quiet for long
          # stretches and a silent hour is indistinguishable from a hang --
          # the same lesson the probe taught when tee made it look stuck.
          ( while true; do sleep 300
              echo "  [tick $(( ($(date +%s) - S) / 60 ))m] disk free $(df -h --output=avail / | tail -1 | tr -d ' ')"
            done ) &
          TICKER=$!
          set +e
          ninja -C build -j"$J" 2>&1 | tail -c 2000000 > build.log
          RC=${PIPESTATUS[0]}
          set -e
          kill $TICKER 2>/dev/null || true
          echo "BUILD_SECONDS=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"
          echo "BUILD_RC=$RC" >> "$GITHUB_ENV"
          echo "  ninja rc=$RC"
          tail -25 build.log

      - name: 'THE NUMBERS'
        if: always()
        run: |
          set -eu
          echo "  =============================================="
          echo "  runner        ubuntu-24.04-arm, $(nproc) cpus"
          echo "  version       ${{ inputs.version }}"
          echo "  build type    ${{ inputs.build_type }}"
          echo "  gstreamer     ${{ inputs.gstreamer }}"
          echo "  configure     ${CONFIGURE_SECONDS:-?} s"
          echo "  build         $(( ${BUILD_SECONDS:-0} / 60 )) min  (rc=${BUILD_RC:-?})"
          echo "  build tree    $(du -sh build 2>/dev/null | cut -f1)"
          echo "  disk free     $(df -h --output=avail / | tail -1 | tr -d ' ')"
          echo "  =============================================="
          echo ""
          if [ "${BUILD_RC:-1}" = 0 ]; then
            echo "  IT FITS. A hosted runner can build WPE, so stage 5 does not"
            echo "  need self-hosted CI for the browser -- which removes the"
            echo "  largest piece of infrastructure the plan was carrying."
            ls -la build/bin build/lib 2>/dev/null | head -12 || true
          else
            echo "  IT DID NOT FINISH. Read the cause before concluding it does"
            echo "  not fit: ENOSPC and the 6h cap are different answers, and"
            echo "  only one of them means self-hosted runners."
            grep -iE "no space|ENOSPC|virtual memory exhausted|Killed|internal compiler" build.log | head -5 || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpe-timing
          path: |
            configure.log
            build.log
          retention-days: 30
