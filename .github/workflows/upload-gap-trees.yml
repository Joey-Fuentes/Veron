# UPLOAD THE EXACT TREES THE GAP PROBE MEASURES, SO THEY CAN BE WORKED ON
# LOCALLY.
#
# WHY. m2-normal-mode-gap.yml has cost eight runs, and almost none of the time
# went into the question it exists to answer. It went into a relative path, an
# unbounded loop, a wrong compilation model, a malformed patch, a flag that
# defaults off and fails silently, and a retry loop whose worst case exceeded
# its own job timeout. Every one of those would have taken minutes to find with
# the tree in hand.
#
# The M2-Planet side is already local -- `gcc cc*.c` plus M2libc's
# bootstrappable.c builds it -- and the moment that was true, two real compiler
# bugs got found and fixed from five-line reproductions. What is missing is tcc
# at its pin with our five patches on it, which needs a network fetch.
#
# So: fetch once, upload once, iterate locally afterwards. This job produces no
# artifact any build consumes and gates nothing. It exists to move a slow loop
# off CI.
#
# SOURCE ONLY, NO BINARIES. M2-Planet builds from source in seconds; shipping a
# binary would add an unverifiable object to a repository whose entire point is
# that binaries are derived and checked. .git is stripped because the pin is
# recorded here and in sources/tcc.toml, not carried in the tarball.
name: upload-gap-trees

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trees:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      M2PLANET_SHA: bd2fe4b0659fd0ad3f476a5ad0ef801bd134665d
      TCC_SHA:      5ec0e6f84b47ebd8c269b581712666313f5edaef
    steps:
      - uses: actions/checkout@v5

      - name: Fetch M2-Planet at the pin and apply our fixes
        run: |
          set -eu
          git clone -q https://github.com/oriansj/M2-Planet.git m2
          git -C m2 checkout -q "$M2PLANET_SHA"
          git -C m2 submodule update --init --recursive -q
          P=spikes/stage3/patches/m2-planet
          n=0
          for q in "$P"/[0-9]*.patch; do
            [ -e "$q" ] || continue
            git -C m2 apply --ignore-whitespace --check "../$q" \
              || { echo "FAIL: $(basename "$q") does not apply"; exit 1; }
            git -C m2 apply --ignore-whitespace "../$q"
            echo "  applied $(basename "$q")"
            n=$((n + 1))
          done
          echo "  M2-Planet $(git -C m2 rev-parse --short HEAD) + $n fix(es)"

      - name: Fetch tcc at the pin and apply the arm64 series
        run: |
          set -eu
          git clone -q https://repo.or.cz/tinycc.git tcc \
            || git clone -q https://github.com/TinyCC/tinycc.git tcc
          git -C tcc checkout -q "$TCC_SHA"
          S=spikes/stage3/patches/tcc-arm64-asm
          n=0
          for p in "$S"/[0-9]*.patch; do
            git -C tcc apply --ignore-whitespace --check "../$p" \
              || { echo "FAIL: $(basename "$p") does not apply"; exit 1; }
            git -C tcc apply --ignore-whitespace "../$p"
            n=$((n + 1))
          done
          # A FLOOR, NOT A COUNT -- the series is seven now. See micro-c-builds-tcc.
          [ "$n" -ge 5 ] || { echo "FAIL: applied $n patches, expected >= 5"; exit 1; }
          # configure emits config.h, which the sources expect to exist. Doing
          # it here means the uploaded tree is the one the probe measures,
          # rather than one that still needs a step nobody remembers.
          ( cd tcc && ./configure --cpu=arm64 >/dev/null 2>&1 || true )
          [ -f tcc/config.h ] && echo "  config.h present" \
                              || echo "  NOTE: configure produced no config.h"
          echo "  tcc $(git -C tcc rev-parse --short HEAD) + $n patches"

      - name: Pack, source only
        run: |
          set -eu
          rm -rf m2/.git tcc/.git m2/M2libc/.git
          # Anything executable that is not a script would be a binary riding
          # along in a source tarball. Say so rather than let it travel quietly.
          find m2 tcc -type f -perm -u+x ! -name '*.sh' ! -name 'configure' \
            -exec file {} + 2>/dev/null | grep -i 'ELF' || true
          tar czf gap-trees.tar.gz m2 tcc
          printf '  %s bytes  %s\n' "$(wc -c < gap-trees.tar.gz)" \
            "$(sha256sum gap-trees.tar.gz | cut -c1-16)"
          {
            echo "M2-Planet $M2PLANET_SHA + $(ls spikes/stage3/patches/m2-planet/[0-9]*.patch 2>/dev/null | wc -l) local fixes"
            echo "tcc       $TCC_SHA + 5 arm64 patches, configured --cpu=arm64"
          } > MANIFEST.txt
          cat MANIFEST.txt | sed 's/^/  /'

      - uses: actions/upload-artifact@v4
        with:
          name: gap-trees
          path: |
            gap-trees.tar.gz
            MANIFEST.txt
          if-no-files-found: error
