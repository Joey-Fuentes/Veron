name: stage5-probe-last

# THE LAST FOUR. 100 of ~104 packages are pinned with digests we computed.
#
#   libutf8proc   foot declares it; never on any list
#   libsfdo       labwc declares basedir/desktop/icon; never on any list.
#                 Both surfaced from READING what the tarballs declare rather
#                 than from planning, which is now the third time that has
#                 been the difference.
#   dinit         no releases, only tags, and neither Arch nor Alpine packages
#                 it. Its home is davmac.org.
#   wlroots 0.19  A VERSION CONFLICT, not a gap. labwc 0.9.1 -- the latest
#                 release -- declares `wlroots-0.19`, and wlroots' latest is
#                 0.20.2. labwc pins the wlroots ABI exactly, so 0.20 would
#                 fail at configure. Latest COMPATIBLE is labwc 0.9.1 with
#                 wlroots 0.19.x, so 0.19 is what to pin.

on:
  workflow_dispatch:
    inputs:
      latest:
        description: 'Version lookups'
        required: false
        default: >-
          JuliaStrings/utf8proc
          fdo:vyivel/libsfdo
          davmac314/dinit
      index:
        description: 'Directory listings for projects with no release API'
        required: false
        default: >-
          dinit=http://davmac.org/projects/dinit/
      wlroots19:
        description: 'Which wlroots 0.19 to pin (labwc 0.9.1 requires the 0.19 ABI)'
        required: false
        default: '0.19.1'
      urls:
        description: 'Extra tarballs to probe'
        required: false
        default: ''

concurrency:
  group: stage5-probe-last-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: 'Versions'
        if: inputs.latest != ''
        run: |
          set -eu
          cd spikes/stage5
          python3 -u tools/probe.py latest ${{ inputs.latest }} || true

      - name: 'Directory listings'
        if: inputs.index != ''
        run: |
          set -eu
          cd spikes/stage5
          for spec in ${{ inputs.index }}; do
            name="${spec%%=*}"; url="${spec#*=}"
            python3 -u tools/probe.py index "$url" --name "$name" || true
          done

      - name: 'Where packagers fetch dinit and libsfdo'
        run: |
          set -eu
          cd spikes/stage5
          python3 -u tools/probe.py source dinit libsfdo utf8proc || true

      - name: 'Probe wlroots 0.19 and anything named'
        run: |
          set -eu
          cd spikes/stage5
          V='${{ inputs.wlroots19 }}'
          : > last-urls.txt
          # The signed release asset, not the auto-generated archive -- the
          # /-/releases/<v>/downloads/ path is what Arch pins too.
          echo "https://gitlab.freedesktop.org/wlroots/wlroots/-/releases/$V/downloads/wlroots-$V.tar.gz" >> last-urls.txt
          for u in ${{ inputs.urls }}; do echo "$u" >> last-urls.txt; done
          python3 -u tools/probe.py batch last-urls.txt --out probed-last.tsv || true

      - name: 'What is left'
        if: always()
        run: |
          set -eu
          cd spikes/stage5
          if [ -s probed-last.tsv ]; then
            echo "  === PROBED ==="
            awk -F'\t' 'NR>1 {printf "  %-18s %-10s %-18s %s\n", $1, $3, substr($4,1,16), $6}' probed-last.tsv
            echo ""
            echo "  === FAILED ==="
            awk -F'\t' '$1=="FAILED" {print "    " $2}' probed-last.tsv
          fi
          echo ""
          echo "  AFTER THIS RUN, paste the asset URLs the version lookups"
          echo "  found for utf8proc, libsfdo and dinit back into `urls` and"
          echo "  run once more -- a version is not a digest, and only the"
          echo "  tarball probe produces a pin."
