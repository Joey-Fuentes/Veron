name: gcc47-aarch64-backport

# SPIKE. CAN gcc 4.8.5's AARCH64 BACKEND LIVE IN gcc 4.7.4?
#
# THREE ARMS, RUN IDENTICALLY. Run 1 of this spike had only the experimental
# arm and its failure was uninterpretable: 24 "failing files" that were all
# libiberty, libcpp and libdecnumber -- nothing to do with aarch64. A result
# with no baseline says nothing about the thing under test.
#
#   A  4.8.5 VANILLA, native aarch64
#      Does this environment build a gcc at all? gcc 4.8.5 under gcc 13 is not
#      a given: old gcc against a modern host compiler and glibc is its own
#      problem. If A fails, nothing below it means anything.
#
#   B  4.7.4, config.sub/config.guess ONLY, --target=arm-none-eabi
#      Does 4.7.4's source build here? This is the control that separates
#      "4.7.4 does not build in 2026" from "the backport is wrong".
#      NOT strictly vanilla: 4.7.4's config.sub does not know the string
#      aarch64, so it cannot even be told what host it is on. Swapping the two
#      standalone data files is the minimum that lets it configure, and it
#      touches no compiler source. The target is arm-none-eabi -- something
#      4.7 genuinely supports -- so no backend question is involved.
#
#   C  4.7.4 + the full transplant, --target=aarch64
#      The experiment. Only interpretable against A and B.
#
# READ THE RESULT AS A TABLE:
#   A fail                  -> the environment, not gcc. Fix that first.
#   A pass, B fail          -> 4.7.4 does not build here. The backport is not
#                              the problem and may not be the next question.
#   A pass, B pass, C fail  -> the transplant. NOW the failure inventory means
#                              something, and the layer it lands in tells us
#                              whether it is config, machine description, or
#                              middle-end drift.
#   all pass                -> the gcc leg's shape is settled.
#
# WHY IT IS WORTH THE RUNTIME. gcc-backend-backport-probe measured the cost:
# the vax control needed 15 files / 76+ / 72- across the whole 4.7->4.8
# boundary, the aarch64 backend uses 0 of the 21 target hooks new in 4.8
# (positive control confirms the search works), and all 40 symbols it uses that
# 4.7 lacks are self-supplied -- 30 gen_* from its own .md files. If that holds,
# the gcc leg becomes native and C-only end to end:
#
#     tcc -> gcc 4.7 + this backend -> g++ 4.7 -> gcc 4.8 -> modern gcc
#
# Host gcc throughout. One variable at a time; tcc is the question after.

on:
  push:
    paths:
      - '.github/workflows/gcc47-aarch64-backport.yml'
      - 'spikes/stage4/probes/backport-aarch64.sh'
  workflow_dispatch:

# A NEW PUSH MUST NOT KILL A RUNNING BUILD. Cancelling in flight is right for a
# fast check and wrong for a multi-hour box: one push to fix a typo cancelled
# four in-flight hermetic runs and restarted them from zero. Long jobs queue
# instead. (The setting is spelled out below rather than named here, because a
# key:value written in prose is what a later grep will match first.)
concurrency:
  group: gcc47-backport-${{ github.ref }}
  cancel-in-progress: false

env:
  GNU: 'https://mirrors.kernel.org/gnu'

jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # A and B are PARKED, not deleted. Both passed on 2026-07-24:
        #   A 4.8.5 vanilla  cc1 BUILT (needs CXX="g++ -std=gnu++98")
        #   B 4.7.4 control  cc1 BUILT (needs MAKEINFO=true)
        # so the environment builds a gcc and 4.7.4 builds here. Re-add either
        # to the list below the moment a C result needs something to compare
        # against -- the arms are written to run identically for that reason.
        #   arm: [A-485-vanilla, B-474-control, C-474-backport]
        arm: [C-474-backport]
    name: '${{ matrix.arm }}'
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl bzip2 xz-utils gcc g++ make bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev

      - name: 'Fetch sources for this arm'
        run: |
          set -eu
          case "${{ matrix.arm }}" in
            A-485-vanilla)  need="4.8.5" ;;
            B-474-control)  need="4.7.4 4.8.5" ;;   # 4.8.5 only for config.sub
            C-474-backport) need="4.7.4 4.8.5" ;;
          esac
          for v in $need; do
            d="g${v//./}"
            mkdir -p "$d"
            curl -fsSL --retry 3 --connect-timeout 15 -o "$d.tar.bz2" \
              "$GNU/gcc/gcc-$v/gcc-$v.tar.bz2"
            tar xf "$d.tar.bz2" -C "$d" --strip-components=1
            echo "  $v -> $d"
          done

      - name: 'Prepare the tree'
        run: |
          set -eu
          # A FATAL here aborts the job by design -- run 2 stopped arm C at
          # exactly this point with "could not find the catch-all's '*)' arm",
          # which is the guard working. Better than a 40-minute build that
          # fails at configure-gcc for an unexplained reason.
          case "${{ matrix.arm }}" in
            A-485-vanilla)
              echo "SRC=g485" >> "$GITHUB_ENV"
              echo "TGT=aarch64-unknown-linux-gnu" >> "$GITHUB_ENV"
              echo "  4.8.5 vanilla, untouched"
              ;;
            B-474-control)
              # The MINIMUM that lets 4.7.4 name its own host. No compiler
              # source is touched; these two are standalone data files.
              for f in config.sub config.guess; do
                cp "g485/$f" "g474/$f"; chmod +x "g474/$f"
              done
              echo "SRC=g474" >> "$GITHUB_ENV"
              echo "TGT=arm-none-eabi" >> "$GITHUB_ENV"
              echo "  4.7.4 + config.sub/config.guess only; target arm-none-eabi"
              echo "  aarch64 in gcc/config.gcc: $(grep -c aarch64 g474/gcc/config.gcc || true) (expect 0)"
              ;;
            C-474-backport)
              bash spikes/stage4/probes/backport-aarch64.sh g474 g485
              echo "SRC=g474" >> "$GITHUB_ENV"
              echo "TGT=aarch64-unknown-linux-gnu" >> "$GITHUB_ENV"
              ;;
          esac

      - name: 'CONFIGURE'
        continue-on-error: true
        run: |
          set -u
          mkdir -p build && cd build
          set +e
          # --disable-werror is not optional here: a 2012-era gcc compiled by
          # gcc 13 trips warnings that did not exist when it was written, and
          # without this every arm fails for the same uninteresting reason.
          # -std=gnu++98 is REQUIRED for 4.8.5. Modern g++ defaults to gnu++17,
          # and gcc 4.8.5's reload1.c does `spill_indirect_levels++` on a bool:
          #   error: use of an operand of type 'bool' in 'operator++'
          #          is forbidden in C++17
          # That is the language moving under a 2012 codebase, not anything
          # about aarch64. Inert for the 4.7.4 arms, which build as C.
          "../$SRC/configure" \
            CXX="g++ -std=gnu++98" \
            --build=aarch64-unknown-linux-gnu \
            --host=aarch64-unknown-linux-gnu \
            --target="$TGT" \
            --prefix="$PWD/../out" --enable-languages=c \
            --disable-multilib --disable-bootstrap --disable-werror \
            --disable-libsanitizer --disable-libgomp --disable-libquadmath \
            --disable-libssp --disable-libatomic \
            > conf.log 2>&1
          rc=$?
          echo "  configure rc=$rc"
          echo "CONF_RC=$rc" >> "$GITHUB_ENV"
          if [ "$rc" -ne 0 ]; then
            echo "  --- configure tail ---"
            tail -30 conf.log | sed 's/^/    /'
          fi

      - name: 'BUILD'
        continue-on-error: true
        run: |
          set -u
          cd build
          set +e
          # MAKEINFO=true: arm B built cc1 and still reported failure, because
          # doc/gccint.info died on "sourcebuild.texi:679: @itemx should not
          # begin @table" -- 2026's makeinfo rejecting 2012's texinfo. That is
          # documentation, not a compiler, and it must not mask the result.
          #
          # -Otarget: with -j the output of parallel compiles INTERLEAVES, so
          # run 2's "first failure in context" showed warnings from resource.c
          # next to a reload1.o failure. -Otarget groups each target's output.
          # THE QUESTION HAS MOVED, SO THE TARGET HAS TOO. all-gcc stops before the
          # runtime, and that was right while libgcc was IMPOSSIBLE: the transplanted
          # compiler segfaulted at
          #   libgcc/unwind-dw2.c:1490:44: internal compiler error
          # every single time. Diagnosed 2026-07-26 as a declaration that moved headers
          # between 4.7 and 4.8 -- get_hard_reg_initial_val, integrate.h -> function.h --
          # and tools/port_gcc47_api.py now adds the include. libgcc.a then built at
          # 992,532 bytes.
          #
          # So "does it build" is answered, and the live question is "does it build
          # COMPLETELY": libgcc, and an xgcc that can link.
          #
          # ARM B IS A DELIBERATE EXCEPTION. It targets arm-none-eabi, bare metal with
          # no libc here, so libgcc cannot be built and a failure there would say
          # nothing about the transplant. B stays on all-gcc; A and C target Linux and
          # do the full build.
          case "${{ matrix.arm }}" in
            B-*) MKTGT="all-gcc"; echo "  target: all-gcc (bare-metal arm, no libc for libgcc)" ;;
            *)   MKTGT="all";     echo "  target: all (full build, through libgcc)" ;;
          esac
          timeout 7200 make -k -j"$(nproc)" -Otarget MAKEINFO=true $MKTGT > build.log 2>&1
          rc=$?
          # Run 1 printed "(124 = timed out)" next to rc=2, which reads as a
          # claim rather than a legend. Say what actually happened.
          case "$rc" in
            0)   echo "  make rc=0 -- completed" ;;
            124) echo "  make rc=124 -- TIMED OUT after 7200s" ;;
            *)   echo "  make rc=$rc -- failed" ;;
          esac
          echo "BUILD_RC=$rc" >> "$GITHUB_ENV"
          echo "  build.log: $(wc -l < build.log) lines"

      - name: 'INVENTORY'
        continue-on-error: true
        run: |
          set -u
          # set +e is load-bearing: this step deliberately re-runs a command it
          # EXPECTS to fail. GitHub runs `bash -e`, so without this the serial
          # rebuild aborts the step and the inventory prints nothing -- which is
          # exactly what happened to arm C in run 3.
          set +e
          cd build
          # Run 1 showed an EMPTY error-class list beside 24 "failing files".
          # Both cannot be right: the file list grepped any 'file.c:' line, which
          # matches WARNINGS too, and the actual failure was never printed.
          echo "  === what make itself said failed ==="
          grep -nE '^\s*make(\[[0-9]+\])?: \*\*\* ' build.log | head -10 | sed 's/^/    /'
          echo
          echo "  === the first failure, in context ==="
          n=$(grep -nE '^\s*make(\[[0-9]+\])?: \*\*\* ' build.log | head -1 | cut -d: -f1)
          if [ -n "${n:-}" ]; then
            start=$(( n > 40 ? n - 40 : 1 ))
            sed -n "${start},${n}p" build.log | tail -30 | sed 's/^/    /'
          else
            echo "    (make reported no *** failure)"
          fi
          echo
          echo "  === the failing target, rebuilt SERIALLY for a clean error ==="
          # Even with -Otarget, the surest way to see what actually broke is to
          # rebuild just that target with -j1.
          TGT_OBJ=$(grep -oE '\*\*\* \[[^]:]+:[0-9]+: [^]]+\]' build.log \
                    | sed 's/.*: //; s/\]//' | grep -vE '^all-|^\.' | head -1)
          if [ -n "${TGT_OBJ:-}" ]; then
            echo "    target: $TGT_OBJ"
            # Targets reported by make[1] live in a SUBDIRECTORY. Run 6 tried
            # `make -j1 s-preds` at the top level and got "No rule to make
            # target 's-preds'", learning nothing. Try the top level, then gcc/.
            timeout 900 make -j1 MAKEINFO=true "$TGT_OBJ" > serial.log 2>&1
            src=$?
            if grep -q "No rule to make target" serial.log; then
              echo "    (not a top-level target; retrying in gcc/)"
              timeout 900 make -C gcc -j1 MAKEINFO=true "$TGT_OBJ" > serial.log 2>&1
              src=$?
            fi
            echo "    serial rc=$src"
            grep -E 'error:|Error ' serial.log | head -15 | sed 's/^/      /'
            [ -s serial.log ] && tail -15 serial.log | sed 's/^/      /'
            # A failing *configure* writes its reason to config.log, not to the
            # make output -- run 3's arm C died at configure-gcc right after
            # "checking if mkdir takes one argument" with no message anywhere.
            case "$TGT_OBJ" in
              configure-*)
                sub=${TGT_OBJ#configure-}
                for cl in "$sub/config.log" "config.log"; do
                  if [ -f "$cl" ]; then
                    echo "    --- $cl (tail) ---"
                    tail -30 "$cl" | sed 's/^/      /'
                    break
                  fi
                done ;;
            esac
          else
            echo "    (could not parse a failing target)"
          fi
          echo
          echo "  === MACHINE DESCRIPTION errors ==="
          # The generators read .md files and report problems with a
          # "file.md:LINE:" prefix, not "error:" -- run 6 reported 0 errors and
          # 471 warnings while four generator RUNS were failing. A backport that
          # gets this far fails in the .md, so look there explicitly.
          grep -nE '\.md:[0-9]+' build.log | head -20 | sed 's/^/    /'
          echo "    .md diagnostics: $(grep -cE '\.md:[0-9]+' build.log || true)"
          echo
          echo "  === context for EACH failing target, not just the first ==="
          # With -Otarget each target's output is grouped, so the lines just
          # before its *** line are that target's own output.
          for n in $(grep -nE '^\s*make(\[[0-9]+\])?: \*\*\* ' build.log \
                     | cut -d: -f1 | head -4); do
            echo "    ---- around line $n ----"
            start=$(( n > 15 ? n - 15 : 1 ))
            sed -n "${start},${n}p" build.log | sed 's/^/      /'
          done
          echo
          echo "  === compiler ERRORS only (not warnings) ==="
          grep -oE '\berror: [^,;]*' build.log | sed 's/[0-9]\+/N/g' \
            | sort | uniq -c | sort -rn | head -20 | sed 's/^/    /'
          echo "    total error lines  : $(grep -cE '\berror:' build.log || true)"
          echo "    total warning lines: $(grep -cE '\bwarning:' build.log || true)"
          echo
          echo "  === files with an ERROR (not merely a diagnostic) ==="
          grep -oE '^[^ :]+\.(c|h|md):[0-9]+:[0-9]*:? *error:' build.log \
            | cut -d: -f1 | sort -u | head -20 | sed 's/^/    /'
          echo
          echo "  === generators (they turn .md into C) ==="
          for g in genemit genattrtab genrecog genextract genoutput genpreds; do
            printf '    %-12s %s\n' "$g" "$( [ -x gcc/build/$g ] && echo built || echo 'not built')"
          done
          echo "    insn-*.c generated: $(ls gcc/insn-*.c 2>/dev/null | wc -l)"
          echo
          echo "  objects built: $(find . -name '*.o' | wc -l)"
          echo "  cc1          : $( [ -x gcc/cc1 ] && echo BUILT || echo no)"

      - name: 'THE CLAIM: does the backported compiler actually compile?'
        if: always()
        continue-on-error: true
        run: |
          set -u
          set +e
          cd build
          # A BUILT cc1 IS NOT A WORKING COMPILER. The whole point of the leg is
          # a gcc that targets aarch64, so make it emit aarch64 code and run it.
          [ -x gcc/cc1 ] || { echo "  no cc1 -- nothing to test"; exit 0; }
          echo "  cc1: $(gcc/cc1 --version 2>&1 | head -1)"
          echo "  size: $(wc -c < gcc/cc1) bytes"
          echo

          cat > /tmp/t.c <<'CEOF'
          int fib(int n) { return n < 2 ? n : fib(n-1) + fib(n-2); }
          int main(void) { return fib(10); }
          CEOF

          echo "  --- 1. cc1 emits assembly ---"
          gcc/cc1 -quiet -O2 /tmp/t.c -o /tmp/t.s 2>&1 | head -5 | sed 's/^/    /'
          if [ -s /tmp/t.s ]; then
            echo "    produced $(wc -l < /tmp/t.s) lines"
            echo "    --- is it aarch64? ---"
            grep -qE '\b(stp|ldp|w[0-9]+|x[0-9]+)\b' /tmp/t.s \
              && echo "    YES: aarch64 mnemonics/registers present" \
              || echo "    NO: does not look like aarch64"
            head -18 /tmp/t.s | sed 's/^/      /'
          else
            echo "    cc1 produced no assembly"
          fi
          echo

          echo "  --- 2. assemble and run it (system as/ld, our compiler) ---"
          if [ -s /tmp/t.s ]; then
            as /tmp/t.s -o /tmp/t.o 2>&1 | head -5 | sed 's/^/    /'
            if [ -f /tmp/t.o ]; then
              echo "    assembled: $(file /tmp/t.o | cut -d, -f1-2)"
              gcc /tmp/t.o -o /tmp/t 2>&1 | head -3 | sed 's/^/    /'
              if [ -x /tmp/t ]; then
                /tmp/t; rc=$?
                echo "    ran: exit=$rc (fib(10)=55, so 55 expected)"
                [ "$rc" = 55 ] && echo "    PASS: a gcc 4.7 carrying 4.8's aarch64 backend" \
                              && echo "          compiled and ran correct aarch64 code."
              fi
            fi
          fi
          echo
          echo "  --- 2b. IMPLICIT DECLARATIONS IN THE BACKEND ---"
          # THIS CHECK EXISTS BECAUSE ITS ABSENCE COST THE LEG WEEKS. A declaration that
          # moved headers is a WARNING, not an error: C89 assumes an int return and on
          # LP64 the returned pointer is truncated to 32 bits and sign extended --
          #   tem = 0xfffffffff6b46500      non-null, so it passes a NULL check
          # -- and the compiler segfaults on first dereference, a hundred objects into
          # libgcc, with nothing on its face pointing at a missing include. The build
          # reported "0 errors, 471 warnings" and the one warning that mattered was the
          # ONLY implicit declaration in it.
          #
          # Any implicit declaration in the TRANSPLANTED BACKEND is a latent truncated
          # pointer, not a style complaint. Fail on it.
          # `|| echo 0` IS WRONG HERE AND IT SHOWED. grep -c PRINTS the count and
          # then EXITS 1 when there are no matches, so the fallback appended a
          # SECOND zero. IMPL became "0\n0", the log read
          #   implicit declarations in the whole build: 0
          #   0
          # and the next line was
          #   [: 0\n0: integer expression expected
          # grep -c always prints a number, so `|| true` is all that is needed.
          IMPL=$(grep -c "implicit declaration" build.log 2>/dev/null || true)
          [ -n "$IMPL" ] || IMPL=0
          echo "    implicit declarations in the whole build: $IMPL"
          BACKEND_IMPL=0
          if [ "$IMPL" -gt 0 ]; then
            grep -n "implicit declaration" build.log | head -10 | sed "s/^/      /"
            BE=$(grep "implicit declaration" build.log | grep -c "config/aarch64" || true)
            echo "    of those, in config/aarch64: ${BE:-0}"
            if [ "${BE:-0}" -gt 0 ]; then
              echo "    ^^ EACH ONE IS A TRUNCATED POINTER WAITING TO HAPPEN."
              echo "    Find which header 4.7 declares it in and add a rule to"
              echo "    tools/port_gcc47_api.py with kind=include."
              BACKEND_IMPL=1
            fi
          fi
          echo
          echo "  --- 2c. did the RUNTIME build? ---"
          LG=$(find . -name libgcc.a 2>/dev/null | head -1)
          echo "    libgcc.a: ${LG:-NOT BUILT}"
          [ -n "$LG" ] && echo "    size    : $(wc -c < "$LG") bytes"
          echo
          echo "  --- 3. the full driver, if it was built ---"
          if [ -x gcc/xgcc ]; then
            gcc/xgcc -B gcc/ -O2 /tmp/t.c -o /tmp/t2 2>&1 | head -5 | sed 's/^/    /'
            [ -x /tmp/t2 ] && { /tmp/t2; echo "    xgcc end-to-end: exit=$? (expect 55)"; }
          else
            echo "    xgcc not built"
            echo "    (expected on arm B, which stops at all-gcc; on A or C it means"
            echo "     the runtime did not finish -- see 2b and 2c above)"
          fi
          [ "${BACKEND_IMPL:-0}" -eq 0 ] || {
            echo
            echo "  FAILING THE ARM: the backend compiled with an implicit declaration."
            echo "  That is the exact shape of the ICE this leg already spent weeks on."
            exit 1; }

      - name: 'SIZE THE NEXT FIX'
        continue-on-error: true
        run: |
          set -u
          set +e
          # Run 7 found the transplant's real blocker, and it is one construct:
          #   config/aarch64/iterators.md:664:
          #     unknown rtx code `define_int_iterator'
          # define_int_iterator / define_int_attr are machine-description
          # features ADDED IN 4.8. The backend's C compiles clean and uses no
          # 4.8 target hooks; what it uses is a newer .md LANGUAGE.
          #
          # Two ways out, and the cost of each is measurable right here:
          #   1. teach 4.7's generators the construct (read-rtl.c, rtl.def,
          #      gensupport.c) -- principled, and fixes it for any backend
          #   2. expand the iterators in aarch64's .md by hand/script --
          #      touches only our copy, but is mechanical text expansion
          echo "  === how much of 4.7 -> 4.8 is the RTL reader? ==="
          # NOT `diff | diffstat -s`. diffstat closes the pipe early, diff dies
          # on SIGPIPE, and the empty result gets reported as "identical" --
          # run 8 claimed all five files were identical when the measurement had
          # simply failed. Diff to a FILE, then distinguish empty-because-same
          # from empty-because-broken.
          for f in gcc/read-rtl.c gcc/gensupport.c gcc/rtl.def gcc/read-md.c gcc/read-md.h; do
            b=$(basename "$f")
            if [ ! -f "g474/$f" ]; then printf '    %-20s absent in 4.7.4\n' "$b"; continue; fi
            if [ ! -f "g485/$f" ]; then printf '    %-20s absent in 4.8.5\n' "$b"; continue; fi
            if cmp -s "g474/$f" "g485/$f"; then
              printf '    %-20s byte-identical\n' "$b"; continue
            fi
            diff -u "g474/$f" "g485/$f" > "d-$b.diff" 2>/dev/null
            add=$(grep -c '^+[^+]' "d-$b.diff" || true)
            del=$(grep -c '^-[^-]' "d-$b.diff" || true)
            hunks=$(grep -c '^@@' "d-$b.diff" || true)
            ii=$(grep -c '^[+-].*\(int_iterator\|int_attr\|INT_ITERATOR\)' "d-$b.diff" || true)
            printf '    %-20s +%-5s -%-5s %-3s hunks, %s of those lines mention int iterators\n' \
              "$b" "$add" "$del" "$hunks" "$ii"
          done
          echo
          echo "  === how much of that is int-iterator specific? ==="
          for f in gcc/read-rtl.c gcc/gensupport.c gcc/rtl.def; do
            [ -f "g485/$f" ] || continue
            printf '    %-20s 4.8 mentions int_iterator/int_attr: %s\n' \
              "$(basename $f)" "$(grep -ciE 'int_iterator|int_attr' "g485/$f" || true)"
          done
          echo
          echo "  === how much would option 2 have to expand? ==="
          echo "    aarch64 .md files using the construct:"
          grep -rlE 'define_int_iterator|define_int_attr' g474/gcc/config/aarch64/ 2>/dev/null \
            | sed 's/^/      /'
          echo "    define_int_iterator uses : $(grep -rc 'define_int_iterator' g474/gcc/config/aarch64/*.md 2>/dev/null | awk -F: '{s+=$2} END{print s+0}')"
          echo "    define_int_attr uses     : $(grep -rc 'define_int_attr' g474/gcc/config/aarch64/*.md 2>/dev/null | awk -F: '{s+=$2} END{print s+0}')"
          # Count only the iterators that are actually INT iterators. The raw
          # <FOO> count includes mode and code iterators, which 4.7 already
          # supports, so it wildly overstates option 2's work.
          ints=$(grep -hoE '^\(define_int_(iterator|attr) +[A-Za-z_0-9]+' \
                 g474/gcc/config/aarch64/*.md 2>/dev/null | awk '{print $2}' | sort -u)
          echo "    distinct int iterator/attr names: $(printf '%s\n' "$ints" | grep -c . || true)"
          n=0
          for i in $ints; do
            c=$(grep -roE "<$i>" g474/gcc/config/aarch64/*.md 2>/dev/null | wc -l)
            n=$((n + c))
          done
          echo "    references to THOSE names        : $n"
          echo "    (raw <FOO> count, incl. mode/code iterators 4.7 already has: $(grep -roE '<[A-Za-z_]+>' g474/gcc/config/aarch64/*.md 2>/dev/null | wc -l))"
          echo
          echo "  Option 1 is bounded by the read-rtl.c/rtl.def delta above and"
          echo "  fixes every backend. Option 2 is bounded by the expansion count"
          echo "  and touches nothing outside our own copy of the backend."

      - name: 'Package the sources needed to write the expander'
        if: always()
        continue-on-error: true
        run: |
          set -u
          set +e
          # Arm C already fetches 4.8.5 for the transplant, so no arm needs
          # re-enabling to get these. Everything here is what it takes to write
          # and TEST an int-iterator expander off-CI, plus what it takes to size
          # option 1 honestly (the read-rtl.c delta, which the grep could not).
          mkdir -p pkg/aarch64-md pkg/rtl-reader-47 pkg/rtl-reader-485 pkg/diffs

          # 1. The machine descriptions the expander has to consume, and the
          #    backend they belong to.
          cp -r g485/gcc/config/aarch64/. pkg/aarch64-md/ 2>/dev/null

          # 2. Both versions of the RTL reader. 4.8 implements define_int_iterator
          #    through a generic iterator_group abstraction, which is why
          #    grepping for the literal name found only 4 lines in a 514-line
          #    diff. Reading both files is the only way to size option 1.
          for f in read-rtl.c gensupport.c rtl.def read-md.c read-md.h; do
            cp "g474/gcc/$f" "pkg/rtl-reader-47/$f"  2>/dev/null
            cp "g485/gcc/$f" "pkg/rtl-reader-485/$f" 2>/dev/null
          done

          # 3. The diffs already computed, so they need not be recomputed.
          cp build/d-*.diff pkg/diffs/ 2>/dev/null
          cp d-*.diff pkg/diffs/ 2>/dev/null

          {
            echo "gcc 4.8.5 aarch64 backend + both RTL readers"
            echo
            echo "aarch64-md/     gcc/config/aarch64 from 4.8.5 (the transplant source)"
            echo "rtl-reader-47/  4.7.4's read-rtl.c, gensupport.c, rtl.def, read-md.[ch]"
            echo "rtl-reader-485/ 4.8.5's same five files"
            echo "diffs/          precomputed 4.7 -> 4.8 diffs of those files"
            echo
            echo "The blocker: config/aarch64/iterators.md uses define_int_iterator"
            echo "and define_int_attr, machine-description constructs added in 4.8."
            echo "34 definitions, 81 references, all in iterators.md."
          } > pkg/README.txt

          echo "  --- package contents ---"
          find pkg -maxdepth 2 -type d | sed 's/^/    /'
          echo "    .md files      : $(find pkg/aarch64-md -name '*.md' | wc -l)"
          echo "    total files    : $(find pkg -type f | wc -l)"
          echo "    size           : $(du -sh pkg | cut -f1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcc-aarch64-md-and-rtl-reader
          path: pkg
          if-no-files-found: warn

      - name: 'ARM RESULT'
        run: |
          cd build 2>/dev/null || exit 0
          echo "  arm        : ${{ matrix.arm }}"
          echo "  target     : ${TGT:-?}"
          echo "  configure  : rc=${CONF_RC:-?}"
          echo "  build      : rc=${BUILD_RC:-?}"
          echo "  cc1        : $( [ -x gcc/cc1 ] && echo BUILT || echo no)"
          # THE RUNTIME AND THE DRIVER NOW BELONG IN THE HEADLINE. Until
          # 2026-07-26 neither could be built at all -- the transplanted
          # compiler segfaulted in libgcc every time -- so this summary
          # stopped at cc1. With the missing include in place a full `make`
          # completes, and these two lines are what say the transplant is a
          # USABLE compiler rather than merely a compiling one.
          LGA=$(find . -name libgcc.a 2>/dev/null | head -1)
          if [ -n "$LGA" ]; then
            echo "  libgcc.a   : $(wc -c < "$LGA" | tr -d ' ') bytes"
          else
            echo "  libgcc.a   : NOT BUILT"
          fi
          echo "  xgcc       : $( [ -x gcc/xgcc ] && echo BUILT || echo no)"
          echo
          echo "  Compare the three arms before drawing any conclusion:"
          echo "    A fails               -> the environment. Nothing else is readable."
          echo "    A ok, B fails         -> 4.7.4 does not build here at all."
          echo "    A ok, B ok, C fails   -> the transplant, and the inventory means something."
