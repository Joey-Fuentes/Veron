name: stage5-mirror-upload

# GIVE EVERY PIN A SECOND ROUTE, INCLUDING THE ONES NO REWRITE CAN REACH.
#
# `probe mirrors` found 26 verified routes for 11 packages by rewriting known
# host families -- GNU, kernel.org, SourceForge. That leaves most of the set
# with exactly one place to get it: GitHub releases, freedesktop GitLab,
# Codeberg, curl.se, sqlite.org, cairographics.org, astron.com. There is no
# rewrite that reaches those, because they have no mirrors to rewrite to.
#
# THE ANSWER IS THE ONE HOSTS.toml WAS DESIGNED FOR: upload the bytes to our
# own release namespace and record the locator. The `github` host is
# `derivable` -- its URL is a function of the hash and the name -- so the
# route needs no table row to be computed, only an asset to exist. Only
# pkgconf was ever uploaded, which is why the template has been resolving to
# 404s all along and why the fallback never helped when kernel.org timed out.
#
# THIS IS AN AVAILABILITY MECHANISM AND NOT A TRUST ONE. Every fetch verifies
# sha256 before the bytes are used, so our mirror serving something wrong
# costs time and nothing else. That property is what makes uploading
# everything a reasonable thing to do rather than a claim about us.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry_run -- print what would be uploaded, change nothing'
        type: boolean
        # DEFAULT false, AND THIS COST THREE RUNS. The default was true, and
        # GitHub's dispatch form shows an input's DESCRIPTION and never its
        # name -- so the box read "Print what would be uploaded, change
        # nothing" with no indication it was the dry-run switch or that it was
        # already ticked. Three consecutive runs processed everything, printed
        # every locator, and committed nothing, each looking like a successful
        # mirror.
        #
        # A job whose default behaviour is to do nothing is a job that will be
        # run and believed. Uploading is idempotent -- `gh release upload
        # --clobber` and a table that dedupes by sha -- so the safe default is
        # the one that works, and the caution belongs on the checkbox for
        # whoever wants a preview.
        default: false
        # ASSETS DO NOT ENTER GIT. `gh release upload` writes to GitHub
        # Releases, which is separate storage: the object database is
        # untouched, a clone does not fetch them, and the repository's size
        # and clone time are unchanged. The only thing this commits is
        # sources/MIRRORS.tsv -- one line per route -- which is exactly why
        # HOSTS.toml calls the table "generated and committed" and keeps
        # locators in text rather than blobs.
        #
        # ONE RELEASE PER PACKAGE, under the `src/` tag prefix, is HOSTS.toml's
        # deliberate choice: it keeps each asset list navigable and makes
        # withdrawing a single artifact possible without touching the others.
        # The prefix is what keeps this namespace visibly separate from real
        # release tags.
      only:
        description: 'Restrict to these package names (blank = all)'
        required: false
        default: ''

permissions:
  contents: write        # gh release upload writes to this repository

concurrency:
  group: stage5-mirror-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # The default checkout is a detached commit with no
          # branch, so a push has nothing to push to.
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: 'Discover free routes by rewriting the upstream URL'
        run: |
          set -eu
          cd spikes/stage5
          # `probe mirrors` walks packages/, so it finds rewrites only for
          # packages that have recipes -- the same recipes-only assumption
          # that left 71 artifacts on a single host. It still only covers the
          # 41 here; the other 67 get their second route from the upload
          # below, which is the route that does not depend on anyone else.
          # ALL 111, not the 41 with recipes. This walked packages/ only, so
          # 70 artifacts never got a discovered route and sat on one host
          # through every probe and every build -- which is what the order
          # run's seven 502s and timeouts were.
          python3 -u tools/probe.py mirrors --packages packages \
            --urls remaining-urls.txt gap-urls.txt gap3-urls.txt \
            --out "$GITHUB_WORKSPACE/sources/MIRRORS.tsv" || true

      - name: 'Fetch everything in the set, recipe or not'
        run: |
          set -eu
          cd spikes/stage5
          mkdir -p dl

          # EVERY PACKAGE, NOT ONLY THE ONES WITH RECIPES.
          #
          # This iterated `veron sources`, which reads recipes -- so a package
          # could not be mirrored until it was written. That is backwards: a
          # package needs a second route MOST while it is being probed
          # repeatedly, before anyone writes anything. The result was 40 of
          # 111 mirrored and the other 71 sitting on a single upstream host,
          # which the order run then demonstrated:
          #     TimeoutError, HTTP 502 Bad Gateway, urlopen timed out  x7
          # The three that recovered -- m4, ncurses, readline -- recovered
          # because they were among the 40.
          #
          # The URL lists are already committed and already the probe's input,
          # so they are the right source of truth here too.
          { python3 tools/veron sources | awk -F'\t' '{print $1 "\t" $2 "\t" $3}'
            for f in remaining-urls.txt gap-urls.txt gap3-urls.txt; do
              [ -f "$f" ] || continue
              grep '^http' "$f" | while read -r u; do
                # No digest for these yet -- they have no recipe. mirror.py
                # needs one, so fetch directly and hash what arrives. The
                # upload records OUR digest of OUR copy, which is exactly what
                # a mirror row means.
                # NOT basename. Forge archive URLs end in the TAG, so
                # codeberg.org/dnkl/fcft/archive/3.3.1.tar.gz yields
                # "3.3.1.tar.gz" -- a release nobody can identify, and one
                # that collides the moment two projects tag the same version.
                # Four such releases exist right now. mirror.py reads the
                # project name out of the path instead.
                n=$(python3 -c 'import sys; sys.path.insert(0, "../../tools"); import mirror; print(mirror.artifact_name(sys.argv[1]))' "$u")
                printf -- '-\t%s\t%s\n' "$n" "$u"
              done
            done
          } | sort -u -k2,2 > /tmp/all-sources.tsv
          echo "  $(wc -l < /tmp/all-sources.tsv) artifacts in the set"

          while IFS=$'\t' read -r sha name url; do
            [ -n "$name" ] || continue
            if [ -n "${{ inputs.only }}" ]; then
              case " ${{ inputs.only }} " in *" ${name%%-*} "*) ;; *) continue ;; esac
            fi
            [ -f "dl/$name" ] && continue
            if [ "$sha" != "-" ]; then
              # POSITIONAL, NOT FLAGS: `mirror fetch <sha256> <name>`.
              python3 ../../tools/mirror.py fetch "$sha" "$name" --dest dl --url "$url" \
                || echo "  FETCH FAILED $name"
            else
              # curl, not an inline heredoc: a heredoc body sits at column 0
              # and a YAML block scalar cannot contain it -- the same trap
              # that broke two earlier workflows in this repository.
              #
              # --http1.1 and --retry-all-errors are stage 4's lessons: h2
              # stream errors are not on curl's default retry list, and long
              # transfers on shared runners fail that way.
              # Discovery runs BEFORE this, so by now the table already has
              # routes for artifacts with no recipe -- and mirror.py will use
              # them. Passing "unpinned" as the digest means "take what
              # arrives"; the upload then records OUR hash of OUR copy, which
              # is what a mirror row asserts anyway.
              #
              # --http1.1 and --retry-all-errors are stage 4's findings: h2
              # stream errors are not on curl's default retry list, and long
              # transfers over h2 on shared runners fail exactly that way.
              curl -fsSL --http1.1 --retry 3 --retry-all-errors \
                   --connect-timeout 20 --max-time 300 \
                   -o "dl/$name" "$url" || echo "  FETCH FAILED $name"
            fi
          done < /tmp/all-sources.tsv
          echo ""
          echo "  $(ls dl | wc -l) tarballs in dl/"

      # GIT-PINNED SOURCES ARE GENERATED, THEN MIRRORED LIKE ANYTHING ELSE.
      #
      # libxkbcommon, dinit and libsfdo publish NO TARBALL. `veron sources`
      # deliberately omits them -- their bytes do not exist upstream -- so
      # every mirror run so far has left them with exactly ONE route: a clone
      # of the forge. A deleted repo, a renamed project or a force-pushed tag
      # and there is nowhere else to go.
      #
      # WHAT WE UPLOAD IS BETTER PROVENANCE THAN A FORGE ARCHIVE, not worse.
      # fetch-git.sh verifies HEAD against the pinned commit -- a Merkle hash
      # over the whole tree -- then runs `git archive` with a fixed prefix and
      # `gzip -n` so no timestamp or filename lands in the header. Two runs of
      # that against one commit are byte-identical. A forge archive, by
      # contrast, is synthesised on request with that forge's git and gzip;
      # GitHub moved every one of theirs once already.
      #
      # THE PIN STAYS THE COMMIT. The sha256 recorded here is of OUR derived
      # artifact, and fetch-git.sh now compares it rather than printing it --
      # which is the one thing llvm-timing.yml did wrong for three runs.
      - name: 'Generate and mirror the git-pinned sources'
        run: |
          set -eu
          cd spikes/stage5
          mkdir -p dl
          # EACH STEP IS ITS OWN SHELL, so DRY has to be derived here too --
          # and with a real `if`, not an and-list, for the reason the upload
          # step records: under `set -e` a false test as the last command
          # exits 1.
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python3 tools/veron git-sources \
            | while IFS="$(printf '\t')" read -r commit name url want; do
            [ -n "$commit" ] || continue
            echo "== $name (commit pin)"
            sh ../../tools/fetch-git.sh "$commit" "$name" "$url" dl ${want:+"$want"}
            f="dl/$name.tar.gz"
            [ -f "$f" ] || { echo "  fetch-git.sh wrote nothing"; exit 1; }
            python3 ../../tools/mirror.py add github "$f" \
              --upstream "$url@$commit" $DRY || echo "  ADD FAILED $name"
          done

      - name: 'Upload each to the mirror and record the locator'
        run: |
          set -eu
          cd spikes/stage5
          # A PROPER `if`, NOT AN AND-LIST. Under `set -e`,
          #     [ "$x" = "true" ] && DRY="--dry-run"
          # exits the step with status 1 whenever the test is false AND it is
          # the last command -- verified. It is not last today, so it works;
          # it would break the moment anyone appended a line, and that is a
          # bad way to find out.
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          # THE TAG IS PER PACKAGE, so a release page stays navigable and a
          # single artifact can be withdrawn without touching the others.
          # `gh release create` is idempotent enough here: it fails loudly if
          # the tag exists, which the || true absorbs, and the upload then
          # --clobbers whatever was there.
          # The upstream URL per artifact, so `add` can record provenance
          # next to the route it just created.
          # THE SAME LIST THE FETCH USED, not `veron sources` again -- that
          # reads recipes, so the 67 artifacts that have no recipe yet would
          # get a mirror row and no provenance row, and the table would say
          # they came from nowhere.
          awk -F'\t' '{print $1 "\t" $2 "\t" $3}' /tmp/all-sources.tsv > /tmp/srcmap.tsv
          for f in dl/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            # SKIP THE STAGED COPIES. `mirror add` writes a <sha8>-<name>
            # copy next to the original so the uploaded asset matches the
            # derivable template, so dl/ ends up holding both. Iterating over
            # both uploaded everything twice and, worse, a first attempt
            # stripped the prefix with ${base#*-} on EVERY name -- turning
            # autoconf-2.73.tar.xz into 2.73.tar.xz, matching nothing, and
            # silently recording no upstream row for any package.
            case "$base" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]-*)
                continue ;;
            esac
            up=$(awk -F'\t' -v n="$base" '$2==n {print $3; exit}' /tmp/srcmap.tsv)
            echo "== $base"
            [ -n "$up" ] || echo "  (no upstream URL found for $base)"
            # POSITIONAL AGAIN: `mirror add <host> <file>`. Both calls in
            # this workflow were written from memory of a flag-shaped CLI that
            # never existed, and the selftest only checked option strings --
            # so nothing caught either until every fetch failed identically.
            python3 ../../tools/mirror.py add github "$f" \
              ${up:+--upstream "$up"} $DRY \
              || echo "  ADD FAILED $base"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      # COMMIT THE TABLE. IT IS THE POINT OF THE JOB.
      #
      # Until now this wrote sources/MIRRORS.tsv into the runner's workspace,
      # uploaded it as an artifact, and threw the workspace away -- so the
      # asset existed on Releases and NOTHING POINTED AT IT. Closing the loop
      # meant a human downloading a zip, finding the file inside it, copying
      # it over, and committing. That is not a workflow, it is a chore with a
      # workflow attached, and it has already been forgotten once: freetype
      # had four verified routes sitting in an artifact while the next run
      # died fetching it.
      #
      # sources/HOSTS.toml calls this file "Generated and committed", which
      # implies a generator that can write. This is that generator.
      - name: 'Commit the routes'
        if: inputs.dry_run != true
        run: |
          set -eu
          if git diff --quiet -- sources/MIRRORS.tsv; then
            echo "  no new routes -- table unchanged"
            exit 0
          fi
          echo "  --- what changed ---"
          git --no-pager diff --stat -- sources/MIRRORS.tsv
          git --no-pager diff -- sources/MIRRORS.tsv | grep '^+' | grep -v '^+++' \
            | head -20 | sed 's/^/    /'
          git config user.name  "veron-mirror[bot]"
          git config user.email "veron-mirror@users.noreply.github.com"
          git add sources/MIRRORS.tsv
          n=$(git diff --cached --numstat -- sources/MIRRORS.tsv | awk '{print $1}')
          git commit -m "mirrors: +${n:-0} routes (stage5-mirror-upload)"
          # PUSH WITH A REBASE, NOT --force. Two mirror jobs racing, or a
          # human commit landing mid-run, must not lose work -- and the table
          # is sorted and deduped on write, so a rebase merges cleanly.
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "  push race, retrying ($i)"
            sleep $((i * 3))
          done
          echo "  could not push the table after three attempts"
          exit 1

      - name: 'What the table says now'
        if: always()
        run: |
          set -eu
          echo "  === ROUTES PER ARTIFACT ==="
          awk -F'\t' '!/^#/ && NF>=4 {c[$2]++} END {for (n in c) printf "  %-42s %d\n", n, c[n]}' \
            sources/MIRRORS.tsv 2>/dev/null | sort || echo "  (no table yet)"
          echo ""
          echo "  THIN means one route. After this every artifact should have"
          echo "  at least two: upstream as provenance, and ours as a route"
          echo "  that does not depend on anyone else's uptime."
