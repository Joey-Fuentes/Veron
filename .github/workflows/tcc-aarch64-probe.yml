name: tcc-aarch64-probe

# SPIKE. IS tcc's AARCH64 BACKEND REAL ENOUGH TO BUILD ON?
#
# THE QUESTION THIS DECIDES. The Mes path forces a cross-architecture detour and
# then LEAVES US ON THE WRONG ARCHITECTURE:
#
#   Mes path:    G1 --arch x86 -> x86 mes-m2 (qemu-i386) -> MesCC x86
#                -> patched x86 tcc 0.9.26 -> x86 tcc 0.9.27
#                ...and now we have an x86 toolchain on an aarch64 ladder.
#
#   Direct path: enhanced M2 (aarch64) -> aarch64 tcc -> self-hosts
#                -> native, all the way down.
#
# MesCC is the ONLY component in the chain with no aarch64 backend (x86 + armhf
# only, GNU Mes 0.27). M2-Planet is aarch64-native -- proven byte-for-byte by our
# hand-off. tcc has had an arm64 backend since 0.9.27, which is exactly the
# version live-bootstrap pins. So if that backend self-hosts cleanly, the entire
# x86 apparatus (qemu-i386, --architecture x86 codegen, the armhf fallback
# analysis, the Cobalt/Neoverse fleet fragility in PROGRESS.md) can be deleted
# rather than worked around.
#
# "Has an arm64 backend" and "self-hosts and passes its own test suite on arm64"
# are DIFFERENT BARS. tcc's arm64 target has far fewer users than x86_64. This
# spike measures the second bar, natively on ubuntu-24.04-arm -- no emulation, so
# a failure is tcc's and not qemu's.
#
# WHAT IT DOES NOT DECIDE. Whether tcc can build gcc 4.7, and whether that gcc
# can build Linux, are downstream questions gated on this one. This spike reports
# the evidence relevant to them but does not attempt either.
#
# RUN 1 FINDING. arm64-gen.c (1837 lines) and arm64-link.c (256) are present and
# real: tcc builds, self-identifies as "0.9.27 (AArch64 Linux)", passes `make
# test` natively, and handles every C construct gcc 4.7's source needs (struct
# return by value, varargs, function pointers, 64-bit ints, floats, aggregate
# initialisers -- feat.c returns 6). BUT arm64-asm.c is ABSENT: tcc 0.9.27 has
# no INLINE ASSEMBLER for arm64, so kernel-style C fails. Linux uses inline asm
# pervasively, so that is a direct hit on the Linux leg -- a limitation of this
# pin, not of tcc in general (later versions add it).
#
# Pins come from live-bootstrap 9a268c4 -- the same commit whose stage0-posix
# pins ARE our three pins (see spikes/UPSTREAM-PINS.md), so tcc 0.9.27 is the
# version that set is built around.

on:
  push:
    paths:
      - '.github/workflows/tcc-aarch64-probe.yml'
  workflow_dispatch:

concurrency:
  group: tcc-aarch64-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04-arm      # NATIVE aarch64 -- no qemu in the way
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # WHY BOTH. live-bootstrap's pin (0.9.27, released 2017) mattered only
        # while their published checksums were our independent check. The direct
        # path self-validates -- tcc reaching a self-compile fixpoint is a
        # stronger gate than matching someone else's bytes -- so for OUR chain we
        # pick our own pin. mob is where arm64-asm.c lives, i.e. the inline
        # assembler 0.9.27 lacks and Linux needs.
        tcc: [pinned-0.9.27, mob-head]
    env:
      LB_SHA: 9a268c4c39cae952b268bc86da342be2175f03d4
    steps:
      - uses: actions/checkout@v5

      - name: Confirm we are actually on aarch64
        run: |
          echo "  uname -m : $(uname -m)"
          echo "  gcc      : $(gcc -dumpmachine)"
          [ "$(uname -m)" = aarch64 ] || { echo "NOT aarch64 -- probe is meaningless"; exit 1; }

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make curl git

      - name: 'Fetch tcc (${{ matrix.tcc }})'
        run: |
          if [ "${{ matrix.tcc }}" = mob-head ]; then
            # OUR pin, recorded so the result is reproducible.
            git clone -q git://repo.or.cz/tinycc.git tccsrc \
              || git clone -q https://repo.or.cz/tinycc.git tccsrc
            echo "  mob HEAD: $(git -C tccsrc rev-parse HEAD)"
            echo "  date    : $(git -C tccsrc log -1 --format=%ci)"
            echo "  RECORD THIS SHA if we adopt mob."
          else
            git clone -q https://github.com/fosslinux/live-bootstrap.git lb
            git -C lb checkout -q "$LB_SHA"
            SRC=$(ls -d lb/steps/tcc-*/ | sort -V | tail -1)
            echo "  using live-bootstrap's $SRC"
            URL=$(awk 'NR==1{print $2}' "$SRC/sources")
            SUM=$(awk 'NR==1{print $3}' "$SRC/sources")
            curl -sSL -o tcc.tar.bz2 "$URL"
            [ -n "$SUM" ] && { echo "$SUM  tcc.tar.bz2" | sha256sum -c - \
              && echo "  CHECKSUM OK" || echo "  CHECKSUM MISMATCH (noted)"; }
            mkdir -p tccsrc && tar xf tcc.tar.bz2 -C tccsrc --strip-components=1
          fi
          echo "  source: $(du -sh tccsrc | cut -f1)"

      - name: '1. Does the arm64 backend actually exist in this source?'
        run: |
          cd tccsrc
          echo "  --- target backends present ---"
          ls *-gen.c *-link.c *-asm.c 2>/dev/null | sed 's/^/    /'
          echo
          echo "  --- arm64 specifically ---"
          for f in arm64-gen.c arm64-link.c arm64-asm.c; do
            if [ -f "$f" ]; then printf '    %-14s %6s lines\n' "$f" "$(wc -l < $f)";
            else printf '    %-14s MISSING\n' "$f"; fi
          done
          echo
          echo "  --- what configure thinks it supports ---"
          grep -oE 'arm64|aarch64' configure | sort -u | sed 's/^/    /' || true
          echo "  --- version ---"
          cat VERSION 2>/dev/null | sed 's/^/    /' || true

      - name: '2. Build tcc with host gcc'
        run: |
          cd tccsrc
          ./configure --cc=gcc 2>&1 | tail -20 | sed 's/^/    /'
          make -j"$(nproc)" 2>&1 | tail -25 | sed 's/^/    /'
          echo
          ls -l tcc libtcc1.a 2>/dev/null | sed 's/^/    /'
          ./tcc -v 2>&1 | sed 's/^/    /'

      - name: '3. Does it compile and run a program?'
        run: |
          cd tccsrc
          printf '#include <stdio.h>\nint main(void){printf("tcc on %%s\\n","aarch64");return 42;}\n' > /tmp/h.c
          ./tcc -B. -o /tmp/h /tmp/h.c
          set +e; /tmp/h; rc=$?; set -e
          echo "    ran, exit=$rc (expect 42)"

      - name: '4. THE BAR: does tcc self-host on aarch64, to a fixpoint?'
        continue-on-error: true
        run: |
          cd tccsrc
          # USE THEIR BUILD, NOT A RECONSTRUCTED COMMAND. configure bakes a pile
          # of -DCONFIG_TCC_* macros into config.mak -- sysinclude paths, CRT
          # prefix, the triplet. A hand-written `tcc -o tcc2 tcc.c` produces a
          # compiler that cannot find crt1.o or the system headers, which is a
          # harness bug and not a tcc finding. `make CC=<compiler>` reuses the
          # whole config, so each generation is built exactly as gen1 was.
          set +e
          cp tcc tcc-gen1
          echo "  gen1 (built by gcc): $(wc -c < tcc-gen1) bytes"
          for g in 2 3; do
            prev=$((g-1))
            make clean >/dev/null 2>&1
            echo "  --- building gen$g with tcc-gen$prev ---"
            make -j"$(nproc)" CC="$PWD/tcc-gen$prev" 2>&1 | tail -12 | sed 's/^/    /'
            rc=$?
            if [ -x tcc ]; then
              cp tcc "tcc-gen$g"
              printf '    gen%s: rc=%s  %s bytes  %s\n' "$g" "$rc" \
                "$(wc -c < tcc-gen$g)" "$(sha256sum tcc-gen$g | cut -c1-16)"
            else
              echo "    gen$g: FAILED (rc=$rc, no binary)"; break
            fi
          done
          echo
          if [ -x tcc-gen2 ] && [ -x tcc-gen3 ]; then
            if cmp -s tcc-gen2 tcc-gen3; then
              echo "  FIXPOINT: gen2 == gen3 byte for byte"
            else
              echo "  gen2 != gen3  ($(cmp tcc-gen2 tcc-gen3 2>&1 | head -1))"
              echo "    (gen1 differing from gen2 is EXPECTED -- different compilers."
              echo "     gen2 == gen3 is the property that matters.)"
            fi
            echo "  --- does gen3 actually work? ---"
            ./tcc-gen3 -B. -o /tmp/h3 /tmp/h.c && { /tmp/h3; echo "    gen3-built program exit=$?"; }
          fi
          set -e

      - name: '5. tcc own test suite on aarch64'
        continue-on-error: true
        run: |
          cd tccsrc
          set +e
          timeout 900 make test 2>&1 | tail -60 | sed 's/^/    /'
          echo "  make test rc=$?"
          set -e

      - name: '6. Evidence for the DOWNSTREAM questions (gcc, Linux)'
        continue-on-error: true
        run: |
          cd tccsrc
          P="$GITHUB_WORKSPACE/spikes/stage3/probes"
          echo "  These are NOT attempted here -- this records what bears on them."
          echo
          echo "  --- gcc 4.7 needs a C compiler only (4.8+ switched to C++) ---"
          set +e
          ./tcc -B. -o /tmp/feat "$P/feat.c" 2>&1 | sed 's/^/    /'
          /tmp/feat; echo "    gcc-feature probe exit=$? (expect 6)"
          echo
          echo "  --- kernel-style C: inline asm, packed, sizeof ---"
          ./tcc -B. -o /tmp/kern "$P/kern.c" 2>&1 | sed 's/^/    /'
          /tmp/kern; echo "    kernel-style probe exit=$? (expect 0)"
          echo
          echo "  --- for comparison, the same probes under host gcc ---"
          gcc -o /tmp/featg "$P/feat.c" 2>/dev/null && { /tmp/featg; echo "    gcc feat exit=$?"; }
          gcc -o /tmp/kerng "$P/kern.c" 2>/dev/null && { /tmp/kerng; echo "    gcc kern exit=$?"; }
          set -e

      - name: 'VERDICT'
        run: |
          cd tccsrc
          echo "  arm64 backend present : $( [ -f arm64-gen.c ] && echo yes || echo NO )"
          echo "  builds with gcc       : $( [ -x tcc ] && echo yes || echo NO )"
          echo "  self-hosts (gen2)     : $( [ -s tcc-gen2 ] && echo yes || echo NO )"
          echo "  fixpoint (gen2==gen3) : $( [ -s tcc-gen3 ] && cmp -s tcc-gen2 tcc-gen3 && echo yes || echo 'no/na' )"
          echo "  inline asm on arm64   : $( [ -f arm64-asm.c ] && echo yes || echo 'NO -- arm64-asm.c absent' )"
          echo
          echo
          echo "  VARIANT: ${{ matrix.tcc }}"
          echo "  Compare the two matrix legs. If mob-head fixes inline asm AND"
          echo "  still reaches a fixpoint, adopt mob and record its SHA -- there"
          echo "  is no reason to inherit a 2017 release once the borrowed"
          echo "  checksums stop being our validation."
          echo
          echo "  If the arm64 backend self-hosts to a fixpoint and passes the test"
          echo "  suite, the direct path is viable and the ENTIRE x86 detour --"
          echo "  qemu-i386, --architecture x86 codegen, the armhf fallback, the"
          echo "  Cobalt/Neoverse fleet fragility -- can be deleted rather than"
          echo "  worked around. MesCC is then the only thing that needed x86, and"
          echo "  the direct path deletes MesCC."
