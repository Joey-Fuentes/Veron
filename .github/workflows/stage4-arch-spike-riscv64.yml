name: stage4-arch-spike-riscv64

# CAN THE WHOLE CHAIN BE PARAMETERISED BY TARGET, SEED UPWARDS?
#
# THE FIRST VERSION OF THIS SPIKE ASKED A SMALLER QUESTION AND GOT A REAL BUT
# PARTIAL ANSWER. It built tcc with the RUNNER'S gcc and walked from there,
# which is stage4-complete.yml's shape -- and that workflow says outright that
# its host-built tcc is "THE ONE DECLARED HOLE". A spike built on the hole
# cannot speak to whether a target is bootstrappable; it can only say that a
# ladder walks once someone hands it a compiler.
#
# stage0-stage4-complete.yml is the workflow that closes it: seed -> stage1 ->
# stage2 -> micro-c -> mc-tcc -> the gcc ladder -> a kernel that boots, with
# BUDGET_PATH EMPTY from the first byte to the last. That is the shape this
# spike now follows, because "does Veron support x86_64" means the seed climb,
# not the ladder above it.
#
# WHAT THE FIRST VERSION DID MEASURE, KEPT BECAUSE IT IS STILL TRUE:
#
#     tcc built for riscv64 with NO PATCH SERIES AT ALL, in 7m18s on a RISE
#     runner, where arm64 needs a carried series of relocation fixes --
#         tcc version 0.9.28rc HEAD@5ec0e6f8 (riscv64 Linux)
#         ELF 64-bit LSB executable, UCB RISC-V, double-float ABI
#
#     and Ekaitz Zarraga's fork carries the backend 4.7 never had --
#         tags:      working-compiler, working-compiler-c++
#         HEAD:      4fc2a17e65f
#         BASE-VER:  4.6.4        <- the repo, not 4.6.5; sources disagreed
#         riscv mentions in config.gcc: 19
#
# gcc 4.7.4's own config.gcc mentions riscv ZERO times, which is why that fork
# has to exist: RISC-V reached gcc upstream in 7.1, and 4.8 is already past
# what a C compiler can build. But none of this says anything about stage 0,
# and stage 0 is where a new architecture is won or lost.
#
# THE STAGE-0 SEAM, WHICH IS WHERE THIS SPIKE NOW POINTS.
# stage0-stage4-complete.yml derives M2-Planet's -f list from UPSTREAM'S OWN
# PER-ARCHITECTURE SCRIPT rather than hand-writing it:
#
#     S=m2/test/test1000/hello-aarch64.sh
#
# and its comment records why: four hand-reconstructed lists in a row were
# wrong, and four other workflows are still red because of one. So the first
# question for any new target is not "does gcc build" but
#
#     does upstream ship a hello-<arch>.sh for it, and does the same
#     derivation produce a usable list?
#
# If yes, the seed climb is parameterised the same way the gcc ladder is. If
# no, that architecture needs the list built some other way, and THAT is the
# work -- not the gcc rungs.
#
# WHAT SUCCESS LOOKS LIKE, stated before the run:
#   VERON-SPIKE-M2-OK       upstream ships hello-<arch>.sh and the -f list derives
#   VERON-SPIKE-TCC-OK      our pinned tcc targets this architecture
#   VERON-SPIKE-G474-OK     4.7.4 already carries this backend; no transplant
#   VERON-SPIKE-RISCV64-OK    all three
#
# WHAT FAILURE TELLS US, which is the more useful half:
#   no hello-<arch>.sh   -> stage 0 needs per-target work upstream does not do
#   list derives empty   -> the anchor is aarch64-shaped; see line 313 of
#                           stage0-stage4-complete.yml for the trap
#   tcc fails            -> this target needs its own patch series, as arm64
#                           did (it does not -- measured, see above)
#   the fork moves       -> the bottom rung is pinned to someone else's tag;
#                           that is a dependency this chain does not have
#                           anywhere else, and worth naming as one
#
# THIS SPIKE STILL STOPS SHORT OF BUILDING ANYTHING LARGE. It answers which
# rungs a target needs, not whether they pass. The rungs themselves live in a
# 3,967-line workflow that should be factored, not forked -- see the summary.

on:
  workflow_dispatch:
    inputs:
      stop_after:
        description: 'stop after this rung: m2 | tcc | g46 | selfhost'
        required: false
        default: 'g46'

permissions:
  contents: read

concurrency:
  group: stage4-arch-spike-riscv64-${{ github.ref }}
  cancel-in-progress: false

env:
  # THE THREE LINES THAT ARE SUPPOSED TO BE THE WHOLE DIFFERENCE. If more than
  # these have to change, that is the finding.
  LFS_TGT: riscv64-veron-linux-gnu
  # M2_ARCH IS UPSTREAM'S SPELLING, NOT OURS. M2-Planet names its test scripts
  # hello-<arch>.sh and its own -f tokens follow the same vocabulary, which is
  # not the same as a gnu triplet: it is `amd64` here, `aarch64` for arm64,
  # `riscv64` for riscv. Getting this wrong derives an empty list, which
  # stage0-stage4-complete.yml records as a trap that cost four workflows.
  M2_ARCH: riscv64
  # PINNED WHERE stage0-stage4-complete.yml PINS THEM. Copied deliberately
  # rather than referenced: if these drift apart, the spike is measuring a
  # different M2-Planet than the chain it is meant to inform.
  M2PLANET_SHA: bd2fe4b0659fd0ad3f476a5ad0ef801bd134665d
  M2LIBC_SHA: 68a23cfd05d5a355ba7a30c770d684cbe86fcc4e
  GNU_TGT: riscv64-unknown-linux-gnu
  GMP: 6.2.1
  MPFR: 4.1.0
  MPC: 1.2.1
  # THE BOTTOM IS A GIT FORK, NOT A RELEASE, AND THAT IS THE WHOLE DIFFERENCE.
  # gcc 4.7.4 has no riscv backend -- config.gcc mentions it zero times -- and
  # 4.8 is already past what a C compiler can build. So the bottom rung is
  # Ekaitz Zarraga's NLnet-funded backport into 4.6.4, pinned by TAG because
  # the version is ambiguous in the sources: the repo and Guix's patch
  # filename say 4.6.4, Guix's blog says 4.6.5, and the tree settles it.
  GCC_BOTTOM_TAG: working-compiler-c++
  # AND THE FIRST RUNG UP IS 7.x, NOT 10.2.0. gcc 7.1 is the first upstream
  # release carrying a riscv backend, so it is the first that needs no fork.
  # It is also the rung the Guix RISC-V effort is reported to have stalled on,
  # which is why this spike reaches for it rather than for 10.
  GCC_TOP: 7.5.0

jobs:
  ladder:
    name: 'seed -> tcc -> gcc 4.6.4, on riscv64'
    # NATIVE, NOT EMULATED. ubuntu-24.04 is x86_64, so every rung runs on the
    # architecture it targets -- the same property the aarch64 job gets from
    # ubuntu-24.04-arm. A cross-compiled answer would not test the thing.
    runs-on: ubuntu-24.04-riscv
    # 480 BECAUSE THE STEPS ADD TO 480, AND BECAUSE THIS HARDWARE IS SLOWER.
    # The RISE nodes are four T-Head C910 cores at 1.85GHz; the tcc rung alone
    # took 7m18s where the same build is seconds on a modern x86_64 runner. A
    # gcc bootstrap here will not resemble the aarch64 timings.
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bubblewrap curl git bzip2 xz-utils gcc g++ make bison flex \
            texinfo m4 perl python3 file gawk patch libgmp-dev libmpfr-dev \
            libmpc-dev > /dev/null
          command -v bwrap >/dev/null || { echo "  bwrap missing"; exit 1; }

      - name: Let bwrap create a user namespace
        run: |
          set -eu
          # WITHOUT THIS THE BOX NEVER STARTS. Ubuntu 24.04 restricts
          # unprivileged user namespaces via AppArmor, and the first run of
          # this spike died at the first box invocation with
          #     bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
          # -- after fetching every source, so the failure cost the whole
          # download and told us nothing about the ladder.
          #
          # stage4-complete.yml:146 carries this step for the same reason. It
          # was omitted here when the box was copied and the box alone was
          # copied; the box is not self-contained, and that is worth knowing
          # for the refactor.
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor || sudo service apparmor reload || true
            echo "  apparmor profile installed for bwrap"
          else
            echo "  unprivileged userns already permitted"
          fi

      - name: Confirm this is really riscv64
        run: |
          set -eu
          # THE SAME ASSERTION THE AARCH64 JOB MAKES, AND FOR THE SAME REASON.
          # If this is not the target architecture the whole run means nothing:
          # every "native" claim below becomes a cross-compile nobody asked
          # for, and the comparison with the aarch64 ladder is void.
          echo "  uname -m : $(uname -m)"
          echo "  LFS_TGT  : $LFS_TGT"
          lscpu | head -12 || true
          [ "$(uname -m)" = riscv64 ] || { echo "  NOT riscv64 -- aborting"; exit 1; }

      - name: 'RUNG 0 -- does upstream ship a seed path for this architecture'
        run: |
          set -eu
          echo "=== VERON-SPIKE-M2 ==="
          # THE QUESTION STAGE 4 CANNOT ANSWER. Everything above tcc assumes a
          # compiler already exists; this asks whether one can be GROWN here.
          #
          # stage0-stage4-complete.yml:308 does exactly this derivation for
          # aarch64 and explains at length why it must never be hand-written:
          # four reconstructed -f lists in a row were wrong, and four other
          # workflows are still red from one of them.
          mkdir -p work && cd work
          git clone -q https://github.com/oriansj/M2-Planet.git m2
          git -C m2 checkout -q "$M2PLANET_SHA"
          git -C m2 submodule -q update --init --recursive 2>/dev/null || true
          git -C m2/M2libc checkout -q "$M2LIBC_SHA" 2>/dev/null || true
          echo "  M2-Planet at $M2PLANET_SHA"
          echo "  --- every architecture upstream ships a test1000 script for ---"
          ls m2/test/test1000/ | grep '^hello-' | sed 's/^/    /' || true
          S="m2/test/test1000/hello-${M2_ARCH}.sh"
          if [ ! -f "$S" ]; then
            echo
            echo "  NO $S"
            echo "  Upstream ships no seed script for this architecture, so the"
            echo "  derivation stage 0 depends on has no source. That is the"
            echo "  finding: this target needs its -f list built some other"
            echo "  way, and THAT is the work -- not the gcc rungs."
            exit 1
          fi
          # SAME EXTRACTION AS THE REAL JOB, INCLUDING THE TWO TRAPS IT NAMES:
          # join continuation lines first, and anchor on `bin/M2-Planet` rather
          # than the project name, because the GPL header line "This file is
          # part of M2-Planet." carries no -f tokens and matching it derives an
          # empty list.
          sed -e ':a' -e '/\\$/{N; s/\\\n/ /; ta}' "$S" > joined.sh
          L=$(grep -m1 'bin/M2-Planet' joined.sh \
              | grep -oE '\-f[[:space:]]+[^[:space:]]+' \
              | awk '{print $2}')
          n=$(printf '%s\n' "$L" | grep -c . || true)
          echo "  -f entries derived: $n"
          printf '%s\n' "$L" | sed 's/^/    /'
          [ "$n" -gt 0 ] || { echo "  DERIVED AN EMPTY LIST -- see the anchor note above"; exit 1; }
          # EVERY FILE IN THE LIST MUST EXIST AT THE PIN. This is the assertion
          # that catches M2libc/bootstrap.c -- the generic one, which does NOT
          # exist at the 1.13.1 pin and is why four workflows are red.
          miss=0
          for f in $L; do
            [ -f "m2/$f" ] || { echo "    MISSING AT THIS PIN: $f"; miss=1; }
          done
          [ "$miss" = 0 ] || { echo "  the derived list names files this pin does not have"; exit 1; }
          echo "VERON-SPIKE-M2-OK  upstream ships a seed path for $M2_ARCH and every -f file exists"
          cd "$GITHUB_WORKSPACE"

      - name: 'RUNG 1 -- our own tcc, built by the host gcc, targeting riscv64'
        run: |
          set -eu
          echo "=== VERON-SPIKE-TCC ==="
          # STILL THE HOST'S gcc AT THIS RUNG, AND THAT IS THE DECLARED GAP.
          # rung 0 above asks whether a compiler can be GROWN here; this asks
          # the narrower question of whether tcc's own riscv64 backend works at
          # our pin. Both matter, and only the first speaks to bootstrappability.
          C=$(grep -m1 '^commit' sources/tcc.toml | cut -d'"' -f2)
          echo "  pinned commit: $C"
          mkdir -p work
          git clone -q git://repo.or.cz/tinycc.git work/tccsrc \
            || git clone -q https://repo.or.cz/tinycc.git work/tccsrc
          git -C work/tccsrc checkout -q "$C"
          test -f work/tccsrc/riscv64-gen.c \
            || { echo "  NO riscv64-gen.c AT THIS PIN"; exit 1; }
          echo "  --- arm64 series DELIBERATELY NOT APPLIED (wrong architecture) ---"
          cd work/tccsrc
          ./configure --prefix="$PWD/../tccinst" --cpu=riscv64 > ../tcc-conf.log 2>&1 \
            || { echo "  CONFIGURE FAILED"; tail -20 ../tcc-conf.log; exit 1; }
          make -j"$(nproc)" > ../tcc-build.log 2>&1 \
            || { echo "  BUILD FAILED -- riscv64 likely needs its own series"; \
                 tail -40 ../tcc-build.log; exit 1; }
          make install > /dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          ./work/tccinst/bin/tcc -v
          printf 'int main(void){return 42;}\n' > work/t.c
          ./work/tccinst/bin/tcc -o work/t work/t.c
          file work/t | tee work/t.file
          grep -qi "RISC-V" work/t.file || { echo "  NOT a RISC-V binary"; exit 1; }
          set +e; ./work/t; rc=$?; set -e
          [ "$rc" = 42 ] || { echo "  ran but returned $rc"; exit 1; }
          echo "VERON-SPIKE-TCC-OK  our tcc targets riscv64 and its output runs"

      - name: "RUNG 2 -- Ekaitz Zarraga's gcc 4.6.4, which has the backend 4.7 never had"
        if: ${{ inputs.stop_after != 'm2' && inputs.stop_after != 'tcc' }}
        run: |
          set -eu
          echo "=== VERON-SPIKE-G46 ==="
          # NOT OUR BACKPORT, AND THAT IS THE POINT. aarch64 needed one and we
          # wrote it -- GCC-BACKPORT.md, 4.8.5's backend grafted into 4.7.4,
          # 626 objects, no miscompilation across 349 translation units. For
          # RISC-V the equivalent already exists, NLnet-funded, by Ekaitz
          # Zarraga for Guix. This rung tests whether it drops in.
          #
          # PIN THE TAG, NOT THE VERSION. Primary sources disagreed -- the
          # repository and Guix's patch filename say 4.6.4, Guix's blog says
          # 4.6.5. The tree settles it: BASE-VER reads 4.6.4. A version number
          # is not an identifier here; the tag and the sha are.
          #
          # SHALLOW, AND AT THE TAG. A full clone of a gcc fork is gigabytes
          # and hundreds of thousands of commits; the first run of this spike
          # sat on one long enough to look hung on a four-core RISC-V node.
          # TWO HOSTS AND THREE TRIES, BECAUSE THIS RUNG DEPENDS ON SOMEONE
          # ELSE'S SERVER AND RUN 84979503915 DIED ON IT:
          #     fatal: unable to access 'https://codeberg.org/...gcc.git/':
          #            The requested URL returned error: 504
          # Nothing was wrong with the tree or the tag -- codeberg was simply
          # down. Everything else in this chain comes from a pinned tarball on
          # ftp.gnu.org; this is the one rung that reaches into a live git
          # host, which is a fragility worth naming rather than hiding.
          #
          # The github remote is the fork's own former home -- its README says
          # "[MOVED TO CODEBERG]" -- so it is a mirror of the same history, not
          # a different project. Codeberg is tried first because it is the one
          # upstream points at now.
          got=""
          for remote in \
              https://codeberg.org/ekaitz-zarraga/gcc.git \
              https://github.com/ekaitz-zarraga/gcc.git ; do
            for attempt in 1 2 3; do
              echo "  trying $remote (attempt $attempt)"
              if git clone -q --depth 1 --branch "$GCC_BOTTOM_TAG" "$remote" work/g46 2>/dev/null; then
                got="$remote"; break
              fi
              rm -rf work/g46; sleep 10
            done
            [ -n "$got" ] && break
          done
          if [ -z "$got" ]; then
            echo "  COULD NOT CLONE $GCC_BOTTOM_TAG FROM EITHER HOST."
            echo "  If both are up, the tag has moved and the pin is stale --"
            echo "  check the fork before assuming the network."
            exit 1
          fi
          echo "  cloned from $got"
          cd work/g46
          echo "  HEAD:      $(git rev-parse --short HEAD)"
          echo "  BASE-VER:  $(cat gcc/BASE-VER 2>/dev/null || echo unknown)"
          r=$(grep -ci riscv gcc/config.gcc || true)
          echo "  riscv mentions in config.gcc: $r"
          [ "$r" -gt 0 ] || { echo "  THIS FORK HAS NO RISCV BACKEND -- wrong tag?"; exit 1; }
          ls gcc/config/riscv/ | head -8 | sed 's/^/    /'
          echo "VERON-SPIKE-G46-OK  the fork carries a riscv backend at this tag"

      - name: 'THE BOX -- /usr bound read-only, every host compiler masked to /dev/null'
        run: |
          set -eu
          # LIFTED FROM stage4-complete.yml, NOT REINVENTED. That workflow's
          # box binds /usr read-only for the shell and coreutils, then
          # bind-mounts EVERY host compiler binary onto /dev/null and tmpfs's
          # /usr/lib/gcc and /usr/libexec/gcc over the top -- so cc1 and
          # cc1plus, the load-bearing pieces, are gone even though /usr is
          # present. That is what makes "no host compiler" true rather than
          # merely claimed.
          #
          # COPIED RATHER THAN SHARED, AND THAT IS A DEBT. If stage4's box
          # changes and this one does not, the spike stops measuring the same
          # thing. The fix is a matrix in stage4-complete.yml, not a third
          # copy; see the summary step.
          mkdir -p work/status
          cat > box.sh <<'EOS'
          set -eu
          mask_list() {
            for c in $(ls /usr/bin 2>/dev/null | grep -E \
                       '^(cc|c\+\+|cpp|gcc|g\+\+|clang|clang\+\+)(-[0-9.]+)?$|^[a-z0-9_]+-linux-gnu-(gcc|g\+\+|cpp)(-[0-9.]+)?$'); do
              t=$(readlink -f "/usr/bin/$c" 2>/dev/null) || continue
              if [ -n "$t" ] && [ -f "$t" ]; then echo "$t"; fi
            done | sort -u
          }
          MASK=""
          for t in $(mask_list); do MASK="$MASK --ro-bind /dev/null $t"; done
          if [ -d /usr/lib/gcc ];     then MASK="$MASK --tmpfs /usr/lib/gcc";     fi
          if [ -d /usr/libexec/gcc ]; then MASK="$MASK --tmpfs /usr/libexec/gcc"; fi
          if [ "${1:-}" = "--show-mask" ]; then
            echo "  compiler binaries bind-mounted to /dev/null:"
            mask_list | sed 's/^/    /'
            [ -d /usr/libexec/gcc ] && echo "    (tmpfs) /usr/libexec/gcc   <- cc1, cc1plus  [load-bearing]"
            exit 0
          fi
          W=${W:?box.sh: W not set}
          REPO=${REPO:?box.sh: REPO not set}
          LIB64=""
          if [ -d /lib64 ]; then LIB64="--symlink usr/lib64 /lib64"; fi
          exec bwrap \
            --unshare-all --die-with-parent --new-session \
            --clearenv \
            --setenv PATH /usr/bin:/bin:/usr/sbin:/sbin \
            --setenv HOME /work --setenv LC_ALL C --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --setenv TCC /work/tccsrc/tcc --setenv TCCDIR /work/tccsrc \
            --ro-bind /usr /usr --ro-bind /etc /etc --ro-bind "$REPO" /repo \
            --symlink usr/bin /bin --symlink usr/sbin /sbin --symlink usr/lib /lib \
            $LIB64 $MASK \
            --bind "$W" /work --proc /proc --dev /dev --tmpfs /tmp \
            --chdir /work "$@"
          EOS
          chmod +x box.sh

      - name: 'Prove the box before spending an hour in it'
        run: |
          set -eu
          W="$PWD/work" REPO="$PWD" ./box.sh --show-mask || true
          # THE ASSERTION THAT MAKES THE REST MEAN ANYTHING. If a host cc
          # survives into the box then every "tcc built this" claim below is
          # unfalsifiable, so it is checked before the expensive rungs, not
          # after.
          set +e
          W="$PWD/work" REPO="$PWD" ./box.sh /bin/sh -c 'echo "int main(void){return 0;}" > /tmp/x.c && cc -o /tmp/x /tmp/x.c' 2>/dev/null
          rc=$?
          set -e
          [ "$rc" != 0 ] || { echo "  A HOST cc SURVIVED INTO THE BOX -- the mask is wrong"; exit 1; }
          echo "  no host cc in the box (rc=$rc)"
          echo "VERON-SPIKE-BOX-OK"

      - name: 'Fetch sources OUTSIDE the box -- network is not a build dependency'
        run: |
          set -eu
          cd work
          for u in \
            https://ftp.gnu.org/gnu/gmp/gmp-$GMP.tar.xz \
            https://ftp.gnu.org/gnu/mpfr/mpfr-$MPFR.tar.xz \
            https://ftp.gnu.org/gnu/mpc/mpc-$MPC.tar.gz \
            https://ftp.gnu.org/gnu/gcc/gcc-$GCC_TOP/gcc-$GCC_TOP.tar.xz ; do
            f=$(basename "$u"); echo "  $f"
            curl -fsSL --retry 3 -o "$f" "$u"
          done
          sha256sum ./*.tar.* | sed 's/^/    /'
          tar xf gmp-$GMP.tar.xz;   mv gmp-$GMP   gmp
          tar xf mpfr-$MPFR.tar.xz; mv mpfr-$MPFR mpfr
          tar xf mpc-$MPC.tar.gz;   mv mpc-$MPC   mpc
          # THE BOTTOM COMES FROM git, SHALLOW AND AT THE TAG. A full clone of
          # a gcc fork is gigabytes; the first run of this spike sat on one
          # long enough to look hung on a four-core RISC-V node.
          # SAME TWO HOSTS AND THREE TRIES AS RUNG 2. Run 84979503915 died
          # here on a codeberg 504 -- the tree and the tag were fine, the
          # host was not.
          got=""
          for remote in \
              https://codeberg.org/ekaitz-zarraga/gcc.git \
              https://github.com/ekaitz-zarraga/gcc.git ; do
            for attempt in 1 2 3; do
              if git clone -q --depth 1 --branch "$GCC_BOTTOM_TAG" "$remote" gbot 2>/dev/null; then
                got="$remote"; break
              fi
              rm -rf gbot; sleep 10
            done
            [ -n "$got" ] && break
          done
          [ -n "$got" ] || { echo "  could not clone $GCC_BOTTOM_TAG from either host"; exit 1; }
          echo "  cloned from $got"
          echo "  bottom gcc: $(cat gbot/gcc/BASE-VER) at $(git -C gbot rev-parse --short HEAD)"

          # THE FORK SHIPS WITHOUT ITS PATCHES, DELIBERATELY. Ekaitz Zarraga's
          # own write-up (ekaitz.elenq.tech/bootstrapGcc10.html) says so
          # outright: "We need to patch a couple of things, that we'll set up
          # in the Guix recipe. I decided to keep them out of the codebase
          # because I want to keep the code consistent with the past."
          #
          # So a clean checkout of the tag is NOT a buildable tree, and the
          # first run of this spike was missing both patches. They are applied
          # here rather than carried as .patch files because they are two
          # lines and upstream publishes them as commands.

          # 1. struct ucontext -> ucontext_t. glibc renamed it; 2012 gcc still
          #    says the old name and will not compile against a modern libc.
          #    NOT A RISC-V PROBLEM: run 84974129558 hit exactly this on
          #    x86_64, with a stock 4.7.4 tarball and no fork involved --
          #      ./md-unwind-support.h:60:47: error: dereferencing pointer to
          #                                   incomplete type
          #    so the amd64 spike now carries the same sed. Upstream keeps it
          #    out of the fork on purpose; it belongs to whoever is building
          #    against a modern libc, which is everyone here.
          # PATCH BY CONTENT, NOT BY FILENAME. Three attempts got here:
          #   `gcc/config/*/linux-unwind.h`  -- unmatched glob, sed blamed a
          #                                     file that never existed
          #   find -name linux-unwind.h      -- found nothing, though
          #                                     gbot/gcc/config was full of
          #                                     arch directories
          # Both were guesses about where the string lives. grep -rl is not:
          # it finds every file that actually contains it, whatever it is
          # called and wherever gcc keeps it in this release.
          #
          # WHAT IS BEING FIXED: glibc renamed `struct ucontext` to
          # `ucontext_t`, so 2012's gcc dereferences a type that no longer
          # exists under that name --
          #     md-unwind-support.h:60:47: error: dereferencing pointer to
          #                                incomplete type
          # measured on x86_64 in run 84974129558, with a stock 4.7.4 tarball
          # and no fork in sight, which is what showed this is not a RISC-V
          # problem.
          hits=$(grep -rl 'struct ucontext' gbot/gcc gbot/libgcc 2>/dev/null || true)
          if [ -z "$hits" ]; then
            echo "  NOTE: no file under gbot mentions 'struct ucontext'."
            echo "  Either this release predates the usage or already carries"
            echo "  the fix. Not fatal -- the build will say if it matters."
          else
            printf '%s\n' "$hits" | sed 's/^/    /'
            printf '%s\n' "$hits" | xargs sed -i 's/struct ucontext/ucontext_t/g'
            echo "  patched: struct ucontext -> ucontext_t in $(printf '%s\n' "$hits" | wc -l) file(s)"
          fi

          # 2. Drop the LIB_SPEC override in the riscv linux.h. Upstream's
          #    comment calls itself a FIXME: RISC-V has only word-sized
          #    atomics so it links libatomic by default, and that reference
          #    breaks the build before libatomic exists.
          python3 - <<'PYEOF'
          import re
          p = "gbot/gcc/config/riscv/linux.h"
          s = open(p).read()
          out = re.sub(r"/\* FIXME \*/\n/\* Because RISC-V only has word-sized atomics.*?#undef LIB_SPEC\n",
                       "", s, flags=re.S)
          open(p, "w").write(out)
          print("  patched: LIB_SPEC override removed" if out != s
                else "  NOTE: LIB_SPEC block not found -- fork may already carry the fix")
          PYEOF

          # 3. DEFINE HOST_WIDE_INT_1 AND _1U, WHICH THE FORK USES AND NEVER
          #    DEFINES. This one is ours, not upstream's, and it is the reason
          #    nobody has hit it.
          #
          #    hwint.h's sext_hwi has two paths:
          #        #if   <compiler behaves as expected>
          #              ... no macro needed ...
          #        #else
          #              /* Fall back to the slower, well defined path.  */
          #              HOST_WIDE_INT sign_mask = HOST_WIDE_INT_1 << (prec - 1);
          #        #endif
          #    A modern gcc satisfies the #if and never compiles the fallback.
          #    tcc does not, takes the #else, and dies:
          #        /work/gbot/gcc/hwint.h:291: error: 'HOST_WIDE_INT_1' undeclared
          #        make[2]: *** [Makefile:3521: riscv.o] Error 1
          #
          #    MEASURED, NOT GUESSED (run 84975744820): the probe showed
          #    riscv.c references it 0 times and it is defined NOWHERE in the
          #    tree -- the fork carried a newer sext_hwi body back into 4.6.4
          #    without the macros that body needs. Ekaitz builds on Debian with
          #    build-essential, so the fallback is dead code for him.
          #
          #    The definitions are gcc's own, written without HOST_WIDE_INT_C
          #    because 4.6.4 may not have it either. Guarded, so if a later tag
          #    of the fork adds them this becomes a no-op rather than a clash.
          python3 - <<'PYEOF'
          p = "gbot/gcc/hwint.h"
          s = open(p).read()
          if "define HOST_WIDE_INT_1" in s:
              print("  NOTE: hwint.h already defines HOST_WIDE_INT_1 -- nothing to do")
          else:
              add = ("\n#ifndef HOST_WIDE_INT_1\n"
                     "#define HOST_WIDE_INT_1 ((HOST_WIDE_INT) 1)\n"
                     "#endif\n"
                     "#ifndef HOST_WIDE_INT_1U\n"
                     "#define HOST_WIDE_INT_1U ((unsigned HOST_WIDE_INT) 1)\n"
                     "#endif\n")
              # AFTER THE HOST_WIDE_INT TYPEDEF AND BEFORE ANY USE. The first
              # attempt appended before the closing include guard, which is
              # after sext_hwi -- so the macro was defined and the function
              # that needs it still failed. Tested locally: a #define must
              # precede its use, and "somewhere in the file" is not a place.
              import re as _re
              m = _re.search(r"^#define\s+HOST_WIDE_INT\b.*$", s, _re.M) \
                  or _re.search(r"^typedef .*\bHOST_WIDE_INT\s*;.*$", s, _re.M)
              if not m:
                  raise SystemExit("  hwint.h: no HOST_WIDE_INT definition found to anchor on")
              k = s.index("\n", m.end()) + 1
              open(p, "w").write(s[:k] + add + s[k:])
              print("  patched: HOST_WIDE_INT_1 and HOST_WIDE_INT_1U defined in hwint.h")
          PYEOF
          tar xf gcc-$GCC_TOP.tar.xz;     mv gcc-$GCC_TOP    gtop
          echo "  unpacked; the box has no network past this point"

      # AND ONE THING WORTH KNOWING BEFORE BLAMING EITHER: NOBODY UPSTREAM
      # BUILDS THIS FORK WITH tcc. Ekaitz's own write-up builds it on Debian
      # with `apt install build-essential` -- a modern gcc -- and live-boot
      # strap does not go tcc -> 4.6.4 either; its ladder climbs through gcc
      # 4.0.4 first. So HOST_WIDE_INT_1 may be a failure nobody has hit,
      # because nobody has stood where we are standing.
      #
      # THAT SUGGESTS A THIRD POSSIBILITY the probe below cannot see: neither
      # the fork nor tcc is "wrong", and the rung is simply too big -- 4.6.4
      # may need an intermediate gcc under it, the way live-bootstrap uses
      # 4.0.4. If the probe shows the fork defines HOST_WIDE_INT_1 correctly
      # and the host gcc compiles riscv.o fine, that is the answer.
      #
      # RUN 84972415988 REACHED THE BACKEND AND FAILED IN IT:
      #     /work/gbot/gcc/hwint.h:291: error: 'HOST_WIDE_INT_1' undeclared
      #     make[2]: *** [Makefile:3521: riscv.o] Error 1
      # tcc built gmp, mpfr, mpc, ran gcc's configure, compiled rtl-error.c and
      # cp/error.c -- and then could not compile riscv.o, the one file that
      # exists only because of the fork. The step after this one asks whether
      # that is the fork's gap or tcc's.
      #
      # MEASURED 2026-08-09, RUN 84923248968: tcc built gmp 6.2.1, mpfr 4.1.0
      # and mpc 1.2.1 on riscv64 and gcc's top-level configure completed. The
      # run then died inside make, in gcc/'s own configure, on
      #     configure: error: C++ preprocessor "/lib/cpp" fails sanity check
      # because CXX had been set to tcc -- which has no C++ compiler -- so
      # configure fell through to /lib/cpp, which the box masks. CC only now.
      - name: 'STAGE 1 -- tcc builds gmp, mpfr, mpc, then the backported gcc 4.6.4'
        timeout-minutes: 120
        run: |
          set -eu
          cat > work/stage1.sh <<'EOS'
          set -eu
          NP=$(nproc)
          say() { echo "$@"; }
          # WHY NOT `tail`. The first libgcc failure was invisible: 60 lines of
          # a -j parallel build is 60 xgcc command lines, and the compiler
          # error that caused it was thousands of lines earlier. tail is the
          # wrong tool for a log this shape.
          whyfail() {
            # THREE PASSES, BECAUSE THE FIRST TWO ATTEMPTS EACH MISSED IT.
            #
            # `tail -60` showed sixty xgcc command lines and no error, because
            # a -j build interleaves. Grepping for the word "error" then found
            #     configure: error: in `/work/b1/gcc':
            # and stopped -- the REASON is on the following line, which does
            # not contain the word. So: context, not matches.
            #
            # And make's own failures do not say "error" in a form that grep
            # catches at all; they say `*** [Makefile:NNNN: target] Error 2`.
            # That marker is the reliable one, so it gets its own pass.
            echo "  --- make's own failure markers, with context ---"
            grep -n -B4 -A2 -F "*** [" "$1" | tail -40 | sed 's/^/    /'
            echo "  --- configure failures, with context ---"
            grep -n -A6 "configure: error" "$1" | tail -20 | sed 's/^/    /'
            echo "  --- compiler diagnostics ---"
            grep -inE "fatal error|undefined reference|: error:|No such file or directory" "$1" \
              | grep -avE "disable-werror|-Wall|MAKEINFO|Werror" | tail -15 | sed 's/^/    /'
            echo "  --- last 10 lines ---"
            tail -10 "$1" | sed 's/^/    /'
          }
          # --disable-assembly ON GMP IS NOT OPTIONAL: gmp ships per-microarch
          # asm that tcc cannot assemble. stage4-complete.yml carries the same
          # flag for the same reason.
          for p in gmp mpfr mpc; do
            say "  --- $p ---"
            cd /work/$p
            case $p in
              gmp)  ./configure CC="$TCC -B$TCCDIR" --disable-shared --disable-assembly \
                      --prefix=/work/prefix > conf.log 2>&1 || { tail -20 conf.log; exit 1; } ;;
              *)    ./configure CC="$TCC -B$TCCDIR" --disable-shared \
                      --with-gmp=/work/prefix --prefix=/work/prefix > conf.log 2>&1 \
                      || { tail -20 conf.log; exit 1; } ;;
            esac
            make -j"$NP" > build.log 2>&1 || { whyfail build.log; exit 1; }
            make install > /dev/null 2>&1
            say "    installed"
          done
          # CC ONLY, NEVER CXX. tcc has no C++ compiler, and setting CXX to it
          # makes gcc's own configure fall through to /lib/cpp for the C++
          # preprocessor -- which the box masks, so it dies with
          #     configure: error: C++ preprocessor "/lib/cpp" fails sanity check
          # deep inside make, after the prereqs are already built.
          # stage4-complete.yml:549 passes CC and nothing else, for this reason.
          # --enable-languages=c,c++ still works: gcc bootstraps its own g++
          # from the C compiler it just built.
          say "  === STAGE 1: configure gcc ==="
          mkdir -p /work/b1 && cd /work/b1
          /work/gbot/configure \
            --build=$GNU_TGT --host=$GNU_TGT --target=$GNU_TGT \
            --prefix=/work/out --enable-languages=c,c++ \
            --disable-multilib --disable-bootstrap --disable-werror \
            --disable-libsanitizer --disable-libgomp --disable-libquadmath \
            --disable-libssp --disable-libatomic --disable-shared \
            --with-gmp=/work/prefix --with-mpfr=/work/prefix --with-mpc=/work/prefix \
            CC="$TCC -B$TCCDIR" > conf.log 2>&1 \
            || { tail -40 conf.log; exit 1; }
          say "  === STAGE 1: make ==="
          # MAKEINFO=true, -k AND -Otarget, ALL THREE COPIED FROM stage4:580.
          #
          # MAKEINFO=true because 2026's makeinfo rejects 2012's texinfo. The
          # first run of this spike built every generator gcc has -- genmodes,
          # gengenrtl, gengtype, all linked -- and then died on
          #     makeinfo ... doc/gccint.info
          #     make[2]: *** [Makefile:4343: doc/gccint.info] Error 1
          # which is documentation, not a compiler. `true` stands in for it.
          #
          # -k so one such failure does not stop the rest, and -Otarget so
          # parallel output stays attributable to the target that produced it.
          make -k -j"$NP" -Otarget MAKEINFO=true > build.log 2>&1 \
            || { whyfail build.log; echo "  (-k means later targets still ran)"; }
          make install > /dev/null 2>&1
          ls -l /work/out/bin/ | sed 's/^/    /'
          EOS
          W="$PWD/work" REPO="$PWD" GNU_TGT="$GNU_TGT" ./box.sh \
            /bin/sh -c 'cd /work && GNU_TGT='"$GNU_TGT"' sh stage1.sh'
          test -x work/out/bin/gcc || { echo "  no gcc produced"; exit 1; }
          echo "VERON-SPIKE-STAGE1-OK  tcc built the backported gcc for $GNU_TGT"

      - name: 'WHOSE BUG IS HOST_WIDE_INT_1 -- the fork, or tcc?'
        if: ${{ always() }}
        run: |
          set -eu
          # RUN 84972415988 FAILED HERE AND NAMED THE FILE:
          #     /work/gbot/gcc/hwint.h:291: error: 'HOST_WIDE_INT_1' undeclared
          #     make[2]: *** [Makefile:3521: riscv.o] Error 1
          #
          # riscv.o IS THE BACKEND ITSELF -- the one file that exists only
          # because of the fork. amd64 never sees this: it builds gcc, links
          # cc1plus, and gets as far as libgcc. So the fault is in the fork or
          # in tcc, and those want different fixes:
          #
          #   the fork  -> HOST_WIDE_INT_1 arrived in gcc after 4.6, and the
          #                backported riscv backend uses it without the
          #                definition being carried back. That is a patch we
          #                would write, and a small one.
          #   tcc       -> the macro IS defined but behind a conditional tcc's
          #                preprocessor evaluates differently, so it never
          #                gets defined. That is a tcc bug and a much larger
          #                problem, because it would not be confined to riscv.
          #
          # THE DISCRIMINATOR IS ONE COMPILE. Build the same file with the
          # HOST gcc, outside the box, where no tcc is involved:
          #   compiles -> the fork is fine, tcc is at fault
          #   fails    -> the fork is at fault, and tcc is innocent
          [ -d work/gbot ] || { echo "  no source tree -- run STAGE 1 first"; exit 0; }
          echo "  --- what the fork's hwint.h says at 291 ---"
          sed -n '280,300p' work/gbot/gcc/hwint.h | sed 's/^/    /'
          echo "  --- is HOST_WIDE_INT_1 defined anywhere in the tree? ---"
          grep -rn "define HOST_WIDE_INT_1" work/gbot/gcc/ | head -5 | sed 's/^/    /' \
            || echo "    NOT DEFINED ANYWHERE -- the fork never carried it back"
          echo "  --- does riscv.c reference it? ---"
          grep -c "HOST_WIDE_INT_1" work/gbot/gcc/config/riscv/riscv.c 2>/dev/null | sed 's/^/    riscv.c uses it /' || true

      - name: 'STAGE 2 -- that gcc rebuilds itself, and the two cc1s are compared'
        timeout-minutes: 120
        if: ${{ inputs.stop_after != 'stage1' }}
        run: |
          set -eu
          # THE RUNG THAT CATCHES A MISCOMPILING TCC. A compiler that builds
          # and emits wrong code passes every earlier check, which is why the
          # aarch64 work compared cc1 sizes and disassembly rather than
          # trusting rc=0.
          cat > work/stage2.sh <<'EOS'
          set -eu
          NP=$(nproc); export PATH=/work/out/bin:$PATH
          # say() TRAVELS WITH whyfail() NOW. Each of these box scripts is a
          # separate /bin/sh, so a helper defined in stage1.sh does not exist
          # in stage2.sh -- run 84978334756 exited 127 with
          #     stage2.sh: 40: say: not found
          # after stage 1 had already passed, which is an expensive way to
          # learn that shell functions are not inherited across scripts.
          say() { echo "$@"; }
          whyfail() {
            # THREE PASSES, BECAUSE THE FIRST TWO ATTEMPTS EACH MISSED IT.
            #
            # `tail -60` showed sixty xgcc command lines and no error, because
            # a -j build interleaves. Grepping for the word "error" then found
            #     configure: error: in `/work/b1/gcc':
            # and stopped -- the REASON is on the following line, which does
            # not contain the word. So: context, not matches.
            #
            # And make's own failures do not say "error" in a form that grep
            # catches at all; they say `*** [Makefile:NNNN: target] Error 2`.
            # That marker is the reliable one, so it gets its own pass.
            echo "  --- make's own failure markers, with context ---"
            grep -n -B4 -A2 -F "*** [" "$1" | tail -40 | sed 's/^/    /'
            echo "  --- configure failures, with context ---"
            grep -n -A6 "configure: error" "$1" | tail -20 | sed 's/^/    /'
            echo "  --- compiler diagnostics ---"
            grep -inE "fatal error|undefined reference|: error:|No such file or directory" "$1" \
              | grep -avE "disable-werror|-Wall|MAKEINFO|Werror" | tail -15 | sed 's/^/    /'
            echo "  --- last 10 lines ---"
            tail -10 "$1" | sed 's/^/    /'
          }
          # THE PREREQS ARE REBUILT INTO A SECOND PREFIX, BY THE NEW COMPILER.
          #
          # Reusing /work/prefix -- the gmp/mpfr/mpc that tcc built -- fails:
          #     checking for the correct version of gmp.h... yes
          #     checking for the correct version of the gmp/mpfr/mpc libraries... no
          #     configure: error: Building GCC requires GMP 4.2+, MPFR 2.3.1+...
          # Headers found, LIBRARIES rejected: the archives are tcc's output
          # and the link test with the new gcc does not pass.
          #
          # stage4-complete.yml:751 says what this is, having hit it first:
          #   "CONTROL: prefix2 links. If prefix did not, the archives were
          #    the problem and rebuilding them is the fix."
          # So each compiler gets prereqs it built itself. It costs three
          # small builds and removes a whole class of confusion.
          for q in gmp mpfr mpc; do
            say "  --- $q, rebuilt by the stage-1 gcc ---"
            rm -rf /work/$q-2 && cp -a /work/$q /work/$q-2 && cd /work/$q-2
            make distclean > /dev/null 2>&1 || true
            case $q in
              gmp)  ./configure --disable-shared --disable-assembly \
                      --prefix=/work/prefix2 > conf.log 2>&1 || { tail -20 conf.log; exit 1; } ;;
              *)    ./configure --disable-shared --with-gmp=/work/prefix2 \
                      --prefix=/work/prefix2 > conf.log 2>&1 || { tail -20 conf.log; exit 1; } ;;
            esac
            make -j"$NP" > build.log 2>&1 || { whyfail build.log; exit 1; }
            make install > /dev/null 2>&1
            say "    installed"
          done

          mkdir -p /work/b2 && cd /work/b2
          /work/gbot/configure \
            --build=$GNU_TGT --host=$GNU_TGT --target=$GNU_TGT \
            --prefix=/work/out2 --enable-languages=c,c++ \
            --disable-multilib --disable-bootstrap --disable-werror \
            --disable-libsanitizer --disable-libgomp --disable-libquadmath \
            --disable-libssp --disable-libatomic --disable-shared \
            --with-gmp=/work/prefix2 --with-mpfr=/work/prefix2 --with-mpc=/work/prefix2 \
            > conf.log 2>&1 || { tail -40 conf.log; exit 1; }
          make -k -j"$NP" -Otarget MAKEINFO=true > build.log 2>&1 || whyfail build.log
          make install > /dev/null 2>&1
          echo "  cc1 built by tcc      : $(stat -c%s /work/b1/gcc/cc1) bytes"
          echo "  cc1 built by that gcc : $(stat -c%s /work/b2/gcc/cc1) bytes"
          EOS
          W="$PWD/work" REPO="$PWD" ./box.sh \
            /bin/sh -c 'cd /work && GNU_TGT='"$GNU_TGT"' sh stage2.sh'
          # -k MEANS make CAN RETURN 0 WITH A GCC MISSING, so the artifact is
          # what gets checked, not the exit code. Same reason stage 1 tests for
          # work/out/bin/gcc rather than trusting rc.
          test -x work/out2/bin/gcc || { echo "  stage 2 produced no gcc"; exit 1; }
          echo "VERON-SPIKE-STAGE2-OK  the tcc-built gcc rebuilt itself"

      - name: 'STAGE 3 -- the 4.6 g++ builds gcc ${{ env.GCC_TOP }}  <- THE RUNG TO WATCH'
        timeout-minutes: 240
        if: ${{ inputs.stop_after == 'top' }}
        run: |
          set -eu
          # THE ESCALATOR, AND THE POINT OF THE WHOLE SPIKE. gcc 4.8 is the
          # first release that needs a C++ compiler to build itself, so the
          # bottom rung is the last one tcc can reach -- but it SHIPS a g++,
          # and that g++ is what climbs. On aarch64 this exact jump has already
          # carried to 10.2.0; whether it carries here is what this asks.
          cat > work/stage3.sh <<'EOS'
          set -eu
          NP=$(nproc); export PATH=/work/out2/bin:$PATH
          # say() TRAVELS WITH whyfail() NOW. Each of these box scripts is a
          # separate /bin/sh, so a helper defined in stage1.sh does not exist
          # in stage2.sh -- run 84978334756 exited 127 with
          #     stage2.sh: 40: say: not found
          # after stage 1 had already passed, which is an expensive way to
          # learn that shell functions are not inherited across scripts.
          say() { echo "$@"; }
          whyfail() {
            # THREE PASSES, BECAUSE THE FIRST TWO ATTEMPTS EACH MISSED IT.
            #
            # `tail -60` showed sixty xgcc command lines and no error, because
            # a -j build interleaves. Grepping for the word "error" then found
            #     configure: error: in `/work/b1/gcc':
            # and stopped -- the REASON is on the following line, which does
            # not contain the word. So: context, not matches.
            #
            # And make's own failures do not say "error" in a form that grep
            # catches at all; they say `*** [Makefile:NNNN: target] Error 2`.
            # That marker is the reliable one, so it gets its own pass.
            echo "  --- make's own failure markers, with context ---"
            grep -n -B4 -A2 -F "*** [" "$1" | tail -40 | sed 's/^/    /'
            echo "  --- configure failures, with context ---"
            grep -n -A6 "configure: error" "$1" | tail -20 | sed 's/^/    /'
            echo "  --- compiler diagnostics ---"
            grep -inE "fatal error|undefined reference|: error:|No such file or directory" "$1" \
              | grep -avE "disable-werror|-Wall|MAKEINFO|Werror" | tail -15 | sed 's/^/    /'
            echo "  --- last 10 lines ---"
            tail -10 "$1" | sed 's/^/    /'
          }
          # prefix2 AGAIN, NOT prefix. Stage 2 already showed that archives
          # built by one compiler can fail another's link test; the stage-2
          # gcc built these, so they are the ones it can use. Whether gcc 10
          # in turn needs its own is what this rung finds out.
          mkdir -p /work/b3 && cd /work/b3
          /work/gtop/configure \
            --build=$GNU_TGT --host=$GNU_TGT --target=$GNU_TGT \
            --prefix=/work/out3 --enable-languages=c,c++ \
            --disable-multilib --disable-bootstrap --disable-werror \
            --disable-libsanitizer --disable-libgomp --disable-libquadmath \
            --disable-libssp --disable-shared \
            --with-gmp=/work/prefix2 --with-mpfr=/work/prefix2 --with-mpc=/work/prefix2 \
            > conf.log 2>&1 || { tail -40 conf.log; exit 1; }
          make -k -j"$NP" -Otarget MAKEINFO=true > build.log 2>&1 || whyfail build.log
          make install > /dev/null 2>&1
          /work/out3/bin/gcc --version | head -1
          EOS
          W="$PWD/work" REPO="$PWD" ./box.sh \
            /bin/sh -c 'cd /work && GNU_TGT='"$GNU_TGT"' sh stage3.sh'
          # IS IT A RUNG *UP*? A gcc that builds but reports the old version is
          # the failure this gate exists for.
          v=$(work/out3/bin/gcc --version 2>/dev/null | head -1 || echo none)
          echo "  produced: $v"
          case "$v" in *"$GCC_TOP"*) ;; *) echo "  NOT $GCC_TOP -- not a rung up"; exit 1 ;; esac
          echo "VERON-SPIKE-TOP-OK  the ladder reached gcc $GCC_TOP on $GNU_TGT"

      - name: 'VERON-SPIKE-RISCV64'
        if: always()
        run: |
          set -eu
          echo "  THIS SPIKE ANSWERS WHICH RUNGS A TARGET NEEDS, NOT WHETHER"
          echo "  THEY PASS. That is a deliberate boundary and worth stating."
          echo
          echo "  The rungs themselves live in stage0-stage4-complete.yml --"
          echo "  3,967 lines that climb seed -> stage1 -> stage2 -> micro-c ->"
          echo "  mc-tcc -> the gcc ladder -> a kernel that boots, with"
          echo "  BUDGET_PATH empty throughout. Copying any of it here would"
          echo "  fork the one workflow that makes the hermetic claim, and a"
          echo "  fork that drifts is worse than a spike that says so."
          echo
          echo "  WHAT THE THREE RUNGS ABOVE COST: minutes. What they buy is"
          echo "  the shape of the work per architecture --"
          echo
          echo "                        aarch64      x86_64      riscv64"
          echo "    seed script         upstream     rung 0      rung 0"
          echo "    tcc patch series    needed       none        none"
          echo "    bottom gcc          4.7.4+graft  4.7.4       Ekaitz 4.6.4"
          echo "    first upstream rung 4.8.5        4.8.5       7.x"
          echo
          echo "  Four axes. Three are one-liners. The fourth -- which gcc sits"
          echo "  at the bottom and whether a transplant runs -- is the only"
          echo "  one that is really a fork, and it is expressible as inputs."
          echo
          echo "  THE WORK THIS POINTS AT: give stage0-stage4-complete.yml a"
          echo "  matrix over those four axes rather than writing it twice"
          echo "  more. That is a refactor of a green 3,967-line workflow and"
          echo "  wants its own session, with the seed rungs proven first."
