name: stage5-spike

# MINIMAL STAGE 5: two packages, built on the proven entry contract, merged
# into an image, booted.
#
# WHAT CHANGED SINCE THIS WAS FIRST WRITTEN. The original restored the stage-4
# sysroot by cache PREFIX and named VERON-ENTRY-ABSENT as its expected first
# failure, because stage 4 published no sysroot. That gap is closed:
# stage0-stage4-complete now trims the sysroot (~481 MB, hashed and
# deterministically packed) and publishes it to the `stage4/latest` RELEASE on
# every green run, and stage5-entry.yml has PROVEN it compiles C, C++, -flto
# and -static, and boots.
#
# A release rather than an artifact, because the previous route ran through a
# hand-dispatched workflow and a GitHub Actions cache that expires after seven
# idle days -- so a quiet week broke stage 5 and the repair was an hour of
# chain. A release asset does not expire and anyone can download the same file.
#
# NO BUILD LOGIC IN THIS FILE. Every `run:` is environment setup or a call to
# spikes/stage5/tools/veron. If build logic reappears here, that is the
# regression -- DERIVATIONS.md Decision 3.

on:
  workflow_dispatch:
    inputs:
      skip_boot:
        description: 'Build and test, but do not boot'
        type: boolean
        required: false
        default: false
      use_checkpoint:
        description: 'use_checkpoint -- restore a prior build checkpoint instead of building everything. NEVER for a reproducibility claim'
        type: boolean
        required: false
        default: false
      save_checkpoint:
        description: 'save_checkpoint -- publish dest/ as a checkpoint for later runs'
        type: boolean
        required: false
        default: false
      boot_system:
        description: 'boot_system -- switch_root into dinit instead of running the test harness'
        type: boolean
        default: false
      seed_installs:
        description: 'seed_installs -- write [installs] blocks and installs.txt from this build, and upload them'
        type: boolean
        required: false
        default: false
      selfrebuild:
        description: 'Rebuild the packages INSIDE the guest (slow: ~12 min for two)'
        type: boolean
        required: false
        default: false

concurrency:
  group: stage5-spike-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # contents: write ONLY BECAUSE THE CHECKPOINT IS PUBLISHED TO RELEASES.
  #
  # This job spent 48 packages of build time and then died with
  #     HTTP 403: Resource not accessible by integration (.../releases)
  # because `gh release create` writes to the repository and this workflow was
  # read-only. Same shape as the git-pinned mirror step missing GH_TOKEN: a
  # step that writes was added to a job that could not.
  #
  # THE ESCALATION IS REAL AND WORTH NAMING. GitHub scopes permissions per
  # JOB, not per step, so every step in the spike now runs with write access
  # to this repository -- including the ones that execute upstream build
  # systems. The sandbox is what contains those: the build runs under bwrap
  # with --unshare-all and no network, and the token is not in its
  # environment. That containment is the reason this is acceptable rather than
  # the permission being small.
  #
  # Checkpoints are a CACHE and never evidence, so nothing signed or attested
  # depends on this write; the worst a compromised step could do here is
  # publish a bad cache, which the prefix key and the ledger's attestations=0
  # both already account for.
  contents: write
  actions: read

jobs:
  spike:
    runs-on: ubuntu-24.04-arm      # NATIVE aarch64 -- the sysroot IS aarch64,
                                   # so packages build AND RUN unemulated
    # THE JOB MUST OUTLIVE THE BUILD, OR THE COLLECTOR NEVER RUNS.
    #
    # A JOB timeout is a CANCELLATION: GitHub stops the job and `if: always()`
    # steps do not run. So the diagnostics work added below would be defeated
    # by the one failure mode it exists to prevent -- a long build running out
    # of clock and taking its own evidence with it.
    #
    # A STEP timeout is an ordinary step failure, and every `if: always()`
    # step after it still runs. So the build gets a step budget strictly
    # smaller than the job's, and the difference is the collector's.
    #
    # 33 minutes bought 31 packages and glib's configure in run 52. The nine
    # packages after glib include its own compile, harfbuzz, cairo and pango,
    # none of which has ever run here, at jobs=1. 90 was going to be tight
    # and silent about it.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: 'Airlock deps (tier 2 -- drives the build, touches no artifact byte)'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap qemu-system-arm e2fsprogs
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor and
          # bwrap then fails on loopback setup. hermetic-gcc10/15/16 and
          # float-probe already carry this; stage5-entry lost a run to its
          # absence and reported it as a compiler fault.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          python3 -c 'import tomllib' || { echo "python 3.11+ required"; exit 1; }

      # THE PLAN GATE CANNOT CATCH A DRIVER THAT LOST A FEATURE -- it
      # regenerates PLAN.txt with the same driver, so the file agrees with
      # itself. A build of this tool assembled from an older copy silently
      # dropped per-step `env`; the recipes still declared PATH, the driver
      # ignored it, and pkgconf's suite failed looking like a package fault.
      # This checks BEHAVIOUR against a fixture instead.
      - name: 'VERON-SELFTEST-OK -- the tools honour what callers depend on'
        run: |
          set -eu
          cd spikes/stage5 && python3 tools/veron selftest
          cd ../.. && python3 tools/mirror.py selftest

      - name: 'VERON-PLAN-OK -- regenerate and diff'
        run: cd spikes/stage5 && python3 tools/veron plan --check

      # THE SYSROOT COMES FROM A RELEASE, NOT FROM ANOTHER JOB'S ARTIFACT.
      #
      # This used to find the latest successful sysroot-inventory run and
      # download its artifact -- which meant stage 5 depended on a workflow
      # someone had to dispatch by hand with a checkbox ticked, and that
      # workflow in turn restored a 6 GB sysroot from a GitHub Actions CACHE.
      # Actions caches are evicted after seven idle days, so a quiet week
      # broke the link and the only repair was rerunning the whole chain.
      #
      # stage0-stage4-complete now trims and publishes on every green run.
      # A release asset does not expire, needs no dispatch, and is the same
      # file anyone else can download and boot.
      - name: 'Download the stage-4 sysroot from its release'
        id: sysroot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p dl-sysroot
          gh release download stage4/latest \
            --pattern 'sysroot.tar.zst' --pattern 'SYSROOT-SHA256' \
            --pattern 'PROVENANCE' --dir dl-sysroot || {
            echo "No stage4/latest release. stage0-stage4-complete publishes it"
            echo "on every green run; if none has run since this step landed,"
            echo "dispatch that workflow once."
            exit 1
          }
          # THE DIGEST IS CHECKED BEFORE THE TARBALL IS OPENED, exactly as it
          # was against the artifact. A release is a friendlier delivery
          # mechanism and not a more trusted one.
          want=$(awk '{print $1}' dl-sysroot/SYSROOT-SHA256)
          got=$(sha256sum dl-sysroot/sysroot.tar.zst | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "SYSROOT HASH MISMATCH"; exit 1; }
          sed 's/^/    /' dl-sysroot/PROVENANCE 2>/dev/null || true
          mkdir -p spikes/stage5/sysroot
          tar --zstd -xf dl-sysroot/sysroot.tar.zst -C spikes/stage5/sysroot
          du -sh spikes/stage5/sysroot | sed 's/^/    /'
          echo "VERON-ENTRY-OK  $got"
          # THE CHECKPOINT BASE. Verified against the published digest one
          # line above, so it is the strongest identity this run has for the
          # image everything is built on top of.
          echo "sysroot_sha=$got" >> "$GITHUB_OUTPUT"

      # AIRLOCK. Network lives here and nowhere else. Fetch goes through the
      # mirror so a dead upstream costs a fallback rather than the run.
      - name: 'Fetch pinned sources through the mirror'
        run: |
          set -eu
          cd spikes/stage5
          mkdir -p dl
          # ITERATE, NEVER HARDCODE. The first version of this step carried
          # pkgconf's sha256 as a literal and special-cased hello -- so the
          # moment hello's pin stopped being PENDING, the check passed and
          # nothing fetched it. `veron sources` emits every pin, so adding a
          # package changes one recipe and nothing else.
          fail=0
          python3 tools/veron sources | while IFS="$(printf '\t')" read -r sha name url; do
            python3 ../../tools/mirror.py fetch "$sha" "$name" --url "$url" --dest dl \
              || { echo "  FAILED $name"; exit 1; }
          done || fail=1
          [ "$fail" = 0 ] || { echo "VERON-FETCH-INCOMPLETE"; exit 1; }

      # GIT-PINNED SOURCES. Some upstreams publish no tarball at all, only
      # tags -- and a forge's generated archive is not an artifact anybody
      # here controls. For those the pin is the COMMIT, and tools/fetch-git.sh
      # turns it into a tarball we generated with pinned settings, verifying
      # HEAD with a rev-parse before it does. Runs before the tarball fetch so
      # the manifest check below sees a complete /dl.
      - name: 'Fetch git-pinned sources'
        run: |
          set -eu
          cd spikes/stage5
          # FOUR FIELDS, NOT THREE, AND READING THREE BROKE THE RUN.
          #
          # `veron git-sources` gained a fourth column -- the pinned digest of
          # the tar -- and this reader was left at three. Shell `read -r a b c`
          # puts THE REST OF THE LINE into the last variable, so $url became
          #     https://github.com/davmac314/dinit.git<TAB>d33a44bb...
          # and git reported "URL rejected: Malformed input to a URL
          # function", which names the symptom and not the cause.
          #
          # Two of the three consumers were updated when the column was added
          # and this one was not -- the same miss as `cmd_tarball_names` after
          # `cmd_fetch` was fixed. A producer gaining a field is a change to
          # every reader, and shell `read` fails at it silently by design.
          python3 tools/veron git-sources \
            | while IFS="$(printf '\t')" read -r commit name url want; do
            [ -n "$commit" ] || continue
            sh ../../tools/fetch-git.sh "$commit" "$name" "$url" dl ${want:+"$want"}
          done

      - name: 'VERON-FETCH-OK -- sha256 against the manifest'
        run: cd spikes/stage5 && python3 tools/veron fetch

      # BUILD. bwrap with the SYSROOT AS THE FILESYSTEM -- no host /usr, no
      # host /etc. Same shape as phase B and hermetic-gcc15's box15.sh, and the
      # reason it is worth anything: if a host header were reachable, a missing
      # one in the sysroot would not show up.
      # RESTORE THE LONGEST VALID PREFIX, FROM RELEASES RATHER THAN THE CACHE.
      #
      # Actions cache is 10 GB per repository with LRU eviction; dest/ is
      # ~3.3 GB uncompressed for 48 packages and the set is heading for 111,
      # so the cache would thrash exactly when the build got long enough to
      # need it. Releases are separate storage, already used by the mirror,
      # and an asset is permanent until deleted.
      #
      # A CHECKPOINT IS A CACHE AND MUST NEVER BE EVIDENCE. `use_checkpoint`
      # is an input rather than always-on: any run making a reproducibility
      # claim -- G3, or a ledger record anyone relies on -- must build every
      # package, and this step is the thing it has to turn off. The ledger
      # records whether one was used.
      - name: 'Restore a build checkpoint'
        if: ${{ inputs.use_checkpoint }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd spikes/stage5
          mkdir -p dest
          # ONE TAG, AND THE MARKER DECIDES WHAT IS USABLE.
          #
          # This used to walk `veron keys` backwards looking for a release
          # named after a prefix hash. That made a checkpoint all-or-nothing:
          # adding seven packages moved 53 of 62 keys, no tag matched, and a
          # 55-package checkpoint was discarded whole -- "no usable
          # checkpoint -- building everything".
          #
          # The keys are per package now, so the artifact is just "the last
          # one published" and `veron build --resume` keeps the subset whose
          # keys still match, deleting the rest. Nothing here needs to know
          # which packages those are.
          if gh release download ckpt/latest --pattern 'dest.tar.zst' \
               --dir . 2>/dev/null; then
            tar --zstd -xf dest.tar.zst && rm -f dest.tar.zst
            python3 -c 'import json;m=json.load(open("dest/.veron-checkpoint"));print("  downloaded a checkpoint holding",len(m["keys"]),"package(s)")'
          else
            echo "  no checkpoint published yet -- building everything"
          fi

      - name: 'VERON-SEAL + build both packages'
        timeout-minutes: 150      # < the job's 180. See the note above.
        run: |
          set -eu
          cd spikes/stage5
          mkdir -p build dest out logs
          # THE SANDBOX HAS TO RUN TEST SUITES, NOT JUST COMPILERS.
          #
          # m4's vendored gnulib suite hung for 66 minutes and then failed two
          # process-spawning tests. None of the obvious namespace theories were
          # right -- bwrap already brings loopback up inside --unshare-net, and
          # it already runs its own PID 1 to reap zombies, so neither was ever
          # the problem. What the environment inherits is.
          #
          # SIGPIPE. The GitHub Actions runner ignores SIGPIPE (actions/runner
          # #2684: a shell pipeline "gets stuck" because of it), and SIG_IGN is
          # inherited across fork AND exec. gnulib's test-execute expects a
          # child to DIE of SIGPIPE; with it ignored the child survives, exits
          # 71, and the pipeline never tears down -- which is both the failure
          # and the hang. Resetting it is one line and fixes the cause rather
          # than deleting the test.
          #
          # RLIMIT_NOFILE. Modern hosts hand out a hard limit near 2^30. Code
          # that closes every fd before exec then makes a billion syscalls per
          # spawn. /proc is mounted so glibc should use close_range and stay
          # fast, but 1024 costs nothing and removes the question.
          #
          # MAKEFLAGS. GNU make's jobserver passes fds 3 and 4 to children, and
          # gnulib's test-execute-child asserts that no unexpected descriptors
          # are inherited. Clearing it for the build keeps the suite honest.
          trap - PIPE || true
          ulimit -n 1024
          unset MAKEFLAGS MFLAGS MAKELEVEL
          echo "  SIGPIPE: $(python3 -c 'import signal;print(signal.getsignal(signal.SIGPIPE))')"
          echo "  fd limit: $(ulimit -n)"

          bwrap --unshare-all --die-with-parent \
            --new-session \
            --bind sysroot / \
            --bind "$PWD/build" /build --bind "$PWD/dest" /dest \
            --bind "$PWD/dl" /dl --bind "$PWD/logs" /logs --bind "$PWD/out" /out \
            --ro-bind "$PWD/packages" /packages \
            --ro-bind "$PWD/policy" /policy --ro-bind "$PWD/tools" /tools \
            --proc /proc --dev /dev --tmpfs /tmp \
            --setenv PATH /usr/bin:/usr/sbin:/bin \
            --setenv HOME /build --setenv SHELL /bin/sh \
            --setenv LC_ALL C --setenv TZ UTC --setenv SOURCE_DATE_EPOCH 0 \
            --chdir / \
            /usr/bin/python3 /tools/veron \
              --dl /dl --build-dir /build --dest /dest --logs /logs --out /out \
              --sysroot / \
              build --clean ${{ inputs.use_checkpoint && format('--resume --base {0}', steps.sysroot.outputs.sysroot_sha) || '' }}

      # WHAT THE BUILD ACTUALLY LINKED, AGAINST WHAT THE RECIPES CLAIM.
      #
      # The other two detectors read intent: the static scan reads what a
      # build file ASKS for, the distro half reads what another packager
      # DECLARES. This reads the ELF that was just produced, and it is the
      # only one that can see a library picked up from the sysroot by a
      # configure script nobody told to look -- a real runtime dependency that
      # no record mentions, in a build that is green.
      #
      # warn FIRST, for the same reason the reconciler warns: a gate nobody
      # has read the output of is a gate that gets switched off. `--mode fail`
      # is one word away once the first sweep is understood.
      # WHAT EACH PACKAGE INSTALLED, AGAINST WHAT IT DECLARED.
      #
      # `veron build` already fails a package that installs NOTHING -- cmake
      # spent its whole life writing into /usr instead of its DESTDIR and the
      # run printed "staged 0 paths" without complaint. This is the other
      # half: a package that installs somewhere nobody decided on. hwdata
      # drops a modprobe blacklist into a system with no kmod; harfbuzz
      # installs three utilities nobody asked for. Neither breaks anything and
      # both put files in the image that no decision put there.
      #
      # warn while most recipes have no [installs] block yet -- and the count
      # of UNCHECKED packages is printed, because a zero over an unchecked set
      # is the reassuring number this project keeps catching.
      - name: 'VERON-INSTALLS -- declared prefixes'
        run: |
          set -eu
          cd spikes/stage5
          # --mode fail, NOW THAT ALL 62 ARE SEEDED. This was warn because
          # `7 unchecked` would have failed every run for a reason that was
          # not a fault: waves 2 and 3 had never been through a seeding run,
          # so their [installs] blocks did not exist. A gate that fires on
          # correct code gets disabled, so it stayed warn until the seeding
          # actually happened -- which took restoring a step a splice had
          # deleted.
          #
          # It is now the third detector that refuses rather than reports,
          # beside the reconciler and `veron linked`. What it catches: a
          # package installing outside its declared prefixes, or installing a
          # different set of files than the recipe pins. The 36 changed sets
          # in the previous run were the stripped sysroot moving every binary
          # by a few bytes -- real, expected, and exactly what a digest over
          # file content is for.
          python3 tools/veron --dest dest installs --mode fail

      - name: 'VERON-LINKED -- DT_NEEDED against deps.link'
        run: |
          set -eu
          cd spikes/stage5
          python3 tools/veron --dest dest linked --mode warn

      # PUBLISH THE CHECKPOINT.
      #
      # A CACHE AND NEVER EVIDENCE. `use_checkpoint` is an input rather than
      # always-on: any run making a reproducibility claim must build every
      # package, and the ledger records attestations=0 when one was restored.
      #
      # ckpt/latest IS CLOBBERED EACH TIME, deliberately. Content-addressing
      # the tarball bought nothing once the keys went per package -- what
      # decides reuse is the marker inside, checked entry by entry, so a
      # single moving tag is both simpler and strictly more useful than a
      # graveyard of prefix-named releases nothing will ever match again.
      # SEED [installs] FROM THIS BUILD, AND UPLOAD IT.
      #
      # THIS STEP WENT MISSING AND NOTHING NOTICED. The `seed_installs` input
      # kept its description -- "write [installs] blocks and installs.txt from
      # this build, and upload them" -- while the step it described was gone,
      # deleted by a splice that meant to touch a neighbouring step. Two runs
      # were dispatched with the box ticked and produced no listings; the
      # workflow reported success both times because an input that drives
      # nothing cannot fail.
      #
      # Fifth collision of this shape in this project. The others were caught
      # by gates -- unbound names, checkpoint marker keys -- and this one is
      # not statically checkable: a YAML step is not a name. What catches it
      # is the marker below being absent from the log.
      - name: 'Seed [installs] from this build'
        if: ${{ inputs.seed_installs }}
        run: |
          set -eu
          cd spikes/stage5
          python3 tools/veron --dest dest installs --propose --write \
            | tee out/installs-propose.txt
          # PLAN.txt CARRIES recipe-sha PER PACKAGE, so writing a block into
          # every recipe moves all of them. Regenerating here means the
          # artifact is a drop-in rather than something that fails plan-check
          # the moment it lands.
          python3 tools/veron plan --write
          python3 tools/veron selftest
          n=$(ls packages/*/installs.txt | wc -l)
          echo "VERON-INSTALLS-SEEDED  $n listing(s) written"
          [ "$n" -gt 0 ] || { echo "seed_installs wrote nothing"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.seed_installs }}
        with:
          name: veron-stage5-installs-${{ github.run_id }}
          path: |
            spikes/stage5/packages/*/recipe.toml
            spikes/stage5/packages/*/installs.txt
            spikes/stage5/PLAN.txt
            spikes/stage5/out/installs-propose.txt
          if-no-files-found: error

      - name: 'Publish a build checkpoint'
        if: ${{ inputs.save_checkpoint }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd spikes/stage5
          BASE='${{ steps.sysroot.outputs.sysroot_sha }}'
          python3 tools/veron --dest dest checkpoint --base "$BASE"
          tar --zstd -cf dest.tar.zst dest
          echo "  $(du -h dest.tar.zst | cut -f1) for $(ls dest | wc -l) package(s)"
          # A FAILED CACHE PUBLISH MUST NOT FAIL THE RUN. An earlier 403
          # landed after 48 packages had built and took the manifest, the
          # ledger, the image and the boot down with it -- none of which
          # depend on a checkpoint existing.
          if gh release create ckpt/latest --title 'build checkpoint' \
               --notes 'a CACHE, not evidence -- see DEPENDENCIES.md' 2>&1 \
             || true; then :; fi
          if gh release upload ckpt/latest dest.tar.zst --clobber; then
            echo "VERON-CHECKPOINT-PUBLISHED  $(ls dest | wc -l) package(s)"
          else
            echo "VERON-CHECKPOINT-UNPUBLISHED -- the next run rebuilds"
          fi
          rm -f dest.tar.zst

      - name: 'VERON-MANIFEST-OK'
        run: cd spikes/stage5 && python3 tools/veron manifest

      # MERGE. The sysroot IS the base of the final system, not merely the
      # build environment -- so the image is the entry contract plus what
      # stage 5 installed on top of it.
      # ---------------------------------------------------------------
      # G3 IS REMOVED FOR NOW, HAVING PASSED. At twelve packages it built
      # everything a second time from a restored build root and compared:
      #     VERON-G3-OK  4299 files identical across two independent builds
      # That is the reproducibility claim measured on a real package set
      # rather than on containers, and it is why the ledger may still say
      # attestations: 2 for that run.
      #
      # It doubles every build, which is the wrong trade while the set is
      # growing from twelve toward 150 and most runs exist to find out whether
      # a new recipe works at all. Bring it back once the set is complete --
      # the `veron compare` command and the --mark plumbing are untouched, so
      # restoring this step is the only work involved.

      # WITH G3 REMOVED, THE MARKER IS ABSENT AND attestations HONESTLY READS
      # 1. That is the point of reading it from evidence rather than writing a
      # constant: turning the gate off lowers the claim automatically instead
      # of leaving a 2 behind that nothing checked.
      - name: 'VERON-LEDGER-OK -- records carry what this run proved'
        run: |
          set -eu
          cd spikes/stage5
          python3 tools/veron ledger
          python3 tools/veron status
          echo "  attestations:"
          grep -h '"attestations"' ledger/*.json | sed 's/^/    /'

      - name: 'Merge the DESTDIRs into the system'
        run: |
          set -eu
          cd spikes/stage5
          # THE DRIVER MERGES, BECAUSE THE DRIVER ALREADY KNOWS HOW.
          #
          # This was `cp -a "$d". sysroot/` in a loop here, and run 55 died on
          # it three packages in:
          #
          #     merging bash
          #     cp: cannot create regular file 'sysroot/./usr/bin/bashbug':
          #         Permission denied
          #
          # stage_into() had already copied bash into the build root during the
          # build, so the merge was writing over existing files -- and `cp`
          # opens the destination rather than replacing it, which fails on any
          # mode that is not user-writable.
          #
          # stage_into() has unlinked first ever since staging bzip2 wrote
          # through /usr/bin's busybox symlinks and destroyed the binary that
          # `tar` resolved to. THIS LOOP WAS A SECOND IMPLEMENTATION OF STAGING
          # WITHOUT THAT LESSON -- the same defect as the find-list that used to
          # duplicate BUILD_LOGS. One implementation now, in the driver, and
          # `build_only` is honoured there too rather than by a name check here.
          # GLOBAL OPTIONS COME BEFORE THE SUBCOMMAND. --dest and --sysroot
          # are registered on the top-level parser, so `veron merge --dest X`
          # is an error -- which is exactly how run 56 died, three steps after
          # a clean 45-package build:
          #     veron: error: unrecognized arguments: --dest dest --sysroot sysroot
          # Every other call in this file already had the order right; this one
          # was written from memory rather than copied.
          python3 tools/veron --dest dest --sysroot sysroot merge
          # Two .pc fixtures, one requiring the other, so pkgconf's transitive
          # resolution and search-path pinning are EXERCISED rather than the
          # binary merely being installed.
          install -D -m644 guest/fixtures/veron-a.pc sysroot/usr/lib/pkgconfig/veron-a.pc
          install -D -m644 guest/fixtures/veron-b.pc sysroot/usr/lib/pkgconfig/veron-b.pc
          # GENERATED FROM THE RECIPES. guest/test.sh hardcoded both packages;
          # at 150 that is a file nobody maintains. Adding a package now adds
          # its test, in the same file as its pin and its flags.
          python3 tools/veron guest-tests --out sysroot/usr/bin/veron-stage5-test

          # THE SELF-REBUILD PAYLOAD. Everything the image needs to rebuild
          # itself with no network: the pinned tarballs, the recipes, the
          # policy, the driver, and the runner's manifest as the thing to
          # compare against. This is also what makes the shipped system able
          # to rebuild a package a user removed -- the same data, used the
          # same way.
          mkdir -p sysroot/veron/expected sysroot/build sysroot/dest sysroot/out
          cp -a dl sysroot/veron/dl
          cp -a packages policy tools sysroot/veron/
          cp out/files.tsv sysroot/veron/expected/files.tsv
          install -D -m755 guest/selfrebuild.sh sysroot/veron/selfrebuild.sh
          du -sh sysroot | sed 's/^/    /'

      # Native aarch64, so these are the real binaries executing.
      - name: 'VERON-STAGE5-OK -- hello and pkgconf in the system they belong to'
        run: |
          set -eu
          cd spikes/stage5
          bwrap --unshare-all --die-with-parent \
            --bind sysroot / --proc /proc --dev /dev --tmpfs /tmp \
            --setenv PATH /usr/bin:/usr/sbin --setenv LC_ALL C \
            --chdir / /usr/bin/veron-stage5-test

      # IMAGE. Every determinism knob explicit, because each defaults to
      # something that VARIES. A first run failing to reproduce is the spike
      # working; the divergence goes on the declared list.
      - name: 'Build the image and probe reproducibility'
        env:
          # THIRD TIME. The git-pinned mirror step needed this and lacked it;
          # the checkpoint step got HTTP 403 for want of it; and now a 1.7 GB
          # image that built and reproduced byte-for-byte went nowhere because
          # `gh` had no token. Each time the step failed AFTER doing all its
          # real work, and each time the fix was two lines.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd spikes/stage5/out
          # SOURCE_DATE_EPOCH DOES NOT WORK HERE. That was the first guess and
          # it was wrong -- reproduced locally against mke2fs 1.47.0 with the
          # variable set, and the same three superblock timestamps still
          # differed. The image is normalised afterwards instead; see
          # tools/normalize-ext4.py for the byte offsets and the reasoning.
          SZ=$(du -sm ../sysroot | cut -f1); SZ=$((SZ + 200))
          build_img() {
            rm -f "$1"
            /sbin/mke2fs -q -t ext4 -d ../sysroot \
              -U 00000000-0000-4000-8000-000000000001 \
              -E hash_seed=00000000-0000-4000-8000-000000000002 \
              -O ^has_journal,^resize_inode,^dir_index,^metadata_csum \
              -m 0 -b 4096 "$1" "${SZ}M"
            # DECLARED TRANSFORMATION, not a silent fixup: rewrites the three
            # superblock timestamps and every inode's times, with debugfs so
            # the checksums are recomputed rather than left wrong.
            python3 ../tools/normalize-ext4.py "$1"
          }
          build_img rootfs.img
          sha256sum rootfs.img | tee IMAGE-SHA256
          cp rootfs.img /tmp/img1
          build_img rootfs.img
          if cmp -s /tmp/img1 rootfs.img; then
            echo "VERON-IMAGE-REPRO-OK  two builds, identical bytes"
          else
            echo "VERON-IMAGE-REPRO-DIFF  the CONTAINER did not reproduce."
            echo "  The packages may still be byte-identical; a filesystem is"
            echo "  full of exactly the metadata that varies. Record the cause"
            echo "  in policy/expected-differences.toml or fix the knob."
            cmp -l /tmp/img1 rootfs.img | head -20 || true
          fi

          # PUBLISH THE IMAGE, FOR THE SAME REASON THE SYSROOT AND THE TOOLBOX
          # ARE PUBLISHED. rootfs.img is what this entire pipeline exists to
          # produce -- built, hashed, proven byte-identical across two builds,
          # booted under a kernel this chain compiled -- and it was being
          # destroyed with the runner. The one artifact a person would actually
          # want was the one nothing kept.
          #
          # Compressed, because the tree is several gigabytes and a GitHub
          # release asset is capped at 2 GB. The stage-4 sysroot went from
          # 619 MB to 122 MB the same way; an ext4 image full of the same
          # binaries compresses similarly.
          # CHECK THE INPUTS BEFORE SPENDING THIRTY MINUTES ON THE OUTPUT.
          #
          # The first version compressed first and validated last, so a
          # missing `Image` -- a path bug worth one millisecond to detect --
          # was found only after zstd had ground through 4.5 GB. The order
          # was free to get right and I got it backwards.
          R=../../..
          missing=""
          for f in "$R/boot/Image" files.tsv initramfs.cpio.gz; do
            [ -e "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "  not publishing -- missing:$missing"
            echo "VERON-STAGE5-UNPUBLISHED  inputs absent, nothing compressed"
          else
          # ZSTD_CLEVEL=10, NOT 19. Level 19 was chosen for the stage-4
          # sysroot -- 619 MB, written once per chain run -- and then reused
          # here on an image seven times larger without rethinking it. That
          # cost about thirty minutes per run for a few percent of size, on
          # something every stage-5 run produces.
          ZSTD_CLEVEL=10 tar --zstd -cf rootfs.img.tar.zst rootfs.img
          asset=$(stat -c%s rootfs.img.tar.zst)
          printf '  rootfs.img.tar.zst: %s\n' "$(du -h rootfs.img.tar.zst | cut -f1)"
          if [ "$asset" -lt 2000000000 ]; then
            gh release create stage5/latest --title 'Veron stage 5' \
              --notes 'The stage-5 system image, and the kernel and initramfs that boot it. Open with the zstd in toolbox/latest.' \
              2>/dev/null || true
            # PATHS RELATIVE TO THIS STEP'S cwd, WHICH IS spikes/stage5/out.
            # The first version copied `boot/Image` and
            # `spikes/stage5/out/files.tsv` as if it were at the repo root,
            # found neither, and each `|| true` swallowed it -- so the upload
            # ran with a missing filename and gh answered "no matches found
            # for `Image`" after the 1.7 GB compression had already happened.
            #
            # No `|| true` here. A file that should exist and does not is a
            # fault, and initramfs.cpio.gz is in this directory already.
            assets="rootfs.img.tar.zst IMAGE-SHA256"
            for f in "$R/boot/Image" files.tsv initramfs.cpio.gz; do
              [ "$f" = "${f#$R/}" ] || cp "$f" .
              assets="$assets $(basename "$f")"
            done
            echo "  uploading: $assets"
            if gh release upload stage5/latest $assets --clobber; then
              echo "VERON-STAGE5-PUBLISHED  $(cut -d' ' -f1 IMAGE-SHA256)"
            else
              # NOT FATAL. The build is the result; the release is delivery.
              echo "VERON-STAGE5-UNPUBLISHED -- the image stands"
            fi
          else
            echo "  image too large to publish: $((asset/1048576)) MB, cap is 2 GB"
          fi
          # A SMALL BUNDLE OF EXACTLY WHAT LOGIN NEEDS, BESIDE THE FULL IMAGE.
          #
          # rootfs.img.tar.zst is 1.7 GB -- fine for a release, useless for
          # anyone iterating on the boot path who has to move it first. The
          # boot question is only about dinit, busybox, a shell and /etc, and
          # those are a few megabytes. Testing `console` against this bundle
          # answers the same question as testing against the full image, and
          # answers it in a minute instead of a download.
          #
          # Built from the merged sysroot rather than from the recipes, so it
          # is the real thing rather than a reconstruction.
          # THE SYSROOT IS ONE LEVEL UP, NOT HERE. This looked in ./sysroot
          # from spikes/stage5/out, found nothing, and produced a 4 KB
          # "loginkit" containing an empty directory -- which reported success
          # because every miss was `|| true`.
          SR=../sysroot
          mkdir -p loginkit
          got=0
          for f in bin/busybox bin/sh usr/bin/dinit usr/bin/dinitctl \
                   usr/bin/dinit-check usr/bin/bash sbin/dinit; do
            if [ -e "$SR/$f" ]; then
              mkdir -p "loginkit/$(dirname "$f")"
              cp -a "$SR/$f" "loginkit/$f"
              got=$((got + 1))
            fi
          done
          [ -d "$SR/etc" ] && cp -a "$SR/etc" loginkit/etc
          # A BUNDLE WITH NOTHING IN IT IS A BUG, NOT A SMALL BUNDLE.
          [ "$got" -gt 0 ] || { echo "  loginkit found nothing under $SR"; exit 1; }
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -czf loginkit.tar.gz loginkit
          printf '  loginkit.tar.gz: %s (dinit, busybox, a shell and /etc)\n' \
            "$(du -h loginkit.tar.gz | cut -f1)"
          rm -f rootfs.img.tar.zst
          fi

      # BOOT. The ladder's initramfs already mounts mount_tag veronsysroot over
      # 9p and runs gcc inside it, so pointing 9p at OUR merged tree reuses that
      # test unchanged against the stage-5 system.
      #
      # STATED PLAINLY: this proves the merged system boots and compiles under
      # the real kernel. It does NOT run the hello/pkgconf tests in the guest --
      # the initramfs is stage 4's and calls its own. Those ran above, natively,
      # on real aarch64 binaries. Two claims, two places.
      - name: 'Find the latest stage-4 run'
        id: s4
        if: '!inputs.skip_boot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          id=$(gh run list --workflow=stage0-stage4-complete.yml --status=success \
                 --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          echo "run_id=${id:-}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: ${{ !inputs.skip_boot && steps.s4.outputs.run_id != '' }}
        continue-on-error: true
        with:
          name: veron-boot
          path: boot
          run-id: ${{ steps.s4.outputs.run_id }}
          github-token: ${{ github.token }}

      # STAGE 5 OWNS ITS BOOT. Stage 4's initramfs runs stage 4's tests and
      # knows nothing about stage 5 -- so the QEMU output was entirely stage
      # 4's while the stage-5 tests ran only under bwrap. Teaching stage 4's
      # init about stage 5 would invert the dependency; stage 4's job ends at
      # "a booting system". This is also the first small piece of the init
      # work group 2 needs for a login prompt.
      - name: 'Build stage 5 initramfs'
        if: '!inputs.skip_boot'
        run: |
          set -eu
          cd spikes/stage5
          python3 guest/mkinitramfs.py sysroot out/initramfs.cpio.gz

      - name: 'Boot the stage-5 system and run its own tests'
        if: '!inputs.skip_boot'
        run: |
          set -eu
          [ -s boot/Image ] || { echo "VERON-BOOT-SKIP  no kernel artifact"; exit 0; }
          # The in-guest rebuild is opt-in and off by default: twelve minutes
          # for two packages under TCG, answering a question G3 already
          # answers natively in seconds. Passed on the KERNEL CMDLINE so the
          # image contents -- and therefore its hash -- do not depend on it.
          SR=""; QEMU_TIMEOUT=900
          if [ "${{ inputs.selfrebuild }}" = "true" ]; then
            SR=" veron.selfrebuild=1"; QEMU_TIMEOUT=2400
          fi

          # BOOT A COPY. The gate remounts the root read-write to get scratch
          # space, so booting the published image directly would mutate the
          # artifact whose hash was just recorded -- and the reproducibility
          # claim with it.
          cp spikes/stage5/out/rootfs.img spikes/stage5/out/rootfs-boot.img
          set +e
          # The DISK is offered first: init prefers /dev/vda so the test runs
          # against the ext4 image a user would flash, not a 9p share. 9p is
          # still offered as the fallback if virtio-blk or ext4 are absent
          # from this kernel.
          # veron.boot=system SWITCHES ROOT INTO dinit INSTEAD OF RUNNING THE
          # TEST HARNESS. Off by default: the harness is what proves the 62
          # packages work under a real kernel, and it must keep running on
          # every green build. This input proves the BOOT PATH, which is a
          # different question and a newer one -- and guest/init falls back to
          # the harness if the overlay or switch_root fails, so a bad boot
          # reports rather than hanging with no shell.
          BOOTMODE=""
          if [ "${{ inputs.boot_system }}" = "true" ]; then
            BOOTMODE=" veron.boot=system"
            echo "  veron.boot=system: switching root into dinit"
            # AN INIT SYSTEM DOES NOT EXIT, SO THE TEST CANNOT WAIT FOR IT TO.
            # The harness runs its tests and powers off, so `timeout` never
            # fires and rc=0 means success. dinit as PID 1 runs forever by
            # definition -- the first boot_system run sat for fifteen minutes
            # and reported rc=124 while every service had already started.
            #
            # So the timeout becomes the normal ending rather than the
            # failure, and success is judged from what reached the console.
            # Three minutes is enough for dinit to bring up three services;
            # if it is not, the markers will say which one is missing.
            QEMU_TIMEOUT=180
          fi
          timeout ${QEMU_TIMEOUT:-900} qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -smp 4 -m 4096 \
            -nographic -no-reboot -nic none \
            -drive file=spikes/stage5/out/rootfs-boot.img,format=raw,if=virtio \
            -fsdev local,id=vs,path="$PWD/spikes/stage5/sysroot",security_model=none,readonly=on \
            -device virtio-9p-pci,fsdev=vs,mount_tag=veronsysroot \
            -device virtio-gpu-pci -device virtio-keyboard-pci \
            -kernel boot/Image -initrd spikes/stage5/out/initramfs.cpio.gz \
            -append "console=ttyAMA0 earlycon rdinit=/init panic=1 loglevel=7${SR}${BOOTMODE}" \
            > boot.log 2>&1
          rc=$?
          echo "  qemu rc=$rc"
          set -e
          if [ -n "$BOOTMODE" ]; then
            # rc=124 IS THE EXPECTED ENDING HERE, not a fault. What decides
            # the result is whether dinit started what it was asked to.
            fail=0
            for svc in early-filesystems console boot; do
              if grep -q "\[  OK  \] $svc" boot.log; then
                echo "  VERON-DINIT-OK      $svc"
              else
                echo "  VERON-DINIT-FAIL    $svc did not start"
                grep -a "$svc" boot.log | tail -2 | sed 's/^/      /'
                fail=1
              fi
            done
            if [ "$fail" = 0 ]; then
              echo "VERON-STAGE5-LOGIN-OK  dinit brought up every service"
            else
              echo "VERON-STAGE5-LOGIN-FAIL"
              exit 1
            fi
            exit 0
          fi
          # THE PROBE'S ANSWER, LIFTED OUT OF THE BOOT LOG.
          #
          # It is reported and never enforced: nothing in the set needs DRM or
          # evdev yet, and failing a green run over a capability no package
          # uses would be a gate that fires on correct code. What it buys is
          # knowing the answer before wlroots, mesa and labwc are written
          # against it.
          grep -E "VERON-(DRM|EVDEV)-(OK|ABSENT)" boot.log | sed 's/^ */  /' || \
            echo "  VERON-GRAPHICS-PROBE-ABSENT  the probe did not run"
          if grep -q VERON-STAGE5-INIT boot.log; then
            sed -n '/VERON-STAGE5-INIT/,$p' boot.log | sed 's/^/    /'
          else
            tail -40 boot.log | sed 's/^/    /'
            echo "  the stage-5 init never reached userspace"; exit 1
          fi
          grep -q "VERON-STAGE5-OK" boot.log \
            && echo "VERON-STAGE5-BOOT-OK  the packages ran under the kernel" \
            || { echo "VERON-STAGE5-BOOT-FAIL  init ran, tests did not pass"; exit 1; }

          # THE TIER-1 CLAIM. Reported separately from the boot, because they
          # are different claims: the boot says the packages work, the gate
          # says the system can rebuild them. A DIFF here is a finding worth
          # having, not a broken system -- so it is surfaced loudly and does
          # not fail the run while the spike is still learning what varies.
          if grep -q "VERON-SELFREBUILD-OK" boot.log; then
            echo "VERON-SELFHOST-OK  rebuilt inside the image, byte-identical"
          elif grep -q "VERON-SELFREBUILD-DIFF" boot.log; then
            echo "VERON-SELFHOST-DIFF  it rebuilt, and some bytes differ."
            echo "  That is a reproducibility finding across two genuinely"
            echo "  different environments -- see the diff above and record"
            echo "  each cause in policy/expected-differences.toml."
          elif grep -q "VERON-SELFREBUILD-SKIP" boot.log; then
            echo "VERON-SELFHOST-SKIPPED  in-guest rebuild is off by default."
            echo "  Reproducibility is answered by G3 above, natively and in"
            echo "  seconds. Re-run with selfrebuild=true for the in-guest"
            echo "  confirmation -- about 12 minutes for two packages."
          else
            echo "VERON-SELFHOST-ABSENT  the gate did not run and did not skip"
          fi

      # WHEN A TEST SUITE HANGS, THE ANSWER IS ALREADY ON DISK. automake's
      # harness writes a .log per test as it runs, so the test that hung has
      # a log file sitting in the build tree -- and the run has been dying
      # before the upload, throwing that away every time. Two runs were spent
      # watching m4 stop after `PASS: test-error.sh` without ever learning
      # which test came next.
      # EVIDENCE SURVIVES THE RUNNER, OR IT DOES NOT EXIST.
      #
      # What this replaces printed "collected 32 log files" and preserved
      # none of them: it copied into out/logs/ and THERE WAS NO UPLOAD STEP
      # IN THIS WORKFLOW AT ALL. It was also `if: failure()`, so the run that
      # most needed reading -- a `meson setup` that succeeded and was failed
      # afterwards by the driver -- collected nothing, because nothing had
      # failed in the shape the condition expected.
      #
      # And it never touched logs/, the driver's own per-package record of
      # every argv, env var, rc and duration. That file has been written on
      # every run the driver has ever made and nobody has read one.
      #
      # THE FIND LIST LIVED HERE AND DUPLICATED BUILD_LOGS IN THE DRIVER.
      # Two lists that must agree with nothing comparing them is the same
      # defect as [declared] drifting from the argv. `veron collect` owns it.
      - name: 'VERON-COLLECT -- preserve the evidence'
        if: always()
        run: |
          set -eu
          cd spikes/stage5
          python3 tools/veron --logs logs --out out --build-dir build collect

      # if: always() ON THE UPLOAD TOO. A conditional upload attached to an
      # unconditional collect just moves the hole one step later.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veron-stage5-loginkit-${{ github.run_id }}
          path: spikes/stage5/loginkit.tar.gz
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veron-stage5-diag-${{ github.run_id }}-${{ github.run_attempt }}
          path: spikes/stage5/out/diag
          if-no-files-found: error
          retention-days: 30
