name: stage5-spike

# MINIMAL STAGE 5: two packages, built on the proven entry contract, merged
# into an image, booted.
#
# WHAT CHANGED SINCE THIS WAS FIRST WRITTEN. The original restored the stage-4
# sysroot by cache PREFIX and named VERON-ENTRY-ABSENT as its expected first
# failure, because stage 4 published no sysroot. That gap is closed:
# sysroot-inventory.yml publishes `veron-sysroot-trimmed` (481 MB, named,
# hashed, deterministically packed) and stage5-entry.yml has PROVEN it
# compiles C, C++, -flto and -static, and boots. So this consumes a pinned
# artifact rather than guessing a cache key.
#
# NO BUILD LOGIC IN THIS FILE. Every `run:` is environment setup or a call to
# spikes/stage5/tools/veron. If build logic reappears here, that is the
# regression -- DERIVATIONS.md Decision 3.

on:
  workflow_dispatch:
    inputs:
      sysroot_run_id:
        description: 'sysroot-inventory run id (blank = latest successful)'
        required: false
        default: ''
      skip_boot:
        description: 'Build and test, but do not boot'
        type: boolean
        required: false
        default: false

concurrency:
  group: stage5-spike-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  spike:
    runs-on: ubuntu-24.04-arm      # NATIVE aarch64 -- the sysroot IS aarch64,
                                   # so packages build AND RUN unemulated
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: 'Airlock deps (tier 2 -- drives the build, touches no artifact byte)'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap qemu-system-arm e2fsprogs
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor and
          # bwrap then fails on loopback setup. hermetic-gcc10/15/16 and
          # float-probe already carry this; stage5-entry lost a run to its
          # absence and reported it as a compiler fault.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          python3 -c 'import tomllib' || { echo "python 3.11+ required"; exit 1; }

      - name: 'VERON-PLAN-OK -- regenerate and diff'
        run: cd spikes/stage5 && python3 tools/veron plan --check

      - name: 'Find the sysroot-inventory run'
        id: inv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          id="${{ inputs.sysroot_run_id }}"
          [ -n "$id" ] || id=$(gh run list --workflow=sysroot-inventory.yml \
                --status=success --limit=1 --json databaseId \
                --jq '.[0].databaseId' 2>/dev/null || true)
          [ -n "$id" ] && [ "$id" != null ] || { echo "no sysroot-inventory run"; exit 1; }
          echo "run_id=$id" >> "$GITHUB_OUTPUT"; echo "  using run $id"

      - uses: actions/download-artifact@v4
        with:
          name: veron-sysroot-trimmed
          path: dl-sysroot
          run-id: ${{ steps.inv.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: 'Unpack the sysroot and verify its published hash'
        run: |
          set -eu
          want=$(awk '{print $1}' dl-sysroot/report/SYSROOT-SHA256)
          got=$(sha256sum dl-sysroot/sysroot.tar | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "SYSROOT HASH MISMATCH"; exit 1; }
          mkdir -p spikes/stage5/sysroot
          tar -xf dl-sysroot/sysroot.tar -C spikes/stage5/sysroot
          du -sh spikes/stage5/sysroot | sed 's/^/    /'
          echo "VERON-ENTRY-OK  $got"

      # AIRLOCK. Network lives here and nowhere else. Fetch goes through the
      # mirror so a dead upstream costs a fallback rather than the run.
      - name: 'Fetch pinned sources through the mirror'
        run: |
          set -eu
          cd spikes/stage5
          mkdir -p dl
          # ITERATE, NEVER HARDCODE. The first version of this step carried
          # pkgconf's sha256 as a literal and special-cased hello -- so the
          # moment hello's pin stopped being PENDING, the check passed and
          # nothing fetched it. `veron sources` emits every pin, so adding a
          # package changes one recipe and nothing else.
          fail=0
          python3 tools/veron sources | while IFS="$(printf '\t')" read -r sha name url; do
            python3 ../../tools/mirror.py fetch "$sha" "$name" --url "$url" --dest dl \
              || { echo "  FAILED $name"; exit 1; }
          done || fail=1
          [ "$fail" = 0 ] || { echo "VERON-FETCH-INCOMPLETE"; exit 1; }

      - name: 'VERON-FETCH-OK -- sha256 against the manifest'
        run: cd spikes/stage5 && python3 tools/veron fetch

      # BUILD. bwrap with the SYSROOT AS THE FILESYSTEM -- no host /usr, no
      # host /etc. Same shape as phase B and hermetic-gcc15's box15.sh, and the
      # reason it is worth anything: if a host header were reachable, a missing
      # one in the sysroot would not show up.
      - name: 'VERON-SEAL + build both packages'
        run: |
          set -eu
          cd spikes/stage5
          mkdir -p build dest out logs
          bwrap --unshare-all --die-with-parent \
            --bind sysroot / \
            --bind "$PWD/build" /build --bind "$PWD/dest" /dest \
            --bind "$PWD/dl" /dl --bind "$PWD/logs" /logs --bind "$PWD/out" /out \
            --ro-bind "$PWD/packages" /packages \
            --ro-bind "$PWD/policy" /policy --ro-bind "$PWD/tools" /tools \
            --proc /proc --dev /dev --tmpfs /tmp \
            --setenv PATH /usr/bin:/usr/sbin \
            --setenv LC_ALL C --setenv TZ UTC --setenv SOURCE_DATE_EPOCH 0 \
            --chdir / \
            /usr/bin/python3 /tools/veron \
              --dl /dl --build-dir /build --dest /dest --logs /logs --out /out \
              build

      - name: 'VERON-MANIFEST-OK + VERON-LEDGER-OK'
        run: |
          set -eu
          cd spikes/stage5
          python3 tools/veron manifest
          python3 tools/veron ledger
          python3 tools/veron status

      # MERGE. The sysroot IS the base of the final system, not merely the
      # build environment -- so the image is the entry contract plus what
      # stage 5 installed on top of it.
      - name: 'Merge the DESTDIRs into the system'
        run: |
          set -eu
          cd spikes/stage5
          for d in dest/*/; do
            [ -d "$d" ] || continue
            echo "  merging $(basename "$d")"
            cp -a "$d". sysroot/
          done
          # Two .pc fixtures, one requiring the other, so pkgconf's transitive
          # resolution and search-path pinning are EXERCISED rather than the
          # binary merely being installed.
          install -D -m644 guest/fixtures/veron-a.pc sysroot/usr/lib/pkgconfig/veron-a.pc
          install -D -m644 guest/fixtures/veron-b.pc sysroot/usr/lib/pkgconfig/veron-b.pc
          install -D -m755 guest/test.sh sysroot/usr/bin/veron-stage5-test

          # THE SELF-REBUILD PAYLOAD. Everything the image needs to rebuild
          # itself with no network: the pinned tarballs, the recipes, the
          # policy, the driver, and the runner's manifest as the thing to
          # compare against. This is also what makes the shipped system able
          # to rebuild a package a user removed -- the same data, used the
          # same way.
          mkdir -p sysroot/veron/expected sysroot/build sysroot/dest sysroot/out
          cp -a dl sysroot/veron/dl
          cp -a packages policy tools sysroot/veron/
          cp out/files.tsv sysroot/veron/expected/files.tsv
          install -D -m755 guest/selfrebuild.sh sysroot/veron/selfrebuild.sh
          du -sh sysroot | sed 's/^/    /'

      # Native aarch64, so these are the real binaries executing.
      - name: 'VERON-STAGE5-OK -- hello and pkgconf in the system they belong to'
        run: |
          set -eu
          cd spikes/stage5
          bwrap --unshare-all --die-with-parent \
            --bind sysroot / --proc /proc --dev /dev --tmpfs /tmp \
            --setenv PATH /usr/bin:/usr/sbin --setenv LC_ALL C \
            --chdir / /usr/bin/veron-stage5-test

      # IMAGE. Every determinism knob explicit, because each defaults to
      # something that VARIES. A first run failing to reproduce is the spike
      # working; the divergence goes on the declared list.
      - name: 'Build the image and probe reproducibility'
        run: |
          set -eu
          cd spikes/stage5/out
          # SOURCE_DATE_EPOCH DOES NOT WORK HERE. That was the first guess and
          # it was wrong -- reproduced locally against mke2fs 1.47.0 with the
          # variable set, and the same three superblock timestamps still
          # differed. The image is normalised afterwards instead; see
          # tools/normalize-ext4.py for the byte offsets and the reasoning.
          SZ=$(du -sm ../sysroot | cut -f1); SZ=$((SZ + 200))
          build_img() {
            rm -f "$1"
            /sbin/mke2fs -q -t ext4 -d ../sysroot \
              -U 00000000-0000-4000-8000-000000000001 \
              -E hash_seed=00000000-0000-4000-8000-000000000002 \
              -O ^has_journal,^resize_inode,^dir_index,^metadata_csum \
              -m 0 -b 4096 "$1" "${SZ}M"
            # DECLARED TRANSFORMATION, not a silent fixup: rewrites the three
            # superblock timestamps and every inode's times, with debugfs so
            # the checksums are recomputed rather than left wrong.
            python3 ../tools/normalize-ext4.py "$1"
          }
          build_img rootfs.img
          sha256sum rootfs.img | tee IMAGE-SHA256
          cp rootfs.img /tmp/img1
          build_img rootfs.img
          if cmp -s /tmp/img1 rootfs.img; then
            echo "VERON-IMAGE-REPRO-OK  two builds, identical bytes"
          else
            echo "VERON-IMAGE-REPRO-DIFF  the CONTAINER did not reproduce."
            echo "  The packages may still be byte-identical; a filesystem is"
            echo "  full of exactly the metadata that varies. Record the cause"
            echo "  in policy/expected-differences.toml or fix the knob."
            cmp -l /tmp/img1 rootfs.img | head -20 || true
          fi

      # BOOT. The ladder's initramfs already mounts mount_tag veronsysroot over
      # 9p and runs gcc inside it, so pointing 9p at OUR merged tree reuses that
      # test unchanged against the stage-5 system.
      #
      # STATED PLAINLY: this proves the merged system boots and compiles under
      # the real kernel. It does NOT run the hello/pkgconf tests in the guest --
      # the initramfs is stage 4's and calls its own. Those ran above, natively,
      # on real aarch64 binaries. Two claims, two places.
      - name: 'Find the latest stage-4 run'
        id: s4
        if: '!inputs.skip_boot'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          id=$(gh run list --workflow=stage0-stage4-complete.yml --status=success \
                 --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          echo "run_id=${id:-}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: ${{ !inputs.skip_boot && steps.s4.outputs.run_id != '' }}
        continue-on-error: true
        with:
          name: veron-boot
          path: boot
          run-id: ${{ steps.s4.outputs.run_id }}
          github-token: ${{ github.token }}

      # STAGE 5 OWNS ITS BOOT. Stage 4's initramfs runs stage 4's tests and
      # knows nothing about stage 5 -- so the QEMU output was entirely stage
      # 4's while the stage-5 tests ran only under bwrap. Teaching stage 4's
      # init about stage 5 would invert the dependency; stage 4's job ends at
      # "a booting system". This is also the first small piece of the init
      # work group 2 needs for a login prompt.
      - name: 'Build stage 5 initramfs'
        if: '!inputs.skip_boot'
        run: |
          set -eu
          cd spikes/stage5
          python3 guest/mkinitramfs.py sysroot out/initramfs.cpio.gz

      - name: 'Boot the stage-5 system and run its own tests'
        if: '!inputs.skip_boot'
        run: |
          set -eu
          [ -s boot/Image ] || { echo "VERON-BOOT-SKIP  no kernel artifact"; exit 0; }
          # BOOT A COPY. The gate remounts the root read-write to get scratch
          # space, so booting the published image directly would mutate the
          # artifact whose hash was just recorded -- and the reproducibility
          # claim with it.
          cp spikes/stage5/out/rootfs.img spikes/stage5/out/rootfs-boot.img
          set +e
          # The DISK is offered first: init prefers /dev/vda so the test runs
          # against the ext4 image a user would flash, not a 9p share. 9p is
          # still offered as the fallback if virtio-blk or ext4 are absent
          # from this kernel.
          timeout 2400 qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -smp 4 -m 4096 \
            -nographic -no-reboot -nic none \
            -drive file=spikes/stage5/out/rootfs-boot.img,format=raw,if=virtio \
            -fsdev local,id=vs,path="$PWD/spikes/stage5/sysroot",security_model=none,readonly=on \
            -device virtio-9p-pci,fsdev=vs,mount_tag=veronsysroot \
            -kernel boot/Image -initrd spikes/stage5/out/initramfs.cpio.gz \
            -append "console=ttyAMA0 earlycon rdinit=/init panic=1 loglevel=7" \
            > boot.log 2>&1
          echo "  qemu rc=$?"
          set -e
          if grep -q VERON-STAGE5-INIT boot.log; then
            sed -n '/VERON-STAGE5-INIT/,$p' boot.log | sed 's/^/    /'
          else
            tail -40 boot.log | sed 's/^/    /'
            echo "  the stage-5 init never reached userspace"; exit 1
          fi
          grep -q "VERON-STAGE5-OK" boot.log \
            && echo "VERON-STAGE5-BOOT-OK  the packages ran under the kernel" \
            || { echo "VERON-STAGE5-BOOT-FAIL  init ran, tests did not pass"; exit 1; }

          # THE TIER-1 CLAIM. Reported separately from the boot, because they
          # are different claims: the boot says the packages work, the gate
          # says the system can rebuild them. A DIFF here is a finding worth
          # having, not a broken system -- so it is surfaced loudly and does
          # not fail the run while the spike is still learning what varies.
          if grep -q "VERON-SELFREBUILD-OK" boot.log; then
            echo "VERON-SELFHOST-OK  rebuilt inside the image, byte-identical"
          elif grep -q "VERON-SELFREBUILD-DIFF" boot.log; then
            echo "VERON-SELFHOST-DIFF  it rebuilt, and some bytes differ."
            echo "  That is a reproducibility finding across two genuinely"
            echo "  different environments -- see the diff above and record"
            echo "  each cause in policy/expected-differences.toml."
          else
            echo "VERON-SELFHOST-ABSENT  the gate did not run"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-spike
          path: |
            spikes/stage5/out/
            spikes/stage5/ledger/
            spikes/stage5/logs/
            spikes/stage5/PLAN.txt
            boot.log
          retention-days: 30
