# WHAT DO THE REMAINING PACKAGES ACTUALLY NEED? ASK THEM, DO NOT GUESS.
#
# rung 11.5 died on `split: not found` and then `comm: not found` -- two
# applets Ubuntu's busybox-static was compiled without. Each cost a full
# 20-minute round to discover, one at a time, and there are six more packages
# above perl that have never been built here: python, bison, flex, m4, bc,
# openssl, and the kernel's own scripts.
#
# Discovering those the same way is six more rounds. This job finds them all in
# about two minutes, by running each package's OWN configure inside a box that
# has exactly what the real box has -- and recording every command the shell
# could not find.
#
# HOW IT WORKS. PATH is set to a directory of TRAPS: one tiny script per
# candidate tool name, each of which logs itself and exits 127 like a missing
# command. Nothing is actually built. What comes out is the set of external
# programs each configure reached for, which is precisely the list the real box
# needs to supply.
#
# WHY A TRAP RATHER THAN grep. A configure script decides what to invoke at
# runtime -- `if test -z "$AWK"`, `case $host in`, `for ac_prog in gawk mawk
# nawk awk` -- so reading the source tells you what it MIGHT use. Running it
# tells you what it DID. perl's Configure is 30,000 lines of shell precisely
# because it probes rather than declares.
#
# WHAT THIS DOES NOT ANSWER. It finds tools missing at CONFIGURE time. A
# package can also want something only during `make` -- the kernel wants perl
# in scripts/, glibc wants python for gen-tunable-list.py -- so a clean result
# here is not a promise. It is a much shorter list of surprises.

# THE SCOPE, BECAUSE THIS JOB HAS DRIFTED TOWARD BEING A SECOND REFERENCE JOB
# MORE THAN ONCE.
#
#   IN SCOPE   what does a package's configure REACH FOR, and what does it
#              silently disable when it is not there. Answered with the least
#              box that can ask -- musl, make, binutils, rung 5, one minute.
#
#   OUT OF SCOPE  does the package BUILD CORRECTLY. That needs the compiler the
#              ladder actually uses, which is gcc 10 at rung 9, and building
#              nine rungs here would make this a slow copy of
#              stage3-to-stage4-reference answering nothing new.
#
# A parse error here is probably tcc. A missing header or library is the box,
# and that IS the answer this job exists for.
#
# ONE STEP IS DELIBERATELY NOT HERMETIC: "THE STATIC-MODULE TEST" runs on the
# bare runner with the host gcc, because it asks whether a BUILD TECHNIQUE
# works -- does makesetup honour Setup.local -- and that does not depend on
# which compiler or libc is present. The probe's own box cannot answer it: tcc
# cannot build python 3.14 at all. Marked here so the exception stays an
# exception.

name: tool-probe

on:
  workflow_dispatch:
    inputs:
      pkg:
        description: 'which package to build hermetically (perl, Python, m4, bison, flex, bc)'
        required: false
        default: 'perl' 

env:
  PERL_VER: '5.42.0'
  PYTHON_VER: '3.14.3'
  M4_VER: '1.4.21'
  BISON_VER: '3.8.2'
  FLEX_VER: '2.6.4'
  BC_VER: '7.0.3'
  GLIBC: '2.43'
  KHDR: '7.1.3'

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    # Parallel configures, cached downloads. This is meant to answer in
    # minutes -- the whole point is to be cheaper than discovering the same
    # thing one tool at a time in the reference job's twenty-minute rounds.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update -qq
          # bubblewrap AND musl-tools GO IN HERE, NOT LATER.
          #
          # They used to be installed mid-job, in the AIRLOCK step. bwrap then
          # failed with "loopback: Failed RTM_NEWADDR: Operation not permitted"
          # in every variant tried -- while the reference job, which installs
          # bubblewrap in its FIRST step alongside everything else, has never
          # seen it.
          #
          # Whether the install position is the cause is not proven. It is the
          # last difference between the two jobs after flags, namespaces and
          # step boundaries were all matched and all failed, and it costs
          # nothing to eliminate.
          sudo apt-get install -y --no-install-recommends \
            busybox-static curl xz-utils gcc bubblewrap musl-tools file git make
          # THE LINE THAT WAS MISSING, AND THE ONLY ONE THAT MATTERED.
          #
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor, so bwrap cannot bring up loopback and reports
          #
          #     bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
          #
          # stage3-to-stage4-reference has had this sysctl since it was
          # written, one line under its apt-get. Five rounds went into flag
          # variations, namespace decomposition, step splitting and install
          # ordering -- all of which were the same in both jobs -- because I
          # compared the bwrap INVOCATIONS instead of diffing the whole steps.
          #
          # The gate below is what found it, by printing what the runner allows
          # rather than another theory:
          #     apparmor userns restrict: 1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true

      # DOES bwrap WORK AT ALL, IN THIS JOB, RIGHT NOW?
      #
      # Four rounds were spent on "loopback: Failed RTM_NEWADDR", each finding
      # out four steps deep and after a busybox build, a tcc build and a
      # sysroot fetch. Every one of those is wasted if the sandbox cannot open.
      #
      # This asks in two seconds, with the exact flags the real step uses, and
      # prints what it got. A failure here is a fact about the runner rather
      # than about anything this job builds -- which is precisely the confusion
      # that made the last four rounds expensive.
      - name: 'GATE: can bwrap open a sandbox here?'
        run: |
          set -u
          T=$(mktemp -d)
          mkdir -p "$T/bin"
          cp /bin/busybox "$T/bin/busybox"
          ln -sf busybox "$T/bin/sh"
          set +e
          bwrap --unshare-all --die-with-parent \
            --bind "$T" / --proc /proc --dev /dev --tmpfs /tmp \
            /bin/sh -c 'echo "  bwrap --unshare-all: ok"'
          rc=$?
          set -e
          if [ "$rc" != 0 ]; then
            echo "  bwrap --unshare-all FAILED rc=$rc"
            echo "  --- what the runner allows ---"
            echo "    unprivileged_userns_clone: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo 'n/a')"
            echo "    max_user_namespaces:       $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo 'n/a')"
            echo "    apparmor userns restrict:  $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'n/a')"
            echo "    bwrap: $(bwrap --version 2>&1)"
            echo "    id: $(id)"
            echo
            echo "  Every step below that enters a box will fail the same way."
            echo "  That is a property of this runner, not of anything built here."
          fi
          rm -rf "$T"

      - name: 'What this busybox has, and what it does not'
        run: |
          set -eu
          B=/bin/busybox
          echo "  busybox: $($B 2>&1 | head -1)"
          echo "  applets: $($B --list | wc -l)"
          echo
          echo "  --- POSIX-ish tools this build DOES NOT have ---"
          # The list is every name a configure script plausibly reaches for.
          # Being generous here is free; being short is what cost two rounds.
          for a in awk gawk sed grep egrep fgrep tr cut sort uniq comm join \
                   split csplit paste expand unexpand fold fmt nl pr tsort col \
                   cmp diff patch find xargs sh bash test expr basename dirname \
                   od dd printf tee cat head tail wc ls cp mv rm mkdir rmdir \
                   ln chmod touch date env which command hostname uname id \
                   tar gzip bzip2 xz cpio ar nm strip ranlib ld as make m4 \
                   bison yacc flex lex perl python python3 pkg-config bc \
                   install msgfmt gettext autoconf automake libtool texi2any \
                   makeinfo pod2man help2man rsync file sleep seq yes true false; do
            $B --list | grep -qx "$a" || printf '    %s\n' "$a"
          done

      # THE DOWNLOADS ARE CACHED. This job exists to be run repeatedly while
      # the list is being worked through, so a fresh 150 MB fetch each time
      # would be most of its runtime.
      - uses: actions/cache@v4
        with:
          path: src
          key: probe-src-${{ env.PERL_VER }}-${{ env.PYTHON_VER }}-${{ env.GLIBC }}-v1

      - name: Fetch the packages that have never been built here
        run: |
          set -eu
          mkdir -p src && cd src
          get() {
            b=$(basename "$1")
            [ -s "$b" ] && { echo "  cached  $b"; return 0; }
            curl -fsSL --connect-timeout 20 --retry 2 -O "$1" \
              && echo "  fetched $b" || echo "  FAILED  $1"
          }
          GNU=https://ftpmirror.gnu.org
          get "https://www.cpan.org/src/5.0/perl-$PERL_VER.tar.xz"
          get "https://www.python.org/ftp/python/$PYTHON_VER/Python-$PYTHON_VER.tar.xz"
          get "$GNU/m4/m4-$M4_VER.tar.xz"
          get "$GNU/bison/bison-$BISON_VER.tar.xz"
          get "https://github.com/westes/flex/releases/download/v$FLEX_VER/flex-$FLEX_VER.tar.gz"
          get "https://github.com/gavinhoward/bc/releases/download/$BC_VER/bc-$BC_VER.tar.xz"
          get "$GNU/glibc/glibc-$GLIBC.tar.xz"

      - name: 'THE PROBE: run each configure with a PATH of traps'
        run: |
          set -u
          # THE TRAP DIRECTORY. Every candidate name becomes a script that
          # records the call and exits 127, which is what a shell reports for a
          # missing command. Anything busybox HAS is symlinked instead, so the
          # configure gets a working tool and only genuinely-absent ones are
          # recorded.
          #
          # THE COMPILER IS REAL. gcc stays on PATH: a configure that cannot
          # compile bails in the first ten lines and probes nothing, which
          # would produce a clean-looking result that means nothing.
          B=/bin/busybox
          T=/tmp/traps
          rm -rf "$T" && mkdir -p "$T"
          : > /tmp/missing.log

          for a in $($B --list); do
            case "$a" in busybox) continue ;; esac
            ln -sf "$B" "$T/$a"
          done

          # gawk IS NOT TRAPPED ANY MORE, AND THAT CHANGES THE RESULT.
          #
          # The first run trapped it and m4, bison and flex all came back rc=1.
          # That looked like three packages needing gawk. The dedicated step
          # below then showed busybox awk handles everything they use --
          # ENVIRON, -f, gsub, printf, match -- so the trap was making the box
          # STRICTER than the real one and the rc=1 said nothing.
          #
          # A probe that fails for a reason the real box does not have is worse
          # than no probe: it produces three findings that are all the same
          # false one. So gawk passes through to busybox awk, and if a package
          # genuinely cannot use it, THAT failure is real.
          #
          # msgfmt is likewise passed through as a no-op stub rather than
          # trapped: it is gettext, every real rung passes --disable-nls, and
          # trapping it only reproduces a configuration we never use.
          # A WRAPPER, NOT A SYMLINK, AND THE DIFFERENCE MATTERS.
          #
          # `ln -sf busybox gawk` does not give you awk. busybox dispatches on
          # argv[0], so a link named gawk makes it look for a gawk APPLET and
          # answer "gawk: applet not found" -- which reads exactly like the
          # missing tool the last run was trying to rule out. m4 then failed at
          # config.status, and bison at the POSIXLY_CORRECT probe, both for a
          # reason the real box does not have.
          #
          # `exec busybox awk "$@"` names the applet explicitly.
          # rm FIRST. `>` FOLLOWS A SYMLINK AND WRITES THROUGH IT.
          #
          # The loop above symlinks $T/awk -> the busybox binary. Redirecting
          # into $T/awk therefore did not replace the link -- it TRUNCATED
          # BUSYBOX ITSELF, and the next command died with
          #
          #     /tmp/traps/awk: Permission denied
          #
          # on a file that was now zero bytes. The message names the wrapper,
          # so it reads as a chmod problem; the chmod was right and the target
          # was the runner's busybox.
          #
          # This is the same shape as `patch -d` and the gawk symlink itself:
          # an operation that looks like it replaces a name and instead acts on
          # what the name points at.
          if $B --list | grep -qx awk; then
            for _w in gawk awk; do
              rm -f "$T/$_w"
              printf '#!/bin/sh\nexec %s awk "$@"\n' "$B" > "$T/$_w"
              chmod 0755 "$T/$_w"
            done
          fi
          rm -f "$T/msgfmt"
          printf '#!/bin/sh\nexit 0\n' > "$T/msgfmt"; chmod 0755 "$T/msgfmt"

          for a in mawk nawk comm join split csplit paste expand unexpand \
                   fold fmt nl pr tsort col perl python python3 bison yacc \
                   flex lex m4 bc pkg-config gettext autoconf automake \
                   libtool makeinfo texi2any pod2man help2man rsync diff patch; do
            $B --list | grep -qx "$a" && continue
            # printf, not a heredoc. A heredoc terminator has to sit at
            # column 0, which ends the YAML block scalar and breaks the file --
            # the first version of this job would not parse.
            rm -f "$T/$a"
            printf '#!/bin/sh\necho "$PKG NEEDS: %s $*" >> /tmp/missing.log\nexit 127\n' \
              "$a" > "$T/$a"
            chmod 0755 "$T/$a"
          done
          # The real compiler and the real shell, plus the traps.
          for a in gcc cc g++ cpp ld as ar ranlib nm strip objdump; do
            p=$(command -v "$a" 2>/dev/null) && ln -sf "$p" "$T/$a"
          done
          echo "  traps: $(find "$T" -type f | wc -l)   passthrough: $(find "$T" -type l | wc -l)"
          echo

          # ALL PACKAGES AT ONCE. Each configure is independent -- nothing is
          # installed and nothing is shared -- so they run in parallel and the
          # job takes as long as the slowest one rather than the sum. glibc and
          # Python are minutes on their own; serially this would be twenty.
          cd src
          for t in *.tar.*; do
            [ -f "$t" ] || continue
            d=$(echo "$t" | sed 's/\.tar\..*//')
            rm -rf "$d" && mkdir -p "$d"
            tar xf "$t" -C "$d" --strip-components=1 2>/dev/null || continue
            (
              cd "$d"
              export PKG="$d"
              export PATH="$T"
              # Each package logs to its own file, or parallel writes interleave
              # mid-line and the output becomes unreadable.
              L=/tmp/out-$d.log
              {
                echo "================================================================"
                echo "  $d"
                echo "================================================================"
              } > "$L"
              set +e
              if [ -x ./Configure ]; then
                # perl: not autoconf, and -des answers every prompt.
                timeout 420 ./Configure -des -Dprefix=/tmp/x-$d -Dcc=gcc > c.log 2>&1
              elif [ -x ./configure ]; then
                # --disable-nls, because every rung that builds these passes
                # it. Without it configure reaches for msgfmt and gettext and
                # reports a requirement we have arranged never to have.
                # OUT-OF-TREE, BECAUSE glibc REFUSES ANYTHING ELSE:
                #     configure: error: you must configure in a separate
                #     build directory
                # Every other package tolerates it, so all of them get the same
                # treatment rather than glibc getting a special case.
                mkdir -p _b && cd _b
                timeout 420 ../configure --prefix=/tmp/x-$d --disable-nls > c.log 2>&1
              else
                echo "    no configure script" >> "$L"; exit 0
              fi
              rc=$?
              set -e
              echo "    configure rc=$rc" >> "$L"
              # flex AND bison BOTH NEED flex, AND THAT IS AN ORDERING FACT.
              #     configure: error: cannot find output from flex; giving up
              # bison's scanner ships pre-generated, so bison builds without
              # flex -- but its CONFIGURE checks anyway and stops. flex needs
              # flex to regenerate its own scanner. So the real chain builds
              # flex first, and the probe cannot tell us more than that.
              if grep -q "cannot find output from flex" c.log 2>/dev/null; then
                echo "      ^ needs flex present; flex must be built before this" >> "$L"
              fi
              # THE rc IS THE USEFUL COLUMN AND IT NEEDS A REASON BESIDE IT.
              # rc=0 with traps caught means the tool was OPTIONAL -- Python
              # and perl both did that. rc!=0 means something actually stopped,
              # and the last thing configure printed says what.
              if [ "$rc" != 0 ]; then
                echo "    --- why ---" >> "$L"
                grep -aiE "error|fatal|cannot|not found|required" c.log \
                  | tail -6 | sed 's/^/      /' >> "$L"
              fi
              # What the configure ITSELF said it could not find, which catches
              # tools reached by a name the trap list does not have.
              grep -aiE "not found|no acceptable|missing|command not found|required" c.log \
                | grep -avE "checking|^ *$" | sort -u | head -12 | sed 's/^/      /' >> "$L"
            ) &
          done
          wait
          cat /tmp/out-*.log

          echo "================================================================"
          echo "  EVERY TOOL THE PROBE CAUGHT, BY PACKAGE"
          echo "================================================================"
          if [ -s /tmp/missing.log ]; then
            sort -u /tmp/missing.log | sed 's/^/  /'
            echo
            echo "  --- the set, deduplicated ---"
            awk '{print $3}' /tmp/missing.log | sort -u | tr '\n' ' '
            echo
          else
            echo "  nothing was trapped -- every tool these configures wanted"
            echo "  was present in busybox"
          fi

      # OPTION 1, MEASURED RATHER THAN ASSUMED. If the list above is long, the
      # answer is our own busybox with the missing applets turned on. That is
      # only a good answer if it actually builds and actually has them, so this
      # builds one and reports -- in the same run, while the list is on screen.
      #
      # IT ALSO CHANGES WHAT THE BOX IS. Right now the single host binary is
      # Ubuntu's busybox, and what it contains is whatever Ubuntu chose. One we
      # build is one we declare: the applet list becomes a pinned input like
      # every other, and "the box has no split" stops being a surprise.
      - name: 'OPTION 1: build our own static busybox with everything on'
        run: |
          set -eu
          BB=1.36.1
          cd src
          [ -s "busybox-$BB.tar.bz2" ] || \
            curl -fsSL --connect-timeout 20 --retry 2 \
              -O "https://busybox.net/downloads/busybox-$BB.tar.bz2"
          rm -rf bb && mkdir bb && tar xf "busybox-$BB.tar.bz2" -C bb --strip-components=1
          cd bb
          make defconfig > /dev/null 2>&1
          # STATIC, and the applets Ubuntu's build left out. allnoconfig would
          # be the wrong direction; defconfig plus these is the smallest change
          # that answers the question.
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          # THE ONES busybox 1.36.1 SIMPLY DOES NOT HAVE, measured rather than
          # assumed: csplit, fmt and pr are not applets at any config -- the
          # symbols do not exist, so setting them is a no-op that looks like a
          # decision. join DOES exist and was off in Ubuntu's build.
          #
          # If a package ever needs csplit, fmt or pr, the answer is a small C
          # program like split and comm, not a busybox flag.
          for sym in SPLIT COMM JOIN PASTE EXPAND UNEXPAND FOLD NL \
                     TSORT CMP DIFF PATCH AWK SED GREP SORT UNIQ TR CUT; do
            sed -i "s/^# CONFIG_$sym is not set/CONFIG_$sym=y/" .config
            grep -q "^CONFIG_$sym=y" .config || echo "CONFIG_$sym=y" >> .config
          done
          # TLS drags in code that wants glibc feature macros; a build box has
          # no use for HTTPS. Same substitution the reference job makes.
          #
          # AND tc, WHICH IS 2023 CODE MEETING 2026 KERNEL HEADERS:
          #
          #     networking/tc.c:236: 'TCA_CBQ_MAX' undeclared
          #     invalid application of sizeof to incomplete type 'struct tc_cbq_lssopt'
          #
          # CBQ traffic control was removed from the kernel and busybox 1.36.1
          # predates that. Nothing to do with our config -- defconfig turns tc
          # on and it cannot compile against these headers. A build sysroot has
          # no use for traffic shaping, so the applet goes rather than the
          # headers being patched around.
          #
          # THIS IS ALSO WHY WE BUILD OUR OWN. Ubuntu's busybox was compiled
          # against whatever headers they had; ours is compiled here, and the
          # applet list is a thing we declare rather than inherit.
          for sym in SSL_CLIENT FEATURE_WGET_OPENSSL TLS TC; do
            sed -i "s/^CONFIG_$sym=y/# CONFIG_$sym is not set/" .config
          done
          yes '' | make oldconfig > /dev/null 2>&1
          # VERIFY AFTER oldconfig, which re-derives symbols and has undone
          # exactly this kind of edit before.
          echo "  --- did the symbols survive oldconfig? ---"
          for sym in STATIC SPLIT COMM; do
            printf '    %-8s %s\n' "$sym" \
              "$(grep -q "^CONFIG_$sym=y" .config && echo on || echo OFF)"
          done
          if make -j"$(nproc)" > b.log 2>&1 && [ -x busybox ]; then
            echo "  built: $(wc -c < busybox) bytes"
            echo "  applets: $(./busybox --list | wc -l)  (Ubuntu's: $(/bin/busybox --list | wc -l))"
            echo "  static: $(file -b busybox | grep -o 'statically linked' || echo NO)"
            echo "  --- the ones Ubuntu's lacked ---"
            for a in split comm join paste expand unexpand fold nl tsort; do
              printf '    %-10s ours=%-3s ubuntu=%s\n' "$a" \
                "$(./busybox --list | grep -qx "$a" && echo yes || echo no)" \
                "$(/bin/busybox --list | grep -qx "$a" && echo yes || echo no)"
            done
            echo "  --- not applets at any config; a C program if ever needed ---"
            echo "    csplit fmt pr"
          else
            echo "  BUILD FAILED"
            echo "  --- distinct errors, by file ---"
            grep -oE '^[^ :]+\.(c|h):[0-9]+:[0-9]*:? *error:' b.log 2>/dev/null \
              | cut -d: -f1 | sort | uniq -c | sort -rn | head -8 | sed 's/^/    /'
            grep -nE "error:" b.log | head -10 | sed 's/^/    /'
            tail -15 b.log | sed 's/^/    /'
            # SAY WHAT THIS COSTS THE NEXT STEP, rather than letting it fail
            # with "cannot stat src/bb/busybox" -- which is what happened, and
            # it reads as a missing file rather than as a build that did not
            # finish.
            echo
            echo "  The HERMETIC step below needs this binary and will skip."
          fi

      # BUILD THE SYSROOT HERE, RATHER THAN WAITING FOR ONE.
      #
      # This step used to restore the reference job's cached sysroot and skip
      # if it was cold. It was ALWAYS cold: that cache is written after rung
      # 14, and the reference job has never got past rung 11.5 -- because of
      # the very questions this step exists to answer. A question that can only
      # be asked after the thing it answers is not a question.
      #
      # So the probe builds its own. spikes/stage4/bridge/rungs.sh with
      # STOP_AFTER=5 gives musl, make, binutils and the arithmetic libraries in
      # about a minute, using the same script the real chain uses rather than a
      # second copy that would drift from it.
      #
      # THE COMPILER IS A HOST-BUILT tcc, exactly as the reference arm's is.
      # This proves what a PACKAGE needs against a musl sysroot with no host
      # /usr; it proves nothing about the seed. Same distinction the reference
      # arm makes about itself.
      - name: 'AIRLOCK: a tcc to build the sysroot with'
        run: |
          set -eu
          . "$GITHUB_WORKSPACE/tools/clone-pinned.sh"
          clone_pinned tccsrc 5ec0e6f84b47ebd8c269b581712666313f5edaef \
            "https://github.com/TinyCC/tinycc.git https://repo.or.cz/tinycc.git"
          bash spikes/stage3/patches/tcc-arm64-asm/apply-series.sh tccsrc
          ( cd tccsrc && ./configure --cc=musl-gcc --prefix=/work/tccsrc \
              --extra-ldflags=-static > cfg.log 2>&1 \
            && make -j"$(nproc)" > b.log 2>&1 ) \
            || { echo "  tcc did not build"; tail -20 tccsrc/b.log; exit 1; }
          file -b tccsrc/tcc | grep -q "statically linked" \
            || { echo "  tcc is not static -- the box would need a loader"; exit 1; }
          echo "  tcc: $(wc -c < tccsrc/tcc) bytes, static"

      - name: 'Assemble the probe box'
        run: |
          set -eu
          PKG="${{ github.event.inputs.pkg }}"
          [ -n "$PKG" ] || PKG=perl
          echo "  package under test: $PKG"

          BOX="$PWD/pbox"
          rm -rf "$BOX"
          mkdir -p "$BOX"/bin "$BOX"/lib "$BOX"/work "$BOX"/tmp "$BOX"/out \
                   "$BOX"/src "$BOX"/in "$BOX"/proc "$BOX"/dev

          cp src/bb/busybox "$BOX/bin/busybox"
          for a in $("$BOX/bin/busybox" --list); do
            [ "$a" = busybox ] && continue
            ln -sf busybox "$BOX/bin/$a"
          done
          rm -f "$BOX/bin/gawk"
          printf '#!/bin/busybox sh\nexec /bin/busybox awk "$@"\n' > "$BOX/bin/gawk"
          chmod 0755 "$BOX/bin/gawk"

          cp -a tccsrc "$BOX/work/tccsrc"
          rm -f "$BOX/work/tccsrc/libtcc1.a"
          cp -L tccsrc/tcc "$BOX/work/ref-tcc"
          chmod 0755 "$BOX/work/ref-tcc"

          # THE BOTTOM RUNGS NEED THEIR OWN PINS, AND THIS STEP FETCHED NONE
          # OF THEM. src/ holds perl, python, m4, bison, flex, bc and glibc --
          # the packages under TEST. rungs.sh 0-5 wants musl, make 3.82,
          # binutils 2.30, make 4.4, gmp, mpfr and mpc, and would have reported
          # "no tarball matching /in/musl-" on a run that otherwise looked
          # correctly assembled.
          #
          # Same versions as the reference job, because the sysroot this builds
          # is meant to be the one that job produces -- a different musl here
          # would make every answer conditional on which musl.
          mkdir -p pins && cd pins
          GNU=https://ftpmirror.gnu.org
          for u in "https://musl.libc.org/releases/musl-1.2.5.tar.gz" \
                   "$GNU/make/make-3.82.tar.gz" \
                   "$GNU/make/make-4.4.tar.gz" \
                   "$GNU/binutils/binutils-2.30.tar.xz" \
                   "$GNU/gmp/gmp-6.3.0.tar.xz" \
                   "$GNU/mpfr/mpfr-4.2.2.tar.xz" \
                   "$GNU/mpc/mpc-1.3.1.tar.gz"; do
            b=$(basename "$u")
            [ -s "$b" ] && { echo "  cached  $b"; continue; }
            curl -fsSL --connect-timeout 20 --retry 2 -O "$u" \
              && echo "  fetched $b" || echo "  FAILED  $u"
          done
          cd ..
          cp dl/*.tar.* pins/ 2>/dev/null || true
          cp src/*.tar.* pins/ 2>/dev/null || true

          # GNU RELEASE TARBALLS ARE V7 AND busybox tar REFUSES THEM -- the
          # reference job repacks in its airlock for exactly this, and a probe
          # that skipped it would fail at rung 3.5 for a reason that has
          # nothing to do with the package under test.
          # DECOMPRESS TO A FILE, THEN READ IT. Piping the whole tarball into
          # `dd count=5` makes the decompressor die on a broken pipe as soon as
          # dd has its five bytes:
          #
          #     gzip: stdout: Broken pipe
          #     warning: command substitution: ignored null byte in input
          #
          # and under `set -eu` inside $( ) the value comes back EMPTY. Empty
          # is not "ustar", so the check said V7 for every archive and the run
          # repacked bison and mpfr -- xz tarballs that were already ustar and
          # that the reference job correctly leaves alone.
          #
          # A magic check that answers "not ustar" for everything looks exactly
          # like one that works, because repacking an already-ustar archive
          # produces an ustar archive. It cost nothing here except time; the
          # same shape in a check that GATES something would be silent.
          ( cd pins
            for f in *.tar.gz *.tar.xz *.tar.bz2; do
              [ -f "$f" ] || continue
              case "$f" in
                *.gz)  gzip  -dc "$f" > /tmp/hdr.tar 2>/dev/null ;;
                *.xz)  xz    -dc "$f" > /tmp/hdr.tar 2>/dev/null ;;
                *.bz2) bzip2 -dc "$f" > /tmp/hdr.tar 2>/dev/null ;;
              esac
              m=$(dd if=/tmp/hdr.tar bs=1 skip=257 count=5 2>/dev/null)
              rm -f /tmp/hdr.tar
              if [ "$m" = ustar ]; then
                echo "  already ustar: $f"
                continue
              fi
              stem=${f%%.tar.*}
              d=$(mktemp -d); tar xf "$f" -C "$d"
              ( cd "$d" && tar czf "$OLDPWD/$stem.repack.tar.gz" --format=ustar ./* )
              rm -rf "$d" "$f"; mv "$stem.repack.tar.gz" "$stem.tar.gz"
              echo "  repacked V7 -> ustar: $f"
            done )

          echo "  --- the box ---"
          echo "    applets    : $(find "$BOX/bin" -type l | wc -l)"
          echo "    /usr       : $( [ -d "$BOX/usr" ] && echo present || echo ABSENT )"
          echo "    real files : $(find "$BOX/bin" -type f -printf '%f ')"


      # A SEPARATE STEP TO ENTER IT, WHICH IS THE ONE STRUCTURAL DIFFERENCE
      # FROM THE REFERENCE JOB THAT WAS LEFT.
      #
      # That job assembles the box in one step and runs bwrap in the next; this
      # did both in one. bwrap's first failure here was
      #     bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      # which the reference job never sees with the identical flag. Whether the
      # step boundary is what matters is not established -- but it is the only
      # remaining difference, and matching it costs nothing.
      - name: 'HERMETIC: build the sysroot, then the package, with no host /usr'
        run: |
          set -eu
          PKG="${{ github.event.inputs.pkg }}"
          [ -n "$PKG" ] || PKG=perl
          BOX="$PWD/pbox"
          # --unshare-all, EXACTLY AS THE REFERENCE JOB DOES IT.
          #
          # Three attempts at being clever here, three different failures:
          #
          #   --unshare-all                  loopback: Failed RTM_NEWADDR
          #   individual, incl --unshare-net loopback: Failed RTM_NEWADDR
          #   individual, no --unshare-net   setting up uid map: Permission denied
          #
          # The last one is the tell. --unshare-user ALONE cannot write the uid
          # map on this runner; --unshare-all can, because bwrap takes a
          # different path when it owns every namespace. So the flags were never
          # the problem -- decomposing them was.
          #
          # The reference job has run --unshare-all on this image dozens of
          # times without complaint. The remaining difference is that it binds
          # a box assembled in an earlier STEP, while this one assembles and
          # enters in the same step; if that matters it will show as the
          # loopback error again, and then the answer is to split the step
          # rather than to weaken the sandbox.
          #
          # NO MORE VARIANTS. Copy what works.
          set +e
          bwrap \
            --unshare-all \
            --die-with-parent \
            --setenv PATH /bin --setenv HOME /work --setenv LC_ALL POSIX \
            --setenv TERM dumb --setenv SOURCE_DATE_EPOCH 0 \
            --setenv LD_LIBRARY_PATH /lib \
            --setenv CC_BIN /work/ref-tcc --setenv TCCDIR /work/tccsrc \
            --setenv ARM "probe-$PKG" --setenv STOP_AFTER 5 \
            --setenv MAKE_VER 3.82 --setenv MAKE_ALT 4.4 \
            --setenv MUSL_VER 1.2.5 --setenv BINUTILS 2.30 \
            --setenv GMP_VER 6.3.0 --setenv MPFR_VER 4.2.2 --setenv MPC_VER 1.3.1 \
            --bind "$BOX" / \
            --ro-bind "$PWD/spikes" /src --ro-bind "$PWD/pins" /in \
            --bind "$BOX/out" /out \
            --proc /proc --dev /dev --tmpfs /tmp --chdir /work \
            /bin/sh /src/stage4/bridge/rungs.sh
          echo "  sysroot rc=$?"
          set -e
          # DID ANYTHING REACH THE NETWORK? The box shares the runner's stack
          # (see above), so this is the check that replaces the namespace.
          # A rung that silently downloaded something would otherwise look
          # exactly like one that did not.
          if [ -d "$BOX/work/src" ]; then
            _n=$(find "$BOX/work" -newer "$BOX/bin/busybox" -name '*.tar.*' 2>/dev/null | wc -l)
            [ "$_n" = 0 ] && echo "  no tarballs appeared during the build" \
                          || echo "  $_n NEW tarball(s) in the box -- something fetched"
          fi

          d=$(ls -d src/$PKG* 2>/dev/null | grep -v tar | head -1)
          [ -n "$d" ] || { echo "  no unpacked $PKG in src/"; exit 0; }
          rm -rf "$BOX/work/pkg" && cp -a "$d" "$BOX/work/pkg"
          ( cd "$BOX/work/pkg" && rm -rf UU _b config.log config.status Makefile 2>/dev/null || true )

          cat > "$BOX/work/pkg.sh" <<'INBOX'
          #!/bin/sh
          set -u
          # PKG COMES IN VIA --setenv. bwrap gives the box its own environment,
          # so a variable set in the workflow step is NOT visible here -- the
          # case below reads it and died with "PKG: parameter not set" under
          # set -u. Same class as MAKE_ALT one step earlier: anything the
          # in-box script reads has to be passed explicitly.
          export PATH=/work/prefix/bin:/bin
          cd /work/pkg
          # THE COMPILER IS tcc, AND THE PROBE STOPS AT RUNG 5 ON PURPOSE.
          #
          # This is not a small reference job. It exists to answer one question
          # about one component with the LEAST box that can ask it -- musl,
          # make, binutils, in about a minute. Building nine rungs first so the
          # package could be compiled by gcc 10 would make it a slow duplicate
          # of the reference job and answer nothing the reference job does not.
          #
          # WHAT THAT MEANS FOR THE ANSWER. A failure here is "this package
          # against a musl sysroot and tcc", which is exactly right for
          # questions about MISSING TOOLS AND LIBRARIES -- what does configure
          # reach for, what does it silently disable, what is absent from the
          # box. Those do not depend on which compiler is used.
          #
          # IT IS THE WRONG TOOL FOR A CODEGEN QUESTION. perl failed here at
          # dquote.c:61 with "'{' expected", which is tcc parsing C99 it does
          # not handle -- and the reference job builds perl with gcc 10 at rung
          # 11.5 without trouble. That is a real tcc finding and a useless perl
          # finding. Read failures with that in mind: a PARSE error is probably
          # the compiler, a MISSING HEADER OR LIBRARY is the box.
          CC=/work/prefix/bin/cc-static
          [ -x "$CC" ] || CC=/work/ref-tcc
          echo "  cc: $CC  (tcc -- see the note above before blaming the package)"
          echo "  --- libraries this box does NOT have ---"
          for l in libz libffi libssl libcrypto libncurses libreadline libexpat libgdbm; do
            ls /usr/lib/$l* >/dev/null 2>&1 || printf '    %s\n' "$l"
          done
          echo
          if [ -x ./Configure ]; then
            # A `gcc` ON PATH, BECAUSE perl's Configure WRITES SCRIPTS THAT
            # CALL IT BY NAME.
            #
            #     ./Configure: ./UU/checkcc: line 10: gcc: not found
            #
            # -Dcc sets the compiler for the probes Configure runs directly,
            # but checkcc and several of its siblings are generated shell that
            # spell `gcc` literally. There is no -D for that. A symlink is the
            # smallest honest answer: it points at the SAME compiler -Dcc
            # names, so nothing is being substituted -- only reached under a
            # second name.
            ln -sf "$CC" /work/prefix/bin/gcc 2>/dev/null || true
            # -Dusedl=undef, matching rung 11.5: this box is static
            # throughout and cannot load a .so, so extensions link into the
            # interpreter instead of becoming lib/auto/*/*.so.
            ./Configure -des -Dprefix=/work/out/pkg -Dcc="$CC" \
              -Dusedl=undef -Dldflags=-static > c.log 2>&1
          else
            # PYTHON NEEDS MORE THAN A COMPILER, AND THE POINT IS TO SEE
            # WHICH PARTS IT SILENTLY DROPS.
            #
            # It configures happily without zlib, libffi and openssl and
            # builds an interpreter missing zlib, ctypes and ssl -- no error,
            # no warning that survives to the end. glibc only needs the
            # interpreter, so that may be fine; but "fine" should be measured
            # rather than assumed, which is what the module check below does.
            #
            # --without-ensurepip and --disable-test-modules cut the parts
            # that need network access or a working ssl, neither of which
            # exists in a sealed box.
            case "$PKG" in
              Python*|python*)
                # --with-build-python IS NOT A YES/NO FLAG:
                #     configure: error: invalid --with-build-python option:
                #     expected path or "yes", not "no"
                # It names a python to run during a CROSS build. This is a
                # native build, so it does not apply at all and passing it was
                # my mistake rather than a requirement.
                #
                # --without-ensurepip and --disable-test-modules DO apply:
                # ensurepip wants the network, and the test modules want an
                # ssl this box does not have.
                # ax_cv_c_float_words_bigendian, PRESET BECAUSE THE PROBE
                # CANNOT RUN HERE.
                #
                #     configure: error: Unknown float word ordering. You need
                #     to manually preset ax_cv_c_float_words_bigendian=no
                #
                # That autoconf macro compiles a file containing a magic
                # string and greps the OBJECT for it to see which order the
                # words came out. tcc lays the constant out differently enough
                # that the grep finds nothing, so the macro cannot decide --
                # and it says so, with the answer.
                #
                # aarch64 is little-endian and so is its float word order, so
                # =no is not a guess. The reference job never needs this
                # because rung 11.7 builds python with gcc 10, whose output
                # the macro recognises.
                #
                # THIS IS THE PROBE'S SCOPE WORKING AS INTENDED: a compiler
                # difference, surfaced in a minute, that tells us nothing bad
                # about python and would have told us nothing at all if we had
                # built nine rungs of gcc first.
                # Setup.local + --disable-shared, matching rung 11.7: this box
                # has no loader, so extension modules link INTO the interpreter
                # rather than becoming .so files that install would then fail
                # to find.
                printf '*static*\n' > Modules/Setup.local
                ax_cv_c_float_words_bigendian=no \
                ./configure --prefix=/work/out/pkg CC="$CC" \
                  --without-ensurepip --disable-test-modules \
                  --disable-shared > c.log 2>&1 ;;
              *)
                ./configure --prefix=/work/out/pkg --disable-nls CC="$CC" > c.log 2>&1 ;;
            esac
          fi
          rc=$?
          echo "  configure rc=$rc"
          if [ "$rc" != 0 ]; then
            grep -aiE "not found|no acceptable|my life depends|cannot find|error" c.log \
              | sort -u | head -15 | sed 's/^/    /'
            exit 1
          fi
          # WHAT configure DECIDED, IN ITS OWN WORDS. Python prints a
          # "necessary bits not found" summary near the end; everything else
          # it drops silently. Both are worth having, because the second is
          # what turns into a missing module later.
          grep -aiE "could not be found|necessary bits|not be built|skipping" c.log \
            2>/dev/null | sort -u | head -10 | sed 's/^/    /'
          # A HARD COMPILER REQUIREMENT LOOKS LIKE THIS, AND IT IS NOT A
          # LIBRARY PROBLEM:
          #
          #     Include/cpython/pyatomic.h:588: error: #error "no available
          #     pyatomic implementation for this platform/compiler"
          #
          # Python 3.14 needs C11 atomics -- GCC/Clang __atomic builtins or
          # <stdatomic.h> -- and tcc has neither on aarch64. There is no
          # configure flag for it and no library to add: the interpreter
          # cannot be built by this compiler at all.
          #
          # THAT IS A FINDING ABOUT tcc, NOT ABOUT THE BOX. The reference job
          # builds python with gcc 10 at rung 11.7 and has no such problem, so
          # nothing here needs adding to the ladder. What the probe was asked
          # -- which LIBRARIES python wants -- was already answered above:
          # configure rc=0 with libz, libffi, libssl and libcrypto all absent.
          if grep -aq "no available pyatomic implementation" b.log 2>/dev/null; then
            echo "  --- this is a COMPILER limit, not a missing library ---"
            echo "    Python 3.14 requires C11 atomics; tcc provides none on"
            echo "    aarch64. No flag or library fixes it. The ladder builds"
            echo "    python with gcc 10, where the question does not arise."
            echo "    The library answer -- configure rc=0 without libz, libffi,"
            echo "    libssl, libcrypto -- is above and is the one that matters."
          fi
          echo "  --- disabled for want of a library ---"
          grep -aiE "not found|will not be built|disabl" c.log \
            | grep -aviE "checking" | sort -u | head -12 | sed 's/^/    /'
          echo
          make -j"$(nproc 2>/dev/null || echo 2)" > b.log 2>&1
          rc=$?
          echo "  make rc=$rc"
          if [ "$rc" != 0 ]; then
            # ld's own message lives on the line ABOVE collect2; a grep for
            # "error:" alone drops it.
            grep -B3 -a "collect2: error" b.log 2>/dev/null | grep -avE "^--|collect2" \
              | tail -6 | sed 's/^/    /'
            grep -aE "error:|Error [0-9]" b.log | head -10 | sed 's/^/    /'
          fi
          tail -8 b.log | sed 's/^/    /'

          # ASK THE INTERPRETER WHAT IT ACTUALLY HAS.
          #
          # A Python that builds is not the same as a Python that works. The
          # modules below are the ones a missing library removes silently:
          #
          #   zlib      -> no .zip, no gzip, no wheel
          #   ssl       -> no https, so no pip and no downloads
          #   ctypes    -> needs libffi; a lot of packages assume it
          #   sqlite3   -> needs libsqlite3
          #   readline  -> interactive only, harmless here
          #
          # glibc's configure runs scripts/gen-tunable-list.py, which is plain
          # Python and needs none of them -- so a stripped interpreter is very
          # likely enough for OUR purposes. Printing the list means we know
          # that rather than hope it.
          for _py in /work/out/pkg/bin/python3 ./python; do
            [ -x "$_py" ] || continue
            echo "  --- what this python has ---"
            "$_py" -c 'import sys;print("    version:", sys.version.split()[0])' 2>&1
            # ONE LINE, NOT A HEREDOC. A heredoc terminator has to sit at
            # column 0, which ends the YAML block scalar -- this file has
            # failed to parse that way six times now. -c with semicolons is
            # uglier and cannot break the file.
            "$_py" -c 'import importlib.util as u; w=("zlib","ssl","ctypes","sqlite3","readline","bz2","lzma","hashlib","socket","select","math","json","re"); h=[m for m in w if u.find_spec(m)]; k=[m for m in w if not u.find_spec(m)]; print("    present:"," ".join(h) or "(none)"); print("    MISSING:"," ".join(k) or "(none)")' 2>&1
            # AND THE ONE THING glibc ACTUALLY ASKS OF IT.
            echo "    can it run a glibc-style script:"
            "$_py" -c 'import re,json,sys;print("      yes --", len(json.dumps({"a":1})), "bytes")' 2>&1
            break
          done
          INBOX
          sed -i 's/^          //' "$BOX/work/pkg.sh"
          chmod 0755 "$BOX/work/pkg.sh"

          echo
          echo "  === THE PACKAGE, IN THE BOX ==="
          set +e
          bwrap \
            --unshare-all \
            --die-with-parent \
            --setenv PATH /work/prefix/bin:/bin --setenv HOME /work --setenv LC_ALL POSIX \
            --setenv TERM dumb --setenv SOURCE_DATE_EPOCH 0 \
            --setenv PKG "$PKG" \
            --bind "$BOX" / \
            --ro-bind "$PWD/spikes" /src --ro-bind "$PWD/pins" /in \
            --proc /proc --dev /dev --tmpfs /tmp --chdir /work \
            /bin/sh /work/pkg.sh
          echo "  package rc=$?"
          set -e

      # WHAT DOES glibc ACTUALLY ASK OF python? GREP IT, DO NOT GUESS.
      #
      # Rung 11.7 builds a python missing zlib, ssl, ctypes and libffi, and
      # "is that enough for glibc" has now been answered by reasoning three
      # times -- mine, and it has been the same reasoning each time. The source
      # is downloaded a few steps above and this takes seconds.
      #
      # IT DOES NOT NEED THE SANDBOX. That is why it lives here rather than in
      # the hermetic step below: reading a source tree is not a build, and
      # making it wait on a sealed box that has never completed would be the
      # same mistake as putting it at rung 13, forty minutes into a ladder,
      # AFTER python is already built.
      - name: 'WHAT glibc ASKS OF python: read the source, not the tea leaves'
        run: |
          set -u
          set +e
          d=$(ls -d src/glibc-* 2>/dev/null | grep -v tar | head -1)
          [ -n "$d" ] || { echo "  no unpacked glibc in src/"; exit 0; }
          echo "  reading $d"
          echo

          # 1. WHICH SCRIPTS THE BUILD RUNS. Makefiles invoke them as
          #    $(PYTHON) something.py; maintainer scripts that are never run by
          #    a build do not appear this way, which is the point.
          echo "  --- python scripts the makefiles invoke ---"
          grep -rhoE '\$\(PYTHON[^)]*\)[^;|]*\.py|python3? [^;|]*\.py' \
            "$d"/Makefile* "$d"/*/Makefile* "$d"/*/*/Makefile* 2>/dev/null \
            | grep -oE '[A-Za-z0-9_/.-]+\.py' | sort -u > /tmp/pyscripts.txt
          if [ -s /tmp/pyscripts.txt ]; then
            sed 's/^/    /' /tmp/pyscripts.txt
          else
            echo "    none found -- either the build runs no python, or the"
            echo "    makefiles spell it differently. Checking scripts/ anyway."
            ls "$d"/scripts/*.py 2>/dev/null | xargs -n1 basename 2>/dev/null \
              | sed 's/^/    (in scripts\/) /' | head -20
          fi
          echo

          # 2. WHAT THEY IMPORT. Only the scripts the build actually runs, or
          #    every one in scripts/ if the makefile grep found nothing -- the
          #    second is the pessimistic answer and that is the right default.
          echo "  --- modules those scripts import ---"
          : > /tmp/pymods.txt
          if [ -s /tmp/pyscripts.txt ]; then
            _list=$(cat /tmp/pyscripts.txt)
          else
            _list=$(ls "$d"/scripts/*.py 2>/dev/null)
          fi
          for _s in $_list; do
            _f="$d/$_s"
            [ -f "$_f" ] || _f="$_s"
            [ -f "$_f" ] || _f=$(find "$d" -name "$(basename "$_s")" 2>/dev/null | head -1)
            [ -f "$_f" ] || continue
            grep -hoE '^[[:space:]]*(import|from)[[:space:]]+[A-Za-z0-9_.]+' "$_f" 2>/dev/null \
              | awk '{print $2}' | cut -d. -f1
          done | sort -u > /tmp/pymods.txt
          sed 's/^/    /' /tmp/pymods.txt
          echo

          # 3. CAN A STRIPPED PYTHON IMPORT THEM? The runner's python is not
          #    the one we build, but it can answer which of these are STDLIB
          #    PURE -- present in any interpreter -- versus extension modules
          #    that need a library we do not have.
          echo "  --- which of those need a C extension, and which do not ---"
          for _m in $(cat /tmp/pymods.txt); do
            case "$_m" in
              __future__|abc|argparse|ast|collections|copy|csv|difflib|enum|\
              functools|glob|io|itertools|json|keyword|linecache|os|pprint|re|\
              shlex|shutil|string|subprocess|sys|textwrap|tempfile|traceback|\
              types|typing|warnings)
                printf '    %-18s pure python -- always present\n' "$_m" ;;
              zlib|ssl|ctypes|_ctypes|sqlite3|bz2|lzma|readline|curses|hashlib)
                printf '    %-18s NEEDS A LIBRARY -- this box has none of them\n' "$_m" ;;
              *)
                # IS IT ONE OF glibc's OWN MODULES? The first run flagged
                # glibcelf, glibcpp, glibcextract, abnf, unicode_utils and
                # Unicode as "extension module -- CHECK THIS ONE", and every
                # one of them is a .py file in glibc's own tree. A module the
                # runner's python does not have is not necessarily an
                # extension; it may simply not be python's at all.
                if find "$d" -name "$_m.py" 2>/dev/null | grep -q .; then
                  printf '    %-18s glibc ships this itself\n' "$_m"
                elif python3 -c "import sys,importlib.util as u; s=u.find_spec('$_m'); sys.exit(0 if s and not (s.origin or '').endswith('.so') else 1)" 2>/dev/null; then
                  printf '    %-18s pure python or built in\n' "$_m"
                else
                  printf '    %-18s NOT FOUND -- neither stdlib nor glibc's\n' "$_m"
                fi ;;
            esac
          done
          echo
          # A .py FILE CAN STILL NEED A C EXTENSION, AND THAT IS WHAT THE
          # FIRST VERSION OF THIS AUDIT MISSED.
          #
          # It reported `subprocess` as "pure python -- always present", which
          # is true of the FILE and false of what it needs: subprocess.py does
          # `from _posixsubprocess import fork_exec`, and glibc's build died on
          # exactly that in a statically linked python.
          #
          # One level down, for the stdlib wrappers where this class lives.
          echo "  --- C extensions those modules pull in (one level down) ---"
          for _m in $(cat /tmp/pymods.txt); do
            case "$_m" in
              subprocess) echo "    subprocess     needs _posixsubprocess" ;;
              os)         echo "    os             needs posix (built in)" ;;
              random)     echo "    random         needs _random, _sha2" ;;
              hashlib)    echo "    hashlib        needs _hashlib or _sha2" ;;
              json)       echo "    json           needs _json (optional)" ;;
              struct)     echo "    struct         needs _struct" ;;
              time)       echo "    time           IS an extension" ;;
              collections) echo "    collections    needs _collections" ;;
            esac
          done
          echo "    (a python built without these cannot import the module above)"
          echo

          echo "  THE VERDICT LINE:"
          if grep -qxE 'zlib|ssl|ctypes|_ctypes|sqlite3|bz2|lzma' /tmp/pymods.txt; then
            echo "    glibc's build imports a module that needs a library this"
            echo "    box does not build. That library becomes a rung BEFORE"
            echo "    python, and the line above names it."
          else
            echo "    Nothing glibc's build imports needs zlib, ssl, ctypes or"
            echo "    any other absent library. A stripped python is enough,"
            echo "    and rung 11.7 does not need more than it already builds."
          fi

      # DOES THE Setup.local TRANSFORM ACTUALLY MAKE MODULES BUILT-IN?
      #
      # Rung 11.7 rewrites *shared* to *static* in Modules/Setup.local so that
      # _posixsubprocess and its siblings are linked into the interpreter
      # rather than dlopen'd -- a static python cannot dlopen anything, and
      # glibc's scripts/glibcextract.py imports subprocess, which needs it.
      #
      # THIS TESTS THE TECHNIQUE, NOT THE BOX, and that is a different kind of
      # question from the rest of this job. It runs on the bare runner with the
      # host gcc on purpose:
      #
      #   - the probe's box has only tcc, and tcc cannot build python 3.14 at
      #     all (pyatomic.h: no C11 atomics on aarch64 -- measured earlier)
      #   - "does makesetup honour Setup.local" does not depend on which
      #     compiler or libc is present
      #
      # AND IT DOES NOT COMPILE PYTHON. makesetup generates Modules/config.c,
      # the table of built-in module init functions. If _posixsubprocess is in
      # that table it will be linked in. Checking the table is seconds;
      # building the interpreter to find out is ten minutes and answers the
      # same question.
      - name: 'THE STATIC-MODULE TEST: does Setup.local put _posixsubprocess in?'
        run: |
          set -u
          set +e
          d=$(ls -d src/Python-* 2>/dev/null | grep -v tar | head -1)
          [ -n "$d" ] || { echo "  no unpacked Python in src/"; exit 0; }
          cd "$d"

          echo "  --- configure (host gcc, no box -- see above) ---"
          ./configure --prefix=/tmp/pyx --without-ensurepip \
            --disable-test-modules --disable-shared > /tmp/pc.log 2>&1
          echo "    rc=$?"
          [ -f Modules/Setup.stdlib ] || {
            echo "    no Modules/Setup.stdlib -- this CPython predates the"
            echo "    sectioned file and the transform does not apply."; exit 0; }

          echo
          echo "  --- what configure decided, BEFORE the transform ---"
          for _sec in static shared disabled; do
            printf '    %-9s %s\n' "$_sec" \
              "$(awk -v s="\\*$_sec\\*" '$0~s{m=1;next} /^\*/{m=0} m&&/^[a-zA-Z_]/{n++} END{print n+0}' Modules/Setup.stdlib) modules"
          done
          printf '    _posixsubprocess is currently: %s\n' \
            "$(awk '/^\*/{sec=$0} /^_posixsubprocess/{print sec; exit}' Modules/Setup.stdlib)"

          echo
          echo "  --- apply the transform rung 11.7 uses ---"
          # SAME TRANSFORM AS RUNG 11.7, INCLUDING THE _hacl EXCLUSION.
          # Forcing every module static failed to link: _blake2, _sha3 and
          # friends share sources under Modules/_hacl that CPython's Makefile
          # already compiles, so each object arrived on the link line twice.
          awk '
            /^\*shared\*/  { mode="shared"; print "*static*"; next }
            /^\*static\*/  { mode="static"; print; next }
            /^\*disabled\*/{ mode="disabled"; print; next }
            /_hacl\// { print "*shared*"; print
                        if (mode == "disabled") print "*disabled*"
                        else                    print "*static*"; next }
            { print }
          ' Modules/Setup.stdlib > Modules/Setup.local
          for _sec in static disabled; do
            printf '    %-9s %s\n' "$_sec" \
              "$(awk -v s="\\*$_sec\\*" '$0~s{m=1;next} /^\*/{m=0} m&&/^[a-zA-Z_]/{n++} END{print n+0}' Modules/Setup.local) modules"
          done
          echo "    still disabled: $(awk '/^\*disabled\*/{m=1;next} /^\*/{m=0} m&&/^[a-zA-Z_]/{printf "%s ",$1}' Modules/Setup.local)"

          echo
          echo "  --- the only test that matters: is it in Modules/config.c? ---"
          # makesetup writes config.c, the table of built-in module init
          # functions. Nothing needs compiling to read it.
          rm -f Modules/config.c
          make Modules/config.c > /tmp/ms.log 2>&1
          if [ ! -f Modules/config.c ]; then
            echo "    makesetup did not run:"
            tail -8 /tmp/ms.log | sed 's/^/      /'
            exit 0
          fi
          echo "    built-in modules in the table: $(grep -c 'extern PyObject\* PyInit_' Modules/config.c)"
          for _m in _posixsubprocess _struct select array math time \
                    _random binascii _socket unicodedata; do
            if grep -q "PyInit_$_m\b" Modules/config.c; then
              printf '      %-18s BUILT IN\n' "$_m"
            else
              printf '      %-18s not in the table\n' "$_m"
            fi
          done
          echo
          # AND DOES IT LINK? config.c says the module will be built in;
          # it does not say the link succeeds. The last failure was a DUPLICATE
          # SYMBOL at link time, which no amount of reading config.c would have
          # caught. Building the freeze tool is the smallest thing that links
          # the static module set.
          echo
          echo "  --- does the static module set actually link? ---"
          if make Programs/_freeze_module > /tmp/fz.log 2>&1; then
            echo "    _freeze_module linked -- no duplicate symbols"
          else
            echo "    LINK FAILED:"
            grep -aE "multiple definition|undefined reference|collect2" /tmp/fz.log \
              | head -8 | sed 's/^/      /'
          fi
          echo
          if grep -q 'PyInit__posixsubprocess\b' Modules/config.c; then
            echo "    VERDICT: the transform works. A python built this way has"
            echo "    _posixsubprocess linked in, so import subprocess -- and"
            echo "    therefore glibc's scripts/glibcextract.py -- will work."
          else
            echo "    VERDICT: _posixsubprocess is NOT in the table. Rung 11.7"
            echo "    will fail the same way again, and the Setup.local"
            echo "    mechanism is not doing what it is supposed to."
          fi

      - name: 'THE GAWK QUESTION: can busybox awk do what m4 and bison need?'
        run: |
          set -u
          BB=/bin/busybox
          [ -x src/bb/busybox ] && BB=src/bb/busybox
          echo "  testing: $BB"
          echo
          echo "  --- 1. ENVIRON, which m4 and bison both probe ---"
          out=$(POSIXLY_CORRECT=1 $BB awk 'BEGIN { if ("POSIXLY_CORRECT" in ENVIRON) print "x" }' 2>&1)
          if [ "$out" = x ]; then
            echo "    ENVIRON works -- prints x as gawk does"
          else
            echo "    ENVIRON FAILED: [$out]"
            echo "    m4 and bison configure will not get the answer they expect."
          fi
          echo
          echo "  --- 2. -f scriptfile, autoconf's config.status engine ---"
          printf 'BEGIN { print "from a script file" }\n' > /tmp/t.awk
          out=$($BB awk -f /tmp/t.awk </dev/null 2>&1)
          [ "$out" = "from a script file" ] \
            && echo "    -f works" || echo "    -f FAILED: [$out]"
          echo
          echo "  --- 3. the substitution shapes autoconf actually emits ---"
          printf 'a\nb\n' > /tmp/t.txt
          out=$($BB awk '{ gsub(/a/, "z"); print }' /tmp/t.txt 2>&1 | tr '\n' ' ')
          echo "    gsub:      [$out] (expect: z b)"
          out=$($BB awk 'BEGIN { printf "%s-%d\n", "n", 42 }' 2>&1)
          echo "    printf:    [$out] (expect: n-42)"
          out=$($BB awk 'BEGIN { s="x"; while (match(s, /x/)) { s=""; print "matched" } }' 2>&1)
          echo "    match:     [$out] (expect: matched)"
          echo
          echo "  If ENVIRON works, gawk is a false positive like perl and"
          echo "  python3 -- the probe caught a check, not a requirement."
          echo "  If it does not, gawk is a rung, immediately before m4, and it"
          echo "  is not a thirty-line filter the way split and comm were."

      - name: Verdict
        if: always()
        run: |
          echo "  Two ways to act on the list above:"
          echo
          echo "  1. BUILD OUR OWN busybox, statically, with the applets this"
          echo "     one lacks turned on. One package, one config, and the box"
          echo "     stops depending on how Ubuntu happened to compile theirs."
          echo "     That is also the honest end state: the box's single host"
          echo "     binary would then be one WE built."
          echo
          echo "  2. WRITE THE MISSING FILTERS, as rung 11.5 does for split and"
          echo "     comm -- thirty lines each, auditable, compiled by the"
          echo "     chain's own gcc. Cheaper per tool, worse if the list is long."
          echo
          echo "  THE FIRST RUN's LIST, SORTED:"
          echo "    comm split      real -- perl only, rung 11.5 builds both"
          echo "    perl python3    each package looking for a previous ITSELF"
          echo "    flex            regenerating a scanner the tarball ships"
          echo "    msgfmt          gettext; --disable-nls removes it"
          echo "    pkg-config      optional for bc, real for Python + openssl"
          echo "    gawk            THE ONE THAT MATTERS -- see the step above"
          echo
          echo "  So the answer to \"two tools or ten\" was: one, and it is gawk."
          echo
          echo "  AND THE TWO HALVES ANSWER DIFFERENT QUESTIONS:"
          echo "    the probe   -- what does configure ASK for   (minutes, dirty)"
          echo "    the box     -- does it actually BUILD        (sealed, one package)"
          echo
          echo "  A clean probe and a failed box is the interesting case: the"
          echo "  tools were all present and something else -- ash instead of"
          echo "  bash, a missing header, a shell builtin that is not -- is what"
          echo "  stopped it. That is the class the reference job keeps hitting"
          echo "  ninety minutes in, and it costs two minutes here."
