name: stage3-hermetic-arm64

# SPIKE. THE LADDER, NATIVE AARCH64, IN A SEALED BOX.
#
# What every existing ladder workflow does today, and why this one exists:
# all 22 of them run on ubuntu-latest (x86_64) and execute every rung under
# qemu-aarch64 user-mode emulation, with the seed cross-assembled by
# aarch64-linux-gnu-as. So the floor of the ladder carries TWO borrowed host
# tools, not the one TRUST-BOUNDARY.md names: the assembler AND the emulator.
# This job removes the emulator by running on real arm64 hardware, and puts a
# hard, enumerated, enforced boundary around what is left.
#
# THE HOST BUDGET, in two tiers. The distinction is selfhost-demo's own rule
# about oracles -- a host tool is legitimate exactly when it never appears on
# the build path -- applied to the sandbox instead of to the comparison.
#
#   TIER 1, ON THE BUILD PATH (its output becomes our artifact bytes):
#       as, ld          <- assemble and link the stage-0 seed. Nothing else.
#   TIER 2, THE DRIVER (moves and compares files; touches no artifact byte):
#       busybox         <- one static binary. sh, cat, cmp, sha256sum, ...
#
# Tier 1 is the number that must go to zero. When spikes/seedas/ becomes the
# real hand-encoded seed, `as` and `ld` come out of BUDGET_PATH below and the
# box builds from a committed, round-trip-verifiable seed with NOTHING entering
# it. That is a one-line edit to this file, which is the point of writing the
# budget as a variable instead of as prose.
#
# Tier 2 is not on the road to zero and should not pretend to be. A build has
# to be driven by something. What matters is that it is ONE binary with ONE
# hash, that it is enumerated, and that the SEAL step fails if anything else
# turns up inside the box. Do not let this list grow without moving the entry
# into the header above.
#
# WHAT IS OUTSIDE THE BOX, DELIBERATELY:
#   - the fetch. Pinned sources are cloned in the airlock, hashed, and bound in
#     READ-ONLY. The box itself runs --unshare-all, so it has no network at all.
#   - tools/drop_asm.py. It is a SOURCE transformation, not a compilation: it
#     runs in the airlock and its output (patched_bootstrap.c) is bound in as a
#     hashed input like any other source file. Putting python3 in the box to
#     avoid this would cost far more than it buys.
#   - the reference arm. Upstream's M2-Planet, built by host gcc, in a separate
#     job that never touches the box. It is an ORACLE: it says what the right
#     answer is and never appears on our build path.
#
# THE GATE IS ON .M1 TEXT, NOT ON A LINKED BINARY -- and that is deliberate.
# m2libc-113-bisect gates on `G1 == refM2P` as ELF binaries, which needs
# blood-elf + M1 + hex2 to link each generation, and it gets those from
# `make -C upstream-mescc`, i.e. from HOST GCC. That is a host compiler on the
# build path and it cannot come into this box.
#
# Building M1/hex2 with our own stage 2 instead is the correct fix and it is
# blocked today by a real stage-2 codegen defect: our M1 hangs in M2libc's
# memset (`for(s = ptr; 0 < num; num = num - 1)` -- see m1-loop.yml) and our
# hex2 writes byte-identical output and then crashes on exit. Both are recorded
# in spikes/UPSTREAM-PINS.md.
#
# So the proof is moved one level down, where it is just as strong and needs no
# linker: G0 compiles M2-Planet's UNPATCHED source, and the .M1 it emits must be
# byte-identical to the .M1 upstream's own M2-Planet emits from the same input.
# Identical .M1 through the same M1+hex2 yields an identical binary by
# construction, so this subsumes the binary comparison. selfhost-demo already
# compares at this level (`ab_cmp gen2 .M1`); this makes it the gate.
#
#   GATE 0 (blocking)     the stage-2 conformance corpus -- ~411 example
#                         programs lifted from stage2-pico-c-demo.yml -- all
#                         pass, natively, plus the canon.c compiler-shaped
#                         fixpoint. NOTHING above is attempted until this holds.
#   GATE 1 (blocking)     ours-gen1.M1 == ref-gen1.M1, byte for byte
#   GATE 2 (non-blocking) the same thing linked, with M1/hex2 built in-box by
#                         stage 2. Expected RED on the memset defect. It is here
#                         to measure how far the pure chain gets, and to turn
#                         green on its own the day stage 2 is fixed.
#
# ON "STAGE 2 RECOMPILING ITSELF": there is no such thing, and the file should
# say so rather than quietly substituting something adjacent. Stage 2 is written
# in stage 1's language (stage2-pico-c.s1), not in C, so it has no source it
# could compile. The nearest real thing -- and what GATE 0 runs -- is
# selfhost/canon.c: a compiler-shaped program (file I/O, heap structs, function
# pointers, deep recursion) whose transform is idempotent, giving a true
# canon(canon(x)) == canon(x) fixpoint, including over canon's own source text.
# A genuine stage-2 self-compilation would need a C implementation of stage 2,
# which does not exist and is not planned -- M2-Planet is the self-hosting rung.

on:
  push:
    paths:
      - 'spikes/stage0-as/**'
      - 'spikes/stage1-as/**'
      - 'spikes/stage2-pico-c/**'
      - 'spikes/elf/**'
      - 'tools/drop_asm.py'
      - '.github/workflows/stage3-hermetic-arm64.yml'
      - '!spikes/*.md'
      - '!spikes/**/*.md'
  workflow_dispatch:
  # CALLED BY stage3-to-stage4-bridge.yml, which continues this climb up to
  # gcc 4.7.4. It calls rather than copies: the in-box script below is ~1000
  # lines and a second copy of it would drift from this one, which is the
  # failure this repo already records for a list kept beside the thing it
  # describes. Adding this trigger changes nothing about how the job runs on
  # push or dispatch.
  workflow_call:

# Long jobs queue instead of cancelling -- one push to fix a typo must not kill
# an in-flight run.
concurrency:
  group: stage3-hermetic-arm64-${{ github.ref }}
  cancel-in-progress: false

env:
  M2PLANET_SHA: bd2fe4b0659fd0ad3f476a5ad0ef801bd134665d
  M2LIBC_SHA: 68a23cfd05d5a355ba7a30c770d684cbe86fcc4e
  MESCC_SHA: 5adfbf3

jobs:

  # ===================================================================
  # ORACLE. Host gcc builds upstream's M2-Planet and runs it on the same
  # -f list our G0 will get. Never touches the box; only its .M1 output
  # crosses back, after the box has closed.
  # ===================================================================
  oracle:
    runs-on: ubuntu-24.04-arm          # NATIVE aarch64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make git

      - name: Fetch pinned upstreams
        run: |
          set -eu
          git clone https://github.com/oriansj/M2-Planet.git m2
          git -C m2 checkout -q "$M2PLANET_SHA"
          git -C m2 submodule update --init --recursive
          git -C m2/M2libc checkout -q "$M2LIBC_SHA" 2>/dev/null || true
          echo "  M2-Planet $(git -C m2 rev-parse --short HEAD)  M2libc $(git -C m2/M2libc rev-parse --short HEAD)"

      - name: Derive the -f list from upstream's own script
        run: |
          set -eu
          # NEVER HAND-WRITE THE -f LIST. Four reconstructed lists in a row were
          # wrong (m2libc-113-bisect's header records this), and the specific
          # trap here is `M2libc/bootstrap.c` -- the generic one, which does NOT
          # EXIST at the 1.13.1 pin. Four workflows still reference it and are
          # red because of it: stage3-m2-demo, mescc-tools-full, no-host-chain
          # and selfhost-demo. Deriving from upstream's script cannot make that
          # mistake, and the assertion below makes sure of it.
          S=m2/test/test1000/hello-aarch64.sh

          # ANCHOR ON THE INVOCATION, NOT THE PROJECT NAME. The first run of
          # this job derived an EMPTY list because `grep -m1 'M2-Planet'`
          # matched line 4 of the GPL header --
          #     ## This file is part of M2-Planet.
          # -- which carries no -f tokens at all. Match `bin/M2-Planet`, which
          # only the invocation line has. The x86 proof invocation further down
          # runs ./test/results/test1000-aarch64-binary and so cannot be hit by
          # this pattern, which is the other half of why this anchor is right.
          #
          # The continuation lines are TAB-indented, so the -f token separator
          # is not reliably a space: extract with [[:space:]] rather than ' ',
          # or the match runs on past the filename into the next token.
          sed -e ':a' -e '/\\$/{N; s/\\\n/ /; ta}' "$S" > joined.sh
          grep -m1 'bin/M2-Planet' joined.sh \
            | grep -oE -- '-f[[:space:]]+[^[:space:]]+' \
            | sed 's/^-f[[:space:]]*//' > flist.txt

          if [ ! -s flist.txt ]; then
            echo "FAIL: derived an empty -f list from $S"
            echo "  the joined invocation line this matched, if any:"
            grep -m1 'bin/M2-Planet' joined.sh | cut -c1-300 | sed 's/^/    /' || echo "    (no match)"
            echo "  first 30 lines of the script, for the next reader:"
            head -30 "$S" | sed 's/^/    /'
            exit 1
          fi

          echo "  derived $(wc -l < flist.txt) files:"
          sed 's/^/    /' flist.txt

          # THE EXISTENCE CHECK IS THE GATE -- not a pattern assertion. The
          # first draft hard-failed if the list named M2libc/bootstrap.c, on
          # the strength of the note in spikes/stage3/README.md that the file
          # is gone at 1.13.1. That is a claim about the pin, and asserting it
          # by pattern would false-fail the day it stops being true. Checking
          # that every named file is actually present tests the same thing,
          # cannot be wrong, and says which file if it is.
          miss=0
          while read -r f; do
            [ -f "m2/$f" ] || { echo "    MISSING: $f"; miss=1; }
          done < flist.txt
          if [ "$miss" != 0 ]; then
            echo "FAIL: upstream's own script names files that are not in the tree at this pin."
            echo "      If the missing one is M2libc/bootstrap.c, that is the removal"
            echo "      spikes/stage3/README.md records, and BOTH arms must drop it --"
            echo "      do not fix it in one arm only."
            exit 1
          fi
          if grep -qx 'M2libc/bootstrap.c' flist.txt; then
            echo "  NOTE: the generic M2libc/bootstrap.c IS present at this pin."
            echo "        The box omits it from G0's translation unit (m71's rule)"
            echo "        and passes it to G1 unpatched. Both are reported in-box."
          fi

      - name: Build upstream's reference compiler and self-compile
        run: |
          set -eu
          make -C m2 M2-Planet
          cd m2
          # the -f list, verbatim, as upstream wrote it
          set --
          while read -r f; do set -- "$@" -f "$f"; done < ../flist.txt
          ./bin/M2-Planet --architecture aarch64 --bootstrap-mode "$@" -o ../ref-gen1.M1
          cd ..
          printf '  ref-gen1.M1  %s bytes  %s\n' \
            "$(wc -c < ref-gen1.M1)" "$(sha256sum ref-gen1.M1 | cut -c1-16)"

      - uses: actions/upload-artifact@v4
        with:
          name: oracle
          path: |
            ref-gen1.M1
            flist.txt

  # ===================================================================
  # THE BOX.
  # ===================================================================
  hermetic:
    runs-on: ubuntu-24.04-arm          # NATIVE aarch64 -- no qemu in the way
    needs: oracle
    timeout-minutes: 60
    env:
      # TIER 1 -- on the build path. THIS IS THE NUMBER THAT MUST REACH ZERO.
      # When spikes/stage0-as/stage0-as and spikes/elf/elf are committed this
      # goes to '' -- git preserves the executable bit, so a committed ELF is
      # run by the kernel's own loader and needs NO tool to become runnable.
      # A committed hex file would need one to convert it, which is the host
      # dependency being removed. The readable artifact is the .s source; that
      # the binary corresponds to it exactly is proven by stage0-selfhost, not
      # assumed. Set this to '' in the SAME commit that adds the binaries --
      # the SEAL step enforces whatever is declared here, so they cannot drift.
      BUDGET_PATH: ''
      # TIER 2 -- the driver. One binary.
      BUDGET_DRIVER: 'busybox'
    steps:
      - uses: actions/checkout@v5

      # --- AIRLOCK: everything that needs a network happens here ----------
      - name: Install (airlock only -- none of this enters the box)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap binutils busybox-static git python3 file
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true

      - name: Fetch pinned upstreams
        run: |
          set -eu
          git clone https://github.com/oriansj/M2-Planet.git pins/m2
          git -C pins/m2 checkout -q "$M2PLANET_SHA"
          git -C pins/m2 submodule update --init --recursive
          git -C pins/m2/M2libc checkout -q "$M2LIBC_SHA" 2>/dev/null || true
          git clone --recursive https://github.com/oriansj/mescc-tools.git pins/mescc
          git -C pins/mescc checkout -q "$MESCC_SHA"
          echo "  M2-Planet $(git -C pins/m2 rev-parse --short HEAD)"
          echo "  M2libc    $(git -C pins/m2/M2libc rev-parse --short HEAD)"
          echo "  mescc     $(git -C pins/mescc rev-parse --short HEAD)"

      - uses: actions/download-artifact@v4
        with:
          name: oracle
          path: oracle

      - name: The substitution (airlock -- a source edit, not a compilation)
        run: |
          set -eu
          L=pins/m2/M2libc
          echo "  what drop_asm removes from aarch64/linux/bootstrap.c:"
          python3 tools/drop_asm.py --list "$L/aarch64/linux/bootstrap.c" | sed 's/^/    /'
          python3 tools/drop_asm.py "$L/aarch64/linux/bootstrap.c" > pins/patched_bootstrap.c
          echo "    asm() blocks remaining: $(grep -c 'asm(' pins/patched_bootstrap.c || true)"
          printf '  %-28s %8s  %s\n' 'bootstrap.c (upstream)' \
            "$(wc -c < "$L/aarch64/linux/bootstrap.c")" \
            "$(sha256sum "$L/aarch64/linux/bootstrap.c" | cut -c1-16)"
          printf '  %-28s %8s  %s\n' 'bootstrap.c (patched)' \
            "$(wc -c < pins/patched_bootstrap.c)" \
            "$(sha256sum pins/patched_bootstrap.c | cut -c1-16)"
          # Reuse the oracle's derived list verbatim. Both arms MUST get the
          # identical -f list; a list derived twice is a list that can differ
          # twice, and then a red gate means nothing.
          cp oracle/flist.txt pins/flist.txt
          echo "  -f list ($(wc -l < pins/flist.txt) files) taken from the oracle job, not re-derived"

      - name: Derive the mescc-tools source lists from upstream's makefile
        run: |
          set -eu
          # Same rule, same reason: no-host-chain's header records that three
          # hand-written lists in a row were wrong, and that the one they all
          # missed was stringify.c -- whose absence hung M1 at runtime while
          # --help still worked. The makefile is authoritative. This is that
          # job's derivation, unchanged, so the two diff against each other.
          MK=pins/mescc/makefile
          srcs() {
            grep -E "^bin/$1:" "$MK" | sed 's/|.*//' \
              | grep -o '[A-Za-z0-9_./-]*\.c' | awk '!seen[$0]++' \
              | grep -v 'bootstrappable\.c'
          }
          # M2-Planet is single-pass: the main-bearing file must come last.
          order() {
            m=""; r=""
            for f in $1; do
              if grep -q '^int main(' "pins/mescc/$f" 2>/dev/null; then m="$f"; else r="$r $f"; fi
            done
            echo "$r $m"
          }
          # THE MAKEFILE LISTS TRANSLATION UNITS. IT DOES NOT LIST HEADERS,
          # AND THIS BUILD CONCATENATES RATHER THAN COMPILES-AND-LINKS, SO A
          # HEADER LEFT OUT IS A TYPE THAT DOES NOT EXIST.
          #
          # That is exactly what blocked hex2. `struct entry` and
          # `struct input_files` are defined ONLY in hex2.h; hex2_globals.h
          # merely declares `extern struct entry** jump_tables;`. With hex2.h
          # absent, hex2.c:34
          #
          #     jump_tables = calloc(65537, sizeof(struct entry*));
          #
          # asks stage 2 for the size of a type it has never seen -- and stage 2
          # segfaulted rather than saying so, which is why this read as "our
          # hex2 crashes" for as long as it did. Both halves are fixed: stage 2
          # now diagnoses (spikes/stage2-pico-c, struct_size), and the header is
          # in the unit. MEASURED: with hex2.h present, stage 2 compiles the
          # hex2 unit clean -- rc=0, 202,160 bytes of stage-1 assembly.
          #
          # The headers are derived from the SOURCES' OWN #include lines rather
          # than listed here, for the same reason the .c list is derived from
          # the makefile: a hand-written list is a list that goes stale, and
          # no-host-chain's header records three of them in a row being wrong.
          # THE CLOSURE MUST BE TRANSITIVE, AND THE FIRST VERSION WAS NOT.
          #
          # Scanning only the .c files finds hex2_globals.h and stops -- but
          # `struct entry` and `struct input_files` live in hex2.h, one level
          # further down, and hex2.h in turn needs M2libc/bootstrappable.h.
          # A one-level scan produced a unit missing the very type that
          # hex2.c:34 asks the size of. It cost a run, and it read as
          # "our hex2 crashes" rather than as a list that was short by one.
          #
          # tools/include_closure.py walks the graph to a fixpoint and emits
          # dependencies FIRST -- hex2.h before hex2_globals.h -- because this
          # unit is CONCATENATED, not compiled, so order is meaning rather than
          # style. It also FAILS on a quoted include it cannot resolve instead
          # of dropping it, which is the same defect one layer along.
          #
          # MEASURED with the closure in place, both units compile clean:
          #   hex2  rc=0, 202,160 bytes of stage-1 assembly
          #   M1    rc=0, 179,172 bytes
          for t in M1 hex2; do
            out=$(order "$(srcs "$t")")
            [ -n "$(echo $out)" ] || { echo "FAIL: could not derive $t sources"; exit 1; }
            h=$(python3 tools/include_closure.py pins/mescc $out) \
              || { echo "FAIL: could not close $t's includes"; exit 1; }
            printf '%s\n' $h $out > "pins/$t-srcs.txt"
            echo "  $t headers: $(echo $h)"
            echo "  $t sources: $out"
          done

          # OBJECT-LIKE #defines BECOME enums, IN THE AIRLOCK.
          #
          # stage 2 has no preprocessor: nt_hash skips a `#` line to
          # end-of-line and that is all of it. So `#define AARM64 0xB7` leaves
          # nothing behind and AARM64 reaches stage 1 as an unresolved label.
          #
          # It has never mattered before because M2-Planet uses `#define`
          # exactly ONCE in its entire source -- `#define CC_H`, a bare guard --
          # and expresses every constant as an `enum`, having been written for
          # compilers with no preprocessor. mescc-tools is the same author
          # writing for a later rung, so hex2 is the first thing in this ladder
          # to need one.
          #
          # Teaching stage 2 `#define` would add a second mechanism, in
          # hand-written aarch64 assembly, for something its enum table already
          # expresses. Rewriting the constants is smaller and checkable, and it
          # is the same category as drop_asm.py above: a declared source edit in
          # the AIRLOCK, not a compilation. The box still gets only busybox and
          # receives the result through pins/.
          #
          # The tool REFUSES function-like or non-integer macros rather than
          # guessing, so if upstream adds one this stops instead of quietly
          # putting a wrong constant into a linker.
          # M1's STRING BUFFER, RAISED BEFORE ANYTHING READS THE SOURCE.
          #
          # tcc's keyword table is ONE string literal -- if\0else\0while\0...
          # through every attribute name -- and micro-c emits it as a single
          # 19,571-character line in the .M1. M1's max_string is 4096, so it
          # stops with
          #
          #     tcc-all.M1:363852 :String: '...' exceeds max string size
          #
          # after micro-c had already compiled all 369,946 lines of libtcc.M1.
          # spikes/stage3/tools/local-build.sh has carried this substitution and
          # its comment ("TRAP 2") since long before this job existed; the
          # hermetic path simply never did it.
          #
          # Assert the literal before substituting, so an upstream change reads
          # as a pin failure here rather than as a truncation that looks like a
          # codegen bug three rungs later.
          grep -q 'max_string = 4096,' pins/mescc/M1-macro.c \
            || { echo "FAIL: M1-macro.c no longer contains 'max_string = 4096,'";
                 grep -n 'max_string' pins/mescc/M1-macro.c; exit 1; }
          sed -i 's/max_string = 4096,/max_string = 262144,/' pins/mescc/M1-macro.c
          grep -q 'max_string = 262144,' pins/mescc/M1-macro.c \
            || { echo "FAIL: the substitution did not take"; exit 1; }
          # THE mescc-tools SERIES IS DELIBERATELY NOT APPLIED HERE.
          #
          # I added it for symmetry with local-build.sh and it broke GATE 2:
          # patches/mescc-tools/0001 makes hex2 emit a label map guarded by
          #     getenv("HEX2_LABEL_MAP")
          # and getenv lives in M2libc/stdlib.c, which is not in hex2's unit.
          #     stage1: unresolved label: getenv
          # It is a debugging aid for the local path, where a full libc is
          # linked; it is not a build requirement. Applying a patch this box
          # cannot satisfy, to match a script that runs elsewhere, is not
          # symmetry -- it is a regression with a tidy justification.
          echo "  M1 max_string raised to 262144 (tcc's keyword table is 19,571 chars)"

          # OCTAL FIRST, THEN THE DEFINES. THE ORDER IS LOAD-BEARING.
          #
          # stage 2 does not implement octal: parseval checks for a leading
          # `0x` and otherwise reads the digits as decimal, so `0750` is 750.
          # hex2.c:196 chmods its own output with 0750, and 750 as a mode is
          # 0o1356 -- owner `--wx`, no read bit. hex2 linked gen1 correctly and
          # then nothing could open it:
          #
          #     /work/run.sh: line 9: can't open /out/gen1: Permission denied
          #
          # THIS ONE IS EXHAUSTIVE ON PURPOSE, unlike the defines rewrite. A
          # `#define` stage 2 cannot expand fails LOUDLY, as an unresolved label
          # at stage 1. A misparsed octal literal fails SILENTLY -- it is just a
          # different number, and the program runs and does the wrong thing. So
          # every literal in the unit is rewritten and reported, not only the
          # one that happened to hurt.
          #
          # Measured across the pinned trees: M2-Planet has ZERO octal literals
          # (same reason it has no #defines -- written for compilers like this
          # one), mescc-tools has exactly ONE, and M2libc has 223, all of them
          # mode and open-flag constants like `#define S_IRWXU 00700`.
          #
          # Those M2libc ones are why this runs BEFORE defines_to_enums: that
          # tool would match `00700` as an integer and emit
          # `enum { S_IRWXU = 00700 }`, which stage 2 then reads as 700. Running
          # octal first means the defines tool only ever sees decimal.
          rm -rf pins/mescc-oct pins/mescc-s2
          for t in M1 hex2; do
            echo "  rewriting $t's octal literals:"
            python3 tools/octal_to_decimal.py pins/mescc pins/mescc-oct \
              $(cat "pins/$t-srcs.txt") \
              || { echo "FAIL: could not rewrite $t's octal literals"; exit 1; }
          done
          for t in M1 hex2; do
            echo "  rewriting $t's defines:"
            python3 tools/defines_to_enums.py pins/mescc-oct pins/mescc-s2 \
              $(cat "pins/$t-srcs.txt") \
              || { echo "FAIL: could not rewrite $t's defines"; exit 1; }
          done
          # A PRODUCER WITH NO CONSUMER IS A LIE IN THE LOG, AND SO IS A
          # CONSUMER WITH NO PRODUCER. The previous two revisions had one of
          # each: the rewrite ran and nothing read it, then build2 read a
          # directory nothing created. Assert the tree exists and covers every
          # file build2 will ask for, here, where the message can be plain.
          for t in M1 hex2; do
            while read -r f; do
              [ -f "pins/mescc-s2/$f" ] || {
                echo "FAIL: pins/mescc-s2/$f missing -- the rewrite did not"
                echo "      cover every file in pins/$t-srcs.txt"; exit 1; }
            done < "pins/$t-srcs.txt"
          done
          echo "  rewritten tree: $(find pins/mescc-s2 -type f | wc -l) files"

      - name: 'AIRLOCK: micro-c source, and tcc, for the stage-3 rung'
        run: |
          set -eu
          # micro-c IS M2-Planet PLUS THIS PROJECT'S PATCH SERIES, and the
          # difference matters. GATE 1 above proves the ladder reaches UPSTREAM
          # M2-Planet byte for byte -- it says nothing about the compiler stage
          # 3 actually uses, which is upstream plus 38 experiments. Applying
          # them is a source edit, so it happens out here beside drop_asm.py
          # and the two rewrites; the box gets the result through pins/.
          rm -rf pins/microc && cp -r pins/m2 pins/microc
          git -C pins/microc init -q . 2>/dev/null || true
          n=0
          for p in spikes/stage3/patches/m2-planet/[0-9]*.patch \
                   spikes/stage3/patches/micro-c-experiments/EXPERIMENT-*.patch; do
            [ -e "$p" ] || continue
            git -C pins/microc apply --ignore-whitespace "$PWD/$p" \
              || { echo "FAIL: $(basename "$p") does not apply"; exit 1; }
            n=$((n + 1))
          done
          # A FLOOR, BECAUSE A SILENTLY EMPTY SERIES LOOKS EXACTLY LIKE A
          # PASSING ONE. tcc-two-ways carries the same guard for the same
          # reason.
          # local-build.sh requires 41; there is no reason this should be the
          # looser guard. 43 apply today.
          [ "$n" -ge 41 ] || { echo "FAIL: only $n patches applied, expected >= 41"; exit 1; }
          echo "  micro-c = M2-Planet + $n patches"

          # THE TARBALL IS EXTRACTED HERE, NOT IN THE BOX. busybox has tar, but
          # the box's applet list is the budget's inventory and every name on it
          # is a capability someone has to justify. Unpacking is not a
          # compilation, so it belongs in the airlock.
          rm -rf pins/tcc-src && mkdir -p pins/tcc-src
          tar -xzf spikes/toolbox/tcc-5ec0e6f8-arm64-configured.tar.gz \
              -C pins/tcc-src --strip-components=1
          [ -f pins/tcc-src/config.h ] \
            || { echo "FAIL: no config.h -- the tarball is not the configured one"; exit 1; }
          # A FLOOR, BECAUSE THE SUITE BELOW DEPENDS ON THESE. Every program
          # uses __asm__ with register constraints for its syscalls, so tcc's
          # arm64 inline assembler has to be patched in. If this glob ever
          # matches nothing, zero patches apply in silence and ten programs
          # fail for a reason that has nothing to do with micro-c.
          tap=0
          for p in spikes/stage3/patches/tcc-arm64-asm/[0-9]*.patch; do
            [ -e "$p" ] || continue
            git -C pins/tcc-src apply --ignore-whitespace "$PWD/$p" 2>/dev/null \
              || patch -p1 -d pins/tcc-src -i "$PWD/$p" >/dev/null \
              || { echo "FAIL: $(basename "$p") does not apply to tcc"; exit 1; }
            tap=$((tap + 1))
          done
          [ "$tap" -ge 5 ] || { echo "FAIL: only $tap tcc-arm64-asm patches, expected >= 5"; exit 1; }
          # AND THE OTHER HALF, WHICH IS THE ONE THAT WOULD HAVE CAUGHT THIS.
          # "$tap patches applied" is not "the fix is in the tree" -- the same
          # distinction TRAP 3 draws for the m2libc defs below. The tarball is
          # already patched for 0001-0005, so five of those seven applications
          # are no-ops and the counter cannot tell. 0006 and 0007 are the two
          # that really change the tree, and 0006 is the reason this step now
          # asserts anything at all: it added
          #     #include <math.h>
          #     #include <float.h>
          # to tccgen.c, micro-c's include set had no float.h, and step 10
          # reported nothing but
          #     tccgen.c:25:Unable to find include file: float.h
          #     stage 3 end to end: no
          # 400 lines later. Every other job that applies this series builds
          # tcc with the HOST compiler and has a host float.h, so nothing else
          # went red.
          grep -q '#include <float.h>' pins/tcc-src/tccgen.c \
            || { echo "FAIL: patch 0006 is not in tccgen.c"; exit 1; }
          grep -q 'VT_VALMASK | VT_LVAL | VT_SYM)) == VT_CONST' pins/tcc-src/tccgen.c \
            || { echo "FAIL: patch 0007 is not in tccgen.c"; exit 1; }

          # THE MICRO-C-ONLY tcc PATCHES. Small, and separate from the arm64
          # assembler series because they are not about the target -- they are
          # about the compiler doing the building. Currently one: long double
          # is eight bytes, which is what micro-c's float model actually gives
          # the tcc it builds, and without which tcc's own guard refuses to
          # emit any long double constant at all. See the patch preamble.
          tmp=0
          for p in spikes/stage3/patches/tcc-microc/[0-9]*.patch; do
            [ -e "$p" ] || continue
            git -C pins/tcc-src apply --ignore-whitespace "$PWD/$p" 2>/dev/null \
              || patch -p1 -d pins/tcc-src -i "$PWD/$p" >/dev/null \
              || { echo "FAIL: $(basename "$p") does not apply to tcc"; exit 1; }
            tmp=$((tmp + 1))
          done
          echo "  tcc-microc patches: $tmp"
          echo "  tcc-src ready: $(ls pins/tcc-src/*.c | wc -l) .c files, $tap asm patches"

          # THE TABLES COME FROM spikes/reference/m2libc, PATCHED -- NOT FROM
          # M2-Planet'S SUBMODULE.
          #
          # The box clones M2-Planet, whose M2libc submodule carries a 229-line
          # aarch64_defs.M1. The M2libc this project actually uses has 2,404
          # lines, and `ret` is one of the 2,175 the submodule's copy lacks:
          #
          #     tcc-all.M1:20 :Received invalid other; ret
          #     DEFINE ret present: 0
          #
          # GATE 2 links gen1 with the submodule's tables because M2-Planet's
          # own output happens to stay inside that vocabulary. micro-c
          # compiling M2libc's aarch64 asm does not.
          #
          # local-build.sh has said so in a comment for as long as it has
          # existed -- "THE TABLES COME FROM HERE, NOT FROM spikes/reference"
          # is its heading for the patched copy -- and the hermetic path was
          # reaching for the submodule instead.
          #
          # Steps 7-9 are untouched: GATE 1 compares against an oracle built
          # from the submodule, so changing what THEY use would break the
          # comparison. This tree is for step 10 only.
          rm -rf pins/m2libc-veron
          cp -r spikes/reference/m2libc pins/m2libc-veron
          git -C pins/m2libc-veron init -q 2>/dev/null || true
          mn=0
          for p in spikes/stage3/patches/m2libc/[0-9]*.patch; do
            [ -e "$p" ] || continue
            git -C pins/m2libc-veron apply --ignore-whitespace "$PWD/$p" \
              || { echo "FAIL: $(basename "$p") does not apply to m2libc"; exit 1; }
            mn=$((mn + 1))
          done
          [ "$mn" -ge 6 ] || { echo "FAIL: expected >= 6 m2libc patches, got $mn"; exit 1; }
          # TRAP 3, as local-build.sh calls it: assert the encoding fix is in
          # the table that will actually be used, not merely that a patch ran.
          grep -q '^DEFINE add_x0,x16,x0 0002008b' \
            pins/m2libc-veron/aarch64/aarch64_defs.M1 \
            || { echo "FAIL: the x16 encoding fix is not in the defs table"; exit 1; }
          grep -q '^DEFINE ret ' pins/m2libc-veron/aarch64/aarch64_defs.M1 \
            || { echo "FAIL: no DEFINE ret in the defs table"; exit 1; }
          # THE OTHER HALF OF local-build.sh's TRAP 3, which I carried only
          # half of last time. Its comment is the reason: "the patch was
          # applied" and "the fix is there" are different claims, and only the
          # second one matters.
          grep -q 'define va_copy(ap1, ap2) ap1 = ap2' pins/m2libc-veron/stdarg.h \
            || { echo "FAIL: va_copy is still reversed"; exit 1; }
          echo "  m2libc (ours) = reference + $mn patches, $(grep -c '^DEFINE' pins/m2libc-veron/aarch64/aarch64_defs.M1) DEFINEs"

          # EVERY ANGLE-BRACKET INCLUDE tcc's SOURCE REACHES FOR HAS TO BE
          # RESOLVABLE FROM THE INCLUDE PATH STEP 10 PASSES, which is
          # -I . -I micro-c-libc -I m2libc-veron and nothing else. There is no
          # system include path in the box, so a header that is merely usual is
          # a header that is missing. Non-fatal on purpose -- some of these sit
          # behind #ifdefs that never fire on this target -- but it prints the
          # name here, in the airlock, rather than leaving it to be read out of
          # three truncated lines of stderr 400 lines later.
          miss=
          for h in $(sed -n 's/^#include <\([a-z0-9_/]*\.h\)>.*/\1/p' \
                       pins/tcc-src/*.c pins/tcc-src/*.h | sort -u); do
            [ -f "pins/tcc-src/$h" ] && continue
            [ -f "spikes/stage3/micro-c-libc/$h" ] && continue
            [ -f "pins/m2libc-veron/$h" ] && continue
            miss="$miss $h"
          done
          if [ -n "$miss" ]; then
            echo "  NOTE: angle includes not on micro-c's path:$miss"
          else
            echo "  every angle include in tcc's source resolves on micro-c's path"
          fi

          # The -f list is the oracle's, exactly as G0/G1 use it.
          cp pins/flist.txt pins/microc-srcs.txt

      # --- BUILD THE BOX --------------------------------------------------
      - name: Load the stage-2 conformance corpus
        run: |
          set -eu
          # THE CORPUS IS A COMMITTED FILE. It used to be extracted from
          # stage2-pico-c-demo.yml on every run, which made test data a
          # dependency of a YAML file -- and archiving that YAML broke this
          # build, because GitHub stops EXECUTING an archived workflow but
          # nothing stops another job READING it. Data belongs in the tree.
          #
          # tools/extract_stage2_tests.py still exists and the provenance is in
          # spikes/stage2-pico-c/corpus/README.md; regenerating is a deliberate
          # act now rather than something that happens silently every run.
          CORPUS=spikes/stage2-pico-c/corpus/conformance.tsv
          [ -f "$CORPUS" ] || { echo "  corpus not found at $CORPUS"; exit 1; }
          # pins/ IS BIND-MOUNTED AT /in, AND THE IN-BOX SCRIPT READS
          # /in/stage2-tests.corpus. The extractor used to write there directly;
          # replacing it with a copy to tests.tsv in the workspace left that
          # path empty, so the while-read loop read nothing and the suite
          # reported "0/0 passed, 0 failed" -- as a PASS.
          mkdir -p pins
          cp "$CORPUS" pins/stage2-tests.corpus
          n=$(wc -l < pins/stage2-tests.corpus)
          printf '  corpus %s: %s tests, %s\n' "$CORPUS" "$n" \
            "$(sha256sum pins/stage2-tests.corpus | cut -c1-16)"
          # THE FLOOR THE EXTRACTOR USED TO ENFORCE. --floor 415 asserted the
          # extraction found a plausible number of tests; dropping the extractor
          # dropped the floor with it, and nothing downstream had any opinion
          # about how many tests should run.
          if [ "$n" -lt 415 ]; then
            echo "  FAIL: only $n tests; the corpus should carry at least 415."
            exit 1
          fi


      - name: Assemble the box
        run: |
          set -eu
          BOX="$PWD/box"; echo "BOX=$BOX" >> "$GITHUB_ENV"
          mkdir -p "$BOX"/bin "$BOX"/lib "$BOX"/work "$BOX"/out \
                   "$BOX"/src "$BOX"/in "$BOX"/tmp "$BOX"/proc "$BOX"/dev

          for t in $BUDGET_PATH; do
            cp -L "$(command -v "$t")" "$BOX/bin/$t"
          done
          cp -L /bin/busybox "$BOX/bin/busybox"

          # dynamic deps of whatever we just copied, and the loader itself
          for b in "$BOX"/bin/*; do
            ldd "$b" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}'
          done | sort -u > /tmp/needed
          while read -r l; do [ -f "$l" ] && cp -L "$l" "$BOX/lib/" || true; done < /tmp/needed
          mkdir -p "$BOX"/usr/lib && cp -a "$BOX"/lib/. "$BOX"/usr/lib/ 2>/dev/null || true

          # busybox applet names. Anything the in-box script uses must be here;
          # PATH inside the box is /bin only, so a missing applet fails loudly
          # instead of silently reaching for a host binary.
          for a in sh cat cmp sha256sum wc printf mkdir cp rm mv ln chmod sed \
                   head tail tr ls sort comm grep cut awk timeout od dd env date; do
            ln -sf busybox "$BOX/bin/$a"
          done

          echo "  box laid out: $(du -sh "$BOX" | cut -f1)"

      - name: 'SEAL: enumerate every executable in the box and enforce the budget'
        run: |
          set -eu
          echo "  === TIER 1: ON THE BUILD PATH ==="
          for t in $BUDGET_PATH; do
            printf '    %-12s %10s  %s\n' "$t" "$(wc -c < "$BOX/bin/$t")" \
              "$(sha256sum "$BOX/bin/$t" | cut -c1-16)"
          done
          echo "  === TIER 2: DRIVER (touches no artifact byte) ==="
          for t in $BUDGET_DRIVER; do
            printf '    %-12s %10s  %s\n' "$t" "$(wc -c < "$BOX/bin/$t")" \
              "$(sha256sum "$BOX/bin/$t" | cut -c1-16)"
          done
          echo "  === shared objects carried in for the above ==="
          ls -1 "$BOX/lib" | sed 's/^/    /'

          # THE ENFORCEMENT. Every REAL file (not a busybox symlink) under
          # $BOX/bin must be named in one of the two budgets. If someone adds a
          # cp of gcc, or an apt package quietly lands a helper here, this fails
          # -- which is the entire value of writing the budget down.
          find "$BOX/bin" -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/actual
          printf '%s\n' $BUDGET_PATH $BUDGET_DRIVER | sort > /tmp/declared
          if ! cmp -s /tmp/actual /tmp/declared; then
            echo
            echo "FAIL: the box contains executables outside the declared budget."
            echo "  declared:"; sed 's/^/    /' /tmp/declared
            echo "  actual:";   sed 's/^/    /' /tmp/actual
            echo "  difference:"; comm -3 /tmp/declared /tmp/actual | sed 's/^/    /'
            exit 1
          fi
          echo
          echo "  SEALED. $(wc -l < /tmp/declared) host binaries, $(printf '%s' "$BUDGET_PATH" | wc -w) of them on the build path."

      - name: Write the in-box script
        run: |
          set -eu
          cat > "$BOX/work/run.sh" <<'EOS'
          #!/bin/sh
          # Runs with no network, no host PATH, and nothing in /bin but the
          # declared budget. Every path here is inside the box.
          set -eu
          cd /work

          say() { printf '\n  === %s ===\n' "$1"; }
          art() { printf '    %-28s %10s  %s\n' "$1" \
                    "$(wc -c < "$2" 2>/dev/null || echo -)" \
                    "$(sha256sum "$2" 2>/dev/null | cut -c1-16 || echo -)"; }

          say '1. SEED -- the only host tools on the build path'
          # THE COMMITTED BINARIES, OR NOTHING. There was an `as`+`ld` fallback
          # here for when they were absent. It was already unreachable and could
          # never have worked: BUDGET_PATH is empty, so neither tool is inside
          # the box, and the branch could only ever die as `as: not found` -- an
          # obscure message for a condition that deserves a plain one. Worse, a
          # branch reading "otherwise build them here" advertises a capability
          # this box does not have and must never regain.
          #
          # A committed ELF is executed by the kernel's own loader with no host
          # tool involved. Its correspondence to the readable .s source is not
          # taken on trust -- stage0-selfhost reconstructs the whole ELF from its
          # own disassembly and compares it byte for byte, under both binutils
          # 2.47 and LLVM 22.1.8.
          for s in /src/stage0-as/stage0-as /src/elf/elf; do
            [ -x "$s" ] || { echo "    FAIL: $s missing or not executable."; \
              echo "    Seed binaries are committed artifacts and this box has"; \
              echo "    no way to make them: BUDGET_PATH is empty, so there is"; \
              echo "    no as and no ld in here. stage0-selfhost uploads both;"; \
              echo "    commit them and re-run."; exit 1; }
          done
          cp /src/stage0-as/stage0-as stage0-as
          cp /src/elf/elf elf
          echo "    seed binaries: COMMITTED -- no as, no ld"
          art 'stage0-as' stage0-as
          art 'elf'       elf

          # NATIVE EXECUTION STARTS HERE. Under qemu-aarch64 every rung was
          # invoked as `qemu-aarch64 ./stage1`, which merely OPENS the file --
          # the exec bit and the ELF headers were never really tested. Here the
          # kernel's binfmt loader validates both. spikes/elf/README.md says the
          # elf tool sets 0755 itself via openat+fchmod, so no chmod should be
          # needed; if that is wrong, it fails right here, which is exactly the
          # kind of thing this port exists to find.
          say '2. STAGE 1 -- written in stage 0 language'
          ./stage0-as < /src/stage1-as/stage1-as.s0 | ./elf stage1
          [ -x stage1 ] || { echo "    FAIL: stage1 is not executable -- elf did not set 0755"; exit 1; }
          art 'stage1' stage1

          say '3. STAGE 2 -- written in stage 1 language'
          ./stage1 < /src/stage2-pico-c/stage2-pico-c.s1 | ./stage0-as | ./elf stage2
          [ -x stage2 ] || { echo "    FAIL: stage2 is not executable"; exit 1; }
          art 'stage2' stage2

          say '4. SMOKE -- each rung actually runs on this hardware'
          printf 'int main(){return 42;}' > smoke.c
          ./stage2 < smoke.c > smoke.s1
          ./stage1 < smoke.s1 | ./stage0-as | ./elf smoke
          set +e; ./smoke; rc=$?; set -e
          echo "    smoke.c through the whole ladder -> rc=$rc (want 42)"
          [ "$rc" = 42 ] || { echo "    FAIL: the ladder does not run natively"; exit 1; }

          say '5. STAGE 2 CONFORMANCE -- the demo corpus, run natively'
          # Every one of these compiles through the full ladder and is judged on
          # its exit code, exactly as stage2-pico-c-demo does it -- but on real
          # hardware instead of under qemu-aarch64. If our codegen has an ARM64
          # assumption that qemu was forgiving about, this is where it surfaces,
          # and it surfaces on a 40-character program instead of on 215 KB of
          # M2-Planet where nobody can bisect it.
          #
          # THIS GATES M2-PLANET. A compiler that cannot get `return 2000*2000`
          # right has no business being pointed at cc_core.c, and a failure here
          # is readable in a way that a failure up there is not.
          n=0; pass=0; fail=0
          : > /out/stage2-failures.txt
          # THE SEPARATOR IS 0x1F, NOT A TAB. POSIX classifies tab as IFS white
          # space, so `read -r a b c` collapses a run of tabs into ONE delimiter
          # and an empty middle field vanishes, shifting every later field left.
          # argv is empty on 414 of the 426 rows, so a tab-separated corpus put
          # the program text into $args on almost every line. Verified: with
          # tabs, `0<TAB><TAB>prog` reads back as b=prog, c=empty.
          US=$(printf '\037')
          set +e
          while IFS="$US" read -r want args prog; do
            [ -n "${want:-}" ] || continue
            n=$((n + 1))
            printf '%s' "$prog" > t.c
            timeout 30 ./stage2 < t.c > t.s 2>/dev/null
            if [ $? != 0 ] || [ ! -s t.s ]; then
              fail=$((fail + 1))
              printf 'COMPILE\twant=%s\targv=[%s]\t%s\n' "$want" "$args" "$prog" >> /out/stage2-failures.txt
              continue
            fi
            ./stage1 < t.s 2>/dev/null | ./stage0-as 2>/dev/null | ./elf t.elf 2>/dev/null
            if [ ! -x t.elf ]; then
              fail=$((fail + 1))
              printf 'LINK\twant=%s\targv=[%s]\t%s\n' "$want" "$args" "$prog" >> /out/stage2-failures.txt
              continue
            fi
            # $args IS DELIBERATELY UNQUOTED. atry runs its binary as
            # `./a.out $3`, so `-o out` must word-split into TWO arguments;
            # quoting it would pass one argument containing a space and every
            # argc test would be off by one. Empty args expands to nothing.
            timeout 30 ./t.elf $args < /dev/null > /dev/null 2>&1
            rc=$?
            if [ "$rc" = "$want" ]; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              printf 'RUN got=%s\twant=%s\targv=[%s]\t%s\n' "$rc" "$want" "$args" "$prog" >> /out/stage2-failures.txt
            fi
            rm -f t.elf
          done < /in/stage2-tests.corpus
          set -e
          echo "    $pass/$n passed, $fail failed"
          # A SUITE THAT RAN NOTHING IS NOT A SUITE THAT PASSED. This reported
          # "0/0 passed, 0 failed" and exited clean when the corpus failed to
          # reach the box -- the single most dangerous shape a test result can
          # have, because it looks exactly like success.
          if [ "$n" -lt 415 ]; then
            echo "    FAIL: only $n tests ran; expected at least 415."
            exit 1
          fi
          if [ "$fail" != 0 ]; then
            echo "    first failures (full list in the artifact):"
            head -20 /out/stage2-failures.txt | sed 's/^/      /'
            exit 1
          fi

          say '6. STAGE 2 FIXPOINT -- the compiler-shaped canary'
          # NOTE WHAT THIS IS AND IS NOT. Stage 2 has no C source -- it is
          # written in stage 1's language, as stage2-pico-c.s1 -- so there is no
          # stage-2 self-compilation and no stage-2 fixpoint in the M2-Planet
          # sense. What exists is spikes/stage2-pico-c/selfhost/canon.c: a
          # compiler-shaped program (file I/O, heap structs, function pointers,
          # deep recursion) whose transform is IDEMPOTENT, so
          # canon(canon(x)) == canon(x) is a genuine fixpoint over a real
          # compiler-shaped workload. Its own README calls it a proof-of-pivot,
          # not a permanent rung. Treat it as the canary it is.
          #
          # canon returns the output LENGTH as its exit status, so a good run
          # exits NONZERO. Every invocation is judged on its output file.
          C=/src/stage2-pico-c/selfhost/canon.c
          ./stage2 < "$C" > canon.s
          ./stage1 < canon.s | ./stage0-as | ./elf canon
          [ -x canon ] || { echo "    FAIL: canon did not build"; exit 1; }
          art 'canon (ours)' canon

          # structural -- guards against the canary degrading into something trivial
          fp_ok=yes
          for pat in 'bl calloc' 'blr' 'bl open' 'bl read' 'bl write' ':emit_list'; do
            grep -q "$pat" canon.s || { echo "    MISSING $pat in emitted canon"; fp_ok=no; }
          done
          echo "    emitted program uses calloc + blr + file I/O + recursion: $fp_ok"

          run_canon() { rm -f in out; cp "$1" in; set +e; timeout 60 ./canon >/dev/null 2>&1; set -e; }

          printf '  int  main( ) {\n\t int   x =\t42 ;\n   return   x+x ;\n}\n' > sh_sample
          printf 'int\nmain(\n)\n{\nint\nx\n=\n42\n;\nreturn\nx+x\n;\n}\n' > sh_want
          run_canon sh_sample
          if cmp -s out sh_want; then st=OK; else st=DIFF; fp_ok=no; fi
          echo "    tokenizes messy input to one token per line: $st"

          cp out g1; run_canon g1; cp out g2
          if cmp -s g1 g2; then st=OK; else st=DIFF; fp_ok=no; fi
          echo "    FIXPOINT canon(canon(x)) == canon(x): $st  ($(wc -c < g1) bytes)"

          run_canon "$C"; cp out s1; run_canon s1; cp out s2
          if cmp -s s1 s2 && [ -s s1 ]; then st=OK; else st=DIFF; fp_ok=no; fi
          echo "    FIXPOINT on canon's OWN source: $st  ($(wc -c < s1) bytes)"

          ntok=$(wc -w < "$C"); nline=$(wc -l < s1)
          if [ "$ntok" = "$nline" ]; then st=OK; else st=DIFF; fp_ok=no; fi
          echo "    own-source token count matches a whitespace split: $st ($nline vs $ntok)"

          [ "$fp_ok" = yes ] || { echo "    FAIL: the stage-2 canary is not clean"; exit 1; }

          say '7. G0 -- stage 2 builds UPSTREAM M2-Planet, for GATE 1 only'
          # THIS IS NOT micro-c, AND CALLING IT THAT WAS WORSE THAN THE NAME
          # IT REPLACED. Steps 7 and 8 build UPSTREAM M2-Planet, deliberately
          # unpatched, and they exist for one purpose: GATE 1 compares this
          # compiler's self-compile byte for byte against upstream's own
          # reference build. That comparison measures the LADDER -- seed,
          # stage 1, stage 2 -- not our compiler. Put our patches in here and
          # the gate stops meaning anything at all.
          #
          # One substitution only: M2libc/aarch64/linux/bootstrap.c, whose
          # entire content is six asm() bodies stage 2 cannot compile.
          #
          # micro-c -- upstream plus this project's 43 patches -- is built in
          # step 10, and it is the one that compiles tcc.
          # The substitution applies to G0 and only G0. patched_bootstrap.c goes
          # first so its enums (NULL EOF TRUE FALSE stdin/stdout/stderr EXIT_*)
          # are in scope for the shim, and the shim supplies fgetc/fputc -- the
          # only two dropped functions our m53/m69 builtins do not already cover.
          # Say out loud what happens to every file in the list. A substitution
          # that is not printed is a substitution someone will later mistake for
          # a clean build.
          {
            cat /in/patched_bootstrap.c
            cat /src/stage2-pico-c/m2libc-shim.c
            while read -r f; do
              case "$f" in
                M2libc/aarch64/linux/bootstrap.c)
                  echo "    REPLACE $f -> patched_bootstrap.c + m2libc-shim.c" >&2 ;;
                M2libc/bootstrap.c)
                  # m71's omission. Only reachable if this pin still ships it.
                  echo "    OMIT    $f  (m71 rule; G1 still gets it unpatched)" >&2 ;;
                *)
                  echo "    as-is   $f" >&2
                  cat "/in/m2/$f" ;;
              esac
            done < /in/flist.txt
          } > m2.c
          art 'm2.c (our translation unit)' m2.c
          ./stage2 < m2.c > m2.s1
          echo "    stage2 emitted $(wc -c < m2.s1) bytes of stage-1 assembly"
          ./stage1 < m2.s1 | ./stage0-as | ./elf upstream-g0
          [ -x upstream-g0 ] || { echo "    FAIL: no G0"; exit 1; }
          art 'G0 = upstream M2-Planet (our ladder)' upstream-g0

          say '8. G1 -- G0 compiles upstream source again, for the gate'
          # From here the patch is gone: our M2-Planet handles asm() perfectly
          # well, so G1 onward is built from upstream source exactly as shipped.
          set --
          while read -r f; do set -- "$@" -f "$f"; done < /in/flist.txt
          cd /in/m2
          /work/upstream-g0 --architecture aarch64 --bootstrap-mode "$@" -o /out/ours-gen1.M1
          cd /work
          art 'ours-gen1.M1' /out/ours-gen1.M1

          say '9. GATE 2 (non-blocking) -- link it with a toolchain we built'
          # Needs M1 + hex2 + blood-elf as RUNNING BINARIES. The only way to get
          # them without a host compiler is to build them with stage 2, and that
          # is blocked today: our M1 hangs in M2libc memset and our hex2 crashes
          # on exit (m1-loop.yml, spikes/UPSTREAM-PINS.md). Reported, not gated.
          # When stage 2 is fixed this turns green with no edit to this file.
          # Sources come from /in/M1-srcs.txt and /in/hex2-srcs.txt, derived in
          # the airlock from upstream's makefile. Do not inline a list here.
          build2() {  # build2 <name>
            o="$1"
            { cat /in/patched_bootstrap.c
              cat /src/stage2-pico-c/m2libc-shim.c
              cat /in/m2/M2libc/bootstrappable.c
              # FROM THE REWRITTEN TREE, NOT THE PINNED ONE.
              #
              # defines_to_enums.py writes pins/mescc-s2/ in the airlock; this
              # read pins/mescc/ and so consumed the untouched sources. The
              # rewrite ran, reported fourteen constants, and changed nothing --
              # stage 1's unresolved list came back byte-identical, which is the
              # most confusing possible way for a transformation to fail. A
              # producer with no consumer is not a no-op, it is a lie in the log.
              while read -r f; do cat "/in/mescc-s2/$f"; done < "/in/$o-srcs.txt"
            } > "$o.c" || { echo "    $o: could not assemble sources"; return 1; }
            ./stage2 < "$o.c" > "$o.s1" || { echo "    $o: stage2 rc=$?"; return 1; }
            # THE PIPELINE USED TO SWALLOW stage 1's VERDICT.
            #
            # `./stage1 | ./stage0-as | ./elf $o` takes its exit status from
            # elf, which happily emits a 120-byte ELF from an empty stream. So
            # stage 1 refusing on unresolved labels and stage 1 succeeding both
            # ended with `[ -x "$o" ]` true, and the log reported
            # `hex2 (ours) 120` as though it had built. Split the stages so each
            # is checked, and floor the size, because a linker is not 120 bytes.
            ./stage1 < "$o.s1" > "$o.s0" \
              || { echo "    $o: stage 1 refused -- unresolved labels"; return 1; }
            ./stage0-as < "$o.s0" | ./elf "$o" || return 1
            [ -x "$o" ] || return 1
            sz=$(wc -c < "$o")
            [ "$sz" -gt 4096 ] || { echo "    $o: $sz bytes -- a stub, not a build"; return 1; }
            art "  $o (ours)" "$o"
          }
          set +e
          build2 M1;   m1rc=$?
          build2 hex2; hxrc=$?
          # A COMPILE FAILURE IS NOW A FAILURE. The LINK stays advisory -- that
          # is what GATE 2 is for -- but "stage 2 could not compile M1 or hex2"
          # is a regression in stage 2 or in the derived source list, and it
          # used to print the same `SKIP the link` line as the blocker it was
          # tracking. Two very different conditions, one message, and the run
          # that shipped a short header list looked exactly like the six before
          # it.
          if [ "$m1rc" != 0 ] || [ "$hxrc" != 0 ]; then
            # SAY WHICH RUNG REFUSED. The first version of this message blamed
            # stage 2 for everything, and the run it fired on had stage 2
            # compiling hex2 perfectly well -- it was stage 1 rejecting
            # unresolved labels. build2 prints the real reason above; this line
            # must not overwrite it with a guess.
            echo "    FAIL: could not BUILD the tools (M1 rc=$m1rc hex2 rc=$hxrc)."
            echo "    The line above says which rung refused and why. A stage-2"
            echo "    rc is a compiler problem; 'stage 1 refused' is a missing"
            echo "    definition, so check the derived source lists first."
            exit 1
          fi
          if [ "$m1rc" = 0 ] && [ "$hxrc" = 0 ]; then
            echo "    both built -- trying the link (60s budget each)"
            timeout 60 ./M1 -f /in/m2/M2libc/aarch64/aarch64_defs.M1 \
                            -f /in/m2/M2libc/aarch64/libc-core.M1 \
                            -f /out/ours-gen1.M1 --little-endian \
                            --architecture aarch64 -o gen1.hex2
            echo "    our M1   rc=$? (124 = HUNG, the known memset defect)"
            timeout 60 ./hex2 -f /in/m2/M2libc/aarch64/ELF-aarch64.hex2 -f gen1.hex2 \
                            --little-endian --architecture aarch64 \
                            --base-address 0x400000 -o /out/gen1
            echo "    our hex2 rc=$?"
            [ -s /out/gen1 ] && art 'gen1 (linked, ours)' /out/gen1
          else
            echo "    SKIP the link: M1 rc=$m1rc hex2 rc=$hxrc"
            echo "    This is the measured blocker, not a surprise. See the header."
          fi
          set -e

          say '10. STAGE 3 -- micro-c compiles tcc, our M1 and hex2 link it'
          # EVERYTHING THIS STEP USES WAS BUILT IN THIS BOX. stage 2 from the
          # seed, micro-c from stage 2, M1 and hex2 from stage 2, and the link
          # by those. The only inputs are pinned source and busybox.
          #
          # NON-GATING on its first outing, like GATE 2 was: it reports where it
          # stops. What it must never do is report success it did not have, so
          # every artifact is size-checked, not just tested for existence -- the
          # 120-byte hex2 taught that lesson already.
          s3ok=yes
          # THE SAME REPLACE/OMIT RULES G0 USES, because this is the same
          # translation unit with a different source tree behind it.
          #
          # The first cut just catted every name in the list, and also
          # bootstrappable.c on top. That pulled in
          # M2libc/aarch64/linux/bootstrap.c with its six raw asm() bodies --
          # the very file patched_bootstrap.c REPLACES -- and M2libc/bootstrap.c
          # which the m71 rule omits. 399,620 bytes against G0's 215,485, and
          # stage 2 had no chance.
          {
            cat /in/patched_bootstrap.c
            cat /src/stage2-pico-c/m2libc-shim.c
            while read -r f; do
              case "$f" in
                M2libc/aarch64/linux/bootstrap.c) ;;
                M2libc/bootstrap.c) ;;
                *) cat "/in/microc/$f" ;;
              esac
            done < /in/microc-srcs.txt
          } > microc.c
          art 'microc.c (patched unit)' microc.c
          # AND EVERY RUNG REPORTS ITS OWN VERDICT. The first cut chained all
          # four with && and sent stderr to /dev/null, so "micro-c did not
          # build" was the entire diagnosis -- which is the fault I had just
          # finished fixing in build2, written again three steps later.
          set +e
          ./stage2 < microc.c > microc.s1 2>microc.e2; r2=$?
          ./stage1 < microc.s1 > microc.s0 2>microc.e1; r1=$?
          ./stage0-as < microc.s0 > microc.bin 2>microc.e0; r0=$?
          ./elf micro-c < microc.bin 2>microc.ee; re=$?
          set -e
          echo "    stage2 rc=$r2  stage1 rc=$r1  stage0-as rc=$r0  elf rc=$re"
          [ "$r2" = 0 ] || head -3 microc.e2 | sed 's/^/      stage2: /'
          [ "$r1" = 0 ] || head -3 microc.e1 | sed 's/^/      stage1: /'
          [ "$r0" = 0 ] || head -3 microc.e0 | sed 's/^/      stage0-as: /'
          if [ -x micro-c ] && [ "$(wc -c < micro-c)" -gt 65536 ]; then
            art 'micro-c (ours)' micro-c
          else
            echo "    micro-c did not build ($(wc -c < micro-c 2>/dev/null || echo 0) bytes)"
            s3ok=no
          fi

          if [ "$s3ok" = yes ]; then
            MCFLAGS='--architecture aarch64 --max-string 65536'
            L=/src/stage3/micro-c-libc
            # ours, patched -- see the airlock note above
            M=/in/m2libc-veron
            set +e
            ( cd /in/tcc-src && /work/micro-c $MCFLAGS --expand-includes \
                -D ONE_SOURCE=1 -D TCC_TARGET_LINUX=1 \
                -D CONFIG_TCC_STATIC=1 -I . -I "$L" -I "$M" \
                -f tcc.c -o /work/libtcc.M1 ) 2>/work/libtcc.err
            rc=$?
            set -e
            if [ "$rc" = 0 ] && [ -s libtcc.M1 ]; then
              echo "    libtcc.M1: $(wc -l < libtcc.M1) lines, $(grep -c '^:FUNCTION_' libtcc.M1) functions"
            else
              echo "    micro-c could not compile libtcc.c (rc=$rc)"
              head -3 /work/libtcc.err | sed 's/^/      /'
              s3ok=no
            fi
          fi

          if [ "$s3ok" = yes ]; then
            H="-f $M/stdarg.h -f $M/sys/types.h -f $M/stddef.h -f $M/signal.h -f $M/sys/utsname.h"
            set +e
            ./micro-c $MCFLAGS -f "$M/ctype.c" $H \
              -f "$M/aarch64/linux/unistd.c" -f "$M/aarch64/linux/fcntl.c" \
              -f "$M/fcntl.c" -f "$M/stdlib.c" -f "$M/string.c" \
              -f "$M/stdio.h" -f "$M/stdio.c" -f "$M/bootstrappable.c" -o m2libc.M1 2>/dev/null
            r1=$?
            ./micro-c $MCFLAGS -I "$L" -f "$L/impl/runtime.c"       -o runtime.M1 2>/dev/null; r2=$?
            ./micro-c $MCFLAGS -f "$L/impl/setjmp-aarch64.c"        -o setjmp.M1  2>/dev/null; r3=$?
            set -e
            if [ "$r1$r2$r3" = 000 ]; then
              echo "    runtime: m2libc $(grep -c '^:FUNCTION_' m2libc.M1), runtime $(grep -c '^:FUNCTION_' runtime.M1)"
            else
              echo "    runtime did not compile (rc: $r1 $r2 $r3)"
              s3ok=no
            fi
          fi

          if [ "$s3ok" = yes ]; then
            # CODE BEFORE STRINGS. Concatenating units naively interleaves their
            # string sections, so a function can land on an address that is not a
            # multiple of four and every call to it is SIGBUS on aarch64. This is
            # not an optimisation; without it nothing runs.
            : > tcc.code; : > tcc.glob; : > tcc.strs
            # THREE SECTIONS, NOT TWO. micro-c emits "# Core program", then
            # "# Program global variables", then "# Program strings". Splitting
            # only at the strings marker leaves each unit's GLOBALS glued to its
            # code, and a global holding a string is arbitrary-length data
            # between one unit's code and the next unit's functions. That was
            # harmless while libtcc.M1's globals happened to total a multiple of
            # four; tcc.c adds
            #     :GLOBAL_STORAGE_version "tcc version 0.9.28rc (AArch64 Linux)"
            # and every function after it lands misaligned. SIGBUS before main.
            for f in libtcc.M1 m2libc.M1 runtime.M1 setjmp.M1; do
              sed '/^# Program global variables$/,$d' "$f" >> tcc.code
              sed -n '/^# Program global variables$/,/^# Program strings$/p' "$f" \
                | sed '/^# Program strings$/d' >> tcc.glob
              sed -n '/^# Program strings$/,$p' "$f" >> tcc.strs
            done
            cat tcc.code tcc.glob tcc.strs > tcc-all.M1
            A=/in/m2libc-veron/aarch64
            # SAY WHAT IS BEING FED IN, BEFORE GUESSING WHY IT FAILED.
            #
            # `tcc-all.M1:20 :Received invalid other; ret` means M1 reached
            # print_hex with a token that has no Expression -- ret's DEFINE
            # never registered -- while mov_x0,x17 on the lines above did. Two
            # rounds went on hypotheses about that. The same M1 binary links
            # gen1 in GATE 2 above, and gen1's .M1 is LARGER, so it is not size
            # and not the binary. Print the inputs and stop theorising.
            echo "    inputs to M1:"
            for i in "$A/aarch64_defs.M1" "$A/libc-full.M1" tcc-all.M1; do
              printf '      %-44s %8s lines  %10s bytes\n' "$i" \
                "$(wc -l < "$i" 2>/dev/null || echo -)" \
                "$(wc -c < "$i" 2>/dev/null || echo -)"
            done
            echo "      DEFINE ret present: $(grep -c '^DEFINE ret ' "$A/aarch64_defs.M1" 2>/dev/null || echo 0)"
            echo "      per-part line counts, in join order:"
            for f in libtcc.M1 m2libc.M1 runtime.M1 setjmp.M1; do
              printf '        %-14s %8s lines  strings-marker: %s\n' "$f" \
                "$(wc -l < "$f")" "$(grep -c '^# Program strings$' "$f")"
            done
            echo "      tcc-all.M1 first 4 lines:"
            head -4 tcc-all.M1 | sed 's/^/        | /'
            echo "      tcc-all.M1 line 20: $(sed -n '20p' tcc-all.M1)"
            set +e
            timeout 300 ./M1 -f "$A/aarch64_defs.M1" -f "$A/libc-full.M1" \
                             -f tcc-all.M1 --little-endian --architecture aarch64 \
                             -o tcc-all.hex2
            m1rc=$?
            timeout 300 ./hex2 --architecture aarch64 --little-endian \
                             --base-address 0x400000 -f "$A/ELF-aarch64.hex2" \
                             -f tcc-all.hex2 -o /out/mc-tcc
            hxrc=$?
            set -e
            echo "    our M1 rc=$m1rc   our hex2 rc=$hxrc"
            if [ -s /out/mc-tcc ] && [ "$(wc -c < /out/mc-tcc)" -gt 262144 ]; then
              art 'mc-tcc (ours, end to end)' /out/mc-tcc
              chmod 0755 /out/mc-tcc
              printf 'int main(void) { return 7; }\n' > seven.c
              set +e
              # -B AND -I TAKE THEIR ARGUMENT ATTACHED. Separated, tcc reads
              # the next argv as the path's absence:
              #     tcc: error: argument to '-B' is missing
              # local-tcc.sh writes them attached, and I did not.
              timeout 25 /out/mc-tcc -B/in/tcc-src -I/in/tcc-src \
                          -c seven.c -o seven.o 2>/work/run7.err
              crc=$?
              set -e
              echo "    mc-tcc -c seven.c: rc=$crc, object $(wc -c < seven.o 2>/dev/null || echo 0) bytes"
              if [ "$crc" != 0 ] || [ ! -s seven.o ]; then
                grep -av '^[A-Z][0-9]*$' /work/run7.err | head -30 | sed 's/^/      /'
                s3ok=no
              fi

              # 00: DOES IT START AT ALL? Ask before anything else.
              #
              # When mc-tcc could not initialise -- a four-byte load of an
              # eight-byte pointer in dynarray_reset's `--*n` -- every one of
              # the twelve programs below reported the same rc=139, and the log
              # said nothing about which of thirteen things was wrong. One line
              # here separates "the compiler is broken" from "the compiler
              # compiles the wrong code", and those are different
              # investigations.
              set +e
              timeout 60 /out/mc-tcc --version >v.out 2>&1; vrc=$?
              set -e
              echo "    00-does-it-start            rc=$vrc  $(grep -av '^[A-Z][0-9]*$' v.out | head -1)"
              if [ "$vrc" -gt 128 ]; then
                echo "      IT DOES NOT START. Everything below will fail for this"
                echo "      reason and not for its own; read this line, not those."
                s3ok=no
              fi

              # THAT mc-tcc EXISTS IS NOT THE QUESTION. tcc-two-ways has
              # built one for a long time; what is new here is that this one is
              # hermetic. What matters is whether the tcc it produces WORKS,
              # and compiling to an object does not ask that: the last real
              # fault was a valid aarch64 ELF that ran, exited 0 and printed
              # nothing, because a GOT entry was never allocated.
              #
              # So: twelve programs, each COMPILED AND RUN, asking a little
              # more each time -- a constant, arithmetic, loops, recursion,
              # pointers, structs, globals in .bss, a string literal,
              # char/switch/goto, an indirect call, and finally the two shapes
              # that micro-c's own difftest cases 14 and 61 cover: a function
              # pointer held in a struct member, and prefix ++/-- applied
              # through a dot. Those two are here because they are the ones
              # currently breaking when micro-c's int becomes four bytes, and
              # seeing them run against the tcc we built says whether the tcc
              # has the same hole. Every one is
              # freestanding: its own _start, exit by syscall, no libc and no
              # crt, so the only code in the binary is the code under test.
              #
              # Most report through the EXIT CODE, which is the least a shell
              # can misread. Number 08 writes to stdout instead, because a
              # string literal is an address in .data and that is exactly the
              # class that failed silently before.
              # THE SUITE. Ten programs, each compiled and RUN, one at a time.
              #
              # Written with printf because a heredoc terminator cannot be indented
              # and every line here must be. No harness, no python -- busybox alone
              # feeds each one to the compiler we built and reads back what it did.
              prologue() {
                printf '%s\n' 'static long sys3(long n, long a, long b, long c)' >> "$1"
                printf '%s\n' '{' >> "$1"
                printf '%s\n' '    register long x8 __asm__("x8") = n;' >> "$1"
                printf '%s\n' '    register long x0 __asm__("x0") = a;' >> "$1"
                printf '%s\n' '    register long x1 __asm__("x1") = b;' >> "$1"
                printf '%s\n' '    register long x2 __asm__("x2") = c;' >> "$1"
                printf '%s\n' '    __asm__ __volatile__("svc #0" : "+r"(x0) : "r"(x8), "r"(x1), "r"(x2) : "memory");' >> "$1"
                printf '%s\n' '    return x0;' >> "$1"
                printf '%s\n' '}' >> "$1"
                printf '%s\n' 'int run(void);' >> "$1"
                printf '%s\n' 'void _start(void) { sys3(93, run(), 0, 0); }' >> "$1"
              }
              tc() {  # tc <label> <want_exit> <want_output>
                set +e
                timeout 25 /out/mc-tcc -B/in/tcc-src -I/in/tcc-src \
                            -nostdlib -static -o t.bin t.c 2>t.err
                crc=$?
                set -e
                if [ "$crc" != 0 ] || [ ! -s t.bin ]; then
                  printf "    %-26s COMPILE FAILED rc=%s\n" "$1" "$crc"
                  grep -av '^[A-Z][0-9]*$' t.err | head -2 | sed 's/^/        /'
                  s3ok=no; return
                fi
                chmod 0755 t.bin
                set +e; tout=$(timeout 20 ./t.bin 2>&1); trc=$?; set -e
                if [ "$trc" = "$2" ] && [ "$tout" = "$3" ]; then v=ok; else v="WRONG (want exit=$2 out=[$3])"; s3ok=no; fi
                printf "    %-26s exit=%-4s out=[%s] %s\n" "$1" "$trc" "$tout" "$v"
              }
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void) { return 42; }' >> t.c
              tc 01-return-a-value 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void) { int a; a = 7; return a * 6 + 12 / 4 - 3 % 2; }' >> t.c
              tc 02-arithmetic 44 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    int i; int s;' >> t.c
              printf '%s\n' '    s = 0; i = 1;' >> t.c
              printf '%s\n' '    while (i <= 10) { s = s + i; i = i + 1; }' >> t.c
              printf '%s\n' '    if (s == 55) return s;' >> t.c
              printf '%s\n' '    return 1;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 03-loops-and-if 55 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int fact(int n) { if (n < 2) return 1; return n * fact(n - 1); }' >> t.c
              printf '%s\n' 'int run(void) { return fact(5); }' >> t.c
              tc 04-recursion 120 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    int a[4]; int *p; int s;' >> t.c
              printf '%s\n' '    a[0] = 1; a[1] = 2; a[2] = 3; a[3] = 4;' >> t.c
              printf '%s\n' '    p = a; s = 0;' >> t.c
              printf '%s\n' '    while (p < a + 4) { s = s + *p; p = p + 1; }' >> t.c
              printf '%s\n' '    return s;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 05-pointers-and-arrays 10 ""
              : > t.c; prologue t.c
              printf '%s\n' 'struct P { int x; int y; };' >> t.c
              printf '%s\n' 'int total(struct P *p) { return p->x + p->y; }' >> t.c
              printf '%s\n' 'int run(void) { struct P p; p.x = 20; p.y = 22; return total(&p); }' >> t.c
              tc 06-structs-by-pointer 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int g[3];' >> t.c
              printf '%s\n' 'int zero;' >> t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    g[0] = 10; g[1] = 20; g[2] = 12;' >> t.c
              printf '%s\n' '    return g[0] + g[1] + g[2] + zero;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 07-globals-and-bss 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void) { sys3(64, 1, (long)"strings work", 12); return 0; }' >> t.c
              tc 08-string-literal-write 0 "strings work"
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    char c; int r;' >> t.c
              printf '%s\n' '    c = 65; r = 0;' >> t.c
              printf '%s\n' '    switch (c) { case 65: r = 40; break; default: r = 1; }' >> t.c
              printf '%s\n' '    if (r == 40) goto done;' >> t.c
              printf '%s\n' '    return 2;' >> t.c
              printf '%s\n' 'done:' >> t.c
              printf '%s\n' '    return r + 2;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 09-char-switch-and-goto 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int add(int a, int b) { return a + b; }' >> t.c
              printf '%s\n' 'int mul(int a, int b) { return a * b; }' >> t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    int (*f)(int, int);' >> t.c
              printf '%s\n' '    f = add;' >> t.c
              printf '%s\n' '    if (f(20, 21) != 41) return 1;' >> t.c
              printf '%s\n' '    f = mul;' >> t.c
              printf '%s\n' '    return f(6, 7);' >> t.c
              printf '%s\n' '}' >> t.c
              tc 10-function-pointers 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int do_add(int a, int b) { return a + b; }' >> t.c
              printf '%s\n' 'int do_mul(int a, int b) { return a * b; }' >> t.c
              printf '%s\n' 'struct Ops { int (*add)(int, int); int (*mul)(int, int); int tag; };' >> t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    struct Ops o; struct Ops *p;' >> t.c
              printf '%s\n' '    o.add = do_add; o.mul = do_mul; o.tag = 3;' >> t.c
              printf '%s\n' '    if (o.add(2, 3) != 5) return 1;' >> t.c
              printf '%s\n' '    if (o.mul(4, 5) != 20) return 2;' >> t.c
              printf '%s\n' '    if (o.tag != 3) return 3;' >> t.c
              printf '%s\n' '    p = &o;' >> t.c
              printf '%s\n' '    if (p->add(10, 1) != 11) return 4;' >> t.c
              printf '%s\n' '    if (p->mul(6, 7) != 42) return 5;' >> t.c
              printf '%s\n' '    return 0;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 11-function-pointer-member 0 ""
              : > t.c; prologue t.c
              printf '%s\n' 'struct S { char *str; int len; int c; };' >> t.c
              printf '%s\n' 'struct S gs;' >> t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    struct S s; char buf[4]; int r;' >> t.c
              printf '%s\n' '    r = 0;' >> t.c
              printf '%s\n' '    s.len = 3; --s.len; if (s.len != 2) r = r + 1;' >> t.c
              printf '%s\n' '    s.c = 5;   ++s.c;   if (s.c != 6)   r = r + 2;' >> t.c
              printf '%s\n' '    buf[0] = 97; buf[1] = 98; buf[2] = 99;' >> t.c
              printf '%s\n' '    s.str = buf; s.len = 3;' >> t.c
              printf '%s\n' '    if (s.str[--s.len] != 99) r = r + 4;' >> t.c
              printf '%s\n' '    if (s.len != 2) r = r + 8;' >> t.c
              printf '%s\n' '    gs.len = 3; --gs.len; if (gs.len != 2) r = r + 16;' >> t.c
              printf '%s\n' '    return r;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 12-prefix-operator-through-a-dot 0 ""
            else
              echo "    no mc-tcc produced ($(wc -c < /out/mc-tcc 2>/dev/null || echo 0) bytes)"
              s3ok=no
            fi
          fi
          echo "    stage 3 end to end: $s3ok"

          say "11. tcc's OWN TEST SUITE -- every tests2 program, compiled and run"
          # tcc ships 129 programs in tests/tests2, each with a .expect file
          # holding the exact output it must produce. They want <stdio.h>, a
          # printf and something to call main() -- none of which this box has,
          # so spikes/stage3/tcc-test-shim supplies them in C that mc-tcc
          # compiles itself. No make, no configure, no harness: two source
          # files in, one binary out, output compared against tcc's own file.
          #
          # .expect IS THE WHOLE CRITERION, AND THAT IS DELIBERATE. tcc-two-ways
          # builds a gcc control from the same source and uses it to decide
          # which tests are even applicable -- a test the control cannot pass is
          # measuring a gap in the shim (no malloc, no file I/O, no floats)
          # rather than a defect in the compiler we built. THERE IS NO CONTROL
          # IN HERE, because a control needs gcc and gcc is not in the budget.
          # So this step does not attribute its failures: it reports how many of
          # tcc's own programs a seed-built tcc reproduces byte for byte, which
          # is a number that needs no control to be true. Read the attribution
          # off tcc-two-ways; read the count off here.
          #
          # 00_assignment IS STILL THE GATE. It is the simplest program in the
          # suite and the one stage 3 has always been measured on, so it alone
          # moves s3ok. Everything else here is measured and reported and never
          # fails the run -- see the note on step 13 for why that is the right
          # way round while the frontier is still moving.
          SH=/src/stage3/tcc-test-shim
          T2=/in/tcc-src/tests/tests2

          # COMPARE THE WAY tcc COMPARES, which is not byte for byte and is
          # not the program's stdout alone.
          #
          #     T3 = $(FILTER) >$*.output 2>&1 ... diff -Nbu %.expect $*.output
          #     FILTER = 2>&1 | sed -e 's,$(SRC)/,,g'      tests2/Makefile:126,142
          #
          # TWO THINGS FOLLOW FROM THAT AND NEITHER WAS BEING DONE.
          #
          # 1. THE COMPILER'S OWN DIAGNOSTICS ARE PART OF THE EXPECTED OUTPUT.
          # tcc runs one command -- `tcc -run prog.c` -- and captures compile
          # warnings and program output into the same file, in that order.
          # Three .expect files begin with a warning line:
          #     03_struct.expect     03_struct.c:14: warning: attribute ...
          #     102_alignas.expect   102_alignas.c:4: warning: type defaults to int
          #     33_ternary_op.expect 33_ternary_op.c:26: warning: pointer/integer ...
          # This step compiled to t2.err and ran to t2.out and compared only
          # t2.out, so all three were reported as "RAN, output differs" -- which
          # reads as wrong codegen and is a missing warning line. mc-tcc emits
          # the warnings; nothing was looking at them.
          #
          # 2. THE SOURCE DIRECTORY IS STRIPPED. tcc's tests run out of tree and
          # its FILTER removes $(SRC)/ from every path, so the .expect files
          # carry bare filenames. Here the compiler is handed
          # /in/tcc-src/tests/tests2/03_struct.c, so both its diagnostics and
          # any __FILE__ the program prints carry that prefix -- which is why
          # 129_scopes differed on all thirty of its lines while every
          # assertion in it said `ok`.
          #
          # The whitespace rule below is unchanged and is `diff -b`: runs of
          # whitespace collapse, trailing whitespace goes, and command
          # substitution strips the trailing newline so a missing final one
          # stops mattering. It is NOT a general diff -b, and it deliberately
          # does not ignore blank lines -- `-B` is not in tcc's flags either.
          norm() {
            sed -e "s;$T2/;;g" \
                -e 's/[[:space:]][[:space:]]*/ /g' \
                -e 's/[[:space:]]*$//' "$1"
          }
          same_output() {
            _a=$(norm "$1")
            _b=$(norm "$2")
            [ "$_a" = "$_b" ]
          }

          # THE COMPILER'S OUTPUT, MINUS micro-c's MARKER TRAIL. Instrumented
          # builds print bare markers to stderr; they are not diagnostics and
          # must not enter the comparison.
          diagnostics() {
            grep -av '^[A-Z][0-9]*$' "$1" 2>/dev/null || true
          }

          # NOT APPLICABLE IN THIS BOX -- AND EVERY LINE CITES tcc's OWN
          # Makefile RATHER THAN OUR JUDGEMENT.
          #
          # tcc does not run all 127 of these either. Its Makefile skips some by
          # architecture and gives others flags that need a runtime this box
          # does not have: -b wants bcheck out of libtcc1.a, -dt is a -run mode
          # that needs the in-memory loader, -pthread and -lm want libraries,
          # 113_btdll builds two shared objects. Running them anyway and
          # counting the failures made the denominator mean nothing: 34 is
          # listed here because tcc SKIPS it -- "array assignment is not in C
          # standard", Makefile:11 -- so mc-tcc rejecting it was CORRECT and was
          # being scored as a defect.
          #
          # These are reported by name with the reason and are out of the
          # denominator. Nothing here is excluded for failing; each is excluded
          # for needing something the box does not have, decided before the run.
          not_applicable() {
            case "$1" in
              34_array_assignment)
                echo "tcc skips it too -- Makefile:11, array assignment is not in C" ;;
              98_al_ax_extend|99_fastcall)
                echo "i386 only -- Makefile:16" ;;
              85_asm-outside-function|127_asm_goto)
                echo "hardcodes x86 asm -- Makefile:19-20" ;;
              112_backtrace|114_bound_signal|115_bound_setjmp|116_bound_setjmp2|126_bound_global|132_bound_test)
                echo "needs -b, and bcheck lives in libtcc1.a -- Makefile:102,116-118,131,134" ;;
              113_btdll)
                echo "builds two shared libraries -- Makefile:106-110" ;;
              60_errors_and_warnings|96_nodata_wanted|125_atomic_misc|128_run_atexit)
                echo "needs -dt, which is a -run mode -- Makefile:75-76,130,133" ;;
              117_builtins)
                echo "runs twice under -run -- Makefile:119" ;;
              106_versym|124_atomic_counter)
                echo "needs -pthread -- Makefile:92,132" ;;
              22_floating_point|24_math_library)
                echo "needs -lm -- Makefile:70-71" ;;
              46_grep)
                echo "args name a file it opens; the shim has no file I/O -- Makefile:60" ;;
              *) echo "" ;;
            esac
          }

          # tests2/Makefile:59 runs 31_args with five arguments and its .expect
          # carries argc==6. Run with none, a CORRECT binary prints 1 and is
          # counted against the compiler -- which is how the shim's missing
          # argv was charged to codegen for as long as it was missing.
          args_for() {
            case $1 in
              31_args) echo "arg1 arg2 arg3 arg4 arg5" ;;
              *)       echo "" ;;
            esac
          }

          if [ -s /out/mc-tcc ]; then
            t2pass=0; t2diff=0; t2cf=0; t2nf=0; t2n=0; t2na=0
            : > t2-fail.txt
            : > t2-na.txt
            for c in "$T2"/*.c; do
              [ -e "$c" ] || continue
              b=${c##*/}; b=${b%.c}
              [ -f "$T2/$b.expect" ] || continue
              na=$(not_applicable "$b")
              if [ -n "$na" ]; then
                t2na=$((t2na + 1))
                printf '    %-34s %s\n' "$b" "$na" >> t2-na.txt
                continue
              fi
              t2n=$((t2n + 1))
              # THE SECOND TRANSLATION UNIT, WHERE THERE IS ONE. Two tests are
              # built from two files:
              #     104_inline.test : FLAGS += $(subst 104,104+,$1)   Makefile:86
              #     120_alias.test  : FLAGS += $(subst 120,120+,$1)   Makefile:90
              # so 104_inline.c is compiled with 104+_inline.c and 120_alias.c
              # with 120+_alias.c. Handing over only the first file left the
              # second unit's symbols undefined, and the link failed with
              #     undefined symbol 'check_exports'      (104)
              #     undefined symbol 'inunit2'            (120)
              # which was recorded as a link defect. It is a missing file, and
              # supplying it makes these two the only multi-unit tests in the
              # sweep -- which is worth having, because stage 4 is nothing but
              # multi-unit builds.
              extra=""
              if [ -f "$T2/${b%%_*}+_${b#*_}.c" ]; then
                extra="$T2/${b%%_*}+_${b#*_}.c"
              fi
              # REMOVED BEFORE, NOT AFTER. A failed compile leaves the PREVIOUS
              # test's binary sitting there, `[ ! -s t2.bin ]` is then false,
              # and the run that follows reads a stale binary and reports its
              # output as this test's. This file already records that exact
              # mistake costing two local results.
              rm -f t2.bin t2.out t2.err t2.all
              set +e
              timeout 60 /out/mc-tcc -B/in/tcc-src -I"$SH" -nostdlib -static \
                          -o t2.bin "$c" $extra "$SH/crt.c" 2>t2.err
              c2=$?
              set -e
              if [ "$c2" != 0 ] || [ ! -s t2.bin ]; then
                t2cf=$((t2cf + 1))
                # THE WHOLE MESSAGE, NOT 58 COLUMNS OF IT. Every one of these
                # was truncated mid-word, so "error: include fi" and "error:
                # type 'con" were the entire diagnosis and each one needed a
                # local reproduction to read. Three lines, untruncated, costs
                # nothing and is usually the answer.
                printf '    %-34s COMPILE rc=%s\n' "$b" "$c2" >> t2-fail.txt
                if [ "$c2" -gt 128 ]; then
                  printf '        SIGNAL %s during compile\n' "$((c2 - 128))" >> t2-fail.txt
                else
                  diagnostics t2.err | head -3 | sed "s;$T2/;;g; s/^/        /" >> t2-fail.txt
                fi
              else
                chmod 0755 t2.bin
                set +e; timeout 25 ./t2.bin $(args_for "$b") > t2.out 2>&1; r2=$?; set -e
                # DIAGNOSTICS FIRST, THEN THE PROGRAM -- the order tcc's own
                # single `-run` invocation produces, and the order the .expect
                # files carry.
                diagnostics t2.err > t2.all
                cat t2.out >> t2.all
                # EXIT 71 IS THE SHIM REFUSING A FLOAT, not a wrong answer.
                # tcc-test-shim aborts 70 when IT is incomplete and 71 when the
                # conversion is fine and micro-c cannot hold the value. Ten of
                # these were being counted as "output differs", which reads as
                # a codegen defect and is not one: they are the float hole,
                # and there is nothing to fix in the shim until micro-c grows
                # floating point. Counted separately so the number this step
                # reports means what it says.
                if [ "$r2" = 71 ]; then
                  t2nf=$((t2nf + 1))
                  printf '    %-34s blocked on floating point in micro-c\n' "$b" >> t2-fail.txt
                elif same_output t2.all "$T2/$b.expect"; then
                  t2pass=$((t2pass + 1))
                else
                  t2diff=$((t2diff + 1))
                  printf '    %-34s RAN, output differs\n' "$b" >> t2-fail.txt
                  # THE FIRST DIFFERING LINE, BOTH SIDES. "output differs" on
                  # its own is a fact with no lead in it; two lines here is
                  # the difference between knowing which test to reproduce and
                  # knowing what it did.
                  norm t2.all           | head -40 > t2.a
                  norm "$T2/$b.expect"  | head -40 > t2.b
                  awk 'NR==FNR{e[NR]=$0;next}
                       {if ($0 != e[FNR]) {
                          printf "        got     : %s\n", $0
                          printf "        expected: %s\n", e[FNR]
                          exit } }' t2.b t2.a >> t2-fail.txt
                fi
              fi
              # THE GATE, measured inside the same loop so it cannot drift from
              # the sweep the way a separately-written copy of one test would.
              if [ "$b" = 00_assignment ]; then
                if [ "$c2" != 0 ] || [ ! -s t2.bin ]; then
                  echo "    00_assignment: COMPILE FAILED rc=$c2"
                  diagnostics t2.err | head -30 | sed 's/^/        /'
                  s3ok=no
                elif same_output t2.all "$T2/$b.expect"; then
                  echo "    00_assignment: exit ok, MATCHES tcc's OWN .expect FILE"
                  sed 's/^/        /' t2.all
                else
                  echo "    00_assignment: DIFFERS from tcc's .expect"
                  echo "      got:"      ; sed 's/^/        /' t2.all
                  echo "      expected:" ; sed 's/^/        /' "$T2/$b.expect"
                  s3ok=no
                fi
              fi
            done
            echo
            echo "    tests2: $t2pass of $t2n APPLICABLE programs match tcc's own .expect"
            echo "            $t2diff ran with different output, $t2cf would not compile"
            echo "            $t2nf blocked on floating point in micro-c, not on the shim"
            echo "            $t2na not applicable in this box, by tcc's own Makefile"
            if [ -s t2-fail.txt ]; then
              echo "    the ones that did not:"
              head -120 t2-fail.txt
              [ "$(wc -l < t2-fail.txt)" -gt 120 ] && echo "    ... $(( $(wc -l < t2-fail.txt) - 120 )) more"
            fi
            if [ -s t2-na.txt ]; then
              echo "    not applicable, and why:"
              cat t2-na.txt
            fi
          else
            echo "    skipped: no mc-tcc was produced"
            s3ok=no
          fi

          say "12. tcctest.c -- the file tcc's own test1/test2/test3 begin with"
          # tcc's Makefile runs test1 as
          #     tcc -run tcc.c -run tcctest.c
          # so tcctest.c is the gate for all three of test1, test2 and test3:
          # nothing downstream of it can be measured until it compiles. It is
          # one 3,600-line file exercising most of C, which makes it a much
          # wider net than tests2 and a single yes/no rather than a score.
          #
          # NOT RUN, ONLY COMPILED. Running it needs a libc this box does not
          # have; compiling it is the part that is about our compiler.
          if [ -s /out/mc-tcc ] && [ -f "$T2/../tcctest.c" ]; then
            rm -f tcctest.o tt.err
            set +e
            timeout 120 /out/mc-tcc -B/in/tcc-src -I/in/tcc-src -I"$SH" \
                        -w -c -o tcctest.o "$T2/../tcctest.c" 2>tt.err
            ttrc=$?
            set -e
            if [ "$ttrc" = 0 ] && [ -s tcctest.o ]; then
              echo "    tcctest.c: COMPILES -- $(wc -c < tcctest.o) byte object"
              echo "    test1/test2/test3 are reachable; they need -run and a libc"
            else
              echo "    tcctest.c: does NOT compile, rc=$ttrc"
              [ "$ttrc" -gt 128 ] && echo "      SIGNAL $((ttrc - 128))"
              grep -av '^[A-Z][0-9]*$' tt.err | head -6 | sed 's/^/      /'
              echo "      test1/test2/test3 cannot start until this compiles"
            fi
          else
            echo "    skipped: no mc-tcc, or no tcctest.c in the pinned tree"
          fi

          say '13. SELF-COMPILATION -- toward gen2 == gen3'
          # THE QUESTION THIS RUNG EXISTS TO ANSWER. tcc-two-ways shows the gcc
          # side reaching a fixpoint -- gen1 builds gen2 builds gen3 and the last
          # two are byte-identical -- and that is the property a self-hosting
          # compiler has. Our side has never been measured against it, so this
          # walks the same three steps and reports exactly which one it stops on.
          #
          # IT IS EXPECTED TO STOP, AND IT STILL RUNS EVERY TIME. A step that
          # only runs once the thing already works tells you nothing on the way
          # there; the useful output while a frontier is moving is WHICH step and
          # WHAT ERROR, recorded every run so a change that moves it by one step
          # is visible immediately. Nothing here touches s3ok.
          if [ -s /out/mc-tcc ]; then
            # THE INCLUDE ORDER IS PART OF THE TEST, so it is written down.
            # tcc's OWN include/ comes first: gen1 is a real tcc and its
            # stdarg.h is the one it is entitled to. M2libc's stdarg.h is
            # written in M2-Planet's dialect and a real tcc cannot parse it --
            # searched first, it fails on line 21 and the run says nothing
            # about our compiler. micro-c-libc and M2libc follow, for the
            # headers this box has no system copy of.
            L=/src/stage3/micro-c-libc
            M=/in/m2libc-veron
            INC="-I . -I /in/tcc-src/include -I $L -I $M"
            # LONG DOUBLE IS double HERE, AND tcc HAS A SWITCH FOR SAYING SO.
            # micro-c maps float, double and long double to one word-sized
            # type, so the tcc it builds cannot represent a long double and
            # tcc's own guard fires on its own source:
            #     tccpp.c:2398: error: can't cross compile long double constants
            # TCC_USING_DOUBLE_FOR_LDOUBLE selects the double-based branch that
            # tcc already carries for exactly this case. It is honest rather
            # than a workaround -- it makes the build say what is true -- and
            # it is NOT sufficient on its own: more long-double constants
            # follow at tccgen.c:2580. Left in so the reported stopping point
            # is the real capability gap and not the first spelling of it.
            LD1="-D TCC_USING_DOUBLE_FOR_LDOUBLE=1"
            # A HEADER ERROR HERE IS A LIBRARY GAP, NOT A CODEGEN RESULT, and
            # the two are worth keeping apart. micro-c-libc was written for
            # micro-c, which has the fixed-width types built in; a real tcc
            # wants them declared, so time.h stops on int32_t. That is a real
            # obstacle to self-hosting and it is not a defect in gen1. Read a
            # header error as "the runtime headers are the next piece of work".
            echo "    gen1: mc-tcc, built by micro-c from the seed"
            printf '      %10s bytes  %s\n' \
              "$(wc -c < /out/mc-tcc)" "$(sha256sum /out/mc-tcc | cut -c1-16)"

            # STEP A -- can gen1 compile tcc's source at all? This is the part
            # that is purely about code generation, before any linking question.
            # Same rule as the loop above: clear every artefact first, so a
            # failed step cannot be read through a file an earlier one left.
            rm -f gen2.o gen3.o gen2 gen3 rt.o sj.o
            set +e
            ( cd /in/tcc-src && timeout 900 /out/mc-tcc \
                -D ONE_SOURCE=1 -D TCC_TARGET_LINUX=1 -D CONFIG_TCC_STATIC=1 \
                -B /in/tcc-src $INC \
                -w -c -o /work/gen2.o tcc.c ) 2>/work/gen2.err
            g2rc=$?
            set -e
            if [ "$g2rc" = 0 ] && [ -s gen2.o ]; then
              echo "    step A: gen1 COMPILES tcc.c -- $(wc -c < gen2.o) byte object"
            else
              echo "    step A: gen1 cannot compile tcc.c, rc=$g2rc"
              [ "$g2rc" -gt 128 ] && echo "      SIGNAL $((g2rc - 128))"
              grep -av '^[A-Z][0-9]*$' /work/gen2.err | head -6 | sed 's/^/      /'
              echo "      STOPS HERE. gen2 cannot be built, so gen3 and the"
              echo "      fixpoint are not attempted this run."
            fi

            # STEP B -- link gen2. The runtime under it is the same one mc-tcc
            # itself stands on, compiled here by gen1 rather than by micro-c,
            # which is the part that makes this self-compilation rather than a
            # rebuild with someone else's libc.
            #
            # SETJMP IS THE ONE FILE THAT CANNOT WORK AS WRITTEN, and it is
            # worth saying why here rather than reading rc=1 as a codegen
            # result. impl/setjmp-aarch64.c is written in M2libc's MACRO
            # dialect --
            #     asm("mov_x0,x17" "sub_x0,x0,8" "ldr_x0,[x0]")
            # -- which are names in aarch64_defs.M1, not aarch64 mnemonics.
            # Only micro-c can compile that file, by construction; its own
            # header says so. gen1 is a real tcc with a real arm64 inline
            # assembler and will reject every line of it.
            #
            # It also saves the wrong registers for gen2. That file saves
            # x13/x17/x18/lr because that is micro-c's calling convention.
            # gen2.o is compiled by mc-tcc, which emits ordinary AAPCS, so
            # what gen2 needs is an ordinary aarch64 setjmp: x19-x28, d8-d15,
            # fp, lr and sp.
            #
            # So the step prefers impl/setjmp-aarch64-tcc.c when that file
            # exists and falls back to the micro-c one otherwise, reporting
            # which it used. Dropping the tcc-dialect version in is then the
            # whole change -- no edit here.
            if [ "$g2rc" = 0 ] && [ -s gen2.o ]; then
              SJ="$L/impl/setjmp-aarch64.c"
              sjnote="micro-c dialect -- cannot compile under a real tcc, see below"
              if [ -f "$L/impl/setjmp-aarch64-tcc.c" ]; then
                SJ="$L/impl/setjmp-aarch64-tcc.c"
                sjnote="tcc dialect, AAPCS"
              fi
              echo "    step B: setjmp source is $(basename "$SJ") ($sjnote)"
              set +e
              timeout 300 /out/mc-tcc -B/in/tcc-src -I"$L" -I"$M" -w -c \
                          -o rt.o "$L/impl/runtime.c" 2>rt.err
              rtrc=$?
              timeout 300 /out/mc-tcc -B/in/tcc-src -I"$L" -I"$M" -w -c \
                          -o sj.o "$SJ" 2>sj.err
              sjrc=$?
              set -e
              if [ "$rtrc" != 0 ] || [ "$sjrc" != 0 ]; then
                echo "    step B: the runtime will not compile (runtime rc=$rtrc, setjmp rc=$sjrc)"
                # THE ERROR FILE HAS TO MATCH THE RUNG THAT FAILED. This
                # printed rt.err unconditionally, so the run that stopped on
                # setjmp reported three blank lines: runtime had succeeded and
                # its error file was empty. A diagnostic that names the wrong
                # file is worse than none, because it reads as "no output".
                if [ "$rtrc" != 0 ]; then
                  grep -av '^[A-Z][0-9]*$' rt.err | head -3 | sed 's/^/      runtime: /'
                fi
                if [ "$sjrc" != 0 ]; then
                  grep -av '^[A-Z][0-9]*$' sj.err | head -3 | sed 's/^/      setjmp:  /'
                fi
              else
                set +e
                timeout 300 /out/mc-tcc -B/in/tcc-src -nostdlib -static \
                            -o gen2 gen2.o rt.o sj.o 2>lk.err
                lkrc=$?
                set -e
                if [ "$lkrc" = 0 ] && [ -s gen2 ]; then
                  chmod 0755 gen2
                  echo "    step B: gen2 LINKS"
                  printf '      %10s bytes  %s\n' \
                    "$(wc -c < gen2)" "$(sha256sum gen2 | cut -c1-16)"
                else
                  echo "    step B: gen2 will not link, rc=$lkrc"
                  grep -av '^[A-Z][0-9]*$' lk.err | head -6 | sed 's/^/      /'
                  echo "      STOPS HERE."
                fi
              fi
            fi

            # STEP C -- gen2 compiles tcc.c, and gen3 must match gen2 byte for
            # byte. THE COMPARISON IS gen2 AGAINST gen3, NEVER gen1 AGAINST
            # gen2: gen1 was built by a different compiler, so it is entitled to
            # differ. Two successive generations from the SAME compiler are not.
            if [ -s gen2 ] && [ -x gen2 ]; then
              set +e
              ( cd /in/tcc-src && timeout 900 /work/gen2 \
                  -D ONE_SOURCE=1 -D TCC_TARGET_LINUX=1 -D CONFIG_TCC_STATIC=1 \
                  -B /in/tcc-src $INC \
                  -w -c -o /work/gen3.o tcc.c ) 2>/work/gen3.err
              g3rc=$?
              set -e
              if [ "$g3rc" != 0 ] || [ ! -s gen3.o ]; then
                echo "    step C: gen2 cannot compile tcc.c, rc=$g3rc"
                grep -av '^[A-Z][0-9]*$' /work/gen3.err | head -6 | sed 's/^/      /'
              else
                set +e
                timeout 300 /work/gen2 -B/in/tcc-src -nostdlib -static \
                            -o gen3 gen3.o rt.o sj.o 2>lk3.err
                l3rc=$?
                set -e
                if [ "$l3rc" = 0 ] && [ -s gen3 ]; then
                  printf '    gen2  %10s bytes  %s\n' \
                    "$(wc -c < gen2)" "$(sha256sum gen2 | cut -c1-16)"
                  printf '    gen3  %10s bytes  %s\n' \
                    "$(wc -c < gen3)" "$(sha256sum gen3 | cut -c1-16)"
                  if cmp -s gen2 gen3; then
                    echo "    FIXPOINT: gen2 and gen3 are byte-identical"
                  else
                    echo "    NO FIXPOINT: gen2 and gen3 differ"
                  fi
                else
                  echo "    step C: gen3 will not link, rc=$l3rc"
                  grep -av '^[A-Z][0-9]*$' lk3.err | head -4 | sed 's/^/      /'
                fi
              fi
            fi
          else
            echo "    skipped: no mc-tcc was produced"
          fi

          say 'DONE -- inside the box'
          cp m2.c /out/m2.c 2>/dev/null || true
          EOS
          chmod +x "$BOX/work/run.sh"

      # --- RUN THE BOX ----------------------------------------------------
      - name: 'IN THE BOX: seed -> stage1 -> stage2 -> micro-c -> tcc'
        run: |
          set -eu
          bwrap \
            --unshare-all --die-with-parent --new-session --clearenv \
            --setenv PATH /bin \
            --setenv HOME /work \
            --setenv LC_ALL POSIX \
            --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --setenv LD_LIBRARY_PATH /lib \
            --bind "$BOX" / \
            --ro-bind "$PWD/spikes" /src \
            --ro-bind "$PWD/pins" /in \
            --bind "$BOX/out" /out \
            --proc /proc --dev /dev --tmpfs /tmp \
            --chdir /work \
            /bin/sh /work/run.sh

      # --- OUT OF THE BOX -------------------------------------------------
      - name: 'GATE 1: our seed-built compiler matches upstream, byte for byte'
        run: |
          set -eu
          A="$BOX/out/ours-gen1.M1"
          B=oracle/ref-gen1.M1
          [ -s "$A" ] || { echo "FAIL: the box produced no ours-gen1.M1"; exit 1; }
          echo
          printf '  %-28s %10s  %s\n' 'ARTIFACT' 'BYTES' 'SHA256[0:16]'
          printf '  %-28s %10s  %s\n' 'ref-gen1.M1  (host gcc)' \
            "$(wc -c < "$B")" "$(sha256sum "$B" | cut -c1-16)"
          printf '  %-28s %10s  %s\n' 'ours-gen1.M1 (our ladder)' \
            "$(wc -c < "$A")" "$(sha256sum "$A" | cut -c1-16)"
          echo
          if cmp -s "$A" "$B"; then
            echo "PASS: a compiler built from hand-written ARM64 assembly, on ARM64"
            echo "      hardware, inside a sealed box whose entire host budget is"
            # EMPTY IS THE WHOLE POINT, SO SAY IT IN WORDS. BUDGET_PATH went
            # to '' when the binaries were committed, and this line then read
            # "whose entire host budget is ``" -- two backticks, which looks
            # like a broken variable rather than the result the job exists to
            # produce.
            _bp="$BUDGET_PATH"; [ -n "$_bp" ] || _bp='EMPTY -- nothing'
            echo "      $_bp, compiles upstream's own unpatched source to"
            echo "      output identical to upstream's reference compiler."
          else
            echo "FAIL: our G0's self-compile differs from the reference."
            cmp "$A" "$B" 2>&1 | head -3 | sed 's/^/  /'
            echo "  first differing region:"
            od -A d -t x1 "$A" | head -3 | sed 's/^/    ours /'
            od -A d -t x1 "$B" | head -3 | sed 's/^/    ref  /'
            exit 1
          fi

      - name: 'BUDGET: what this run still borrowed from the host'
        if: always()
        run: |
          echo "  on the build path : $BUDGET_PATH"
          echo "  driver            : $BUDGET_DRIVER"
          echo "  emulator          : none -- native $(uname -m)"
          echo "  network in the box: none -- --unshare-all"
          echo
          echo "  When spikes/seedas/ becomes the real hand-encoded seed, remove"
          echo "  \`as ld\` from BUDGET_PATH and the SEAL step will hold the line."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-hermetic-arm64
          path: |
            box/out/
          if-no-files-found: warn
