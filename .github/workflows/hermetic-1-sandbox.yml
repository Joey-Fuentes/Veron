name: hermetic-1-sandbox

# HERMETIC LADDER, STEP 1: PUT THE EXISTING RESULTS IN A BOX.
#
# Nothing is removed in this step. That is the point.
#
# Every gcc result so far was built on a bare runner, where a dependency we
# never thought about is silently satisfied and we never learn it was there.
# The issue is not that the builds use host tools -- they do, and at this stage
# they must, since tcc itself is built by gcc 13 and seed -> tcc does not exist
# on aarch64 yet. The issue is that the host set is UNENUMERATED. We cannot
# currently write down what these builds depend on; we would be reciting it from
# memory.
#
# A sandbox does not make dependencies go away. It makes an UNDECLARED one fail
# loudly instead of being quietly satisfied. The bind list below IS the
# declaration, and every later step in this ladder is a deletion from it:
#
#   step 1  bwrap, host toolchain still bound      <- this file
#   step 2  musl sysroot, static, in place of glibc
#   step 3  our own binutils in place of the host as/ld
#   step 4  our own make/shell/coreutils
#   step 5  a tcc not built by gcc 13   (blocked: seed -> tcc needs MesCC
#                                        aarch64, see spikes/PROGRESS.md)
#
# SO THE EXPECTED RESULT OF THIS RUN IS "NOTHING CHANGED". All four arms should
# behave exactly as they already do. If one does not, the sandbox has found a
# dependency we did not know we had -- which is the whole reason to run it
# before starting to remove things rather than after.
#
# FOUR ARMS, the four results this leg has established:
#
#   A  4.8.5 vanilla, host gcc      needs CXX="g++ -std=gnu++98"
#   B  4.7.4 control, host gcc      target arm-none-eabi, no backend question
#   C  4.7.4 + transplant, host gcc cc1 55,044,256 B, fib = 55
#   D  4.7.4 + transplant, OUR tcc  cc1 80,016,473 B, fib = 55
#
# WHAT THE BOX ACTUALLY ENFORCES
#
#   --unshare-all   no network, no host PID/IPC/UTS namespace. The build cannot
#                   fetch anything. Sources are fetched OUTSIDE, hash-verified
#                   against sources/gcc.toml, and handed in -- provenance and
#                   hermeticity are different criteria and are kept separate.
#   --clearenv      no ambient environment. Every variable the build gets is
#                   listed below, so an inherited CFLAGS or LD_LIBRARY_PATH
#                   cannot silently change a result.
#   ro-bind /usr    the host toolchain, read-only. Declared, not hidden.
#   ro-bind /etc    ld.so.cache, passwd, alternatives. Narrowing this is a
#                   later step; today it is named rather than assumed.
#   one writable    /work. Nothing else in the filesystem can be modified,
#                   which is the property that makes "it only used what we
#                   gave it" checkable rather than asserted.
#
#   NOT enforced, and deliberately: the KERNEL. bwrap cannot isolate it and
#   should not pretend to. TRUST-BOUNDARY.md already declares kernel and
#   hardware as trusted inputs, so the sandbox boundary and the declared trust
#   boundary land in the same place.
#
# UBUNTU 24.04 RESTRICTS UNPRIVILEGED USER NAMESPACES via AppArmor, so bwrap
# fails with "setting up uid map: Permission denied" out of the box. The sysctl
# is the smallest fix; an AppArmor profile granting `userns` is the fallback.
# spikes/livebootstrap copies live-bootstrap's profile for this, which works but
# means cloning a whole upstream repository to get one file.

on:
  push:
    paths:
      - '.github/workflows/hermetic-1-sandbox.yml'
  workflow_dispatch:

concurrency:
  group: hermetic-1-${{ github.ref }}
  cancel-in-progress: true

env:
  GNU: 'https://mirrors.kernel.org/gnu'
  GNU2: 'https://ftpmirror.gnu.org'
  SHA474: '92e61c6dc3a0a449e62d72a38185fda550168a86702dea07125ebd3ec3996282'
  SHA485: '22fb1e7e0f68a63cee631d85b20461d1ea6bda162f03096350e38c8d427ecf23'

jobs:
  boxed:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        arm: [A-485-vanilla, B-474-control, C-474-backport, D-474-tcc]
    name: '${{ matrix.arm }}'
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap strace curl git bzip2 xz-utils gcc g++ make bison flex \
            texinfo m4 perl file binutils python3

      - name: 'Let bwrap create a user namespace'
        run: |
          set -eu
          # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor, so
          # bwrap fails with "setting up uid map: Permission denied". The sysctl
          # is the smallest fix; an inline AppArmor profile granting `userns` is
          # the fallback. spikes/livebootstrap gets this by cloning an entire
          # upstream repository for one file, which is not worth the dependency.
          if sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null; then
            echo "  sysctl: unprivileged userns permitted"
          else
            echo "  sysctl unavailable -- installing an AppArmor profile"
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor || sudo service apparmor reload || true
          fi

      - name: 'THE DECLARATION: one sandbox definition, used by every invocation'
        run: |
          set -eu
          mkdir -p work
          # ONE DEFINITION. Run 1 failed because the smoke test and the real
          # build each carried their own copy of the bind list, and the test's
          # copy was missing `--symlink usr/lib /lib`. /bin/echo then failed
          # with "No such file or directory" -- not because echo was absent, but
          # because its ELF interpreter /lib/ld-linux-aarch64.so.1 could not be
          # resolved, and execve reports a missing INTERPRETER as ENOENT too.
          #
          # A smoke test that does not exercise the same box the build runs in
          # is not a smoke test. Everything below goes through this script.
          cat > box.sh <<'EOS'
          #!/bin/sh
          # The canonical sandbox. See hermetic-1-sandbox.yml for what each
          # line is for and why the kernel is deliberately not isolated.
          set -eu
          W=${W:?box.sh: W (work dir) not set}
          REPO=${REPO:?box.sh: REPO (checkout) not set}
          LIB64=""
          # aarch64 has no /lib64; x86_64 does. Emit the symlink only if the
          # host actually has one, so this script is portable across both.
          [ -d /lib64 ] && LIB64="--symlink usr/lib64 /lib64"
          exec bwrap \
            --unshare-all --die-with-parent --new-session \
            --clearenv \
            --setenv PATH /usr/bin:/bin:/usr/sbin:/sbin \
            --setenv HOME /work \
            --setenv LC_ALL C \
            --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --ro-bind /usr /usr \
            --ro-bind /etc /etc \
            --ro-bind "$REPO" /repo \
            --symlink usr/bin /bin \
            --symlink usr/sbin /sbin \
            --symlink usr/lib /lib \
            $LIB64 \
            --proc /proc --dev /dev \
            --tmpfs /tmp --tmpfs /run \
            --bind "$W" /work \
            --chdir /work \
            "$@"
          EOS
          chmod +x box.sh
          # The bind list as prose, for the artifact. Kept next to box.sh so a
          # change to one without the other is visible in review.
          cat > bind-list.txt <<'EOF'
          read-only:
            /usr        host toolchain: gcc, g++, binutils, make, perl, python3,
                        bison, flex, m4, glibc and its headers
            /etc        ld.so.cache, ld.so.conf*, passwd, group, alternatives
            /repo       OUR OWN SOURCE -- backport-aarch64.sh, the two adapter
                        tools, the tcc patch series. Bound at its real relative
                        layout because the transplant locates its tools with
                        dirname($0)/../../.., which needs the repo shape.
          writable:
            /work       sources, build trees, outputs -- nothing else
          synthetic:
            /proc /dev  minimal, from bwrap
            /tmp /run   tmpfs, empty
          symlinks:
            /bin /sbin /lib [/lib64] -> usr/*   (Ubuntu's layout; the /lib one
                                                 is load-bearing -- it is where
                                                 the ELF interpreter lives)
          namespaces:
            all unshared -- NO NETWORK, no host pid/ipc/uts
          environment:
            PATH HOME LC_ALL TERM SOURCE_DATE_EPOCH  (and nothing inherited)
          NOT isolated, by design:
            the kernel and the hardware -- see TRUST-BOUNDARY.md
          EOF
          sed 's/^/  /' bind-list.txt

      - name: 'Prove the box works before spending an hour in it'
        run: |
          set -eu
          # Same script the build uses, so a pass here means the build's
          # invocation is sound. Checks the three things run 1 got wrong:
          # a dynamically linked binary runs (the loader resolves), the binds
          # are present, and there is genuinely no network.
          W="$PWD/work" REPO="$PWD" ./box.sh /bin/sh -c '
            echo "  arch    : $(uname -m)"
            echo "  loader  : $(ls /lib/ld-linux-* 2>/dev/null || echo MISSING)"
            echo "  gcc     : $(gcc -dumpversion)"
            for d in /usr /etc /work /proc /dev /tmp; do
              [ -e "$d" ] || { echo "  MISSING BIND: $d"; exit 1; }
            done
            echo "  binds   : all present"
            [ -w /work ] || { echo "  /work is not writable"; exit 1; }
            touch /work/.boxtest && rm -f /work/.boxtest
            echo "  /work   : writable"
            if [ -e /usr/bin/curl ] && curl -s --max-time 3 https://example.com >/dev/null 2>&1; then
              echo "  NETWORK REACHABLE -- the box is not sealed"; exit 1
            fi
            echo "  network : unreachable, as intended"
          '

      - name: 'Fetch sources OUTSIDE the box (network is not a build dependency)'
        run: |
          set -eu
          # Provenance and hermeticity are separate criteria. The fetch is made
          # verifiable by the hashes in sources/gcc.toml; the BUILD is made
          # verifiable by having no network at all. Conflating them would mean
          # either a sandbox with a hole in it or a build that cannot start.
          mkdir -p work && cd work
          F=../spikes/stage3/probes/fetch-pinned.sh
          case "${{ matrix.arm }}" in
            A-485-vanilla) need="4.8.5" ;;
            *)             need="4.7.4 4.8.5" ;;
          esac
          for v in $need; do
            d="g${v//./}"
            case $v in
              4.7.4) sha="$SHA474" ;;
              4.8.5) sha="$SHA485" ;;
            esac
            bash "$F" "$d" "$HOME/.cache/veron/gcc-$v.tar.bz2" "$sha" \
              "$GNU/gcc/gcc-$v/gcc-$v.tar.bz2 $GNU2/gcc/gcc-$v/gcc-$v.tar.bz2" "" "" \
              | sed 's/^/  /'
          done
          if [ "${{ matrix.arm }}" = D-474-tcc ]; then
            # Full clone: apply-series.sh locates its base by matching the
            # patches' index pre-image blobs against history.
            git clone -q git://repo.or.cz/tinycc.git tccsrc \
              || git clone -q https://repo.or.cz/tinycc.git tccsrc
            bash ../spikes/stage3/patches/tcc-arm64-asm/apply-series.sh tccsrc | tail -3
          fi
          # gmp/mpfr/mpc for the arms that need them, also fetched outside.
          for u in "$GNU/gmp/gmp-6.2.1.tar.xz" "$GNU/mpfr/mpfr-4.1.0.tar.xz" "$GNU/mpc/mpc-1.2.1.tar.gz"; do
            n=$(basename "$u"); curl -sSL -o "$n" "$u"
            d=$(echo "$n" | sed 's/\.tar\..*//')
            mkdir -p "$d" && tar xf "$n" -C "$d" --strip-components=1
          done
          echo "  fetched: $(ls -d */ | tr -d / | tr '\n' ' ')"

      - name: 'Write the build script that will run inside the box'
        run: |
          set -eu
          # Everything the arm does lives in one script, so the sandbox
          # invocation stays readable and the script is the same shape for all
          # four arms. It runs with /work as the only writable path.
          cat > work/build.sh <<'EOS'
          set -eu
          cd /work
          ARM="$1"
          say() { printf '  %s\n' "$*"; }
          NP=$(nproc)

          case "$ARM" in
            A-485-vanilla)  SRC=g485; TGT=aarch64-unknown-linux-gnu; CC=gcc ;;
            B-474-control)  cp g485/config.sub g485/config.guess g474/
                            chmod +x g474/config.sub g474/config.guess
                            SRC=g474; TGT=arm-none-eabi; CC=gcc ;;
            C-474-backport) SRC=g474; TGT=aarch64-unknown-linux-gnu; CC=gcc ;;
            D-474-tcc)      SRC=g474; TGT=aarch64-unknown-linux-gnu; CC=tcc ;;
            *) say "unknown arm $ARM"; exit 1 ;;
          esac

          # ONE configure, used by every stage. Four hand-written copies of this
          # argument list would be four chances for the stages to differ for a
          # reason that is not the compiler.
          conf() {   # $1 = build dir   $2 = CC
            mkdir -p "$1" && cd "$1"
            "/work/$SRC/configure" CC="$2" CXX="g++ -std=gnu++98" CFLAGS="-O2" \
              --build=aarch64-unknown-linux-gnu \
              --host=aarch64-unknown-linux-gnu \
              --target="$TGT" \
              --prefix=/work/out --enable-languages=c \
              --disable-multilib --disable-bootstrap --disable-werror \
              --disable-libsanitizer --disable-libgomp --disable-libquadmath \
              --disable-libssp --disable-libatomic --disable-shared \
              --with-gmp=/work/prefix --with-mpfr=/work/prefix \
              --with-mpc=/work/prefix > conf.log 2>&1
            rc=$?; cd /work; return $rc
          }
          mk() {     # $1 = build dir
            ( cd "$1" && timeout 7200 make -k -j"$NP" -Otarget MAKEINFO=true \
                all-gcc > build.log 2>&1 )
          }

          # -------------------------------------------------- tcc, for arm D
          if [ "$CC" = tcc ]; then
            say "=== building tcc ==="
            ( cd tccsrc && ./configure --cc=gcc > /dev/null && make -j"$NP" > /dev/null )
            tccsrc/tcc -v
            CCCMD="/work/tccsrc/tcc -B/work/tccsrc"

            # tcc's OWN fixpoint, now inside the box. gen1 was built by gcc 13,
            # gen2 by gen1, gen3 by gen2. gen1 differing from gen2 is expected --
            # different compilers. gen2 == gen3 is the property that matters.
            # libtcc1.a must survive `make clean`: it is tcc's own runtime, and
            # without it gen2 cannot link.
            say "=== tcc fixpoint ==="
            ( cd tccsrc
              cp tcc tcc-gen1; cp libtcc1.a libtcc1.a.keep
              for g in 2 3; do
                p=$((g - 1))
                make clean > /dev/null 2>&1 || true
                cp libtcc1.a.keep libtcc1.a
                ./configure --cc="/work/tccsrc/tcc-gen$p" > /dev/null 2>&1
                make -j"$NP" > /dev/null 2>&1 || true
                [ -x tcc ] && cp tcc "tcc-gen$g"
                say "  gen$g: $( [ -f tcc-gen$g ] && wc -c < tcc-gen$g || echo FAILED)"
              done
              if [ -f tcc-gen2 ] && [ -f tcc-gen3 ] && cmp -s tcc-gen2 tcc-gen3; then
                say "  TCC FIXPOINT: gen2 == gen3  ($(sha256sum tcc-gen2 | cut -c1-16))"
              else
                say "  tcc gen2 != gen3 -- or a generation failed to build"
              fi
              cp tcc-gen1 tcc ) || say "  (tcc fixpoint inconclusive)"
          else
            CCCMD="gcc"
          fi

          # ------------------------------------------------------- transplant
          case "$ARM" in
            C-474-backport|D-474-tcc)
              say "=== transplant ==="
              # bash, NOT sh. The script is #!/usr/bin/env bash and line 21 is
              # `set -euo pipefail`; dash has no pipefail and run 1 died there
              # before copying a single file. From /repo, not a flattened copy:
              # it finds its adapter tools at dirname($0)/../../../tools.
              bash /repo/spikes/stage3/probes/backport-aarch64.sh g474 g485 | tail -4
              [ "$(grep -c aarch64 g474/gcc/config.gcc)" -gt 0 ] \
                || { say "  transplant did not take"; exit 1; } ;;
          esac

          # ---------------------------------------------------- prerequisites
          say "=== gmp/mpfr/mpc ==="
          mkdir -p prefix
          ( cd gmp-6.2.1 && ./configure CC="$CCCMD" --disable-shared \
              --disable-assembly --prefix=/work/prefix > c.log 2>&1 \
            && make -j"$NP" > b.log 2>&1 && make install > /dev/null 2>&1 ) \
            && say "  gmp ok" || { say "  gmp FAILED"; exit 1; }
          for p in mpfr-4.1.0 mpc-1.2.1; do
            ( cd "$p" && ./configure CC="$CCCMD" --disable-shared \
                --with-gmp=/work/prefix --prefix=/work/prefix > c.log 2>&1 \
              && make -j"$NP" > b.log 2>&1 && make install > /dev/null 2>&1 ) \
              && say "  $p ok" || { say "  $p FAILED"; exit 1; }
          done

          # ============================================ STAGE 1
          say "=== stage 1: built by $CC ==="
          conf build "$CCCMD" && say "  configure rc=0" \
            || { say "  configure FAILED"; tail -20 build/conf.log | sed 's/^/    /'; exit 1; }
          mk build; MRC=$?
          say "  make rc=$MRC"
          grep -E '^\s*make(\[[0-9]+\])?: \*\*\* ' build/build.log | head -3 | sed 's/^/    /'
          [ -x build/gcc/cc1 ] || { say "  no cc1 -- nothing further is possible"; exit 1; }
          say "  cc1 : $(wc -c < build/gcc/cc1) bytes  $(sha256sum build/gcc/cc1 | cut -c1-16)"
          cp build/gcc/cc1 /work/cc1-s1

          # The claim, for the arms that target this machine.
          #
          # RUN 2 DIED HERE, IN ALL THREE aarch64 ARMS, WITH rc=55. The test
          # program returns 55 on SUCCESS -- fib(10) -- and this script runs
          # under `set -e`, which sees a non-zero status and terminates. The
          # success condition was killing the run: stage 1 finished, the fib
          # check passed, and the script exited before phase 2 ever started.
          # Arm B survived only because it targets arm-none-eabi and skips this
          # block. A test whose passing value is non-zero has to be run in a
          # context `set -e` does not police.
          if [ "$TGT" = aarch64-unknown-linux-gnu ]; then
            printf 'int fib(int n){return n<2?n:fib(n-1)+fib(n-2);}\nint main(void){return fib(10);}\n' > /work/t.c
            build/gcc/cc1 -quiet -O2 /work/t.c -o /work/t.s 2>&1 | head -3 | sed 's/^/    /'
            if [ -s /work/t.s ] && as /work/t.s -o /work/t.o 2>/dev/null && gcc /work/t.o -o /work/t 2>/dev/null; then
              if /work/t; then FRC=0; else FRC=$?; fi
              say "  ran: exit=$FRC (expect 55)"
            fi
          fi

          # ============================================ PHASE 2: REPRODUCIBLE?
          # THE CONTROL FOR EVERYTHING BELOW. If one compiler built twice from
          # one source does not produce one binary, then stage2 != stage3 would
          # be uninterpretable -- it could mean a miscompile or it could mean a
          # timestamp. Same path both times, since the build directory is
          # recorded in the output; that is why the first tree is deleted rather
          # than built alongside.
          say "=== phase 2: BUILD 1 vs BUILD 2 ==="
          # Run 2 printed one line here -- "REPRODUCIBLE" -- and no numbers, so
          # there was no way to see whether a second build had happened at all.
          # Print both, always, pass or fail.
          say "  BUILD 1  size $(wc -c < /work/cc1-s1)  sha256 $(sha256sum /work/cc1-s1 | cut -d' ' -f1)"
          say "  ---- rebuilding, same source, same flags, same path ----"
          rm -rf build
          if conf build "$CCCMD"; then C2=0; else C2=$?; fi
          say "    configure rc=$C2"
          mk build; M2RC=$?
          say "    make rc=$M2RC"
          if [ -x build/gcc/cc1 ]; then
            say "  BUILD 2  size $(wc -c < build/gcc/cc1)  sha256 $(sha256sum build/gcc/cc1 | cut -d' ' -f1)"
            if cmp -s /work/cc1-s1 build/gcc/cc1; then
              REPRO=yes; say "  -> IDENTICAL. The build is reproducible."
            else
              REPRO=no
              say "  -> DIFFER by $(cmp -l /work/cc1-s1 build/gcc/cc1 2>/dev/null | wc -l) bytes"
              say "     $(cmp /work/cc1-s1 build/gcc/cc1 2>&1 | head -1)"
            fi
          else
            REPRO=no; say "  BUILD 2  FAILED -- no cc1"
            tail -8 build/build.log 2>/dev/null | sed 's/^/      /'
          fi

          # ============================================ PHASE 3: libgcc
          # Needed because xgcc cannot LINK without it, and stage 2's configure
          # begins by linking a test program. Arm A is vanilla 4.8.5 with its own
          # native backend; C and D carry the transplant. If A builds libgcc and
          # they do not, that localises the unwind-dw2 ICE to the transplant --
          # which is worth knowing on its own.
          say "=== phase 3: libgcc ==="
          BORROW=""
          if [ "$TGT" = aarch64-unknown-linux-gnu ]; then
            ( cd build && timeout 3600 make -k -j"$NP" MAKEINFO=true \
                all-target-libgcc > libgcc.log 2>&1 ) || true
            say "  objects: $(find build -path '*libgcc*' -name '*.o' | wc -l)"
            if find build -name libgcc.a | grep -q .; then
              say "  libgcc.a BUILT -- self-build uses our own runtime"
            else
              say "  libgcc.a not built:"
              grep -E 'internal compiler error|fatal error' build/libgcc.log \
                | head -2 | sed 's/^/    /'
              # DECLARED BORROW. The host's runtime, so stage 2 can link at all.
              # Ugly and named: the alternative is not measuring the fixpoint
              # until the ICE is fixed. Everything else here is already borrowed
              # from /usr; this makes one more of it explicit.
              HG=$(dirname "$(gcc -print-libgcc-file-name)")
              BORROW="-B$HG"
              say "  BORROWING the host runtime for stage 2: $HG"
            fi
          fi

          # ============================================ PHASE 4: SELF-BUILD
          # gcc's own bootstrap gate, run by hand: stage2 is built by stage1's
          # compiler, stage3 by stage2's, and stage2 == stage3 is required. It is
          # NOT stage1 == stage2 -- stage1 came from gcc 13 or from tcc, so it
          # legitimately differs. Both stage 2 and stage 3 are built at the SAME
          # path, one after the other, for the same reason phase 2 was.
          if [ "$TGT" != aarch64-unknown-linux-gnu ]; then
            say "=== phase 4: SKIPPED ==="
            say "  $ARM targets $TGT. Its compiler emits code this machine cannot"
            say "  run and we have no $TGT assembler, so it cannot build itself."
            say "  Not a failure -- a cross compiler has no fixpoint to have."
            SELF=n/a
          else
            say "=== phase 4: stage 2, then stage 3 ==="
            X1="/work/build/gcc/xgcc -B/work/build/gcc/ $BORROW"
            say "  ---- STAGE 2: gcc rebuilt by stage 1's own compiler ----"
            rm -rf sN
            if conf sN "$X1"; then say "    configure rc=0"; else
              SELF=stage2-failed; say "    configure FAILED"
              tail -10 sN/conf.log 2>/dev/null | sed 's/^/      /'; fi
            if [ "${SELF:-}" != stage2-failed ]; then
              mk sN; say "    make rc=$?"
            fi
            if [ -x sN/gcc/cc1 ]; then
              say "  STAGE 2  size $(wc -c < sN/gcc/cc1)  sha256 $(sha256sum sN/gcc/cc1 | cut -d' ' -f1)"
              cp sN/gcc/cc1 /work/cc1-s2
              rm -rf /work/c2 && cp -a sN/gcc /work/c2
              X2="/work/c2/xgcc -B/work/c2/ $BORROW"
              say "  ---- STAGE 3: gcc rebuilt by STAGE 2's compiler ----"
              rm -rf sN
              if conf sN "$X2"; then say "    configure rc=0"; else
                say "    configure FAILED"; tail -10 sN/conf.log 2>/dev/null | sed 's/^/      /'; fi
              mk sN; say "    make rc=$?"
              if [ -x sN/gcc/cc1 ]; then
                say "  STAGE 3  size $(wc -c < sN/gcc/cc1)  sha256 $(sha256sum sN/gcc/cc1 | cut -d' ' -f1)"
                if cmp -s /work/cc1-s2 sN/gcc/cc1; then
                  SELF=yes
                  say "  -> FIXPOINT: stage2 == stage3, byte for byte."
                else
                  SELF=no
                  say "  -> DIFFER by $(cmp -l /work/cc1-s2 sN/gcc/cc1 2>/dev/null | wc -l) bytes"
                  say "     $(cmp /work/cc1-s2 sN/gcc/cc1 2>&1 | head -1)"
                fi
              else
                SELF=stage3-failed; say "  STAGE 3  FAILED -- no cc1"
                tail -8 sN/build.log 2>/dev/null | sed 's/^/      /'
              fi
            else
              SELF=stage2-failed; say "  STAGE 2  FAILED -- no cc1"
              tail -8 sN/build.log 2>/dev/null | sed 's/^/      /'
            fi
          fi

          say "=== SUMMARY $ARM ==="
          say "  every cc1 this arm produced, in order:"
          for f in /work/cc1-s1 /work/cc1-s2; do
            [ -f "$f" ] || continue
            say "    $(basename $f)  $(wc -c < $f) bytes  $(sha256sum $f | cut -d' ' -f1)"
          done
          [ -x sN/gcc/cc1 ] && \
            say "    cc1-s3      $(wc -c < sN/gcc/cc1) bytes  $(sha256sum sN/gcc/cc1 | cut -d' ' -f1)"
          say "  reproducible (build1 == build2) : $REPRO"
          say "  fixpoint     (stage2 == stage3) : $SELF"
          say "  borrowed runtime                : ${BORROW:-none}"

          FAIL=0
          [ "$REPRO" = yes ] || FAIL=1
          case "$SELF" in yes|n/a) ;; *) FAIL=1 ;; esac
          say "=== arm exit: $FAIL ==="
          exit "$FAIL"
          EOS
          # Nothing is copied into /work any more: the transplant and its two
          # adapter tools are read from /repo, at their real paths.
          echo "  build.sh: $(wc -l < work/build.sh) lines"

      - name: 'BUILD INSIDE THE BOX'
        continue-on-error: true
        run: |
          set -u
          set +e
          W="$PWD/work" REPO="$PWD" ./box.sh /bin/bash /work/build.sh '${{ matrix.arm }}'
          rc=$?
          echo "  sandboxed build rc=$rc"
          echo "BOX_RC=$rc" >> "$GITHUB_ENV"

      - name: 'ENUMERATE: which host paths did it actually touch?'
        continue-on-error: true
        run: |
          set -u
          set +e
          W="$PWD/work"
          # "We bound /usr" is a permission, not a dependency list. Tracing the
          # whole build would produce hundreds of megabytes, so trace the part
          # that does the probing: a configure run. That is where a build system
          # goes looking for the host, and the distinct paths it opens outside
          # /work are the real declared set.
          W="$W" REPO="$PWD" ./box.sh /usr/bin/strace -f -qq -e trace=openat,execve \
              -o /work/trace.log \
              /bin/sh -c 'mkdir -p /work/tracebuild && cd /work/tracebuild && /work/gmp-6.2.1/configure --disable-shared --disable-assembly >/dev/null 2>&1' \
            > /dev/null 2>&1
          if [ ! -s "$W/trace.log" ]; then
            echo "  no trace produced (strace may be blocked in this namespace)"
            exit 0
          fi
          echo "  --- executables run from the host ---"
          grep -oE 'execve\("[^"]+"' "$W/trace.log" | cut -d'"' -f2 \
            | grep -v '^/work' | sort | uniq -c | sort -rn | head -20 | sed 's/^/    /'
          echo "  --- host directories opened ---"
          grep -oE 'openat\([^,]+, "[^"]+"' "$W/trace.log" | cut -d'"' -f2 \
            | grep -v '^/work' | grep -v '^/proc' | grep -v '^/dev' \
            | sed 's|\(/usr/lib/[^/]*\)/.*|\1/...|; s|\(/usr/include\)/.*|\1/...|' \
            | sort -u | head -40 | sed 's/^/    /'
          echo "    distinct host paths: $(grep -oE 'openat\([^,]+, "[^"]+"' "$W/trace.log" | cut -d'"' -f2 | grep -v '^/work' | sort -u | wc -l)"

      - name: 'ARM RESULT'
        if: always()
        run: |
          set -eu
          echo "  arm            : ${{ matrix.arm }}"
          echo "  sandboxed build: rc=${BOX_RC:-?}"
          echo
          echo "  What each answer means:"
          echo "    reproducible = no   the build embeds something that varies."
          echo "                        Fix that BEFORE reading the fixpoint --"
          echo "                        stage2 != stage3 would be ambiguous."
          echo "    self-build   = yes  stage2 == stage3 byte for byte. This is"
          echo "                        gcc's own bootstrap gate, run by hand."
          echo "    self-build   = n/a  a cross target has no fixpoint to have."
          echo
          echo "  Arms are NOT comparable to each other: A is 4.8.5, B targets"
          echo "  arm-none-eabi, and C and D share source but were built by"
          echo "  different compilers, so their bytes MUST differ. Each arm is"
          echo "  compared only against itself."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'declaration-${{ matrix.arm }}'
          path: |
            bind-list.txt
            work/trace.log
          if-no-files-found: warn
