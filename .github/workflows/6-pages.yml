name: 6-pages

# Pages is its OWN workflow, triggered AFTER 6-release completes. This gives it
# a DIFFERENT run id from the release run, so the EVIDENCE PAGE step fetches the
# COMPLETED release run's logs (github.event.workflow_run.id) instead of its own
# still-running shared run -- the two were the same run id while pages was a
# needs: job, which is why it kept fetching its own in-flight logs.

on:
  workflow_run:
    workflows: ["6-release"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pages:
    # only run if the release it follows actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      ARCHES: "x86_64 aarch64"
      # the completed release run whose logs + bundle this pages run reports on.
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
      # the commit that release was built at -- pin checkout + INDEX to it.
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 'PAGES-IN -- re-download every tier from its tag and verify like a stranger'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out in
          # A tag is REFUSED if it carries PUBLISHING-INCOMPLETE or is missing
          # a named asset -- the same discipline the release job's IN applies,
          # re-applied here because this is a distinct read of a moving tag.
          refuse_if_marked() {
            tag=$1
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" \
                 --json assets --jq '.assets[].name' 2>/dev/null \
                 | grep -qx "PUBLISHING-INCOMPLETE"; then
              echo "  $tag carries PUBLISHING-INCOMPLETE -- refusing to deploy a site from an unverified release"
              exit 1
            fi
          }
          have_asset() {
            gh release view "$1" -R "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' 2>/dev/null | grep -qx "$2"
          }

          # ---- 6/latest: the consumer release this site is ABOUT ----
          refuse_if_marked "6/latest"
          for a in SHA256SUMS; do
            have_asset "6/latest" "$a" || { echo "  6/latest missing $a"; exit 1; }
          done
          gh release download "6/latest" -R "$GITHUB_REPOSITORY" -D out --clobber
          # decompress each published image so the manifest has the inner digest
          for z in out/veron-*.img.zst; do
            [ -e "$z" ] || continue
            zstd -d -q -f "$z" -o "${z%.zst}"
          done
          # the site build expects the releases API too
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate > out/releases-api.json

          # ---- 5/latest and 4/kernel: the tiers the developer section cites ----
          for arch in $ARCHES; do
            if have_asset "5/latest-$arch" "rootfs.img.tar.zst"; then
              refuse_if_marked "5/latest-$arch"
              gh release download "5/latest-$arch" -R "$GITHUB_REPOSITORY" -D "in/5-$arch" --clobber 2>/dev/null || true
            else
              echo "  5/latest-$arch absent -- developer section will omit it (stated)"
            fi
            if have_asset "4/kernel-$arch" "vmlinuz-generic"; then
              refuse_if_marked "4/kernel-$arch"
              gh release download "4/kernel-$arch" -R "$GITHUB_REPOSITORY" -D "in/k-$arch" --clobber 2>/dev/null || true
            fi
          done
          echo "PAGES-IN: every tier verified (marker-absent, assets present)"

      - name: 'SITE -- regenerate the whole storefront'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # THE MANIFEST IS GATHERED, NOT GUESSED: consumer entries from
          # what this run built; developer entries from the files IN
          # digest- and attestation-verified; the upstream table from the
          # release API; licenses from every recipe.toml in the tree.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate             > out/releases-api.json
          python3 - <<'PY'
          import glob, hashlib, json, os, re, tomllib
          commit = os.environ.get("RELEASE_SHA") or os.environ.get("GITHUB_SHA", "unknown")
          m = {"commit": commit, "generated": os.environ.get("GITHUB_RUN_ID", ""),
               "arches": {}, "developer": [], "upstream_releases": [],
               "licenses": {"packages": [], "firmware": None}}

          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for c in iter(lambda: f.read(1 << 20), b""):
                      h.update(c)
              return h.hexdigest()

          for img in glob.glob("out/veron-*.img"):
              arch = os.path.basename(img).split("-")[1]
              m["arches"].setdefault(arch, {
                  "release_tag": f"release/{commit[:7]}", "assets": [],
                  "kernels": {},
                  "attestation_url": "evidence.html"})
              z = img + ".zst"
              if os.path.exists(z):
                  # the PUBLISHED asset is the .zst; the raw image's digest
                  # rides along as inner_* -- it is what sha256sum proves
                  # after decompression, and what the filename's 7 chars are
                  m["arches"][arch]["assets"].append({
                      "name": os.path.basename(z), "sha256": sha(z),
                      "size": os.path.getsize(z), "kind": "img",
                      "inner_name": os.path.basename(img),
                      "inner_sha256": sha(img)})
              else:
                  m["arches"][arch]["assets"].append({
                      "name": os.path.basename(img), "sha256": sha(img),
                      "size": os.path.getsize(img), "kind": "img"})

          # developer section: exactly the inputs this run verified
          for arch in os.environ.get("ARCHES", "").split():
              five, kern = f"in/5-{arch}", f"in/k-{arch}"
              if os.path.isdir(five):
                  a = [{"name": n, "sha256": sha(os.path.join(five, n)),
                        "size": os.path.getsize(os.path.join(five, n))}
                       for n in ("rootfs.img.tar.zst", "PROVENANCE")
                       if os.path.exists(os.path.join(five, n))]
                  m["developer"].append({
                      "tag": f"5/latest-{arch}",
                      "url": f"https://github.com/Joey-Fuentes/Veron/releases/tag/5%2Flatest-{arch}",
                      "desc": "stage 5: the user-space system image, its records and provenance -- digest- and attestation-verified by this very run",
                      "assets": a})
              if os.path.isdir(kern) and os.path.exists(f"{kern}/vmlinuz-generic"):
                  m["developer"].append({
                      "tag": f"4/kernel-{arch}",
                      "url": f"https://github.com/Joey-Fuentes/Veron/releases/tag/4%2Fkernel-{arch}",
                      "desc": "the generic kernel: broad drivers, pinned firmware, digest-verified by this run",
                      "assets": [{"name": "vmlinuz-generic",
                                  "sha256": sha(f"{kern}/vmlinuz-generic"),
                                  "size": os.path.getsize(f"{kern}/vmlinuz-generic")}]})

          # upstream: every release, via the API dump (paginated JSON arrays
          # concatenated by gh -- normalize by regex split on ][)
          raw = open("out/releases-api.json").read()
          rels = []
          for chunk in re.split(r"\]\s*\[", raw):
              chunk = chunk.strip()
              if not chunk.startswith("["):
                  chunk = "[" + chunk
              if not chunk.endswith("]"):
                  chunk = chunk + "]"
              rels.extend(json.loads(chunk))
          for r in rels:
              m["upstream_releases"].append({
                  "tag": r["tag_name"], "title": r.get("name") or "",
                  "url": r["html_url"],
                  "assets": [a["name"] for a in r.get("assets", [])]})

          # licenses: every recipe in the tree; the amd64 overlay wins
          pkgs = {}
          for base in ("spikes/stage5/packages", "spikes/stage5/packages-amd64"):
              for rp in sorted(glob.glob(f"{base}/*/recipe.toml")):
                  t = tomllib.load(open(rp, "rb"))
                  name = os.path.basename(os.path.dirname(rp))
                  pkgs[name] = {"name": name,
                                "version": str(t.get("version", "")),
                                "license": t.get("license", "unstated")}
          m["licenses"]["packages"] = sorted(pkgs.values(), key=lambda p: p["name"])

          # THE STOREFRONT DESCRIBES THE LATEST PUBLISHED RELEASE, not
          # merely this run. A docs-only site refresh must not require
          # minting a release, and must not hide a release that exists
          # (the first version did both: the consumer card was built only
          # from this run's artifacts, so publish_site alone showed
          # "not yet" above flash instructions that worked -- incoherent).
          # The published release carries index.json for exactly this:
          # any arch this run did not itself gate-and-name adopts the
          # published manifest's entry, so the card, the link and the
          # release always agree.
          import subprocess as sp
          have_proven = {a for a, r in m["arches"].items()
                         if any(not x["name"].endswith(".NOBOOT.img")
                                for x in r["assets"])}
          try:
              sp.run(["gh", "release", "download", "6/latest",
                      "-p", "index.json", "-O", "out/published-index.json",
                      "--clobber"], check=True, capture_output=True)
              prev = json.load(open("out/published-index.json"))
              for arch, entry in prev.get("arches", {}).items():
                  if arch not in have_proven:
                      m["arches"][arch] = entry
                      print(f"  {arch}: consumer card adopted from published {entry['release_tag']}")
          except Exception as e:
              print(f"  no published index adopted ({e}); first release or none yet")

          json.dump(m, open("out/manifest.json", "w"), indent=1)
          print(f"manifest: {len(m['developer'])} developer release(s), "
                f"{len(m['upstream_releases'])} upstream, "
                f"{len(m['licenses']['packages'])} package licenses")
          PY
          python3 spikes/stage6/tools/veron-site             --manifest out/manifest.json --out out/site
          ls -la out/site

      - name: 'EVIDENCE PAGE -- render the chain readable on the site'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # RULED (Joe, 2026-08-19): the attestation button opens a PAGE that
          # renders the whole chain -- every stage's attestation identity and
          # its build log, readable, no download. This fetches THIS release's
          # evidence bundle (produced by the stage-6 EVIDENCE-CHAIN step and
          # published as evidence.tar.gz on 6/latest), unpacks it, and renders
          # it with tools/evidence-page.py (python, Veron-native -- no jq/node).
          mkdir -p ev
          if gh release download 6/latest -R "$GITHUB_REPOSITORY" \
               -p 'evidence.tar.gz' -D ev --clobber 2>/dev/null \
             && [ -s ev/evidence.tar.gz ]; then
            mkdir -p ev/bundle
            tar -xzf ev/evidence.tar.gz -C ev/bundle
            # the bundle may unpack into ./evidence/ or flat -- find stages.tsv
            B=$(dirname "$(find ev/bundle -name stages.tsv | head -1)")
            [ -n "$B" ] && [ -d "$B" ] || B=ev/bundle
            # CAPTURE THE RELEASE RUN'S OWN LOG HERE. The release job could not
            # THE RELEASE RUN IS A DIFFERENT, COMPLETED RUN. This pages workflow
            # is triggered by workflow_run AFTER 6-release finishes, so it has
            # its OWN run id, and the release run's id arrives in the event as
            # RELEASE_RUN_ID. That run is DONE, so its logs are final and
            # complete -- unlike before, when pages was a needs: job sharing the
            # release's run id and fetched its own still-running logs. Prefer the
            # event's id; fall back to the stages.tsv value only if absent.
            mkdir -p "$B/logs"
            rel_run="${RELEASE_RUN_ID:-}"
            [ -n "$rel_run" ] || rel_run=$(awk -F"\t" '/^6-release/{print $3}' "$B/stages.tsv" | head -1)
            if [ -n "$rel_run" ]; then
              timeout 120 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rel_run/logs" \
                > "$B/logs/6-release.zip" 2>/dev/null || true
              [ -s "$B/logs/6-release.zip" ] \
                && echo "  captured the completed release run's log (run $rel_run)" \
                || { rm -f "$B/logs/6-release.zip"; echo "  release log not available (run $rel_run)"; }
            fi
            # THE DESKTOP EVIDENCE: the stage-5 run booted the built system in
            # qemu and captured what it looks like running -- desktop.png,
            # desktop-minibrowser.png (a browser open on the machine it built),
            # and desktop-console.log (that session's boot log). It is a run
            # ARTIFACT, not a release asset, so fetch it by the stage-5 run id
            # (the 5-provenance row) and drop its files in the bundle for the
            # page to show the screenshots and the boot log.
            s5_run=$(awk -F"\t" '/^5-/{print $3}' "$B/stages.tsv" | head -1)
            if [ -n "$s5_run" ]; then
              mkdir -p "$B/desktop"
              aurl=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$s5_run/artifacts" \
                       --jq '.artifacts[] | select(.name|startswith("veron-stage5-desktop")) | .archive_download_url' \
                       2>/dev/null | head -1)
              if [ -n "$aurl" ]; then
                # the archive_download_url needs auth; gh api streams it as a zip
                gh api "$aurl" > "$B/desktop/desktop.zip" 2>/dev/null || true
                if [ -s "$B/desktop/desktop.zip" ]; then
                  ( cd "$B/desktop" && unzip -o desktop.zip >/dev/null 2>&1 && rm -f desktop.zip )
                  echo "  captured the desktop screenshots + console log (stage-5 run $s5_run)"
                else
                  rm -f "$B/desktop/desktop.zip"
                  echo "  desktop artifact present but download failed (run $s5_run)"
                fi
              else
                echo "  no desktop artifact on stage-5 run $s5_run (aged out past retention?)"
              fi
            fi
            python3 tools/evidence-page.py "$B" out/site/evidence.html
            echo "  evidence page rendered from this release's bundle"
          else
            echo "  no evidence.tar.gz yet -- writing a placeholder evidence page"
            mkdir -p ev/empty
            : > ev/empty/stages.tsv
            python3 tools/evidence-page.py ev/empty out/site/evidence.html || true
          fi
          ls -la out/site/evidence.html || true

      - name: 'CONSUMER GATE -- the storefront click-path, walked by machine'
        run: |
          set -eu
          # THE GATE THIS PROJECT WAS MISSING, added after release one
          # shipped three consumer-path defects a first user found by
          # hand (2026-08-18): placeholder URLs in the doc, %2F-encoded
          # download paths GitHub 404s, and a card advertising an asset
          # that was never uploaded. Every other gate tests what the
          # build produced; this one tests what a stranger clicks. It
          # walks the generated page exactly as a user would: every
          # download href must answer HTTP 200 with a plausible size
          # (nine bytes is a 404 page, and we have the receipt), and the
          # flash block's own filename-resolution must derive the very
          # asset the card advertises.
          python3 - <<'PY'
          import re, subprocess, sys
          html = open("out/site/index.html").read()
          hrefs = sorted(set(re.findall(
              r'href="(https://github\.com/[^"]+/releases/download/[^"]+)"', html)))
          if not hrefs:
              print("  no download hrefs on the page -- empty-state site, nothing to walk")
              sys.exit(0)
          fail = 0
          for u in hrefs:
              if "%2F" in u.split("/releases/download/", 1)[1]:
                  print(f"  FAIL  encoded slash in a download path: {u}")
                  fail += 1; continue
              r = subprocess.run(["curl", "-fsSIL", "-o", "/dev/null",
                                  "-w", "%{http_code} %{size_download} %{url_effective}\n",
                                  "--max-time", "30", u],
                                 capture_output=True, text=True)
              head = subprocess.run(["curl", "-fsSL", "--max-time", "60",
                                     "-r", "0-0", "-o", "/dev/null",
                                     "-w", "%{http_code}", u],
                                    capture_output=True, text=True)
              ok = head.returncode == 0 and head.stdout.strip() in ("200", "206")
              print(("  ok    " if ok else "  FAIL  ") + u)
              fail += 0 if ok else 1
          # the flash block must resolve to the advertised asset
          m = re.search(r"grep -o '([^']+)' SHA256SUMS", html)
          card = re.search(r'>(veron-x86_64-[0-9a-f]{7}\.img\.zst)<', html)
          if m and card:
              sums_url = next((u for u in hrefs if u.endswith("SHA256SUMS")), None)
              if sums_url:
                  sums = subprocess.run(["curl", "-fsSL", "--max-time", "30", sums_url],
                                        capture_output=True, text=True).stdout
                  hit = re.findall(m.group(1).replace("[.]", "\\."), sums)
                  ok = card.group(1) in hit
                  print(("  ok    " if ok else "  FAIL  ")
                        + f"flash block resolves to the card's asset ({card.group(1)})")
                  fail += 0 if ok else 1
          sys.exit(1 if fail else 0)
          PY
          echo "VERON-CONSUMER-GATE-OK  every advertised click answers"

      - name: 'INDEX -- the machine-readable manifest joins the release it describes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # SITE generates the manifest, so it cannot ride in PUBLISH's
          # own upload any more (publish now runs first, so the consumer
          # gate walks LIVE urls -- run 87030806805 walked this run's
          # card before this run's release existed). It joins both tags
          # here, after the gate has proven every advertised click.
          C7=${RELEASE_SHA::7}
          cp out/site/index.json out/index.json
          gh release upload "release/$C7" out/index.json --clobber
          gh release upload "6/latest" out/index.json --clobber
          echo "index.json attached to release/$C7 and 6/latest"

      - name: 'PAGES -- deploy the storefront'
        uses: actions/configure-pages@v5

      - name: 'PAGES -- upload the site'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

      - name: 'PAGES -- go live'
        id: deployment
        uses: actions/deploy-pages@v4

