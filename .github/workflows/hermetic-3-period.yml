name: hermetic-3-period

# A PERIOD SYSROOT (LFS 7.5), AND THE ICE PREDICTION IT SETTLES.
#
# hermetic-2-sysroot builds a MODERN environment. It is the right home for the
# top of the ladder and the wrong home for gcc 4.7: every workaround this leg
# has accumulated is a 2013 compiler meeting a 2026 system --
# `sed struct ucontext -> ucontext_t`, `-std=gnu89`, `-fcommon`, MAKEINFO=true.
#
# THE PREDICTION, stated before the run. The ICE blocking the gcc leg is libgcc
# dying at unwind-dw2.c, and gcc47-libgcc-ice's control showed vanilla 4.8.5
# failing at the same object with a clean diagnostic:
#     md-unwind-support.h:42:21: error: field 'uc' has incomplete type
# That is `struct ucontext uc;` meeting a glibc that renamed the type in 2.26.
# **glibc 2.19 predates the rename.** So:
#     libgcc builds unpatched -> the ICE was environmental, transplant clean
#     it still ICEs at :1490  -> the transplant is at fault, get the backtrace
#
# WHY LFS 7.5 AND NOT 7.3, when 4.7 is the rung we care about: gcc 4.7.2 has no
# aarch64 backend, so it cannot be the cross compiler in a sysroot targeting
# aarch64. That absence is why the backport exists. 7.5's gcc 4.8.2, glibc 2.19
# and binutils 2.24 all have aarch64; our 4.7.4 is built INSIDE the result,
# which is where it belongs -- the sysroot is the environment, not a rung.
#
# SEVEN RUNS OF FIXES ARE BAKED IN HERE, each a 2026 host being unrecognisable
# to 2014 software. They are noted at the point they apply:
#   * CXX="g++ -std=gnu++98"   reload1.c does bool++, removed in C++17
#   * ARCH=arm64              linux 3.13's uname table predates aarch64
#   * ln -s $S/tools /tools   chapter 5 uses absolute /tools paths
#   * MAKEINFO=: at CONFIGURE glibc compares against the literal ":"
#   * verify, do not assume   every check here failed vacuously at least once

on:
  push:
    paths:
      - '.github/workflows/hermetic-3-period.yml'
  workflow_dispatch:
    inputs:
      ucontext_patch:
        description: 'patch ucontext in our 4.7 tree (no = test the prediction)'
        required: false
        default: 'no'

concurrency:
  group: hermetic-3-period-${{ github.ref }}
  cancel-in-progress: true

env:
  GNU: 'https://mirrors.kernel.org/gnu'
  LFS_TGT: 'aarch64-veron-linux-gnu'
  BINUTILS: '2.24'
  GCCVER: '4.8.2'
  GLIBC: '2.19'
  KERNEL: '3.13.3'
  GMP: '5.1.3'
  MPFR: '3.1.2'
  MPC: '1.0.2'
  SHA474: '92e61c6dc3a0a449e62d72a38185fda550168a86702dea07125ebd3ec3996282'
  SHA485: '22fb1e7e0f68a63cee631d85b20461d1ea6bda162f03096350e38c8d427ecf23'

jobs:
  period:
    name: 'LFS 7.5 sysroot -> gcc 4.7.4 + transplant inside it'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap curl git bzip2 xz-utils gcc g++ make bison flex \
            texinfo m4 perl python3 file gawk

      - name: 'Environment (LFS 7.5 ch. 4)'
        run: |
          set -eu
          S="$PWD/sysroot"
          echo "S=$S" >> "$GITHUB_ENV"
          echo "W=$PWD" >> "$GITHUB_ENV"
          mkdir -pv "$S"/tools "$S"/work
          echo "$S/tools/bin" >> "$GITHUB_PATH"
          # `ln -sv $LFS/tools /` is LFS 7.5 chapter 4 and it is load-bearing:
          # chapter 5 configures with ABSOLUTE /tools paths, and those must
          # resolve on the HOST while the cross compiler is driven from outside
          # the sysroot. Skipping it cost a run in which asm/unistd.h was
          # verifiably present at $S/tools/include and glibc still could not
          # find it, because it was looking in /tools/include.
          sudo ln -sfn "$S/tools" /tools
          echo "  /tools -> $(readlink -f /tools)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          echo "  LFS_TGT: $LFS_TGT   host: $(gcc -dumpmachine)"

      - name: 'Fetch (LFS 7.5 versions)'
        run: |
          set -eu
          for u in "$GNU/binutils/binutils-$BINUTILS.tar.bz2" \
                   "$GNU/gcc/gcc-$GCCVER/gcc-$GCCVER.tar.bz2" \
                   "$GNU/glibc/glibc-$GLIBC.tar.xz" \
                   "$GNU/gmp/gmp-$GMP.tar.xz" \
                   "$GNU/mpfr/mpfr-$MPFR.tar.xz" \
                   "$GNU/mpc/mpc-$MPC.tar.gz" \
                   "$GNU/make/make-4.0.tar.bz2" \
                   "https://busybox.net/downloads/busybox-1.36.1.tar.bz2" \
                   "https://cdn.kernel.org/pub/linux/kernel/v3.x/linux-$KERNEL.tar.xz"; do
            echo "  $(basename "$u")"; curl -fsSL --retry 3 -O "$u"
          done
          F=spikes/stage3/probes/fetch-pinned.sh
          bash "$F" g474 "$HOME/.cache/veron/gcc-4.7.4.tar.bz2" "$SHA474" \
            "$GNU/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2" "" "" | sed 's/^/  /'
          bash "$F" g485 "$HOME/.cache/veron/gcc-4.8.5.tar.bz2" "$SHA485" \
            "$GNU/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2" "" "" | sed 's/^/  /'

      - name: '5.4 binutils 2.24 pass 1'
        run: |
          set -eu
          die() { echo "  --- $1 ---"; grep -nE "Error [0-9]|configure: error|internal compiler|error:" "$2" | head -10 | sed 's/^/    /'; tail -12 "$2" | sed 's/^/    /'; exit 1; }
          tar xf "binutils-$BINUTILS.tar.bz2"
          mkdir -p b-bu1 && cd b-bu1
          "../binutils-$BINUTILS/configure" \
            --prefix=/tools --with-sysroot="$S" --with-lib-path=/tools/lib \
            --target="$LFS_TGT" --disable-nls --disable-werror \
            > c.log 2>&1 || die "configure" c.log
          make -j"$(nproc)" > b.log 2>&1 || die "build" b.log
          make DESTDIR="$S" install > i.log 2>&1 || die "install" i.log
          echo "  tools: $(ls "$S/tools/bin" | wc -l) cross binaries"

      - name: '5.5 gcc 4.8.2 pass 1'
        run: |
          set -eu
          die() { echo "  --- $1 ---"; grep -nE "Error [0-9]|configure: error|internal compiler|error:" "$2" | head -10 | sed 's/^/    /'; tail -12 "$2" | sed 's/^/    /'; exit 1; }
          tar xf "gcc-$GCCVER.tar.bz2"
          cd "gcc-$GCCVER"
          sed -i '/k prot/agcc_cv_libc_provides_ssp=yes' gcc/configure
          tar xf "../mpfr-$MPFR.tar.xz" && mv "mpfr-$MPFR" mpfr
          tar xf "../gmp-$GMP.tar.xz"   && mv "gmp-$GMP" gmp
          tar xf "../mpc-$MPC.tar.gz"   && mv "mpc-$MPC" mpc
          cd "$W" && mkdir -p b-gcc1 && cd b-gcc1
          # CXX="g++ -std=gnu++98": reload1.c:89 does `bool++`, legal in C++98
          # and removed in C++17, which is what a 2026 host g++ defaults to.
          # gcc47-aarch64-backport recorded this exact line and fix already.
          # Only pass 1 needs it; later stages use 4.8.2's own g++.
          "../gcc-$GCCVER/configure" \
            CXX="g++ -std=gnu++98" \
            --target="$LFS_TGT" --prefix=/tools --with-sysroot="$S" \
            --with-newlib --without-headers \
            --with-local-prefix=/tools --with-native-system-header-dir=/tools/include \
            --disable-nls --disable-shared --disable-multilib \
            --disable-decimal-float --disable-threads --disable-libatomic \
            --disable-libgomp --disable-libitm --disable-libmudflap \
            --disable-libquadmath --disable-libsanitizer --disable-libssp \
            --disable-libstdc++-v3 --enable-languages=c,c++ \
            > c.log 2>&1 || die "configure" c.log
          make -j"$(nproc)" MAKEINFO=true > b.log 2>&1 || die "build" b.log
          make DESTDIR="$S" MAKEINFO=true install > i.log 2>&1 || die "install" i.log
          "$S/tools/bin/$LFS_TGT-gcc" --version | head -1 | sed 's/^/  /'

      - name: '5.6 linux 3.13.3 API headers'
        run: |
          set -eu
          tar xf "linux-$KERNEL.tar.xz"
          cd "linux-$KERNEL"
          make mrproper > /dev/null 2>&1
          # ARCH=arm64 is required: linux 3.13 derives SUBARCH from `uname -m`
          # and its sed table predates aarch64, so it found no arch/aarch64/ and
          # installed only the generic headers -- glibc then died on
          # "sys/syscall.h: fatal error: asm/unistd.h: No such file".
          make ARCH=arm64 INSTALL_HDR_PATH=dest headers_install > hi.log 2>&1 \
            || { echo "  headers_install failed:"; tail -10 hi.log | sed 's/^/    /'; exit 1; }
          mkdir -p "$S/tools/include"
          cp -r dest/include/* "$S/tools/include"
          echo "  headers: $(find "$S/tools/include" -name '*.h' | wc -l)"
          # A count is not a check. Name the files that actually mattered.
          bad=0
          for h in asm/unistd.h asm-generic/unistd.h linux/version.h; do
            if [ -f "$S/tools/include/$h" ]; then printf '    %-24s present\n' "$h"
            else printf '    %-24s MISSING\n' "$h"; bad=1; fi
          done
          [ "$bad" -eq 0 ] || { echo "  arch headers absent -- glibc cannot build"; exit 1; }

      - name: '5.7 glibc 2.19 -- the period libc, no ucontext rename'
        run: |
          set -eu
          die() { echo "  --- $1 ---"; grep -nE "Error [0-9]|configure: error" "$2" | head -10 | sed 's/^/    /'; tail -12 "$2" | sed 's/^/    /'; exit 1; }
          command -v "$LFS_TGT-gcc" > /dev/null || { echo "  cross gcc not on PATH"; exit 1; }
          tar xf "glibc-$GLIBC.tar.xz"
          mkdir -p b-glibc && cd b-glibc
          # MAKEINFO=: AT CONFIGURE TIME. glibc's manual/Makefile guards its
          # rules with a comparison against the LITERAL string ":", so
          # MAKEINFO=true at make time is not a no-op to it -- it is just
          # another program that fails to produce libc.info. Three runs went
          # into that distinction: Error 134 (texinfo aborting), then Error 1
          # (nothing to install), then `make -k install` which reported no
          # errors outside manual and installed NOTHING, because glibc installs
          # the libraries in a top-level rule that needs every subdir to pass.
          #
          # The libc_cv_* answers are LFS 7.5's and are required: a cross
          # compiler cannot RUN the programs those checks compile.
          "../glibc-$GLIBC/configure" \
            --prefix=/tools --host="$LFS_TGT" \
            --build="$(../glibc-$GLIBC/scripts/config.guess)" \
            --disable-profile --enable-kernel=2.6.32 \
            --with-headers=/tools/include \
            libc_cv_forced_unwind=yes libc_cv_ctors_header=yes \
            libc_cv_c_cleanup=yes MAKEINFO=: \
            > c.log 2>&1 || die "configure" c.log
          # glibc records CC in config.make, not Makefile. Looking in the wrong
          # file once produced "host build in disguise" about a perfectly good
          # cross build -- undetermined is not the same as wrong.
          cc=$(sed -n 's/^CC *= *//p' config.make Makefile 2>/dev/null | head -1)
          echo "  CC: ${cc:-<undetermined>}"
          case "$cc" in
            *"$LFS_TGT"*) echo "  cross compiler confirmed" ;;
            "")  echo "  UNDETERMINED -- not proceeding"; exit 1 ;;
            *)   echo "  NOT the cross compiler"; exit 1 ;;
          esac
          grep -q '^MAKEINFO = :' config.make \
            && echo "  MAKEINFO=: recorded -- the manual subdir is off" \
            || echo "  WARNING: MAKEINFO not recorded as ':' -- manual may build"
          make -j"$(nproc)" > b.log 2>&1 || die "build" b.log
          make DESTDIR="$S" install > i.log 2>&1 || die "install" i.log
          echo "  artifacts:"
          miss=0
          for a in lib/libc.so.6 lib/ld-linux-aarch64.so.1 lib/libc.a \
                   include/stdio.h include/gnu/stubs.h; do
            if [ -e "$S/tools/$a" ]; then printf '    %-32s present\n' "$a"
            else printf '    %-32s MISSING\n' "$a"; miss=1; fi
          done
          [ "$miss" -eq 0 ] || { echo "  the libc did not land"; exit 1; }
          echo "  --- struct ucontext in glibc $GLIBC (the prediction) ---"
          grep -rn 'struct ucontext' "$S/tools/include/sys/ucontext.h" 2>/dev/null \
            | head -3 | sed 's/^/    /' || echo "    (tag not found)"

      - name: '5.9-5.11 libstdc++, binutils pass 2, gcc pass 2'
        run: |
          set -eu
          die() { echo "  --- $1 ---"; grep -nE "Error [0-9]|configure: error|error:" "$2" | head -10 | sed 's/^/    /'; tail -12 "$2" | sed 's/^/    /'; exit 1; }

          mkdir -p b-libstdcxx && cd b-libstdcxx
          "../gcc-$GCCVER/libstdc++-v3/configure" \
            --host="$LFS_TGT" --prefix=/tools --disable-multilib --disable-shared \
            --disable-nls --disable-libstdcxx-threads --disable-libstdcxx-pch \
            --with-gxx-include-dir="/tools/$LFS_TGT/include/c++/$GCCVER" \
            > c.log 2>&1 || die "libstdc++ configure" c.log
          make -j"$(nproc)" > b.log 2>&1 || die "libstdc++ build" b.log
          make DESTDIR="$S" install > i.log 2>&1 || die "libstdc++ install" i.log
          echo "  libstdc++ ok"

          cd "$W" && mkdir -p b-bu2 && cd b-bu2
          CC="$LFS_TGT-gcc" AR="$LFS_TGT-ar" RANLIB="$LFS_TGT-ranlib" \
            "../binutils-$BINUTILS/configure" --prefix=/tools --disable-nls \
            --disable-werror --with-lib-path=/tools/lib --with-sysroot \
            > c.log 2>&1 || die "binutils2 configure" c.log
          make -j"$(nproc)" > b.log 2>&1 || die "binutils2 build" b.log
          make DESTDIR="$S" install > i.log 2>&1 || die "binutils2 install" i.log
          echo "  binutils pass 2 ok"

          cd "$W" && mkdir -p b-gcc2 && cd b-gcc2
          CC="$LFS_TGT-gcc" CXX="$LFS_TGT-g++" \
          AR="$LFS_TGT-ar" RANLIB="$LFS_TGT-ranlib" \
            "../gcc-$GCCVER/configure" --prefix=/tools \
            --with-local-prefix=/tools --with-native-system-header-dir=/tools/include \
            --enable-languages=c,c++ --disable-libstdcxx-pch \
            --disable-multilib --disable-bootstrap --disable-libgomp \
            > c.log 2>&1 || die "gcc2 configure" c.log
          make -j"$(nproc)" MAKEINFO=true > b.log 2>&1 || die "gcc2 build" b.log
          make DESTDIR="$S" MAKEINFO=true install > i.log 2>&1 || die "gcc2 install" i.log
          ln -sfv gcc "$S/tools/bin/cc" 2>/dev/null || true
          echo "  native /tools gcc: $("$S/tools/bin/gcc" --version 2>&1 | head -1)"

      - name: 'userland: BusyBox + make, cross-built'
        run: |
          set -eu
          tar xf busybox-1.36.1.tar.bz2 && cd busybox-1.36.1
          make defconfig > /dev/null 2>&1
          yes '' | make oldconfig > /dev/null 2>&1
          # ssl_client is what drags in networking/tls*.c, which does not build
          # against a modern glibc. Disable AFTER oldconfig -- before it, the
          # symbols are re-derived and the seds are undone.
          for sym in CONFIG_TC CONFIG_TLS CONFIG_SSL_CLIENT \
                     CONFIG_FEATURE_WGET_HTTPS CONFIG_FEATURE_WGET_OPENSSL; do
            sed -i "s/^$sym=y/# $sym is not set/" .config
            grep -q "^$sym=y" .config && { echo "  $sym still on"; exit 1; }
            printf '    %-32s off\n' "$sym"
          done
          make -j"$(nproc)" CROSS_COMPILE="$LFS_TGT-" > b.log 2>&1 || {
            echo "  --- busybox ---"
            grep -nE "error:|Error [0-9]" b.log | head -10 | sed 's/^/    /'; exit 1; }
          cp busybox "$S/tools/bin/"
          ( cd "$S/tools/bin" && for a in $(./busybox --list); do [ -e "$a" ] || ln -sf busybox "$a"; done )
          cd "$W" && tar xf make-4.0.tar.bz2 && mkdir -p b-make && cd b-make
          ../make-4.0/configure --prefix=/tools --host="$LFS_TGT" \
            --build="$(../make-4.0/config.guess)" --disable-nls > c.log 2>&1 \
            || { tail -15 c.log | sed 's/^/    /'; exit 1; }
          make -j"$(nproc)" > b.log 2>&1 && make DESTDIR="$S" install > i.log 2>&1
          echo "  applets: $(ls "$S/tools/bin" | wc -l)"

      - name: 'THE BOX (period)'
        run: |
          set -eu
          cat > box3.sh <<'EOS'
          #!/bin/sh
          set -eu
          S=${S:?}
          exec bwrap --unshare-all --die-with-parent --new-session --clearenv \
            --setenv PATH /tools/bin --setenv HOME /work \
            --setenv LC_ALL POSIX --setenv TERM dumb --setenv SOURCE_DATE_EPOCH 0 \
            --bind "$S" / --proc /proc --dev /dev --tmpfs /tmp \
            --chdir /work "$@"
          EOS
          chmod +x box3.sh
          echo "  sysroot: $(du -sh "$S" | cut -f1)"
          for c in "/tools/bin/sh -c echo_alive" "/tools/bin/gcc --version" \
                   "/tools/bin/as --version" "/tools/bin/make --version"; do
            set -- $c
            printf '  %-14s %s\n' "$(basename "$1")" \
              "$(S="$S" ./box3.sh "$@" 2>&1 | head -1 | cut -c1-60)"
          done

      - name: 'THE EXPERIMENT: our 4.7.4 + transplant, inside, unpatched'
        continue-on-error: true
        run: |
          set -u
          set +e
          cp -r g474 g485 spikes tools "$S/work/" 2>/dev/null
          if [ "${{ github.event.inputs.ucontext_patch }}" = "yes" ]; then
            echo "  applying the ucontext patch (prediction NOT under test)"
            sed -i 's/\bstruct ucontext\b/ucontext_t/g' \
              "$S/work/g474/libgcc/config/aarch64/linux-unwind.h" 2>/dev/null
          else
            echo "  NOT applying the ucontext patch -- this is the experiment"
          fi
          S="$S" ./box3.sh /tools/bin/sh -c '
            cd /work
            sh spikes/stage3/probes/backport-aarch64.sh g474 g485 2>&1 | tail -3
            mkdir -p b && cd b
            /work/g474/configure --prefix=/work/out --enable-languages=c \
              --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu \
              --target=aarch64-unknown-linux-gnu --disable-multilib \
              --disable-bootstrap --disable-werror --disable-libsanitizer \
              --disable-libgomp --disable-libquadmath --disable-libssp \
              --disable-libatomic --disable-shared > c.log 2>&1
            echo "configure rc=$?"
            make -k -j4 MAKEINFO=true > b.log 2>&1
            echo "make rc=$?"
            echo "cc1: $( [ -x gcc/cc1 ] && wc -c < gcc/cc1 || echo MISSING)"
            echo "libgcc.a: $(find . -name libgcc.a | head -1 || echo NOT-BUILT)"
            grep -E "internal compiler error|error:" b.log | head -5
          ' 2>&1 | sed 's/^/    /'
          echo
          echo "  VERDICT ON THE PREDICTION:"
          echo "    libgcc.a built -> the ICE was the glibc era, not the transplant"
          echo "    still ICEs     -> the transplant is at fault; run gcc47-libgcc-ice"
