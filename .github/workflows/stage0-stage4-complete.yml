# =====================================================================
# STAGE 0 TO A BOOTING KERNEL, WITH NOTHING BORROWED.
#
# This is stage3-hermetic-arm64 and stage3-to-stage4-reference joined at the
# one place they differ: which tcc the stage-4 ladder runs on.
#
#   stage3-to-stage4-reference   builds tcc with the HOST's musl-gcc and takes
#                                it all the way to a kernel that boots. That
#                                arm proves the LADDER; it says nothing about
#                                where its compiler came from.
#
#   stage3-hermetic-arm64        starts at a hand-written assembler and climbs
#                                seed -> stage1 -> stage2 -> micro-c -> mc-tcc
#                                with BUDGET_PATH empty. That arm proves the
#                                SEED; it stops at tcc.
#
# Each has a hole exactly where the other has substance. This job removes the
# host-built compiler from the second and puts the first arm's mc-tcc in its
# place, so that one run answers one question:
#
#   does a compiler grown from a hand-written assembler build a Linux kernel
#   that boots, with an empty tier-1 budget from the first byte to the last?
#
# THE ANSWER IS NOT ASSUMED TO BE YES. mc-tcc has never built musl, and
# spikes/stage3/WHAT-STAGE-4-NEEDS.md lists what is known to be missing -- the
# libc-facing surface among it. The point of this job is to say WHERE the climb
# stops and with what message, in one place, rather than to be green. A rung
# that fails here is the deliverable, and the summary at the end reports the
# rung reached rather than a pass or a fail.
#
# WHAT IS SUBSTITUTED, AND WHAT IS NOT. Exactly two things change hands:
#
#   tccsrc/       the patched tcc source, tcc's -B directory. Taken from the
#                 SEED job, so it is the same tree mc-tcc was compiled from
#                 rather than a second clone that could drift from it.
#   tccsrc/tcc    the compiler itself -- mc-tcc, not a host build.
#
# The box, the pins, the rungs, the applet set and the boot are the reference
# arm's, unchanged. If this job differs from that one anywhere else, that is a
# defect in this file and not a result.
#
# BUDGET_PATH IS EMPTY IN BOTH JOBS, and the SEAL step in each enforces it
# against what is actually in the box rather than against this comment.
# musl-tools is NOT installed in the stage-4 job: the reference arm needs it to
# build its tcc and this one does not, so its absence is the substitution made
# visible in the install line.
# =====================================================================

on:
  # DECLARED BECAUSE THE stage4 JOB ALREADY READS IT. Its env: block has
  # always said `TRACE_APPLETS: ${{ inputs.trace_applets && '1' || '0' }}`,
  # copied from stage3-to-stage4-reference along with the rest of the arm --
  # but the input itself was not copied with it. An undeclared input is not an
  # error in Actions, it is the empty string, so the expression was constant-0
  # and the option silently did not exist. Declaring it makes the knob real
  # rather than removing a line that looked live.
  workflow_dispatch:
    inputs:
      trace_applets:
        description: 'wrap every applet to record which ones the chain actually uses'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - '.github/workflows/stage0-stage4-complete.yml'

# A run of this length must never be cancelled by the next push.
concurrency:
  group: stage0-stage4-complete-${{ github.ref }}
  cancel-in-progress: false

env:
  # From the seed arm.
  M2PLANET_SHA: bd2fe4b0659fd0ad3f476a5ad0ef801bd134665d
  M2LIBC_SHA: 68a23cfd05d5a355ba7a30c770d684cbe86fcc4e
  MESCC_SHA: 5adfbf3
  TCC_SHA: 5ec0e6f84b47ebd8c269b581712666313f5edaef
  MUSL_VER: '1.2.5'
  # make 3.82 is live-bootstrap's first make (step #25, built by kaem under
  # tcc, before binutils exists) and is the version known to build this way.
  # They rebuild it later because 3.82 "randomly segfaults while building the
  # Linux kernel" -- irrelevant here, since this job stops at gcc 4.7.4.
  MAKE_VER: '3.82'
  # A SECOND make, BUILT PROPERLY ONCE binutils EXISTS. 3.82 comes up first
  # from live-bootstrap's kaem command list because nothing else can, and it
  # drives musl and binutils fine -- then took a Bus error building libgcc.
  # live-bootstrap rebuilds it too, "using the build system and GCC, which
  # means that it does not randomly segfault".
  #
  # 4.4, AND THIS IS A RETURN RATHER THAN A NEW GUESS. 4.4 was tried first and
  # failed at lib/fnmatch.c:154 on __P -- glibc's <sys/cdefs.h> macro. That is
  # now supplied by the shim rung 2 installs and force-included by cc-static,
  # so the one thing that blocked it is gone.
  #
  # 4.2.1 was live-bootstrap's pin and it does not survive musl here. Its
  # BUNDLED glob cost five substitutions -- getlogin, getlogin_r, __P, __ptr_t
  # -- and switching to the system glob then hit the real wall:
  #
  #     dir.c:1305: error: field not found: gl_opendir
  #
  # gl_opendir is a glob_t member from GNU's GLOB_ALTDIRFUNC extension. musl's
  # glob is POSIX and has no such field, so make_cv_sys_gnu_glob=yes was
  # asserting something untrue and the bundled glob is not optional for 4.2.1.
  # live-bootstrap does not hit any of this because their pass1.sh runs
  # `autoreconf -fi` first and their libc at that rung is not musl.
  #
  # 4.3 dropped the bundled glob entirely and 4.4 keeps it dropped, using
  # gnulib instead -- which is GNU-complete and is what Alpine builds against
  # musl as a matter of course.
  MAKE_ALT: '4.4'
  # 3.82 AND ONLY 3.82. This is live-bootstrap's version and, more to the
  # point, the version their steps/make-3.82/pass1.kaem command list is written
  # against -- 27 files with per-file -D flags that stand in for a configure
  # that cannot run here. 4.4 was fetched for a while as a second guess at a
  # tar problem that turned out to be the archive format; it has no recipe
  # behind it and is gone.
  # stage 4's OWN versions, copied deliberately. If they drift apart the
  # overlap with stage4-complete stops being an overlap.
  # BINUTILS 2.30, NOT STAGE 4's 2.46, AND THAT DIVERGENCE IS DELIBERATE.
  #
  # Stage 4 does not build binutils at all -- `binutils` is in chain/env0.sh's
  # BORROWED list and comes from the host, so its version was never a tcc
  # question. This job is the first thing in the tree that asks a tcc to
  # COMPILE binutils, and tcc has a known ceiling there.
  #
  # live-bootstrap's first binutils is 2.30 (steps/manifest, step #81), reached
  # only after musl and the whole autotools chain. Its older sysa/ layout used
  # 2.14, chosen because 2.14 "seems to be the limit for tcc". A 2024
  # guix-devel report puts the modern edge lower than our stage-4 pin: "I'm
  # using latest versions of all packages, except Binutils, whose version 2.43
  # does not link the object files from TCC."
  #
  # 2.46 was copied here from stage4-complete on the assumption that matching
  # its versions made the overlap real. It does not: the overlap is at gcc
  # 4.7.4, and binutils below that is an implementation detail each side is
  # free to satisfy its own way -- stage 4 by borrowing, this job by building.
  # Pinning a version no tcc has been shown to compile would have failed rung 4
  # and looked like a compiler defect.
  # QUOTED, BECAUSE YAML READS 2.30 AS A NUMBER. Unquoted it becomes the float
  # 2.3, the trailing zero is gone, and the fetch asks ftp.gnu.org for
  # binutils-2.3.tar.xz and gets a 404. 2.46.0 survived only because two dots
  # make it a string. Every version below is quoted so none of them depends on
  # how many dots it happens to have.
  BINUTILS: '2.30'
  GMP_VER: '6.3.0'
  MPFR_VER: '4.2.2'
  MPC_VER: '1.3.1'
  GCC47: '4.7.4'
  # 4.8.5 IS NOT A RUNG. gcc 4.7.4 HAS NO aarch64 BACKEND -- stage 4 logs
  # "4.7.4 aarch64 mentions in config.gcc (expect 0)" -- so 4.8.5's backend is
  # transplanted into it by spikes/stage4/probes/backport-aarch64.sh, which
  # already exists and which stage 4 already relies on. 4.8.5 is fetched only
  # as the donor tree. 4.8.5 rather than 4.8.0 for the reason that script's
  # header measures: the backend/middle-end interface does not move within the
  # 4.8 series, so 4.8.5 is no further from 4.7 while carrying ~1800 lines of
  # fixes.
  GCC48: '4.8.5'
  # gcc 10 IS BUILT BY g++ 4.7.4, which is the entire reason 4.7 is the entry
  # point: it is the last gcc written in C, so tcc can reach it, and its C++
  # front end is what carries the chain upward. Every gcc after 4.7 is C++ and
  # cannot be built by a C compiler at all. Stage 4's version, so the overlap
  # stays an overlap.
  GCC10: '10.2.0'
  # CHAPTER 5 IS A DIFFERENT TOOLCHAIN. gcc 15 and a modern binutils, cross to
  # LFS_TGT, against a glibc sysroot -- stage 4's versions so the overlap holds.
  # BINUTILS above is 2.30 because tcc has a ceiling; nothing here is built by
  # tcc, so chapter 5 uses 2.46 as stage 4 does.
  GCC15: '15.2.0'
  BINUTILS_LFS: '2.47'
  GLIBC: '2.44'
  # EVERY VERSION HERE COMES FROM ONE BOOK, AND THAT IS THE POINT.
  #
  # spikes/stage4/books/LFS-BOOK-r13_0-156-systemd is the development snapshot
  # this chain follows, and it specifies:
  #
  #     Linux 7.1.3   Perl 5.42.2   Glibc 2.43   Binutils 2.46   GCC 15.2.0
  #
  # We had drifted on two of them -- perl 5.42.0 from the STABLE 13.0 book, and
  # kernel 7.1.5 from nowhere in particular. Mixing books is how a pairing
  # nobody tested becomes the thing being debugged: glibc 2.43's
  # upstream_fixes patch exists precisely to reconcile a libc with a kernel it
  # was not shipped against, and stage 4's comment calls it "THE PRICE OF
  # LINUX 7". Taking one book's whole set means that price is the book's
  # problem rather than ours.
  #
  # KHDR AND KERNEL DIVERGE ON PURPOSE, AND THIS IS THE ONE PLACE WE LEAVE THE
  # BOOK DELIBERATELY.
  #
  # The book pairs 7.1.3 with both. We take its headers at 7.1.3 and boot
  # 7.1.5, because stage4-complete already builds and boots exactly that
  # pairing -- glibc 2.43 with the upstream_fixes patch, 7.1.3-era headers,
  # 7.1.5 kernel -- so it is tested rather than hoped for.
  #
  # A KERNEL MAY ALWAYS BE NEWER THAN THE HEADERS ITS LIBC WAS COMPILED
  # AGAINST. That is the normal direction: the kernel's syscall ABI is stable
  # forward, so a libc built against older headers runs on a newer kernel. The
  # reverse is what breaks. Keeping them as two variables makes that a
  # property we state rather than one we get by accident, and it is the shape
  # every later bump will take -- linux-next against a released glibc is the
  # same question with a bigger gap.
  #
  # WHEN IT DOES BREAK, IT LOOKS LIKE THIS: glibc's build stops with
  # "redefined [-Werror]" on a type both the kernel headers and the libc
  # declare. Rung 13 greps for exactly that and says so, because the message
  # names a symbol rather than the pairing that caused it. stage 4's own
  # fallback is to drop the headers back to the version the book pairs with
  # this glibc -- i.e. set KHDR and KERNEL equal -- and keep booting the newer
  # one.
  KHDR: '7.1.5'
  KERNEL: '7.1.5'
  # glibc's minimum-kernel setting -- unrelated to either of the above.
  ENABLE_KERNEL: '5.4'
  # perl IS BUILT EARLIER THAN LFS PUTS IT. The book has it in chapter 7,
  # inside the chroot, because chapters 5 and 6 borrow the host's. This box has
  # no host: rung 10 already printed "/bin/sh: perl: not found", and glibc and
  # the kernel both need it. Stage 4's version and stage 4's recipe.
  PERL_VER: '5.44.0'
  # The kernel's own prerequisites. kconfig is generated by flex and bison;
  # m4 comes first because both need it; bc is not optional because
  # kernel/time/Makefile pipes CONFIG_HZ through it to generate timeconst.h.
  # GAWK IS REAL, AND THE WRAPPER'S CLAIM WAS TESTED AND FAILED.
  #
  # The box shipped a gawk wrapper around busybox awk, on the strength of
  # tool-probe measuring ENVIRON, -f, gsub, printf and match all working. Its
  # own comment said: "If something later needs a gawk extension busybox lacks,
  # it fails on that extension, which is a legible failure."
  #
  # glibc 2.44's build is that failure:
  #
  #     awk: bad regex '\/[^': Invalid regular expression
  #     awk: scripts/sysd-rules.awk:31: Call to undefined function
  #
  # Its own awk scripts use a regex busybox's engine rejects and a function
  # busybox does not implement. The measurement was right about what it
  # measured and the inference beyond it was wrong.
  GAWK_VER: '5.3.2'
  # OPENSSL: the kernel's scripts/sign-file.c includes <openssl/bio.h>, and
  # arm64 defconfig turns CONFIG_MODULE_SIG on. stage4-complete builds it for
  # exactly this reason and we had none.
  OPENSSL_VER: '3.5.4'
  M4_VER: '1.4.21'
  BC_VER: '7.0.3'
  BISON_VER: '3.8.2'
  FLEX_VER: '2.6.4'
  BUSYBOX_VER: '1.36.1'
  # PYTHON IS REQUIRED BY glibc's CONFIGURE, measured by tool-probe:
  #   *** These critical programs are missing or too old: make gawk bison python
  # LFS builds it in chapter 7 for the chroot and never needs it at chapter 5,
  # because chapter 5 runs on a host that has one. We have no host.
  # 3.14.6, WHICH IS WHAT THE BOOK WE FOLLOW SPECIFIES. We had 3.14.3 from
  # nowhere in particular -- the same drift that put perl at 5.42.0 and the
  # kernel at 7.1.5. r13.0-156-systemd also carries
  # Python-3.14.6-consolidated_fixes-1.patch, so the version and its patch
  # have to move together.
  PYTHON_VER: '3.14.6'

jobs:

  # ===================================================================
  # ORACLE. Host gcc builds upstream's M2-Planet and runs it on the same
  # -f list our G0 will get. Never touches the box; only its .M1 output
  # crosses back, after the box has closed.
  # ===================================================================
  oracle:
    runs-on: ubuntu-24.04-arm          # NATIVE aarch64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make git

      - name: Fetch pinned upstreams
        run: |
          set -eu
          git clone https://github.com/oriansj/M2-Planet.git m2
          git -C m2 checkout -q "$M2PLANET_SHA"
          git -C m2 submodule update --init --recursive
          git -C m2/M2libc checkout -q "$M2LIBC_SHA" 2>/dev/null || true
          echo "  M2-Planet $(git -C m2 rev-parse --short HEAD)  M2libc $(git -C m2/M2libc rev-parse --short HEAD)"

      - name: Derive the -f list from upstream's own script
        run: |
          set -eu
          # NEVER HAND-WRITE THE -f LIST. Four reconstructed lists in a row were
          # wrong (m2libc-113-bisect's header records this), and the specific
          # trap here is `M2libc/bootstrap.c` -- the generic one, which does NOT
          # EXIST at the 1.13.1 pin. Four workflows still reference it and are
          # red because of it: stage3-m2-demo, mescc-tools-full, no-host-chain
          # and selfhost-demo. Deriving from upstream's script cannot make that
          # mistake, and the assertion below makes sure of it.
          S=m2/test/test1000/hello-aarch64.sh

          # ANCHOR ON THE INVOCATION, NOT THE PROJECT NAME. The first run of
          # this job derived an EMPTY list because `grep -m1 'M2-Planet'`
          # matched line 4 of the GPL header --
          #     ## This file is part of M2-Planet.
          # -- which carries no -f tokens at all. Match `bin/M2-Planet`, which
          # only the invocation line has. The x86 proof invocation further down
          # runs ./test/results/test1000-aarch64-binary and so cannot be hit by
          # this pattern, which is the other half of why this anchor is right.
          #
          # The continuation lines are TAB-indented, so the -f token separator
          # is not reliably a space: extract with [[:space:]] rather than ' ',
          # or the match runs on past the filename into the next token.
          sed -e ':a' -e '/\\$/{N; s/\\\n/ /; ta}' "$S" > joined.sh
          grep -m1 'bin/M2-Planet' joined.sh \
            | grep -oE -- '-f[[:space:]]+[^[:space:]]+' \
            | sed 's/^-f[[:space:]]*//' > flist.txt

          if [ ! -s flist.txt ]; then
            echo "FAIL: derived an empty -f list from $S"
            echo "  the joined invocation line this matched, if any:"
            grep -m1 'bin/M2-Planet' joined.sh | cut -c1-300 | sed 's/^/    /' || echo "    (no match)"
            echo "  first 30 lines of the script, for the next reader:"
            head -30 "$S" | sed 's/^/    /'
            exit 1
          fi

          echo "  derived $(wc -l < flist.txt) files:"
          sed 's/^/    /' flist.txt

          # THE EXISTENCE CHECK IS THE GATE -- not a pattern assertion. The
          # first draft hard-failed if the list named M2libc/bootstrap.c, on
          # the strength of the note in spikes/stage3/README.md that the file
          # is gone at 1.13.1. That is a claim about the pin, and asserting it
          # by pattern would false-fail the day it stops being true. Checking
          # that every named file is actually present tests the same thing,
          # cannot be wrong, and says which file if it is.
          miss=0
          while read -r f; do
            [ -f "m2/$f" ] || { echo "    MISSING: $f"; miss=1; }
          done < flist.txt
          if [ "$miss" != 0 ]; then
            echo "FAIL: upstream's own script names files that are not in the tree at this pin."
            echo "      If the missing one is M2libc/bootstrap.c, that is the removal"
            echo "      spikes/stage3/README.md records, and BOTH arms must drop it --"
            echo "      do not fix it in one arm only."
            exit 1
          fi
          if grep -qx 'M2libc/bootstrap.c' flist.txt; then
            echo "  NOTE: the generic M2libc/bootstrap.c IS present at this pin."
            echo "        The box omits it from G0's translation unit (m71's rule)"
            echo "        and passes it to G1 unpatched. Both are reported in-box."
          fi

      - name: Build upstream's reference compiler and self-compile
        run: |
          set -eu
          make -C m2 M2-Planet
          cd m2
          # the -f list, verbatim, as upstream wrote it
          set --
          while read -r f; do set -- "$@" -f "$f"; done < ../flist.txt
          ./bin/M2-Planet --architecture aarch64 --bootstrap-mode "$@" -o ../ref-gen1.M1
          cd ..
          printf '  ref-gen1.M1  %s bytes  %s\n' \
            "$(wc -c < ref-gen1.M1)" "$(sha256sum ref-gen1.M1 | cut -c1-16)"

      - uses: actions/upload-artifact@v4
        with:
          name: oracle
          path: |
            ref-gen1.M1
            flist.txt

  # ===================================================================
  # THE BOX.
  # ===================================================================
  seed:
    runs-on: ubuntu-24.04-arm          # NATIVE aarch64 -- no qemu in the way
    needs: oracle
    timeout-minutes: 60
    env:
      # TIER 1 -- on the build path. THIS IS THE NUMBER THAT MUST REACH ZERO.
      # When spikes/stage0-as/stage0-as and spikes/elf/elf are committed this
      # goes to '' -- git preserves the executable bit, so a committed ELF is
      # run by the kernel's own loader and needs NO tool to become runnable.
      # A committed hex file would need one to convert it, which is the host
      # dependency being removed. The readable artifact is the .s source; that
      # the binary corresponds to it exactly is proven by stage0-selfhost, not
      # assumed. Set this to '' in the SAME commit that adds the binaries --
      # the SEAL step enforces whatever is declared here, so they cannot drift.
      BUDGET_PATH: ''
      # TIER 2 -- the driver. One binary.
      BUDGET_DRIVER: 'busybox'
    steps:
      - uses: actions/checkout@v5

      # --- AIRLOCK: everything that needs a network happens here ----------
      - name: Install (airlock only -- none of this enters the box)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap binutils busybox-static git python3 file
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true

      - name: Fetch pinned upstreams
        run: |
          set -eu
          git clone https://github.com/oriansj/M2-Planet.git pins/m2
          git -C pins/m2 checkout -q "$M2PLANET_SHA"
          git -C pins/m2 submodule update --init --recursive
          git -C pins/m2/M2libc checkout -q "$M2LIBC_SHA" 2>/dev/null || true
          git clone --recursive https://github.com/oriansj/mescc-tools.git pins/mescc
          git -C pins/mescc checkout -q "$MESCC_SHA"
          echo "  M2-Planet $(git -C pins/m2 rev-parse --short HEAD)"
          echo "  M2libc    $(git -C pins/m2/M2libc rev-parse --short HEAD)"
          echo "  mescc     $(git -C pins/mescc rev-parse --short HEAD)"

      - uses: actions/download-artifact@v4
        with:
          name: oracle
          path: oracle

      - name: The substitution (airlock -- a source edit, not a compilation)
        run: |
          set -eu
          L=pins/m2/M2libc
          echo "  what drop_asm removes from aarch64/linux/bootstrap.c:"
          python3 tools/drop_asm.py --list "$L/aarch64/linux/bootstrap.c" | sed 's/^/    /'
          python3 tools/drop_asm.py "$L/aarch64/linux/bootstrap.c" > pins/patched_bootstrap.c
          echo "    asm() blocks remaining: $(grep -c 'asm(' pins/patched_bootstrap.c || true)"
          printf '  %-28s %8s  %s\n' 'bootstrap.c (upstream)' \
            "$(wc -c < "$L/aarch64/linux/bootstrap.c")" \
            "$(sha256sum "$L/aarch64/linux/bootstrap.c" | cut -c1-16)"
          printf '  %-28s %8s  %s\n' 'bootstrap.c (patched)' \
            "$(wc -c < pins/patched_bootstrap.c)" \
            "$(sha256sum pins/patched_bootstrap.c | cut -c1-16)"
          # Reuse the oracle's derived list verbatim. Both arms MUST get the
          # identical -f list; a list derived twice is a list that can differ
          # twice, and then a red gate means nothing.
          cp oracle/flist.txt pins/flist.txt
          echo "  -f list ($(wc -l < pins/flist.txt) files) taken from the oracle job, not re-derived"

      - name: Derive the mescc-tools source lists from upstream's makefile
        run: |
          set -eu
          # Same rule, same reason: no-host-chain's header records that three
          # hand-written lists in a row were wrong, and that the one they all
          # missed was stringify.c -- whose absence hung M1 at runtime while
          # --help still worked. The makefile is authoritative. This is that
          # job's derivation, unchanged, so the two diff against each other.
          MK=pins/mescc/makefile
          srcs() {
            grep -E "^bin/$1:" "$MK" | sed 's/|.*//' \
              | grep -o '[A-Za-z0-9_./-]*\.c' | awk '!seen[$0]++' \
              | grep -v 'bootstrappable\.c'
          }
          # M2-Planet is single-pass: the main-bearing file must come last.
          order() {
            m=""; r=""
            for f in $1; do
              if grep -q '^int main(' "pins/mescc/$f" 2>/dev/null; then m="$f"; else r="$r $f"; fi
            done
            echo "$r $m"
          }
          # THE MAKEFILE LISTS TRANSLATION UNITS. IT DOES NOT LIST HEADERS,
          # AND THIS BUILD CONCATENATES RATHER THAN COMPILES-AND-LINKS, SO A
          # HEADER LEFT OUT IS A TYPE THAT DOES NOT EXIST.
          #
          # That is exactly what blocked hex2. `struct entry` and
          # `struct input_files` are defined ONLY in hex2.h; hex2_globals.h
          # merely declares `extern struct entry** jump_tables;`. With hex2.h
          # absent, hex2.c:34
          #
          #     jump_tables = calloc(65537, sizeof(struct entry*));
          #
          # asks stage 2 for the size of a type it has never seen -- and stage 2
          # segfaulted rather than saying so, which is why this read as "our
          # hex2 crashes" for as long as it did. Both halves are fixed: stage 2
          # now diagnoses (spikes/stage2-pico-c, struct_size), and the header is
          # in the unit. MEASURED: with hex2.h present, stage 2 compiles the
          # hex2 unit clean -- rc=0, 202,160 bytes of stage-1 assembly.
          #
          # The headers are derived from the SOURCES' OWN #include lines rather
          # than listed here, for the same reason the .c list is derived from
          # the makefile: a hand-written list is a list that goes stale, and
          # no-host-chain's header records three of them in a row being wrong.
          # THE CLOSURE MUST BE TRANSITIVE, AND THE FIRST VERSION WAS NOT.
          #
          # Scanning only the .c files finds hex2_globals.h and stops -- but
          # `struct entry` and `struct input_files` live in hex2.h, one level
          # further down, and hex2.h in turn needs M2libc/bootstrappable.h.
          # A one-level scan produced a unit missing the very type that
          # hex2.c:34 asks the size of. It cost a run, and it read as
          # "our hex2 crashes" rather than as a list that was short by one.
          #
          # tools/include_closure.py walks the graph to a fixpoint and emits
          # dependencies FIRST -- hex2.h before hex2_globals.h -- because this
          # unit is CONCATENATED, not compiled, so order is meaning rather than
          # style. It also FAILS on a quoted include it cannot resolve instead
          # of dropping it, which is the same defect one layer along.
          #
          # MEASURED with the closure in place, both units compile clean:
          #   hex2  rc=0, 202,160 bytes of stage-1 assembly
          #   M1    rc=0, 179,172 bytes
          for t in M1 hex2; do
            out=$(order "$(srcs "$t")")
            [ -n "$(echo $out)" ] || { echo "FAIL: could not derive $t sources"; exit 1; }
            h=$(python3 tools/include_closure.py pins/mescc $out) \
              || { echo "FAIL: could not close $t's includes"; exit 1; }
            printf '%s\n' $h $out > "pins/$t-srcs.txt"
            echo "  $t headers: $(echo $h)"
            echo "  $t sources: $out"
          done

          # OBJECT-LIKE #defines BECOME enums, IN THE AIRLOCK.
          #
          # stage 2 has no preprocessor: nt_hash skips a `#` line to
          # end-of-line and that is all of it. So `#define AARM64 0xB7` leaves
          # nothing behind and AARM64 reaches stage 1 as an unresolved label.
          #
          # It has never mattered before because M2-Planet uses `#define`
          # exactly ONCE in its entire source -- `#define CC_H`, a bare guard --
          # and expresses every constant as an `enum`, having been written for
          # compilers with no preprocessor. mescc-tools is the same author
          # writing for a later rung, so hex2 is the first thing in this ladder
          # to need one.
          #
          # Teaching stage 2 `#define` would add a second mechanism, in
          # hand-written aarch64 assembly, for something its enum table already
          # expresses. Rewriting the constants is smaller and checkable, and it
          # is the same category as drop_asm.py above: a declared source edit in
          # the AIRLOCK, not a compilation. The box still gets only busybox and
          # receives the result through pins/.
          #
          # The tool REFUSES function-like or non-integer macros rather than
          # guessing, so if upstream adds one this stops instead of quietly
          # putting a wrong constant into a linker.
          # M1's STRING BUFFER, RAISED BEFORE ANYTHING READS THE SOURCE.
          #
          # tcc's keyword table is ONE string literal -- if\0else\0while\0...
          # through every attribute name -- and micro-c emits it as a single
          # 19,571-character line in the .M1. M1's max_string is 4096, so it
          # stops with
          #
          #     tcc-all.M1:363852 :String: '...' exceeds max string size
          #
          # after micro-c had already compiled all 369,946 lines of libtcc.M1.
          # spikes/stage3/tools/local-build.sh has carried this substitution and
          # its comment ("TRAP 2") since long before this job existed; the
          # hermetic path simply never did it.
          #
          # Assert the literal before substituting, so an upstream change reads
          # as a pin failure here rather than as a truncation that looks like a
          # codegen bug three rungs later.
          grep -q 'max_string = 4096,' pins/mescc/M1-macro.c \
            || { echo "FAIL: M1-macro.c no longer contains 'max_string = 4096,'";
                 grep -n 'max_string' pins/mescc/M1-macro.c; exit 1; }
          sed -i 's/max_string = 4096,/max_string = 262144,/' pins/mescc/M1-macro.c
          grep -q 'max_string = 262144,' pins/mescc/M1-macro.c \
            || { echo "FAIL: the substitution did not take"; exit 1; }
          # THE mescc-tools SERIES IS DELIBERATELY NOT APPLIED HERE.
          #
          # I added it for symmetry with local-build.sh and it broke GATE 2:
          # patches/mescc-tools/0001 makes hex2 emit a label map guarded by
          #     getenv("HEX2_LABEL_MAP")
          # and getenv lives in M2libc/stdlib.c, which is not in hex2's unit.
          #     stage1: unresolved label: getenv
          # It is a debugging aid for the local path, where a full libc is
          # linked; it is not a build requirement. Applying a patch this box
          # cannot satisfy, to match a script that runs elsewhere, is not
          # symmetry -- it is a regression with a tidy justification.
          echo "  M1 max_string raised to 262144 (tcc's keyword table is 19,571 chars)"

          # OCTAL FIRST, THEN THE DEFINES. THE ORDER IS LOAD-BEARING.
          #
          # stage 2 does not implement octal: parseval checks for a leading
          # `0x` and otherwise reads the digits as decimal, so `0750` is 750.
          # hex2.c:196 chmods its own output with 0750, and 750 as a mode is
          # 0o1356 -- owner `--wx`, no read bit. hex2 linked gen1 correctly and
          # then nothing could open it:
          #
          #     /work/run.sh: line 9: can't open /out/gen1: Permission denied
          #
          # THIS ONE IS EXHAUSTIVE ON PURPOSE, unlike the defines rewrite. A
          # `#define` stage 2 cannot expand fails LOUDLY, as an unresolved label
          # at stage 1. A misparsed octal literal fails SILENTLY -- it is just a
          # different number, and the program runs and does the wrong thing. So
          # every literal in the unit is rewritten and reported, not only the
          # one that happened to hurt.
          #
          # Measured across the pinned trees: M2-Planet has ZERO octal literals
          # (same reason it has no #defines -- written for compilers like this
          # one), mescc-tools has exactly ONE, and M2libc has 223, all of them
          # mode and open-flag constants like `#define S_IRWXU 00700`.
          #
          # Those M2libc ones are why this runs BEFORE defines_to_enums: that
          # tool would match `00700` as an integer and emit
          # `enum { S_IRWXU = 00700 }`, which stage 2 then reads as 700. Running
          # octal first means the defines tool only ever sees decimal.
          rm -rf pins/mescc-oct pins/mescc-s2
          for t in M1 hex2; do
            echo "  rewriting $t's octal literals:"
            python3 tools/octal_to_decimal.py pins/mescc pins/mescc-oct \
              $(cat "pins/$t-srcs.txt") \
              || { echo "FAIL: could not rewrite $t's octal literals"; exit 1; }
          done
          for t in M1 hex2; do
            echo "  rewriting $t's defines:"
            python3 tools/defines_to_enums.py pins/mescc-oct pins/mescc-s2 \
              $(cat "pins/$t-srcs.txt") \
              || { echo "FAIL: could not rewrite $t's defines"; exit 1; }
          done
          # A PRODUCER WITH NO CONSUMER IS A LIE IN THE LOG, AND SO IS A
          # CONSUMER WITH NO PRODUCER. The previous two revisions had one of
          # each: the rewrite ran and nothing read it, then build2 read a
          # directory nothing created. Assert the tree exists and covers every
          # file build2 will ask for, here, where the message can be plain.
          for t in M1 hex2; do
            while read -r f; do
              [ -f "pins/mescc-s2/$f" ] || {
                echo "FAIL: pins/mescc-s2/$f missing -- the rewrite did not"
                echo "      cover every file in pins/$t-srcs.txt"; exit 1; }
            done < "pins/$t-srcs.txt"
          done
          echo "  rewritten tree: $(find pins/mescc-s2 -type f | wc -l) files"

      - name: 'AIRLOCK: micro-c source, and tcc, for the stage-3 rung'
        run: |
          set -eu
          # micro-c IS M2-Planet PLUS THIS PROJECT'S PATCH SERIES, and the
          # difference matters. GATE 1 above proves the ladder reaches UPSTREAM
          # M2-Planet byte for byte -- it says nothing about the compiler stage
          # 3 actually uses, which is upstream plus 38 experiments. Applying
          # them is a source edit, so it happens out here beside drop_asm.py
          # and the two rewrites; the box gets the result through pins/.
          rm -rf pins/microc && cp -r pins/m2 pins/microc
          git -C pins/microc init -q . 2>/dev/null || true
          n=0
          for p in spikes/stage3/patches/m2-planet/[0-9]*.patch \
                   spikes/stage3/patches/micro-c-experiments/EXPERIMENT-*.patch; do
            [ -e "$p" ] || continue
            git -C pins/microc apply --ignore-whitespace "$PWD/$p" \
              || { echo "FAIL: $(basename "$p") does not apply"; exit 1; }
            n=$((n + 1))
          done
          # A FLOOR, BECAUSE A SILENTLY EMPTY SERIES LOOKS EXACTLY LIKE A
          # PASSING ONE. tcc-two-ways carries the same guard for the same
          # reason.
          # local-build.sh requires 41; there is no reason this should be the
          # looser guard. 43 apply today.
          [ "$n" -ge 41 ] || { echo "FAIL: only $n patches applied, expected >= 41"; exit 1; }
          echo "  micro-c = M2-Planet + $n patches"

          # THE TARBALL IS EXTRACTED HERE, NOT IN THE BOX. busybox has tar, but
          # the box's applet list is the budget's inventory and every name on it
          # is a capability someone has to justify. Unpacking is not a
          # compilation, so it belongs in the airlock.
          rm -rf pins/tcc-src && mkdir -p pins/tcc-src
          tar -xzf spikes/toolbox/tcc-5ec0e6f8-arm64-configured.tar.gz \
              -C pins/tcc-src --strip-components=1
          [ -f pins/tcc-src/config.h ] \
            || { echo "FAIL: no config.h -- the tarball is not the configured one"; exit 1; }
          # A FLOOR, BECAUSE THE SUITE BELOW DEPENDS ON THESE. Every program
          # uses __asm__ with register constraints for its syscalls, so tcc's
          # arm64 inline assembler has to be patched in. If this glob ever
          # matches nothing, zero patches apply in silence and ten programs
          # fail for a reason that has nothing to do with micro-c.
          tap=0
          for p in spikes/stage3/patches/tcc-arm64-asm/[0-9]*.patch; do
            [ -e "$p" ] || continue
            git -C pins/tcc-src apply --ignore-whitespace "$PWD/$p" 2>/dev/null \
              || patch -p1 -d pins/tcc-src -i "$PWD/$p" >/dev/null \
              || { echo "FAIL: $(basename "$p") does not apply to tcc"; exit 1; }
            tap=$((tap + 1))
          done
          [ "$tap" -ge 5 ] || { echo "FAIL: only $tap tcc-arm64-asm patches, expected >= 5"; exit 1; }
          # AND THE OTHER HALF, WHICH IS THE ONE THAT WOULD HAVE CAUGHT THIS.
          # "$tap patches applied" is not "the fix is in the tree" -- the same
          # distinction TRAP 3 draws for the m2libc defs below. The tarball is
          # already patched for 0001-0005, so five of those seven applications
          # are no-ops and the counter cannot tell. 0006 and 0007 are the two
          # that really change the tree, and 0006 is the reason this step now
          # asserts anything at all: it added
          #     #include <math.h>
          #     #include <float.h>
          # to tccgen.c, micro-c's include set had no float.h, and step 10
          # reported nothing but
          #     tccgen.c:25:Unable to find include file: float.h
          #     stage 3 end to end: no
          # 400 lines later. Every other job that applies this series builds
          # tcc with the HOST compiler and has a host float.h, so nothing else
          # went red.
          grep -q '#include <float.h>' pins/tcc-src/tccgen.c \
            || { echo "FAIL: patch 0006 is not in tccgen.c"; exit 1; }
          grep -q 'VT_VALMASK | VT_LVAL | VT_SYM)) == VT_CONST' pins/tcc-src/tccgen.c \
            || { echo "FAIL: patch 0007 is not in tccgen.c"; exit 1; }

          # THE MICRO-C-ONLY tcc PATCHES. Small, and separate from the arm64
          # assembler series because they are not about the target -- they are
          # about the compiler doing the building. Currently one: long double
          # is eight bytes, which is what micro-c's float model actually gives
          # the tcc it builds, and without which tcc's own guard refuses to
          # emit any long double constant at all. See the patch preamble.
          tmp=0
          for p in spikes/stage3/patches/tcc-microc/[0-9]*.patch; do
            [ -e "$p" ] || continue
            git -C pins/tcc-src apply --ignore-whitespace "$PWD/$p" 2>/dev/null \
              || patch -p1 -d pins/tcc-src -i "$PWD/$p" >/dev/null \
              || { echo "FAIL: $(basename "$p") does not apply to tcc"; exit 1; }
            tmp=$((tmp + 1))
          done
          echo "  tcc-microc patches: $tmp"
          echo "  tcc-src ready: $(ls pins/tcc-src/*.c | wc -l) .c files, $tap asm patches"

          # THE TABLES COME FROM spikes/reference/m2libc, PATCHED -- NOT FROM
          # M2-Planet'S SUBMODULE.
          #
          # The box clones M2-Planet, whose M2libc submodule carries a 229-line
          # aarch64_defs.M1. The M2libc this project actually uses has 2,404
          # lines, and `ret` is one of the 2,175 the submodule's copy lacks:
          #
          #     tcc-all.M1:20 :Received invalid other; ret
          #     DEFINE ret present: 0
          #
          # GATE 2 links gen1 with the submodule's tables because M2-Planet's
          # own output happens to stay inside that vocabulary. micro-c
          # compiling M2libc's aarch64 asm does not.
          #
          # local-build.sh has said so in a comment for as long as it has
          # existed -- "THE TABLES COME FROM HERE, NOT FROM spikes/reference"
          # is its heading for the patched copy -- and the hermetic path was
          # reaching for the submodule instead.
          #
          # Steps 7-9 are untouched: GATE 1 compares against an oracle built
          # from the submodule, so changing what THEY use would break the
          # comparison. This tree is for step 10 only.
          rm -rf pins/m2libc-veron
          cp -r spikes/reference/m2libc pins/m2libc-veron
          git -C pins/m2libc-veron init -q 2>/dev/null || true
          mn=0
          for p in spikes/stage3/patches/m2libc/[0-9]*.patch; do
            [ -e "$p" ] || continue
            git -C pins/m2libc-veron apply --ignore-whitespace "$PWD/$p" \
              || { echo "FAIL: $(basename "$p") does not apply to m2libc"; exit 1; }
            mn=$((mn + 1))
          done
          [ "$mn" -ge 6 ] || { echo "FAIL: expected >= 6 m2libc patches, got $mn"; exit 1; }
          # TRAP 3, as local-build.sh calls it: assert the encoding fix is in
          # the table that will actually be used, not merely that a patch ran.
          grep -q '^DEFINE add_x0,x16,x0 0002008b' \
            pins/m2libc-veron/aarch64/aarch64_defs.M1 \
            || { echo "FAIL: the x16 encoding fix is not in the defs table"; exit 1; }
          grep -q '^DEFINE ret ' pins/m2libc-veron/aarch64/aarch64_defs.M1 \
            || { echo "FAIL: no DEFINE ret in the defs table"; exit 1; }
          # THE OTHER HALF OF local-build.sh's TRAP 3, which I carried only
          # half of last time. Its comment is the reason: "the patch was
          # applied" and "the fix is there" are different claims, and only the
          # second one matters.
          grep -q 'define va_copy(ap1, ap2) ap1 = ap2' pins/m2libc-veron/stdarg.h \
            || { echo "FAIL: va_copy is still reversed"; exit 1; }
          echo "  m2libc (ours) = reference + $mn patches, $(grep -c '^DEFINE' pins/m2libc-veron/aarch64/aarch64_defs.M1) DEFINEs"

          # EVERY ANGLE-BRACKET INCLUDE tcc's SOURCE REACHES FOR HAS TO BE
          # RESOLVABLE FROM THE INCLUDE PATH STEP 10 PASSES, which is
          # -I . -I micro-c-libc -I m2libc-veron and nothing else. There is no
          # system include path in the box, so a header that is merely usual is
          # a header that is missing. Non-fatal on purpose -- some of these sit
          # behind #ifdefs that never fire on this target -- but it prints the
          # name here, in the airlock, rather than leaving it to be read out of
          # three truncated lines of stderr 400 lines later.
          miss=
          for h in $(sed -n 's/^#include <\([a-z0-9_/]*\.h\)>.*/\1/p' \
                       pins/tcc-src/*.c pins/tcc-src/*.h | sort -u); do
            [ -f "pins/tcc-src/$h" ] && continue
            [ -f "spikes/stage3/micro-c-libc/$h" ] && continue
            [ -f "pins/m2libc-veron/$h" ] && continue
            miss="$miss $h"
          done
          if [ -n "$miss" ]; then
            echo "  NOTE: angle includes not on micro-c's path:$miss"
          else
            echo "  every angle include in tcc's source resolves on micro-c's path"
          fi

          # The -f list is the oracle's, exactly as G0/G1 use it.
          cp pins/flist.txt pins/microc-srcs.txt

      # --- BUILD THE BOX --------------------------------------------------
      - name: Load the stage-2 conformance corpus
        run: |
          set -eu
          # THE CORPUS IS A COMMITTED FILE. It used to be extracted from
          # stage2-pico-c-demo.yml on every run, which made test data a
          # dependency of a YAML file -- and archiving that YAML broke this
          # build, because GitHub stops EXECUTING an archived workflow but
          # nothing stops another job READING it. Data belongs in the tree.
          #
          # tools/extract_stage2_tests.py still exists and the provenance is in
          # spikes/stage2-pico-c/corpus/README.md; regenerating is a deliberate
          # act now rather than something that happens silently every run.
          CORPUS=spikes/stage2-pico-c/corpus/conformance.tsv
          [ -f "$CORPUS" ] || { echo "  corpus not found at $CORPUS"; exit 1; }
          # pins/ IS BIND-MOUNTED AT /in, AND THE IN-BOX SCRIPT READS
          # /in/stage2-tests.corpus. The extractor used to write there directly;
          # replacing it with a copy to tests.tsv in the workspace left that
          # path empty, so the while-read loop read nothing and the suite
          # reported "0/0 passed, 0 failed" -- as a PASS.
          mkdir -p pins
          cp "$CORPUS" pins/stage2-tests.corpus
          n=$(wc -l < pins/stage2-tests.corpus)
          printf '  corpus %s: %s tests, %s\n' "$CORPUS" "$n" \
            "$(sha256sum pins/stage2-tests.corpus | cut -c1-16)"
          # THE FLOOR THE EXTRACTOR USED TO ENFORCE. --floor 415 asserted the
          # extraction found a plausible number of tests; dropping the extractor
          # dropped the floor with it, and nothing downstream had any opinion
          # about how many tests should run.
          if [ "$n" -lt 415 ]; then
            echo "  FAIL: only $n tests; the corpus should carry at least 415."
            exit 1
          fi


      - name: Assemble the box
        run: |
          set -eu
          BOX="$PWD/box"; echo "BOX=$BOX" >> "$GITHUB_ENV"
          mkdir -p "$BOX"/bin "$BOX"/lib "$BOX"/work "$BOX"/out \
                   "$BOX"/src "$BOX"/in "$BOX"/tmp "$BOX"/proc "$BOX"/dev

          for t in $BUDGET_PATH; do
            cp -L "$(command -v "$t")" "$BOX/bin/$t"
          done
          cp -L /bin/busybox "$BOX/bin/busybox"

          # dynamic deps of whatever we just copied, and the loader itself
          for b in "$BOX"/bin/*; do
            ldd "$b" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}'
          done | sort -u > /tmp/needed
          while read -r l; do [ -f "$l" ] && cp -L "$l" "$BOX/lib/" || true; done < /tmp/needed
          mkdir -p "$BOX"/usr/lib && cp -a "$BOX"/lib/. "$BOX"/usr/lib/ 2>/dev/null || true

          # busybox applet names. Anything the in-box script uses must be here;
          # PATH inside the box is /bin only, so a missing applet fails loudly
          # instead of silently reaching for a host binary.
          for a in sh cat cmp sha256sum wc printf mkdir cp rm mv ln chmod sed \
                   head tail tr ls sort comm grep cut awk timeout od dd env date; do
            ln -sf busybox "$BOX/bin/$a"
          done

          echo "  box laid out: $(du -sh "$BOX" | cut -f1)"

      - name: 'SEAL: enumerate every executable in the box and enforce the budget'
        run: |
          set -eu
          echo "  === TIER 1: ON THE BUILD PATH ==="
          for t in $BUDGET_PATH; do
            printf '    %-12s %10s  %s\n' "$t" "$(wc -c < "$BOX/bin/$t")" \
              "$(sha256sum "$BOX/bin/$t" | cut -c1-16)"
          done
          echo "  === TIER 2: DRIVER (touches no artifact byte) ==="
          for t in $BUDGET_DRIVER; do
            printf '    %-12s %10s  %s\n' "$t" "$(wc -c < "$BOX/bin/$t")" \
              "$(sha256sum "$BOX/bin/$t" | cut -c1-16)"
          done
          echo "  === shared objects carried in for the above ==="
          ls -1 "$BOX/lib" | sed 's/^/    /'

          # THE ENFORCEMENT. Every REAL file (not a busybox symlink) under
          # $BOX/bin must be named in one of the two budgets. If someone adds a
          # cp of gcc, or an apt package quietly lands a helper here, this fails
          # -- which is the entire value of writing the budget down.
          find "$BOX/bin" -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/actual
          printf '%s\n' $BUDGET_PATH $BUDGET_DRIVER | sort > /tmp/declared
          if ! cmp -s /tmp/actual /tmp/declared; then
            echo
            echo "FAIL: the box contains executables outside the declared budget."
            echo "  declared:"; sed 's/^/    /' /tmp/declared
            echo "  actual:";   sed 's/^/    /' /tmp/actual
            echo "  difference:"; comm -3 /tmp/declared /tmp/actual | sed 's/^/    /'
            exit 1
          fi
          echo
          echo "  SEALED. $(wc -l < /tmp/declared) host binaries, $(printf '%s' "$BUDGET_PATH" | wc -w) of them on the build path."

      - name: Write the in-box script
        run: |
          set -eu
          cat > "$BOX/work/run.sh" <<'EOS'
          #!/bin/sh
          # Runs with no network, no host PATH, and nothing in /bin but the
          # declared budget. Every path here is inside the box.
          set -eu
          cd /work

          say() { printf '\n  === %s ===\n' "$1"; }
          # EIGHT NAMES A LINE. busybox has no `fold` and the applet list is
          # the budget's inventory, so this is awk rather than one more entry
          # on it. A ninety-symbol census on one line is unreadable in a log.
          wrap() {
            tr '\n' ' ' < "$1" | awk '{ n=0; line="";
              for (i = 1; i <= NF; i++) {
                line = line $i " "; n = n + 1
                if (n == 8) { printf "        %s\n", line; line=""; n=0 }
              }
              if (n > 0) printf "        %s\n", line }'
          }
          art() { printf '    %-28s %10s  %s\n' "$1" \
                    "$(wc -c < "$2" 2>/dev/null || echo -)" \
                    "$(sha256sum "$2" 2>/dev/null | cut -c1-16 || echo -)"; }

          say '1. SEED -- the only host tools on the build path'
          # THE COMMITTED BINARIES, OR NOTHING. There was an `as`+`ld` fallback
          # here for when they were absent. It was already unreachable and could
          # never have worked: BUDGET_PATH is empty, so neither tool is inside
          # the box, and the branch could only ever die as `as: not found` -- an
          # obscure message for a condition that deserves a plain one. Worse, a
          # branch reading "otherwise build them here" advertises a capability
          # this box does not have and must never regain.
          #
          # A committed ELF is executed by the kernel's own loader with no host
          # tool involved. Its correspondence to the readable .s source is not
          # taken on trust -- stage0-selfhost reconstructs the whole ELF from its
          # own disassembly and compares it byte for byte, under both binutils
          # 2.47 and LLVM 22.1.8.
          for s in /src/stage0-as/stage0-as /src/elf/elf; do
            [ -x "$s" ] || { echo "    FAIL: $s missing or not executable."; \
              echo "    Seed binaries are committed artifacts and this box has"; \
              echo "    no way to make them: BUDGET_PATH is empty, so there is"; \
              echo "    no as and no ld in here. stage0-selfhost uploads both;"; \
              echo "    commit them and re-run."; exit 1; }
          done
          cp /src/stage0-as/stage0-as stage0-as
          cp /src/elf/elf elf
          echo "    seed binaries: COMMITTED -- no as, no ld"
          art 'stage0-as' stage0-as
          art 'elf'       elf

          # NATIVE EXECUTION STARTS HERE. Under qemu-aarch64 every rung was
          # invoked as `qemu-aarch64 ./stage1`, which merely OPENS the file --
          # the exec bit and the ELF headers were never really tested. Here the
          # kernel's binfmt loader validates both. spikes/elf/README.md says the
          # elf tool sets 0755 itself via openat+fchmod, so no chmod should be
          # needed; if that is wrong, it fails right here, which is exactly the
          # kind of thing this port exists to find.
          say '2. STAGE 1 -- written in stage 0 language'
          ./stage0-as < /src/stage1-as/stage1-as.s0 | ./elf stage1
          [ -x stage1 ] || { echo "    FAIL: stage1 is not executable -- elf did not set 0755"; exit 1; }
          art 'stage1' stage1

          say '3. STAGE 2 -- written in stage 1 language'
          ./stage1 < /src/stage2-pico-c/stage2-pico-c.s1 | ./stage0-as | ./elf stage2
          [ -x stage2 ] || { echo "    FAIL: stage2 is not executable"; exit 1; }
          art 'stage2' stage2

          say '4. SMOKE -- each rung actually runs on this hardware'
          printf 'int main(){return 42;}' > smoke.c
          ./stage2 < smoke.c > smoke.s1
          ./stage1 < smoke.s1 | ./stage0-as | ./elf smoke
          set +e; ./smoke; rc=$?; set -e
          echo "    smoke.c through the whole ladder -> rc=$rc (want 42)"
          [ "$rc" = 42 ] || { echo "    FAIL: the ladder does not run natively"; exit 1; }

          say '5. STAGE 2 CONFORMANCE -- the demo corpus, run natively'
          # Every one of these compiles through the full ladder and is judged on
          # its exit code, exactly as stage2-pico-c-demo does it -- but on real
          # hardware instead of under qemu-aarch64. If our codegen has an ARM64
          # assumption that qemu was forgiving about, this is where it surfaces,
          # and it surfaces on a 40-character program instead of on 215 KB of
          # M2-Planet where nobody can bisect it.
          #
          # THIS GATES M2-PLANET. A compiler that cannot get `return 2000*2000`
          # right has no business being pointed at cc_core.c, and a failure here
          # is readable in a way that a failure up there is not.
          n=0; pass=0; fail=0
          : > /out/stage2-failures.txt
          # THE SEPARATOR IS 0x1F, NOT A TAB. POSIX classifies tab as IFS white
          # space, so `read -r a b c` collapses a run of tabs into ONE delimiter
          # and an empty middle field vanishes, shifting every later field left.
          # argv is empty on 414 of the 426 rows, so a tab-separated corpus put
          # the program text into $args on almost every line. Verified: with
          # tabs, `0<TAB><TAB>prog` reads back as b=prog, c=empty.
          US=$(printf '\037')
          set +e
          while IFS="$US" read -r want args prog; do
            [ -n "${want:-}" ] || continue
            n=$((n + 1))
            printf '%s' "$prog" > t.c
            timeout 30 ./stage2 < t.c > t.s 2>/dev/null
            if [ $? != 0 ] || [ ! -s t.s ]; then
              fail=$((fail + 1))
              printf 'COMPILE\twant=%s\targv=[%s]\t%s\n' "$want" "$args" "$prog" >> /out/stage2-failures.txt
              continue
            fi
            ./stage1 < t.s 2>/dev/null | ./stage0-as 2>/dev/null | ./elf t.elf 2>/dev/null
            if [ ! -x t.elf ]; then
              fail=$((fail + 1))
              printf 'LINK\twant=%s\targv=[%s]\t%s\n' "$want" "$args" "$prog" >> /out/stage2-failures.txt
              continue
            fi
            # $args IS DELIBERATELY UNQUOTED. atry runs its binary as
            # `./a.out $3`, so `-o out` must word-split into TWO arguments;
            # quoting it would pass one argument containing a space and every
            # argc test would be off by one. Empty args expands to nothing.
            timeout 30 ./t.elf $args < /dev/null > /dev/null 2>&1
            rc=$?
            if [ "$rc" = "$want" ]; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              printf 'RUN got=%s\twant=%s\targv=[%s]\t%s\n' "$rc" "$want" "$args" "$prog" >> /out/stage2-failures.txt
            fi
            rm -f t.elf
          done < /in/stage2-tests.corpus
          set -e
          echo "    $pass/$n passed, $fail failed"
          # A SUITE THAT RAN NOTHING IS NOT A SUITE THAT PASSED. This reported
          # "0/0 passed, 0 failed" and exited clean when the corpus failed to
          # reach the box -- the single most dangerous shape a test result can
          # have, because it looks exactly like success.
          if [ "$n" -lt 415 ]; then
            echo "    FAIL: only $n tests ran; expected at least 415."
            exit 1
          fi
          if [ "$fail" != 0 ]; then
            echo "    first failures (full list in the artifact):"
            head -20 /out/stage2-failures.txt | sed 's/^/      /'
            exit 1
          fi

          say '6. STAGE 2 FIXPOINT -- the compiler-shaped canary'
          # NOTE WHAT THIS IS AND IS NOT. Stage 2 has no C source -- it is
          # written in stage 1's language, as stage2-pico-c.s1 -- so there is no
          # stage-2 self-compilation and no stage-2 fixpoint in the M2-Planet
          # sense. What exists is spikes/stage2-pico-c/selfhost/canon.c: a
          # compiler-shaped program (file I/O, heap structs, function pointers,
          # deep recursion) whose transform is IDEMPOTENT, so
          # canon(canon(x)) == canon(x) is a genuine fixpoint over a real
          # compiler-shaped workload. Its own README calls it a proof-of-pivot,
          # not a permanent rung. Treat it as the canary it is.
          #
          # canon returns the output LENGTH as its exit status, so a good run
          # exits NONZERO. Every invocation is judged on its output file.
          C=/src/stage2-pico-c/selfhost/canon.c
          ./stage2 < "$C" > canon.s
          ./stage1 < canon.s | ./stage0-as | ./elf canon
          [ -x canon ] || { echo "    FAIL: canon did not build"; exit 1; }
          art 'canon (ours)' canon

          # structural -- guards against the canary degrading into something trivial
          fp_ok=yes
          for pat in 'bl calloc' 'blr' 'bl open' 'bl read' 'bl write' ':emit_list'; do
            grep -q "$pat" canon.s || { echo "    MISSING $pat in emitted canon"; fp_ok=no; }
          done
          echo "    emitted program uses calloc + blr + file I/O + recursion: $fp_ok"

          run_canon() { rm -f in out; cp "$1" in; set +e; timeout 60 ./canon >/dev/null 2>&1; set -e; }

          printf '  int  main( ) {\n\t int   x =\t42 ;\n   return   x+x ;\n}\n' > sh_sample
          printf 'int\nmain(\n)\n{\nint\nx\n=\n42\n;\nreturn\nx+x\n;\n}\n' > sh_want
          run_canon sh_sample
          if cmp -s out sh_want; then st=OK; else st=DIFF; fp_ok=no; fi
          echo "    tokenizes messy input to one token per line: $st"

          cp out g1; run_canon g1; cp out g2
          if cmp -s g1 g2; then st=OK; else st=DIFF; fp_ok=no; fi
          echo "    FIXPOINT canon(canon(x)) == canon(x): $st  ($(wc -c < g1) bytes)"

          run_canon "$C"; cp out s1; run_canon s1; cp out s2
          if cmp -s s1 s2 && [ -s s1 ]; then st=OK; else st=DIFF; fp_ok=no; fi
          echo "    FIXPOINT on canon's OWN source: $st  ($(wc -c < s1) bytes)"

          ntok=$(wc -w < "$C"); nline=$(wc -l < s1)
          if [ "$ntok" = "$nline" ]; then st=OK; else st=DIFF; fp_ok=no; fi
          echo "    own-source token count matches a whitespace split: $st ($nline vs $ntok)"

          [ "$fp_ok" = yes ] || { echo "    FAIL: the stage-2 canary is not clean"; exit 1; }

          say '7. G0 -- stage 2 builds UPSTREAM M2-Planet, for GATE 1 only'
          # THIS IS NOT micro-c, AND CALLING IT THAT WAS WORSE THAN THE NAME
          # IT REPLACED. Steps 7 and 8 build UPSTREAM M2-Planet, deliberately
          # unpatched, and they exist for one purpose: GATE 1 compares this
          # compiler's self-compile byte for byte against upstream's own
          # reference build. That comparison measures the LADDER -- seed,
          # stage 1, stage 2 -- not our compiler. Put our patches in here and
          # the gate stops meaning anything at all.
          #
          # One substitution only: M2libc/aarch64/linux/bootstrap.c, whose
          # entire content is six asm() bodies stage 2 cannot compile.
          #
          # micro-c -- upstream plus this project's 43 patches -- is built in
          # step 10, and it is the one that compiles tcc.
          # The substitution applies to G0 and only G0. patched_bootstrap.c goes
          # first so its enums (NULL EOF TRUE FALSE stdin/stdout/stderr EXIT_*)
          # are in scope for the shim, and the shim supplies fgetc/fputc -- the
          # only two dropped functions our m53/m69 builtins do not already cover.
          # Say out loud what happens to every file in the list. A substitution
          # that is not printed is a substitution someone will later mistake for
          # a clean build.
          {
            cat /in/patched_bootstrap.c
            cat /src/stage2-pico-c/m2libc-shim.c
            while read -r f; do
              case "$f" in
                M2libc/aarch64/linux/bootstrap.c)
                  echo "    REPLACE $f -> patched_bootstrap.c + m2libc-shim.c" >&2 ;;
                M2libc/bootstrap.c)
                  # m71's omission. Only reachable if this pin still ships it.
                  echo "    OMIT    $f  (m71 rule; G1 still gets it unpatched)" >&2 ;;
                *)
                  echo "    as-is   $f" >&2
                  cat "/in/m2/$f" ;;
              esac
            done < /in/flist.txt
          } > m2.c
          art 'm2.c (our translation unit)' m2.c
          ./stage2 < m2.c > m2.s1
          echo "    stage2 emitted $(wc -c < m2.s1) bytes of stage-1 assembly"
          ./stage1 < m2.s1 | ./stage0-as | ./elf upstream-g0
          [ -x upstream-g0 ] || { echo "    FAIL: no G0"; exit 1; }
          art 'G0 = upstream M2-Planet (our ladder)' upstream-g0

          say '8. G1 -- G0 compiles upstream source again, for the gate'
          # From here the patch is gone: our M2-Planet handles asm() perfectly
          # well, so G1 onward is built from upstream source exactly as shipped.
          set --
          while read -r f; do set -- "$@" -f "$f"; done < /in/flist.txt
          cd /in/m2
          /work/upstream-g0 --architecture aarch64 --bootstrap-mode "$@" -o /out/ours-gen1.M1
          cd /work
          art 'ours-gen1.M1' /out/ours-gen1.M1

          say '9. GATE 2 (non-blocking) -- link it with a toolchain we built'
          # Needs M1 + hex2 + blood-elf as RUNNING BINARIES. The only way to get
          # them without a host compiler is to build them with stage 2, and that
          # is blocked today: our M1 hangs in M2libc memset and our hex2 crashes
          # on exit (m1-loop.yml, spikes/UPSTREAM-PINS.md). Reported, not gated.
          # When stage 2 is fixed this turns green with no edit to this file.
          # Sources come from /in/M1-srcs.txt and /in/hex2-srcs.txt, derived in
          # the airlock from upstream's makefile. Do not inline a list here.
          build2() {  # build2 <name>
            o="$1"
            { cat /in/patched_bootstrap.c
              cat /src/stage2-pico-c/m2libc-shim.c
              cat /in/m2/M2libc/bootstrappable.c
              # FROM THE REWRITTEN TREE, NOT THE PINNED ONE.
              #
              # defines_to_enums.py writes pins/mescc-s2/ in the airlock; this
              # read pins/mescc/ and so consumed the untouched sources. The
              # rewrite ran, reported fourteen constants, and changed nothing --
              # stage 1's unresolved list came back byte-identical, which is the
              # most confusing possible way for a transformation to fail. A
              # producer with no consumer is not a no-op, it is a lie in the log.
              while read -r f; do cat "/in/mescc-s2/$f"; done < "/in/$o-srcs.txt"
            } > "$o.c" || { echo "    $o: could not assemble sources"; return 1; }
            ./stage2 < "$o.c" > "$o.s1" || { echo "    $o: stage2 rc=$?"; return 1; }
            # THE PIPELINE USED TO SWALLOW stage 1's VERDICT.
            #
            # `./stage1 | ./stage0-as | ./elf $o` takes its exit status from
            # elf, which happily emits a 120-byte ELF from an empty stream. So
            # stage 1 refusing on unresolved labels and stage 1 succeeding both
            # ended with `[ -x "$o" ]` true, and the log reported
            # `hex2 (ours) 120` as though it had built. Split the stages so each
            # is checked, and floor the size, because a linker is not 120 bytes.
            ./stage1 < "$o.s1" > "$o.s0" \
              || { echo "    $o: stage 1 refused -- unresolved labels"; return 1; }
            ./stage0-as < "$o.s0" | ./elf "$o" || return 1
            [ -x "$o" ] || return 1
            sz=$(wc -c < "$o")
            [ "$sz" -gt 4096 ] || { echo "    $o: $sz bytes -- a stub, not a build"; return 1; }
            art "  $o (ours)" "$o"
          }
          set +e
          build2 M1;   m1rc=$?
          build2 hex2; hxrc=$?
          # A COMPILE FAILURE IS NOW A FAILURE. The LINK stays advisory -- that
          # is what GATE 2 is for -- but "stage 2 could not compile M1 or hex2"
          # is a regression in stage 2 or in the derived source list, and it
          # used to print the same `SKIP the link` line as the blocker it was
          # tracking. Two very different conditions, one message, and the run
          # that shipped a short header list looked exactly like the six before
          # it.
          if [ "$m1rc" != 0 ] || [ "$hxrc" != 0 ]; then
            # SAY WHICH RUNG REFUSED. The first version of this message blamed
            # stage 2 for everything, and the run it fired on had stage 2
            # compiling hex2 perfectly well -- it was stage 1 rejecting
            # unresolved labels. build2 prints the real reason above; this line
            # must not overwrite it with a guess.
            echo "    FAIL: could not BUILD the tools (M1 rc=$m1rc hex2 rc=$hxrc)."
            echo "    The line above says which rung refused and why. A stage-2"
            echo "    rc is a compiler problem; 'stage 1 refused' is a missing"
            echo "    definition, so check the derived source lists first."
            exit 1
          fi
          if [ "$m1rc" = 0 ] && [ "$hxrc" = 0 ]; then
            echo "    both built -- trying the link (60s budget each)"
            timeout 60 ./M1 -f /in/m2/M2libc/aarch64/aarch64_defs.M1 \
                            -f /in/m2/M2libc/aarch64/libc-core.M1 \
                            -f /out/ours-gen1.M1 --little-endian \
                            --architecture aarch64 -o gen1.hex2
            echo "    our M1   rc=$? (124 = HUNG, the known memset defect)"
            timeout 60 ./hex2 -f /in/m2/M2libc/aarch64/ELF-aarch64.hex2 -f gen1.hex2 \
                            --little-endian --architecture aarch64 \
                            --base-address 0x400000 -o /out/gen1
            echo "    our hex2 rc=$?"
            [ -s /out/gen1 ] && art 'gen1 (linked, ours)' /out/gen1
          else
            echo "    SKIP the link: M1 rc=$m1rc hex2 rc=$hxrc"
            echo "    This is the measured blocker, not a surprise. See the header."
          fi
          set -e

          say '10. STAGE 3 -- micro-c compiles tcc, our M1 and hex2 link it'
          # EVERYTHING THIS STEP USES WAS BUILT IN THIS BOX. stage 2 from the
          # seed, micro-c from stage 2, M1 and hex2 from stage 2, and the link
          # by those. The only inputs are pinned source and busybox.
          #
          # NON-GATING on its first outing, like GATE 2 was: it reports where it
          # stops. What it must never do is report success it did not have, so
          # every artifact is size-checked, not just tested for existence -- the
          # 120-byte hex2 taught that lesson already.
          s3ok=yes
          # THE SAME REPLACE/OMIT RULES G0 USES, because this is the same
          # translation unit with a different source tree behind it.
          #
          # The first cut just catted every name in the list, and also
          # bootstrappable.c on top. That pulled in
          # M2libc/aarch64/linux/bootstrap.c with its six raw asm() bodies --
          # the very file patched_bootstrap.c REPLACES -- and M2libc/bootstrap.c
          # which the m71 rule omits. 399,620 bytes against G0's 215,485, and
          # stage 2 had no chance.
          {
            cat /in/patched_bootstrap.c
            cat /src/stage2-pico-c/m2libc-shim.c
            while read -r f; do
              case "$f" in
                M2libc/aarch64/linux/bootstrap.c) ;;
                M2libc/bootstrap.c) ;;
                *) cat "/in/microc/$f" ;;
              esac
            done < /in/microc-srcs.txt
          } > microc.c
          art 'microc.c (patched unit)' microc.c
          # AND EVERY RUNG REPORTS ITS OWN VERDICT. The first cut chained all
          # four with && and sent stderr to /dev/null, so "micro-c did not
          # build" was the entire diagnosis -- which is the fault I had just
          # finished fixing in build2, written again three steps later.
          set +e
          ./stage2 < microc.c > microc.s1 2>microc.e2; r2=$?
          ./stage1 < microc.s1 > microc.s0 2>microc.e1; r1=$?
          ./stage0-as < microc.s0 > microc.bin 2>microc.e0; r0=$?
          ./elf micro-c < microc.bin 2>microc.ee; re=$?
          set -e
          echo "    stage2 rc=$r2  stage1 rc=$r1  stage0-as rc=$r0  elf rc=$re"
          [ "$r2" = 0 ] || head -3 microc.e2 | sed 's/^/      stage2: /'
          [ "$r1" = 0 ] || head -3 microc.e1 | sed 's/^/      stage1: /'
          [ "$r0" = 0 ] || head -3 microc.e0 | sed 's/^/      stage0-as: /'
          if [ -x micro-c ] && [ "$(wc -c < micro-c)" -gt 65536 ]; then
            art 'micro-c (ours)' micro-c
          else
            echo "    micro-c did not build ($(wc -c < micro-c 2>/dev/null || echo 0) bytes)"
            s3ok=no
          fi

          if [ "$s3ok" = yes ]; then
            MCFLAGS='--architecture aarch64 --max-string 65536'
            L=/src/stage3/micro-c-libc
            # ours, patched -- see the airlock note above
            M=/in/m2libc-veron
            set +e
            ( cd /in/tcc-src && /work/micro-c $MCFLAGS --expand-includes \
                -D ONE_SOURCE=1 -D TCC_TARGET_LINUX=1 \
                -D CONFIG_TCC_STATIC=1 -I . -I "$L" -I "$M" \
                -f tcc.c -o /work/libtcc.M1 ) 2>/work/libtcc.err
            rc=$?
            set -e
            if [ "$rc" = 0 ] && [ -s libtcc.M1 ]; then
              echo "    libtcc.M1: $(wc -l < libtcc.M1) lines, $(grep -c '^:FUNCTION_' libtcc.M1) functions"
            else
              echo "    micro-c could not compile libtcc.c (rc=$rc)"
              head -3 /work/libtcc.err | sed 's/^/      /'
              s3ok=no
            fi
          fi

          if [ "$s3ok" = yes ]; then
            H="-f $M/stdarg.h -f $M/sys/types.h -f $M/stddef.h -f $M/signal.h -f $M/sys/utsname.h"
            set +e
            ./micro-c $MCFLAGS -f "$M/ctype.c" $H \
              -f "$M/aarch64/linux/unistd.c" -f "$M/aarch64/linux/fcntl.c" \
              -f "$M/fcntl.c" -f "$M/stdlib.c" -f "$M/string.c" \
              -f "$M/stdio.h" -f "$M/stdio.c" -f "$M/bootstrappable.c" -o m2libc.M1 2>/dev/null
            r1=$?
            ./micro-c $MCFLAGS -I "$L" -f "$L/impl/runtime.c"       -o runtime.M1 2>/dev/null; r2=$?
            ./micro-c $MCFLAGS -f "$L/impl/setjmp-aarch64.c"        -o setjmp.M1  2>/dev/null; r3=$?
            set -e
            if [ "$r1$r2$r3" = 000 ]; then
              echo "    runtime: m2libc $(grep -c '^:FUNCTION_' m2libc.M1), runtime $(grep -c '^:FUNCTION_' runtime.M1)"
            else
              echo "    runtime did not compile (rc: $r1 $r2 $r3)"
              s3ok=no
            fi
          fi

          if [ "$s3ok" = yes ]; then
            # CODE BEFORE STRINGS. Concatenating units naively interleaves their
            # string sections, so a function can land on an address that is not a
            # multiple of four and every call to it is SIGBUS on aarch64. This is
            # not an optimisation; without it nothing runs.
            : > tcc.code; : > tcc.glob; : > tcc.strs
            # THREE SECTIONS, NOT TWO. micro-c emits "# Core program", then
            # "# Program global variables", then "# Program strings". Splitting
            # only at the strings marker leaves each unit's GLOBALS glued to its
            # code, and a global holding a string is arbitrary-length data
            # between one unit's code and the next unit's functions. That was
            # harmless while libtcc.M1's globals happened to total a multiple of
            # four; tcc.c adds
            #     :GLOBAL_STORAGE_version "tcc version 0.9.28rc (AArch64 Linux)"
            # and every function after it lands misaligned. SIGBUS before main.
            for f in libtcc.M1 m2libc.M1 runtime.M1 setjmp.M1; do
              sed '/^# Program global variables$/,$d' "$f" >> tcc.code
              sed -n '/^# Program global variables$/,/^# Program strings$/p' "$f" \
                | sed '/^# Program strings$/d' >> tcc.glob
              sed -n '/^# Program strings$/,$p' "$f" >> tcc.strs
            done
            cat tcc.code tcc.glob tcc.strs > tcc-all.M1
            A=/in/m2libc-veron/aarch64
            # SAY WHAT IS BEING FED IN, BEFORE GUESSING WHY IT FAILED.
            #
            # `tcc-all.M1:20 :Received invalid other; ret` means M1 reached
            # print_hex with a token that has no Expression -- ret's DEFINE
            # never registered -- while mov_x0,x17 on the lines above did. Two
            # rounds went on hypotheses about that. The same M1 binary links
            # gen1 in GATE 2 above, and gen1's .M1 is LARGER, so it is not size
            # and not the binary. Print the inputs and stop theorising.
            echo "    inputs to M1:"
            for i in "$A/aarch64_defs.M1" "$A/libc-full.M1" tcc-all.M1; do
              printf '      %-44s %8s lines  %10s bytes\n' "$i" \
                "$(wc -l < "$i" 2>/dev/null || echo -)" \
                "$(wc -c < "$i" 2>/dev/null || echo -)"
            done
            echo "      DEFINE ret present: $(grep -c '^DEFINE ret ' "$A/aarch64_defs.M1" 2>/dev/null || echo 0)"
            echo "      per-part line counts, in join order:"
            for f in libtcc.M1 m2libc.M1 runtime.M1 setjmp.M1; do
              printf '        %-14s %8s lines  strings-marker: %s\n' "$f" \
                "$(wc -l < "$f")" "$(grep -c '^# Program strings$' "$f")"
            done
            echo "      tcc-all.M1 first 4 lines:"
            head -4 tcc-all.M1 | sed 's/^/        | /'
            echo "      tcc-all.M1 line 20: $(sed -n '20p' tcc-all.M1)"
            set +e
            timeout 300 ./M1 -f "$A/aarch64_defs.M1" -f "$A/libc-full.M1" \
                             -f tcc-all.M1 --little-endian --architecture aarch64 \
                             -o tcc-all.hex2
            m1rc=$?
            timeout 300 ./hex2 --architecture aarch64 --little-endian \
                             --base-address 0x400000 -f "$A/ELF-aarch64.hex2" \
                             -f tcc-all.hex2 -o /out/mc-tcc
            hxrc=$?
            set -e
            echo "    our M1 rc=$m1rc   our hex2 rc=$hxrc"
            if [ -s /out/mc-tcc ] && [ "$(wc -c < /out/mc-tcc)" -gt 262144 ]; then
              art 'mc-tcc (ours, end to end)' /out/mc-tcc
              chmod 0755 /out/mc-tcc
              printf 'int main(void) { return 7; }\n' > seven.c
              set +e
              # -B AND -I TAKE THEIR ARGUMENT ATTACHED. Separated, tcc reads
              # the next argv as the path's absence:
              #     tcc: error: argument to '-B' is missing
              # local-tcc.sh writes them attached, and I did not.
              timeout 25 /out/mc-tcc -B/in/tcc-src -I/in/tcc-src \
                          -c seven.c -o seven.o 2>/work/run7.err
              crc=$?
              set -e
              echo "    mc-tcc -c seven.c: rc=$crc, object $(wc -c < seven.o 2>/dev/null || echo 0) bytes"
              if [ "$crc" != 0 ] || [ ! -s seven.o ]; then
                grep -av '^[A-Z][0-9]*$' /work/run7.err | head -30 | sed 's/^/      /'
                s3ok=no
              fi

              # 00: DOES IT START AT ALL? Ask before anything else.
              #
              # When mc-tcc could not initialise -- a four-byte load of an
              # eight-byte pointer in dynarray_reset's `--*n` -- every one of
              # the twelve programs below reported the same rc=139, and the log
              # said nothing about which of thirteen things was wrong. One line
              # here separates "the compiler is broken" from "the compiler
              # compiles the wrong code", and those are different
              # investigations.
              set +e
              timeout 60 /out/mc-tcc --version >v.out 2>&1; vrc=$?
              set -e
              echo "    00-does-it-start            rc=$vrc  $(grep -av '^[A-Z][0-9]*$' v.out | head -1)"
              if [ "$vrc" -gt 128 ]; then
                echo "      IT DOES NOT START. Everything below will fail for this"
                echo "      reason and not for its own; read this line, not those."
                s3ok=no
              fi

              # THAT mc-tcc EXISTS IS NOT THE QUESTION. tcc-two-ways has
              # built one for a long time; what is new here is that this one is
              # hermetic. What matters is whether the tcc it produces WORKS,
              # and compiling to an object does not ask that: the last real
              # fault was a valid aarch64 ELF that ran, exited 0 and printed
              # nothing, because a GOT entry was never allocated.
              #
              # So: twelve programs, each COMPILED AND RUN, asking a little
              # more each time -- a constant, arithmetic, loops, recursion,
              # pointers, structs, globals in .bss, a string literal,
              # char/switch/goto, an indirect call, and finally the two shapes
              # that micro-c's own difftest cases 14 and 61 cover: a function
              # pointer held in a struct member, and prefix ++/-- applied
              # through a dot. Those two are here because they are the ones
              # currently breaking when micro-c's int becomes four bytes, and
              # seeing them run against the tcc we built says whether the tcc
              # has the same hole. Every one is
              # freestanding: its own _start, exit by syscall, no libc and no
              # crt, so the only code in the binary is the code under test.
              #
              # Most report through the EXIT CODE, which is the least a shell
              # can misread. Number 08 writes to stdout instead, because a
              # string literal is an address in .data and that is exactly the
              # class that failed silently before.
              # THE SUITE. Ten programs, each compiled and RUN, one at a time.
              #
              # Written with printf because a heredoc terminator cannot be indented
              # and every line here must be. No harness, no python -- busybox alone
              # feeds each one to the compiler we built and reads back what it did.
              prologue() {
                printf '%s\n' 'static long sys3(long n, long a, long b, long c)' >> "$1"
                printf '%s\n' '{' >> "$1"
                printf '%s\n' '    register long x8 __asm__("x8") = n;' >> "$1"
                printf '%s\n' '    register long x0 __asm__("x0") = a;' >> "$1"
                printf '%s\n' '    register long x1 __asm__("x1") = b;' >> "$1"
                printf '%s\n' '    register long x2 __asm__("x2") = c;' >> "$1"
                printf '%s\n' '    __asm__ __volatile__("svc #0" : "+r"(x0) : "r"(x8), "r"(x1), "r"(x2) : "memory");' >> "$1"
                printf '%s\n' '    return x0;' >> "$1"
                printf '%s\n' '}' >> "$1"
                printf '%s\n' 'int run(void);' >> "$1"
                printf '%s\n' 'void _start(void) { sys3(93, run(), 0, 0); }' >> "$1"
              }
              tc() {  # tc <label> <want_exit> <want_output>
                set +e
                timeout 25 /out/mc-tcc -B/in/tcc-src -I/in/tcc-src \
                            -nostdlib -static -o t.bin t.c 2>t.err
                crc=$?
                set -e
                if [ "$crc" != 0 ] || [ ! -s t.bin ]; then
                  printf "    %-26s COMPILE FAILED rc=%s\n" "$1" "$crc"
                  grep -av '^[A-Z][0-9]*$' t.err | head -2 | sed 's/^/        /'
                  s3ok=no; return
                fi
                chmod 0755 t.bin
                set +e; tout=$(timeout 20 ./t.bin 2>&1); trc=$?; set -e
                if [ "$trc" = "$2" ] && [ "$tout" = "$3" ]; then v=ok; else v="WRONG (want exit=$2 out=[$3])"; s3ok=no; fi
                printf "    %-26s exit=%-4s out=[%s] %s\n" "$1" "$trc" "$tout" "$v"
              }
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void) { return 42; }' >> t.c
              tc 01-return-a-value 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void) { int a; a = 7; return a * 6 + 12 / 4 - 3 % 2; }' >> t.c
              tc 02-arithmetic 44 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    int i; int s;' >> t.c
              printf '%s\n' '    s = 0; i = 1;' >> t.c
              printf '%s\n' '    while (i <= 10) { s = s + i; i = i + 1; }' >> t.c
              printf '%s\n' '    if (s == 55) return s;' >> t.c
              printf '%s\n' '    return 1;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 03-loops-and-if 55 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int fact(int n) { if (n < 2) return 1; return n * fact(n - 1); }' >> t.c
              printf '%s\n' 'int run(void) { return fact(5); }' >> t.c
              tc 04-recursion 120 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    int a[4]; int *p; int s;' >> t.c
              printf '%s\n' '    a[0] = 1; a[1] = 2; a[2] = 3; a[3] = 4;' >> t.c
              printf '%s\n' '    p = a; s = 0;' >> t.c
              printf '%s\n' '    while (p < a + 4) { s = s + *p; p = p + 1; }' >> t.c
              printf '%s\n' '    return s;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 05-pointers-and-arrays 10 ""
              : > t.c; prologue t.c
              printf '%s\n' 'struct P { int x; int y; };' >> t.c
              printf '%s\n' 'int total(struct P *p) { return p->x + p->y; }' >> t.c
              printf '%s\n' 'int run(void) { struct P p; p.x = 20; p.y = 22; return total(&p); }' >> t.c
              tc 06-structs-by-pointer 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int g[3];' >> t.c
              printf '%s\n' 'int zero;' >> t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    g[0] = 10; g[1] = 20; g[2] = 12;' >> t.c
              printf '%s\n' '    return g[0] + g[1] + g[2] + zero;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 07-globals-and-bss 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void) { sys3(64, 1, (long)"strings work", 12); return 0; }' >> t.c
              tc 08-string-literal-write 0 "strings work"
              : > t.c; prologue t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    char c; int r;' >> t.c
              printf '%s\n' '    c = 65; r = 0;' >> t.c
              printf '%s\n' '    switch (c) { case 65: r = 40; break; default: r = 1; }' >> t.c
              printf '%s\n' '    if (r == 40) goto done;' >> t.c
              printf '%s\n' '    return 2;' >> t.c
              printf '%s\n' 'done:' >> t.c
              printf '%s\n' '    return r + 2;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 09-char-switch-and-goto 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int add(int a, int b) { return a + b; }' >> t.c
              printf '%s\n' 'int mul(int a, int b) { return a * b; }' >> t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    int (*f)(int, int);' >> t.c
              printf '%s\n' '    f = add;' >> t.c
              printf '%s\n' '    if (f(20, 21) != 41) return 1;' >> t.c
              printf '%s\n' '    f = mul;' >> t.c
              printf '%s\n' '    return f(6, 7);' >> t.c
              printf '%s\n' '}' >> t.c
              tc 10-function-pointers 42 ""
              : > t.c; prologue t.c
              printf '%s\n' 'int do_add(int a, int b) { return a + b; }' >> t.c
              printf '%s\n' 'int do_mul(int a, int b) { return a * b; }' >> t.c
              printf '%s\n' 'struct Ops { int (*add)(int, int); int (*mul)(int, int); int tag; };' >> t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    struct Ops o; struct Ops *p;' >> t.c
              printf '%s\n' '    o.add = do_add; o.mul = do_mul; o.tag = 3;' >> t.c
              printf '%s\n' '    if (o.add(2, 3) != 5) return 1;' >> t.c
              printf '%s\n' '    if (o.mul(4, 5) != 20) return 2;' >> t.c
              printf '%s\n' '    if (o.tag != 3) return 3;' >> t.c
              printf '%s\n' '    p = &o;' >> t.c
              printf '%s\n' '    if (p->add(10, 1) != 11) return 4;' >> t.c
              printf '%s\n' '    if (p->mul(6, 7) != 42) return 5;' >> t.c
              printf '%s\n' '    return 0;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 11-function-pointer-member 0 ""
              : > t.c; prologue t.c
              printf '%s\n' 'struct S { char *str; int len; int c; };' >> t.c
              printf '%s\n' 'struct S gs;' >> t.c
              printf '%s\n' 'int run(void)' >> t.c
              printf '%s\n' '{' >> t.c
              printf '%s\n' '    struct S s; char buf[4]; int r;' >> t.c
              printf '%s\n' '    r = 0;' >> t.c
              printf '%s\n' '    s.len = 3; --s.len; if (s.len != 2) r = r + 1;' >> t.c
              printf '%s\n' '    s.c = 5;   ++s.c;   if (s.c != 6)   r = r + 2;' >> t.c
              printf '%s\n' '    buf[0] = 97; buf[1] = 98; buf[2] = 99;' >> t.c
              printf '%s\n' '    s.str = buf; s.len = 3;' >> t.c
              printf '%s\n' '    if (s.str[--s.len] != 99) r = r + 4;' >> t.c
              printf '%s\n' '    if (s.len != 2) r = r + 8;' >> t.c
              printf '%s\n' '    gs.len = 3; --gs.len; if (gs.len != 2) r = r + 16;' >> t.c
              printf '%s\n' '    return r;' >> t.c
              printf '%s\n' '}' >> t.c
              tc 12-prefix-operator-through-a-dot 0 ""
            else
              echo "    no mc-tcc produced ($(wc -c < /out/mc-tcc 2>/dev/null || echo 0) bytes)"
              s3ok=no
            fi
          fi
          echo "    stage 3 end to end: $s3ok"

          say '10b. libtcc1 for arm64 -- OUR tcc builds its own runtime'
          # THE COMPILER-SUPPORT LIBRARY, BUILT BY THE COMPILER IT SUPPORTS.
          #
          # Step 13's census splits gen2's undefined symbols into two buckets
          # with different owners, and this is the one that needs no new rung:
          #
          #     __addtf3 __divtf3 __eqtf2 __extenddftf2 __extendsftf2
          #     __fixtfdi __fixunstfdi __floatunditf __floatunsitf __getf2
          #     __gttf2 __letf2 __lttf2 __multf3 __netf2 __subtf3
          #     __trunctfdf2 __trunctfsf2
          #
          # -- eighteen soft-float quad helpers that live in tcc's own lib/,
          # plus the __atomic_ and __builtin_ helpers beside them. The Makefile
          # names the set for this target:
          #
          #     ARM64_O  = lib-arm64.o $(COMMON_O)
          #     COMMON_O = stdatomic.o atomic.o builtin.o alloca.o alloca-bt.o
          #                                                    lib/Makefile:41,43
          #
          # ALL BUT ONE OF THEM. alloca-bt.S is the BOUNDS-CHECKING alloca and
          # references __bound_new_region, which lives in bcheck.o and is only
          # built for -b. Linking it in makes every program fail with an
          # undefined symbol that has nothing to do with the program -- which
          # is exactly what it did on the first attempt here. The plain
          # alloca.S is the one this configuration wants.
          #
          # THE .S FILES GO THROUGH THE SAME COMPILER. tcc preprocesses and
          # assembles them itself, using the arm64 assembler the patch series
          # supplies, so atomic.S and alloca.S are built by mc-tcc like the
          # rest. Nothing here is borrowed.
          LIBTCC1=""
          if [ -s /out/mc-tcc ]; then
            l1ok=yes
            for f in lib/lib-arm64.c lib/stdatomic.c lib/builtin.c \
                     lib/atomic.S lib/alloca.S; do
              o=/work/l1-$(basename "$f" | tr './' '__').o
              set +e
              timeout 120 /out/mc-tcc -B/in/tcc-src -I/in/tcc-src \
                          -I/in/tcc-src/include -c -o "$o" "/in/tcc-src/$f" \
                          2>/work/l1.err
              lrc=$?
              set -e
              if [ "$lrc" = 0 ] && [ -s "$o" ]; then
                printf '    %-20s %8s bytes\n' "$(basename "$f")" "$(wc -c < "$o")"
                LIBTCC1="$LIBTCC1 $o"
              else
                printf '    %-20s DID NOT BUILD rc=%s\n' "$(basename "$f")" "$lrc"
                grep -av '^[A-Z][0-9]*$' /work/l1.err | head -2 | sed 's/^/        /'
                l1ok=no
              fi
            done
            # NON-GATING, like the rungs around it. If a piece is missing the
            # suite below simply links without it and the tests that needed it
            # report the symbol by name, which is more useful than stopping.
            if [ "$l1ok" = yes ]; then
              echo "    libtcc1: 5 of 5 objects, all built by mc-tcc"
            else
              echo "    libtcc1: incomplete -- the suite links without it"
            fi
          else
            echo "    skipped: no mc-tcc was produced"
          fi

          say "11. tcc's OWN TEST SUITE -- every tests2 program, compiled and run"
          # tcc ships 129 programs in tests/tests2, each with a .expect file
          # holding the exact output it must produce. They want <stdio.h>, a
          # printf and something to call main() -- none of which this box has,
          # so spikes/stage3/tcc-test-shim supplies them in C that mc-tcc
          # compiles itself. No make, no configure, no harness: two source
          # files in, one binary out, output compared against tcc's own file.
          #
          # .expect IS THE WHOLE CRITERION, AND THAT IS DELIBERATE. tcc-two-ways
          # builds a gcc control from the same source and uses it to decide
          # which tests are even applicable -- a test the control cannot pass is
          # measuring a gap in the shim (no malloc, no file I/O, no floats)
          # rather than a defect in the compiler we built. THERE IS NO CONTROL
          # IN HERE, because a control needs gcc and gcc is not in the budget.
          # So this step does not attribute its failures: it reports how many of
          # tcc's own programs a seed-built tcc reproduces byte for byte, which
          # is a number that needs no control to be true. Read the attribution
          # off tcc-two-ways; read the count off here.
          #
          # 00_assignment IS STILL THE GATE. It is the simplest program in the
          # suite and the one stage 3 has always been measured on, so it alone
          # moves s3ok. Everything else here is measured and reported and never
          # fails the run -- see the note on step 13 for why that is the right
          # way round while the frontier is still moving.
          SH=/src/stage3/tcc-test-shim
          T2=/in/tcc-src/tests/tests2

          # COMPARE THE WAY tcc COMPARES, which is not byte for byte and is
          # not the program's stdout alone.
          #
          #     T3 = $(FILTER) >$*.output 2>&1 ... diff -Nbu %.expect $*.output
          #     FILTER = 2>&1 | sed -e 's,$(SRC)/,,g'      tests2/Makefile:126,142
          #
          # TWO THINGS FOLLOW FROM THAT AND NEITHER WAS BEING DONE.
          #
          # 1. THE COMPILER'S OWN DIAGNOSTICS ARE PART OF THE EXPECTED OUTPUT.
          # tcc runs one command -- `tcc -run prog.c` -- and captures compile
          # warnings and program output into the same file, in that order.
          # Three .expect files begin with a warning line:
          #     03_struct.expect     03_struct.c:14: warning: attribute ...
          #     102_alignas.expect   102_alignas.c:4: warning: type defaults to int
          #     33_ternary_op.expect 33_ternary_op.c:26: warning: pointer/integer ...
          # This step compiled to t2.err and ran to t2.out and compared only
          # t2.out, so all three were reported as "RAN, output differs" -- which
          # reads as wrong codegen and is a missing warning line. mc-tcc emits
          # the warnings; nothing was looking at them.
          #
          # 2. THE SOURCE DIRECTORY IS STRIPPED. tcc's tests run out of tree and
          # its FILTER removes $(SRC)/ from every path, so the .expect files
          # carry bare filenames. Here the compiler is handed
          # /in/tcc-src/tests/tests2/03_struct.c, so both its diagnostics and
          # any __FILE__ the program prints carry that prefix -- which is why
          # 129_scopes differed on all thirty of its lines while every
          # assertion in it said `ok`.
          #
          # The whitespace rule below is unchanged and is `diff -b`: runs of
          # whitespace collapse, trailing whitespace goes, and command
          # substitution strips the trailing newline so a missing final one
          # stops mattering. It is NOT a general diff -b, and it deliberately
          # does not ignore blank lines -- `-B` is not in tcc's flags either.
          norm() {
            sed -e "s;$T2/;;g" \
                -e 's/[[:space:]][[:space:]]*/ /g' \
                -e 's/[[:space:]]*$//' "$1"
          }
          same_output() {
            _a=$(norm "$1")
            _b=$(norm "$2")
            [ "$_a" = "$_b" ]
          }

          # THE COMPILER'S OUTPUT, MINUS micro-c's MARKER TRAIL. Instrumented
          # builds print bare markers to stderr; they are not diagnostics and
          # must not enter the comparison.
          diagnostics() {
            grep -av '^[A-Z][0-9]*$' "$1" 2>/dev/null || true
          }

          # NOT APPLICABLE IN THIS BOX -- AND EVERY LINE CITES tcc's OWN
          # Makefile RATHER THAN OUR JUDGEMENT.
          #
          # tcc does not run all 127 of these either. Its Makefile skips some by
          # architecture and gives others flags that need a runtime this box
          # does not have: -b wants bcheck out of libtcc1.a, -dt is a -run mode
          # that needs the in-memory loader, -pthread and -lm want libraries,
          # 113_btdll builds two shared objects. Running them anyway and
          # counting the failures made the denominator mean nothing: 34 is
          # listed here because tcc SKIPS it -- "array assignment is not in C
          # standard", Makefile:11 -- so mc-tcc rejecting it was CORRECT and was
          # being scored as a defect.
          #
          # These are reported by name with the reason and are out of the
          # denominator. Nothing here is excluded for failing; each is excluded
          # for needing something the box does not have, decided before the run.
          not_applicable() {
            case "$1" in
              34_array_assignment)
                echo "tcc skips it too -- Makefile:11, array assignment is not in C" ;;
              98_al_ax_extend|99_fastcall)
                echo "i386 only -- Makefile:16" ;;
              85_asm-outside-function|127_asm_goto)
                echo "hardcodes x86 asm -- Makefile:19-20" ;;
              112_backtrace|114_bound_signal|115_bound_setjmp|116_bound_setjmp2|126_bound_global|132_bound_test)
                echo "needs -b, and bcheck lives in libtcc1.a -- Makefile:102,116-118,131,134" ;;
              113_btdll)
                echo "builds two shared libraries -- Makefile:106-110" ;;
              60_errors_and_warnings|96_nodata_wanted|125_atomic_misc|128_run_atexit)
                echo "needs -dt, which is a -run mode -- Makefile:75-76,130,133" ;;
              117_builtins)
                echo "runs twice under -run -- Makefile:119" ;;
              106_versym|124_atomic_counter)
                echo "needs -pthread -- Makefile:92,132" ;;
              22_floating_point|24_math_library)
                echo "needs -lm -- Makefile:70-71" ;;
              46_grep)
                echo "args are a regex plus a path, and it wants ctype.h -- Makefile:60" ;;
              *) echo "" ;;
            esac
          }

          # tests2/Makefile:59 runs 31_args with five arguments and its .expect
          # carries argc==6. Run with none, a CORRECT binary prints 1 and is
          # counted against the compiler -- which is how the shim's missing
          # argv was charged to codegen for as long as it was missing.
          args_for() {
            case $1 in
              31_args) echo "arg1 arg2 arg3 arg4 arg5" ;;
              *)       echo "" ;;
            esac
          }

          if [ -s /out/mc-tcc ]; then
            t2pass=0; t2diff=0; t2cf=0; t2nf=0; t2n=0; t2na=0
            : > t2-fail.txt
            : > t2-na.txt
            for c in "$T2"/*.c; do
              [ -e "$c" ] || continue
              b=${c##*/}; b=${b%.c}
              [ -f "$T2/$b.expect" ] || continue
              na=$(not_applicable "$b")
              if [ -n "$na" ]; then
                t2na=$((t2na + 1))
                printf '    %-34s %s\n' "$b" "$na" >> t2-na.txt
                continue
              fi
              t2n=$((t2n + 1))
              # THE SECOND TRANSLATION UNIT, WHERE THERE IS ONE. Two tests are
              # built from two files:
              #     104_inline.test : FLAGS += $(subst 104,104+,$1)   Makefile:86
              #     120_alias.test  : FLAGS += $(subst 120,120+,$1)   Makefile:90
              # so 104_inline.c is compiled with 104+_inline.c and 120_alias.c
              # with 120+_alias.c. Handing over only the first file left the
              # second unit's symbols undefined, and the link failed with
              #     undefined symbol 'check_exports'      (104)
              #     undefined symbol 'inunit2'            (120)
              # which was recorded as a link defect. It is a missing file, and
              # supplying it makes these two the only multi-unit tests in the
              # sweep -- which is worth having, because stage 4 is nothing but
              # multi-unit builds.
              extra=""
              if [ -f "$T2/${b%%_*}+_${b#*_}.c" ]; then
                extra="$T2/${b%%_*}+_${b#*_}.c"
              fi
              # REMOVED BEFORE, NOT AFTER. A failed compile leaves the PREVIOUS
              # test's binary sitting there, `[ ! -s t2.bin ]` is then false,
              # and the run that follows reads a stale binary and reports its
              # output as this test's. This file already records that exact
              # mistake costing two local results.
              rm -f t2.bin t2.out t2.err t2.all
              set +e
              # LINKED AGAINST OUR OWN libtcc1 (step 10b). Two programs
              # failed for want of it and named the symbols:
              #   111_conversion       __fixunstfsi
              #   136_atomic_gcc_style __atomic_store_4, __atomic_load_4,
              #                        __atomic_compare_exchange_4
              # Those are compiler-support routines, not library calls the
              # test makes, so their absence measured the harness rather than
              # the compiler.
              timeout 60 /out/mc-tcc -B/in/tcc-src -I"$SH" -nostdlib -static \
                          -o t2.bin "$c" $extra "$SH/crt.c" $LIBTCC1 2>t2.err
              c2=$?
              set -e
              if [ "$c2" != 0 ] || [ ! -s t2.bin ]; then
                t2cf=$((t2cf + 1))
                # THE WHOLE MESSAGE, NOT 58 COLUMNS OF IT. Every one of these
                # was truncated mid-word, so "error: include fi" and "error:
                # type 'con" were the entire diagnosis and each one needed a
                # local reproduction to read. Three lines, untruncated, costs
                # nothing and is usually the answer.
                printf '    %-34s COMPILE rc=%s\n' "$b" "$c2" >> t2-fail.txt
                if [ "$c2" -gt 128 ]; then
                  printf '        SIGNAL %s during compile\n' "$((c2 - 128))" >> t2-fail.txt
                else
                  diagnostics t2.err | head -3 | sed "s;$T2/;;g; s/^/        /" >> t2-fail.txt
                fi
              else
                chmod 0755 t2.bin
                set +e; timeout 25 ./t2.bin $(args_for "$b") > t2.out 2>&1; r2=$?; set -e
                # DIAGNOSTICS FIRST, THEN THE PROGRAM -- the order tcc's own
                # single `-run` invocation produces, and the order the .expect
                # files carry.
                diagnostics t2.err > t2.all
                cat t2.out >> t2.all
                # EXIT 71 IS THE SHIM REFUSING A FLOAT, not a wrong answer.
                # tcc-test-shim aborts 70 when IT is incomplete and 71 when the
                # conversion is fine and micro-c cannot hold the value. Ten of
                # these were being counted as "output differs", which reads as
                # a codegen defect and is not one: they are the float hole,
                # and there is nothing to fix in the shim until micro-c grows
                # floating point. Counted separately so the number this step
                # reports means what it says.
                if [ "$r2" = 71 ]; then
                  t2nf=$((t2nf + 1))
                  printf '    %-34s blocked on floating point in micro-c\n' "$b" >> t2-fail.txt
                elif same_output t2.all "$T2/$b.expect"; then
                  t2pass=$((t2pass + 1))
                else
                  t2diff=$((t2diff + 1))
                  printf '    %-34s RAN, output differs\n' "$b" >> t2-fail.txt
                  # THE FIRST DIFFERING LINE, BOTH SIDES. "output differs" on
                  # its own is a fact with no lead in it; two lines here is
                  # the difference between knowing which test to reproduce and
                  # knowing what it did.
                  norm t2.all           | head -40 > t2.a
                  norm "$T2/$b.expect"  | head -40 > t2.b
                  awk 'NR==FNR{e[NR]=$0;next}
                       {if ($0 != e[FNR]) {
                          printf "        got     : %s\n", $0
                          printf "        expected: %s\n", e[FNR]
                          exit } }' t2.b t2.a >> t2-fail.txt
                fi
              fi
              # THE GATE, measured inside the same loop so it cannot drift from
              # the sweep the way a separately-written copy of one test would.
              if [ "$b" = 00_assignment ]; then
                if [ "$c2" != 0 ] || [ ! -s t2.bin ]; then
                  echo "    00_assignment: COMPILE FAILED rc=$c2"
                  diagnostics t2.err | head -30 | sed 's/^/        /'
                  s3ok=no
                elif same_output t2.all "$T2/$b.expect"; then
                  echo "    00_assignment: exit ok, MATCHES tcc's OWN .expect FILE"
                  sed 's/^/        /' t2.all
                else
                  echo "    00_assignment: DIFFERS from tcc's .expect"
                  echo "      got:"      ; sed 's/^/        /' t2.all
                  echo "      expected:" ; sed 's/^/        /' "$T2/$b.expect"
                  s3ok=no
                fi
              fi
            done
            echo
            echo "    tests2: $t2pass of $t2n APPLICABLE programs match tcc's own .expect"
            echo "            $t2diff ran with different output, $t2cf would not compile"
            echo "            $t2nf blocked on floating point in micro-c, not on the shim"
            echo "            $t2na not applicable in this box, by tcc's own Makefile"
            if [ -s t2-fail.txt ]; then
              echo "    the ones that did not:"
              head -120 t2-fail.txt
              [ "$(wc -l < t2-fail.txt)" -gt 120 ] && echo "    ... $(( $(wc -l < t2-fail.txt) - 120 )) more"
            fi
            if [ -s t2-na.txt ]; then
              echo "    not applicable, and why:"
              cat t2-na.txt
            fi
          else
            echo "    skipped: no mc-tcc was produced"
            s3ok=no
          fi

          say "11b. FLOATING POINT -- where the boundary actually is"
          # "BLOCKED ON FLOATING POINT" IS TWELVE ENTRIES ABOVE AND IT WAS
          # NEVER MEASURED, only assumed. It is much narrower than it reads.
          #
          # mc-tcc's floating-point CODE GENERATION IS CORRECT. It emits
          # fcvtzs, scvtf, fadd, fmul and fcmp with the right encodings, and a
          # double built at run time from integers is exact: 7/2 truncates to
          # 3, times 2 gives 7 back, 7*7 is 49, and comparisons order
          # correctly. Verified by disassembling the object and by running it.
          #
          # WHAT FAILS IS CONSTANTS, AND ONLY CONSTANTS. Every floating-point
          # literal in the source comes out as 0.0 -- the eight bytes are
          # reserved in .data.ro and left zero:
          #
          #     double f(void) { return 3.0; }
          #     .data.ro   0000000000000000     (3.0 is 0000000000000840)
          #
          # THE CAUSE IS ONE RUNG DOWN. tcc parses "3.0" with its own decimal
          # scanner, in double arithmetic, and stores the result in vtop->c.d
          # for init_putv to write out (tccgen.c:7796). That scanner is tcc's
          # C, compiled by micro-c -- which maps float, double and long double
          # onto one word-sized INTEGER type. So the arithmetic that turns the
          # digits into a value is integer arithmetic, and the value it
          # produces is zero. mc-tcc never had a wrong number to emit; it had
          # no number.
          #
          # WHY THAT MATTERS FOR THE ORDER OF WORK. It says the remaining
          # float gap is not "teach mc-tcc floating point" -- mc-tcc has it --
          # it is "give micro-c enough floating point to run tcc's constant
          # scanner". That is a smaller and differently-shaped job, and it is
          # the only thing standing between here and the fifteen tests2
          # programs above.
          if [ -s /out/mc-tcc ]; then
            : > fp.c
            printf '%s\n' 'union fpbits { double d; unsigned long u; };'      >> fp.c
            printf '%s\n' 'int printf(const char*, ...);'                     >> fp.c
            printf '%s\n' 'int main(void) {'                                  >> fp.c
            printf '%s\n' '    int a; int b; a = 7; b = 2;'                   >> fp.c
            printf '%s\n' '    double x; double y; x = a; y = b;'             >> fp.c
            printf '%s\n' '    double q; q = x / y;'                          >> fp.c
            printf '%s\n' '    int rt; rt = 0;'                               >> fp.c
            printf '%s\n' '    if ((int)q != 3) rt = rt + 1;'                 >> fp.c
            printf '%s\n' '    if ((int)(q * y) != 7) rt = rt + 2;'           >> fp.c
            printf '%s\n' '    if ((int)(x * x) != 49) rt = rt + 4;'          >> fp.c
            printf '%s\n' '    union fpbits f; f.d = 2.0;'                    >> fp.c
            printf '%s\n' '    printf("      arithmetic from integers: %s\n", rt ? "WRONG" : "exact");' >> fp.c
            printf '%s\n' '    printf("      the literal 2.0 reads as: %lx  (4000000000000000 is right)\n", f.u);' >> fp.c
            printf '%s\n' '    return 0;'                                     >> fp.c
            printf '%s\n' '}'                                                 >> fp.c
            set +e
            timeout 60 /out/mc-tcc -B/in/tcc-src -I"$SH" -nostdlib -static \
                        -o fp.bin fp.c "$SH/crt.c" $LIBTCC1 2>fp.err
            fprc=$?
            set -e
            if [ "$fprc" = 0 ] && [ -s fp.bin ]; then
              chmod 0755 fp.bin
              set +e; timeout 20 ./fp.bin; set -e
            else
              echo "      the probe did not build, rc=$fprc"
              grep -av '^[A-Z][0-9]*$' fp.err | head -2 | sed 's/^/        /'
            fi
          else
            echo "    skipped: no mc-tcc was produced"
          fi

          say "12. tcctest.c -- the file tcc's own test1/test2/test3 begin with"
          # tcc's Makefile runs test1 as
          #     tcc -run tcc.c -run tcctest.c
          # so tcctest.c is the gate for all three of test1, test2 and test3:
          # nothing downstream of it can be measured until it compiles. It is
          # one 3,600-line file exercising most of C, which makes it a much
          # wider net than tests2 and a single yes/no rather than a score.
          #
          # NOT RUN, ONLY COMPILED. Running it needs a libc this box does not
          # have; compiling it is the part that is about our compiler.
          if [ -s /out/mc-tcc ] && [ -f "$T2/../tcctest.c" ]; then
            rm -f tcctest.o tt.err
            set +e
            timeout 120 /out/mc-tcc -B/in/tcc-src -I/in/tcc-src -I"$SH" \
                        -w -c -o tcctest.o "$T2/../tcctest.c" 2>tt.err
            ttrc=$?
            set -e
            if [ "$ttrc" = 0 ] && [ -s tcctest.o ]; then
              echo "    tcctest.c: COMPILES -- $(wc -c < tcctest.o) byte object"
              echo "    test1/test2/test3 are reachable; they need -run and a libc"
            else
              echo "    tcctest.c: does NOT compile, rc=$ttrc"
              [ "$ttrc" -gt 128 ] && echo "      SIGNAL $((ttrc - 128))"
              grep -av '^[A-Z][0-9]*$' tt.err | head -6 | sed 's/^/      /'
              echo "      test1/test2/test3 cannot start until this compiles"
            fi
          else
            echo "    skipped: no mc-tcc, or no tcctest.c in the pinned tree"
          fi

          say '13. SELF-COMPILATION -- gen2 == gen3 == gen4'
          # THE QUESTION THIS RUNG EXISTS TO ANSWER. tcc-two-ways shows the gcc
          # side reaching a fixpoint -- gen1 builds gen2 builds gen3 and the last
          # two are byte-identical -- and that is the property a self-hosting
          # compiler has. Our side has never been measured against it, so this
          # walks the same three steps and reports exactly which one it stops on.
          #
          # IT IS EXPECTED TO STOP, AND IT STILL RUNS EVERY TIME. A step that
          # only runs once the thing already works tells you nothing on the way
          # there; the useful output while a frontier is moving is WHICH step and
          # WHAT ERROR, recorded every run so a change that moves it by one step
          # is visible immediately. Nothing here touches s3ok.
          if [ -s /out/mc-tcc ]; then
            # THE INCLUDE ORDER IS PART OF THE TEST, so it is written down.
            # tcc's OWN include/ comes first: gen1 is a real tcc and its
            # stdarg.h is the one it is entitled to. M2libc's stdarg.h is
            # written in M2-Planet's dialect and a real tcc cannot parse it --
            # searched first, it fails on line 21 and the run says nothing
            # about our compiler. micro-c-libc and M2libc follow, for the
            # headers this box has no system copy of.
            L=/src/stage3/micro-c-libc
            M=/in/m2libc-veron
            INC="-I . -I /in/tcc-src/include -I $L -I $M"
            # LONG DOUBLE IS double HERE, AND tcc HAS A SWITCH FOR SAYING SO.
            # micro-c maps float, double and long double to one word-sized
            # type, so the tcc it builds cannot represent a long double and
            # tcc's own guard fires on its own source:
            #     tccpp.c:2398: error: can't cross compile long double constants
            # TCC_USING_DOUBLE_FOR_LDOUBLE selects the double-based branch that
            # tcc already carries for exactly this case. It is honest rather
            # than a workaround -- it makes the build say what is true -- and
            # it is NOT sufficient on its own: more long-double constants
            # follow at tccgen.c:2580. Left in so the reported stopping point
            # is the real capability gap and not the first spelling of it.
            LD1="-D TCC_USING_DOUBLE_FOR_LDOUBLE=1"
            # A HEADER ERROR HERE IS A LIBRARY GAP, NOT A CODEGEN RESULT, and
            # the two are worth keeping apart. micro-c-libc was written for
            # micro-c, which has the fixed-width types built in; a real tcc
            # wants them declared, so time.h stops on int32_t. That is a real
            # obstacle to self-hosting and it is not a defect in gen1. Read a
            # header error as "the runtime headers are the next piece of work".
            echo "    gen1: mc-tcc, built by micro-c from the seed"
            printf '      %10s bytes  %s\n' \
              "$(wc -c < /out/mc-tcc)" "$(sha256sum /out/mc-tcc | cut -c1-16)"

            # STEP A -- can gen1 compile tcc's source at all? This is the part
            # that is purely about code generation, before any linking question.
            # Same rule as the loop above: clear every artefact first, so a
            # failed step cannot be read through a file an earlier one left.
            rm -f gen2.o gen3.o gen2 gen3 rt.o sj.o
            set +e
            ( cd /in/tcc-src && timeout 900 /out/mc-tcc \
                -D ONE_SOURCE=1 -D TCC_TARGET_LINUX=1 -D CONFIG_TCC_STATIC=1 \
                -B /in/tcc-src $INC \
                -w -c -o /work/gen2.o tcc.c ) 2>/work/gen2.err
            g2rc=$?
            set -e
            if [ "$g2rc" = 0 ] && [ -s gen2.o ]; then
              echo "    step A: gen1 COMPILES tcc.c -- $(wc -c < gen2.o) byte object"
            else
              echo "    step A: gen1 cannot compile tcc.c, rc=$g2rc"
              [ "$g2rc" -gt 128 ] && echo "      SIGNAL $((g2rc - 128))"
              grep -av '^[A-Z][0-9]*$' /work/gen2.err | head -6 | sed 's/^/      /'
              echo "      STOPS HERE. gen2 cannot be built, so gen3 and the"
              echo "      fixpoint are not attempted this run."
            fi

            # STEP B -- link gen2. gen2.o is tcc compiled by gen1; what it
            # needs under it is a runtime, and step 13's own census says
            # exactly which symbols: 49 after libtcc1, all libc.
            #
            # THIRTY OF THE FORTY-NINE WERE ALREADY IN THE TREE. crt.c (the
            # tests2 shim) and micro-c-libc/impl/runtime.c supply them between
            # them; gen2-extra.c is the other nineteen, written for this and
            # compiled by mc-tcc like everything else here. A runtime built by
            # something else would make gen2 a hybrid and the comparison below
            # meaningless.
            #
            # THIS IS A BOOTSTRAP LIBC AND NOT THE musl RUNG. MICRO-C.md is
            # right that mc-tcc does not need to build a libc and that musl is
            # the next rung. What this is for is the FIXPOINT -- stage 3's own
            # steps 2 through 5 -- which had never been attempted because gen2
            # would not link. live-bootstrap puts a small libc in exactly this
            # position: the weak compiler gets one, the first real compiler
            # builds the real one.
            if [ "$g2rc" = 0 ] && [ -s gen2.o ]; then
              set +e
              timeout 300 /out/mc-tcc -B/in/tcc-src -I"$L" -I"$M" -w -c \
                          -o rt.o "$L/impl/runtime.c" 2>rt.err
              rtrc=$?
              timeout 300 /out/mc-tcc -B/in/tcc-src -I"$SH" -w -c \
                          -o crt.o "$SH/crt.c" 2>crt.err
              crtrc=$?
              timeout 300 /out/mc-tcc -B/in/tcc-src -I"$SH" -w -c \
                          -o g2x.o "$SH/gen2-extra.c" 2>g2x.err
              g2xrc=$?
              set -e
              echo "    step B: runtime rc=$rtrc  crt rc=$crtrc  gen2-extra rc=$g2xrc"
              for pair in rt:rt.err crt:crt.err g2x:g2x.err; do
                nm=${pair%%:*}; ef=${pair#*:}
                if [ -s "$ef" ]; then
                  grep -av '^[A-Z][0-9]*$' "$ef" | head -2 | sed "s/^/      $nm: /"
                fi
              done

              objs="gen2.o"
              for o in rt.o crt.o g2x.o; do
                if [ -s "$o" ]; then objs="$objs $o"; fi
              done
              objs="$objs$LIBTCC1"
              rtobjs=${objs#gen2.o}
              set +e
              timeout 300 /out/mc-tcc -B/in/tcc-src -nostdlib -static \
                          -o gen2 $objs 2>lk.err
              lkrc=$?
              set -e
              if [ "$lkrc" = 0 ] && [ -s gen2 ]; then
                chmod 0755 gen2
                printf '    step B: gen2 LINKS -- %s bytes  %s\n' \
                  "$(wc -c < gen2)" "$(sha256sum gen2 | cut -c1-16)"
              else
                echo "    step B: gen2 will not link, rc=$lkrc"
                # WHAT IS MISSING, BUCKETED, BECAUSE THE TWO BUCKETS HAVE
                # DIFFERENT OWNERS: tcc's own lib/ (step 10b builds it) and a
                # libc (the musl rung).
                grep -a "undefined symbol" lk.err \
                  | sed "s/.*undefined symbol '\\([^']*\\)'.*/\\1/" \
                  | sort -u > lk.syms
                : > lk.libtcc1; : > lk.libc
                while read -r sy; do
                  case "$sy" in
                    __*tf2|__*tf3|__fix*tf*|__float*tf|__trunctf*|__extend*tf2) echo "$sy" >> lk.libtcc1 ;;
                    __clear_cache|__builtin_*|__atomic_*|alloca|__bound_alloca*) echo "$sy" >> lk.libtcc1 ;;
                    *) echo "$sy" >> lk.libc ;;
                  esac
                done < lk.syms
                echo "      undefined: $(wc -l < lk.syms) total" \
                     "-- $(wc -l < lk.libtcc1) from tcc's own lib/," \
                     "$(wc -l < lk.libc) from a libc"
                if [ -s lk.libtcc1 ]; then
                  echo "      tcc's lib/ (step 10b builds these):"; wrap lk.libtcc1
                fi
                if [ -s lk.libc ]; then
                  echo "      libc:"; wrap lk.libc
                fi
                if [ ! -s lk.syms ]; then
                  echo "      not an undefined-symbol failure:"
                  grep -av '^[A-Z][0-9]*$' lk.err | head -6 | sed 's/^/        /'
                fi
              fi
            fi

            # STEP C -- THE FIXPOINT. gen2 == gen3 IS THE BAR.
            #
            # gen1 is mc-tcc, compiled by micro-c. gen2 is tcc compiled by
            # gen1, gen3 by gen2, gen4 by gen3. The gcc-built control reaches
            # gen2 == gen3 and so must this, so that is what is asserted;
            # gen4 is built as well because a fixpoint claimed from two
            # generations is weaker than one shown over three.
            #
            # IT DID NOT ALWAYS HOLD, and the reason is worth keeping. gen2
            # and gen3 once differed by exactly ten bytes out of 874,610,
            # both beside the string ".1f MB/s":
            #
            #     gen2.o   e803000000000000    the integer 1000
            #     gen3.o   0000000000408f40    1000.0, the IEEE double
            #
            # tcc.c has exactly two floating-point constants, both
            # `(double)<int literal>` in tcc_print_stats, and tcc folds them
            # at compile time through
            #     vtop->c.ld = (uint32_t)vtop->c.i;      tccgen.c:3303
            # which micro-c compiled as an integer move. EXPERIMENT-zzzp
            # converts instead of copying, m2libc patch 0013 supplies the four
            # instructions that needed, and gen2 now lands on the same bytes
            # the converged compiler produces.
            #
            # NOTE WHAT THAT DOES NOT MEAN. micro-c still has no float
            # literals and no float arithmetic -- step 11b reports both, and
            # `return 1000.0;` still yields zero. What closed is the one
            # conversion tcc's own constants take.
            if [ -s gen2 ] && [ -x gen2 ]; then
              build_gen() {   # $1 = compiler, $2 = object out, $3 = binary out
                set +e
                ( cd /in/tcc-src && timeout 900 "$1" \
                    -D ONE_SOURCE=1 -D TCC_TARGET_LINUX=1 -D CONFIG_TCC_STATIC=1 \
                    -B /in/tcc-src $INC -w -c -o "/work/$2" tcc.c ) 2>"/work/$2.err"
                _c=$?
                set -e
                if [ "$_c" != 0 ] || [ ! -s "/work/$2" ]; then
                  echo "    $1 could not compile tcc.c, rc=$_c"
                  grep -av '^[A-Z][0-9]*$' "/work/$2.err" | head -4 | sed 's/^/      /'
                  return 1
                fi
                set +e
                timeout 300 "$1" -B/in/tcc-src -nostdlib -static \
                            -o "/work/$3" "/work/$2" $rtobjs 2>"/work/$3.err"
                _l=$?
                set -e
                if [ "$_l" != 0 ] || [ ! -s "/work/$3" ]; then
                  echo "    $1 could not link $3, rc=$_l"
                  grep -av '^[A-Z][0-9]*$' "/work/$3.err" | head -4 | sed 's/^/      /'
                  return 1
                fi
                chmod 0755 "/work/$3"
                return 0
              }

              if build_gen /work/gen2 gen3.o gen3; then
                if build_gen /work/gen3 gen4.o gen4; then
                  for g in gen2 gen3 gen4; do
                    printf '    %-5s %9s bytes  %s\n' "$g" \
                      "$(wc -c < /work/$g)" "$(sha256sum /work/$g | cut -c1-16)"
                  done
                  fixok=yes
                  if cmp -s gen2.o gen3.o; then
                    echo "    gen2 and gen3 compile tcc.c to IDENTICAL objects"
                  else
                    echo "    NOT A FIXPOINT: gen2.o and gen3.o differ by" \
                         "$(cmp -l gen2.o gen3.o | wc -l) bytes"
                    fixok=no
                  fi
                  if cmp -s gen3.o gen4.o; then
                    echo "    gen3 and gen4 agree as well"
                  else
                    echo "    NOT A FIXPOINT: gen3.o and gen4.o differ"
                    fixok=no
                  fi
                  if cmp -s gen2 gen3 && cmp -s gen3 gen4; then
                    echo "    FIXPOINT: the gen2, gen3 and gen4 BINARIES are byte-identical"
                  else
                    echo "    the binaries are not all identical"
                    fixok=no
                  fi
                  if [ "$fixok" = yes ]; then
                    echo "    self-compilation: steps 1-5 complete, from the seed"
                  fi
                  # DOES THE LAST ONE STILL WORK. A fixpoint between two
                  # broken compilers is still a fixpoint, so this asks.
                  printf 'int main(void) { return 7; }\n' > s4.c
                  set +e
                  timeout 60 /work/gen4 -B/in/tcc-src -I"$SH" -nostdlib -static \
                              -o s4.bin s4.c "$SH/crt.c" $LIBTCC1 2>/dev/null
                  set -e
                  if [ -s s4.bin ]; then
                    chmod 0755 s4.bin
                    set +e; ./s4.bin; s4rc=$?; set -e
                    echo "    gen4 compiles and runs a program: rc=$s4rc (want 7)"
                  else
                    echo "    gen4 could not compile a trivial program"
                  fi
                fi
              fi
            fi
          else
            echo "    skipped: no mc-tcc was produced"
          fi

          say 'DONE -- inside the box'
          cp m2.c /out/m2.c 2>/dev/null || true
          EOS
          chmod +x "$BOX/work/run.sh"

      # --- RUN THE BOX ----------------------------------------------------
      - name: 'IN THE BOX: seed -> stage1 -> stage2 -> micro-c -> tcc'
        run: |
          set -eu
          bwrap \
            --unshare-all --die-with-parent --new-session --clearenv \
            --setenv PATH /bin \
            --setenv HOME /work \
            --setenv LC_ALL POSIX \
            --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --setenv LD_LIBRARY_PATH /lib \
            --bind "$BOX" / \
            --ro-bind "$PWD/spikes" /src \
            --ro-bind "$PWD/pins" /in \
            --bind "$BOX/out" /out \
            --proc /proc --dev /dev --tmpfs /tmp \
            --chdir /work \
            /bin/sh /work/run.sh

      # --- OUT OF THE BOX -------------------------------------------------
      - name: 'GATE 1: our seed-built compiler matches upstream, byte for byte'
        run: |
          set -eu
          A="$BOX/out/ours-gen1.M1"
          B=oracle/ref-gen1.M1
          [ -s "$A" ] || { echo "FAIL: the box produced no ours-gen1.M1"; exit 1; }
          echo
          printf '  %-28s %10s  %s\n' 'ARTIFACT' 'BYTES' 'SHA256[0:16]'
          printf '  %-28s %10s  %s\n' 'ref-gen1.M1  (host gcc)' \
            "$(wc -c < "$B")" "$(sha256sum "$B" | cut -c1-16)"
          printf '  %-28s %10s  %s\n' 'ours-gen1.M1 (our ladder)' \
            "$(wc -c < "$A")" "$(sha256sum "$A" | cut -c1-16)"
          echo
          if cmp -s "$A" "$B"; then
            echo "PASS: a compiler built from hand-written ARM64 assembly, on ARM64"
            echo "      hardware, inside a sealed box whose entire host budget is"
            # EMPTY IS THE WHOLE POINT, SO SAY IT IN WORDS. BUDGET_PATH went
            # to '' when the binaries were committed, and this line then read
            # "whose entire host budget is ``" -- two backticks, which looks
            # like a broken variable rather than the result the job exists to
            # produce.
            _bp="$BUDGET_PATH"; [ -n "$_bp" ] || _bp='EMPTY -- nothing'
            echo "      $_bp, compiles upstream's own unpatched source to"
            echo "      output identical to upstream's reference compiler."
          else
            echo "FAIL: our G0's self-compile differs from the reference."
            cmp "$A" "$B" 2>&1 | head -3 | sed 's/^/  /'
            echo "  first differing region:"
            od -A d -t x1 "$A" | head -3 | sed 's/^/    ours /'
            od -A d -t x1 "$B" | head -3 | sed 's/^/    ref  /'
            exit 1
          fi

      - name: 'BUDGET: what this run still borrowed from the host'
        if: always()
        run: |
          echo "  on the build path : $BUDGET_PATH"
          echo "  driver            : $BUDGET_DRIVER"
          echo "  emulator          : none -- native $(uname -m)"
          echo "  network in the box: none -- --unshare-all"
          echo
          echo "  \`as\` and \`ld\` are OUT of BUDGET_PATH: stage0-as and elf are"
          echo "  committed binaries, re-derived from their own source on every"
          echo "  push under two independent disassemblers, with the whole ELF"
          echo "  reconstructed and compared byte for byte. The SEAL step fails"
          echo "  the run if either reappears in the box."

      - name: 'HAND THE COMPILER FORWARD: mc-tcc and the tree it was built from'
        run: |
          set -eu
          # THE ONE THING THAT CROSSES BETWEEN THE TWO ARMS.
          #
          # The stage-4 job needs a tcc binary and a -B directory. Both come
          # from here rather than from a host build, and both come from the
          # SAME place: pins/tcc-src is the tree micro-c compiled, so the
          # headers and lib/ sources mc-tcc is pointed at are the ones it was
          # made from. Cloning tcc again over there would be a second tree that
          # could drift from this one without anything noticing.
          #
          # A TARBALL, NOT A BARE UPLOAD, because upload-artifact does not
          # preserve the executable bit and mc-tcc has to be runnable at the
          # other end. tar keeps the mode; the receiving step checks it anyway.
          [ -s box/out/mc-tcc ] || { echo "FAIL: the seed produced no mc-tcc"; exit 1; }
          [ -f pins/tcc-src/tccgen.c ] || { echo "FAIL: no patched tcc source"; exit 1; }
          mkdir -p handoff
          cp box/out/mc-tcc handoff/mc-tcc
          chmod 0755 handoff/mc-tcc
          tar -cf handoff/tcc-src.tar -C pins tcc-src
          printf '  mc-tcc   %10s bytes  %s\n' \
            "$(wc -c < handoff/mc-tcc)" "$(sha256sum handoff/mc-tcc | cut -c1-16)"
          printf '  tcc-src  %10s bytes  %s .c files\n' \
            "$(wc -c < handoff/tcc-src.tar)" "$(ls pins/tcc-src/*.c | wc -l)"
          # THE SAME GATE THE REFERENCE ARM PUTS ON ITS OWN COMPILER. If mc-tcc
          # were dynamically linked the stage-4 box would need shared objects
          # and would stop being busybox-only. It is produced by hex2 and has
          # no interpreter at all, so this should pass trivially -- said here
          # rather than assumed, because the number it protects is the budget.
          if file -b handoff/mc-tcc | grep -q 'dynamically linked'; then
            echo "  FAIL: mc-tcc is dynamically linked"
            file -b handoff/mc-tcc
            exit 1
          fi
          echo "  static: $(file -b handoff/mc-tcc | cut -c1-70)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0-stage4-seed
          path: |
            box/out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: mc-tcc-handoff
          path: handoff/
          if-no-files-found: error

  stage4:
    runs-on: ubuntu-24.04-arm          # NATIVE aarch64, no emulation
    needs: seed
    # 20 RUNGS INCLUDING FOUR gcc BUILDS AND A KERNEL. 330 was set when this
    # job stopped at gcc 4.7.4; gcc 15 pass 1 alone can take an hour. GitHub's
    # hard ceiling for a job is 360 minutes, so this is the most that can be
    # asked for -- if the ladder does not fit, it has to be split across jobs
    # rather than given more time.
    timeout-minutes: 360
    env:
      # TIER 1 -- ON THE BUILD PATH. EMPTY. No compiler, no assembler, no
      # linker, no archiver from the host. binutils is built at rung 4.
      BUDGET_PATH: ''
      # TIER 2 -- DRIVES THE BUILD, TOUCHES NO ARTIFACT BYTE. One binary,
      # exactly as stage3-hermetic-arm64 declares.
      BUDGET_DRIVER: 'busybox'
      # OFF BY DEFAULT. Wrapping every applet in a shell script costs a fork
      # per invocation, and a build this size invokes them tens of thousands of
      # times -- it would roughly double the ladder. Turned on deliberately,
      # once, to produce the applet list for the handmade config.
      TRACE_APPLETS: ${{ inputs.trace_applets && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      # --- AIRLOCK: everything needing a network happens here -------------
      - name: Install (airlock only -- none of this enters the box)
        run: |
          sudo apt-get update
          # musl-tools IS ABSENT AND THAT IS THE SUBSTITUTION, VISIBLE.
          # stage3-to-stage4-reference installs it to build its tcc with
          # musl-gcc. This job's compiler comes from the seed, so nothing here
          # needs a C compiler capable of producing it -- and if a later edit
          # quietly reintroduces one, the diff on this line says so.
          sudo apt-get install -y --no-install-recommends \
            bubblewrap busybox-static gcc make git curl xz-utils file \
            cpio qemu-system-arm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true

      - uses: actions/download-artifact@v4
        with:
          name: mc-tcc-handoff
          path: handoff

      - name: 'THE SUBSTITUTION: mc-tcc takes the reference tcc''s place'
        run: |
          set -eu
          # THIS STEP IS THE WHOLE DIFFERENCE BETWEEN THIS JOB AND
          # stage3-to-stage4-reference. There, tcc is built here by the host's
          # musl-gcc. Here it is unpacked from the seed job, where it was made
          # by micro-c, which was made by stage 2, which was made by stage 1,
          # which was made by a hand-written assembler.
          #
          # Everything downstream is arranged to be IDENTICAL: the same layout
          # under tccsrc/, the same binary at tccsrc/tcc, so the box assembly,
          # the rungs and the boot need no knowledge of where it came from. If
          # a later step has to ask, the substitution is not clean.
          tar -xf handoff/tcc-src.tar
          mv tcc-src tccsrc
          cp handoff/mc-tcc tccsrc/tcc
          chmod 0755 tccsrc/tcc
          # THE EXECUTABLE BIT SURVIVES THE ARTIFACT ONLY BECAUSE OF THE TAR,
          # and mc-tcc is copied out of the tarball's sibling rather than the
          # tarball, so check it rather than trust it.
          [ -x tccsrc/tcc ] || { echo "FAIL: tccsrc/tcc is not executable"; exit 1; }
          printf '  mc-tcc: %s bytes  %s\n' \
            "$(wc -c < tccsrc/tcc)" "$(sha256sum tccsrc/tcc | cut -c1-16)"
          echo "  $(file -b tccsrc/tcc | cut -c1-72)"
          echo "  tcc-src: $(ls tccsrc/*.c | wc -l) .c files, config.h $([ -f tccsrc/config.h ] && echo present || echo MISSING)"

      - name: 'GATE: the compiler under test must be STATIC'
        run: |
          set -eu
          # Unchanged from the reference arm, and it matters more here rather
          # than less: if the compiler were dynamic the box would need shared
          # objects and would stop being busybox-only, and the budget this job
          # exists to report would be wrong.
          if file -b tccsrc/tcc | grep -q 'dynamically linked'; then
            echo "  the compiler is DYNAMICALLY linked -- the box cannot stay busybox-only"
            file -b tccsrc/tcc
            ldd tccsrc/tcc || true
            exit 1
          fi
          echo "  static. The box needs no shared objects for it."
          # NOT A GATE. mc-tcc answering --version is pleasant and is not what
          # the next twenty rungs need from it; the reference arm's `tcc -v`
          # was a sanity check on a compiler already known to work. A failure
          # here would say nothing that rung 0 will not say better.
          ./tccsrc/tcc -v 2>&1 | head -1 | sed 's/^/  /' || echo "  (no version output)"

      # THE CACHE HOLDS dl/, NOT pins/, AND THE DIFFERENCE MATTERS.
      #
      # Later steps MUTATE pins: the repack rewrites V7 tarballs as ustar, and
      # the backport derivation deletes gcc 4.8.5 and adds two derived files.
      # Caching pins would save that mutated state and the next run would
      # restore a directory with the donor already gone -- a cache that breaks
      # the job on its second run and looks like a source problem.
      #
      # So dl/ is downloads only and is never written to after the fetch; pins/
      # is rebuilt from it every run and is free to be mangled.
      #
      # Keyed on the version set, so bumping any version misses and refetches.
      # These are pinned immutable release tarballs, so re-downloading 200 MB
      # every run buys nothing and costs a whole run each time an upstream is
      # briefly unreachable -- which is what happened: 134 seconds to fail to
      # reach musl.libc.org, and the job with it.
      - uses: actions/cache@v4
        with:
          path: dl
          key: pins-${{ env.MUSL_VER }}-${{ env.MAKE_VER }}-${{ env.MAKE_ALT }}-${{ env.BINUTILS }}-${{ env.GMP_VER }}-${{ env.MPFR_VER }}-${{ env.MPC_VER }}-${{ env.GCC47 }}-${{ env.GCC48 }}-${{ env.GCC10 }}-${{ env.GCC15 }}-${{ env.GLIBC }}-${{ env.KHDR }}-${{ env.PERL_VER }}-${{ env.KERNEL }}-${{ env.PYTHON_VER }}-${{ env.GAWK_VER }}-${{ env.OPENSSL_VER }}-v7

      - name: Fetch pinned upstreams (airlock -- nothing here enters the box)
        run: |
          set -eu
          mkdir -p dl && cd dl

          # MIRRORS, AND A SHORT CONNECT TIMEOUT SO A DEAD ONE COSTS SECONDS.
          #
          # A run died with
          #
          #     curl: (28) Failed to connect to musl.libc.org port 443
          #           after 134279 ms
          #
          # -- two and a half minutes to discover one host was down, and then
          # the whole job with it. tools/clone-pinned.sh already does this for
          # git ("the first mirror that answers"); this is the same idea for
          # tarballs. --connect-timeout 20 means an unreachable mirror costs 20
          # seconds, not 134.
          #
          # ftpmirror.gnu.org is GNU's own round-robin redirector and is tried
          # first for that reason; ftp.gnu.org is the canonical host and goes
          # last because it is the one that is busy.
          GNU_MIRRORS="https://ftpmirror.gnu.org
                       https://mirrors.kernel.org/gnu
                       https://mirror.csclub.uwaterloo.ca/gnu
                       https://ftp.gnu.org/gnu"
          MUSL_MIRRORS="https://musl.libc.org/releases
                        https://distfiles.macports.org/musl
                        https://ftp.barfooze.de/pub/sabotage/tarballs"

          fetch() {   # $1 = newline-separated mirror list, $2 = path under each
            _out=$(basename "$2")
            if [ -s "$_out" ]; then
              printf '  cached  %-30s %10s bytes\n' "$_out" "$(wc -c < "$_out")"
              return 0
            fi
            for _m in $1; do
              if curl -fsSL --connect-timeout 20 --max-time 900 --retry 2 \
                      -o "$_out.part" "$_m/$2" 2>/dev/null; then
                mv "$_out.part" "$_out"
                printf '  fetched %-30s %10s bytes  from %s\n' \
                  "$_out" "$(wc -c < "$_out")" "$_m"
                return 0
              fi
              echo "    no answer from $_m"
            done
            rm -f "$_out.part"
            echo "  ALL MIRRORS FAILED for $2"
            return 1
          }

          fetch "$MUSL_MIRRORS" "musl-$MUSL_VER.tar.gz"
          fetch "$GNU_MIRRORS"  "make/make-$MAKE_VER.tar.gz"
          fetch "$GNU_MIRRORS"  "make/make-$MAKE_ALT.tar.gz"
          fetch "$GNU_MIRRORS"  "binutils/binutils-$BINUTILS.tar.xz"
          fetch "$GNU_MIRRORS"  "gmp/gmp-$GMP_VER.tar.xz"
          fetch "$GNU_MIRRORS"  "mpfr/mpfr-$MPFR_VER.tar.xz"
          fetch "$GNU_MIRRORS"  "mpc/mpc-$MPC_VER.tar.gz"
          fetch "$GNU_MIRRORS"  "gcc/gcc-$GCC47/gcc-$GCC47.tar.bz2"
          fetch "$GNU_MIRRORS"  "gcc/gcc-$GCC48/gcc-$GCC48.tar.bz2"
          fetch "$GNU_MIRRORS"  "gcc/gcc-$GCC10/gcc-$GCC10.tar.xz"
          fetch "$GNU_MIRRORS"  "gcc/gcc-$GCC15/gcc-$GCC15.tar.xz"
          fetch "$GNU_MIRRORS"  "binutils/binutils-$BINUTILS_LFS.tar.xz"
          fetch "$GNU_MIRRORS"  "glibc/glibc-$GLIBC.tar.xz"
          fetch "$GNU_MIRRORS"  "gawk/gawk-$GAWK_VER.tar.xz"
          fetch "$GNU_MIRRORS"  "m4/m4-$M4_VER.tar.xz"
          fetch "$GNU_MIRRORS"  "bison/bison-$BISON_VER.tar.xz"

          # The kernel and the two glibc patches are not on a GNU mirror.
          for u in "https://www.cpan.org/src/5.0/perl-$PERL_VER.tar.xz" \
                   "https://github.com/gavinhoward/bc/releases/download/$BC_VER/bc-$BC_VER.tar.xz" \
                   "https://github.com/westes/flex/releases/download/v$FLEX_VER/flex-$FLEX_VER.tar.gz" \
                   "https://busybox.net/downloads/busybox-$BUSYBOX_VER.tar.bz2" \
                   "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VER/openssl-$OPENSSL_VER.tar.gz" \
                   "https://www.python.org/ftp/python/$PYTHON_VER/Python-$PYTHON_VER.tar.xz" \
                   "https://cdn.kernel.org/pub/linux/kernel/v${KHDR%%.*}.x/linux-$KHDR.tar.xz" \
                   "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL%%.*}.x/linux-$KERNEL.tar.xz" \
                   "https://www.linuxfromscratch.org/patches/lfs/development/glibc-fhs-1.patch"; do
            b=$(basename "$u")
            if [ -s "$b" ]; then
              printf '  cached  %-30s %10s bytes\n' "$b" "$(wc -c < "$b")"
              continue
            fi
            # STAGE 4's curl FLAGS, VERBATIM, AND THEY ARE NOT DECORATION.
            #
            # This fetched sixteen tarballs and glibc-fhs-1.patch from the same
            # host and directory, then failed on
            # glibc-2.43-upstream_fixes-1.patch alone. The URL is byte-identical
            # to the one stage4-complete has been using successfully for weeks,
            # so it is the request, not the address.
            #
            #   --http1.1          linuxfromscratch.org's HTTP/2 upsets curl
            #                      on some connections; stage 4 pins 1.1
            #   --retry-all-errors retries a 5xx or a reset, which plain
            #                      --retry does NOT -- it only retries
            #                      transient TRANSPORT errors
            #   --retry-delay 3    gives the far end a moment
            if curl -fsSL --http1.1 --retry 3 --retry-all-errors --retry-delay 3 \
                    --connect-timeout 20 --max-time 900 -o "$b.part" "$u" 2>/dev/null; then
              mv "$b.part" "$b"
              printf '  fetched %-30s %10s bytes\n' "$b" "$(wc -c < "$b")"
            else
              rm -f "$b.part"
              # A MISSING glibc PATCH IS NOT FATAL HERE. The vendored copy is
              # taken a few lines below, and that path prints "vendored" so the
              # log says which source was used. Everything else IS fatal:
              # a missing tarball cannot be substituted.
              case "$b" in
                glibc-*.patch) echo "  not upstream: $b (will use the vendored copy)" ;;
                *)             echo "  FETCH FAILED: $u"; _fetchfail=1 ;;
              esac
            fi
          done
          # A MISSING PIN IS NOT A WARNING. This loop used to print
          # "FETCH FAILED" and carry on, and the run then spent its time
          # assembling a box that could not possibly finish -- rung 13 would
          # have stopped on a glibc patch that was never downloaded.
          #
          # THE TWO glibc PATCHES COME FROM DIFFERENT DIRECTORIES, and that is
          # stage4-complete's arrangement rather than an inconsistency:
          #
          #   glibc-fhs-1.patch        lfs/development/  section 3.3 of the
          #                                              vendored book names
          #                                              this exact URL
          #   glibc-2.43-upstream...   lfs/development/  exists ONLY there,
          #                                              because only the
          #                                              development book pairs
          #                                              glibc 2.43 with a 7.x
          #                                              kernel -- which is what
          #                                              this box does
          #
          # A run was lost to putting both under 13.0, and another to putting
          # both under development. Failing here rather than four rungs later
          # is what makes that one minute instead of forty.
          [ "${_fetchfail:-0}" = 0 ] || {
            echo "  one or more pinned inputs did not download; not continuing."
            exit 1; }

          # THE glibc PATCHES ARE VENDORED, NOT FETCHED.
          #
          # /patches/lfs/development/ is not an archive: it tracks whatever the
          # development book currently is, and its contents are revised and
          # REMOVED in place. Two runs died on
          # glibc-2.43-upstream_fixes-1.patch while sixteen tarballs and
          # glibc-fhs-1.patch came down from the same host in the same run --
          # with stage4-complete's own curl flags, so it was the address rather
          # than the request. The file had been removed.
          #
          # A pinned input should not come from a mutable directory. Both
          # patches now live in spikes/stage4/patches/lfs/ and are copied,
          # not downloaded. See the README there for the digests and for how
          # to refresh one deliberately.
          #
          # THE NETWORK COPY IS TRIED FIRST for both, because taking upstream's
          # file when it is reachable keeps us honest about what the book
          # actually ships. The vendored copy stands in when it is not, which
          # is the point of having one.
          #
          # SECTION 3.3 OF THE VENDORED BOOK NAMES BOTH UNDER development/ with
          # these digests -- an earlier version of this file split them across
          # two directories on a guess, and stage4-complete does the same.
          for _pf in glibc-fhs-1.patch; do
            if [ -s "$_pf" ]; then
              echo "  fetched   $_pf"
              continue
            fi
            _v="$GITHUB_WORKSPACE/spikes/stage4/patches/lfs/$_pf"
            if [ -s "$_v" ]; then
              cp "$_v" "$_pf"
              printf '  vendored  %-42s %s bytes\n' "$_pf" "$(wc -c < "$_pf")"
            else
              echo
              echo "  $_pf IS NEITHER REACHABLE NOR VENDORED."
              echo
              echo "  It is not optional: the book introduces the upstream_fixes"
              echo "  patch with \"Now fix glibc to build against Linux 7\", and"
              echo "  this box pairs glibc $GLIBC with linux $KHDR headers --"
              echo "  exactly the pairing it exists for. Without it rung 13 stops"
              echo "  on a -Werror redefinition between the libc and the kernel"
              echo "  headers, which reads as a glibc bug and is not one."
              echo
              echo "  Put a copy in spikes/stage4/patches/lfs/ -- that"
              echo "  directory's README has the digests and the source URL."
              exit 1
            fi
          done

          # THE PATCH DIGESTS, RECORDED AND COMPARED BUT NOT ENFORCED.
          #
          # /patches/lfs/development/ is a MOVING directory -- it tracks
          # whatever the development book currently is, and those patches are
          # revised in place. Pinning a digest would turn a legitimate upstream
          # update into a red build; pinning nothing would let a substitution
          # through unnoticed.
          #
          # So print what arrived and compare it to the digest in the book
          # vendored under spikes/stage4/books. THE REAL GATE IS `patch`
          # ITSELF: a truncated or substituted patch does not apply cleanly to
          # glibc 2.43, and rung 13 refuses to continue when it does not.
          # Same reasoning, same digests, as stage4-complete.
          for _pd in "glibc-fhs-1.patch 9a5997c3452909b1769918c759eff8a2"; do
            set -- $_pd
            [ -f "$1" ] || continue
            _got=$(md5sum "$1" | cut -d' ' -f1)
            if [ "$_got" = "$2" ]; then
              printf '  %-42s md5 matches the vendored book\n' "$1"
            else
              printf '  %-42s md5 DIFFERS from the vendored book\n' "$1"
              echo "      vendored r13.0-156 : $2"
              echo "      fetched now        : $_got"
              echo "    Not fatal -- the development book moves. But if glibc"
              echo "    fails after this, THIS LINE IS THE FIRST THING TO READ."
            fi
          done

          echo "  --- what came in ---"
          sha256sum ./*.tar.* 2>/dev/null | sed 's/^/    /'
          # HASHES ARE PRINTED, NOT YET ENFORCED. sources/musl.toml carries
          # musl's; the rest belong in sources/*.toml before this job is
          # anything but exploratory. With a cache in play that matters MORE,
          # not less -- a cache hit means nobody re-fetched the bytes, so the
          # only thing standing between the job and a corrupted cache entry
          # would be a hash check that does not exist yet.

          # pins/ IS THE WORKING COPY. Everything downstream mutates it; dl/ is
          # left exactly as fetched so the cache stays clean.
          cd ..
          rm -rf pins && mkdir -p pins
          cp dl/*.tar.* pins/
          # THE PATCHES ARE NOT TARBALLS. `cp dl/*.tar.*` would leave
          # glibc-fhs-1.patch and glibc-*-upstream_fixes-1.patch behind in dl/,
          # and rung 13 would report "not in /in -- fetch it" about files that
          # had been fetched perfectly well.
          cp dl/*.patch pins/ 2>/dev/null || true
          echo "  pins/ rebuilt from dl/: $(ls pins | wc -l) files, $(du -sh pins | cut -f1)"

      - name: 'AIRLOCK: derive the aarch64 backport as PATCHES the box can apply'
        run: |
          set -eu
          # THE BOX GETS PATCHES, NOT A PRE-PATCHED TREE.
          #
          # Shipping an already-transplanted gcc would work and would be wrong:
          # what enters the box should be the pinned upstream source plus a
          # NAMED, REVIEWABLE delta, exactly as spikes/stage3/patches/ does for
          # tcc and m2libc. A patched tarball hides the delta inside an opaque
          # blob and there is nothing left to review.
          #
          # WHY THE DERIVATION IS HERE AND THE APPLICATION IS THERE.
          # backport-aarch64.sh is ~200 lines of embedded python plus
          # expand_int_iterators.py (306 lines) and port_gcc47_api.py; it
          # rewrites gcc source, so it is tier 1 and cannot run in the box.
          # Deriving a patch from pinned inputs is the same class of operation
          # as drop_asm.py in stage3-hermetic-arm64 -- "a source edit, not a
          # compilation". APPLYING that patch needs only busybox tar and
          # busybox patch, which the box already has.
          #
          # THIS STEP IS MEANT TO BE RETIRED. The two artifacts it produces are
          # uploaded; commit them under spikes/stage4/patches/gcc47-aarch64/
          # and delete this step, and then no python touches the pipeline at
          # all -- the patches become pinned inputs like every other.
          mkdir -p bp && cd bp
          tar -jxf "../pins/gcc-$GCC47.tar.bz2"; mv "gcc-$GCC47" stock
          tar -jxf "../pins/gcc-$GCC47.tar.bz2"
          tar -jxf "../pins/gcc-$GCC48.tar.bz2"
          echo "  before: $(grep -c aarch64 "gcc-$GCC47/gcc/config.gcc" || true) aarch64 mentions in config.gcc"
          bash "$GITHUB_WORKSPACE/spikes/stage4/probes/backport-aarch64.sh" \
            "gcc-$GCC47" "gcc-$GCC48" | sed 's/^/    /'
          echo "  after:  $(grep -c aarch64 "gcc-$GCC47/gcc/config.gcc" || true) aarch64 mentions in config.gcc"

          # SPLIT THE DELTA IN TWO, because the two halves want different tools.
          #   NEW files      -> a tar overlay. busybox tar is proven here; a
          #                     unified diff creating 37 files from /dev/null
          #                     leans on busybox patch far harder than it needs to.
          #   CHANGED files  -> a real patch, small and readable, over the
          #                     handful of files 4.7.4 already had.
          : > /tmp/new.txt; : > /tmp/chg.txt
          ( cd "gcc-$GCC47" && find . -type f | sort ) > /tmp/all.txt
          while IFS= read -r f; do
            if [ ! -f "stock/$f" ]; then
              printf '%s\n' "$f" >> /tmp/new.txt
            elif ! cmp -s "stock/$f" "gcc-$GCC47/$f"; then
              printf '%s\n' "$f" >> /tmp/chg.txt
            fi
          done < /tmp/all.txt
          echo "  new files:     $(wc -l < /tmp/new.txt)"
          echo "  changed files: $(wc -l < /tmp/chg.txt)"
          sed 's/^/    /' /tmp/chg.txt

          tar -czf "../pins/gcc47-aarch64-newfiles.tar.gz" \
              -C "gcc-$GCC47" -T /tmp/new.txt
          : > "../pins/gcc47-aarch64-changed.patch"
          while IFS= read -r f; do
            diff -u "stock/$f" "gcc-$GCC47/$f" \
              | sed -e "1s|^--- .*|--- a/${f#./}|" -e "2s|^+++ .*|+++ b/${f#./}|" \
              >> "../pins/gcc47-aarch64-changed.patch" || true
          done < /tmp/chg.txt

          cd ..
          rm -f "pins/gcc-$GCC48.tar.bz2"
          rm -rf bp
          echo "  --- what the box will apply ---"
          printf '    %-34s %10s bytes\n' gcc47-aarch64-newfiles.tar.gz "$(wc -c < pins/gcc47-aarch64-newfiles.tar.gz)"
          printf '    %-34s %10s bytes\n' gcc47-aarch64-changed.patch  "$(wc -c < pins/gcc47-aarch64-changed.patch)"
          sha256sum pins/gcc47-aarch64-* | sed 's/^/    /'

      - name: 'AIRLOCK: build the busybox this box will use'
        run: |
          set -eu
          # OUR busybox, NOT UBUNTU's, AND THE PROBE MEASURED WHY.
          #
          #     ours: 400 applets, 2.18 MB, statically linked
          #     Ubuntu's: 272
          #       split   ours=yes  ubuntu=no
          #       comm    ours=yes  ubuntu=no
          #       tsort   ours=yes  ubuntu=no
          #
          # split and comm cost two full rounds at rung 11.5 -- perl's
          # Configure needs both, Ubuntu's build has neither, and the failure
          # reads as "not found", which looks like a PATH fault rather than an
          # applet that was compiled out. rungs.sh still builds its own split
          # and comm, and with this they become belt-and-braces rather than the
          # only source.
          #
          # THE REAL POINT IS DECLARATION. The box's single host binary was
          # whatever Ubuntu happened to ship; now it is one we built from a
          # pinned tarball with a config in this file. "The box has no split"
          # stops being a discovery.
          #
          # CONFIG_TC IS OFF because busybox 1.36.1's tc.c is 2023 code against
          # 2026 kernel headers -- TCA_CBQ_MAX and struct tc_cbq_lssopt were
          # removed upstream. A build sysroot has no use for traffic shaping.
          BB=1.36.1
          # PINNED BY BYTES, NOT JUST BY VERSION STRING.
          #
          # Every other upstream in this job is fetched and then checked
          # against a recorded sha256; this one was fetched and trusted. That
          # made "pinned source" mean a pinned VERSION -- nothing asserted the
          # contents, so a compromised or re-rolled tarball at that URL would
          # have walked straight into the box as the one binary that drives
          # the whole build.
          #
          # busybox 1.36.1, from busybox.net's own SHA256SUMS.
          BB_SHA=b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314
          mkdir -p dl && cd dl
          [ -s "busybox-$BB.tar.bz2" ] || \
            curl -fsSL --connect-timeout 20 --retry 2 \
              -O "https://busybox.net/downloads/busybox-$BB.tar.bz2"
          _got=$(sha256sum "busybox-$BB.tar.bz2" | cut -d' ' -f1)
          if [ "$_got" != "$BB_SHA" ]; then
            echo "  FAIL: busybox-$BB.tar.bz2 does not match its pin"
            echo "    expected $BB_SHA"
            echo "    got      $_got"
            exit 1
          fi
          echo "  busybox-$BB.tar.bz2 matches its pin ($BB_SHA)"
          cd ..
          rm -rf bbsrc && mkdir bbsrc
          tar xf "dl/busybox-$BB.tar.bz2" -C bbsrc --strip-components=1
          cd bbsrc
          make defconfig > /dev/null 2>&1
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          for sym in SPLIT COMM JOIN PASTE EXPAND UNEXPAND FOLD NL TSORT \
                     CMP DIFF PATCH AWK SED GREP SORT UNIQ TR CUT; do
            sed -i "s/^# CONFIG_$sym is not set/CONFIG_$sym=y/" .config
            grep -q "^CONFIG_$sym=y" .config || echo "CONFIG_$sym=y" >> .config
          done
          for sym in SSL_CLIENT FEATURE_WGET_OPENSSL TLS TC; do
            sed -i "s/^CONFIG_$sym=y/# CONFIG_$sym is not set/" .config
          done
          yes '' | make oldconfig > /dev/null 2>&1 || true
          # VERIFY AFTER oldconfig -- it re-derives symbols and has undone
          # exactly this edit before, in this repository, three runs running.
          _bad=0
          for sym in STATIC SPLIT COMM; do
            grep -q "^CONFIG_$sym=y" .config || { echo "  CONFIG_$sym did not survive oldconfig"; _bad=1; }
          done
          [ "$_bad" = 0 ] || exit 1
          make -j"$(nproc)" > b.log 2>&1 || {
            echo "  --- errors ---"
            grep -oE '^[^ :]+\.(c|h):[0-9]+' b.log | cut -d: -f1 | sort | uniq -c | sort -rn | head -6 | sed 's/^/    /'
            tail -20 b.log | sed 's/^/    /'; exit 1; }
          cd ..
          cp bbsrc/busybox veron-busybox
          echo "  busybox: $(wc -c < veron-busybox) bytes, $(./veron-busybox --list | wc -l) applets"
          echo "  static:  $(file -b veron-busybox | grep -o 'statically linked' || echo NO)"
          echo "  --- the two that cost rounds ---"
          for a in split comm; do
            printf '    %-6s ours=%-3s ubuntu=%s\n' "$a" \
              "$(./veron-busybox --list | grep -qx "$a" && echo yes || echo no)" \
              "$(/bin/busybox --list | grep -qx "$a" && echo yes || echo no)"
          done

      - name: Assemble the box
        run: |
          set -eu
          BOX="$PWD/box"; echo "BOX=$BOX" >> "$GITHUB_ENV"
          mkdir -p "$BOX"/bin "$BOX"/lib "$BOX"/work "$BOX"/out \
                   "$BOX"/src "$BOX"/in "$BOX"/tmp "$BOX"/proc "$BOX"/dev

          # Tier 1 is empty, so this copies nothing. It stays because the SEAL
          # reads the same variable and the two must not describe different sets.
          for t in $BUDGET_PATH;   do cp -L "$(command -v "$t")" "$BOX/bin/$t"; done
          # OUR busybox, from the airlock step above -- see it for why.
          cp -L "$PWD/veron-busybox" "$BOX/bin/busybox"

          # tcc's -B directory: its own source tree, which is where it looks
          # for libtcc1.a and its include/. libtcc1.a is BUILT at rung 0 by the
          # compiler under test, not copied in.
          cp -a tccsrc "$BOX/work/tccsrc"
          rm -f "$BOX/work/tccsrc/libtcc1.a"
          cp -L tccsrc/tcc "$BOX/work/mc-tcc"
          chmod 0755 "$BOX/work/mc-tcc"

          # Only what the tier-2 binaries need to EXECUTE. Both are static, so
          # this should find nothing -- and the count is printed rather than
          # assumed.
          for b in "$BOX"/bin/* "$BOX/work/mc-tcc"; do
            ldd "$b" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^\//) print $i}'
          done | sort -u > /tmp/needed
          n=0
          while read -r l; do
            [ -f "$l" ] && cp -L "$l" "$BOX/lib/" && n=$((n+1))
          done < /tmp/needed
          echo "  shared objects the box needs: $n"

          # EVERY APPLET busybox HAS, ASKED FOR RATHER THAN GUESSED.
          #
          # This was a hand-written list and it was short. binutils' libiberty
          # stopped at
          #
          #     touch stamp-picdir
          #     make[2]: *** [stamp-picdir] Error 127
          #
          # -- 127 is "command not found", and `touch` was simply not in it. A
          # build this size will reach for dozens of ordinary utilities and
          # guessing which ones is a round each. `busybox --list` is the
          # authoritative answer and costs one line.
          #
          # TWO ARE NOT LINKED -- `ar` and `strings` -- because both are tier 1
          # by this job's definition: they decide what bytes end up in an
          # artifact, and busybox's ar can only READ archives, never create one.
          #
          # NOT LINKING THEM DOES NOT REMOVE THEM, and that is worth stating
          # plainly rather than leaving as an assumption. Ubuntu's
          # busybox-static is built with FEATURE_SH_STANDALONE, so its ash
          # dispatches any applet it knows BY NAME without consulting PATH.
          # rung 4's smoke test proved it: with ar unlinked and the SEAL
          # reporting 269 applets, `ar cru` still reached busybox and answered
          # "ar: invalid option -- 'r'".
          #
          # So every claim of the form "the box does not have X" holds only if
          # BUSYBOX does not have X. Where a real tool is needed, the answer is
          # to give it a name busybox has no applet for and point the build at
          # it explicitly -- which is what rung 4 does with tcc-ar and AR=.
          # Not linking these two still helps: it keeps them off PATH for
          # anything that is not busybox's own shell.
          for a in $("$BOX/bin/busybox" --list); do
            case "$a" in
              ar|strings) continue ;;
              busybox)    continue ;;
            esac
            if [ "${TRACE_APPLETS:-0}" = 1 ]; then
              # A WRAPPER THAT LOGS ITSELF AND THEN GETS OUT OF THE WAY.
              #
              # The eventual goal is a handmade busybox config containing
              # exactly the applets this chain needs -- allnoconfig plus a list,
              # so the config file IS the declaration rather than defconfig
              # minus a few seds.
              #
              # THAT LIST CANNOT BE DEDUCED FROM THE LOGS. rungs.sh invokes
              # maybe 25 applets and they are all visible. But configure is
              # generated shell that reaches for tr, expr, basename, sort, uniq
              # and a dozen more in branches that depend on what it finds;
              # Makefiles call more; the kernel's scripts/ is a small userland
              # of its own. None of it appears unless it FAILS -- which is how
              # split and comm were found, one round each.
              #
              # So measure instead. Each applet becomes a two-line wrapper that
              # appends its name to a log and then execs the real busybox, so
              # the chain runs exactly as it would otherwise and the log is the
              # precise set that was invoked. Not deduced: recorded.
              #
              # exec, NOT a call -- the wrapper must not sit in the process tree
              # holding a pipe open. A build this size runs applets in pipelines
              # tens of thousands of times.
              printf '#!/bin/busybox sh\necho %s >> /out/applets-used.txt\nexec /bin/busybox %s "$@"\n' \
                "$a" "$a" > "$BOX/bin/$a"
              chmod 0755 "$BOX/bin/$a"
            else
              ln -sf busybox "$BOX/bin/$a"
            fi
          done
          echo "  applets linked: $(find "$BOX/bin" -type l | wc -l)"
          echo "  excluded on purpose: ar strings  (tier 1 -- rung 4 builds them)"

          # WHICH APPLETS THIS busybox DOES NOT HAVE, NAMED BEFORE ANYTHING
          # NEEDS THEM.
          #
          # perl's Configure died on two of them:
          #
          #     ./Configure: line 2135: split: not found
          #     I don't know where 'comm' is, and my life depends on it.
          #
          # Both are real busybox applets -- but they are compile-time options,
          # and Ubuntu's busybox-static is built without them. `busybox --list`
          # reported 269 and the loop linked all 269; the ones missing were
          # never on the list to begin with, so nothing here was wrong and
          # nothing looked wrong either.
          #
          # A build reaching for one of these gets "not found" from the shell,
          # which reads as a PATH problem rather than as a busybox that was
          # compiled without the applet. Printing the gap here turns the next
          # occurrence into one line of reading.
          #
          # This is the same class as `patch -d` and `tr -dc`: what busybox
          # supports is a property of THIS BINARY, not of busybox.
          # gawk AS A WRAPPER, BECAUSE m4 AND bison BOTH PROBE FOR IT BY NAME.
          #
          # busybox has awk and not gawk, and a symlink will not do: it
          # dispatches on argv[0], so a link named gawk makes it answer
          # "gawk: applet not found". The tool-probe hit exactly that and it
          # read like a missing tool rather than a wrong link.
          #
          # busybox awk handles what these configures use -- ENVIRON, -f, gsub,
          # printf, match, all measured in tool-probe -- so the wrapper is
          # honest rather than a stand-in for something absent.
          # rm FIRST, EVEN THOUGH IT IS SAFE TODAY. busybox has no gawk applet,
          # so the loop above creates no symlink here and `>` has nothing to
          # write through. But that is a fact about busybox's applet list, not
          # about this code -- and in tool-probe the identical line truncated
          # the busybox BINARY, because there the name was symlinked first. The
          # error it produced named the wrapper and read as a permissions
          # problem.
          rm -f "$BOX/bin/gawk"
          # gawk MUST ANSWER --version LIKE gawk, NOT LIKE busybox.
          #
          # glibc's configure runs `gawk --version` and parses the result:
          #
          #     checking version of gawk... v. ?.??, bad
          #     *** These critical programs are missing or too old: gawk
          #
          # busybox awk prints its own banner, which that parse cannot read.
          # The CAPABILITY is not in question -- tool-probe measured ENVIRON,
          # -f, gsub, printf and match all working, which is everything m4,
          # bison and glibc's scripts use.
          #
          # So the wrapper answers the version question and passes everything
          # else through. THIS IS A CLAIM ABOUT AN INTERFACE, NOT A LIE ABOUT
          # AN IMPLEMENTATION: it says "this awk behaves as GNU awk 5.3 does
          # for the features being asked about", and that was measured rather
          # than assumed. If something later needs a gawk extension busybox
          # lacks, it fails on that extension, which is a legible failure.
          printf '%s\n' '#!/bin/busybox sh' \
            'case "$1" in' \
            '  --version|-V|--ver*)' \
            '    echo "GNU Awk 5.3.1, API 4.0"' \
            '    echo "(busybox awk -- see the box assembly step for why)"' \
            '    exit 0 ;;' \
            'esac' \
            'exec /bin/busybox awk "$@"' > "$BOX/bin/gawk"
          chmod 0755 "$BOX/bin/gawk"
          echo "  gawk -> busybox awk (wrapper, not a symlink: argv[0] dispatch)"

          echo "  --- POSIX tools this busybox does NOT have ---"
          missing=""
          for a in split comm join csplit paste expand unexpand fold fmt nl \
                   pr tsort col cmp uniq tr od dd printf tee; do
            "$BOX/bin/busybox" --list | grep -qx "$a" || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "   $missing"
            echo "    A rung that needs one of these will report \"not found\", which"
            echo "    reads as a PATH fault. It is not: the applet was compiled out."
          else
            echo "    none of the commonly-needed ones are missing"
          fi
          echo "  box laid out: $(du -sh "$BOX" | cut -f1)"
          echo "  /usr/include present? $( [ -d "$BOX/usr/include" ] && echo YES || echo no )"

      - name: 'AIRLOCK: repack V7 tarballs as ustar (busybox tar requires the magic)'
        run: |
          set -eu
          # MEASURED, NOT ASSUMED THIS TIME. The out-of-sandbox probe ran the
          # box's own busybox on the same files and printed their headers:
          #
          #   musl-1.2.5   name: pax_global_heade  type: g  magic: ustar\0 00  -> OK
          #   make-3.82    name: make-3.82/        type: 5  magic: \0 x8       -> FAILED
          #   make-4.4     name: make-4.4/         type: 5  magic: \0 x8       -> FAILED
          #
          # GNU make's release tarballs are V7 format and carry NO ustar magic.
          # busybox's get_header_tar requires it and refuses them; host GNU tar
          # reads them because it handles V7. musl's is PAX/ustar, which is why
          # exactly one archive in the set worked and the rest of this job spent
          # six runs on it.
          #
          # I HAD THIS RIGHT ONCE AND THREW IT AWAY. The earlier repack was
          # removed after a local test showed every GNU tar output format except
          # v7 writes the magic -- which is true, and which tests what GNU tar
          # CAN write rather than what these tarballs ARE. Wrong experiment,
          # confident conclusion. The probe tests the actual files.
          #
          # Repacking changes the container, not the contents: the archive is a
          # pinned input, host tar reads it identically either way, and the box
          # still extracts and builds everything itself.
          cd pins
          for f in *.tar.gz *.tar.xz *.tar.bz2; do
            [ -f "$f" ] || continue
            stem=${f%%.tar.*}
            # DECOMPRESS TO A FILE FIRST. Piping into `dd count=5` kills the
            # decompressor with a broken pipe the moment dd has its bytes, and
            # the reported magic comes back as [] even for archives that have
            # it -- visible in this step's own output as
            #     make-3.82.tar.gz  V7 -> ustar  [] -> [ustar]
            # where the [] should have been the eight NULs that make it V7.
            #
            # The DECISION here was still right, because [] is not "ustar"
            # either -- but only by luck, and tool-probe's copy of this loop
            # repacked bison and mpfr, which are already ustar, for exactly
            # this reason. A check that answers "not ustar" for everything
            # looks identical to one that works.
            case "$f" in
              *.gz)  gzip  -dc "$f" > /tmp/hdr.tar 2>/dev/null ;;
              *.xz)  xz    -dc "$f" > /tmp/hdr.tar 2>/dev/null ;;
              *.bz2) bzip2 -dc "$f" > /tmp/hdr.tar 2>/dev/null ;;
            esac
            before=$(dd if=/tmp/hdr.tar bs=1 skip=257 count=5 2>/dev/null)
            [ -n "$before" ] || before="(8 NULs -- V7)"
            rm -f /tmp/hdr.tar
            if [ "$before" = "ustar" ]; then
              printf '  %-26s already ustar -- left alone\n' "$f"
              continue
            fi
            d=$(mktemp -d)
            tar xf "$f" -C "$d"
            ( cd "$d" && tar czf "$OLDPWD/$stem.repacked.tar.gz" --format=ustar ./* )
            rm -rf "$d" "$f"
            mv "$stem.repacked.tar.gz" "$stem.tar.gz"
            after=$(gzip -dc "$stem.tar.gz" | dd bs=1 skip=257 count=5 2>/dev/null)
            printf '  %-26s V7 -> ustar  [%s] -> [%s]  %s bytes\n' \
              "$f" "$before" "$after" "$(wc -c < "$stem.tar.gz")"
            [ "$after" = ustar ] || { echo "  REPACK DID NOT TAKE for $f"; exit 1; }
          done
          echo "  --- what the box will see in /in ---"
          ls -1 . | sed 's/^/    /'

      - name: 'PROBE: the exact tar command, outside bubblewrap'
        run: |
          set -eu
          # THE SAME BINARY, THE SAME FILE, NO SANDBOX.
          #
          # In the box, `tar -zxf /in/make-4.4.tar.gz` is refused with "invalid
          # tar magic" while the identical call opens musl-1.2.5.tar.gz. Three
          # runs of diagnostics inside the box have not settled why, and two of
          # those diagnostics turned out to be broken themselves. So run the
          # command outside, where host tools are available to check the answer.
          #
          # This discriminates in one step:
          #   busybox fails here too      -> busybox tar vs this tarball
          #   busybox works here          -> something about the box, not the file
          #   host tar fails too          -> the download is bad
          B="$BOX/bin/busybox"
          echo "  busybox: $("$B" 2>&1 | head -1)"
          echo
          for f in pins/musl-*.tar.gz pins/make-*.tar.gz; do
            [ -f "$f" ] || continue
            echo "  ===== $f  ($(wc -c < "$f") bytes) ====="
            echo "    first 4 bytes: $(dd if="$f" bs=1 count=4 2>/dev/null | od -An -tx1 | tr -s ' ')"

            # 1. host GNU tar, listing only
            if tar -tzf "$f" > /dev/null 2>/tmp/hosttar.err; then
              echo "    host tar -tzf     : OK  ($(tar -tzf "$f" 2>/dev/null | wc -l) members)"
            else
              echo "    host tar -tzf     : FAILED  $(head -1 /tmp/hosttar.err)"
            fi

            # 2. the box's busybox, same flags, no sandbox
            rm -rf /tmp/bbx && mkdir -p /tmp/bbx
            if ( cd /tmp/bbx && "$B" tar -zxf "$OLDPWD/$f" ) 2>/tmp/bbtar.err; then
              echo "    busybox tar -zxf  : OK  ($(ls /tmp/bbx | tr '\n' ' '))"
            else
              echo "    busybox tar -zxf  : FAILED  $(head -2 /tmp/bbtar.err | tr '\n' ' ')"
            fi

            # 3. busybox on the DECOMPRESSED bytes, which separates the -z path
            #    from the archive itself
            gzip -dc "$f" > /tmp/probe.tar
            rm -rf /tmp/bbx2 && mkdir -p /tmp/bbx2
            if ( cd /tmp/bbx2 && "$B" tar -xf /tmp/probe.tar ) 2>/tmp/bbtar2.err; then
              echo "    busybox tar -xf   : OK on the decompressed file"
            else
              echo "    busybox tar -xf   : FAILED  $(head -2 /tmp/bbtar2.err | tr '\n' ' ')"
            fi

            # 4. the header fields, carved with dd and formatted with od
            echo "    name  (0)   : $(dd if=/tmp/probe.tar bs=1 count=16      2>/dev/null | od -c | head -1)"
            echo "    type  (156) : $(dd if=/tmp/probe.tar bs=1 skip=156 count=1 2>/dev/null | od -c | head -1)"
            echo "    magic (257) : $(dd if=/tmp/probe.tar bs=1 skip=257 count=8 2>/dev/null | od -c | head -1)"
            echo "    host tar says format: $(tar -tvf /tmp/probe.tar 2>/dev/null | head -1)"
            rm -f /tmp/probe.tar
            echo
          done

      - name: 'SEAL: enumerate every executable in the box and enforce the budget'
        run: |
          set -eu
          echo "  === TIER 1: ON THE BUILD PATH ==="
          if [ -z "$BUDGET_PATH" ]; then
            echo "    EMPTY -- no compiler, no assembler, no linker, no archiver."
            echo "    binutils is BUILT at rung 4. If it appears below, a"
            echo "    configure script found it and this run is void."
          fi
          echo "  === TIER 2: DRIVER (touches no artifact byte) ==="
          echo "    busybox is now one WE BUILT, from a pinned tarball with the"
          echo "    config in this file -- not whatever the runner's distro"
          echo "    shipped. Its applet list is declared rather than inherited."
          for t in $BUDGET_DRIVER; do
            printf '    %-12s %10s  %s\n' "$t" "$(wc -c < "$BOX/bin/$t")" \
              "$(sha256sum "$BOX/bin/$t" | cut -c1-16)"
          done
          echo "  === TIER 3: THE COMPILER UNDER TEST ==="
          printf '    %-12s %10s  %s\n' mc-tcc "$(wc -c < "$BOX/work/mc-tcc")" \
            "$(sha256sum "$BOX/work/mc-tcc" | cut -c1-16)"

          # gawk IS DECLARED, because it is a real file in /bin rather than a
          # symlink and the check below would otherwise fail it as undeclared.
          # It is not a host binary: it is a two-line wrapper this workflow
          # writes, calling the busybox we built. Saying so here keeps the SEAL
          # meaning "nothing arrived that we did not put there" rather than
          # quietly widening to "nothing arrived except the things we forgot".
          printf '%s\n' $BUDGET_PATH $BUDGET_DRIVER gawk | sort -u > /tmp/declared
          find "$BOX/bin" -type f -printf '%f\n' | sort -u > /tmp/actual
          undeclared=$(comm -13 /tmp/declared /tmp/actual || true)
          if [ -n "$undeclared" ]; then
            echo "  UNDECLARED EXECUTABLES IN THE BOX:"
            printf '%s\n' "$undeclared" | sed 's/^/    /'
            exit 1
          fi
          echo "  SEALED. $(wc -l < /tmp/declared) declared entries in /bin:"
          echo "    busybox  -- built by this workflow from a pinned tarball"
          echo "    gawk     -- a wrapper around it, written by this workflow"
          echo "  $(printf '%s' "$BUDGET_PATH" | wc -w) of them on the build path."

      - name: 'IN THE BOX: mc-tcc -> musl -> make -> binutils -> gcc 4.7.4'
        run: |
          set -eu
          # ARM NAMES THIS ARM, AND IT USED TO SAY `reference`.
          #
          # rungs.sh writes $ARM as the first field of /out/rungs.txt, whose
          # whole stated purpose is "so the workflow can diff two arms without
          # parsing prose" -- and it heads the PHASE A and PHASE B banners in
          # both scripts. With both arms labelled `reference` the two rows are
          # indistinguishable, so the one comparison this job exists to make
          # could not be made from its own output. stage3-to-stage4-bridge has
          # always passed `mc-tcc` here; this now matches it.
          #
          # EVERY VERSION THE RUNGS READ IS PASSED WITH --setenv BELOW.
          #
          # bwrap gives the box its own environment: a variable in this
          # workflow's env: block is NOT visible inside. Rungs 0 through 11.5
          # never noticed because their versions are spelled out in rungs.sh;
          # everything from 11.7 up uses $GLIBC, $KHDR, $PERL_VER, $PYTHON_VER,
          # $KERNEL, $GCC15 and $BINUTILS_LFS, and would have died on the first
          # one under `set -u`.
          #
          # THE COMMENTS LIVE HERE, NOT AMONG THE FLAGS. A `#` line inside a
          # backslash continuation is not a comment -- the continuation joins
          # it to the command, and bwrap received the prose as arguments and
          # printed its usage. That cost a run, and the log gave no message
          # beyond the usage text because bwrap has nothing more specific to
          # say about "--setenv EVERY VERSION THE".
          bwrap \
            --unshare-all \
            --die-with-parent \
            --setenv PATH /bin \
            --setenv HOME /work \
            --setenv LC_ALL POSIX \
            --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --setenv LD_LIBRARY_PATH /lib \
            --setenv CC_BIN /work/mc-tcc \
            --setenv TCCDIR /work/tccsrc \
            --setenv ARM mc-tcc \
            --setenv MUSL_VER "$MUSL_VER" \
            --setenv MAKE_VER "$MAKE_VER" \
            --setenv MAKE_ALT "$MAKE_ALT" \
            --setenv BINUTILS "$BINUTILS" \
            --setenv BINUTILS_LFS "$BINUTILS_LFS" \
            --setenv GMP_VER "$GMP_VER" \
            --setenv MPFR_VER "$MPFR_VER" \
            --setenv MPC_VER "$MPC_VER" \
            --setenv GCC47 "$GCC47" \
            --setenv GCC10 "$GCC10" \
            --setenv GCC15 "$GCC15" \
            --setenv GLIBC "$GLIBC" \
            --setenv KHDR "$KHDR" \
            --setenv KERNEL "$KERNEL" \
            --setenv ENABLE_KERNEL "$ENABLE_KERNEL" \
            --setenv PERL_VER "$PERL_VER" \
            --setenv PYTHON_VER "$PYTHON_VER" \
            --setenv GAWK_VER "$GAWK_VER" \
            --setenv OPENSSL_VER "$OPENSSL_VER" \
            --setenv M4_VER "$M4_VER" \
            --setenv BC_VER "$BC_VER" \
            --setenv BISON_VER "$BISON_VER" \
            --setenv FLEX_VER "$FLEX_VER" \
            --setenv BUSYBOX_VER "$BUSYBOX_VER" \
            --bind "$BOX" / \
            --ro-bind "$PWD/spikes" /src \
            --ro-bind "$PWD/pins" /in \
            --bind "$BOX/out" /out \
            --proc /proc --dev /dev --tmpfs /tmp \
            --chdir /work \
            /bin/sh /src/stage4/bridge/rungs.sh

      # ------------------------------------------------------------------
      # PHASE B: THE SYSROOT IS THE FILESYSTEM.
      #
      # This is the second bwrap, not a nested one. Phase A ran with the box
      # as /, where /usr is musl; the final toolchain was built --prefix=/usr
      # into /work/lfs and only functions when that really IS the root,
      # because PT_INTERP, the library search path and the header search path
      # are all absolute.
      #
      # An earlier revision tried to do this from inside phase A with a helper
      # that set PATH and nothing else. PATH does not move an interpreter.
      #
      # THE SHAPE IS box15.sh's, from hermetic-gcc15.yml, which already does
      # exactly this and works: "No /usr bind. No /etc bind. The sysroot IS
      # the filesystem."
      #
      # PATH HAS NO /tools/bin, DELIBERATELY. That is where phase A's cross
      # toolchain lives, and both halves of it are musl-static so they would
      # run in here perfectly well. LFS drops the same directory entering its
      # chroot -- "the cross toolchain will no longer be used" -- and for us
      # it is what turns "the image was built by the final compiler" from a
      # convention into something the sandbox enforces.
      #
      # /build IS SCRATCH AND IS NOT THE SYSROOT. Sources are unpacked and
      # built there so that a rebuild does not litter the root that is about
      # to be hashed.
      #
      # GUARDED ON THE MARKER. rungs.sh writes .phase-a-complete only after
      # checking that sh, make, gcc, g++, ld and as all EXIST in the sysroot.
      # Starting a sandbox whose / has no shell fails on its first command
      # with "sh: not found", which reads as a missing package.
      - name: 'PHASE B: the final system, built by the final toolchain'
        if: always()
        run: |
          set -eu
          if [ ! -f "$BOX/work/lfs/.phase-a-complete" ]; then
            echo "  phase A did not complete -- $BOX/work/lfs is not enterable."
            echo "  Skipped rather than attempted: a sandbox rooted at a"
            echo "  half-built sysroot fails on its first command in a way"
            echo "  that names the wrong thing."
            exit 0
          fi
          mkdir -p "$BOX/pb"
          # THE ENTRY POINT, READ ON THE HOST, BEFORE ANY NAMESPACE EXISTS.
          #
          # Three runs died on `bwrap: execvp /usr/bin/sh: No such file or
          # directory` with no way to tell WHY from the log: bwrap says the
          # path failed, not what the path pointed at. Reading it out here
          # costs one line and shows the symlink target itself, so a repeat
          # names its own cause instead of needing another round.
          echo "  sysroot entry point, as it exists on the host:"
          ls -ld box/work/lfs/usr/bin/sh box/work/lfs/usr/bin/busybox 2>&1 \
            | sed 's/^/    /'
          bwrap \
            --unshare-all \
            --die-with-parent \
            --new-session \
            --clearenv \
            --setenv PATH /usr/bin:/usr/sbin \
            --setenv HOME /build \
            --setenv LC_ALL POSIX \
            --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --setenv ARM mc-tcc \
            --setenv LFS_TGT aarch64-veron-linux-gnu \
            --setenv GLIBC "$GLIBC" \
            --setenv GCC15 "$GCC15" \
            --setenv BINUTILS_LFS "$BINUTILS_LFS" \
            --setenv KERNEL "$KERNEL" \
            --setenv ENABLE_KERNEL "$ENABLE_KERNEL" \
            --setenv PERL_VER "$PERL_VER" \
            --setenv PYTHON_VER "$PYTHON_VER" \
            --setenv GAWK_VER "$GAWK_VER" \
            --setenv OPENSSL_VER "$OPENSSL_VER" \
            --setenv M4_VER "$M4_VER" \
            --setenv BC_VER "$BC_VER" \
            --setenv BISON_VER "$BISON_VER" \
            --setenv FLEX_VER "$FLEX_VER" \
            --setenv BUSYBOX_VER "$BUSYBOX_VER" \
            --bind "$BOX/work/lfs" / \
            --bind "$BOX/pb" /build \
            --ro-bind "$PWD/spikes" /src \
            --ro-bind "$PWD/pins" /in \
            --bind "$BOX/out" /out \
            --proc /proc --dev /dev --tmpfs /tmp --tmpfs /run \
            --chdir /build \
            /usr/bin/sh /src/stage4/bridge/rungs-sysroot.sh

      # PUBLISH THE SYSROOT SO SIDE EXPERIMENTS CAN START FROM IT.
      #
      # tool-probe can build one package hermetically -- no host /usr, our
      # busybox, our toolchain -- but only if it has a toolchain to start from.
      # Without this it falls back to skipping, which is the honest thing but
      # not a useful one.
      #
      # SAVED ONLY IF CHAPTER 5 CLOSED. A cache that can restore a half-built
      # sysroot is worse than no cache: the failure lands somewhere else
      # entirely and looks like a compiler bug. rungs.sh writes the marker only
      # after rung 14 reports ok.
      # EVERY BUILD LOG, KEPT, AND THIS JOB NEEDS IT MORE THAN THE REFERENCE
      # ARM DOES RATHER THAN LESS.
      #
      # This step and its upload exist in stage3-to-stage4-reference and were
      # missing here, which inverted the point of the pair: the arm that PASSES
      # kept its logs, and the two arms that run mc-tcc -- this one and
      # stage3-to-stage4-bridge -- kept none. Rung 6 is a known FAIL here, and
      # this job's own header says a rung that fails is the deliverable. The
      # deliverable was being destroyed unread.
      #
      # The reference arm's comment records three rounds lost exactly this way:
      # each rung prints a WINDOW of one of its logs on failure, and the window
      # missed -- rung 16 tailed a parallel build and caught gmp SUCCEEDING
      # while gcc's ld error sat at b.log:3831. In all three the file with the
      # answer was on the runner for the rest of the job.
      #
      # rungs-sysroot.sh also PRINTS "(full log uploaded as the buildlogs
      # artifact)" on every failure, in both arms. Here that sentence was a
      # lie, which is worse than silence: it sends the reader to an artifact
      # that was never created.
      #
      # This puts no byte into any artifact the build reads back -- these are
      # logs, and no rung consumes them.
      - name: 'Collect every build log'
        if: always()
        run: |
          set -u
          mkdir -p buildlogs
          # Phase A builds in $BOX/work/b-*; phase B in $BOX/pb.
          for src in "$BOX/work" "$BOX/pb"; do
            [ -d "$src" ] || continue
            find "$src" -name '*.log' -type f 2>/dev/null | while read -r f; do
              rel=$(printf '%s' "$f" | sed "s|^$BOX/||; s|/|__|g")
              # tail rather than head: a build log's failure is at the END,
              # and gcc's can reach tens of megabytes.
              tail -c 20000000 "$f" > "buildlogs/$rel" 2>/dev/null || true
            done
          done
          n=$(ls buildlogs 2>/dev/null | wc -l)
          echo "  collected $n build logs"
          if [ "$n" -gt 0 ]; then
            du -sh buildlogs | sed 's/^/    /'
            ls -S buildlogs | head -10 | sed 's/^/    /'
          fi

      # NAMED FOR THE ARM, NOT FOR THE STEP. `buildlogs-reference` is taken by
      # the other job, and two artifacts with one name is how a comparison
      # quietly reads the wrong side.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buildlogs-stage0-stage4-complete
          path: buildlogs/
          retention-days: 14
          if-no-files-found: ignore

      - name: 'Publish the sysroot for side experiments'
        if: always()
        run: |
          set -eu
          # box/work/lfs, NOT box/lfs, AND THAT WAS A REAL BUG RATHER THAN A
          # TIDY-UP. rungs.sh sets S=/work/lfs and PFX=/work/prefix, and the
          # box is bound with `--bind "$BOX" /` -- so /work is $BOX/work and
          # the sysroot lands at box/work/lfs. This step looked at box/lfs,
          # which has never existed, so it took the else branch on every run
          # and printed "chapter 5 did not complete" for runs in which it
          # had. The cache save below is keyed on the same marker and has
          # therefore never fired, which is why tool-probe still has no
          # sysroot to start from.
          if [ -f box/work/lfs/.chapter5-complete ]; then
            cp -a box/work/lfs lfs 2>/dev/null || true
            cp -a box/work/prefix prefix 2>/dev/null || true
            echo "  sysroot published: $(du -sh lfs 2>/dev/null | cut -f1) + $(du -sh prefix 2>/dev/null | cut -f1)"
          else
            echo "  chapter 5 did not complete -- nothing published, and that is"
            echo "  deliberate: a restorable half-built sysroot is worse than none."
          fi

      - uses: actions/cache/save@v4
        if: always() && hashFiles('lfs/.chapter5-complete') != ''
        with:
          path: |
            lfs
            prefix
          key: bridge-sysroot-${{ env.GLIBC }}-${{ env.KHDR }}-v1

      - name: 'THE APPLET SET: what the chain actually invoked'
        if: always()
        run: |
          set -eu
          L=box/out/applets-used.txt
          if [ "${TRACE_APPLETS:-0}" != 1 ]; then
            echo "  tracing was off. Dispatch with trace_applets=true to record"
            echo "  the applet set -- it roughly doubles the run, so it is a"
            echo "  deliberate one-off rather than something every run pays for."
            exit 0
          fi
          if [ ! -s "$L" ]; then
            echo "  tracing was on but nothing was recorded. Either the box never"
            echo "  started, or /out was not writable from inside it."
            exit 0
          fi
          total=$(wc -l < "$L")
          sort -u "$L" > /tmp/used.txt
          used=$(wc -l < /tmp/used.txt)
          have=$(./veron-busybox --list | wc -l)
          echo "  invocations recorded : $total"
          echo "  distinct applets used: $used"
          echo "  applets compiled in  : $have"
          echo
          echo "  --- the set, which is the config ---"
          tr '\n' ' ' < /tmp/used.txt | fold -w 72 -s | sed 's/^/    /'
          echo
          echo "  --- by frequency, most-used first ---"
          sort "$L" | uniq -c | sort -rn | head -25 | sed 's/^/    /'
          echo
          echo "  --- compiled in but NEVER invoked ($((have - used))) ---"
          ./veron-busybox --list | sort > /tmp/have.txt
          comm -23 /tmp/have.txt /tmp/used.txt | tr '\n' ' ' | fold -w 72 -s | sed 's/^/    /'
          echo
          echo "  --- as a busybox config ---"
          while read -r a; do
            printf '    CONFIG_%s=y\n' "$(echo "$a" | tr 'a-z-' 'A-Z_')"
          done < /tmp/used.txt | head -60
          echo
          echo "  READ THIS AS A FLOOR, NOT A SPEC. It records the applets the"
          echo "  paths that RAN invoked. A rung that failed early under-reports"
          echo "  everything above it, and a configure branch not taken this time"
          echo "  may be taken next time -- autoconf picks tools by what it"
          echo "  finds. The list is a measured lower bound on a set that was"
          echo "  previously being guessed at one round per missing tool."
          echo
          echo "  Some names are not applets: busybox's own symbol for a few"
          echo "  differs from the command name. Check each against --list"
          echo "  before writing the final config."

      - name: 'BUDGET: what this run borrowed from the host'
        if: always()
        run: |
          set -eu
          echo "  on the build path : ${BUDGET_PATH:-EMPTY -- nothing}"
          echo "  driving the build : $BUDGET_DRIVER"
          echo "  under test        : mc-tcc (grown from the seed, static)"
          echo ""
          echo "  PHASE B borrowed nothing further. It runs in a second bwrap"
          echo "  rooted at the sysroot phase A built, with PATH=/usr/bin:"
          echo "  /usr/sbin and NO /tools/bin -- so the cross toolchain that"
          echo "  produced that sysroot is unreachable while the image is"
          echo "  built, and 'built by the final compiler' is enforced by the"
          echo "  sandbox rather than asserted in a comment."
          echo ""
          echo "  NOT in the box, and that is the difference from stage 4:"
          echo "    /usr/include   host glibc headers   -- absent"
          echo "    /usr/lib       crt1.o, libc         -- absent"
          echo "    binutils       as, ld, ar, ranlib   -- absent (rung 4)"
          echo "    make           GNU make             -- absent (rung 3.5)"
          echo ""
          echo ""
          echo "  AND THE COMPILER ITSELF CAME FROM THE SEED. The reference arm"
          echo "  says at this point that it proves nothing about where its tcc"
          echo "  came from, because its tcc was built by the host. This job's"
          echo "  was not: it was handed over from the seed job, which built it"
          echo "  from a hand-written assembler with the same empty tier-1"
          echo "  budget. That is the only line that differs between the two"
          echo "  jobs, and it is the line the whole exercise is about."

      - name: 'BOOT: the kernel this chain built, under qemu, outside the box'
        if: always()
        run: |
          set -u
          # qemu IS A VERIFIER, NOT A BUILD TOOL, and it stays outside the box
          # for the same reason stage 4 keeps it outside: nothing it does
          # contributes a byte to any artifact. It reads what phase B's rung B8
          # left in /out and reports whether that boots.
          IMG=box/out/Image
          IRD=box/out/initramfs.cpio.gz
          if [ ! -s "$IMG" ] || [ ! -s "$IRD" ]; then
            echo "  no Image or initramfs -- phase B did not reach B8"
            # GREEN ONLY IF PHASE B WAS NEVER SUPPOSED TO RUN.
            #
            # This step used to `exit 0` unconditionally, so a phase B that
            # died at B2 left the whole job green with no image -- the same
            # shape stage4-complete records against itself: "a failed build
            # inside the box went green and the damage showed up later
            # somewhere else."
            #
            # The rungs deliberately never exit non-zero; the gates live out
            # here. So: if phase A did not complete, a missing image is
            # expected and this stays green, which preserves the "partial
            # progress reports rather than fails" contract phase A has always
            # had. If phase A DID complete, phase B was supposed to produce an
            # image and did not, and that is a failure.
            if [ -f "$BOX/work/lfs/.phase-a-complete" ]; then
              echo "  phase A completed, so phase B was expected to produce one."
              echo "  See the PHASE B step above for the first FAIL."
              exit 1
            fi
            echo "  phase A did not complete either -- nothing to boot yet."
            exit 0
          fi
          echo "  Image:     $(stat -c%s "$IMG") bytes"
          echo "  initramfs: $(stat -c%s "$IRD") bytes"
          echo "  booting on qemu-system-aarch64 -M virt ..."
          # THE SYSROOT, OFFERED OVER 9p, READ-ONLY.
          #
          # This is what lets the guest chroot into the sysroot this chain
          # built and run its gcc inside the kernel that same chain built --
          # the strongest single line this job can print. stage4-complete has
          # done it for several runs; the reference job enabled the three
          # kernel options for it and never offered the device, so the guest
          # reported "9p not available" every time and the gcc-in-guest half
          # was dead code on both sides.
          #
          # security_model=none because there is no uid mapping worth
          # preserving here and mapped-xattr needs a WRITABLE export, which
          # this deliberately is not. readonly=on because the guest only
          # reads; its compile output goes to a tmpfs it bind-mounts itself.
          #
          # NOTHING IS COPIED. Only what the guest opens crosses the boundary,
          # which is why sharing a multi-gigabyte sysroot costs nothing here.
          #
          # -nic none STAYS. 9p rides virtio-pci, not ethernet, despite the
          # CONFIG_NET_9P name -- so the guest gets the sysroot and still has
          # no network, which is the property the box has held all along.
          #
          # 600s: gcc under TCG emulation is slow, and a timeout that fires
          # reads exactly like a hang.
          set +e
          timeout 600 qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -smp 2 -m 2048 \
            -nographic -no-reboot -nic none \
            -fsdev local,id=vsysroot,path="$PWD/box/work/lfs",security_model=none,readonly=on \
            -device virtio-9p-pci,fsdev=vsysroot,mount_tag=veronsysroot \
            -kernel "$IMG" \
            -initrd "$IRD" \
            -append "console=ttyAMA0 earlycon rdinit=/init panic=1 loglevel=7" \
            > /tmp/boot.log 2>&1
          echo "  qemu rc=$?"
          set -e

          # THE GUEST'S REPORT IN FULL, NOT A TAIL. `tail -25` was right when
          # init printed three lines; it now cuts the test list in half and
          # leaves the reader guessing which half. Everything from the first
          # VERON marker on is the part a human wants.
          if grep -q "VERON-BOOT-OK" /tmp/boot.log; then
            echo "  --- the guest, reporting on itself ---"
            sed -n '/VERON-BOOT-OK/,$p' /tmp/boot.log | sed 's/^/    /'
          else
            echo "  did not reach VERON-BOOT-OK -- console, last 30 lines:"
            tail -30 /tmp/boot.log | sed 's/^/    /'
            echo "  THE KERNEL THIS CHAIN BUILT DID NOT REACH USERSPACE."
            exit 1
          fi

          echo
          echo "  ================================================"
          grep -h 'VERON-' /tmp/boot.log | sed 's/^/    /'
          echo "  ================================================"

          # REACHING USERSPACE IS NOT THE SAME AS BEING A GOOD BUILD, and this
          # is where that distinction is enforced rather than described. The
          # guest ran binaries the final compiler produced; if any failed, the
          # kernel or that compiler is wrong, and printing it green would hide
          # exactly the defect this job exists to find.
          #
          # AN ABSENT SUMMARY IS A FAILURE, NOT A BOOT WITH NO TESTS. That
          # distinction has cost this repository a round before: "an absent
          # probe reads exactly like a passing one."
          tl=$(grep -o 'VERON-TESTS pass=[0-9]* fail=[0-9]*' /tmp/boot.log | tail -1)
          case "$tl" in
            "")      echo "  THE GUEST NEVER REPORTED A TEST SUMMARY."
                     echo "  init did not reach the end -- treated as a failure."
                     exit 1 ;;
            *fail=0) echo "  in-guest tests: $tl" ;;
            *)       echo "  IN-GUEST TESTS FAILED: $tl"
                     grep -E '^\s+t_.* FAIL' /tmp/boot.log | sed 's/^/    /'
                     exit 1 ;;
          esac

          if ! grep -q 'VERON-DONE' /tmp/boot.log; then
            echo "  init did not run to completion (no VERON-DONE)"
            exit 1
          fi

          # THE IN-GUEST COMPILER IS REPORTED, NOT GATED. It depends on the 9p
          # share, and a 9p problem is not a toolchain problem -- failing the
          # run on it would charge a qemu detail to the compiler.
          if grep -q 'VERON-GCC-IN-GUEST ok' /tmp/boot.log; then
            echo "  the compiler ran INSIDE the kernel it built."
          else
            grep -h 'VERON-GCC-IN-GUEST' /tmp/boot.log | sed 's/^/  /'
          fi
          echo
          echo "  END TO END: a kernel and a userland built by a toolchain"
          echo "  that was itself built in a box holding one busybox and one"
          echo "  tcc, booted and ran their own tests."
