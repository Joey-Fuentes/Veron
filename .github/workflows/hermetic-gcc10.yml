name: hermetic-gcc10

# ============================================================================
# RUNG 2 OF THE CHAIN.  A gcc 10.2.0 box, which then reaches gcc 15 AND gcc 16.
# ============================================================================
#
# WHAT THIS IS FOR
#
#     tcc  ->  gcc 4.7.4 + backend  ->  g++ 4.7  ->  gcc 10   <- hermetic-gcc47
#          ->  gcc 10  ->  gcc 15                             <- THIS BOX
#          ->  gcc 10  ->  gcc 16                             <- THIS BOX
#          ->  gcc 15/16  ->  kernel + userland + boot         <- gcc15 / gcc16
#
# This box is the chain's SECOND LINK, standing on its own. It proves:
#
#   1. A complete LFS-style sysroot at gcc 10.2.0 builds and is self-sufficient
#      -- no host /usr, cross toolchain, glibc inside the sysroot.
#   2. That gcc 10 can build gcc 15.2.0.
#   3. That gcc 10 can build gcc 16.1.0.
#
# Both attempts matter and neither is redundant. 15.2.0 is where the stable
# system lands (hermetic-gcc15); 16.1.0 is where the bleeding one does
# (hermetic-gcc16). If gcc 10 reaches one and not the other, that is the single
# most useful fact this box can produce, and running only one attempt would
# hide it.
#
# WHAT THIS IS NOT
#
#   * NOT a QEMU boot. No kernel is built here. Booting belongs to
#     hermetic-gcc15 and hermetic-gcc16, whose whole job is a running system.
#   * NOT the proof that OUR gcc 4.7 can build gcc 10 -- that is
#     hermetic-gcc47's handoff step. This box starts from a host-built cross
#     toolchain, deliberately, so that a failure here is gcc 10's and not 4.7's.
#     The two together cover the link from both sides.
#
# WHY LFS 10.0, AND WHY 10.2.0 RATHER THAN 10.4.0
#
# GCC's own prerequisites: "versions prior to 10.5 allow bootstrapping with an
# ISO C++98 compiler". So the whole 10.x series up to 10.4 is reachable from
# g++ 4.7, and the choice inside that range is free. 10.2.0 is LFS 10.0's gcc,
# which means the ENTIRE surrounding set -- binutils 2.35, glibc 2.32, linux
# 5.8.3, gmp/mpfr/mpc -- is a combination somebody has already built end to
# end. 10.4.0 would leave us composing that set ourselves, and composing a set
# from memory has now cost this project three separate runs.
#
# WHAT LFS 10.0 DOES DIFFERENTLY FROM 13.0, read from the vendored book at
# spikes/stage4/books/LFS-BOOK-10_0_tar.xz rather than from memory:
#
#   * NO /usr MERGE. 10.0 chapter 4 creates REAL /bin, /lib, /sbin -- it does
#     not symlink them into /usr. Copying 13.0's layout here would put the
#     loader somewhere nothing looks for it.
#   * glibc wants libc_cv_slibdir=/lib, not /usr/lib, for the same reason.
#   * --enable-kernel=3.2, not 5.4.
#   * --with-glibc-version=2.11 on gcc pass 1.
#   * glibc 2.32 needs the LFS FHS patch.
#   * gcc pass 1 uses --enable-initfini-array and no PIE/SSP defaults.
#   * binutils pass 1 takes none of 13.0's gprofng/dtags/hash-style flags --
#     they postdate 2.35.
#   * libstdc++ pass 1 wants --with-gxx-include-dir=/tools/$LFS_TGT/include/c++/10.2.0
#
# HOW TO RUN IT
#
#   push        edits to THIS FILE ONLY -- this box never triggers another and
#               no other box triggers it
#   dispatch    try_gcc15 / try_gcc16 : run either attempt independently, so a
#                                       long run can be split across two
#               bootstrap             : no = one pass (default, while the rung
#                                       is still being made to work at all)
#
# THE DEFERRED GATE. `bootstrap: no` is a DEFERRAL, not a judgement that the
# check is unnecessary -- there is nothing to fixpoint until the single pass
# completes, and it costs ~3x. When it is turned on, gcc's own stage2/stage3
# comparison becomes the gate, and it is also the safety proof for the handoff:
# if the compiler below miscompiled stage1 in any way that survives, the
# comparison fails on its own. A green bootstrapped build IS that proof.
#
# ============================================================================

on:
  # CALLABLE, so stage4-complete can ORDER these jobs instead of
  # reimplementing them. Nothing below changes: this workflow still
  # runs standalone on push and on dispatch exactly as before.
  # github.event.inputs is null when called, and every reference to it
  # in this file already has a `|| 'default'` fallback, so the defaults
  # apply and no input plumbing is needed.
  workflow_call:
    outputs:
      sysroot_hash:
        description: 'the gcc 10 box that built 15.2.0 and 16.1.0'
        value: ${{ jobs.rung2.outputs.sysroot_hash }}
  push:
    # BRANCHES ONLY -- NEVER TAGS. Without this a `push:` with only a
    # `paths:` filter still fires on TAG pushes, because a tag carries the
    # whole commit and its paths match. Creating one mirror release tag
    # (`gh release create src/<tarball>`) therefore kicked off 19 workflows
    # at once. `branches: ['**']` matches every branch and no tag.
    branches: ['**']
    paths:
      - '.github/workflows/hermetic-gcc10.yml'
  workflow_dispatch:
    inputs:
      try_gcc15:
        description: 'attempt gcc 15.2.0 with the gcc 10 in the box'
        required: false
        default: 'yes'
      try_gcc16:
        description: 'attempt gcc 16.1.0 with the gcc 10 in the box'
        required: false
        default: 'yes'
      bootstrap:
        description: 'DEFERRED GATE: 3-stage bootstrap + make compare (~3x runtime)'
        required: false
        default: 'no'

# A NEW PUSH MUST NOT KILL A RUNNING BUILD. Cancelling in flight is right for a
# fast check and wrong for a multi-hour box: one push to fix a typo cancelled
# four in-flight hermetic runs and restarted them from zero. Long jobs queue
# instead. (The setting is spelled out below rather than named here, because a
# key:value written in prose is what a later grep will match first.)
concurrency:
  group: hermetic-gcc10-${{ github.ref }}
  cancel-in-progress: false

env:
  GNU: 'https://mirrors.kernel.org/gnu'
  LFS_TGT: 'aarch64-veron-linux-gnu'
  LFS_PATCHES: 'https://www.linuxfromscratch.org/patches/lfs/10.0'
  # LFS 10.0's tested set, chapter 3. Every version here is the book's.
  BINUTILS: '2.35'
  GCCVER: '10.2.0'
  GLIBC: '2.32'
  KERNEL: '5.8.3'
  GMP_VER: '6.2.0'
  MPFR_VER: '4.1.0'
  MPC_VER: '1.1.0'
  MAKE_VER: '4.3'
  BUSYBOX: '1.36.1'
  # LFS 10.0 chapter 6 (m4, cross) and chapter 7 (bison, native). Run 1 skipped
  # chapter 7 entirely and both gcc attempts died on its absence.
  M4_VER: '1.4.18'
  BISON_VER: '3.7.1'
  # the two rungs above, each with its own book elsewhere in the tree
  GCC15: '15.2.0'
  GCC16: '16.1.0'

jobs:
  rung2:
    outputs:
      sysroot_hash: ${{ steps.chain_seal.outputs.hash }}
    name: 'LFS 10.0 box at gcc 10.2.0 -> attempts gcc 15 and gcc 16'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap curl git bzip2 xz-utils gcc g++ make bison flex \
            texinfo m4 perl python3 file gawk patch

      - name: 'Layout and environment (LFS 10.0 ch. 4)'
        run: |
          set -eu
          S="$PWD/sysroot"
          echo "S=$S"   >> "$GITHUB_ENV"
          echo "W=$PWD" >> "$GITHUB_ENV"
          # LFS 10.0 CREATES REAL DIRECTORIES, NOT /usr SYMLINKS. 13.0 does the
          # /usr merge (ln -sv usr/$i $LFS/$i); 10.0 predates it and makes
          # /bin, /lib, /sbin actual directories. Copying 13.0's layout here
          # would install the loader to /usr/lib while every binary's PT_INTERP
          # names /lib.
          mkdir -pv "$S"/{bin,etc,lib,sbin,usr,var,tools,work}
          mkdir -pv "$S"/usr/{bin,lib,include,sbin}
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          # DEFINE THE BOX HERE, BEFORE ITS FIRST USE. A helper created later
          # than the step that calls it is a sequencing bug waiting for someone
          # to reorder a step; hermetic-gcc15 lost a run to exactly that.
          cat > box10.sh <<'EOS'
          #!/bin/sh
          # No /usr bind, no /etc bind. The sysroot IS the filesystem.
          # PATH carries BOTH /bin and /usr/bin because 10.0 has no merge.
          #
          # AND NO /tools/bin -- THIS IS THE BOOK'S CHROOT PATH, EXACTLY:
          #     PATH=/bin:/usr/bin:/sbin:/usr/sbin
          # /tools holds the PASS-1 cross tools, built by the HOST gcc against
          # the HOST glibc. Inside the box they cannot run at all:
          #     aarch64-veron-linux-gnu-ar: /lib/libc.so.6:
          #       version `GLIBC_2.33' not found (required by ...-ar)
          # because this sysroot is glibc 2.32 and the host is 2.38.
          #
          # It is not enough that they fail -- they were being CHOSEN. autoconf
          # looks for $host_alias-ar before falling back to plain ar, so with
          # /tools/bin on PATH it found the unusable cross ar and never fell
          # back. libstdc++ pass 2 compiled every object and then died at the
          # archive step. Removing the directory restores the fallback, which
          # is what LFS relies on and why the book leaves it out.
          set -eu
          S=${S:?box10.sh: S not set}
          exec bwrap \
            --unshare-all --die-with-parent --new-session --clearenv \
            --setenv PATH /bin:/usr/bin:/sbin:/usr/sbin \
            --setenv BOOTFLAG "${BOOTFLAG:-}" --setenv BOOTTGT "${BOOTTGT:-all}" \
            --setenv HOME /work \
            --setenv LC_ALL POSIX \
            --setenv TERM dumb \
            --setenv SOURCE_DATE_EPOCH 0 \
            --bind "$S" / \
            --proc /proc --dev /dev \
            --tmpfs /tmp --tmpfs /run \
            --chdir /work \
            "$@"
          EOS
          chmod +x box10.sh
          # LFS chapter 4 sets PATH ONCE for the whole session. Setting it in
          # some build steps and not others let a configure fall back to the
          # HOST g++ without complaining -- a missing cross compiler does not
          # announce itself, it is silently replaced.
          echo "$S/tools/bin" >> "$GITHUB_PATH"
          echo "  layout: $(ls "$S" | tr '\n' ' ')"
          echo "  LFS_TGT: $LFS_TGT   host: $(gcc -dumpmachine)"
          echo "  the two triplets differ, which is the isolation"

      - name: 'Cache the LFS 10.0 sysroot'
        uses: actions/cache@v4
        with:
          path: sysroot
          # Namespaced to THIS box: cache keys are repo-scoped, so a shared
          # prefix is how two workflows quietly hand each other a sysroot.
          key: hermetic-gcc10-${{ env.BINUTILS }}-${{ env.GCCVER }}-${{ env.GLIBC }}-${{ env.KERNEL }}-v1

      - name: 'Reuse the cached sysroot only if it is COMPLETE'
        run: |
          set -eu
          # actions/cache SAVES ON FAILURE. Its post step runs whenever the job was
          # not cancelled, so a run that dies half way through chapter 5 publishes a
          # half-built sysroot under the same key, and the next run restores it and
          # builds on top. That is why two runs of the same commit failed in two
          # different places: one on an unusable cross ar, the next on
          #   make: *** No targets specified and no makefile found.
          # from a stale build directory that configure never rewrote.
          #
          # A build tree is only meaningful COMPLETE. The marker is written as the
          # last act of the sysroot build; without it, start clean.
          if [ -f "$S/.sysroot-complete" ]; then
            echo "  complete sysroot restored ($(du -sh "$S" | cut -f1)) -- reusing"
            sed 's/^/    /' "$S/.sysroot-complete"
          elif [ -d "$S" ] && [ -n "$(ls -A "$S" 2>/dev/null)" ]; then
            echo "  restored sysroot has NO completion marker -- it came from a failed"
            echo "  run. Deleting it and the stale build directories so this run is clean."
            du -sh "$S" 2>/dev/null | sed 's/^/    was: /'
            rm -rf "$S"
            rm -rf b-bu1 b-gcc1 b-glibc b-libstdcxx b-libstdcxx2 b-bu2 b-gcc2 b-make
            mkdir -p "$S"/bin "$S"/etc "$S"/lib "$S"/sbin "$S"/usr "$S"/var "$S"/tools "$S"/work
            mkdir -p "$S"/usr/bin "$S"/usr/lib "$S"/usr/include "$S"/usr/sbin
            echo "    rebuilt empty"
          else
            echo "  no cached sysroot -- building from scratch"
          fi

      - name: 'Fetch everything (no network exists inside the box)'
        run: |
          set -eu
          # HARDENED FETCH. Run 1 of this box died here, 27 seconds into a
          # 110 MB download:
          #
          #   linux-5.8.3.tar.xz
          #   curl: (92) HTTP/2 stream 1 was not closed cleanly: PROTOCOL_ERROR
          #   ##[error]Process completed with exit code 92.
          #
          # Three separate defects, none of them about gcc:
          #
          #   1. --retry NEVER FIRED. curl retries timeouts, 5xx, 408 and 429.
          #      Exit 92 is a transport-layer HTTP/2 stream error and is not on
          #      that list, so "--retry 3" was decoration. --retry-all-errors
          #      is what actually covers it.
          #   2. HTTP/2 IS THE FAILURE MODE. cdn.kernel.org serves h2 and long
          #      transfers on it fail this way on shared runners.
          #      --http1.1 removes the mode outright rather than retrying into
          #      it. That is a cheaper fix than a bigger retry budget.
          #   3. A DEAD JOB FOR A DEAD SOCKET. A fetch failure stopped a build
          #      that had not started. Sources are cached and mirrored; nothing
          #      here should cost a run.
          #
          # Also: the failing URL was never NAMED. get() echoed the basename
          # BEFORE fetching, so the reader has to infer which line was in
          # flight when the error appeared. Report the URL on failure.
          get() {
            base=$(basename "$1"); printf '  %-30s' "$base"
            case "$1" in
              *.tar.gz) alt=$(printf '%s' "$1" | sed 's/\.tar\.gz$/.tar.xz/') ;;
              *.tar.xz) alt=$(printf '%s' "$1" | sed 's/\.tar\.xz$/.tar.gz/') ;;
              *)        alt="$1" ;;
            esac
            gnu=$(printf '%s' "$1" | sed 's|https://mirrors.kernel.org/gnu|https://ftp.gnu.org/gnu|')
            kern=$(printf '%s' "$1" | sed 's|https://cdn.kernel.org|https://mirrors.edge.kernel.org|')
            n=0
            for u in "$1" "$gnu" "$kern" "$alt"; do
              n=$((n+1))
              # -C - resumes a partial file, which is exactly the case a
              # mid-stream protocol error leaves behind. Not on the first
              # attempt: a complete file plus a range request is a 416.
              [ "$n" -eq 1 ] && resume="" || resume="-C -"
              # shellcheck disable=SC2086
              if curl -fsSL --http1.1 --retry 3 --retry-all-errors \
                   --retry-delay 3 --connect-timeout 15 --max-time 900 \
                   $resume -O "$u" 2> /tmp/curl.err; then
                echo " ok  $(du -h "$base" 2>/dev/null | cut -f1)"
                return 0
              fi
            done
            echo " FAILED"
            echo "    last curl error: $(tail -1 /tmp/curl.err 2>/dev/null)"
            echo "    tried:"
            printf '      %s\n' "$1" "$gnu" "$kern" "$alt"
            return 1
          }
          get "$GNU/binutils/binutils-$BINUTILS.tar.xz"
          get "$GNU/gcc/gcc-$GCCVER/gcc-$GCCVER.tar.xz"
          get "$GNU/glibc/glibc-$GLIBC.tar.xz"
          get "$GNU/gmp/gmp-$GMP_VER.tar.xz"
          get "$GNU/mpfr/mpfr-$MPFR_VER.tar.xz"
          get "$GNU/mpc/mpc-$MPC_VER.tar.gz"
          get "$GNU/make/make-$MAKE_VER.tar.gz"
          get "$GNU/m4/m4-$M4_VER.tar.xz"
          get "$GNU/bison/bison-$BISON_VER.tar.xz"
          get "https://busybox.net/downloads/busybox-$BUSYBOX.tar.bz2"
          get "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL%%.*}.x/linux-$KERNEL.tar.xz"
          # THE BOOK'S ONE PATCH THAT APPLIES TO THIS SCOPE. LFS 10.0 lists six
          # patches; five are for bash, bzip2, coreutils, kbd and sysvinit,
          # which BusyBox substitutes for. The glibc FHS patch is not optional.
          get "$LFS_PATCHES/glibc-$GLIBC-fhs-1.patch"
          ls -la *.tar.* | awk '{print "    "$5"  "$9}'

      # ---------------------------------------------------- LFS 10.0  5.2
      - name: '5.2 binutils 2.35 pass 1 (cross)'
        run: |
          set -eu
          # WHAT FAILED, WHY, AND WHERE THE LOG IS. The old one-liner grepped
          # "Error [0-9]", which matches make's own "*** [target] Error 1"
          # summary lines -- and make prints several of those per real failure,
          # so head -10 filled with them and the actual `error:` never appeared.
          # Compiler diagnostics first, make's summary second, tail last.
          die() {
            echo "  --- $1 FAILED ---"
            echo "  log: $(pwd)/$2"
            echo "  --- diagnostics ---"
            grep -nE "error:|Error:|configure: error|undefined reference|cannot find|No such file|command not found" "$2" \
              | grep -vE "^[0-9]+:make(\[[0-9]+\])?:" | head -12 | sed 's/^/    /'
            echo "  --- make summary ---"
            grep -nE "\*\*\* \[" "$2" | head -4 | sed 's/^/    /'
            echo "  --- tail ---"
            tail -20 "$2" | sed 's/^/    /'
            exit 1
          }
          tar xf "binutils-$BINUTILS.tar.xz"
          mkdir -p b-bu1 && cd b-bu1
          # THE BOOK'S FLAGS, WHICH ARE FEWER THAN 13.0's. --enable-gprofng=no,
          # --enable-new-dtags and --enable-default-hash-style all postdate
          # 2.35; passing them here makes configure reject the option outright.
          "../binutils-$BINUTILS/configure" \
            --prefix="$S/tools" \
            --with-sysroot="$S" \
            --target="$LFS_TGT" \
            --disable-nls \
            --disable-werror \
            > c.log 2>&1 || die configure c.log
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make install > i.log 2>&1 || die install i.log
          echo "  $(ls "$S/tools/bin" | wc -l) cross binaries"

      # ---------------------------------------------------- LFS 10.0  5.3
      - name: '5.3 gcc 10.2.0 pass 1 (cross, no headers, no libc)'
        run: |
          set -eu
          # WHAT FAILED, WHY, AND WHERE THE LOG IS. The old one-liner grepped
          # "Error [0-9]", which matches make's own "*** [target] Error 1"
          # summary lines -- and make prints several of those per real failure,
          # so head -10 filled with them and the actual `error:` never appeared.
          # Compiler diagnostics first, make's summary second, tail last.
          die() {
            echo "  --- $1 FAILED ---"
            echo "  log: $(pwd)/$2"
            echo "  --- diagnostics ---"
            grep -nE "error:|Error:|configure: error|undefined reference|cannot find|No such file|command not found" "$2" \
              | grep -vE "^[0-9]+:make(\[[0-9]+\])?:" | head -12 | sed 's/^/    /'
            echo "  --- make summary ---"
            grep -nE "\*\*\* \[" "$2" | head -4 | sed 's/^/    /'
            echo "  --- tail ---"
            tail -20 "$2" | sed 's/^/    /'
            exit 1
          }
          tar xf "gcc-$GCCVER.tar.xz"
          ( cd "gcc-$GCCVER"
            # In-tree, as the book does: no prefix to point at and the versions
            # travel with the source.
            tar xf "../mpfr-$MPFR_VER.tar.xz" && mv "mpfr-$MPFR_VER" mpfr
            tar xf "../gmp-$GMP_VER.tar.xz"   && mv "gmp-$GMP_VER" gmp
            tar xf "../mpc-$MPC_VER.tar.gz"   && mv "mpc-$MPC_VER" mpc )
          mkdir -p b-gcc1 && cd b-gcc1
          # --with-glibc-version=2.11 IS THE BOOK'S VALUE, not $GLIBC. It tells
          # gcc the MINIMUM glibc its output must run against, and 10.0 sets it
          # low deliberately. --enable-initfini-array is 10.0's; the PIE/SSP
          # defaults 13.0 passes are not in this book.
          "../gcc-$GCCVER/configure" \
            --target="$LFS_TGT" \
            --prefix="$S/tools" \
            --with-glibc-version=2.11 \
            --with-sysroot="$S" \
            --with-newlib \
            --without-headers \
            --enable-initfini-array \
            --disable-nls \
            --disable-shared \
            --disable-multilib \
            --disable-decimal-float \
            --disable-threads \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv \
            --disable-libstdcxx \
            --enable-languages=c,c++ \
            > c.log 2>&1 || die configure c.log
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make install > i.log 2>&1 || die install i.log
          # THE BOOK ENDS PASS 1 WITH THIS AND IT IS NOT OPTIONAL. A gcc built
          # --without-headers installs a self-contained limits.h that knows
          # nothing of the system one, so PATH_MAX is simply absent and
          # binutils pass 2 dies on "'PATH_MAX' undeclared" -- a diagnostic
          # that names a macro rather than the include chain that lost it.
          cd "$W"
          # THE BOOK'S PATH, PLUS THE ONES THE COMPILER ACTUALLY SEARCHES.
          # The book writes install-tools/include/limits.h, which is the input
          # fixincludes reads from -- correct, and not sufficient on its own
          # here, because the pass-1 compiler is used to cross-build chapter 6
          # packages BEFORE anything regenerates include-fixed. When the
          # freestanding limits.h is still in scope, MB_LEN_MAX is 1 and
          # glibc's own header refuses:
          #   bits/stdlib.h:91:3: error: "Assumed value of MB_LEN_MAX wrong"
          # which is how m4 failed. The gcc15 box already writes both; this one
          # wrote only the book's path.
          LIMH=$(dirname "$("$LFS_TGT-gcc" -print-libgcc-file-name)")
          for d in install-tools/include include include-fixed; do
            [ -d "$LIMH/$d" ] || continue
            cat "gcc-$GCCVER/gcc/limitx.h" "gcc-$GCCVER/gcc/glimits.h" \
                "gcc-$GCCVER/gcc/limity.h" > "$LIMH/$d/limits.h"
            echo "    full limits.h -> $d/ ($(wc -l < "$LIMH/$d/limits.h") lines)"
          done
          # Prove it took, rather than assuming. This is the value that failed.
          echo "    MB_LEN_MAX as the cross compiler now sees it:"
          # NOT `cmd | grep | sed || echo`. A pipeline exits with the status of
          # its LAST command, so the fallback never fires and a probe that finds
          # nothing prints nothing -- which is what happened: this reported no
          # value and no complaint. Capture, then test.
          printf '#include <limits.h>\nMBLEN MB_LEN_MAX\n' > /tmp/mb.c
          if "$LFS_TGT-gcc" -E /tmp/mb.c > /tmp/mb.i 2>/dev/null && grep -q MBLEN /tmp/mb.i; then
            grep MBLEN /tmp/mb.i | sed 's/^/      /'
          else
            echo "      could not preprocess -- headers not in place yet"
          fi
          "$S/tools/bin/$LFS_TGT-gcc" --version | head -1 | sed 's/^/    /'
          "$S/tools/bin/$LFS_TGT-gcc" -dumpmachine | sed 's/^/    targets: /'

      # ---------------------------------------------------- LFS 10.0  5.4
      - name: '5.4 linux 5.8.3 API headers'
        run: |
          set -eu
          tar xf "linux-$KERNEL.tar.xz"
          cd "linux-$KERNEL"
          make mrproper > /dev/null 2>&1
          # ARCH=arm64 for the same reason every kernel step in this repo needs
          # it: SUBARCH is derived from `uname -m` through a sed table.
          make ARCH=arm64 headers > /dev/null 2>&1
          find usr/include -name '.*' -delete
          rm -f usr/include/Makefile
          cp -r usr/include "$S/usr"
          echo "  headers: $(find "$S/usr/include" -name '*.h' | wc -l) files"
          bad=0
          for h in asm/unistd.h asm-generic/unistd.h linux/version.h; do
            if [ -f "$S/usr/include/$h" ]; then printf '    %-24s present\n' "$h"
            else printf '    %-24s MISSING\n' "$h"; bad=1; fi
          done
          [ "$bad" -eq 0 ] || { echo "  arch headers absent -- glibc cannot build"; exit 1; }

      # ---------------------------------------------------- LFS 10.0  5.5
      - name: '5.5 glibc 2.32 (cross-compiled INTO the sysroot)'
        run: |
          set -eu
          # WHAT FAILED, WHY, AND WHERE THE LOG IS. The old one-liner grepped
          # "Error [0-9]", which matches make's own "*** [target] Error 1"
          # summary lines -- and make prints several of those per real failure,
          # so head -10 filled with them and the actual `error:` never appeared.
          # Compiler diagnostics first, make's summary second, tail last.
          die() {
            echo "  --- $1 FAILED ---"
            echo "  log: $(pwd)/$2"
            echo "  --- diagnostics ---"
            grep -nE "error:|Error:|configure: error|undefined reference|cannot find|No such file|command not found" "$2" \
              | grep -vE "^[0-9]+:make(\[[0-9]+\])?:" | head -12 | sed 's/^/    /'
            echo "  --- make summary ---"
            grep -nE "\*\*\* \[" "$2" | head -4 | sed 's/^/    /'
            echo "  --- tail ---"
            tail -20 "$2" | sed 's/^/    /'
            exit 1
          }
          tar xf "glibc-$GLIBC.tar.xz"
          ( cd "glibc-$GLIBC" && patch -Np1 -i "../glibc-$GLIBC-fhs-1.patch" > /dev/null )
          echo "  FHS patch applied"
          cg() {
            # DIAGNOSTICS TO stderr, THE TRIPLET TO stdout. cg is always
            # called inside $( ), which captures stdout -- an echo here would
            # be swallowed into the variable instead of reaching the log, and
            # the failure would print nothing at all.
            [ -f "$1" ] || { echo "  config.guess MISSING: $1" >&2; return 1; }
            g=$(sh "$1" 2>/dev/null) || { echo "  config.guess FAILED: $1" >&2; return 1; }
            [ -n "$g" ] || { echo "  config.guess PRINTED NOTHING: $1" >&2; return 1; }
            printf '%s\n' "$g"
          }
          mkdir -p b-glibc && cd b-glibc
          BUILD=$(cg "../glibc-$GLIBC/scripts/config.guess") || exit 1
          echo "  build triplet: $BUILD"
          # libc_cv_slibdir=/lib, NOT /usr/lib. LFS 10.0 has no /usr merge, so
          # the shared libc belongs in /lib and that is where the loader baked
          # into every binary will look. 13.0 says /usr/lib because 13.0 merged.
          # --enable-kernel=3.2 is the book's floor for this glibc.
          "../glibc-$GLIBC/configure" \
            --prefix=/usr \
            --host="$LFS_TGT" \
            --build="$BUILD" \
            --enable-kernel=3.2 \
            --with-headers="$S/usr/include" \
            libc_cv_slibdir=/lib \
            > c.log 2>&1 || die configure c.log
          # WHICH COMPILER DID configure ACTUALLY PICK? Host and target are both
          # aarch64, so a native build and a cross build produce the same ELF
          # interpreter name and a readelf check cannot tell them apart. Only
          # the recorded CC can, and glibc records it in config.make -- checking
          # only Makefile once produced "host build in disguise" about a
          # perfectly good cross build.
          cc=$(sed -n 's/^CC *= *//p' config.make Makefile 2>/dev/null | head -1)
          [ -n "$cc" ] || cc=$(sed -n "s/^ac_cv_prog_CC='\{0,1\}//p" config.log 2>/dev/null | head -1 | tr -d "'")
          echo "  configure selected CC: ${cc:-<undetermined>}"
          case "$cc" in
            *"$LFS_TGT"*) echo "  cross compiler confirmed" ;;
            "")  echo "  UNDETERMINED -- not proceeding"; exit 1 ;;
            *)   echo "  NOT the cross compiler -- a host build wearing a cross"
                 echo "  build's name. Stopping."; exit 1 ;;
          esac
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make DESTDIR="$S" install > i.log 2>&1 || die install i.log
          echo "  loader: $(ls "$S"/lib/ld-linux-* 2>/dev/null || echo MISSING)"
          echo "  libc  : $(ls "$S"/lib/libc.so.* 2>/dev/null | head -1 || echo MISSING)"
          # LFS'S OWN SANITY CHECK, at the seam where two other sysroots in this
          # repo stopped. If the cross compiler cannot LINK, the next configure
          # reports "Link tests are not allowed after GCC_NO_EXECUTABLES", which
          # names the consequence and not the cause.
          echo "  --- can the cross compiler link? ---"
          echo 'int main(void){return 0;}' > /tmp/lt.c
          if "$LFS_TGT-gcc" /tmp/lt.c -o /tmp/lt 2> /tmp/lt.err; then
            echo "    links OK"
            readelf -l /tmp/lt | grep -A1 'program interpreter' | sed 's/^/    /'
          else
            echo "    CANNOT LINK:"; head -8 /tmp/lt.err | sed 's/^/      /'
            "$LFS_TGT-gcc" -print-search-dirs | head -4 | sed 's/^/      /'
            ls "$S/lib" 2>/dev/null | head -12 | sed 's/^/      /'
            exit 1
          fi

      # ---------------------------------------------------- LFS 10.0  5.6
      - name: '5.6 libstdc++ pass 1'
        run: |
          set -eu
          # WHAT FAILED, WHY, AND WHERE THE LOG IS. The old one-liner grepped
          # "Error [0-9]", which matches make's own "*** [target] Error 1"
          # summary lines -- and make prints several of those per real failure,
          # so head -10 filled with them and the actual `error:` never appeared.
          # Compiler diagnostics first, make's summary second, tail last.
          die() {
            echo "  --- $1 FAILED ---"
            echo "  log: $(pwd)/$2"
            echo "  --- diagnostics ---"
            grep -nE "error:|Error:|configure: error|undefined reference|cannot find|No such file|command not found" "$2" \
              | grep -vE "^[0-9]+:make(\[[0-9]+\])?:" | head -12 | sed 's/^/    /'
            echo "  --- make summary ---"
            grep -nE "\*\*\* \[" "$2" | head -4 | sed 's/^/    /'
            echo "  --- tail ---"
            tail -20 "$2" | sed 's/^/    /'
            exit 1
          }
          command -v "$LFS_TGT-g++" > /dev/null \
            || { echo "  the cross g++ is not on PATH -- configure would"; \
                 echo "  silently use the host's instead"; exit 1; }
          cg() {
            # DIAGNOSTICS TO stderr, THE TRIPLET TO stdout. cg is always
            # called inside $( ), which captures stdout -- an echo here would
            # be swallowed into the variable instead of reaching the log, and
            # the failure would print nothing at all.
            [ -f "$1" ] || { echo "  config.guess MISSING: $1" >&2; return 1; }
            g=$(sh "$1" 2>/dev/null) || { echo "  config.guess FAILED: $1" >&2; return 1; }
            [ -n "$g" ] || { echo "  config.guess PRINTED NOTHING: $1" >&2; return 1; }
            printf '%s\n' "$g"
          }
          mkdir -p b-libstdcxx && cd b-libstdcxx
          BUILD=$(cg "../gcc-$GCCVER/config.guess") || exit 1
          echo "  build triplet: $BUILD"
          "../gcc-$GCCVER/libstdc++-v3/configure" \
            --host="$LFS_TGT" \
            --build="$BUILD" \
            --prefix=/usr \
            --disable-multilib \
            --disable-nls \
            --disable-libstdcxx-pch \
            --with-gxx-include-dir="/tools/$LFS_TGT/include/c++/$GCCVER" \
            > c.log 2>&1 || die configure c.log
          make -j"$(nproc)" > b.log 2>&1 || die build b.log
          make DESTDIR="$S" install > i.log 2>&1 || die install i.log
          # A PIPELINE EXITS WITH ITS LAST COMMAND'S STATUS, so
          #   ls ... | head -1 || echo MISSING
          # never fires its fallback. This line printed an empty string and read
          # like a formatting slip, when it was in fact reporting that nothing
          # had been installed under /usr/lib at all -- pass 1 goes to
          # /usr/$LFS_TGT/lib, because libstdc++-v3 uses toolexeclibdir when
          # configure sees host != build. Search, then test the variable.
          found=$(find "$S/usr" "$S/lib" -name 'libstdc++.so.*' 2>/dev/null | head -5)
          if [ -n "$found" ]; then
            echo "  libstdc++ pass 1 installed at:"
            printf '%s\n' "$found" | sed 's|^|    |'
          else
            echo "  libstdc++: MISSING -- nothing named libstdc++.so.* in the sysroot"
            exit 1
          fi

      # ------------------------------------------- LFS 10.0 ch.6, abridged
      - name: '6.x userland: BusyBox, make, binutils pass 2, gcc pass 2'
        run: |
          set -eu
          # WHAT FAILED, WHY, AND WHERE THE LOG IS. The old one-liner grepped
          # "Error [0-9]", which matches make's own "*** [target] Error 1"
          # summary lines -- and make prints several of those per real failure,
          # so head -10 filled with them and the actual `error:` never appeared.
          # Compiler diagnostics first, make's summary second, tail last.
          die() {
            echo "  --- $1 FAILED ---"
            echo "  log: $(pwd)/$2"
            echo "  --- diagnostics ---"
            grep -nE "error:|Error:|configure: error|undefined reference|cannot find|No such file|command not found" "$2" \
              | grep -vE "^[0-9]+:make(\[[0-9]+\])?:" | head -12 | sed 's/^/    /'
            echo "  --- make summary ---"
            grep -nE "\*\*\* \[" "$2" | head -4 | sed 's/^/    /'
            echo "  --- tail ---"
            tail -20 "$2" | sed 's/^/    /'
            exit 1
          }
          export PATH="$S/tools/bin:$PATH"
          cg() {
            # DIAGNOSTICS TO stderr, THE TRIPLET TO stdout. cg is always
            # called inside $( ), which captures stdout -- an echo here would
            # be swallowed into the variable instead of reaching the log, and
            # the failure would print nothing at all.
            [ -f "$1" ] || { echo "  config.guess MISSING: $1" >&2; return 1; }
            g=$(sh "$1" 2>/dev/null) || { echo "  config.guess FAILED: $1" >&2; return 1; }
            [ -n "$g" ] || { echo "  config.guess PRINTED NOTHING: $1" >&2; return 1; }
            printf '%s\n' "$g"
          }

          # m4 IS FIRST IN CHAPTER 6, and that is where the book puts it:
          #   m4, ncurses, bash, coreutils, ... make, binutils pass 2, gcc pass 2
          # It used to be built in the chapter 7 step, AFTER gcc pass 2 -- a
          # deviation with no support in the book. A fresh build (the first
          # since the cache guard started discarding half-built sysroots) then
          # failed on
          #   bits/stdlib.h:91:3: error: "Assumed value of MB_LEN_MAX wrong"
          # which is glibc refusing a freestanding limits.h. Ordering it as the
          # book does puts m4 back where only the pass-1 compiler exists, which
          # is the state the book's recipe was written against.
          # THE SED IS THE BOOK'S AND IT IS LOAD-BEARING. m4 1.4.18 predates
          # glibc 2.28's removal of _IO_ftrylockfile, so its bundled gnulib
          # fails against this sysroot's glibc 2.32 without it.
          # A SUBSHELL, BECAUSE THIS BLOCK MOVED. When it lived in the chapter 7
          # step it was the last thing that ran, so leaving the shell inside
          # m4-1.4.18/ cost nothing. Moved to the head of chapter 6 it broke the
          # very next command:
          #   tar: busybox-1.36.1.tar.bz2: Cannot open: No such file or directory
          # -- the tarball is in $W and the shell was two directories away. A block
          # that moves inherits the cwd assumptions of wherever it lands, so this
          # one now cleans up after itself.
          ( cd "$W" && tar xf "m4-$M4_VER.tar.xz" && cd "m4-$M4_VER"
            sed -i 's/IO_ftrylockfile/IO_EOF_SEEN/' lib/*.c
            echo "#define _IO_IN_BACKUP 0x100" >> lib/stdio-impl.h
            BUILD=$(cg build-aux/config.guess) || exit 1
            echo "    m4 build triplet: $BUILD"
            ./configure --prefix=/usr --host="$LFS_TGT" \
              --build="$BUILD" > c.log 2>&1 || die "m4 configure" c.log
            make -j"$(nproc)" > b.log 2>&1 || die "m4 build" b.log
            make DESTDIR="$S" install > i.log 2>&1 || die "m4 install" i.log )
          echo "  m4 $M4_VER installed (cross)"
          cd "$W"


          # LFS chapter 6 builds seventeen packages to get a shell and the text
          # tools. BusyBox is one package that supplies sh, sed, grep, awk, tar
          # and the coreutils. A declared substitution, not an oversight.
          tar xf "busybox-$BUSYBOX.tar.bz2" && cd "busybox-$BUSYBOX"
          make defconfig > /dev/null 2>&1
          # Disable AFTER oldconfig: it re-derives selected symbols and silently
          # undoes seds applied before it. Then VERIFY, because a sed that
          # matches nothing is silent.
          # yes' stderr was not redirected, so every run printed
          #   yes: standard output: Broken pipe
          # which reads like a failure and is not one.
          yes '' 2>/dev/null | make oldconfig > /dev/null 2>&1
          for sym in CONFIG_TC CONFIG_TLS CONFIG_SSL_CLIENT \
                     CONFIG_FEATURE_WGET_HTTPS CONFIG_FEATURE_WGET_OPENSSL; do
            sed -i "s/^$sym=y/# $sym is not set/" .config
            grep -q "^$sym=y" .config && { echo "  $sym still on"; exit 1; }
            printf '    %-32s off\n' "$sym"
          done
          # THE FLAG GOES IN .config, NOT ON THE MAKE LINE. BusyBox reads
          # CONFIG_EXTRA_CFLAGS; EXTRA_CFLAGS and CFLAGS_EXTRA are ignored
          # silently, which looks exactly like a fix that did not help.
          sed -i 's|^CONFIG_EXTRA_CFLAGS=.*|CONFIG_EXTRA_CFLAGS="-D_GNU_SOURCE"|' .config
          grep -q '^CONFIG_EXTRA_CFLAGS="-D_GNU_SOURCE"' .config \
            || { echo "  could not set CONFIG_EXTRA_CFLAGS"; exit 1; }
          make -j"$(nproc)" CROSS_COMPILE="$LFS_TGT-" > b.log 2>&1 || die busybox b.log
          mkdir -p "$S/usr/bin"
          cp busybox "$S/usr/bin/"
          ( cd "$S/usr/bin" && for a in $(./busybox --list); do [ -e "$a" ] || ln -sf busybox "$a"; done )
          # 10.0 has no /usr merge, so /bin needs its own links.
          ( cd "$S/bin" && for a in sh ls cat echo mkdir rm cp mv sed grep awk tar; do
              [ -e "$a" ] || ln -sf ../usr/bin/busybox "$a"; done )
          echo "  applets: $(ls "$S/usr/bin" | wc -l)"

          cd "$W" && tar xf "make-$MAKE_VER.tar.gz" && mkdir -p b-make && cd b-make
          # build-aux/config.guess, NOT the top level. GNU make keeps its
          # autotools aux scripts in build-aux/, and the book says so:
          #   --build=$(build-aux/config.guess)
          # The top-level path produced
          #   ../make-4.3/config.guess: No such file or directory
          # and, because a failed command substitution does not trip errexit,
          # configure then ran with an EMPTY --build= and carried on. m4 in
          # this same file already had the right path; make did not.
          # --without-guile is the book's too: guile is optional and its
          # absence should not be discovered by a configure probe.
          BUILD=$(cg "../make-$MAKE_VER/build-aux/config.guess") || exit 1
          echo "  make build triplet: $BUILD"
          "../make-$MAKE_VER/configure" --prefix=/usr --host="$LFS_TGT" \
            --build="$BUILD" \
            --without-guile --disable-nls \
            > c.log 2>&1 || die "make configure" c.log
          make -j"$(nproc)" > b.log 2>&1 || die "make build" b.log
          make DESTDIR="$S" install > i.log 2>&1 || die "make install" i.log

          cd "$W" && mkdir -p b-bu2 && cd b-bu2
          BUILD=$(cg "../binutils-$BINUTILS/config.guess") || exit 1
          echo "  binutils2 build triplet: $BUILD"
          "../binutils-$BINUTILS/configure" \
            --prefix=/usr \
            --build="$BUILD" \
            --host="$LFS_TGT" \
            --disable-nls --enable-shared --disable-werror --enable-64-bit-bfd \
            > c.log 2>&1 || die "binutils2 configure" c.log
          make -j"$(nproc)" > b.log 2>&1 || die "binutils2 build" b.log
          make DESTDIR="$S" install > i.log 2>&1 || die "binutils2 install" i.log
          echo "  binutils pass 2 ok"

          cd "$W" && mkdir -p b-gcc2 && cd b-gcc2
          # THE BOOK'S gthr-default.h LINK. gcc pass 2 is a Canadian cross and
          # its libgcc needs a threads header that only exists once configured;
          # 10.0 creates it by hand before configure runs.
          mkdir -pv "$LFS_TGT/libgcc"
          ln -sf ../../../"gcc-$GCCVER"/libgcc/gthr-posix.h "$LFS_TGT/libgcc/gthr-default.h"
          BUILD=$(cg "../gcc-$GCCVER/config.guess") || exit 1
          echo "  gcc2 build triplet: $BUILD"
          "../gcc-$GCCVER/configure" \
            --build="$BUILD" \
            --host="$LFS_TGT" \
            --prefix=/usr \
            CC_FOR_TARGET="$LFS_TGT-gcc" \
            --with-build-sysroot="$S" \
            --enable-initfini-array \
            --disable-nls --disable-multilib --disable-decimal-float \
            --disable-libatomic --disable-libgomp --disable-libquadmath \
            --disable-libssp --disable-libvtv --disable-libstdcxx \
            --enable-languages=c,c++ \
            > c.log 2>&1 || die "gcc2 configure" c.log
          make -j"$(nproc)" > b.log 2>&1 || die "gcc2 build" b.log
          make DESTDIR="$S" install > i.log 2>&1 || die "gcc2 install" i.log
          ln -sfv gcc "$S/usr/bin/cc"
          echo "  gcc: $(file "$S/usr/bin/gcc" | cut -c1-90)"

      # ------------------------------------------- LFS 10.0 ch.6 m4 + ch.7
      - name: '7.x libstdc++ pass 2 and bison, INSIDE the box (LFS ch. 7)'
        run: |
          set -eu
          # THE BOX SCRIPT BELOW IS PIPED INTO sed, AND A PIPELINE EXITS WITH
          # ITS LAST COMMAND'S STATUS -- sed's, which is 0. Without pipefail
          # run 81866138350 had bison fail inside the box, the step go GREEN,
          # `.sysroot-complete` written anyway, and both gcc attempts die on
          # the missing bison an hour later. The marker must be unreachable
          # when the chapter did not finish.
          set -o pipefail
          # WHAT FAILED, WHY, AND WHERE THE LOG IS. The old one-liner grepped
          # "Error [0-9]", which matches make's own "*** [target] Error 1"
          # summary lines -- and make prints several of those per real failure,
          # so head -10 filled with them and the actual `error:` never appeared.
          # Compiler diagnostics first, make's summary second, tail last.
          die() {
            echo "  --- $1 FAILED ---"
            echo "  log: $(pwd)/$2"
            echo "  --- diagnostics ---"
            grep -nE "error:|Error:|configure: error|undefined reference|cannot find|No such file|command not found" "$2" \
              | grep -vE "^[0-9]+:make(\[[0-9]+\])?:" | head -12 | sed 's/^/    /'
            echo "  --- make summary ---"
            grep -nE "\*\*\* \[" "$2" | head -4 | sed 's/^/    /'
            echo "  --- tail ---"
            tail -20 "$2" | sed 's/^/    /'
            exit 1
          }
          export PATH="$S/tools/bin:$PATH"

          # CHAPTER 7 IS NOT OPTIONAL AND RUN 1 SKIPPED IT. The box went
          # chapter 5 -> 6 -> "use it", and both gcc attempts died on the two
          # things chapter 7 exists to install:
          #
          #   1. /work/src-15.2.0/libcody/cody.hh:24: fatal error: memory:
          #      No such file or directory
          #      -- gcc pass 2 is configured --disable-libstdcxx (the book says
          #      so) because chapter 7 rebuilds libstdc++ NATIVELY into /usr.
          #      Skip that and the box has a C++ compiler with no C++ headers,
          #      which is exactly enough to fail on the first C++ source file
          #      any modern gcc contains.
          #
          #   2. gmp/demos/calc: Error 127 building calc.c
          #      -- 127 is "command not found": calc.c is a yacc grammar and
          #      the box has no bison. Chapter 7 installs it.
          #
          # Neither is a statement about gcc 10. Both are the box being
          # unfinished.


          # Stage what the in-box builds need. The box has no network.
          cd "$W"
          # cp -a, NOT cp -r. THIS IS WHAT KILLED BISON. `cp -r` stamps every
          # copied file with the time of the copy, in whatever order the
          # filesystem hands them over, so configure.ac can land NEWER than
          # configure and Makefile.am newer than Makefile.in. automake's
          # maintainer rules then fire and try to re-run autoconf and automake,
          # which this box does not have and is not meant to have:
          #   make: *** [Makefile:3515: Makefile.in] Error 1
          #   make: *** [Makefile:3542: configure] Error 127
          # A tarball ships its generated files newer than their sources. -a
          # preserves that ordering; -r destroys it.
          rm -rf "$S/work/gccsrc" && cp -a "gcc-$GCCVER" "$S/work/gccsrc"
          tar xf "bison-$BISON_VER.tar.xz"
          rm -rf "$S/work/bison" && cp -a "bison-$BISON_VER" "$S/work/bison"
          # THE TOUCH LOOP THAT USED TO LIVE HERE IS GONE, AND IT IS WHY
          # bison FAILED IN THE RUN BEFORE THIS ONE. It stamped every file
          # matching a fixed list of names -- aclocal.m4, configure,
          # Makefile.in, config.h.in -- to the present. bison ships its gnulib
          # header template as lib/config.in.h, which matches NONE of those, so
          # aclocal.m4 jumped to now while lib/config.in.h kept its 2020 date,
          # and automake correctly concluded the template was stale:
          #   /work/bison/build-aux/missing: line 81: autoheader: not found
          #   make[2]: *** [Makefile:3555: lib/config.in.h] Error 127
          # A name list can never be complete, and every name it misses becomes
          # a file that is now older than its own dependencies. cp -a is the
          # actual fix: tar preserves upstream mtimes and -a preserves tar's,
          # so the tree looks exactly as it was shipped, which is a state that
          # builds everywhere. The safety net is now at the other end -- see
          # the autotools overrides on the bison make lines.
          echo "  sources staged with upstream timestamps intact"

          # libstdc++ pass 2, native, into /usr -- the book's chapter 7 recipe.
          # --host is the pass-2 gcc's own host triplet, not config.guess's
          # answer: gcc pass 2 was built --host=$LFS_TGT and libstdc++ must
          # match it or the headers land somewhere the driver does not search.
          S="$S" "$W/box10.sh" /bin/sh -c '
            set -e
            cd /work/gccsrc
            ln -sf gthr-posix.h libgcc/gthr-default.h
            mkdir -p /work/b-libstdcxx2 && cd /work/b-libstdcxx2
            /work/gccsrc/libstdc++-v3/configure \
              CXXFLAGS="-g -O2 -D_GNU_SOURCE" \
              --prefix=/usr --disable-multilib --disable-nls \
              --host='"$LFS_TGT"' --disable-libstdcxx-pch > c.log 2>&1 \
              || { echo "libstdc++ configure failed"; tail -12 c.log; exit 1; }
            # A Makefile OR NOTHING. This reported
            #   configure selected CXX: <undetermined>
            #   make: *** No targets specified and no makefile found.
            # i.e. configure returned 0 and left no Makefile, which is not a
            # state to run make in. Check for it and show what configure said.
            if [ ! -f Makefile ]; then
              echo "configure exited 0 but produced no Makefile"
              echo "--- configure tail ---"; tail -20 c.log
              exit 1
            fi
            # WHICH TOOLS DID configure ACTUALLY PICK? This check earned its
            # place on the run after it was added. --host names a triplet whose
            # tools existed TWICE while /tools/bin was on PATH: the pass-1 CROSS
            # tools there, host-linked and unable to run in the box, and the
            # pass-2 ones in /usr/bin. /usr/bin came first, so the COMPILERS
            # resolved correctly -- and `ar` did not, because binutils pass 2
            # installs plain names only, so $LFS_TGT-ar existed nowhere except
            # /tools/bin. Every object compiled and the archive step died on
            #   ...-ar: /lib/libc.so.6: version GLIBC_2.33 not found
            # /tools/bin is off PATH now (the book chroot never had it), so
            # autoconf falls back to plain `ar` as LFS intends. Keep printing
            # the selection: it is what turned that into one run instead of three.
            for v in CXX CC; do
              val=$(sed -n "s/^$v = //p" Makefile 2>/dev/null | head -1)
              echo "  configure selected $v: ${val:-<undetermined>}"
            done
            if ! make -j4 > b.log 2>&1; then
              # PREFER THE COMPILER DIAGNOSTIC OVER make SUMMARY LINES. The old
              # pattern was `grep -E "error:|Error [0-9]" | head -6`, and make
              # prints four "*** [target] Error 1" lines for every real error --
              # so head -6 filled with those and the actual cause never
              # appeared. Run 1 of this step reported nothing but Error 1.
              echo "  --- compiler diagnostics ---"
              grep -E "error:|Error:|undefined reference|cannot find|No such file" b.log \
                | grep -v "^make" | head -12
              echo "  --- make errors ---"
              grep -E "\*\*\* \[" b.log | head -4
              echo "  --- tail ---"
              tail -20 b.log
              exit 1
            fi
            make install > i.log 2>&1 || { tail -8 i.log; exit 1; }
            echo "libstdc++ pass 2 installed"
            # WHERE DID IT LAND, AND CAN THE LOADER SEE IT?
            # libstdc++-v3 installs into toolexeclibdir rather than libdir
            # whenever configure decides the build is a cross -- and it does
            # decide that here, because --host is aarch64-veron-linux-gnu while
            # config.guess inside the box answers aarch64-unknown-linux-gnu. So
            # the library goes to /usr/$LFS_TGT/lib, which the pass-2 gcc driver
            # searches at LINK time and the dynamic loader does not search at
            # RUN time:
            #   /work/tpp: error while loading shared libraries:
            #   libstdc++.so.6: cannot open shared object file
            # Step 5.6 reported the same fact and it was missed, because
            #   ls .../libstdc++.* | head -1 || echo MISSING
            # prints an empty line rather than MISSING.
            #
            # THE BOOK NEVER NOTICES, and that is not an oversight in it: every
            # remaining chapter 7 package -- gettext, bison, perl, Python,
            # texinfo, util-linux -- is C. We are the ones who have to RUN C++
            # in here, because gcc 15 and 16 compile and then EXECUTE their own
            # generator programs. A declared deviation, not a correction to LFS.
            #
            # BOTH MECHANISMS, UNCONDITIONALLY. ld.so.conf + ldconfig is the
            # standard one. The symlink into /lib is the one that cannot fail,
            # because /lib is demonstrably searched already -- every binary in
            # this box resolves libc.so.6 out of it. Applying only the standard
            # one and discovering it was not enough costs a whole run.
            echo "--- libstdc++.so.6 ---"
            find /usr /lib -name "libstdc++.so.6*" 2>/dev/null | sed "s|^|  |"
            LSO=$(find /usr /lib -name libstdc++.so.6 2>/dev/null | head -1)
            if [ -z "$LSO" ]; then
              echo "  NO libstdc++.so.6 ANYWHERE -- C++ cannot run in this box"
              exit 1
            fi
            LSDIR=$(dirname "$LSO")
            echo "  runtime dir: $LSDIR"
            { echo /lib; echo /usr/lib; echo "$LSDIR"; } | sort -u > /etc/ld.so.conf
            echo "  /etc/ld.so.conf:"; sed "s|^|    |" /etc/ld.so.conf
            if command -v ldconfig > /dev/null 2>&1; then
              ldconfig && echo "  ldconfig ok"
            else
              echo "  no ldconfig in this box -- relying on the symlinks below"
            fi
            if [ "$LSDIR" != /lib ]; then
              for so in "$LSDIR"/libstdc++.so*; do
                [ -e "$so" ] || continue
                case "$so" in *.py) continue ;; esac
                ln -sf "$so" /lib/ && echo "  linked $(basename "$so") -> /lib"
              done
            fi
            # C++ MUST RUN, NOT MERELY LINK, AND THE GATE BELONGS HERE RATHER
            # THAN IN THE LADDER. The ladder found this one step too late: the
            # binary existed, so the summary reported that the box compiles C++
            # while the loader could not start what it had just produced.
            echo "=== C++ gate ==="
            : > /work/cxxgate.cpp
            echo "#include <string>" >> /work/cxxgate.cpp
            echo "#include <vector>" >> /work/cxxgate.cpp
            echo "int main(){ std::vector<int> v{1,2,3}; int s=0; for(int x:v) s+=x;" >> /work/cxxgate.cpp
            echo "  std::string t(\"ok\"); return s + (int)t.size() + 34; }" >> /work/cxxgate.cpp
            g++ -o /work/cxxgate /work/cxxgate.cpp || { echo "  C++ COMPILE FAILED"; exit 1; }
            # rc=0 THEN `|| rc=$?`, NOT `cmd; rc=$?`. This payload runs under
            # set -e, and the gate program returns 42 ON SUCCESS -- so errexit
            # fired on the very value that means the test passed, killing the
            # step before the verdict could be printed:
            #   === C++ gate ===
            #   ##[error]Process completed with exit code 42.
            # A command whose status is being CAPTURED must sit in an OR list,
            # where POSIX says errexit is suppressed. C++ almost certainly
            # already works here; nothing had been able to say so.
            rc=0
            /work/cxxgate || rc=$?
            echo "  C++ ran: exit=$rc (expect 42)"
            if [ $rc -ne 42 ]; then
              echo "  C++ CANNOT RUN IN THIS BOX. gcc 15 and 16 compile and then"
              echo "  EXECUTE their own generator programs, so neither can work"
              echo "  from here. Not marking the sysroot complete."
              ldd /work/cxxgate 2>&1 | head -8
              exit 1
            fi
            echo "=== bison ==="
            cd /work/bison
            ./configure --prefix=/usr --docdir=/usr/share/doc/bison-'"$BISON_VER"' \
              > c.log 2>&1 || { tail -12 c.log; exit 1; }
            # PERL=true BECAUSE THIS BOX HAS NO perl AND bison POST-PROCESSES
            # ITS OWN DOCS WITH IT. The bison configure script does not fall
            # back to the `missing` wrapper for perl, it just leaves $(PERL)
            # EMPTY, so the first word of the recipe vanishes and the shell
            # tries to execute the flags instead:
            #   GEN      doc/bison.info.bak
            #   /bin/sh: -pi.bak: not found
            #   make: *** [Makefile:10389: doc/bison.info.bak] Error 127
            # -pi.bak is `perl -p -i.bak`. src/bison had already linked -- only
            # the documentation was left. `true` swallows the arguments and
            # returns 0, which is the correct outcome for a doc target in a
            # bootstrap box that ships no documentation. LFS installs perl at
            # 7.10, one section AFTER bison; if something later turns out to
            # need a real perl, that is the section to add, not this flag.
            # AUTOHEADER/AUTOCONF/AUTOMAKE/ACLOCAL=true IS THE SAFETY NET THAT
            # REPLACED THE TOUCH LOOP, and it is robust in the way the touch
            # loop was not: it does not need to know what any file is called.
            # If a maintainer rule fires at all, it now runs `true`, succeeds,
            # and the shipped file is used -- which is the correct outcome,
            # because nothing in this box has modified a configure.ac. A
            # command-line assignment overrides the
            #   AUTOHEADER = ${SHELL} .../missing autoheader
            # that automake writes into the Makefile, so `missing` is bypassed
            # rather than asked to apologise for a tool we do not want.
            AUTOTOOLS="AUTOHEADER=true AUTOCONF=true AUTOMAKE=true ACLOCAL=true"
            if ! make -j4 MAKEINFO=true PERL=true $AUTOTOOLS > b.log 2>&1; then
              # THE OLD PATTERN HID THE CAUSE. grep "error:|Error [0-9]" piped
              # into head -6 returned two make summary lines and nothing else,
              # so the run reported a bison failure with no reason attached.
              echo "  --- diagnostics ---"
              grep -nE "error:|fatal error|No such file|not found|command not found|is missing on your system" b.log \
                | grep -vE ":make(\[[0-9]+\])?:" | head -12
              echo "  --- make summary ---"
              grep -nE "[*][*][*] [[]" b.log | head -4
              echo "  --- tail ---"; tail -20 b.log
              exit 1
            fi
            make install MAKEINFO=true PERL=true $AUTOTOOLS > i.log 2>&1 \
              || { echo "  --- install tail ---"; tail -12 i.log; exit 1; }
            bison --version | head -1
            # THE ATTEMPTS RESOLVE bison BY PATH, NOT THROUGH THIS SHELL.
            # Assert the file the box will actually execute.
            [ -x /usr/bin/bison ] || { echo "  bison is NOT at /usr/bin/bison"; exit 1; }
            echo "bison at /usr/bin/bison"
          ' 2>&1 | sed 's/^/    /'
          # THE COMPLETION MARKER, AND IT BELONGS HERE, NOT AFTER gcc PASS 2.
          # Chapter 7 is the last thing the sysroot needs -- libstdc++ into
          # /usr and bison -- so a marker written before it would certify a
          # sysroot that cannot compile C++ or run a yacc grammar, which is
          # exactly the state two runs got stuck in.
          {
            echo "binutils $BINUTILS  gcc $GCCVER  glibc $GLIBC  linux $KERNEL"
            echo "chapters 5, 6 and 7 complete"
            echo "completed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$S/.sysroot-complete"
          echo "  sysroot marked complete"

      - name: 'THE LADDER: is the box self-sufficient?'
        continue-on-error: true
        run: |
          set -u
          set +e
          rung() {
            name=$1; shift
            out=$(S="$S" "$W/box10.sh" "$@" 2>&1); rc=$?
            case "$out" in *"not found"*|*"No such file"*|*"cannot execute"*) rc=127 ;; esac
            [ $rc -eq 0 ] && printf '  %-28s OK    %s\n' "$name" "$(printf '%s' "$out" | head -1 | cut -c1-46)" \
                          || printf '  %-28s FAIL  %s\n' "$name" "$(printf '%s' "$out" | head -1 | cut -c1-52)"
          }
          rung "1. shell"        /bin/sh -c 'echo alive'
          rung "2. coreutils"    /usr/bin/ls /
          rung "3. sed/grep/awk" /bin/sh -c 'echo x | sed s/x/y/ | grep -q y && echo ok'
          rung "4. make"         /usr/bin/make --version
          rung "5. as"           /usr/bin/as --version
          rung "6. ld"           /usr/bin/ld --version
          rung "7. gcc"          /usr/bin/gcc --version
          # ar AND ranlib WERE NOT ON THIS LADDER AND THEY ARE WHAT BROKE.
          # libstdc++ pass 2 compiled every object and then failed at the
          # archive step, because the ar being selected was a host-linked
          # cross binary that could not execute. A tool the build uses and
          # the ladder does not test is a tool whose failure arrives late.
          rung "7b. ar"          /usr/bin/ar --version
          rung "7c. ranlib"      /usr/bin/ranlib --version
          rung "8. m4"           /usr/bin/m4 --version
          rung "8b. bison"       /usr/bin/bison --version
          echo
          echo "  --- 9. compile and run C, entirely inside ---"
          mkdir -p "$S/work"
          printf 'int main(void){return 42;}\n' > "$S/work/t.c"
          S="$S" "$W/box10.sh" /usr/bin/gcc -o /work/t /work/t.c 2>&1 | head -6 | sed 's/^/    /'
          rm -f "$S/work/t.ran"
          if [ -x "$S/work/t" ]; then
            S="$S" "$W/box10.sh" /work/t; rc=$?
            echo "    ran: exit=$rc (expect 42)"
            [ "$rc" = 42 ] && : > "$S/work/t.ran"
          else
            echo "    no binary produced -- the attempts below cannot work"
          fi
          echo
          echo "  --- 10. compile and run C++, entirely inside ---"
          # RUN 1 HAD NO RUNG FOR THIS AND PAID FOR IT. The ladder proved the
          # box could compile C, then both gcc attempts died 40 minutes later on
          #   libcody/cody.hh:24: fatal error: memory: No such file or directory
          # A C++ standard header. The cheapest possible check sat one line away
          # from the C rung and was not written, so a missing libstdc++ was
          # reported by gcc's build system instead of by the ladder.
          {
            echo '#include <memory>'
            echo '#include <string>'
            echo '#include <vector>'
            echo 'int main(){ auto p = std::make_shared<std::string>("ok");'
            echo '  std::vector<int> v{1,2,3}; int s=0; for(int x:v) s+=x;'
            echo '  return s + (int)p->size() + 34; }'
          } > "$S/work/t.cpp"
          S="$S" "$W/box10.sh" /usr/bin/g++ -o /work/tpp /work/t.cpp 2>&1 | head -8 | sed 's/^/    /'
          rm -f "$S/work/tpp.ran"
          if [ -x "$S/work/tpp" ]; then
            S="$S" "$W/box10.sh" /work/tpp; rc=$?
            echo "    ran: exit=$rc (expect 42)"
            [ "$rc" = 42 ] && : > "$S/work/tpp.ran"
          else
            echo "    NO C++ BINARY -- gcc 15/16 cannot be built from this box."
            echo "    Every modern gcc contains C++ sources; this is the rung"
            echo "    that decides whether the attempts below are worth running."
          fi

      - name: 'Stage gcc ${{ env.GCC15 }} and gcc ${{ env.GCC16 }} into the box'
        run: |
          set -eu
          # Fetched OUTSIDE and copied in: the box has no network, deliberately.
          for v in "$GCC15" "$GCC16"; do
            case "$v" in
              "$GCC15") [ "${{ github.event.inputs.try_gcc15 }}" = "no" ] && continue ;;
              "$GCC16") [ "${{ github.event.inputs.try_gcc16 }}" = "no" ] && continue ;;
            esac
            echo "  gcc-$v"
            curl -fsSL --http1.1 --retry 3 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 900 -O "$GNU/gcc/gcc-$v/gcc-$v.tar.xz" \
              || { echo "    FETCH FAILED for gcc-$v -- attempt skipped, not failed"; continue; }
            rm -rf "src-$v" && mkdir -p "src-$v"
            tar xf "gcc-$v.tar.xz" -C "src-$v" --strip-components=1
            ( cd "src-$v"
              tar xf "$W/gmp-$GMP_VER.tar.xz"   && mv "gmp-$GMP_VER" gmp
              tar xf "$W/mpfr-$MPFR_VER.tar.xz" && mv "mpfr-$MPFR_VER" mpfr
              tar xf "$W/mpc-$MPC_VER.tar.gz"   && mv "mpc-$MPC_VER" mpc )
            # cp -a, FOR THE SAME REASON AS CHAPTER 7. These trees carry gmp,
            # mpfr and mpc unpacked in-tree, each a full autotools package, so
            # `cp -r` would expose them to exactly the maintainer-mode
            # regeneration that killed bison -- and there is no autoconf in the
            # box to satisfy it. tar preserves upstream mtimes and -a preserves
            # tar's, so nothing here looks stale to make. No timestamp fixups:
            # the ones that used to sit in chapter 7 caused a failure of their
            # own by stamping some generated files and not others.
            rm -rf "$S/work/src-$v" && cp -a "src-$v" "$S/work/"
          done
          echo "  staged: $(ls "$S/work" | tr '\n' ' ')"

      - name: 'ATTEMPT 1: gcc 10 builds gcc ${{ env.GCC15 }}'
        if: ${{ success() && github.event.inputs.try_gcc15 != 'no' }}
        continue-on-error: true
        run: |
          set -u
          set +e
          # gcc 15 requires an ISO C++11 compiler; gcc 10.2 provides C++14, so
          # the LANGUAGE side is not in question. What this measures is whether
          # a 2014-era-adjacent sysroot -- glibc 2.32, binutils 2.35 -- carries
          # a 2025 libstdc++ and a 2025 build system. If it fails, the failure
          # is expected to be the LIBC or binutils, not the compiler, and the
          # log should say which.
          if [ "${{ github.event.inputs.bootstrap }}" = "yes" ]; then
            BOOTFLAG=""; BOOTTGT="bootstrap"
          else
            BOOTFLAG="--disable-bootstrap"; BOOTTGT="all"
          fi
          echo "  MODE: $BOOTTGT"
          S="$S" BOOTFLAG="$BOOTFLAG" BOOTTGT="$BOOTTGT" "$W/box10.sh" /bin/sh -c '
            set -u
            V='"$GCC15"'; B=/work/b15; O=/work/out15
            echo "builder cc : $(gcc --version | head -1)"
            echo "builder c++: $(g++ --version | head -1)"
            echo "builder as : $(as --version | head -1)"
            mkdir -p $B && cd $B
            # --disable-nls IS NOT DECORATION. Every other configure in this
            # file passes it; these two did not. This box installs libstdc++
            # and bison out of LFS chapter 7 and nothing else -- no gettext,
            # no perl, no texinfo -- so an enabled NLS looks for msgfmt and
            # gets "command not found", which is the same Error 127 shape as
            # the gmp/demos/calc failure chapter 7 already exists to fix.
            /work/src-$V/configure --prefix=$O \
              --enable-languages=c,c++ --disable-multilib $BOOTFLAG \
              --disable-nls \
              --disable-libsanitizer --disable-libvtv --disable-libgomp \
              --disable-libquadmath --disable-werror > c.log 2>&1
            rc=$?
            echo "configure rc=$rc"
            if [ $rc -ne 0 ]; then
              # STOP HERE. Running make on a tree configure rejected produces a
              # second, unrelated failure and buries the first.
              echo "--- configure said ---"
              grep -nE "configure: error|error:|command not found|No such file" c.log | head -12
              echo "--- config.log tail ---"
              tail -25 config.log 2>/dev/null
              echo "--- c.log tail ---"
              tail -15 c.log
              exit 1
            fi
            make -j4 MAKEINFO=true $BOOTTGT > b.log 2>&1
            rc=$?
            echo "make ($BOOTTGT) rc=$rc"
            if [ "$BOOTTGT" = bootstrap ]; then
              grep -E "Comparing stages|Comparison successful|differ" b.log | tail -5
            fi
            if [ $rc -ne 0 ]; then
              # COMPILER DIAGNOSTICS BEFORE make SUMMARY LINES. make prints
              # several "*** [target] Error 1" per real failure, so a head
              # limit on a combined grep fills with those and the actual
              # error: never appears.
              echo "--- diagnostics ---"
              grep -nE "internal compiler error|error:|fatal error|undefined reference|cannot find|No such file|not found|Error 127|is missing on your system" b.log \
                | grep -vE ":make(\[[0-9]+\])?:" | head -15
              echo "--- make summary ---"
              grep -nE "[*][*][*] [[]" b.log | head -4
              echo "--- last directory entered ---"
              grep -n "Entering directory" b.log | tail -3
              echo "--- tail ---"
              tail -20 b.log
              exit 1
            fi
            make install > i.log 2>&1; echo "install rc=$?"
            $O/bin/gcc --version 2>&1 | head -1
            # DOES THE COMPILER WE JUST BUILT ACTUALLY WORK? Installing is not
            # running. One C program, compiled and executed inside the box.
            echo "--- smoke test ---"
            printf "int main(void){return 42;}\n" > $B/smoke.c
            if $O/bin/gcc -o $B/smoke $B/smoke.c 2> $B/smoke.err; then
              $B/smoke; echo "  smoke: exit=$? (expect 42)"
            else
              echo "  smoke: COMPILE FAILED"; head -10 $B/smoke.err
            fi
          ' 2>&1 | sed 's/^/    /'

      - name: 'ATTEMPT 2: gcc 10 builds gcc ${{ env.GCC16 }}'
        if: ${{ success() && github.event.inputs.try_gcc16 != 'no' }}
        continue-on-error: true
        run: |
          set -u
          set +e
          # RUN THIS EVEN IF ATTEMPT 1 FAILED. The two are independent
          # questions and the interesting answer is the one where they differ:
          # 15.2 landing and 16.1 not would mean the stable branch of the chain
          # works and the bleeding one needs a newer sysroot under it, which is
          # a decision, not a bug. Reporting only the first would hide that.
          if [ "${{ github.event.inputs.bootstrap }}" = "yes" ]; then
            BOOTFLAG=""; BOOTTGT="bootstrap"
          else
            BOOTFLAG="--disable-bootstrap"; BOOTTGT="all"
          fi
          echo "  MODE: $BOOTTGT"
          S="$S" BOOTFLAG="$BOOTFLAG" BOOTTGT="$BOOTTGT" "$W/box10.sh" /bin/sh -c '
            set -u
            V='"$GCC16"'; B=/work/b16; O=/work/out16
            echo "builder cc : $(gcc --version | head -1)"
            echo "builder c++: $(g++ --version | head -1)"
            echo "builder as : $(as --version | head -1)"
            mkdir -p $B && cd $B
            # --disable-nls IS NOT DECORATION. Every other configure in this
            # file passes it; these two did not. This box installs libstdc++
            # and bison out of LFS chapter 7 and nothing else -- no gettext,
            # no perl, no texinfo -- so an enabled NLS looks for msgfmt and
            # gets "command not found", which is the same Error 127 shape as
            # the gmp/demos/calc failure chapter 7 already exists to fix.
            /work/src-$V/configure --prefix=$O \
              --enable-languages=c,c++ --disable-multilib $BOOTFLAG \
              --disable-nls \
              --disable-libsanitizer --disable-libvtv --disable-libgomp \
              --disable-libquadmath --disable-werror > c.log 2>&1
            rc=$?
            echo "configure rc=$rc"
            if [ $rc -ne 0 ]; then
              # STOP HERE. Running make on a tree configure rejected produces a
              # second, unrelated failure and buries the first.
              echo "--- configure said ---"
              grep -nE "configure: error|error:|command not found|No such file" c.log | head -12
              echo "--- config.log tail ---"
              tail -25 config.log 2>/dev/null
              echo "--- c.log tail ---"
              tail -15 c.log
              exit 1
            fi
            make -j4 MAKEINFO=true $BOOTTGT > b.log 2>&1
            rc=$?
            echo "make ($BOOTTGT) rc=$rc"
            if [ "$BOOTTGT" = bootstrap ]; then
              grep -E "Comparing stages|Comparison successful|differ" b.log | tail -5
            fi
            if [ $rc -ne 0 ]; then
              # COMPILER DIAGNOSTICS BEFORE make SUMMARY LINES. make prints
              # several "*** [target] Error 1" per real failure, so a head
              # limit on a combined grep fills with those and the actual
              # error: never appears.
              echo "--- diagnostics ---"
              grep -nE "internal compiler error|error:|fatal error|undefined reference|cannot find|No such file|not found|Error 127|is missing on your system" b.log \
                | grep -vE ":make(\[[0-9]+\])?:" | head -15
              echo "--- make summary ---"
              grep -nE "[*][*][*] [[]" b.log | head -4
              echo "--- last directory entered ---"
              grep -n "Entering directory" b.log | tail -3
              echo "--- tail ---"
              tail -20 b.log
              exit 1
            fi
            make install > i.log 2>&1; echo "install rc=$?"
            $O/bin/gcc --version 2>&1 | head -1
            # DOES THE COMPILER WE JUST BUILT ACTUALLY WORK? Installing is not
            # running. One C program, compiled and executed inside the box.
            echo "--- smoke test ---"
            printf "int main(void){return 42;}\n" > $B/smoke.c
            if $O/bin/gcc -o $B/smoke $B/smoke.c 2> $B/smoke.err; then
              $B/smoke; echo "  smoke: exit=$? (expect 42)"
            else
              echo "  smoke: COMPILE FAILED"; head -10 $B/smoke.err
            fi
          ' 2>&1 | sed 's/^/    /'

      - name: 'RUNG 2 SUMMARY'
        if: always()
        run: |
          set -u
          set +e
          # A SUMMARY MUST NOT REPORT A RESULT THAT WAS NEVER MEASURED.
          # Run 1 died in the FETCH step -- before a single thing was built --
          # and this table printed:
          #
          #     box compiles and runs          no
          #     gcc 15.2.0 built               no
          #     gcc 16.1.0 built               no
          #
          # Three confident negatives about experiments that never started. It
          # reads as "gcc 10 cannot build gcc 15", which is not what happened
          # and is not known either way. Same defect this repo has already paid
          # for twice: a check that cannot distinguish absence from failure.
          #
          # The discriminator is whether the INPUT to each step is present. If
          # the source was never staged, the attempt never ran.
          state() {   # $1 = input path, $2 = output path
            if   [ -e "$2" ]; then echo "yes"
            elif [ -e "$1" ]; then echo "FAILED       (it ran and did not finish)"
            else                   echo "NOT REACHED  (never started)"
            fi
          }
          echo "  environment   LFS 10.0 -- binutils $BINUTILS, glibc $GLIBC, linux $KERNEL"
          echo "  compiler      gcc $GCCVER, cross-built, running inside the box"
          echo
          printf '  %-26s %s\n' "sysroot built" \
            "$(state "$W/b-gcc2" "$S/usr/bin/gcc")"
          printf '  %-26s %s\n' "box compiles+runs C" \
            "$(state "$S/work/t.c" "$S/work/t.ran")"
          # C++ IS THE RUNG THAT DECIDES. Run 2 reported "box compiles and runs
          # yes" from the C rung while C++ was broken, which reads as a working
          # box next to two failed attempts -- when in fact the attempts could
          # not have worked and the box was the reason.
          printf '  %-26s %s\n' "box runs C++     <- decides" \
            "$(state "$S/work/t.cpp" "$S/work/tpp.ran")"
          printf '  %-26s %s\n' "gcc $GCC15 built" \
            "$(state "$S/work/src-$GCC15" "$S/work/out15/bin/gcc")"
          printf '  %-26s %s\n' "gcc $GCC16 built" \
            "$(state "$S/work/src-$GCC16" "$S/work/out16/bin/gcc")"
          echo
          echo "  Below this rung: hermetic-gcc47 shows OUR gcc 4.7 reaching"
          echo "  gcc 10 -- this box starts from a host-built cross toolchain"
          echo "  on purpose, so a failure here is gcc 10's and not 4.7's."
          echo
          echo "  Above it: hermetic-gcc15 and hermetic-gcc16 take those"
          echo "  compilers on to a kernel and a QEMU boot. No kernel is built"
          echo "  in this box."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermetic-gcc10-logs
          path: |
            box10.sh
            b-*/c.log
            b-*/b.log
            b-*/i.log
            b-*/config.log
            m4-*/c.log
            m4-*/b.log
            m4-*/i.log
            busybox-*/b.log
            sysroot/.sysroot-complete
            sysroot/etc/ld.so.conf
            sysroot/work/b-libstdcxx2/c.log
            sysroot/work/b-libstdcxx2/b.log
            sysroot/work/b-libstdcxx2/i.log
            sysroot/work/bison/c.log
            sysroot/work/bison/b.log
            sysroot/work/bison/i.log
            sysroot/work/b15/c.log
            sysroot/work/b15/b.log
            sysroot/work/b15/i.log
            sysroot/work/b15/config.log
            sysroot/work/b16/c.log
            sysroot/work/b16/b.log
            sysroot/work/b16/i.log
            sysroot/work/b16/config.log
          if-no-files-found: warn

      # ---------------------------------------------------------------- chain
      # THE HAND-OFF, SAID OUT LOUD. hermetic-gcc10 already notes that "prefix is
      # how two workflows quietly hand each other a sysroot" -- this is the same
      # hand-off with the quiet taken out. The tree gets a content hash, the hash
      # becomes a workflow output, and stage4-complete asserts that what the next
      # rung consumed is what this rung produced. Standalone runs just print it.
      - name: 'Seal this rung for the chain'
        id: chain_seal
        if: always()
        run: |
          set -eu
          T=sysroot
          if [ -d "$T" ]; then
            H=$(sh spikes/stage4/chain/seal.sh hash "$T")
          else
            H=none
            echo "  no $T -- this run produced nothing to hand on"
          fi
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "  rung2 sealed: $H"
