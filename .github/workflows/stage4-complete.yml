name: stage4-complete

# ============================================================================
# THE LADDER, ASSEMBLED FROM THE FOUR BOXES THAT ALREADY PROVE IT
# ============================================================================
#
# This workflow builds nothing and chains nothing. It runs the four boxes and
# checks that they describe one ladder.
#
#   tcc-builds-gcc-arm64   tcc -> 4.7.4 -> 4.7.4 -> 10.2.0
#   hermetic-gcc10         a gcc 10 box reaches 15.2.0 AND 16.1.0
#   hermetic-gcc15         gcc 15.2.0 -> kernel 7.1.5 -> boots
#   hermetic-gcc16         gcc 16.1.0 -> -rc kernel   -> boots
#
# WHY THEY RUN IN PARALLEL AND NOT IN SEQUENCE
#
#   Because they are independent BY DESIGN, and each one says so:
#
#     hermetic-gcc10  "This box starts from a host-built cross toolchain,
#                      DELIBERATELY, so that a failure here is gcc 10's and
#                      not 4.7's."
#     hermetic-gcc15  "starts from a host-built cross toolchain ON PURPOSE,
#                      so a failure here is the SYSTEM's and not the ladder's."
#     gcc15 and gcc16 "this box never triggers another and no other box
#                      triggers it."
#
#   An earlier revision of this file wired them with `needs:` into a pipeline.
#   That was wrong twice over. It proved nothing new -- none of them CONSUMES
#   the one before it, so ordering changes nothing about what gets built -- and
#   it destroyed the property they were built for: with `needs:`, a failure in
#   tcc-builds skips hermetic-gcc10, and the answer to "can gcc 10 reach 15?"
#   is lost to a failure that had nothing to do with it. Four independent
#   answers are worth more than one fragile chain.
#
# SO WHAT IS ACTUALLY COMPOSED HERE
#
#   Each box names the compiler it starts from and the compiler it reaches, in
#   its own env: block, under its own variable name. Nothing compared them. If
#   hermetic-gcc10 is bumped to reach gcc 15.3 while hermetic-gcc15 still
#   builds 15.2, both boxes stay green forever and the ladder has a gap in the
#   middle that no run reports: the rung proven REACHABLE is not the rung
#   proven to BOOT.
#
#   `links` checks exactly that, in about a second, and runs FIRST -- before
#   four multi-hour jobs rather than after them.
#
# WHAT THIS STILL DOES NOT PROVE, SAID PLAINLY
#
#   That the artifacts flow. Every box builds its own base with the host gcc,
#   so this establishes that the four rungs line up by VERSION, not that
#   hermetic-gcc15 ever compiled with the gcc 10 that tcc produced. Closing
#   that needs a chain-mode input on each box -- "start from this sysroot
#   instead of building your own base" -- kept alongside the default so the
#   boxes stay independently informative. That is a real change inside four
#   large files and it is deliberately not in this revision.
#
#   The ledger below says "line up", not "descend from". That is what it is.

on:
  push:
    paths:
      - '.github/workflows/stage4-complete.yml'
      - 'spikes/stage4/chain/links.py'
  workflow_dispatch:

concurrency:
  group: stage4-complete-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------- seconds
  links:
    name: 'do the four boxes describe one ladder?'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: python3 spikes/stage4/chain/links.py

  # ------------------------------------------- four questions, four answers
  # `needs: links` only. NOT needs: each other. A red box here costs its own
  # answer and no one else's.
  tcc-to-gcc10:
    name: 'tcc -> 4.7.4 -> 10.2.0'
    needs: links
    uses: ./.github/workflows/tcc-builds-gcc-arm64.yml

  gcc10-reaches-15-and-16:
    name: 'gcc 10 -> 15.2.0 and 16.1.0'
    needs: links
    uses: ./.github/workflows/hermetic-gcc10.yml

  gcc15-boots:
    name: 'gcc 15.2.0 -> kernel -> boot'
    needs: links
    uses: ./.github/workflows/hermetic-gcc15.yml

  gcc16-boots:
    name: 'gcc 16.1.0 -> kernel -> boot'
    needs: links
    uses: ./.github/workflows/hermetic-gcc16.yml

  # ---------------------------------------------------------------- ledger
  ledger:
    name: 'ledger'
    needs: [links, tcc-to-gcc10, gcc10-reaches-15-and-16, gcc15-boots, gcc16-boots]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: 'RESULT'
        run: |
          set -eu
          # NO UNCONDITIONAL BANNER. Run 81901874247 printed "HERMETIC and
          # PROVEN ... BOOTS" eight seconds into a run whose only achievement
          # was failing to install apt. Every line below is read from the boxes.
          echo "=========================================="
          echo "STAGE 4 -- THE LADDER"
          echo "=========================================="
          echo
          fail=0
          row() {
            printf '  %-32s %-9s %s\n' "$1" "$2" "${3:-<none>}"
            [ "$2" = success ] || fail=1
          }
          row 'version links'              '${{ needs.links.result }}'                   '-'
          row 'tcc -> 4.7.4 -> 10.2.0'     '${{ needs.tcc-to-gcc10.result }}'            '${{ needs.tcc-to-gcc10.outputs.sysroot_hash }}'
          row 'gcc 10 -> 15.2.0 + 16.1.0'  '${{ needs.gcc10-reaches-15-and-16.result }}' '${{ needs.gcc10-reaches-15-and-16.outputs.sysroot_hash }}'
          row 'gcc 15.2.0 -> boot'         '${{ needs.gcc15-boots.result }}'             '${{ needs.gcc15-boots.outputs.sysroot_hash }}'
          row 'gcc 16.1.0 -> boot'         '${{ needs.gcc16-boots.result }}'             '${{ needs.gcc16-boots.outputs.sysroot_hash }}'
          echo
          if [ "$fail" -ne 0 ]; then
            echo "  THE LADDER IS INCOMPLETE -- read the red box above."
            echo "  Each box answers one question; a red one costs that answer only."
            exit 1
          fi
          echo "  All four rungs green in one run, and their pinned versions meet:"
          echo "    tcc's gcc 10.2.0 is the 10.2.0 that reaches 15.2.0 and 16.1.0"
          echo "    the 15.2.0 gcc 10 reaches is the 15.2.0 that boots"
          echo "    the 16.1.0 gcc 10 reaches is the 16.1.0 that boots"
          echo
          echo "  LINE UP -- not descend from. Each box builds its own base with"
          echo "  the host gcc, so no artifact has yet flowed between them. See"
          echo "  this file's header for what closing that requires."
          echo "=========================================="
