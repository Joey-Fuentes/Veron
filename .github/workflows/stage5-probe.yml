name: stage5-probe

# FIND OUT WHAT A PACKAGE IS, instead of guessing.
#
# A recipe needs a version, a digest, a build system, a license, a test target
# and a dependency list. Every one is a FACT about the tarball, and every one
# is something an author is tempted to supply from memory. A digest from
# memory is laundered provenance; a dependency list from memory is a build
# failure three packages later.
#
# THIS DOES NOT WRITE RECIPES. The skeleton it prints is deliberately
# incomplete: which optional feature to disable is a policy decision about the
# system being built, not a property of the tarball. The probe lists what
# COULD be turned off and leaves the choosing to a person.
#
# AIRLOCK ONLY. Network lives here, nothing it emits enters a build unread.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Tarball URLs to probe (space-separated)'
        required: false
        default: ''
        # zlib, bzip2, xz and zstd are not GNU projects, so the `latest`
        # lookup above cannot find them from a GNU index. zstd and zlib have
        # GitHub releases; bzip2 (sourceware) and xz (tukaani) publish
        # elsewhere and their URLs go here directly.
      index:
        description: 'name=dir-URL pairs for non-GNU, non-GitHub projects'
        required: false
        default: >-
          mesa=https://archive.mesa3d.org/
          libdrm=https://dri.freedesktop.org/libdrm/
          libevdev=https://www.freedesktop.org/software/libevdev/
          iproute2=https://www.kernel.org/pub/linux/utils/net/iproute2/
          mtdev=http://bitmath.org/code/mtdev/
      latest:
        description: 'gnu: / codeberg: / gitlab: / fdo: / bare owner-repo for GitHub'
        required: false
        default: >-
          codeberg:dnkl/foot codeberg:dnkl/fcft codeberg:dnkl/tllist
          codeberg:dnkl/fuzzel codeberg:dnkl/yambar
          labwc/labwc swaywm/swaybg jarun/nnn davmac314/dinit
          NetworkConfiguration/dhcpcd dosfstools/dosfstools
          dejavu-fonts/dejavu-fonts
          fdo:libinput/libinput fdo:libevdev/libevdev fdo:wayland/wayland

concurrency:
  group: stage5-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 'What is the newest release?'
        if: inputs.latest != ''
        run: |
          set -eu
          cd spikes/stage5
          python3 tools/probe.py latest ${{ inputs.latest }} | tee /tmp/latest.txt

      - name: 'Newest tarball in a plain directory listing'
        if: inputs.index != ''
        run: |
          set -eu
          cd spikes/stage5
          for spec in ${{ inputs.index }}; do
            name="${spec%%=*}"; url="${spec#*=}"
            python3 tools/probe.py index "$url" --name "$name"
          done | tee /tmp/index.txt

      - name: 'Probe each tarball'
        if: inputs.urls != ''
        run: |
          set -eu
          cd spikes/stage5
          python3 tools/probe.py url ${{ inputs.urls }} | tee /tmp/probe.txt

      - name: 'What this does and does not settle'
        if: always()
        run: |
          echo "  SETTLED by this run: version, sha256, whether a signature"
          echo "    exists, build system, license, whether a check target"
          echo "    exists, and which optional features the package offers."
          echo ""
          echo "  NOT SETTLED, and deliberately left to a person:"
          echo "    - WHICH options to disable. Every --disable is a policy"
          echo "      decision about the system being built."
          echo "    - The REAL dependency list. Static inspection sees what"
          echo "      the build system asks for; it cannot tell a hard"
          echo "      requirement from one that silently detected off. Run"
          echo "      'probe linked <destdir>' after a build for that."
          echo "    - Whether the SIGNATURE is good. The probe names the key"
          echo "      that signed the tarball; it deliberately does not import"
          echo "      that key, because a key fetched alongside the artifact it"
          echo "      signs proves nothing. Compare the id against the"
          echo "      project's published fingerprint, then verify locally."
          echo "    - Whether the digest is TRUSTWORTHY. Independent packagers"
          echo "      are reported as corroboration; agreement is evidence, not"
          echo "      proof, and a version match is weaker than a digest match."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-probe
          path: |
            /tmp/latest.txt
            /tmp/probe.txt
            /tmp/index.txt
          retention-days: 30
