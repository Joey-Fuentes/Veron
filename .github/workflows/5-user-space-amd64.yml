name: 5-user-space-amd64
# THE OFFICIAL STAGE 5 (x86_64 leg), Option A: the stage-5 spike VERBATIM --
# same package plan, same VERON gates, same image build and boot -- with the
# three state surfaces renamed so this workflow and the live spike can never
# touch each other's world (the spike's own rule: a shared tag would let one
# arm destroy the other's working release):
#     input       4/latest-x86_64  ->  4/latest-x86_64   (seed-true stage 4:
#                 ref-tcc there is tcc-amd64 from the 3->4 contract, not host gcc)
#     checkpoint  5/ckpt-x86_64    ->  5/ckpt-x86_64     (fresh; the spike's
#                 checkpoint is NEVER read or written by this workflow)
#     image       5/latest-x86_64  ->  5/latest-x86_64
# The spike workflow and its checkpoint remain untouched, per design 7.0.

# STAGE 5 ON x86_64. A COPY OF stage5-spike.yml, NOT A MATRIX OVER IT.
#
# WHY A COPY. stage4-arch-spike-amd64 and -riscv64 are copies of the stage-4
# reference for a stated reason -- "so a failure on one architecture cannot
# make the working arm answerable for it" -- and that reason applies here with
# more force, not less. stage5-spike is the workflow that currently produces
# the published image: 122 packages, a byte-identical rebuild, a boot, a
# desktop screenshot and a two-VM DHCP test. Turning it into a matrix would
# put every one of those results behind a job that has never run, and a red X
# on `stage5-spike (amd64)` would read as a stage-5 regression when it is an
# architecture that was never ported.
#
# WHAT IS SHARED, AND IT IS ALMOST EVERYTHING. The recipes, the driver, the
# policy, the guest init and the initramfs builder are the SAME FILES,
# unmodified. Only this workflow differs, and only in the places listed below.
# A second copy of the driver would drift and the comparison would stop
# meaning anything -- the same argument stage 4's two arms make about
# rungs.sh.
#
# WHAT DIFFERS FROM THE aarch64 ARM, EXHAUSTIVELY:
#
#   1. runs-on: ubuntu-24.04 rather than ubuntu-24.04-arm.
#   2. qemu-system-x86 rather than qemu-system-arm.
#   3. The sysroot comes from 4/latest-x86_64, published by
#      stage4-arch-spike-amd64. The aarch64 tag is stage4/latest and is
#      untouched by this file.
#   4. THE KERNEL COMES OUT OF THAT SAME RELEASE rather than out of another
#      workflow's artifact -- see the download step.
#   5. qemu-system-x86_64, no -M, no -cpu, console=ttyS0.
#   6. The checkpoint tag is 5/ckpt-x86_64 and the image tag is
#      5/latest-x86_64. Both are separate from the aarch64 tags, and that
#      separation is the point rather than a naming convenience: this arm
#      publishes with --clobber and a shared tag would let a first run on a
#      new architecture destroy the working release.
#   7. VERON-INSTALLS runs in --mode warn, not --mode fail. The reason is in
#      the step and it is not a lowered standard -- the digests it compares
#      against were measured on aarch64 and CANNOT match here.
#   8. Every artifact name carries -amd64.
#
# THIS HAS NEVER RUN. It is written from reading, not from a green run, and
# spikes/stage5/AMD64.md names the failures expected of the first dispatch in
# plan order with the reason for each. A workflow whose first failures are
# predicted in writing is a measurement; one whose first failures are a
# surprise is a guess. Correct that file from what the run actually says.
#
# NO BUILD LOGIC IN THIS FILE. Every `run:` is environment setup or a call to
# spikes/stage5/tools/veron. If build logic reappears here, that is the
# regression -- DERIVATIONS.md Decision 3.

on:
  workflow_dispatch:
    inputs:
      skip_boot:
        description: 'Build and test, but do not boot'
        type: boolean
        required: false
        default: false
      adopt_checkpoint:
        description: 'adopt_checkpoint -- reuse a checkpoint built against a DIFFERENT sysroot, rewriting its base to this run''s. Weakens a correctness guard: only for a sysroot known to differ in ways that cannot reach the packages. Read the step comment before using.'
        type: boolean
        required: false
        default: false
      use_checkpoint:
        description: 'use_checkpoint -- restore a prior build checkpoint instead of building everything. NEVER for a reproducibility claim'
        type: boolean
        required: false
        default: false
      save_checkpoint:
        description: 'save_checkpoint -- publish dest/ as a checkpoint for later runs'
        type: boolean
        required: false
        default: false
      stop_after:
        description: 'stop_after -- build the plan up to and including this package, then stop. Banks a checkpoint on an arch that cannot finish yet. Publishes NOTHING: no image, no boot, no release.'
        type: string
        required: false
        default: ''
      relay:
        description: 'relay -- non-empty enables self-relaying rounds: banked-but-unfinished re-dispatches with use_checkpoint=true until a round publishes. Dispatch with "true"; the loop passes its own depth here (GitHub caps inputs at 10, so one input carries both). Progress-guarded, depth-capped at 8.'
        type: string
        required: false
        default: ''
      boot_system:
        description: 'boot_system -- switch_root into dinit instead of running the test harness'
        type: boolean
        default: false
      net_test:
        description: 'net_test -- boot TWO instances on a private L2 segment and prove DHCP end to end'
        type: boolean
        default: true
      seed_installs:
        description: 'seed_installs -- write [installs] blocks and installs.txt from this build, and upload them'
        type: boolean
        required: false
        default: false
      selfrebuild:
        description: 'Rebuild the packages INSIDE the guest (slow: ~12 min for two)'
        type: boolean
        required: false
        default: false

concurrency:
  # ITS OWN GROUP, BECAUSE THIS SHARES NOTHING WITH THE SPIKE.
  #
  # This workflow was adopted from spikes/stage5 verbatim, and it kept the
  # spike's concurrency group with everything else. GitHub then treated the
  # two as one resource: dispatching stage5-spike-amd64 while this was running
  # showed "waiting for 5-user-space-amd64 #1 to complete", and the spike sat
  # queued behind an unrelated build.
  #
  # NOTHING IS ACTUALLY SHARED. The spike publishes ckpt/latest-amd64 and
  # stage5/latest-amd64; this publishes 5/ckpt-x86_64 and 5/latest-x86_64.
  # Separate checkpoints, separate images, separate release tags -- the
  # adoption note says so in as many words. The only thing they had in common
  # was this string.
  #
  # AND THEY MUST RUN TOGETHER, not merely be allowed to. The spike is the
  # oracle: byte-identical output between the two is the acceptance test for
  # the adoption, and a comparison whose halves cannot run at the same time is
  # a comparison nobody will make.
  group: 5-user-space-amd64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # contents: write ONLY BECAUSE THE CHECKPOINT IS PUBLISHED TO RELEASES.
  #
  # This job spent 48 packages of build time and then died with
  #     HTTP 403: Resource not accessible by integration (.../releases)
  # because `gh release create` writes to the repository and this workflow was
  # read-only. Same shape as the git-pinned mirror step missing GH_TOKEN: a
  # step that writes was added to a job that could not.
  #
  # THE ESCALATION IS REAL AND WORTH NAMING. GitHub scopes permissions per
  # JOB, not per step, so every step in the spike now runs with write access
  # to this repository -- including the ones that execute upstream build
  # systems. The sandbox is what contains those: the build runs under bwrap
  # with --unshare-all and no network, and the token is not in its
  # environment. That containment is the reason this is acceptable rather than
  # the permission being small.
  #
  # Checkpoints are a CACHE and never evidence, so nothing signed or attested
  # depends on this write; the worst a compromised step could do here is
  # publish a bad cache, which the prefix key and the ledger's attestations=0
  # both already account for.
  contents: write
  actions: write  # raised from read: the relay re-dispatches this workflow
  # ATTESTATION, THE SAME TWO GRANTS STAGES 1-3 CARRY. id-token lets Fulcio
  # bind the workflow identity; attestations lets the signed statement reach
  # the GH attestations API. The build itself runs under bwrap with
  # --unshare-all and no network, so neither grant is reachable from inside
  # a package build -- the same containment argument contents: write makes.
  id-token: write
  attestations: write

jobs:
  spike:
    env:
      # ONE PLACE DECIDES WHAT A PARTIAL RUN IS ALLOWED TO DO.
      #
      # Every step below that builds, boots or publishes a SYSTEM is gated on
      # this rather than on `inputs.stop_after` directly. The alternative --
      # repeating `inputs.stop_after == ''` in fourteen conditions -- is how
      # one of them ends up missing it, and the one that would be missed is
      # whichever publishes, because it is last.
      PARTIAL: ${{ inputs.stop_after != '' && 'yes' || 'no' }}
    runs-on: ubuntu-24.04          # NATIVE x86_64 -- the sysroot IS x86_64,
                                   # so packages build AND RUN unemulated,
                                   # exactly as the aarch64 arm does on its
                                   # own runner. Neither arm emulates to
                                   # build; only the qemu VERIFICATION at the
                                   # end runs under TCG.
    # THE JOB MUST OUTLIVE THE BUILD, OR THE COLLECTOR NEVER RUNS.
    #
    # A JOB timeout is a CANCELLATION: GitHub stops the job and `if: always()`
    # steps do not run. So the diagnostics work added below would be defeated
    # by the one failure mode it exists to prevent -- a long build running out
    # of clock and taking its own evidence with it.
    #
    # A STEP timeout is an ordinary step failure, and every `if: always()`
    # step after it still runs. So the build gets a step budget strictly
    # smaller than the job's, and the difference is the collector's.
    #
    # 33 minutes bought 31 packages and glib's configure in run 52. The nine
    # packages after glib include its own compile, harfbuzz, cairo and pango,
    # none of which has ever run here, at jobs=1. 90 was going to be tight
    # and silent about it.
    # NO JOB timeout-minutes, DELIBERATELY. GitHub's hard ceiling for a job is
    # 360 minutes and it enforces that whatever this file says, so a value here
    # can only ever give time away. This job asked for 300 and handed back an
    # hour it was entitled to, on a build that has already run out of time
    # once.
    #
    # THE STEP KEEPS ITS OWN, AND THAT ONE EARNS ITS PLACE -- see the note
    # above the build step. It fires before the ceiling so the collector still
    # runs; without it a hang is SIGKILLed at 360 with every build log still
    # inside the container, and the run says "cancelled" and nothing else.
    steps:
      - uses: actions/checkout@v5
      - name: 'AIRLOCK deps (tier 2 -- drives the build, touches no artifact byte): bubblewrap is the wall'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y bubblewrap e2fsprogs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          python3 -c 'import tomllib' || { echo "python 3.11+ required"; exit 1; }
          # /dev/kvm for the gates, when the runner has it (build.sh decides -enable-kvm itself)
          [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true
      - name: 'STAGE 5 in/: selftest, plan, the stage-4 sysroot + kernel (attested), sources, checkpoint'
        id: sysroot
        env:
          GH_TOKEN: ${{ github.token }}
          USE_CHECKPOINT: ${{ inputs.use_checkpoint && '1' || '' }}
          ADOPT_CHECKPOINT: ${{ inputs.adopt_checkpoint && '1' || '' }}
          STOP_AFTER: ${{ inputs.stop_after }}
        run: |
          sh stages/5-user-space/build.sh in
          # the state build.sh keeps across phases (SYSROOT_SHA, VERON_ACCEL,
          # RESTORED_N) -> this job's env, for the checkpoint and relay steps
          sed 's/^\([A-Z_]*\)=\(.*\)$/\1=\2/' box5/env.sh | tr -d "'" >> "$GITHUB_ENV"
      - name: 'STAGE 5 chain, IN THE SYSROOT BOX: VERON-SEAL + every package; installs, linked, manifest, ledger, trace gates'
        id: build
        env:
          USE_CHECKPOINT: ${{ inputs.use_checkpoint && '1' || '' }}
          STOP_AFTER: ${{ inputs.stop_after }}
          SEED_INSTALLS: ${{ inputs.seed_installs && '1' || '' }}
          SELFREBUILD: ${{ inputs.selfrebuild && '1' || '' }}
        run: sh stages/5-user-space/build.sh chain
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.build.outcome == 'success' && inputs.seed_installs }}
        with: { name: seeded-installs, path: spikes/stage5/packages*/*/installs.txt, retention-days: 7 }
      - name: 'Publish a build checkpoint'
        if: ${{ always() && inputs.save_checkpoint }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd spikes/stage5
          # A FAILED BUILD BANKS WHAT IT BUILT. This step used to require
          # steps.build.outcome == 'success', and run 85592115674 is what that
          # cost: 118 of 124 packages built, fltk failed at [119/124], and all
          # 118 went into the bin with the runner. The next run started at 1.
          #
          # THE GATE MADE NO SENSE AGAINST HOW A CHECKPOINT WORKS. `veron
          # checkpoint` records a key for every package dest/ CURRENTLY HOLDS,
          # and `--resume` keeps the subset whose keys still match -- the
          # marker's own docstring says it carries {package: key} "so a
          # checkpoint was all-or-nothing" no longer. A partial tree is exactly
          # what the per-package design supports; it is how stop_after already
          # works, and a build that stopped at 119 is not different in kind
          # from one told to stop at 118.
          #
          # NOTHING HERE ASSERTS COMPLETENESS. The release notes call it a
          # cache, the count is printed, and the restore step re-keys and
          # discards anything stale. A checkpoint holding 118 packages is a
          # true statement about 118 packages.
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "  the build did not finish -- banking what it did build"
          fi
          BASE="$SYSROOT_SHA"
          python3 tools/veron --overlay packages-amd64 --dest dest checkpoint --base "$BASE"
          tar --zstd -cf dest.tar.zst dest
          echo "  $(du -h dest.tar.zst | cut -f1) for $(ls dest | wc -l) package(s)"
          # A FAILED CACHE PUBLISH MUST NOT FAIL THE RUN. An earlier 403
          # landed after 48 packages had built and took the manifest, the
          # ledger, the image and the boot down with it -- none of which
          # depend on a checkpoint existing.
          if gh release create 5/ckpt-x86_64 --title 'build checkpoint (x86_64)' \
               --notes 'a CACHE, not evidence -- see DEPENDENCIES.md' 2>&1 \
             || true; then :; fi
          if gh release upload 5/ckpt-x86_64 dest.tar.zst --clobber; then
            echo "VERON-CHECKPOINT-PUBLISHED  $(ls dest | wc -l) package(s)"
            echo "BANKED_N=$(ls dest | wc -l)" >> "$GITHUB_ENV"
          else
            echo "VERON-CHECKPOINT-UNPUBLISHED -- the next run rebuilds"
          fi
          rm -f dest.tar.zst

      - name: 'STAGE 5: merge the DESTDIRs into the system; VERON-STAGE5-OK'
        id: merge
        if: ${{ always() && steps.build.outcome == 'success' && env.PARTIAL != 'yes' }}
        env: { STOP_AFTER: "${{ inputs.stop_after }}" }
        run: sh stages/5-user-space/build.sh merge
      - name: 'STAGE 5: the image, its reproducibility probe, the initramfs'
        id: image
        if: ${{ always() && steps.merge.outcome == 'success' && env.PARTIAL != 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STOP_AFTER: ${{ inputs.stop_after }}
        run: sh stages/5-user-space/build.sh image
      - name: 'STAGE 5 gates: boot the system and run its tests; generic kernel + desktop with boot_system; DHCP with net_test'
        id: boot
        if: ${{ always() && steps.image.outcome == 'success' && env.PARTIAL != 'yes' && !inputs.skip_boot }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOOT_SYSTEM: ${{ inputs.boot_system && '1' || '' }}
          NET_TEST: ${{ inputs.net_test && '1' || '' }}
          STOP_AFTER: ${{ inputs.stop_after }}
        run: sh stages/5-user-space/build.sh boot
      - name: Upload the desktop screenshot
        if: ${{ always() && steps.boot.outcome == 'success' && inputs.boot_system }}
        uses: actions/upload-artifact@v4
        with: { name: desktop-screenshot, path: spikes/stage5/out/desktop*.png, retention-days: 14, if-no-files-found: ignore }
      - name: 'STAGE 5: size, strip, rebuild the image, re-verify it boots'
        id: strip
        if: ${{ always() && steps.image.outcome == 'success' && env.PARTIAL != 'yes' }}
        env:
          SKIP_BOOT: ${{ inputs.skip_boot && '1' || '' }}
          STOP_AFTER: ${{ inputs.stop_after }}
        run: sh stages/5-user-space/build.sh strip
      - name: 'STAGE 5 pack: out/5 and the release payload'
        id: pack
        if: ${{ steps.strip.outcome == 'success' && env.PARTIAL != 'yes' }}
        env: { STOP_AFTER: "${{ inputs.stop_after }}" }
        run: sh stages/5-user-space/build.sh pack
      - name: 'Publish the image'
        # PUBLISHING IS GATED ON THE TESTS THAT RAN, AND IT WAS NOT.
        #
        # This said `if: always()`, which meant the image was published no
        # matter what had failed before it. Run 86191621985 published an image
        # in which every browser launch died with "no Wayland display" -- the
        # desktop step did not catch it, and even when a step does fail,
        # always() published anyway. Two independent holes, and the second one
        # makes every other gate in this file advisory.
        #
        # `!= 'failure'` RATHER THAN `== 'success'`, DELIBERATELY. A step that
        # was skipped -- boot_system=false, net_test=false, skip_boot=true --
        # reports 'skipped', and a build that deliberately did not run the
        # desktop test should still publish. Only a test that RAN AND FAILED
        # blocks it. Choosing == 'success' here would mean no image could ever
        # be published without running every optional test.
        # EVERY TEST THAT RAN MUST NOT HAVE FAILED.
        #
        # steps.desktop WAS BRIEFLY REMOVED FROM THIS LIST and is back. It was
        # taken out because the desktop test failed on images that ran
        # correctly on real hardware -- but the answer to a test that lies is
        # to fix the test, not to stop listening to it. That test now launches
        # the browser the way a person does and judges the result from the
        # pixels on screen, so it is worth blocking a publish again.
        #
        # `!= 'failure'` RATHER THAN `== 'success'`, DELIBERATELY. A step that
        # was skipped -- boot_system=false, net_test=false, skip_boot=true --
        # reports 'skipped', and a build that deliberately did not run the
        # desktop test should still publish. Only a test that RAN AND FAILED
        # blocks it.
        # steps.ledger AND steps.trace ARE IN THIS LIST NOW, AND THEIR
        # ABSENCE WAS MEASURED, NOT HYPOTHETICAL: run 86917062743 failed the
        # trace gate -- every recorded edge did NOT agree -- and published
        # the image anyway, because this gate only blocks on the steps it
        # names and the trace step was not among them. A verification step
        # that cannot block the publish is advisory, which is the exact
        # defect the always() paragraph above records this gate being built
        # to close. Same `!= 'failure'` shape as the rest: a SKIPPED gate
        # (stop_after partial, build failed earlier) does not block -- only
        # a gate that RAN AND FAILED does.
        if: ${{ always()
                && steps.build.outcome == 'success'
                && steps.ledger.outcome != 'failure'
                && steps.trace.outcome != 'failure'
                && steps.boot.outcome != 'failure'
                && steps.bootgeneric.outcome != 'failure'
                && steps.desktop.outcome != 'failure'
                && steps.nettest.outcome != 'failure'
                && steps.strip.outcome != 'failure'
                && steps.stripboot.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd spikes/stage5/out
          # TWO GUARDS, AND THE SECOND IS NOT REDUNDANT. `[ -e rootfs.img ]`
          # already stops a partial run here, because the image step is gated
          # off when stop_after is set and there is nothing to find. The
          # explicit check says WHY rather than leaving it to a missing file,
          # and it keeps working if the image step is ever un-gated: this is
          # the step that writes to a release under names that claim to be the
          # x86_64 stage-5 system, and it must never do that for 81 packages
          # of 122.
          if [ "${PARTIAL:-no}" = "yes" ]; then
            echo "VERON-STAGE5-UNPUBLISHED  partial build (stop_after) --"
            echo "  a run that stopped early has not built a system and"
            echo "  cannot publish one. The checkpoint above is its output."
            exit 0
          fi
          [ -e rootfs.img ] || { echo "  no image was built"; exit 0; }
          R=../../..
          missing=""
          for f in "$R/boot/Image" files.tsv initramfs.cpio.gz; do
            [ -e "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "  not publishing -- missing:$missing"
            echo "VERON-STAGE5-UNPUBLISHED  inputs absent, nothing compressed"
            exit 0
          fi
          # ZSTD_CLEVEL=10, NOT 19. Level 19 was chosen for the stage-4
          # sysroot -- 619 MB, written once per chain -- and reused here on an
          # image seven times larger without rethinking it, which cost about
          # thirty minutes a run for a few percent of size.
          # DETERMINISTIC TAR, matching stage 4's sysroot.tar.zst and this
          # workflow's own loginkit.tar.gz. The inner rootfs.img is already
          # byte-reproducible; a bare `tar --zstd` still embedded the file's
          # per-run mtime in the tar header, so the .tar.zst differed run-to-run
          # (1c90fb5a vs 16ef70c1 at a fixed commit) even though IMAGE-SHA256
          # matched. --mtime=@0 pins it; the rest match stage 4 exactly.
          ZSTD_CLEVEL=10 tar --sort=name --mtime=@0 --owner=0 --group=0 \
            --numeric-owner --format=gnu --zstd -cf rootfs.img.tar.zst rootfs.img
          printf '  rootfs.img.tar.zst (stripped): %s\n' "$(du -h rootfs.img.tar.zst | cut -f1)"
          # THE FULL IMAGE TOO, WHEN THE STRIP RAN. A run where stripping was
          # skipped or failed has no rootfs-full.img, and publishing a missing
          # file would fail the step for a reason unrelated to the image.
          if [ -e rootfs-full.img ]; then
            ZSTD_CLEVEL=10 tar --sort=name --mtime=@0 --owner=0 --group=0 \
              --numeric-owner --format=gnu --zstd -cf rootfs-full.img.tar.zst rootfs-full.img
            printf '  rootfs-full.img.tar.zst (unstripped): %s\n' \
              "$(du -h rootfs-full.img.tar.zst | cut -f1)"
            printf '  the stripped image is what a device runs; the full one\n'
            printf '  carries symbols and is what the tests above measured.\n'
          fi
          asset=$(stat -c%s rootfs.img.tar.zst)
          if [ "$asset" -lt 2000000000 ]; then
            # 5/latest-x86_64, ITS OWN TAG, FOR THE REASON stage 4's
            # amd64 arm gives about its own: this uploads with --clobber and
            # every filename here is unqualified -- rootfs.img.tar.zst,
            # IMAGE-SHA256, Image, files.tsv, initramfs.cpio.gz. Publishing to
            # stage5/latest would overwrite the aarch64 image, its digest and
            # its manifest with x86_64 ones under names that say nothing about
            # which architecture they are.
            gh release create 5/latest-x86_64 --title 'Veron stage 5 (x86_64)' \
              --notes 'The stage-5 system image for x86_64, and the kernel and initramfs that boot it. Separate from stage5/latest, which is aarch64. Open with the zstd in toolbox/latest.' \
              2>/dev/null || true
            # ---- PHASE 1: RAISE THE INCOMPLETE MARKER BEFORE ANY ASSET ----
            # RULED (Joe, 2026-08-19): publishing is a two-phase commit. A
            # release is INCONSISTENT until proven otherwise, and stage 6
            # must be able to see that from the tag alone. The failure this
            # prevents was real: `gh release upload --clobber` updated
            # IMAGE-SHA256 to 49d3919f but LEFT the old 320 MB tarball
            # (e18e188a) in place -- clobber silently keeps a large asset it
            # fails to replace. The hash said one image, the bytes were
            # another, and stage 6 consumed the lie. A marker removed only
            # after a real download-verify turns that into a caught failure.
            {
              echo "PUBLISH IN PROGRESS -- do not consume this release."
              echo "run    ${GITHUB_RUN_ID}"
              echo "commit ${GITHUB_SHA}"
              echo "began  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "image  $(cut -d' ' -f1 IMAGE-SHA256)"
              echo "This file is removed only after every published asset is"
              echo "re-downloaded and verified. Its presence means the pair"
              echo "may be inconsistent -- refuse the release while it exists."
            } > PUBLISHING-INCOMPLETE
            gh release upload 5/latest-x86_64 PUBLISHING-INCOMPLETE --clobber || {
              echo "VERON-STAGE5-UNPUBLISHED -- could not raise the marker"; exit 1; }
            # AN ADOPTED CHECKPOINT TRAVELS WITH THE IMAGE, because a claim
            # made only in a run log is a claim nobody finds later. If this
            # run reused packages compiled against a different sysroot, the
            # release says so beside the bytes it published.
            #
            # THE MARKER CANNOT CARRY THIS. `veron checkpoint` writes it from
            # scratch -- {base, keys} and nothing else -- so a field added to
            # it is dropped by the very command that does the adopting. The
            # restore step writes .adopted-from instead.
            if [ -s .adopted-from ]; then
              { echo "VERON-CHECKPOINT-ADOPTED"
                echo "  packages in this image were compiled against sysroot"
                echo "    $(cat .adopted-from)"
                echo "  and re-keyed onto"
                echo "    $(cat "$R/dl-sysroot/SYSROOT-SHA256" | awk '{print $1}')"
                echo "  by operator request. Nothing verified they are valid"
                echo "  against the second one."
              } > ADOPTED-CHECKPOINT
              echo "  recording an adopted checkpoint in the release"
              sed 's/^/    /' ADOPTED-CHECKPOINT
            fi
            assets="rootfs.img.tar.zst IMAGE-SHA256 PACKED-BY"
            # THE FULL IMAGE IS OPTIONAL AND APPENDED THE SAME WAY
            # ADOPTED-CHECKPOINT IS. A run where the strip was skipped has no
            # rootfs-full.img.tar.zst, and naming a file that does not exist
            # makes `gh release upload` fail the whole publish -- losing the
            # image over a missing extra.
            [ -f rootfs-full.img.tar.zst ] && \
              assets="$assets rootfs-full.img.tar.zst IMAGE-SHA256-FULL"
            [ -f ADOPTED-CHECKPOINT ] && assets="$assets ADOPTED-CHECKPOINT"
            for f in "$R/boot/Image" files.tsv initramfs.cpio.gz; do
              [ "$f" = "${f#$R/}" ] || cp "$f" .
              assets="$assets $(basename "$f")"
            done
            # PROVENANCE, THE SAME RECORD STAGE 4 PUBLISHES, PLUS THE HALF
            # ONLY THIS STAGE CAN WRITE: what it CONSUMED. The sysroot step
            # verified the stage-4 sysroot digest and the kernel against
            # stage 4's own PROVENANCE before anything was built on them;
            # repeating those digests here is what chains the seam -- the
            # DESIGN.md rule that a consumer restates its builder's hash, so
            # two independently written numbers must agree and `trace
            # --verify` has an edge to fail on. Without this file a trace
            # from any file in the flashed image dead-ends one hop short of
            # the sysroot record.
            #
            # WRITTEN AFTER THE COPY LOOP ABOVE, deliberately: Image is in
            # the working directory by then, so every digest below is of the
            # exact bytes the upload ships rather than of a path that could
            # drift from them.
            {
              echo "arch     x86_64"
              echo "commit   ${GITHUB_SHA}"
              echo "run      ${GITHUB_RUN_ID}"
              echo "built    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "image    $(cut -d' ' -f1 IMAGE-SHA256)"
              echo "kernel   $(sha256sum Image | cut -d' ' -f1)"
              echo "initrd   $(sha256sum initramfs.cpio.gz | cut -d' ' -f1)"
              echo "files    $(sha256sum files.tsv | cut -d' ' -f1)"
              echo
              echo "consumed 4/latest-x86_64"
              echo "  sysroot     $(awk '{print $1}' "$R/dl-sysroot/SYSROOT-SHA256" 2>/dev/null || echo unknown)"
              echo "  provenance  $(sha256sum "$R/dl-sysroot/PROVENANCE" 2>/dev/null | cut -d' ' -f1 || echo unknown)"
              kwant=$(awk '/^kernel/{print $2}' "$R/dl-sysroot/PROVENANCE" 2>/dev/null || true)
              kgot=$(sha256sum Image | cut -d' ' -f1)
              if [ -n "$kwant" ] && [ "$kwant" = "$kgot" ]; then
                echo "  kernel      verified against stage-4 PROVENANCE"
              else
                echo "  kernel      NOT verified against stage-4 PROVENANCE"
              fi
              echo
              echo "built by .github/workflows/5-user-space-amd64.yml on the"
              echo "sysroot above; per-package records are ledger/*.json in"
              echo "the repository at this commit."
            } > PROVENANCE
            sed 's/^/    /' PROVENANCE
            # ---- TOOLS: THE PIPELINE'S OWN QEMU, PUBLISHED BESIDE THE ----
            # ---- IMAGE, INSIDE THE SAME TWO-PHASE VERIFY ----
            # RULED (Joe, 2026-08-23): the local toolbox retires into the
            # stage-5 release. qemu-aarch64-static is built by
            # packages-amd64/qemu-user -- static, so it runs on any x86_64
            # Linux host regardless of libc: this runner, an Ubuntu
            # workstation, the hermetic aarch64-only sysroots of stages 0-4.
            # Publishing it HERE rather than a toolbox tag means it rides
            # the INCOMPLETE marker, the delete-then-upload discipline and
            # the name-presence verify below, none of which a side tag gets.
            # Guarded on existence: a run whose plan stopped short of
            # qemu-user publishes an image and simply no tools bundle.
            #
            # GPL-2.0-only BINARY, AND THE SOURCE OFFER IS STRUCTURAL: the
            # WHENCE names the exact tarball sha, its mirror route in
            # sources/MIRRORS.tsv, and the recipe at this commit -- the
            # corresponding source is one pinned download away, which is
            # the offer, in writing, beside the bytes.
            # THE BUNDLE GREW FROM ONE BINARY TO THE EMULATOR (2026-08-24):
            # the static qemu-system-x86_64 and -aarch64, qemu-img, the
            # firmware they load (SeaBIOS, option ROMs, OVMF with TPM 2.0
            # and Secure Boot), a static swtpm, and veron-vm, the launcher
            # that turns "an Ubuntu or Windows 11 ISO" into a command line.
            # Same discipline as before, extended: every binary is checked
            # for zero DT_NEEDED HERE, at bundling, so a bundle claiming
            # static can never carry a dynamic file; a run whose plan
            # stopped short of a package skips that PART and says so.
            # NOTHING IN THE BUNDLE IS BORROWED: every byte came out of
            # dest/, built by a recipe at this commit.
            tdir=$(mktemp -d)
            mkdir -p "$tdir/veron-tools/share/qemu"
            static_or_die() {   # $1 = file; a dynamic file in a static bundle is a lie
              if readelf -d "$1" 2>/dev/null | grep -q NEEDED; then
                echo "  NOT STATIC: $1"; readelf -d "$1" | grep NEEDED; exit 1
              fi
            }
            bundled=""
            {
              echo "veron-tools (x86_64 host binaries)"
              echo
              echo "built by the recipes at commit ${GITHUB_SHA}, run ${GITHUB_RUN_ID};"
              echo "every ELF below is static (no DT_NEEDED, asserted at bundling)."
              echo "licence GPL-2.0-only for qemu (source qemu-11.0.3.tar.xz, sha256"
              echo "in packages-amd64/qemu/recipe.toml), BSD-2-Clause-Patent for OVMF,"
              echo "BSD-3-Clause for swtpm; every source is mirrored per"
              echo "sources/MIRRORS.tsv at this commit -- the corresponding source is"
              echo "one pinned download away, which is the offer, in writing."
              echo
            } > TOOLS-WHENCE
            # THE BOX'S DRIVER TRAVELS WITH THE BUNDLE: stage 4's static busybox,
            # the same bytes the image boots on, so stages/box.sh on a runner or
            # any Linux seals with OUR busybox and records its hash.
            if [ -x ../sysroot/bin/busybox ]; then
              static_or_die ../sysroot/bin/busybox
              cp ../sysroot/bin/busybox "$tdir/veron-tools/"
              echo "busybox  $(sha256sum ../sysroot/bin/busybox | cut -d' ' -f1)  (stage-4 sysroot; the box driver)" >> TOOLS-WHENCE
              bundled="$bundled busybox"
            else
              echo "  no sysroot/bin/busybox -- not bundled, stated not silent"
            fi
            for b in qemu-user/usr/bin/qemu-aarch64-static \
                     qemu/usr/bin/qemu-system-x86_64 qemu/usr/bin/qemu-system-aarch64 \
                     qemu/usr/bin/qemu-img swtpm/usr/bin/swtpm swtpm/usr/bin/swtpm_ioctl \
                     zstd/usr/bin/zstd; do
              if [ -x "../dest/$b" ]; then
                static_or_die "../dest/$b"
                cp "../dest/$b" "$tdir/veron-tools/"
                echo "$(basename "$b")  $(sha256sum "../dest/$b" | cut -d' ' -f1)  (packages-amd64/${b%%/*})" >> TOOLS-WHENCE
                bundled="$bundled $(basename "$b")"
              else
                echo "  no dest/$b -- not bundled, stated not silent"
                echo "$(basename "$b")  ABSENT in this run (plan stopped before ${b%%/*})" >> TOOLS-WHENCE
              fi
            done
            # THE FIRMWARE IS WHAT MAKES THE EMULATOR RUN ANYTHING: the
            # 16 SeaBIOS/option-ROM files qemu's inverted gate pinned, and
            # the three OVMF volumes. -L share/qemu is how veron-vm and the
            # gates point a static binary at them.
            for d in qemu edk2-firmware; do
              if [ -d "../dest/$d/usr/share/qemu" ]; then
                cp ../dest/$d/usr/share/qemu/* "$tdir/veron-tools/share/qemu/"
              else
                echo "  no dest/$d/usr/share/qemu -- firmware from $d not bundled"
              fi
            done
            ( cd "$tdir/veron-tools/share/qemu" && sha256sum * ) | sed 's/^/firmware  /' >> TOOLS-WHENCE
            if [ -x ../packages-amd64/veron-system/files/usr/bin/veron-vm ]; then
              cp ../packages-amd64/veron-system/files/usr/bin/veron-vm "$tdir/veron-tools/"
              echo "veron-vm  $(sha256sum ../packages-amd64/veron-system/files/usr/bin/veron-vm | cut -d' ' -f1)  (launcher; POSIX sh)" >> TOOLS-WHENCE
            fi
            sed 's/^/    /' TOOLS-WHENCE
            if [ -n "$bundled" ]; then
              # RUN-VARYING DATA GOES BESIDE THE ARTIFACT, NOT INSIDE IT --
              # the 2483bbb7 lesson: the WHENCE carries run id and so lives
              # as its own asset, so the bundle's bytes are a function of
              # the commit alone. Sorted, epoch-zero, numeric root
              # ownership, single-threaded zstd: rebuild the same commit,
              # get the same tools-x86_64.tar.zst.
              tar --sort=name --mtime='@0' --owner=0 --group=0 \
                  --numeric-owner -C "$tdir" -cf - veron-tools \
                | zstd -19 -q > tools-x86_64.tar.zst
              sha256sum tools-x86_64.tar.zst > TOOLS-SHA256
              echo "  tools-x86_64.tar.zst: $(du -h tools-x86_64.tar.zst | cut -f1) carrying:$bundled"
              assets="$assets tools-x86_64.tar.zst TOOLS-SHA256 TOOLS-WHENCE"
            else
              echo "  no static binary in dest/ at all -- tools bundle skipped, stated not silent"
            fi
            rm -rf "$tdir"
            assets="$assets PROVENANCE"
            echo "  uploading (delete-then-upload, per asset): $assets"
            # REPRODUCIBILITY INSTRUMENTATION: log the FULL identity -- path,
            # mode, exact size in bytes, sha256 -- of every asset actually
            # published, plus a TREE-SHA over the set. The PROVENANCE block
            # above prints bare shas for a few files and only human sizes
            # (320M) for the tarballs; nothing logged the published
            # rootfs.img.tar.zst's sha, its byte count, or its mode. This makes
            # every shipped artifact diffable run-to-run, the same way stage 6's
            # manifests are. Paths are bare names here (CWD is stage5/out), so
            # manifest.py is at the repo root; $GITHUB_WORKSPACE points there
            # regardless of CWD (this step runs from spikes/stage5/out, which is
            # THREE levels down -- an earlier "../../tools" resolved to
            # spikes/tools and killed the publish step with exit 2, run
            # 87594886080).
            python3 "$GITHUB_WORKSPACE/tools/manifest.py" "stage-5 published assets" $assets
            # ---- PHASE 2: REPLACE EACH ASSET EXPLICITLY ----
            # NOT bare --clobber over the batch: clobber's delete-then-replace
            # races on large assets and can no-op silently (the 320 MB bug).
            # Delete each name first, then upload -- so a failed upload leaves
            # NO asset (a visible gap the verify catches) rather than a stale
            # one (an invisible lie). The marker is already up; a crash here
            # leaves INCOMPLETE raised, which is exactly right.
            upload_ok=yes
            for a in $assets; do
              gh release delete-asset 5/latest-x86_64 "$a" -R "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
              if ! gh release upload 5/latest-x86_64 "$a"; then
                echo "  UPLOAD FAILED: $a"; upload_ok=no; break
              fi
            done
            # ---- PHASE 3: VERIFY THE PUBLISHED RELEASE LIKE A STRANGER ----
            # Download every asset fresh from the tag and check the pair the
            # consumer checks: the unpacked rootfs must hash to IMAGE-SHA256.
            # This is the step that would have caught 49d3919f-vs-e18e188a.
            verify_ok=no
            if [ "$upload_ok" = yes ]; then
              vdir=$(mktemp -d)
              if gh release download 5/latest-x86_64 -R "$GITHUB_REPOSITORY" \
                   -p 'rootfs.img.tar.zst' -p 'IMAGE-SHA256' -D "$vdir" --clobber; then
                ( cd "$vdir" && tar --zstd -xf rootfs.img.tar.zst \
                  && sha256sum -c IMAGE-SHA256 ) && verify_ok=yes
              fi
              # also confirm every asset NAME is present on the tag
              present=$(gh release view 5/latest-x86_64 -R "$GITHUB_REPOSITORY" \
                        --json assets --jq '.assets[].name' 2>/dev/null)
              for a in $assets; do
                echo "$present" | grep -qx "$a" || { echo "  MISSING ON TAG: $a"; verify_ok=no; }
              done
              rm -rf "$vdir"
            fi
            # ---- PHASE 4: LOWER OR ANNOTATE THE MARKER ----
            if [ "$verify_ok" = yes ]; then
              gh release delete-asset 5/latest-x86_64 PUBLISHING-INCOMPLETE \
                -R "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
              echo "VERON-STAGE5-PUBLISHED-AMD64  $(cut -d' ' -f1 IMAGE-SHA256)"
              echo "IMAGE_PUBLISHED=yes" >> "$GITHUB_ENV"
            else
              {
                echo "PUBLISH FAILED VERIFICATION -- do not consume."
                echo "run    ${GITHUB_RUN_ID}"
                echo "image  $(cut -d' ' -f1 IMAGE-SHA256)"
                echo "failed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo "upload_ok=$upload_ok verify_ok=$verify_ok"
                echo "The published pair did not verify; the marker stays."
              } > PUBLISHING-INCOMPLETE
              gh release upload 5/latest-x86_64 PUBLISHING-INCOMPLETE --clobber || true
              echo "VERON-STAGE5-UNPUBLISHED -- verification failed, marker stands"
              exit 1
            fi
          else
            echo "  too large to publish: $((asset/1048576)) MB, cap is 2 GB"
          fi
          # THE TARBALLS ARE NOT DELETED HERE ANY MORE. The attest step below
          # signs the exact bytes that were uploaded, so they must survive
          # this step; the cleanup step after it owns the deletion now.

      # ATTEST: THE SAME STEP STAGES 1-3 RUN, ON THE PUBLISHED IMAGE. A
      # Sigstore keyless signature, logged in Rekor, binding these exact
      # digests to this repo, this commit and THIS workflow -- the one whose
      # gates just built, booted and tested them. A stranger runs
      #
      #   gh attestation verify rootfs.img.tar.zst --repo <owner>/Veron
      #
      # WHAT IT PROVES: provenance -- these bytes, this workflow, this
      # commit, at a log-operator-attested time. WHAT IT DOES NOT PROVE:
      # correctness or how the build happened -- that is the ledger's job
      # and PROVENANCE's, both of which ride in the subject list so the
      # signature covers the chain record itself. GATED ON THE PUBLISH: an
      # image that was not released is not attested, so an attestation id
      # always corresponds to bytes a person can fetch.
      - name: 'ATTEST: bind the published image to this workflow identity'
        if: ${{ always() && env.IMAGE_PUBLISHED == 'yes' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            spikes/stage5/out/rootfs.img.tar.zst
            spikes/stage5/out/Image
            spikes/stage5/out/initramfs.cpio.gz
            spikes/stage5/out/files.tsv
            spikes/stage5/out/IMAGE-SHA256
            spikes/stage5/out/PROVENANCE

      - name: 'Free the image tarballs'
        if: always()
        run: rm -f spikes/stage5/out/rootfs.img.tar.zst spikes/stage5/out/rootfs-full.img.tar.zst

      - name: 'VERON-COLLECT -- preserve the evidence'
        if: always()
        run: |
          set -eu
          cd spikes/stage5
          python3 tools/veron --overlay packages-amd64 --logs logs --out out --build-dir build collect

      # if: always() ON THE UPLOAD TOO. A conditional upload attached to an
      # unconditional collect just moves the hole one step later.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veron-stage5-loginkit-amd64-${{ github.run_id }}
          path: spikes/stage5/loginkit.tar.gz
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veron-stage5-diag-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: spikes/stage5/out/diag
          if-no-files-found: error
          retention-days: 30

      - name: 'RELAY: banked but unfinished -- dispatch the next round'
        if: ${{ always() && inputs.relay != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # THE LOOP LIVES HERE AND NOWHERE ELSE, WITH THREE EXITS:
          #   published -> done (the loop's success exit)
          #   no progress this round -> STOP LOUDLY: a stuck package must not
          #     spin runner-hours; a human reads this run's build log
          #   depth >= 8 -> STOP: eight 340-minute rounds is not a build,
          #     it is a bug wearing one's clothes
          [ -n "${{ inputs.relay }}" ] || { echo "RELAY-OFF"; exit 0; }
          if [ "${IMAGE_PUBLISHED:-no}" = "yes" ]; then
            echo "RELAY-DONE  the image published; the loop ends"
            exit 0
          fi
          restored="${RESTORED_N:-0}"; banked="${BANKED_N:-0}"
          if [ "$banked" -le "$restored" ]; then
            echo "RELAY-STOP  no progress: restored $restored, banked $banked"
            exit 1
          fi
          depth="${{ inputs.relay }}"
          case "$depth" in *[!0-9]*) depth=0;; esac   # "true" -> depth 0
          if [ "$depth" -ge 8 ]; then
            echo "RELAY-STOP  depth cap reached: $depth prior rounds"
            exit 1
          fi
          echo "RELAY  restored $restored -> banked $banked; dispatching the next round ($((depth+2)))"
          gh workflow run 5-user-space-amd64.yml --ref "$GITHUB_REF_NAME" \
            -f use_checkpoint=true -f save_checkpoint=true \
            -f relay="$((depth+1))"
