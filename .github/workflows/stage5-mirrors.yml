name: stage5-mirrors

# A PACKAGE IS NOT PROPERLY PINNED UNTIL THERE IS MORE THAN ONE PLACE TO GET
# IT.
#
# Every recipe has had exactly one working route plus a template pointing at a
# mirror nothing was ever uploaded to. That is what `mirror check` has been
# reporting as THIN, and it cost two consecutive runs:
#
#   git       "The read operation timed out"        www.kernel.org
#   freetype  "The handshake operation timed out"   downloads.sourceforge.net
#
# Different package each time, same cause, and in both cases the same bytes
# were sitting on a mirror the fetch never tried.
#
# THE PROBE SHOULD HAVE BEEN DOING THIS ALL ALONG. It fetches from one URL,
# computes a digest, and throws away the question of where else those bytes
# live -- while `probe source` was already reading Arch's and Alpine's
# source= arrays, which ARE alternate routes, and discarding them.
#
# EVERY CANDIDATE IS DOWNLOADED AND HASHED before it is written. A route that
# serves different bytes is worse than no route, and the check is cheap
# because the digest is already known. That is what keeps "add any host you
# like" an availability decision rather than a trust one, which is exactly
# what sources/HOSTS.toml's header claims.

on:
  workflow_dispatch:
    inputs:
      out:
        description: 'Where to write the verified routes'
        required: false
        default: 'sources/MIRRORS.tsv'
        # THE CANONICAL TABLE, not a file beside it. Written to a side file
        # first, and nothing read it: freetype had four verified SourceForge
        # routes recorded while `mirror fetch` still saw only the redirector,
        # and the next run died on its TLS handshake. A route the fetcher
        # cannot see is not a route.

permissions:
  contents: write

concurrency:
  group: stage5-mirrors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirrors:
    runs-on: ubuntu-24.04-arm
    # Every candidate is a full download. ~100 packages times a few routes
    # each is real bandwidth, and that is the price of verifying rather than
    # assuming.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          # The default checkout is a detached commit with no
          # branch, so a push has nothing to push to.
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: 'Find and verify alternate routes'
        run: |
          set -eu
          cd spikes/stage5
          python3 -u tools/probe.py mirrors --packages packages \
            --out "$GITHUB_WORKSPACE/${{ inputs.out }}" | tee /tmp/mirrors.txt

      # COMMIT THE TABLE. IT IS THE POINT OF THE JOB.
      #
      # Until now this wrote sources/MIRRORS.tsv into the runner's workspace,
      # uploaded it as an artifact, and threw the workspace away -- so the
      # asset existed on Releases and NOTHING POINTED AT IT. Closing the loop
      # meant a human downloading a zip, finding the file inside it, copying
      # it over, and committing. That is not a workflow, it is a chore with a
      # workflow attached, and it has already been forgotten once: freetype
      # had four verified routes sitting in an artifact while the next run
      # died fetching it.
      #
      # sources/HOSTS.toml calls this file "Generated and committed", which
      # implies a generator that can write. This is that generator.
      - name: 'Commit the routes'
        run: |
          set -eu
          if git diff --quiet -- sources/MIRRORS.tsv; then
            echo "  no new routes -- table unchanged"
            exit 0
          fi
          echo "  --- what changed ---"
          git --no-pager diff --stat -- sources/MIRRORS.tsv
          git --no-pager diff -- sources/MIRRORS.tsv | grep '^+' | grep -v '^+++' \
            | head -20 | sed 's/^/    /'
          git config user.name  "veron-mirror[bot]"
          git config user.email "veron-mirror@users.noreply.github.com"
          git add sources/MIRRORS.tsv
          n=$(git diff --cached --numstat -- sources/MIRRORS.tsv | awk '{print $1}')
          git commit -m "mirrors: +${n:-0} routes (stage5-mirrors)"
          # PUSH WITH A REBASE, NOT --force. Two mirror jobs racing, or a
          # human commit landing mid-run, must not lose work -- and the table
          # is sorted and deduped on write, so a rebase merges cleanly.
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "  push race, retrying ($i)"
            sleep $((i * 3))
          done
          echo "  could not push the table after three attempts"
          exit 1

      - name: 'What this changes'
        if: always()
        run: |
          set -eu
          F="${{ inputs.out }}"
          [ -f "$F" ] || { echo "  nothing written"; exit 0; }
          echo "  === VERIFIED ROUTES PER PACKAGE ==="
          awk -F'\t' '!/^#/ && NF>=4 {c[$2]++} END {for (n in c) printf "  %-40s %d\n", n, c[n]}' "$F" | sort
          echo ""
          total=$(awk -F'\t' '!/^#/ && NF>=4' "$F" | wc -l)
          pkgs=$(awk -F'\t' '!/^#/ && NF>=4 {print $2}' "$F" | sort -u | wc -l)
          echo "  $total verified routes across $pkgs packages"
          echo ""
          echo "  STILL THIN: any package not listed above has upstream only."
          echo "  Those are the ones a slow host can still cost a run, and"
          echo "  they need either a host family adding to MIRROR_FAMILIES or"
          echo "  an upload to our own mirror."
