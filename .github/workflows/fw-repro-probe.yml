name: fw-repro-probe

# Two release runs with the IDENTICAL stage-5 rootfs produced DIFFERENT images.
# The image build is byte-reproducible (repro-probe proved it). The one input
# fetched fresh each run and never digested is the FIRMWARE tree. This probe
# runs the release's FW step -- tools/fw-prep-verbatim.sh, BYTE-IDENTICAL to the
# 6-release FW step -- TWICE, in two isolated directories, then diffs the two
# resulting fwtree directories file by file. If they differ, firmware prep is
# where the non-determinism is, and the offending files are named. Publishes
# nothing.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fwprobe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 'install zstd + make'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd make

      - name: 'PREP A -- run the release FW step verbatim, run 1'
        run: |
          set -eu
          # run the FW step EXACTLY as the release does: from the repo root,
          # same CWD, same relative paths (sources/, tools/mirror.py). It writes
          # fw-dl/ fwstage/ fwtree/ into the repo root -- afterward we move the
          # tree aside so run 2 starts clean, identical to a fresh runner.
          sh tools/fw-prep-verbatim.sh
          mv fwtree fwtree-A
          rm -rf fw-dl fwstage fw-list.tsv
          echo "A: $(find fwtree-A -type f | wc -l) files, $(du -sh fwtree-A | cut -f1)"

      - name: 'PREP B -- run the release FW step verbatim, run 2'
        run: |
          set -eu
          sh tools/fw-prep-verbatim.sh
          mv fwtree fwtree-B
          rm -rf fw-dl fwstage
          echo "B: $(find fwtree-B -type f | wc -l) files, $(du -sh fwtree-B | cut -f1)"

      - name: 'DIFF -- are the two firmware trees byte-identical?'
        run: |
          set -eu
          python3 tools/tree-diff.py fwtree-A fwtree-B
