name: evidence-probe

# STANDALONE PROOF: get ONE log per stage -- exactly 8, no more. The chain is
# eight named stages, each with one deliverable artifact. For each, resolve its
# digest, query its attestation (-> the run that built it), pull that run's log.
# No graph walk, no manifest chasing -- that over-collected 41 intermediate
# runs. This is the flat list Joe actually wants: 8 stages, 8 logs.
# Publishes nothing. Run extraction via tools/att-run.py (python, Veron-native).

on:
  workflow_dispatch:
    inputs:
      fetch_logs:
        description: 'pull each stage run''s log'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  attestations: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: 'STAGES -- one deliverable digest per stage, one log each'
        run: |
          set -eu
          mkdir -p evidence/attestations evidence/logs
          : > evidence/stages.tsv     # stage<TAB>digest<TAB>run

          # resolve <label> <digest>: query the attestation, record the run.
          resolve() {
            label=$1; dg=$2
            [ -n "$dg" ] || { echo "  $label: NO DIGEST resolved -- skipped"; return; }
            sleep 1
            if timeout 30 gh api "repos/$GITHUB_REPOSITORY/attestations/sha256:$dg" \
                 > "evidence/attestations/$label.json" 2>/dev/null \
               && [ -s "evidence/attestations/$label.json" ] \
               && grep -q '"attestations"' "evidence/attestations/$label.json"; then
              rid=$(python3 tools/att-run.py "evidence/attestations/$label.json" | head -1)
              echo "  $label: $(echo "$dg" | cut -c1-16)  run $rid"
              printf '%s\t%s\t%s\n' "$label" "$dg" "$rid" >> evidence/stages.tsv
            else
              rm -f "evidence/attestations/$label.json"
              echo "  $label: $(echo "$dg" | cut -c1-16)  NO ATTESTATION"
            fi
          }

          echo "########## THE 8 STAGES ##########"

          # --- stages 1-3: committed deliverable digests, path-anchored ---
          # Each is the ONE artifact that stage delivers, found by its output
          # path in the committed manifest -- robust, not a nearby-digest grab.
          S1=$(awk '/self-assembler-arm64/{print $1; exit}' stages/1-self-assembly/BASELINE.txt)
          resolve "1-self-assembler" "$S1"

          S2=$(awk '/path.*"out\/2\/aarch64\/pico-c"/{f=1} f&&/sha256/{gsub(/[^0-9a-f]/,"",$3);print $3;exit}' stages/2-pico-c/substages.toml)
          resolve "2-pico-c" "$S2"

          S3M=$(awk '/path.*"out\/3\/aarch64\/tcc-arm64"/{f=1} f&&/sha256/{gsub(/[^0-9a-f]/,"",$3);print $3;exit}' stages/3-micro-c/substages.toml)
          resolve "3-micro-c" "$S3M"

          # --- stage 3 cross, 4, 5: from this build's release provenance ---
          mkdir -p rel
          gh release download 3/latest-x86_64 -R "$GITHUB_REPOSITORY" -p 'ARTIFACT-SHA256' -D rel/3 --clobber 2>/dev/null || true
          S3C=$(grep -i 'tcc-amd64' rel/3/ARTIFACT-SHA256 2>/dev/null | grep -oE '[0-9a-f]{64}' | head -1)
          resolve "3-cross-tcc-amd64" "$S3C"

          gh release download 4/latest-x86_64 -R "$GITHUB_REPOSITORY" -p 'SYSROOT-SHA256' -D rel/4 --clobber 2>/dev/null || true
          S4=$(grep -oE '[0-9a-f]{64}' rel/4/SYSROOT-SHA256 2>/dev/null | head -1)
          resolve "4-sysroot" "$S4"

          gh release download 4/kernel-x86_64 -R "$GITHUB_REPOSITORY" -p '*SHA256*' -D rel/k --clobber 2>/dev/null || true
          S4K=$(grep -i 'vmlinuz\|KERNEL-GENERIC' rel/k/*SHA256* 2>/dev/null | grep -oE '[0-9a-f]{64}' | head -1)
          resolve "4-kernel" "$S4K"

          gh release download 5/latest-x86_64 -R "$GITHUB_REPOSITORY" -p 'IMAGE-SHA256' -D rel/5 --clobber 2>/dev/null || true
          S5=$(grep -oE '[0-9a-f]{64}' rel/5/IMAGE-SHA256 2>/dev/null | head -1)
          resolve "5-rootfs-image" "$S5"

          echo ""
          echo "########## RESULT ##########"
          n=$(wc -l < evidence/stages.tsv)
          echo "  stages resolved to a run: $n (target: ~7-8)"
          echo "  --- stage : digest : run ---"
          cat evidence/stages.tsv | sed 's/^/    /'

          if [ "${{ inputs.fetch_logs }}" = "true" ]; then
            echo ""
            echo "########## ONE LOG PER STAGE ##########"
            while IFS="$(printf '\t')" read -r label dg rid; do
              [ -n "$rid" ] || continue
              sleep 1
              timeout 120 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/logs" \
                > "evidence/logs/$label.zip" 2>/dev/null
              if [ -s "evidence/logs/$label.zip" ]; then
                echo "  $label: log $(stat -c%s evidence/logs/$label.zip) bytes (run $rid)"
              else
                echo "  $label: no log for run $rid"
              fi
            done < evidence/stages.tsv
          fi

          echo ""
          echo "########## PROOF: stage-1 log carries gen1==gen2==gen3 ##########"
          if [ -s evidence/logs/1-self-assembler.zip ]; then
            unzip -p evidence/logs/1-self-assembler.zip 2>/dev/null | grep -a "gen1 == gen2 == gen3" | head -1 | sed 's/^/  /' || echo "  (fixpoint line not found)"
          else
            echo "  stage-1 log not captured"
          fi
