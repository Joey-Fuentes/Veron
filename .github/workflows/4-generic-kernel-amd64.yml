name: 4-generic-kernel-amd64
# THE SECOND KERNEL. Stage 4 publishes two kernels from one toolchain: the
# minimal kernel inside 4/latest-x86_64 proves the chain boots; THIS one is
# the generic kernel for real hardware -- the pinned kernel's own defconfig
# plus stages/4-toolchain-kernel/generic/veron-generic.fragment, Veron's
# owned editorial voice (no distro config is a build input; see the
# fragment's coverage policy). The ISO that carries it is stage 6's job.
#
# Shaped like stage 5: a dispatch-only consumer of 4/latest-x86_64, so
# config iteration costs a kernel build, never the 2-hour bootstrap climb,
# and never touches the green stage-4 machine.
on:
  workflow_dispatch: {}
permissions:
  contents: write
  # ATTESTATION, THE SAME TWO GRANTS THE OTHER PUBLISHING STAGES CARRY:
  # id-token for Fulcio to bind the workflow identity, attestations for the
  # GH attestations API. The kernel build runs from the pinned tarball under
  # the stage-4 toolchain with no token in its environment.
  id-token: write
  attestations: write
concurrency:
  group: generic-kernel-amd64
  cancel-in-progress: false
# KERNEL comes from stages/4-toolchain-kernel/pins.env (generic.sh sources it);
# the publish step sources the same file.
env:
  KERNEL: '7.1.5'
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: 'AIRLOCK deps: bubblewrap is the wall; qemu, OVMF, squashfs-tools for the gates'
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            bubblewrap qemu-system-x86 ovmf squashfs-tools cpio zstd python3 kmod >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
      - name: 'IN: the sysroot contract (4/latest-x86_64, digest + attestation) and the pinned kernel source'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh stages/4-toolchain-kernel/generic.sh in
      - name: 'CONFIG: defconfig + the Veron fragment, then the REQUIRED-CONFIGS gate'
        run: sh stages/4-toolchain-kernel/generic.sh config
      - name: 'BUILD: the generic kernel, by the chain, reproducibly'
        run: sh stages/4-toolchain-kernel/generic.sh build
      - name: 'BOOT GATE: machine #0 mounts a squashfs and stacks an overlay'
        run: sh stages/4-toolchain-kernel/generic.sh boot
      - name: 'EFI BOOT GATE: the kernel is the boot program, proven under OVMF'
        run: sh stages/4-toolchain-kernel/generic.sh efi
      - name: 'EVIDENCE: the whole logs, uploaded, always'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-kernel-logs
          path: |
            box4g/build/kbuild.log
            box4g/build/modinstall.log
            box4g/boot.log
            box4g/efiboot/serial.log
          retention-days: 7
      - name: 'LOADER: veron-boot.efi, built hermetically in the box'
        run: sh stages/4-toolchain-kernel/generic.sh loader
      - name: 'PACK: rel/ -- vmlinuz-generic, config, loader, modules, KERNEL-GENERIC-SHA256'
        run: sh stages/4-toolchain-kernel/generic.sh pack
      - name: 'PUBLISH: 4/kernel-x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # rel/ was made by `generic.sh pack`; this step adds provenance and uploads
          cp -a box4g/rel rel
          set -a; . stages/4-toolchain-kernel/pins.env; set +a
          { echo "The generic kernel: linux-$KERNEL, the pinned tarball's own"
            echo "defconfig plus veron-generic.fragment (committed, gated),"
            echo "EFI-stub boot gated under OVMF: LoadOptions -> cmdline -> root=PARTUUID,"
            echo "built by the stage-4 toolchain from 4/latest-x86_64:"
            echo "  sysroot $(cut -d' ' -f1 in/4/SYSROOT-SHA256)"
            echo "Boot-gated: squashfs + loop + overlay on machine #0."
            echo "commit $GITHUB_SHA"
            echo "run    $GITHUB_RUN_ID"
          } > rel/PROVENANCE
          cat rel/KERNEL-GENERIC-SHA256
          gh release create 4/kernel-x86_64 --title 'Veron generic kernel (x86_64)' \
            --notes 'The second stage-4 kernel: generic hardware, owned config, seed-true toolchain. Consumed by stage 6 for the live ISO.' \
            2>/dev/null || true
          gh release upload 4/kernel-x86_64 rel/* --clobber
          echo "VERON-GENERIC-PUBLISHED  $(cut -d' ' -f1 rel/KERNEL-GENERIC-SHA256 | head -1)"

      # ATTEST: THE SAME STEP EVERY OTHER PUBLISHING STAGE RUNS, ON THE
      # GENERIC KERNEL. This release is what the bare-metal flash boots
      # (tools/flash-amd64.sh pulls vmlinuz-generic and the modules from
      # here), so it is the one whose absence from the attestation chain a
      # person standing at a laptop would actually feel. Subjects are rel/*
      # -- exactly the uploaded set, PROVENANCE included, whose sysroot line
      # names the attested 4/latest-x86_64 digest this kernel was built by.
      # The upload above runs under set -eu with no fallback, so reaching
      # this step at all means the release is live; the default success
      # condition is the gate.
      - name: 'ATTEST: bind the published generic kernel to this workflow identity'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: rel/*
