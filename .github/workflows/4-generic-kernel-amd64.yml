name: 4-generic-kernel-amd64
# THE SECOND KERNEL. Stage 4 publishes two kernels from one toolchain: the
# minimal kernel inside 4/latest-x86_64 proves the chain boots; THIS one is
# the generic kernel for real hardware -- the pinned kernel's own defconfig
# plus stages/4-toolchain-kernel/generic/veron-generic.fragment, Veron's
# owned editorial voice (no distro config is a build input; see the
# fragment's coverage policy). The ISO that carries it is stage 6's job.
#
# Shaped like stage 5: a dispatch-only consumer of 4/latest-x86_64, so
# config iteration costs a kernel build, never the 2-hour bootstrap climb,
# and never touches the green stage-4 machine.
on:
  workflow_dispatch: {}
permissions:
  contents: write
  # ATTESTATION, THE SAME TWO GRANTS THE OTHER PUBLISHING STAGES CARRY:
  # id-token for Fulcio to bind the workflow identity, attestations for the
  # GH attestations API. The kernel build runs from the pinned tarball under
  # the stage-4 toolchain with no token in its environment.
  id-token: write
  attestations: write
concurrency:
  group: generic-kernel-amd64
  cancel-in-progress: false
env:
  KERNEL: '7.1.5'
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: 'IN: the sysroot contract, and the pinned kernel source'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            bubblewrap qemu-system-x86 cpio zstd python3 file >/dev/null
          # ubuntu-24.04 apparmor blocks unprivileged user namespaces;
          # without this, EVERY bwrap --unshare-all dies at namespace
          # creation. Stage 4 line 342 does the same. Two runs of this
          # workflow died with the message suppressed (86667281511,
          # 86667856298) -- hence also the unsuppressed canary in PROBE.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          mkdir -p in/4
          gh release download 4/latest-x86_64 -D in/4 --clobber
          got=$(sha256sum in/4/sysroot.tar.zst | cut -d' ' -f1)
          want=$(cut -d' ' -f1 in/4/SYSROOT-SHA256)
          [ "$got" = "$want" ] || { echo "FAIL: sysroot digest mismatch"; exit 1; }
          echo "VERON-ENTRY-OK  $got"
          # kernel source: our mirror first, upstream second, VERIFIED either way
          REL="https://github.com/$GITHUB_REPOSITORY/releases/download"
          curl -fsSL --connect-timeout 15 --max-time 900 --retry 2 \
               -o linux-$KERNEL.tar.xz \
               "$REL/src/linux-$KERNEL.tar.xz/linux-$KERNEL.tar.xz" \
            || curl -fsSL --connect-timeout 20 --max-time 900 --retry 2 \
               -o linux-$KERNEL.tar.xz \
               "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL%%.*}.x/linux-$KERNEL.tar.xz"
          sh tools/verify-source.sh linux-$KERNEL.tar.xz
          mkdir -p lfs build
          tar --zstd -xf in/4/sysroot.tar.zst -C lfs
          tar -xf linux-$KERNEL.tar.xz -C build --strip-components=1

      - name: 'PROBE: every tool the kernel build needs, named before it is missed'
        run: |
          set -eu
          # a refusal says why: a missing tool fails HERE with its name, not
          # forty minutes into the build with a cryptic recipe error
          # THE BOX SHAPE IS PHASE B's ("THE SYSROOT IS THE FILESYSTEM"),
          # copied from 4-toolchain-kernel-amd64.yml, which paid for it:
          # absolute bind, /usr/bin/sh entry, PATH=/usr/bin:/usr/sbin,
          # --unshare-all --die-with-parent. The first revision here used a
          # RELATIVE bind and env(1) -- bwrap printed usage to a suppressed
          # stderr and every tool probed MISSING (run 86667281511).
          ls -ld lfs/usr/bin/sh || { echo "FAIL: sysroot has no /usr/bin/sh"; exit 1; }
          # THE CANARY: one box invocation with stderr WIDE OPEN. If bwrap
          # itself cannot run, this says so in its own words, and the loop
          # below never gets to print a false MISSING about the sysroot.
          bwrap --unshare-all --die-with-parent \
            --bind "$PWD/lfs" / --proc /proc --dev /dev \
            --tmpfs /tmp --tmpfs /run \
            --setenv PATH /usr/bin:/usr/sbin --setenv HOME /tmp \
            /usr/bin/sh -c 'echo "  canary: the box opens; sh is $(command -v sh)"' \
            || { echo "FAIL: bwrap cannot open the box -- its own message is above"; exit 1; }
          fail=0
          for t in gcc make flex bison bc perl gzip gawk; do
            if bwrap --unshare-all --die-with-parent \
                 --bind "$PWD/lfs" / --proc /proc --dev /dev \
                 --tmpfs /tmp --tmpfs /run \
                 --setenv PATH /usr/bin:/usr/sbin --setenv HOME /tmp \
                 /usr/bin/sh -c "command -v $t" >/dev/null 2>&1; then
              echo "  ok      $t"
            else
              echo "  MISSING $t"; fail=1
            fi
          done
          [ "$fail" = 0 ] || { echo "FAIL: the sysroot lacks tools named above"; exit 1; }

      - name: 'CONFIG: defconfig + the Veron fragment, then the REQUIRED-CONFIGS gate'
        run: |
          set -eu
          box() { bwrap --unshare-all --die-with-parent \
                  --bind "$PWD/lfs" / --bind "$PWD/build" /build \
                  --proc /proc --dev /dev --tmpfs /tmp --tmpfs /run \
                  --setenv PATH /usr/bin:/usr/sbin --setenv HOME /tmp \
                  --chdir /build \
                  /usr/bin/sh -c "$*"; }
          cp stages/4-toolchain-kernel/generic/veron-generic.fragment build/
          box "make ARCH=x86_64 defconfig"
          box "sh scripts/kconfig/merge_config.sh -m .config veron-generic.fragment"
          box "make ARCH=x86_64 olddefconfig"
          # THE GATE: every fragment line must survive dependency resolution
          # verbatim. olddefconfig silently dropping a line is the classic
          # failure; here it is a listed, fatal one.
          miss=0
          while IFS= read -r line; do
            grep -Fxq "$line" build/.config || { echo "  DROPPED $line"; miss=1; }
          done < stages/4-toolchain-kernel/generic/REQUIRED-CONFIGS
          [ "$miss" = 0 ] || { echo "FAIL: the config gate lists every dropped line above"; exit 1; }
          echo "VERON-CONFIG-GATE-OK  $(grep -c '^CONFIG_' build/.config) options, all required lines held"

      - name: 'BUILD: the generic kernel, by the chain, reproducibly'
        run: |
          set -eu
          box() { bwrap --unshare-all --die-with-parent \
                  --bind "$PWD/lfs" / --bind "$PWD/build" /build \
                  --proc /proc --dev /dev --tmpfs /tmp --tmpfs /run \
                  --setenv PATH /usr/bin:/usr/sbin --setenv HOME /tmp \
                  --setenv KBUILD_BUILD_TIMESTAMP "$KBUILD_TS" \
                  --setenv KBUILD_BUILD_USER veron \
                  --setenv KBUILD_BUILD_HOST veron \
                  --chdir /build \
                  /usr/bin/sh -c "$*"; }
          KBUILD_TS="$(date -u -d @$(stat -c %Y linux-$KERNEL.tar.xz) '+%Y-%m-%d')"
          export KBUILD_TS
          # AGENTS.md invariant 9: NEVER TRUNCATE LOGS IN CI. The build
          # streams live -- the output is the heartbeat -- AND tees to
          # /build/kbuild.log, which is bind-mounted so the file survives
          # the box and uploads whole. An earlier revision wrote to the
          # box's tmpfs and tail -40'd failures: destroyed evidence, twice.
          box "make ARCH=x86_64 -j\$(nproc) 2>&1 | tee /build/kbuild.log; exit \${PIPESTATUS:-\$?}" \
            || { echo "FAIL: kbuild failed -- the FULL log streamed above and is in the kbuild-log artifact"; exit 1; }
          # DEPMOD=: SKIPS DEPMOD IN THE BOX. The sysroot has no kmod (it was
          # never in the LFS list; the minimal kernel is all built-in and
          # never needed it), so depmod resolves to busybox's applet, which
          # ignores INSTALL_MOD_PATH and chdirs to bare /lib/modules --
          # "No such file or directory", run of 2026-08-16. modules.dep is
          # DERIVED METADATA computed from the .ko set, so the host's real
          # kmod generates it below, same doctrine as mksquashfs preparing
          # test data. (kmod joins the sysroot alongside zstd when stage 4
          # next grows -- then this moves back in the box.)
          box "make ARCH=x86_64 INSTALL_MOD_PATH=/build/staging DEPMOD=: modules_install 2>&1 | tee /build/modinstall.log; exit \${PIPESTATUS:-\$?}"
          krel=$(ls build/staging/lib/modules)
          /usr/sbin/depmod -b "$PWD/build/staging" -F build/System.map -e "$krel"
          echo "depmod (host kmod): $(ls build/staging/lib/modules/$krel/modules.dep | head -1) written for $krel"
          ls -la build/arch/x86/boot/bzImage
          echo "modules: $(find build/staging/lib/modules -name '*.ko' | wc -l)"

      - name: 'BOOT GATE: machine #0 mounts a squashfs and stacks an overlay'
        run: |
          set -eu
          # host prepares test DATA; the GUEST KERNEL proves capability --
          # squashfs=y reads the medium, loop=y, overlay.ko loads, tmpfs
          # stacks: the live-boot spine, demonstrated before publishing
          sudo apt-get install -y --no-install-recommends squashfs-tools >/dev/null
          mkdir -p sqroot initrd/bin initrd/lib/modules
          echo "the payload" > sqroot/proof.txt
          mksquashfs sqroot payload.squashfs -comp zstd -quiet
          cp lfs/usr/bin/busybox initrd/bin/busybox 2>/dev/null || cp lfs/bin/busybox initrd/bin/busybox
          # overlay is =y as of fragment v6 (machine #1's fall-through,
          # 2026-08-16), so there is normally no overlay.ko -- the guest
          # then skips the insmod and the mount exercises the BUILT-IN fs,
          # which is exactly the bare-metal shape. The module path stays
          # handled so a future =m flip does not break this gate.
          ov=$(find build/staging -name 'overlay.ko*' | head -1 || true)
          [ -n "$ov" ] && cp "$ov" initrd/overlay.ko || : > initrd/no-overlay-module
          cat > initrd/init << 'INIT'
          #!/bin/busybox sh
          /bin/busybox mkdir -p /proc /sys /dev /ro /rw /work /merged
          /bin/busybox mount -t proc proc /proc
          /bin/busybox mount -t sysfs sys /sys
          /bin/busybox mount -t devtmpfs dev /dev
          [ -f /overlay.ko ] && /bin/busybox insmod /overlay.ko
          /bin/busybox mount -t squashfs -o ro /dev/vda /ro || { echo VERON-GENERIC-FAIL squashfs; /bin/busybox poweroff -f; }
          /bin/busybox mount -t tmpfs tmpfs /rw
          /bin/busybox mkdir -p /rw/up /rw/work
          /bin/busybox mount -t overlay overlay -o lowerdir=/ro,upperdir=/rw/up,workdir=/rw/work /merged \
            || { echo VERON-GENERIC-FAIL overlay; /bin/busybox poweroff -f; }
          echo written > /merged/new.txt
          /bin/busybox cat /merged/proof.txt
          echo "VERON-GENERIC-TESTS pass=2 fail=0"
          /bin/busybox poweroff -f
          INIT
          chmod +x initrd/init
          ( cd initrd && find . | cpio -o -H newc --quiet | gzip ) > initrd.img
          timeout 180 qemu-system-x86_64 -m 1024 -nographic -no-reboot \
            -kernel build/arch/x86/boot/bzImage -initrd initrd.img \
            -drive file=payload.squashfs,format=raw,if=virtio \
            -append "console=ttyS0 rdinit=/init" | tee boot.log || true
          grep -q "VERON-GENERIC-TESTS pass=2 fail=0" boot.log \
            || { echo "FAIL: the boot gate did not pass"; exit 1; }
          echo "VERON-GENERIC-BOOT-OK"

      - name: 'EFI BOOT GATE: the kernel is the boot program, proven under OVMF'
        run: |
          set -eu
          # THE CLAIM UNDER TEST: this bzImage is a complete EFI
          # application -- firmware loads it from a FAT filesystem, its
          # LoadOptions become the kernel command line, and it runs far
          # enough to parse root=PARTUUID=. No bootloader, no initramfs.
          # The host installs OVMF and qemu to TEST the guest kernel, the
          # same doctrine as squashfs-tools above: test harness, not build
          # input -- not one byte of either lands in an artifact.
          sudo apt-get install -y --no-install-recommends             qemu-system-x86 ovmf >/dev/null
          mkdir -p efiboot
          cp build/arch/x86/boot/bzImage efiboot/kernel.efi
          # THE STARTUP.NSH TRICK, AND WHY. OVMF auto-boots
          # \EFI\BOOT\BOOTX64.EFI with EMPTY LoadOptions -- which would
          # test nothing about the cmdline path. The kernel is therefore
          # placed at a NON-fallback name so autoboot finds nothing, OVMF
          # drops to its shell, and the shell runs startup.nsh -- whose
          # arguments become LoadOptions, which is exactly the mechanism a
          # real Boot#### entry uses. CRLF line ending: the EFI shell is a
          # DOS descendant and some builds require it.
          printf 'kernel.efi console=ttyS0,115200 root=PARTUUID=00000000-dead-dead-dead-000000000000 rw init=/usr/bin/dinit panic=-1\r\n'             > efiboot/startup.nsh
          timeout 300 qemu-system-x86_64             -machine q35 -m 1024 -nographic -no-reboot -nic none             -bios /usr/share/ovmf/OVMF.fd             -drive format=raw,file=fat:rw:efiboot             -serial file:efiboot/serial.log >/dev/null 2>&1 || true
          echo "--- serial (tail) ---"
          tail -60 efiboot/serial.log || true
          fail=0
          # THE x86 STUB IS SILENT ON THE HAPPY PATH -- it prints "EFI stub:"
          # lines only when it has something to report (initrd, Secure Boot),
          # so this gate's first firing failed a kernel that had stub-booted
          # perfectly (run 87005224870: LoadOptions and PARTUUID checks both
          # passed -- only possible via EFI handover). The structural witness
          # is the kernel's own EFI runtime banner, printed on every EFI boot.
          grep -Eq "efi: EFI v|EFI stub" efiboot/serial.log             && echo "  ok    EFI handover confirmed (runtime banner or stub chatter)"             || { echo "  FAIL  no EFI evidence: kernel did not boot via EFI"; fail=1; }
          grep -q "Command line:.*root=PARTUUID=00000000-dead" efiboot/serial.log             && echo "  ok    LoadOptions became the kernel command line"             || { echo "  FAIL  LoadOptions did not reach the cmdline"; fail=1; }
          grep -Eq "Cannot open root device|unknown-block|VFS: Unable to mount root" efiboot/serial.log             && echo "  ok    root=PARTUUID= parsed and searched (the deliberately bogus GUID found nothing, as designed)"             || { echo "  FAIL  the kernel never reached root mounting"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "VERON-EFISTUB-OK  no bootloader, no initramfs: the kernel IS the boot program"

      - name: 'EVIDENCE: the whole logs, uploaded, always'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-kernel-evidence
          path: |
            build/kbuild.log
            build/modinstall.log
            build/.config
            boot.log
          if-no-files-found: ignore

      - name: 'PUBLISH: 4/kernel-x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p rel
          cp build/arch/x86/boot/bzImage rel/vmlinuz-generic
          cp build/.config rel/config-generic
          tar --sort=name --owner=0 --group=0 --numeric-owner --format=gnu \
              --zstd -cf rel/modules-$KERNEL-generic.tar.zst -C build/staging .
          ( cd rel && sha256sum vmlinuz-generic config-generic \
              modules-$KERNEL-generic.tar.zst ) > rel/KERNEL-GENERIC-SHA256
          { echo "The generic kernel: linux-$KERNEL, the pinned tarball's own"
            echo "defconfig plus veron-generic.fragment (committed, gated),"
            echo "EFI-stub boot gated under OVMF: LoadOptions -> cmdline -> root=PARTUUID,"
            echo "built by the stage-4 toolchain from 4/latest-x86_64:"
            echo "  sysroot $(cut -d' ' -f1 in/4/SYSROOT-SHA256)"
            echo "Boot-gated: squashfs + loop + overlay on machine #0."
            echo "commit $GITHUB_SHA"
            echo "run    $GITHUB_RUN_ID"
          } > rel/PROVENANCE
          cat rel/KERNEL-GENERIC-SHA256
          gh release create 4/kernel-x86_64 --title 'Veron generic kernel (x86_64)' \
            --notes 'The second stage-4 kernel: generic hardware, owned config, seed-true toolchain. Consumed by stage 6 for the live ISO.' \
            2>/dev/null || true
          gh release upload 4/kernel-x86_64 rel/* --clobber
          echo "VERON-GENERIC-PUBLISHED  $(cut -d' ' -f1 rel/KERNEL-GENERIC-SHA256 | head -1)"

      # ATTEST: THE SAME STEP EVERY OTHER PUBLISHING STAGE RUNS, ON THE
      # GENERIC KERNEL. This release is what the bare-metal flash boots
      # (tools/flash-amd64.sh pulls vmlinuz-generic and the modules from
      # here), so it is the one whose absence from the attestation chain a
      # person standing at a laptop would actually feel. Subjects are rel/*
      # -- exactly the uploaded set, PROVENANCE included, whose sysroot line
      # names the attested 4/latest-x86_64 digest this kernel was built by.
      # The upload above runs under set -eu with no fallback, so reaching
      # this step at all means the release is live; the default success
      # condition is the gate.
      - name: 'ATTEST: bind the published generic kernel to this workflow identity'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: rel/*
