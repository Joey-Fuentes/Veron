# Fingerprints Veron vouches for.
#
# THIS IS A TRUST CLAIM, NOT DATA. Shipping a fingerprint asserts "this is the
# real upstream key", which is sourced from somewhere and vouched for by
# someone. Scattering keys across recipes makes the claim invisible, which is
# the failure mode this project exists to avoid -- so it lives in one file,
# reviewed line by line, each entry recording where it came from and who
# cross-checked it.
#
# Used by a human in the airlock at pin time, and later by the running system
# once GnuPG is in the package set. NEVER on the build path: builds verify
# sha256 and nothing else, which needs hashlib and no gpg, and avoids the
# circularity of needing gpg to verify the sources that build gpg.

[[key]]
upstream    = "libnl"
purpose     = "libnl release tarballs -- wpa_supplicant's nl80211 driver"
# WHAT THIS ENTRY IS SOURCED FROM, STATED EXACTLY, BECAUSE THE OTHER ENTRY IN
# THIS FILE COMES FROM A PUBLISHED KEYRING AND THIS ONE DOES NOT.
#
# The fingerprint was first read out of the signature itself with an EMPTY
# keyring -- which proves the signature binds to those bytes and proves
# nothing about who made it. It was then fetched from keys.openpgp.org, which
# publishes a user ID only when someone controlling that address answers an
# email challenge, so the key is bound to thom311@gmail.com by something other
# than the download. That address matches the owner of github.com/thom311/libnl
# by name, which is corroboration and not proof.
#
# NOT cross-checked against a distro's own pin. Arch's PKGBUILD
# `validpgpkeys` is the obvious place and takes thirty seconds.
source      = "hkps://keys.openpgp.org (uid confirmed by email challenge); first read from the .sig with an empty keyring"
fingerprint = "67DA3FAEBAE276BA58FC6CE314F18A98993AECD5"  # Thomas Haller <thom311@gmail.com>
# THE KEY IS EXPIRED AND THE SIGNATURE STILL STANDS, which is worth writing
# down because the two look like a contradiction and are not. rsa2048, created
# 2010-02-26, expired 2026-06-11. The signature on 3.12.0 was made 2025-12-04,
# BEFORE expiry, and expiry is not retroactive:
#
#   gpg: Good signature from "Thomas Haller <thom311@gmail.com>" [expired]
#   gpg: Note: This key has expired!
#
# CONSEQUENCE FOR THE NEXT VERSION BUMP: libnl 3.13 cannot be signed by this
# key unless it is extended. Whoever pins it must notice a CHANGED fingerprint
# rather than assume continuity -- and 2048 bits from 2010 is below current
# practice, so a rotation is likely rather than an extension.
#
# WHAT WAS DONE INSTEAD, AND IT IS A DIFFERENT CLAIM. The GitHub archive of
# tag libnl3_12_0 was fetched separately from the release asset and compared
# file by file: 547 files in both, 547 byte-identical, 0 differing. The 19
# extra in the release are autotools output; the 89 extra in the tag are docs,
# dotfiles and maintainer tooling, none of which compiles. That does NOT
# corroborate the key -- it corroborates that the signed bytes match the
# public source history, which is the other half of the question and the half
# a fingerprint cannot answer.
crosschecked_against = ["github tag libnl3_12_0: 547/547 shared source files byte-identical (corroborates the tarball, not the key)"]

[[key]]
upstream    = "gnu"
purpose     = "GNU release tarballs, incl. hello"
source      = "https://ftp.gnu.org/gnu/gnu-keyring.gpg"
fingerprint = "2371185508D1317BD578E5CC8CE6491AE30D7D75"  # Collin Funk, from gnu-keyring.gpg
crosschecked_against = []
