# Declared, not discovered.
#
# A stranger who rebuilds and finds three differences needs to know whether
# they found a bug or reproduced the known state of things. A list published
# after someone reports a diff is worth much less than the same list published
# before.

# ---------------------------------------------------------------------------
# RESOLVED -- including the two diagnoses that were WRONG, because both looked
# right and the next person will reach for them too.
# ---------------------------------------------------------------------------

[[resolved]]
what  = "ext4 image: superblock and inode timestamps"
found = """
VERON-IMAGE-REPRO-DIFF. cmp -l positions 1073, 1089, 1289 (superblock +48 \
s_wtime, +64 s_lastcheck, +264 s_mkfs_time), 2045-2048 (+1020 s_checksum, \
following from those) and 57353 onward (inode i_ctime/i_crtime)."""

wrong_guess_1 = """
SOURCE_DATE_EPOCH. e2fsprogs does not honour it for these fields -- verified \
by reproducing the failure locally against mke2fs 1.47.0 with the variable \
exported. The fields look exactly like the ones it governs elsewhere, which \
is why it is worth recording as tried and failed."""

wrong_guess_2 = """
A debugfs `ssv` pass. It fixed a small image and NOT a real one, for two \
reasons that only appear at scale: (a) BACKUP SUPERBLOCKS -- a 600 MB \
filesystem has copies at blocks 32768 and 98304 and `ssv` writes only the \
primary, leaving diffs at 32768*4096+49; (b) DEBUGFS RE-STAMPS s_wtime WHEN \
IT CLOSES a write session, so a later inode pass re-dirtied the field the \
earlier pass had just set."""

fix = """
tools/normalize-ext4.py, run after each mke2fs. Inode pass FIRST (debugfs, \
one -f session for every inode), superblock patch LAST and written directly \
to every copy including backups. Verified at 38,400 inodes: two images built \
two seconds apart converge on one hash, e2fsck -fn passes clean, files still \
read. About a second per 50,000 inodes."""

# ---------------------------------------------------------------------------
# OPEN -- accepted, with a reason. This section should stay short.
# ---------------------------------------------------------------------------

[[open]]
what   = "metadata_csum is disabled on the image"
why    = """
Patching the superblock invalidates s_checksum (crc32c over the first 1020 \
bytes). e2fsck cannot repair it into a reproducible state -- it stamps its \
own timestamps while repairing, so two images never converge. Rather than \
ship an unverified crc32c implementation, the feature is turned off at mkfs \
time, consistent with has_journal, dir_index and resize_inode already being \
off for determinism."""
cost   = "the image has no metadata checksumming -- a real reduction, not a free one"
reopen = "implement and verify crc32c for the superblock, then drop ^metadata_csum"

[[resolved]]
what  = "initramfs: gzip FNAME field"
found = "byte-identical cpio content produced different .gz bytes"
cause = """
GzipFile stores fileobj.name unless filename is given, so writing to \
ir1.cpio.gz and ir2.cpio.gz embedded different names -- the field `gzip -n` \
suppresses, which the code's own comment claimed to implement and did not."""
fix   = 'GzipFile(filename="", mtime=0)'

[[resolved]]
what  = "initramfs: silently empty archive"
found = "a 20-byte .cpio.gz reported as success"
cause = """
The shell builder piped to cpio with 2>/dev/null, so on a machine without \
cpio the error vanished and gzip compressed nothing. A silently empty \
initramfs panics several steps later, far from the cause."""
fix   = "written in Python (newc directly), no host cpio, hard-fails under 4 KB"
