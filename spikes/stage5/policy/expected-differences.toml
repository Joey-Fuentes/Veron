# Declared, not discovered.
#
# A stranger who rebuilds and finds three differences needs to know whether
# they found a bug or reproduced the known state of things. A list published
# after someone reports a diff is worth much less than the same list published
# before.

# ---------------------------------------------------------------------------
# RESOLVED -- kept as a record of what the check caught, what was WRONG about
# the first diagnosis, and what actually fixed it.
# ---------------------------------------------------------------------------

[[resolved]]
what  = "ext4 image: superblock and inode timestamps"
found = """
VERON-IMAGE-REPRO-DIFF. Two builds seconds apart differed at cmp -l positions \
1073, 1089, 1289 (superblock +48 s_wtime, +64 s_lastcheck, +264 s_mkfs_time), \
2045-2048 (+1020 s_checksum, following from those three) and 57353 onward \
(inode table i_ctime/i_crtime)."""
first_guess = """
WRONG. The first fix exported SOURCE_DATE_EPOCH into the image step, on the \
assumption that e2fsprogs honours it. It does not -- reproduced locally \
against mke2fs 1.47.0 with the variable set, and the same offsets still \
differed. Recorded because the wrong diagnosis is worth knowing: the fields \
look exactly like the ones SOURCE_DATE_EPOCH governs elsewhere."""
fix = """
tools/normalize-ext4.sh, run after each mke2fs. Rewrites the three superblock \
timestamps and every inode's ctime/atime/mtime/crtime to a fixed date using \
debugfs, which RECOMPUTES THE CHECKSUMS -- patching the bytes directly would \
leave s_checksum wrong, and a filesystem failing its own checksum is worse \
than one that does not reproduce. Verified: two images built two seconds \
apart converge on one hash, and e2fsck -fn passes clean afterwards. Costs \
about a second per 50,000 inodes."""

[[resolved]]
what  = "initramfs: gzip FNAME field"
found = "two archives with byte-identical cpio content produced different .gz bytes"
cause = """
Python's GzipFile stores fileobj.name in the header unless filename is given, \
so writing to ir1.cpio.gz and ir2.cpio.gz embedded different names. This is \
the field `gzip -n` suppresses, and the code's own comment claimed -n \
behaviour while not implementing it."""
fix   = 'GzipFile(filename="", mtime=0)'

[[resolved]]
what  = "initramfs: silently empty archive"
found = "a 20-byte .cpio.gz reported as success"
cause = """
The shell builder piped to cpio with 2>/dev/null, so on a machine without \
cpio the error vanished and gzip compressed nothing. A silently empty \
initramfs panics several steps later, far from the cause."""
fix   = "written in Python (newc directly), no host cpio, hard-fails under 4 KB"

# ---------------------------------------------------------------------------
# OPEN -- differences accepted, with a reason.
# ---------------------------------------------------------------------------

# None. An entry here means "this differs, we know why, we accept it" -- a
# much weaker claim than anything above, and it should stay rare.
