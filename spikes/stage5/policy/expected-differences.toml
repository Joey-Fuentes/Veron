# Declared, not discovered.
#
# A stranger who rebuilds and finds three differences needs to know whether
# they found a bug or reproduced the known state of things. A list published
# after someone reports a diff is worth much less than the same list published
# before.

# Empty at n=2, and expected to gain entries the first time an image is built
# twice. The image CONTAINER -- not the packages -- is where divergence will
# show up: filesystem UUID, ext4 directory hash seed, inode allocation order,
# GPT disk and partition GUIDs, free-space contents.
