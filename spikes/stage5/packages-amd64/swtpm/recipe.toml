# THE amd64 OVERLAY: THE BASE swtpm RECIPE MADE -all-static, for the
# same reason and by the same two moves as qemu-user's overlay. The
# stage-5 tools bundle carries a swtpm beside the static qemu so a
# foreign host with no libtpms, no json-glib and no matching glib can
# still hand a Windows 11 installer its TPM.
#
# THE DELTAS, AND WHY THEY ARE ON THE MAKE LINE (run 88783305126, this
# overlay's first link): swtpm's configure.ac resolves glib, json-glib,
# libtasn1 and libcrypto by calling `pkg-config --libs` BY NAME
# (configure.ac:161,175,235,251) -- not $PKG_CONFIG, not
# PKG_CHECK_MODULES -- so a PKG_CONFIG="pkgconf --static" environment
# reached nothing, glib's Requires.private never expanded, and the link
# died on every pcre2 symbol in libglib-2.0.a(gregex.c.o). The
# resolved values are AC_SUBST'd, which makes them make variables, and
# make variables given on the command line win: each is re-resolved
# with pkgconf --static at make time. LDFLAGS=-all-static is libtool's
# spelling and stays on the make line for the reason it always did --
# gcc does not know it, so configure's own link probe would die on it.
# Every link in swtpm's automake tree goes through libtool.
#
# swtpm_localca IS NOT BUILT HERE, MEASURED (run 88789887776): swtpm,
# swtpm_bios and swtpm_ioctl linked static; swtpm_localca then died on
# `attempted static link of dynamic object /usr/lib/libgmp.so` -- it
# links gmp directly (configure.ac:259-269, GMP_LIBS), and the gmp
# overlay ships no archive. It is a local CA whose only job is to hand
# swtpm_setup's --create-ek-cert path to swtpm_cert, which
# --without-gnutls already leaves out; without swtpm_cert it can sign
# nothing. Flipping gmp to --enable-static would rebuild nettle, gnutls,
# curl, git, libsoup and wpewebkit for a program nothing here runs, so
# the build and install steps name the src/ subdirectories they want
# (automake's SUBDIRS is a make variable and a command-line value wins)
# and neither swtpm_localca nor swtpm_cert nor the man pages, samples
# and /etc templates for the certificate path are made. The base
# recipe, dynamic, still builds all of it.
#
# THE ARCHIVES THIS PULLS, all built by this plan: libtpms.a, libcrypto.a
# (openssl, build_only), libglib/gobject/gio-2.0.a (glib overlay),
# libpcre2-8.a (pcre2 overlay), libjson-glib-1.0.a, libffi.a (libffi
# overlay, --enable-static since this run), libz.a. libtasn1 is checked
# by configure and linked by nothing this recipe builds (only swtpm_cert,
# which --without-gnutls leaves out), so no libtasn1.a is needed.
#
# [source] is byte-equal to the base recipe's; selftest enforces that.
#
name    = "swtpm"
version = "0.10.1"
group   = "system"
license = "BSD-3-Clause"
srcdir  = "swtpm-0.10.1"

# THE OTHER HALF OF A WINDOWS 11 GUEST. qemu's -tpmdev emulator speaks a
# socket to a TPM process; this is that process. `swtpm socket --tpm2
# --tpmstate dir=... --ctrl type=unixio,path=...` starts a fresh TPM 2.0
# in an empty state directory with no setup step -- swtpm_setup is only
# needed to pre-provision endorsement certificates, which Windows does
# not require -- so the bare swtpm binary is the deliverable and the
# rest ships because make installs it.
#
# gnutls, seccomp, cuse AND selinux ARE OFF BY NAME. gnutls exists only
# to build swtpm_cert, a certificate tool for the EK-provisioning path
# nothing here walks, and it would drag nettle, gmp, p11-kit and
# libtasn1 into a link that the amd64 overlay makes -all-static. seccomp
# is a sandbox for a daemon libvirt runs as a system service; here swtpm
# is a per-VM child of the launcher, killed with it. cuse wants libfuse,
# not in this set. selinux likewise.
#
# A GITHUB TAG ARCHIVE, autoreconf'd FIRST (libcap-ng shape), for the
# reason libtpms's recipe measures: the `make dist` asset the research
# inferred does not exist (mirror run 88771680471, 404 x4). The $DL name
# carries the mirror's project prefix (swtpm-v0.10.1). 0.10.1 is the
# newest release as of 2026-08-24 and requires libtpms >= 0.10.
#
# READ FROM THE PINNED TARBALL'S configure.ac (sha256 f8da11ca...), NOT
# RECALLED: --with-openssl is REQUIRED and must match libtpms's backend
# (configure.ac:567-569 errors either way if they disagree);
# --with-gnutls/--with-cuse/--with-selinux/--with-seccomp are the
# spellings, gnutls and cuse default to check, and gnutls when found
# ALSO demands certtool (configure.ac:304-307), which this set does not
# ship -- so --without-gnutls is a requirement, not a preference;
# --disable-tests (configure.ac:385) is what keeps expect, gawk, socat,
# netstat/ss and tcsd off the path AND skips the `id -u tss` check
# (configure.ac:523-535, only under have_tcsd); libtasn1, json-glib,
# glib and gthread are unconditional (configure.ac:177-255) and all in
# this set; bash is required by the PCR-bank regex check at configure
# time (configure.ac:367) and python >= 3.3 by AM_PATH_PYTHON
# (configure.ac:443) -- both declared below. swtpm_setup and
# swtpm_localca are C (src/*/Makefile.am: bin_PROGRAMS), not scripts.
#
# -Werror IS OFF BY PATCH, PRE-EMPTIVELY AND FROM THE FILE: configure.ac
# line 545 appends it unconditionally, the same author's same flag set
# that killed libtpms in run 88777336449 on this gcc's gnu23 default.
# Measured on the sibling, applied here before the plan reaches package
# 142 to learn it again. Gentoo carries the identical edit.
#
# UNBUILT AS WRITTEN; pin MEASURED by mirror run 88774599074.

[source]
url       = "https://github.com/stefanberger/swtpm/archive/refs/tags/v0.10.1.tar.gz"
sha256    = "f8da11cadfed27e26d26c5f58a7b8f2d14d684e691927348906b5891f525c684"
signature = "none detached; the v0.10.1 TAG is GPG-signed by Stefan Berger (key 75AD65802A0B4211) -- verify the tag, then pin the asset's digest"
crosschecked_against = []

[deps]
build        = ["autoconf", "automake", "libtool", "m4", "pkgconf", "bash", "python", "glib", "pcre2", "libffi", "zlib", "json-glib", "libtasn1", "libtpms", "openssl"]
link         = ["glib", "json-glib", "pcre2", "libffi", "zlib", "libtpms", "openssl"]
runtime      = []
optional_off = ["gnutls", "seccomp", "cuse", "selinux", "tests"]

[declared]
configure_flags = ["--prefix=/usr", "--with-openssl", "--without-gnutls", "--without-seccomp", "--without-cuse", "--without-selinux", "--disable-tests"]
verification    = "static-or-die asserts no DT_NEEDED on every installed binary; the Windows 11 setup screen on bare metal is the consumer-side proof"
packaged_as     = ["swtpm-static"]
# swtpm_localca and swtpm_cert absent by decision; see the header.
deferral        = """
Internals not reviewed. A TPM emulator daemon over libtpms; its consumer \
is qemu -tpmdev emulator and the guest behind it. The default tss user and \
group it names in its configuration files are for swtpm_setup's certificate \
path, which nothing here uses; the daemon itself runs as whoever launches \
the VM."""

[installs]
prefixes = ["usr/bin", "usr/lib", "usr/libexec", "usr/share"]
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/swtpm-v0.10.1.tar.gz", "-C", "$B"]]

[[steps]]
name = "autoreconf"
cwd  = "$S"
run  = [["autoreconf", "--verbose", "--force", "--install"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--with-openssl", "--without-gnutls", "--without-seccomp", "--without-cuse", "--without-selinux", "--disable-tests"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["sh", "-c", "make -C src -j$J SUBDIRS=\"utils swtpm swtpm_bios swtpm_ioctl swtpm_setup\" LDFLAGS=-all-static \"GLIB_LIBS=$(pkgconf --static --libs glib-2.0)\" \"JSON_GLIB_LIBS=$(pkgconf --static --libs json-glib-1.0)\" \"LIBCRYPTO_LIBS=$(pkgconf --static --libs libcrypto)\" \"LIBTPMS_LIBS=$(pkgconf --static --libs libtpms)\""]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["sh", "-c", "make -C src SUBDIRS=\"utils swtpm swtpm_bios swtpm_ioctl swtpm_setup\" LDFLAGS=-all-static \"GLIB_LIBS=$(pkgconf --static --libs glib-2.0)\" \"JSON_GLIB_LIBS=$(pkgconf --static --libs json-glib-1.0)\" \"LIBCRYPTO_LIBS=$(pkgconf --static --libs libcrypto)\" \"LIBTPMS_LIBS=$(pkgconf --static --libs libtpms)\" install DESTDIR=$D"]]

[[steps]]
name = "binaries-present"
cwd  = "$S"
run  = [["sh", "-c", "for b in swtpm swtpm_ioctl swtpm_bios; do test -x $D/usr/bin/$b || { echo VERON-SWTPM-MISSING $b; exit 1; }; done && echo VERON-SWTPM-BINARIES-PRESENT"]]

[[steps]]
name = "static-or-die"
cwd  = "$S"
# THE PROPERTY THE BUNDLE PROMISES, CHECKED WHERE IT IS MADE. A dynamic
# swtpm would fail on the foreign host, far from this log.
run  = [["sh", "-c", "for b in $D/usr/bin/swtpm $D/usr/bin/swtpm_ioctl $D/usr/bin/swtpm_bios $D/usr/bin/swtpm_setup; do [ -x $b ] || continue; ! readelf -d $b 2>/dev/null | grep -q NEEDED || { echo VERON-SWTPM-NOT-STATIC $b; readelf -d $b | grep NEEDED; exit 1; }; done && echo VERON-SWTPM-STATIC"]]

[guest]
test   = [["sh", "-c", "/usr/bin/swtpm --version | head -1"]]
expect = ["TPM emulator version 0.10.1"]
