# ============================================================ AMD64 OVERLAY
# A REPLACEMENT FOR packages/veron-system/recipe.toml, USED ONLY BY
# stage5-spike-amd64 (`veron --overlay packages-amd64`). The aarch64 arm never
# loads this file.
#
# WHAT DIFFERS FROM THE BASE RECIPE:
#   files/etc/dinit.d/console      -- runs a wrapper instead of naming a tty
#   files/etc/dinit.d/scripts/console-getty  -- NEW; the wrapper
#   Every other file under files/ is byte-identical to the base.
#
# THE BASE NAMES A TTY AND THE NAME IS WRONG TWICE. The console service ended:
#
#     command = /bin/busybox getty -n -l .../console-shell 115200 ttyAMA0
#     restart = true
#
# ttyAMA0 is the ARM PL011 UART. There are three places this system boots and
# that name is right in one of them:
#
#     aarch64 under qemu    ttyAMA0
#     x86_64 under qemu     ttyS0     -- what this arm passes on every cmdline
#     real hardware         tty1      -- a laptop has no serial port
#
# getty cannot open a device that is not there, so it exits 1 immediately and
# dinit restarts it, forever:
#
#     dinit: Service console process terminated with exit code 1
#     [STOPPD] console
#     [  OK  ] console
#
# WHICH READS AS THE ABSENT LOGIN THIS SYSTEM DOCUMENTS. STAGE5.md records that
# there is no login and why -- `getty -n`, an /etc/passwd naming an /etc/shadow
# that does not exist -- and that is deliberate. This is a getty that cannot
# open a tty. From across the room they are identical and the difference is the
# exit code.
#
# NOTHING IN CI COULD CATCH IT. The package tests run from init, before dinit
# exists, and all 157 pass. The console service starts afterwards and no gate
# asserts a getty stayed up. A boot can report 157 passes and hand back a
# machine nobody can type into. It was found by a person booting the image on a
# laptop, which is the only way it could have been found.
#
# THE FIX IS TO STOP NAMING IT. Every boot already passes `console=` -- that is
# how the kernel decides where to print -- so scripts/console-getty reads it
# from /proc/cmdline and execs getty on it. One file, correct on all three, and
# it cannot drift from the kernel's own idea of where the console is because it
# is reading it. The wrapper also refuses ONCE, with a message, if the named
# tty is absent, rather than exiting into the restart loop that made the
# original bug invisible.
#
# THIS BELONGS IN THE BASE AND IS NOT THERE YET. It is arch-neutral and fixes
# aarch64's hardcoded ttyAMA0 too -- but moving it moves veron-system's bytes
# and every install digest downstream on an arm that is currently green, so it
# needs its own dispatch and a re-seeding run. AMD64.md records that.
#
# THE PIN GATE IS WEAKER HERE THAN FOR ANY OTHER OVERLAY, AND SAYING SO IS
# BETTER THAN LETTING IT LOOK STRONG. `veron --overlay ... selftest` compares
# version and every [source] key -- and this package's source is
# `kind = "local"`, a PATH IN THIS REPOSITORY rather than a hashed tarball. So
# the keys match while the shipped bytes differ, which is exactly what the gate
# exists to prevent everywhere else. [source].path deliberately still names the
# base directory: changing it would fail the gate and would not make the
# statement truer. What actually pins these files is [installs].digest, which
# an overlay cannot carry. Read this overlay's files/ diff, not its gate.
#
# THE PIN IS NOT ALLOWED TO DIFFER. `veron --overlay ... selftest` compares
# version and every [source] key against packages/veron-system/recipe.toml and fails
# if they disagree, so this file can change flags and can never change what is
# built. Bump the version in both files or in neither.
# ===========================================================================

name    = "veron-system"
version = "0.1.0"
group   = "system"
license = "MIT"
srcdir  = "."

# THE FIRST PACKAGE WHOSE UPSTREAM IS US. /etc and the dinit service
# definitions are not something anyone publishes a tarball of -- they are
# decisions this project makes about the system it produces.
#
# It is a PACKAGE rather than a workflow step for one reason: a step that
# copied files into the image would bypass the DESTDIR, and therefore the
# manifest, the ledger, [installs] and the collision check. /etc would be the
# one part of the system with no record of where it came from, in a project
# whose claim is that every file traces to a recorded source. As a package,
# `veron why /etc/fstab` answers.

[source]
kind      = "local"
path      = "packages/veron-system/files"
url       = "this repository"
sha256    = "n/a -- see [installs].digest, which pins every file"
signature = "n/a -- the provenance is the commit that carries these files"
crosschecked_against = []

[deps]
# NOTHING TO BUILD AGAINST. Text files, copied. dinit is not a dependency
# here: this package installs the service definitions dinit READS, and
# installing them does not require dinit to exist. The runtime relationship is
# real and is recorded below, where it does not create a build-order edge that
# would be false.
build        = []
link         = []
runtime      = ["dinit"]
optional_off = []

[declared]
configure_flags = []
verification    = "none -- and none of this has booted yet; see the deferral"
packaged_as     = []
deferral        = """
PARTS OF THIS HAVE NOW BEEN BOOTED, and the parts that had not were wrong. \
Everything below marked MEASURED was run against the stage-4 kernel under \
qemu; the rest is still a proposal.

BUSYBOX getty, NOT agetty. agetty is util-linux, which is not in this set and \
is not planned for it. busybox is in the sysroot, statically linked, and \
already PID 1's shell in the initramfs -- so the console costs no package.

MEASURED, AND THE FIRST VERSION DID NOT WORK. `-l /bin/sh` execs the shell \
with argv[0]=/bin/sh, which is not a login shell, so /etc/profile was never \
sourced: the booted console had PATH=/sbin:/usr/sbin:/bin:/usr/bin -- \
busybox's built-in default and the REVERSE of the one /etc/profile sets -- \
and PS1 was busybox's rather than `veron# `. Reversed, every busybox applet \
in /bin shadows the real binary in /usr/bin, so the system would resolve \
busybox's tools in preference to the packages this project builds. `-l` now \
names scripts/console-shell, which sources the file and then becomes the \
shell. Verified: PATH and prompt both correct.

MEASURED: /etc/hostname SAID veron AND `hostname` SAID (none). Nothing read \
the file. early-filesystems now applies it.

THE _dhcpcd USER IS HERE BECAUSE dhcpcd COMPILES ITS NAME IN. dhcpcd's \
configure defaults PRIVSEP=yes on Linux and then probes the BUILD host with \
`getent passwd _dhcpcd _dhcp dhcpcd` to choose the account, baking the answer \
into config.h as -DPRIVSEP_USER. The sandbox has none of them, so it would \
fall back to "dhcpcd", print "No suitable user found for Priviledge \
Separation!", CONFIGURE SUCCESSFULLY, and then refuse to start on the target. \
The dhcpcd recipe states --privsepuser=_dhcpcd; this is the other half, and \
neither works alone. uid/gid 52 is unused elsewhere in this file; the home \
directory is the chroot dhcpcd drops into and its dbdir; the shell is \
/bin/false because nothing ever logs in as this.

NO COMMENTS IN passwd OR group, DELIBERATELY. glibc skips lines beginning \
with # and busybox's parser was not verified to, and a silent difference \
between the two in the file that decides who a daemon runs as is not worth a \
documentation win. Every other passwd file in the world has no comments; the \
reasoning lives here instead.

AUTOLOGIN IS THE HONEST STATE, not a shortcut. /etc/passwd names root with an \
`x` and there is no /etc/shadow, so a real login would fail closed and leave \
an unusable console. A system with no user management should say so rather \
than ship a prompt nobody can satisfy.

THE ROOT IS NOT IN /etc/fstab. Listing it would mean re-mounting the \
filesystem the file was read from. early-filesystems mounts what is missing \
and skips what is not, so it does not need to know how it was booted -- \
MEASURED as rc=0 with /proc, /sys and /dev already mounted by the initramfs.

boot.d IS A DIRECTORY OF SYMLINKS, deliberately. Adding a service becomes a \
file rather than a diff to `boot`, and dinit's `waits-for.d` is built for \
exactly that.

WHAT IS STILL MISSING FROM B5.5: the kernel is not in the image (the boot \
test supplies it from stage 4), and there is no EFI stub. switch_root into \
dinit works and is exercised on every run with boot_system."""

[undeclarable]
"program:localedef" = "Generates C.UTF-8 in the locale step. From glibc in the stage-4 sysroot; there is no locale package to depend on because glibc is not a stage-5 package."
"program:gzip" = "Decompresses glibc's UTF-8.gz charmap before localedef reads it. busybox."

[[steps]]
name = "locale"
cwd  = "$B"
shell = """
set -eu
mkdir -p "$D/usr/lib/locale"
# THE CHARMAP IS GZIPPED AND localedef IS GIVEN THE PLAIN ONE. glibc ships
# /usr/share/i18n/charmaps/UTF-8.gz, and rather than depend on how this
# localedef handles compression -- which differs between builds and is not
# worth discovering in CI -- it is decompressed first and passed by path.
gzip -dc /usr/share/i18n/charmaps/UTF-8.gz > UTF-8.charmap
localedef --prefix="$D" --no-archive -f UTF-8.charmap -i C C.UTF-8
rm -f UTF-8.charmap
ls "$D/usr/lib/locale/C.utf8/LC_CTYPE" >/dev/null
"""
why = """
THE IMAGE HAD NO LOCALES AT ALL, AND IT WAS VISIBLE IN THE FIRST WORKING
SCREENSHOT. foot draws its own errors into its window, so the desktop rendered
correctly and then showed:

    'C' is not a UTF-8 locale, and failed to find a fallback

foot tries C.UTF-8 and then en_US.UTF-8 (main.c:455) before giving up, and
neither existed: there was no /usr/lib/locale directory in the image.

WHY IT IS GENERATED RATHER THAN PINNED. localedef and the C locale source are
both already in the stage-4 sysroot -- glibc puts them there -- so this needs
no new artifact, no mirror upload and no version to track. The output is 428K
for one locale.

--no-archive GIVES A DIRECTORY, NOT locale-archive. The archive form is a
single binary blob that a reader cannot inspect and that files.tsv records as
one opaque entry; a directory records as the twelve LC_* files it is. For a
system whose manifest is the point, the directory is the right shape.

C.UTF-8 AND NOTHING ELSE. It is the locale glibc guarantees semantically --
byte-order collation, ASCII semantics -- with UTF-8 encoding, which is exactly
what a terminal needs and nothing more. Adding language locales is a decision
about what the system claims to support, and belongs with the person who wants
one.

WHAT THIS DOES NOT FIX: xkbcommon also reports "No Compose file for locale",
which comes from libX11's /usr/share/X11/locale tree. There is no X11 here, so
dead-key composition stays unavailable. That is a separate absence and not a
locale one.
"""

[[steps]]
name = "install"
cwd  = "$B"
# cp -a, NOT tar: the tree is small, the symlinks under boot.d must survive as
# symlinks, and -a preserves them. The manifest records a symlink's TARGET
# rather than a hash, so a link that silently became a copy would show up as a
# changed install set rather than passing quietly.
# THE FILES LIVE INSIDE THE PACKAGE, and that is a constraint rather than
# tidiness: the sandbox binds /packages, /policy and /tools and NOTHING else.
# A source tree under guest/ would not exist inside the box at all, and the
# step would fail on a path that looks perfectly reasonable from outside it.
# /packages-amd64/, NOT /packages/, AND THIS LINE IS WHY THE FIRST VERSION OF
# THIS OVERLAY DID NOTHING AT ALL.
#
# The base recipe hardcodes the absolute path `/packages/veron-system/files/.`
# -- the bind mount of the BASE tree inside the sandbox. An overlay recipe is
# loaded from packages-amd64/, its recipe-sha changes, the plan changes, the
# package rebuilds... and the step still copies the base tree's files. The
# edited console service sat in packages-amd64/ and never reached the image.
# Nothing fails; the build is green and the fix is absent.
#
# THE DRIVER RESOLVES patches/ AND files/ FROM THE RECIPE'S OWN DIRECTORY
# ALREADY, which is what makes an overlay's patches work. A STEP cannot say
# that: $P expands to the recipe's patches/ directory and this package has
# none, so `$P/../files` cannot resolve. A token for the recipe's own
# directory is the general fix and is recorded as open in AMD64.md.
run  = [["sh", "-c", "mkdir -p \"$D\" && cp -a /packages-amd64/veron-system/files/. \"$D/\""],
        # /var/lib/chrony OWNED BY _chrony, THE SAME AS THE BASE RECIPE.
        # chronyd drops to that account and writes its drift file and NTS key
        # cache there; root-owned, it starts, works, and relearns the drift
        # from scratch every boot with nothing reporting why.
        # THE DIRECTORY IS MADE HERE AND OWNED AT BOOT. An earlier version
        # chowned it to 53:53 in this step and the build died with
        # `chown: Invalid argument` -- package builds run unprivileged, so
        # there is no uid to give it away to, and busybox reports the refusal
        # as EINVAL rather than EPERM. scripts/chrony-start does it at boot,
        # where init is root, the same way guest/init makes /var/db/dhcpcd.
        ["sh", "-c", "mkdir -p \"$D/var/lib/chrony\""]]

[installs]
prefixes = ["etc", "etc/dinit.d", "etc/dinit.d/boot.d", "etc/dinit.d/scripts", "etc/xdg/labwc", "etc/xdg/labwc-greeter", "etc/xdg/yambar", "usr/lib/locale", "usr/share/veron", "var"]
files    = 98
digest   = "498b46662f1960de7186257fc73f3ce4f1c5732311e06acd479cfd1dd63a7580"
[guest]
test   = [["/bin/sh", "-c", "cat /etc/os-release | grep -c veron"]]
expect = ["1"]
