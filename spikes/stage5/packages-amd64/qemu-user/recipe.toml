name    = "qemu-user"
version = "11.0.3"
# THE TARBALL UNPACKS TO qemu-11.0.3, NOT qemu-user-11.0.3 -- two
# recipes share one source, and $S defaults to the package slug. The
# driver said exactly this at run 88497577805 and named the cure.
srcdir  = "qemu-11.0.3"
group   = "system"
license = "GPL-2.0-only"

# THE OVERLAY THAT EXISTS TO REPLACE ONE WORD: --static. This is the
# provenance closer -- spikes/toolbox/README.md's qemu-aarch64-static is
# "copied from /usr/bin", the one measured-but-not-built link in the chain,
# and this recipe is what replaces it with a binary the pipeline made.
# Static because the hermetic stage 0-4 sysroots are aarch64-only: no
# x86_64 loader, no host libc to lean on. Static against glibc carries the
# known NSS caveat (dlopen of libnss_* at runtime); qemu-user does not
# walk those paths -- guest binaries bring their own libc -- which is why
# every distro ships exactly this shape.
#
# Needs the OVERLAY glib and pcre2 (default_library=both / --enable-static)
# -- the base copies ship no archives, which is also why the BASE
# qemu-user is dynamic: it has to build on the arm that has none.
#
# [source] is byte-equal to the base recipe's; selftest enforces that.

[source]
url       = "https://download.qemu.org/qemu-11.0.3.tar.xz"
sha256    = "da5fcffc32762820568b828ed430a728864d34d50b6d2f30358597760cbb0523"
signature = "none -- download.qemu.org publishes digests, not detached signatures"
crosschecked_against = []

# --disable-debug-info IS A SIZE RULING, MEASURED (stage-6 run
# 88586816206): the first consumer image to carry these emulators blew
# the ruled DVD-5 ceiling by 128 MiB, and qemu default -g loads every
# binary with DWARF no gate, guest test or release-image user reads.
# The debug build stays one recipe line away when a debugger wants it.
# PYTHONHASHSEED=0 ON EVERY STEP THAT RUNS PYTHON, MEASURED: two builds
# of this recipe (runs 88828722535 and 88870267999, same commit, same
# inputs) produced a byte-identical qemu-system-x86_64 and two DIFFERENT
# qemu-system-aarch64 (.text 192 bytes apart, 40 functions changed).
# Every changed function is disas_a64/a32/mve/neon/sme_* -- the decoders
# scripts/decodetree.py generates from target/arm's .decode files, and
# decodetree iterates Python sets, whose order follows the interpreter's
# per-process hash seed. i386 decodes by hand, so x86_64 reproduced. The
# global [env] is frozen by selftest, so the seed is pinned here, on the
# steps that run python (configure runs meson; build runs decodetree).

[deps]
# python-setuptools AND python-wheel ARE CONFIGURE DEPENDENCIES, FOUND BY
# BUILDING (run 88488793190): qemu's mkvenv builds a non-isolated venv and
# its [tooling] group expects both from SYSTEM site-packages; absent, pip
# walked to pypi.org and the network-less sandbox failed the step. The
# venv then installs only qemu's own vendored wheels, offline.
build        = ["meson", "ninja", "python", "bash", "pkgconf", "python-setuptools", "python-wheel", "glib", "zlib", "pcre2"]
link         = ["glib", "zlib", "pcre2"]
runtime      = []
optional_off = ["rust", "docs", "guest-agent", "system", "tools", "pixman"]

[declared]
configure_flags = ["--prefix=/usr", "--static", "--target-list=aarch64-linux-user", "--disable-debug-info", "--disable-system", "--disable-tools", "--disable-docs", "--disable-werror", "--disable-guest-agent", "--disable-rust"]
packaged_as     = ["qemu-user-static"]
verification    = "no-DT_NEEDED asserted by the static-or-die step below"
deferral        = """
Internals not reviewed. Identical target and cuts to the base recipe; the \
deltas are --static, the -static suffix on the installed name (matching \
what stage 0-4 workflows and the toolbox README already invoke), and \
runtime deps emptied because a static binary carries its closure."""

[installs]
prefixes = ["usr/bin"]
files    = 1
digest   = "56d39e97daa66bed841885283b9de73a8af6c09c1ed2fffa9ce6c882b2feda94"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/qemu-11.0.3.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
# CMAKE IS SET HERE BECAUSE THE POLICY CANNOT REACH THIS STEP, AND THE
# SECOND CONFIGURE FAILURE (run 88492797957) IS THE MEASUREMENT. policy
# [tool_env.meson] keys on argv[0], and this step's argv[0] is sh: qemu
# runs meson from inside its own configure, one exec away from where the
# policy looks. Undefined $CMAKE let meson find the staged cmake 4.2.3
# and die parsing its trace output at meson.build:1818 -- the exact
# crash the policy exists to prevent, one wrapper deeper. The value is
# the policy's own, stated per the defaults.toml rule that a recipe
# declaring a name outright wins.
env  = { CMAKE = "/nonexistent/veron-cmake-is-not-a-dependency-backend", PYTHONHASHSEED = "0" }
run  = [["sh", "-c", "mkdir -p _b && cd _b && ../configure --prefix=/usr --static --target-list=aarch64-linux-user --disable-debug-info --disable-system --disable-tools --disable-docs --disable-werror --disable-guest-agent --disable-rust"]]

[[steps]]
name = "build"
cwd  = "$S"
env  = { PYTHONHASHSEED = "0" }
run  = [["make", "-C", "_b", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "-C", "_b", "DESTDIR=$D", "install"]]
[[steps]]
name = "no-shared-payload"
cwd  = "$S"
# EVERYTHING UNDER usr/share/qemu GOES, WHOLESALE (run 88526022859):
# with system emulation disabled, make install still ships the TARBALL'S
# PREBUILT firmware -- bios-256k.bin and friends, upstream's binaries,
# the exact bytes the qemu recipe's gates exist to bar -- plus keymaps
# and trace data. The amd64 arm caught it as a path collision against
# the qemu package's self-built firmware set; the conviction reaches
# further back: this recipe shipped those blobs into every image since
# it first built, declaring [installs] usr/bin all the while. A
# user-mode emulator needs none of it -- its install set is the binary
# in usr/bin and nothing else, and now that is true by construction.
run  = [["sh", "-c", "rm -rf $D/usr/share/qemu"]]

[[steps]]
name = "static-suffix"
cwd  = "$S"
run  = [["mv", "$D/usr/bin/qemu-aarch64", "$D/usr/bin/qemu-aarch64-static"]]

[[steps]]
name = "static-or-die"
cwd  = "$S"
# THE PROPERTY THE NAME PROMISES, CHECKED WHERE IT IS MADE. A dynamic
# binary called -static would fail exactly where it matters most: inside
# a sysroot with no loader, far from this log.
run  = [["sh", "-c", "! readelf -d $D/usr/bin/qemu-aarch64-static 2>/dev/null | grep -q NEEDED || { echo 'VERON-QEMU-NOT-STATIC'; readelf -d $D/usr/bin/qemu-aarch64-static | grep NEEDED; exit 1; }"]]
[guest]
test   = [["sh", "-c", "/usr/bin/qemu-aarch64-static --version | head -1"]]
expect = ["qemu-aarch64 version 11.0.3"]
