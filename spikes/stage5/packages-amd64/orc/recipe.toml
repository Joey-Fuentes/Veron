# ============================================================ AMD64 OVERLAY
# A REPLACEMENT FOR packages/orc/recipe.toml, USED ONLY BY
# stage5-spike-amd64 (`veron --overlay packages-amd64`). The aarch64 arm never
# loads this file.
#
# WHAT DIFFERS FROM THE BASE RECIPE:
#   -Dorc-target=neon -> -Dorc-target=all.
#
# THIS WAS -Dorc-target=sse AND THAT WAS WRONG. It was written from the base
# recipe's reasoning -- name the one backend this machine can execute -- which
# is correct on aarch64 and does not survive contact with orc's x86 sources.
# Run 85293418080 stopped at package 81 of 122:
#
#     ld: orcx86insn.c.o: in function `orc_x86_output_insns':
#         undefined reference to `orc_x86_get_regname_mmx'
#
# and meson's own summary shows exactly why:  SSE : YES   MMX : NO.
#
# SSE IS NOT SEPARABLE FROM MMX ON x86. orcx86insn.c is compiled whenever any
# x86 backend is on, and it calls the MMX register-name helper unconditionally
# -- that symbol lives in the MMX backend, which -Dorc-target=sse leaves out.
# aarch64 has no equivalent because NEON is the only ARM backend, so nothing
# there depends on a second one being present.
#
# WHY all RATHER THAN THE NARROWER sse,mmx. That value would express the
# intent exactly, and whether meson ACCEPTS it depends on whether orc-target
# is an array option or a combo -- a combo rejects it at setup. The tarball's
# meson_options.txt is the only place that answers it and it was not read; a
# guess costs a full rebuild, because no checkpoint has ever been published on
# this architecture and every run starts at package 1. `all` is orc's
# documented default, is what every distribution ships on x86_64, and cannot
# be rejected under either option type.
#
# WHAT all COSTS, STATED RATHER THAN GLOSSED. The base recipe declines `all`
# on aarch64 because it drags in backends that machine cannot execute, and
# that argument applies here too: this liborc will contain code generators for
# mips, altivec and c64x. They are PURE C EMITTERS -- they generate bytes for
# another architecture rather than executing them -- so they compile and link
# anywhere, and orc dispatches on runtime CPU detection. The cost is library
# size, not correctness. NARROWING THIS TO sse,mmx IS THE FOLLOW-UP, and it
# needs one look at meson_options.txt, not another run.
#
# THE PIN IS NOT ALLOWED TO DIFFER. `veron --overlay ... selftest` compares
# version and every [source] key against packages/orc/recipe.toml and fails
# if they disagree, so this file can change flags and can never change what is
# built. Bump the version in both files or in neither.
# ===========================================================================

name    = "orc"
version = "0.4.41"
group   = "media"
license = "BSD-2-Clause"
srcdir  = "orc-0.4.41"

[source]
url       = "https://gstreamer.freedesktop.org/src/orc/orc-0.4.41.tar.xz"
sha256    = "cb1bfd4f655289cd39bc04642d597be9de5427623f0861c1fc19c08d98467fa2"
signature = "none -- gstreamer.freedesktop.org publishes no detached signature"
crosschecked_against = []

[deps]
build        = ["meson", "ninja", "pkgconf"]
link         = []
runtime      = []
optional_off = ["orc-test", "benchmarks", "examples", "gtk_doc", "tests"]

[declared]
configure_flags = ["--libdir=lib",
                   "-Dorc-test=disabled", "-Dbenchmarks=disabled",
                   "-Dexamples=disabled", "-Dgtk_doc=disabled",
                   "-Dtests=disabled", "-Dtools=enabled",
                   "-Dorc-target=all", "--wrap-mode=nofallback"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["orc"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 matches \
MIRRORS.tsv on both routes.

WHY IT IS A PACKAGE AND NOT A SUBPROJECT. gst-plugins-base/meson.build:399 is

    orc_dep = dependency('orc-0.4', version: orc_req,
                         required: get_option('orc'), allow_fallback: true)

-- and `allow_fallback: true` means that without an installed orc, meson would \
CLONE AND BUILD ITS OWN COPY as a subproject. --wrap-mode=nofallback forbids \
that, which turns a silent second build into a configure failure. Installing \
orc properly is the answer to both.

WHAT IT DOES: orc is a just-in-time compiler for SIMD array operations. \
GStreamer's audio conversion, resampling and video scaling dispatch through it \
at runtime, so its absence is not a build failure -- it is a large and \
invisible slowdown, which is the class of thing this project keeps declining \
to leave to chance.

orc-target=neon RATHER THAN THE DEFAULT all. The option selects which SIMD \
backends are compiled in, and `all` includes avx, sse, mmx, mips, altivec and \
c64x -- none of which an aarch64 machine can execute. Naming neon states the \
one that is real here. THIS IS A JIT, so the backend decides what code gets \
GENERATED at runtime rather than merely which functions exist.

tools STAYS ENABLED. `orcc` is the Orc compiler, and gst-plugins-base uses it \
at BUILD time to turn .orc source files into C. Disabling it would not save \
much and would break a consumer."""

[installs]
prefixes = ["usr/bin", "usr/include/orc-0.4", "usr/lib", "usr/lib/pkgconfig"]
files    = 35
digest   = "0646fb5348e5dbc0f2a66d60be974e21dedd45bc5f187a715c222bceb337881a"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/orc-0.4.41.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release", "--libdir=lib",
         "--wrap-mode=nofallback",
         "-Dorc-test=disabled", "-Dbenchmarks=disabled", "-Dexamples=disabled",
         "-Dgtk_doc=disabled", "-Dtests=disabled", "-Dtools=enabled",
         "-Dorc-target=all"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "orc-0.4"]]
expect = ["0.4.41"]
