# OVERLAY, AND THE DELTA IS ONE MESON FLAG: -Ddefault_library=both. The
# amd64 arm needs glib-2.0.a (and its Requires.private closure -- see the
# pcre2 overlay) to link qemu-user --static, the toolbox provenance binary.
# The base recipe is otherwise reproduced whole, per the overlay rule that
# a reader of one recipe sees everything; selftest holds version, url and
# sha256 equal to the base. patches/ is carried verbatim for the same
# reason -- recipe-sha hashes it, and the build applies it from THIS dir.
name    = "glib"
version = "2.86.4"
group   = "text-rendering"
license = "LGPL-2.1-or-later"

# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://download.gnome.org/sources/glib/2.86/glib-2.86.4.tar.xz"
sha256    = "d4e2b5d791d5015ffd8c6971ad8e975a0a55c1a14926cdb25cf843ff00682260"
signature = "none -- download.gnome.org publishes no detached signature"
crosschecked_against = []

[deps]
# BASH IS A BUILD DEPENDENCY, discovered by building: glib's meson.build
# looks for it and crashes outright when it is missing. pkgconf is a real
# build dependency and was invisible for 55 packages; stage5-isolate found
# it. Full archaeology in the base recipe -- the history happened there,
# and duplicating its every scar would make THIS file's one real delta
# harder to see.
build        = ["meson", "ninja", "libffi", "pcre2", "zlib", "python", "bash", "pkgconf"]
link         = ["libffi", "pcre2", "zlib"]
runtime      = ["libffi", "pcre2", "zlib"]
optional_off = ["introspection", "selinux", "libmount", "sysprof", "man-pages", "gtk_doc", "tests", "dtrace", "systemtap", "packaging", "libelf"]

[declared]
configure_flags = ["-Dman-pages=disabled", "-Dgtk_doc=false", "-Dtests=false", "-Dintrospection=disabled", "-Dselinux=disabled", "-Dlibmount=disabled", "-Dsysprof=disabled", "-Dlibelf=disabled", "-Ddefault_library=both"]
packaged_as     = ["glib2"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. Everything the base recipe defers, plus: \
-Ddefault_library=both doubles the compile of the libraries but installs \
the same headers and the same .so set beside the new .a set, so dynamic \
consumers are byte-unaffected in what they link, and the install-set \
digest (re-seeded) is what proves the growth is archives and nothing \
else."""

[undeclarable]
# The base recipe's [undeclarable] table applies unchanged; the entries are
# properties of glib 2.86.4's build files, which this overlay does not
# alter. Reproduced by reference deliberately -- these lines answer to the
# tarball, not to the overlay's flag.
"program:bash" = "Declared in deps.build; glib's meson.build crashes without it. Found by building."
"program:dtrace" = "Feature defaulting to 'auto', off because dtrace is absent. Listed in optional_off."
"program:env" = "Looked for only when 'tests' is on; this recipe disables it."
"program:g-ir-scanner" = "Looked for only when 'introspection' is on; this recipe disables it."
"program:gi-docgen" = "Guarded by get_option('documentation'), default false; reports REQUIRED because the subdir is entered unconditionally."
"program:pkg-config" = "Provided by pkgconf, built at rung 11 and on PATH for everything after it."
"program:rst2html5" = "required: get_option('documentation'), a boolean defaulting to false."
"program:rst2man" = "Looked for only when 'man-pages' is on; this recipe disables it."
"program:sh" = "Provided by busybox in the sandbox; the box is busybox throughout."
"program:valgrind" = "Instrumentation for the test suite. -Dtests=false."
"program:xgettext" = "required: get_option('nls'), feature defaulting to 'auto'. Load-bearing absence; -Dnls=enabled would make gettext a hard dependency."

[installs]
prefixes = ["usr/bin", "usr/include/gio-unix-2.0", "usr/include/glib-2.0", "usr/lib", "usr/lib/glib-2.0", "usr/lib/pkgconfig", "usr/libexec", "usr/share/aclocal", "usr/share/bash-completion", "usr/share/gdb", "usr/share/gettext", "usr/share/glib-2.0"]
files    = 379
digest   = "UNSEEDED FOR THIS OVERLAY -- base digest b9faf973 describes the archive-less build; first seed_installs run measures this one"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/glib-2.86.4.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
# The patch and the $CMAKE policy story live in the base recipe's setup
# comment; both mechanisms are unchanged here. patches/ in this dir is a
# byte copy of the base's.
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release",
         "-Dman-pages=disabled", "-Dgtk_doc=false", "-Dtests=false",
         "-Dintrospection=disabled", "-Dselinux=disabled",
         "-Dlibmount=disabled", "-Dsysprof=disabled", "-Dlibelf=disabled",
         "-Ddefault_library=both"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }

[[steps]]
name = "archives-present"
cwd  = "$S"
# The delta, checked where it is claimed: the flag exists to produce
# glib-2.0.a, so its absence is a failure HERE rather than a link error
# three packages later in qemu-user.
run  = [["sh", "-c", "ls $D/usr/lib/libglib-2.0.a >/dev/null || { echo 'VERON-GLIB-NO-ARCHIVE'; ls $D/usr/lib/ | head -40; exit 1; }"]]
[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "glib-2.0"]]
expect = ["2.86.4"]
