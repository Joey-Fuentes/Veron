name    = "edk2-firmware"
version = "stable202608"
group   = "system"
srcdir  = "edk2-edk2-stable202608"
license = "BSD-2-Clause-Patent"

# THE amd64 ARM'S HALF: OvmfPkgX64, replacing the base recipe's
# ArmVirtQemu -- read that recipe for the pin-set provenance (run
# 88505453858), the GCC-not-GCC5 correction, and the split's rationale.
# What is DIFFERENT here is measured on this architecture: a trial build
# on the assembled pinned tree ran to the first ASL compile and stopped
# at exactly "iasl: not found" (RamDiskDxe/RamDisk.asl), which is why
# acpica and nasm sit in deps.build below; BaseTools' C tools and 657
# openssl objects compiled clean before that boundary. The three FV
# outputs land beside qemu's firmware in /usr/share/qemu -- the default
# -L path -- so the stage-6 gate's -bios flag needs a path, not a mount.

[source]
url       = "https://github.com/tianocore/edk2/archive/refs/tags/edk2-stable202608.tar.gz"
sha256    = "bac40812213576c3025cf780c33d882f9e087a44201b1cd28a07f6d1eb54b76a"
signature = "none published by upstream; sha pinned at first trusted fetch, run 88505453858"
crosschecked_against = []

# THE COURIER LIST GREW BY MEASUREMENT: run 88511513325 died in metadata
# because .dec files DECLARE paths inside submodules no module compiles,
# and build.py stats every one -- mipisyst (MdePkg.dec:33), mbedtls
# (CryptoPkg.dec:34-36), libspdm (SecurityPkg.dec:26). Directory-required
# is a different set from compile-required; both are now pinned, and a
# container rebuild with exactly this set (seven others emptied) passed
# metadata to the identical compile frontier.
#
# THE SECOND BROTLI EXTRACTION LOST ITS -C ONCE (run 88514828878): the
# edit that appended the three dec-couriers consumed the target clause,
# brotli unpacked into the TREE ROOT, MdeModulePkg's directory stayed
# empty, and the parser said so -- while the run before that edit had
# passed the same check. Every extraction below names its destination;
# a tar without -C in this chain is wrong by construction.
# TPM2_ENABLE AND SECURE_BOOT_ENABLE ARE ON, FOR ONE CONSUMER: a Windows
# 11 installer run on this image. Its setup check wants a TPM 2.0 the
# firmware exposes (Tcg2Dxe -- qemu builds the ACPI TPM2 table, but the
# guest also expects the TCG2 protocol and the measured-boot event log
# that only the firmware provides) and a UEFI that reports Secure Boot
# *capable*; with SECURE_BOOT_ENABLE off OVMF reports it unsupported.
# Capable is not enabled: no keys are enrolled here, and a user who
# wants Secure Boot on enrolls the Microsoft certificates from the
# firmware setup menu. SMM_REQUIRE stays off -- it would need q35 with
# smm=on on every gate command line for a protection nobody here needs.
# This is the variant every distribution ships as its Win11 firmware
# (OVMF_CODE.secboot.fd, OVMF_CODE_4M.secboot.fd).
#
# UNMEASURED AS WRITTEN: both -D flags are edk2's documented names for
# OvmfPkgX64.dsc, and both are exercised by upstream CI, but this
# recipe has not been through a run with them on. The three FV files
# grow; their digests re-seed from that run.
[deps]
build        = ["python", "bash", "nasm", "acpica", "edk2-src-openssl", "edk2-src-brotli", "edk2-src-mipisyst", "edk2-src-mbedtls", "edk2-src-libspdm"]
link         = []
runtime      = []
optional_off = ["network"]

[declared]
configure_flags = ["-a", "X64", "-t", "GCC", "-p", "OvmfPkg/OvmfPkgX64.dsc", "-b", "RELEASE", "-D", "TPM2_ENABLE=TRUE", "-D", "SECURE_BOOT_ENABLE=TRUE"]
verification    = "fv-present step asserts all three .fd outputs exist, sha256-logged with sizes"
deferral        = """
GenFv embeds timestamps and edk2 has no single SOURCE_DATE_EPOCH switch; \
byte-determinism is MEASURED by the install-digest pin across consecutive \
runs rather than asserted. If the digest moves between identical inputs, \
the timestamp hazard is the first suspect and gets its own commit."""

[installs]
prefixes = ["usr/share/qemu"]
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/edk2-stable202608.tar.gz", "-C", "$B"]]

[[steps]]
name = "plant-submodules"
cwd  = "$S"
run  = [["sh", "-c", "tar -xzf /usr/src/edk2/openssl.tar.gz --strip-components=1 -C CryptoPkg/Library/OpensslLib/openssl && tar -xzf /usr/src/edk2/brotli.tar.gz --strip-components=1 -C BaseTools/Source/C/BrotliCompress/brotli && tar -xzf /usr/src/edk2/brotli.tar.gz --strip-components=1 -C MdeModulePkg/Library/BrotliCustomDecompressLib/brotli && tar -xzf /usr/src/edk2/mipisyst.tar.gz --strip-components=1 -C MdePkg/Library/MipiSysTLib/mipisyst && tar -xzf /usr/src/edk2/mbedtls.tar.gz --strip-components=1 -C CryptoPkg/Library/MbedTlsLib/mbedtls && tar -xzf /usr/src/edk2/libspdm.tar.gz --strip-components=1 -C SecurityPkg/DeviceSecurity/SpdmLib/libspdm"]]

[[steps]]
name = "basetools"
cwd  = "$S"
run  = [["make", "-C", "BaseTools", "-j$J"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["sh", "-c", "export WORKSPACE=$S && . ./edksetup.sh && build -a X64 -t GCC -p OvmfPkg/OvmfPkgX64.dsc -b RELEASE -D TPM2_ENABLE=TRUE -D SECURE_BOOT_ENABLE=TRUE -n $J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["sh", "-c", "for f in OVMF.fd OVMF_CODE.fd OVMF_VARS.fd; do install -D -m644 Build/OvmfX64/RELEASE_GCC/FV/$f $D/usr/share/qemu/$f || exit 1; done"]]

[[steps]]
name = "fv-present"
cwd  = "$S"
run  = [["sh", "-c", "cd $D/usr/share/qemu && for f in OVMF.fd OVMF_CODE.fd OVMF_VARS.fd; do test -s $f || { echo VERON-OVMF-MISSING $f; exit 1; }; done && sha256sum OVMF*.fd && wc -c OVMF*.fd"]]

[guest]
test   = [["sh", "-c", "test -s /usr/share/qemu/OVMF.fd && echo VERON-UEFI-FIRMWARE-PRESENT"]]
expect = ["VERON-UEFI-FIRMWARE-PRESENT"]
