name    = "freetype"
version = "2.14.1"
group   = "text-rendering"
license = "FTL-or-GPL-2.0"
srcdir  = "freetype-2.14.1"
# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://downloads.sourceforge.net/freetype/freetype-2.14.1.tar.xz"
sha256    = "32427e8c471ac095853212a37aef816c60b42052d4d9e48230bab3bdf2936ccc"
signature = "https://downloads.sourceforge.net/freetype/freetype-2.14.1.tar.xz.sig"
crosschecked_against = []

[deps]
build        = ["zlib", "libpng", "harfbuzz"]
link         = ["zlib", "libpng", "harfbuzz"]
runtime      = ["zlib", "libpng", "harfbuzz"]
optional_off = ["brotli", "bzip2"]

[declared]
configure_flags = ["--prefix=/usr", "--disable-static", "--with-harfbuzz", "--without-brotli", "--enable-freetype-config"]
# THEY DO NOT USE OUR NAME. Without this the reconciler looks up
# "freetype", finds no PKGBUILD, and reports the package as
# uncorroborated -- which is a false absence, not a real one.
packaged_as     = ["freetype2"]
verification    = "none -- upstream suites are not run"
deferral        = """
FREETYPE AND HARFBUZZ DEPEND ON EACH OTHER. freetype can use harfbuzz to \
improve auto-hinting of complex scripts; harfbuzz needs freetype to read the \
font files it shapes. Neither can be built first with both features on.

THE BREAK IS TWO SEPARATE RECIPES, NOT A FLAG ON ONE. `freetype-bootstrap` \
builds without harfbuzz, harfbuzz builds against it, then `freetype` rebuilds \
with harfbuzz enabled and replaces it. They are genuinely two different \
artifacts with different bytes and different capabilities, so they get two \
names, two ledger records, and the topological sort handles them with no \
special case. A `pass = 1/2` field would have needed driver support and made \
one name mean two things.

THIS IS THE ONE THAT SHIPS. It overwrites freetype-bootstrap's install when \
staged. --without-brotli drops WOFF2 font decompression: brotli is in the \
planned set for the browser, and this should be revisited then, because a \
browser without WOFF2 cannot load a large fraction of web fonts."""

[undeclarable]
# Lookups that no .pc name can answer, disclosed per ROADMAP.md rule 4.
# Locations come from `probe.py reconcile`; every reason is read from the
# tarball. Entries whose reason could be DERIVED -- a build file this recipe
# never invokes, an option the argv disables, an applet busybox provides --
# were drafted by `--propose`; the rest were answered by hand.
# meson.build:38 python3 (REQUIRED)
"program:python3" = "NOT THIS PACKAGE'S BUILD. meson.build is meson's; this recipe drives ./configure, so that file is never read."

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/freetype-2.14.1.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-static", "--with-harfbuzz", "--without-brotli", "--enable-freetype-config"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]
[guest]
# 26.4.20, NOT 27.6.1 -- AND THE OLD VALUE WAS NEVER MEASURED. freetype2.pc
# carries the LIBTOOL version, not the release: freetype 2.14.1 reports
# 26.4.20. The 27.6.1 in this field was a plausible-looking number that
# nothing had ever checked, and it was then quoted elsewhere as though it were
# evidence -- including in this project's own reading of harfbuzz's and
# cairo's version constraints.
#
# THE CONCLUSIONS STILL HOLD, which is luck rather than method: harfbuzz needs
# `freetype2 >= 12.0.6`, cairo needs `>= 23.0.17` and `>= 25.0.19` for COLRv1,
# and 26.4.20 clears all three. A wrong number that happens to satisfy every
# constraint is the kind of error that survives for a long time.
test   = [["/usr/bin/pkgconf", "--modversion", "freetype2"]]
expect = ["26.4.20"]