name    = "sdl2"
version = "2.32.10"
group   = "system"
license = "Zlib"
srcdir  = "SDL2-2.32.10"

# THE DISPLAY qemu OPENS ON BARE METAL. qemu has no Wayland display of
# its own: its GUI backends are sdl, gtk, vnc, spice and dbus, and of
# those only SDL2 can be built from this package set (GTK would bring
# the whole GTK stack, and this system declines it). SDL2's Wayland
# video driver is what puts a qemu window on labwc.
#
# SDL_AUDIO IS OFF: sound in a guest goes through qemu's own ALSA
# backend on alsa-lib-static, not through SDL's audio subsystem. SDL is
# here to put a window on Wayland, and its surface stays exactly what
# was measured; audio through it would add SDL's audio layer between
# the guest and libasound for no gain. (alsa-lib will not build shared
# and static from one tree -- run 88903036799 -- which is why the static
# archive is its own package.)
#
# THE WINDOW GETS ITS PIXELS BY wl_shm, BY PATCH (0002), MEASURED: with
# the backends linked in and GL off, the protocol handshake completed on
# bare metal and on a purpose-built compositor and no buffer was ever
# attached -- upstream's Wayland driver draws only through EGL and has
# no software framebuffer path. patches/0002 adds one on the driver's
# own shm helper; SDL_video.c reaches it only when no accelerated
# renderer exists. First compiled by this recipe's build; first measured
# by the bundle that build produces.
#
# ONE STATIC ARCHIVE, PLATFORM LIBRARIES LINKED IN, NO dlopen ANYWHERE.
# SDL_SHARED is OFF and SDL_STATIC is ON because the consumer is a
# --static qemu. SDL_WAYLAND_SHARED and SDL_ALSA_SHARED are OFF too --
# and that is a REVERSAL, measured (bare metal, 2026-08-25): the first
# version left them ON, the distro shape, so SDL would dlopen
# libwayland-client, libxkbcommon and libasound at runtime and the
# archive would need none of their .a files. Inside a static-glibc
# binary that dlopen loads a SECOND libc for the shared library, and
# across that seam libasound segfaulted at its first call (dmesg:
# segfault at 8 in libasound.so.2.0.0) and libwayland-client went
# silent after its first roundtrip -- a window that acked its configure
# and never attached a buffer, invisible and unlisted. On the image the
# binary was built for. So the backends link statically: the wayland,
# libxkbcommon and alsa-lib overlays ship the archives, and the
# no-dynamic-loading step below refuses an SDL that would dlopen.
#
# WHAT wayland-egl IS DOING IN A BUILD WITH NO GL: SDL_waylandwindow.c
# calls wl_egl_window_create/resize/destroy under a RUNTIME flag
# (SDL_WINDOW_OPENGL), not an #ifdef, so libwayland-egl.a must link
# even though no window here ever sets that flag. It is libwayland's,
# tiny, and has no EGL dependency of its own. mesa's libEGL is another
# matter: SDL's CheckWayland probed egl in the same group and put -lEGL
# on the static link (sdlchecks.cmake:661, 723), and mesa makes no
# libEGL.a. patches/0001 probes egl only when a GL API is on; with
# both off no EGL symbol is referenced (SDL_waylandopengles.c is under
# SDL_VIDEO_OPENGL_EGL), and mesa leaves this recipe's dependencies.
# wayland-scanner is found via `pkg-config --variable=wayland_scanner`
# and the protocol XML via wayland-protocols' pkgdatadir -- SDL vendors
# neither, so both packages are build dependencies by measurement.
# X11 and KMSDRM are OFF by name: no X libraries exist in this set, and
# the compositor is the only thing that should touch KMS.
#
# UNBUILT AS WRITTEN. This recipe is written from the SDL2 CMake option
# set as documented for 2.30-2.32; it has not yet been through a run.
# Runs 88822423552 and 88824372958 measured the option names (only
# SDL_FCITX was not one; it is auto-detected from ibus) and the Wayland
# probe (both drivers present in the generated header). What this
# revision has not been through a run is the STATIC link of the two
# backends and the qemu link that follows.
#
# VERSION AND DIGEST: the version is the newest 2.32 this recipe's
# author knew of; the pin is PENDING because no network reached this
# tarball when the recipe was written. The URL is in gap3-urls.txt;
# stage5-mirror-upload fetches it, measures it, and the measured digest in
# MIRRORS.tsv is pasted into this file. If upstream has
# no 2.32.10 the mirror run says FETCH FAILED and this version, url,
# srcdir and the unpack step's filename move together.

[source]
url       = "https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz"
sha256    = "5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165"
signature = "https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz.sig -- detached PGP by the SDL release key; verify against the fingerprint on libsdl.org before pinning"
crosschecked_against = []

[deps]
# wayland supplies wayland-scanner and the wayland-client/-cursor/-egl
# headers, .pc files and archives; wayland-protocols the XML the scanner
# reads; libxkbcommon its header, .pc and archive. The archive itself carries no DT_NEEDED (it is an
# archive); link names what sdl2.pc's Libs.private hands the consumer.
build        = ["cmake", "ninja", "pkgconf", "wayland", "wayland-protocols", "libxkbcommon"]
link         = ["wayland", "libxkbcommon"]
runtime      = []
optional_off = ["shared", "wayland-shared", "audio", "alsa", "x11", "kmsdrm", "opengl", "opengles", "vulkan",
                "libdecor", "pulseaudio", "pipewire", "jack", "sndio",
                "libudev", "dbus", "ibus", "fcitx", "joystick", "haptic",
                "hidapi", "sensor", "power", "libsamplerate", "test",
                "rpath", "ccache"]

[declared]
configure_flags = ["-DCMAKE_INSTALL_PREFIX=/usr", "-DCMAKE_INSTALL_LIBDIR=lib", "-DCMAKE_BUILD_TYPE=Release",
                   "-DSDL_SHARED=OFF", "-DSDL_STATIC=ON", "-DSDL_STATIC_PIC=ON",
                   "-DSDL_WAYLAND=ON", "-DSDL_WAYLAND_SHARED=OFF", "-DSDL_WAYLAND_LIBDECOR=OFF",
                   "-DSDL_X11=OFF", "-DSDL_KMSDRM=OFF",
                   "-DSDL_OPENGL=OFF", "-DSDL_OPENGLES=OFF", "-DSDL_VULKAN=OFF",
                   "-DSDL_AUDIO=OFF",
                   "-DSDL_ALSA=OFF", "-DSDL_PULSEAUDIO=OFF", "-DSDL_PIPEWIRE=OFF", "-DSDL_JACK=OFF", "-DSDL_SNDIO=OFF",
                   "-DSDL_LIBUDEV=OFF", "-DSDL_DBUS=OFF", "-DSDL_IBUS=OFF",
                   "-DSDL_JOYSTICK=OFF", "-DSDL_HAPTIC=OFF", "-DSDL_HIDAPI=OFF",
                   "-DSDL_SENSOR=OFF", "-DSDL_POWER=OFF", "-DSDL_LIBSAMPLERATE=OFF",
                   "-DSDL_TEST=OFF", "-DSDL_RPATH=OFF", "-DSDL_CCACHE=OFF"]
verification    = "wayland-present and no-dynamic-loading read the generated SDL_config.h; static-only asserts no .so shipped; sdl2.pc names the Wayland backend it links"
packaged_as     = ["sdl2"]
deferral        = """
Internals not reviewed. A windowing and audio abstraction; its consumer here \
is qemu's sdl display and sdl audio backend and nothing else. Everything \
not on that path -- joysticks, haptics, HIDAPI (which would want libusb), \
sensors, power, sample-rate conversion -- is named OFF so the archive is \
the display path and not a game engine's runtime.

The two ON-but-dlopen'd backends are the only place this package reaches \
beyond its own bytes at runtime, and the header comment states the \
condition under which that works."""

[installs]
prefixes = ["usr/bin", "usr/include/SDL2", "usr/lib", "usr/lib/cmake", "usr/lib/pkgconfig", "usr/share/aclocal", "usr/share/licenses"]
files    = 92
digest   = "c2bedf46069cb355d3d67cbd0d079d53e4cd1eadae9439cdeba008c1c229eaa0"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/SDL2-2.32.10.tar.gz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["cmake", "-S", ".", "-B", "_b", "-G", "Ninja",
         "-DCMAKE_INSTALL_PREFIX=/usr", "-DCMAKE_INSTALL_LIBDIR=lib", "-DCMAKE_BUILD_TYPE=Release",
         "-DSDL_SHARED=OFF", "-DSDL_STATIC=ON", "-DSDL_STATIC_PIC=ON",
         "-DSDL_WAYLAND=ON", "-DSDL_WAYLAND_SHARED=OFF", "-DSDL_WAYLAND_LIBDECOR=OFF",
         "-DSDL_X11=OFF", "-DSDL_KMSDRM=OFF",
         "-DSDL_OPENGL=OFF", "-DSDL_OPENGLES=OFF", "-DSDL_VULKAN=OFF",
         "-DSDL_AUDIO=OFF",
         "-DSDL_ALSA=OFF", "-DSDL_PULSEAUDIO=OFF", "-DSDL_PIPEWIRE=OFF", "-DSDL_JACK=OFF", "-DSDL_SNDIO=OFF",
         "-DSDL_LIBUDEV=OFF", "-DSDL_DBUS=OFF", "-DSDL_IBUS=OFF",
         "-DSDL_JOYSTICK=OFF", "-DSDL_HAPTIC=OFF", "-DSDL_HIDAPI=OFF",
         "-DSDL_SENSOR=OFF", "-DSDL_POWER=OFF", "-DSDL_LIBSAMPLERATE=OFF",
         "-DSDL_TEST=OFF", "-DSDL_RPATH=OFF", "-DSDL_CCACHE=OFF"]]

[[steps]]
name = "wayland-present"
cwd  = "$S"
# THE PROBE'S SILENCE MADE LOUD. If any of the five Wayland modules was
# missing, CMake configured happily with the Wayland driver off and the
# resulting qemu would open no window on bare metal while every headless
# gate stayed green. The generated config header says what was decided.
# WHERE IT IS, MEASURED (run 88822423552): SDL 2.0.18+ writes the
# generated header under a per-configuration directory,
# _b/include-config-<lowercase config>/SDL_config.h, not _b/include/.
# Found by name rather than spelled, and its absence is itself a
# failure -- a gate that cannot find its evidence must not pass.
run  = [["sh", "-c", "h=$(find _b -name SDL_config.h -path '*include-config*' | head -1); test -n \"$h\" || { echo VERON-SDL2-NO-GENERATED-CONFIG; find _b -name 'SDL_config*'; exit 1; }; grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND 1' \"$h\" || { echo VERON-SDL2-NO-WAYLAND-DRIVER; grep -n WAYLAND \"$h\"; exit 1; }"]]

[[steps]]
name = "no-dynamic-loading"
cwd  = "$S"
# THE REVERSAL, HELD: the generated header must NOT name a library to
# dlopen. SDL_VIDEO_DRIVER_WAYLAND_DYNAMIC and SDL_AUDIO_DRIVER_ALSA_DYNAMIC
# are what SDL defines when it intends to load at runtime; their absence
# is what "linked statically" means in this tree.
run  = [["sh", "-c", "h=$(find _b -name SDL_config.h -path '*include-config*' | head -1); ! grep -E '^#define SDL_(VIDEO_DRIVER_WAYLAND|AUDIO_DRIVER_[A-Z]+)_DYNAMIC' \"$h\" || { echo VERON-SDL2-WOULD-DLOPEN; grep -n DYNAMIC \"$h\"; exit 1; }"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }

[[steps]]
name = "static-only"
cwd  = "$S"
# THE PROPERTY THE FLAGS PROMISE, CHECKED WHERE IT IS MADE: an archive,
# a .pc, and no shared object for qemu's --static link to trip over.
# THE BACKENDS ARE ON THE PUBLIC Libs: LINE, MEASURED (run 88906901854):
# a static-only SDL2 writes "Libs: -lSDL2 ... -lwayland-egl
# -lwayland-cursor -lwayland-client -lxkbcommon", not Libs.private --
# correct, since an archive's consumer must always link them -- and the
# first version of this check read only Libs.private and failed a
# build that was right. Either line counts; -lEGL on either is wrong.
run  = [["sh", "-c", "test -f $D/usr/lib/libSDL2.a && test -f $D/usr/lib/pkgconfig/sdl2.pc && ! ls $D/usr/lib/libSDL2*.so* 2>/dev/null | grep -q . || { echo VERON-SDL2-NOT-STATIC-ONLY; ls -la $D/usr/lib; exit 1; }; grep -E '^Libs(.private)?:' $D/usr/lib/pkgconfig/sdl2.pc | grep -q -- '-lwayland-client' || { echo VERON-SDL2-PC-LACKS-BACKENDS; grep Libs $D/usr/lib/pkgconfig/sdl2.pc; exit 1; }; ! grep -E '^Libs(.private)?:' $D/usr/lib/pkgconfig/sdl2.pc | grep -q -- '-lEGL' || { echo VERON-SDL2-PC-LINKS-EGL; grep Libs $D/usr/lib/pkgconfig/sdl2.pc; exit 1; }"]]

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "sdl2"]]
expect = ["2.32.10"]
