name    = "zstd"
version = "1.5.7"
group   = "build-substrate"
license = "GPL-2.0-or-later"

# EVERY FACT BELOW WAS MEASURED, NOT REMEMBERED. Version, digest, signing key,
# licence and build system come from `probe url https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz`.
# Nine versions were probed and all nine differed from what would have been
# written from memory, so nothing here is typed from recall.

[source]
url       = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz"
sha256    = "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3"
signature = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz.sig"
# The key that made that signature, read from the signature itself with an
# EMPTY keyring -- the probe deliberately does not import a key fetched
# alongside the artifact it signs, because that proves nothing. Compare this
# against the project's published fingerprint, then verify locally, before
# treating the pin as trusted.
signing_key = "4EF4AC63455FC9F4545D9B7DEF8FE99528B52FFD"
crosschecked_against = []   # name the packagers whose digest you compared

[deps]
# DISCOVERED BY BUILDING, NOT BY READING. zstd's `make check` invokes file(1)
# and died with "file: No such file or directory" -- Error 127 out of
# tests/Makefile:355. No source we consult would have said so: BLFS does not
# carry zstd, Arch's PKGBUILD lists what zstd LINKS, and `probe linked` reads
# DT_NEEDED from the built binaries. A test-suite-only build dependency is
# invisible to all three, and busybox has no `file` applet to fall back on.
#
# This is the argument for keeping test suites enabled rather than deferring
# them: the suite is what found the missing package.
build        = ["file"]
link         = []
runtime      = []
# The zstd CLI links lz4, zlib and lzma IF IT FINDS THEM, which would make
# this package's output depend on build order within its own group.
# HAVE_ZLIB=0 / HAVE_LZMA=0 / HAVE_LZ4=0 are declines passed as make
# variables rather than configure flags -- zstd has no configure.
# All three ARE in this set, so without them zstd would link them and
# the recipe would understate its own dependencies.
# CORROBORATIVE DECLINE. Arch builds zstd with cmake + ninja; upstream
# ships a plain Makefile and this recipe uses it. zstd is at rung 4, well
# before either exists.
optional_off = ["lz4", "zlib", "lzma", "ZLIB", "LZMA", "LZ4", "cmake", "ninja"]

[declared]
configure_flags = ["HAVE_ZLIB=0", "HAVE_LZMA=0", "HAVE_LZ4=0"]
verification    = "none -- upstream suites are not run; see deferral"
deferral        = """
Internals not reviewed; upstream test suite only. NO CONFIGURE -- a plain \
Makefile, so PREFIX and the HAVE_* switches are make variables. The three \
optional compressors are disabled explicitly: zlib and xz are in this same \
group, so leaving them detected would make zstd's output depend on the order \
its neighbours happened to build in.

UPSTREAM TESTS ARE NOT RUN, BY POLICY, AND THIS IS THE LARGEST VERIFICATION \
GAP IN THE SET. Running full suites in series does not scale past a handful \
of packages -- twelve of them already dominated the build, and the plan is \
150+. They were run once, at twelve packages, and the result is recorded: \
every suite that ran passed except the exclusions each recipe already names. \
Evidence now comes from the guest sanity tests, which run against the booted \
image and check that each package actually works. Re-enable a suite per \
package when there is a reason to; the step is one block."""

[installs]
prefixes = ["usr/bin", "usr/include", "usr/lib", "usr/lib/pkgconfig", "usr/share/man"]
files    = 19
digest   = "27e32bdcc6a35ea8bec7b7e83136326967bb1b43c9d07191a8117b5504b3c694"


[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/zstd-1.5.7.tar.gz", "-C", "$B"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J", "PREFIX=/usr",
         "HAVE_ZLIB=0", "HAVE_LZMA=0", "HAVE_LZ4=0"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "PREFIX=/usr", "DESTDIR=$D", "install"]]

[guest]
test   = [["/usr/bin/zstd", "--version"]]
expect = ["1.5.7"]
