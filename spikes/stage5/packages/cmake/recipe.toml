name    = "cmake"
version = "4.2.3"
group   = "build-substrate"
license = "BSD-3-Clause"

# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://cmake.org/files/v4.2/cmake-4.2.3.tar.gz"
sha256    = "7efaccde8c5a6b2968bad6ce0fe60e19b6e10701a12fce948c2bf79bac8a11e9"
signature = "none -- cmake.org publishes hashes on the download page, not a signature"
crosschecked_against = []

[deps]
build        = ["ninja", "zlib", "bzip2", "xz", "zstd", "curl", "expat", "libarchive"]
# xz AND zstd ARE NOT LINKED BY cmake ITSELF, measured by `veron linked`.
# --system-liblzma and --system-zstd are passed and are real BUILD
# dependencies -- cmake's configure looks for both -- but the code that calls
# them is libarchive's, and --system-libarchive means we use the system copy.
# So the edge is cmake -> libarchive -> xz/zstd, and declaring it as a direct
# link made the ledger claim a dependency the binary does not have.
#
# bzip2 stays: it IS linked, statically, because bzip2's recipe builds only
# libbz2.a. `veron linked` reports that separately rather than as a mismatch.
link         = ["zlib", "bzip2", "curl", "expat", "libarchive"]
runtime      = ["zlib", "bzip2", "xz", "zstd", "curl", "expat", "libarchive"]
optional_off = ["qt-gui", "ccache", "sphinx", "vendored-libs"]

[declared]
configure_flags = ["--prefix=/usr", "--system-curl", "--system-expat", "--system-zlib", "--system-bzip2", "--system-liblzma", "--system-zstd", "--system-libarchive", "--no-qt-gui", "--generator=Ninja"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. THE SIX --system-* FLAGS ARE LOAD-BEARING: without them cmake builds and \
statically links its own copies of zlib, bzip2, xz, zstd, curl, expat and \
libarchive, so the image would carry two of each and the ledger would \
describe only one. Every one of those is already a package here, which is why \
cmake sits this late in the order.

THE BLANKET --system-libs DOES NOT WORK, and the failure is worth recording \
rather than just fixing: it turns on every system library cmake can use, \
including LIBRHASH, JSONCPP, LIBUV and CPPDAP, and configure then refuses \
because they are absent. Those four stay VENDORED -- statically linked copies \
inside the cmake binary, covered by our tarball digest but not itemised in \
the ledger as packages. That is a real, if small, gap in the corresponding- \
source picture and it is named here rather than left implicit.

DESTDIR is passed through ninja install rather than a configure flag because \
there is no configure."""

[installs]
prefixes = ["usr/bin", "usr/doc/cmake-4.2", "usr/share/aclocal", "usr/share/bash-completion", "usr/share/cmake-4.2", "usr/share/emacs", "usr/share/vim"]
files    = 4007
digest   = "aa7bb315bd82bbf678d1dbd0600c760f53956598b31d55585b4c4a083030482e"


[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/cmake-4.2.3.tar.gz", "-C", "$B"]]

[[steps]]
name = "bootstrap"
cwd  = "$S"
# CMAKE BUILDS ITSELF. There is no configure script -- bootstrap compiles a
# minimal cmake with the C++ compiler, then that cmake configures the real
# one. --system-libs uses the zlib, bzip2, xz, zstd, curl and expat already
# built here rather than the copies vendored in the tarball, which is the
# difference between six libraries and twelve.
# THIS FIX WAS MADE ONCE AND THEN LOST, which is worth recording because the
# cause was not the recipe. A later zip was assembled by copying packages/
# from an older tree, so a corrected file was silently replaced by its
# predecessor and the identical failure came back a week later. Rebuilding a
# deliverable from a mixed set of trees is how that happens; the fix is to
# carry one tree forward, not to remember harder.
#
# --system-libs IS ALL-OR-NOTHING AND THAT IS WHY IT FAILED.
#     CMAKE_USE_SYSTEM_LIBRHASH is ON but LibRHash is not found!
# It turns on EVERY system library cmake can use, including librhash,
# jsoncpp, libuv and cppdap -- none of which are in this set and none of
# which anything else here wants. Naming the six we actually build is the
# difference between "use what exists" and "require everything".
run  = [["./bootstrap", "--prefix=/usr",
         "--system-curl", "--system-expat", "--system-zlib",
         "--system-bzip2", "--system-liblzma", "--system-zstd",
         "--system-libarchive",
         "--parallel=$J", "--no-qt-gui", "--generator=Ninja"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja"]]

[[steps]]
name = "install"
cwd  = "$S"
# THE DEFERRAL NOTE ABOVE HAS CLAIMED THIS SINCE THE RECIPE WAS WRITTEN --
# "DESTDIR is passed through ninja install rather than a configure flag
# because there is no configure" -- and until now the step did not do it.
#
# WHAT THAT COST. `ninja install` with no DESTDIR installs to /usr, and inside
# the sandbox / IS THE BUILD ROOT, so cmake wrote itself straight into the
# system and dest/cmake/ stayed empty. Everything downstream then worked for
# the wrong reason: cmake ran, the guest test passed, and the run printed
#
#     staged 0 paths into the build root
#
# without complaint. The manifest never listed a cmake file, the ledger record
# described a package that installed nothing, and G3 would have compared two
# empty directories and called cmake reproducible. The one package that
# bypassed its DESTDIR was the one package whose absence from the manifest
# nobody could see.
#
# The driver now treats a zero-path staging as fatal, so this cannot come back
# quietly.
run  = [["ninja", "install"]]
env  = { DESTDIR = "$D" }
[guest]
test   = [["/usr/bin/cmake", "--version"]]
expect = ["4.2.3"]