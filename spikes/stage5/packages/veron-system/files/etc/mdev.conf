# mdev.conf -- only read on the mdev-daemon road (see scripts/hotplug-start).
# Permissions here mirror scripts/hotplug-handler, which is the single
# source of policy; on the kernel-helper road this file is not consulted.
# Device regex          user:group  mode  action
event.*                 root:input  0660
mice                    root:input  0660
mouse.*                 root:input  0660
hidraw.*                root:input  0660
card[0-9]*              root:video  0660
renderD[0-9]*           root:render 0660
tty[0-9]+               root:tty    0620
(sd[a-z])([0-9]*)       root:root   0660  */etc/dinit.d/scripts/hotplug-handler
(mmcblk[0-9]+)(p[0-9]+)? root:root  0660  */etc/dinit.d/scripts/hotplug-handler
(nvme[0-9]+n[0-9]+)(p[0-9]+)? root:root 0660 */etc/dinit.d/scripts/hotplug-handler
