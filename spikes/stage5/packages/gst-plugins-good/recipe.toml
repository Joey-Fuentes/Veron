name    = "gst-plugins-good"
version = "1.28.1"
group   = "media"
license = "LGPL-2.1-or-later"
srcdir  = "gst-plugins-good-1.28.1"

[source]
url       = "https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.28.1.tar.xz"
sha256    = "738e26aee41b7a62050e40b81adc017a110a7f32d1ec49fa6a0300846c44368d"
signature = "none -- gstreamer.freedesktop.org publishes no detached signature"
crosschecked_against = []

[deps]
build        = ["meson", "ninja", "pkgconf", "gstreamer", "gst-plugins-base",
                "glib", "orc", "libvpx"]
link         = ["gstreamer", "gst-plugins-base", "glib", "orc", "libvpx"]
runtime      = ["gstreamer", "gst-plugins-base", "glib", "orc", "libvpx"]
optional_off = ["soup", "qt5", "gtk3", "pulse", "jack", "v4l2", "ximagesrc",
                "nls", "examples", "tests", "doc"]

[declared]
configure_flags = ["--libdir=lib",
                   "-Dauto_features=disabled", "-Disomp4=enabled",
                   "-Dmatroska=enabled", "-Daudioparsers=enabled",
                   "-Dautodetect=enabled", "-Dvideofilter=enabled",
                   "-Dwavparse=enabled", "-Ddeinterlace=enabled",
                   "-Dvpx=enabled", "-Dsoup=disabled",
                   "-Dnls=disabled",
                   "-Dexamples=disabled", "-Dtests=disabled",
                   "-Ddoc=disabled", "--wrap-mode=nofallback"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["gst-plugins-good"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 matches \
MIRRORS.tsv on both routes.

WHAT THIS MODULE CONTRIBUTES TO A BROWSER IS CONTAINERS, NOT CODECS. isomp4 \
demuxes MP4 and matroska demuxes WebM -- between them that is most of the \
video the web serves. The bytes inside are decoded by libav and by libvpx.

-Dsoup=disabled IS THE ONE WORTH NAMING. meson.options:89 is \
`option('soup', type: 'feature', value: 'auto', ...)` -- an HTTP client source \
element. libsoup is NOT in this set yet and is pinned for WPE's own network \
stack; enabling it here would put a SECOND HTTP client in the image, dispatched \
from a media pipeline, when WPE already has one. Disabled deliberately rather \
than by absence, because libsoup IS coming and this option would flip itself on \
the moment it arrives.

THE PLUGIN SELECTION IS PROVISIONAL for the same reason stated in \
gst-plugins-base: 111 options here, and WPE's actual requirements have not been \
read from its source yet.

-Dvpx=enabled IS WHY libvpx IS A DEPENDENCY OF THIS MODULE RATHER THAN ONLY OF \
ffmpeg. VP8/VP9 decoding is available through both paths; GStreamer prefers the \
native element.

NO introspection OPTION EXISTS IN THIS MODULE, unlike core, base and bad. \
`-Dintrospection=disabled` was written here by pattern and removed after \
checking -- meson rejects an unknown option outright, so it would have failed \
at configure rather than silently, but it was still a flag claimed and not \
real. Every option named in this batch was then verified against its own \
meson.options; this was the only one that did not exist.

v4l2, pulse, jack, gtk3, qt5 AND ximagesrc ARE ALL auto AND ALL ABSENT. Each \
would have probed and quietly disabled itself. With auto_features=disabled none \
is reached at all, which is the same outcome arrived at deliberately."""

[installs]
prefixes = ["usr/lib/gstreamer-1.0", "usr/share/gstreamer-1.0"]
files    = 10
digest   = "3edde69c0abeaf45b6536e4c2144e59ff9b9207ed841dd017ebd2a90d47d648e"

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/gst-plugins-good-1.28.1.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release", "--libdir=lib",
         "--wrap-mode=nofallback",
         "-Dauto_features=disabled", "-Disomp4=enabled", "-Dmatroska=enabled",
         "-Daudioparsers=enabled", "-Dautodetect=enabled",
         "-Dvideofilter=enabled", "-Dwavparse=enabled",
         "-Ddeinterlace=enabled", "-Dvpx=enabled", "-Dsoup=disabled",
         "-Dnls=disabled", "-Dexamples=disabled",
         "-Dtests=disabled", "-Ddoc=disabled"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }

[guest]
# gst-inspect --exists CHECKS AN ELEMENT, NOT A PLUGIN, AND CANNOT CHECK A
# PLUGIN AT ALL. These tests named plugins -- playback, isomp4, matroska,
# videoparsersbad, libav -- and every one failed:
#
#     FAIL  gst-inspect-1.0 --exists --atleast-version=1.28.1 isomp4 did not run
#
# tools/gst-inspect.c:2387 is gst_registry_lookup_feature(registry, argv[1]),
# which resolves FEATURES. The plugin branch three lines further down is
# unimplemented and says so outright:
#
#     /* FIXME: support checking for plugins too */
#     g_printerr ("Checking for plugins is not supported yet\n");
#     exit_code = -1;
#
# So --exists with a plugin name is not merely wrong, it is a mode the tool
# does not have. The element names below were read out of each package's
# own sources rather than guessed: an element is what a pipeline actually
# instantiates, so asserting one proves the plugin loaded AND registered.

test   = [["/usr/bin/gst-inspect-1.0", "--exists", "--atleast-version=1.28.1", "qtdemux"],
          ["/usr/bin/gst-inspect-1.0", "--exists", "--atleast-version=1.28.1", "matroskademux"]]
expect = ["", ""]
