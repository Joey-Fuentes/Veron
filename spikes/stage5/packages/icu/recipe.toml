name    = "icu"
version = "78.2"
group   = "build-substrate"
license = "ICU"
# THE TARBALL UNPACKS TO icu/, AND THE BUILD LIVES ONE LEVEL DOWN in
# icu/source. Neither matches the package name, so both have to be stated.
srcdir  = "icu/source"
# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://github.com/unicode-org/icu/releases/download/release-78.2/icu4c-78.2-sources.tgz"
sha256    = "3e99687b5c435d4b209630e2d2ebb79906c984685e78635078b672e03c89df35"
signature = "https://github.com/unicode-org/icu/releases/download/release-78.2/icu4c-78.2-sources.tgz.asc"
crosschecked_against = []

[deps]
build        = []
link         = []
runtime      = []
# CORROBORATIVE DECLINE. Arch's icu runs the test suite and regenerates
# data, both of which need python. Upstream suites are not run here.
optional_off = ["samples", "tests", "icuio-static", "python"]

[declared]
configure_flags = ["--prefix=/usr", "--disable-static", "--disable-samples", "--disable-tests"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. ICU IS LARGE -- roughly 30 MB of data tables -- and \
it is here because harfbuzz, WPE WebKit and anything doing real text \
segmentation need it. --disable-samples and --disable-tests remove build \
targets, not features."""

[installs]
prefixes = ["usr/bin", "usr/include/unicode", "usr/lib", "usr/lib/icu", "usr/lib/pkgconfig", "usr/sbin", "usr/share/icu", "usr/share/man"]
files    = 267
digest   = "cb2ef527df6c705aaa26d1de18fa2708faca8d8c12533ef948ba7c87d3908937"


[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/icu4c-78.2-sources.tgz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-static",
         "--disable-samples", "--disable-tests"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]
[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "icu-uc"]]
expect = ["78.2"]