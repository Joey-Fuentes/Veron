name    = "libtpms"
version = "0.10.2"
group   = "system"
license = "BSD-3-Clause"
srcdir  = "libtpms-0.10.2"

# THE TPM BEHIND WINDOWS 11. Windows 11's installer refuses a machine
# with no TPM 2.0; qemu emulates the TPM *bus* (tpm-tis, tpm-crb) and
# nothing else -- the device on the far end of that bus is a separate
# process, swtpm, and swtpm's TPM 2.0 command set is this library
# (Microsoft's reference implementation, packaged by the swtpm author).
# libtpms -> swtpm -> qemu -chardev socket -> the guest's TPM.
#
# STATIC ARCHIVE ONLY. Its one consumer is swtpm; on the amd64 arm swtpm
# is -all-static and on the aarch64 arm it links the .a into a dynamic
# binary. No .so is built because nothing would dlopen or link it.
# libcrypto comes from this set's build_only openssl.
#
# A GITHUB TAG ARCHIVE, autoreconf'd FIRST, the libcap-ng shape:
# configure.ac ships, configure does not. MEASURED, NOT ASSUMED: the
# first mirror run (88771680471) asked for a `make dist` asset at
# releases/download/v0.10.2/libtpms-0.10.2.tar.gz and got 404 four
# times -- the release page's assets are GitHub's generated archives
# only, whatever a release page count suggested. autoreconf is run
# directly rather than through autogen.sh so the recipe, not a script
# in the tarball, decides what runs. The $DL name carries the mirror's
# project prefix (libtpms-v0.10.2), per mirror.artifact_name. 0.10.2
# (2 Jan 2026) fixes CVE-2026-21444 and is the newest as of 2026-08-24.
#
# -Werror IS OFF BY PATCH, MEASURED (run 88777336449, this package's
# first build): configure.ac hard-codes -Werror into AM_CFLAGS, and the
# stage-4 gcc's gnu23 default makes strstr() const-correct, so
# tpm_library.c:441 died on -Werror=discarded-qualifiers. The patch
# removes the one word from configure.ac (autoreconf regenerates the
# rest); the warnings stay in the log. The kernel's WERROR ruling,
# applied here; Gentoo and Fedora carry the same edit.
#
# THE RELEASE PAGE'S THIRD ASSET IS v0.10.2.tar.gz.asc: a detached
# signature over the tag archive -- so the archive is signed after all,
# and [source].signature names it. Pin MEASURED by mirror run
# 88774599074 and re-hashed from a by-hand download.

[source]
url       = "https://github.com/stefanberger/libtpms/archive/refs/tags/v0.10.2.tar.gz"
sha256    = "edac03680f8a4a1c5c1d609a10e3f41e1a129e38ff5158f0c8deaedc719fb127"
signature = "https://github.com/stefanberger/libtpms/releases/download/v0.10.2/v0.10.2.tar.gz.asc -- detached PGP over THIS tag archive, keyid 75AD65802A0B4211, sig dated 2026-01-02; the .asc and the archive were fetched by hand and the archive hashed to the pinned digest (2026-08-24); compare the key against the project's published fingerprint before trusting the signature"
crosschecked_against = []

[deps]
build        = ["autoconf", "automake", "libtool", "m4", "pkgconf", "openssl", "gmp"]
link         = []
runtime      = []
optional_off = ["shared"]

[declared]
configure_flags = ["--prefix=/usr", "--with-openssl", "--with-tpm2", "--enable-static", "--disable-shared"]
verification    = "archive-present step asserts libtpms.a and libtpms.pc exist; swtpm linking them is the consumer-side proof"
packaged_as     = ["libtpms"]
deferral        = """
Internals not reviewed. The TPM 1.2 and 2.0 command set; only 2.0 has a \
consumer here (Windows 11 wants 2.0, swtpm --tpm2). --with-tpm2 is the \
default and is stated because it is the whole point of the package."""

[installs]
prefixes = ["usr/include/libtpms", "usr/lib", "usr/lib/pkgconfig", "usr/share/man"]
files    = 37
digest   = "5dab1f877e760e1eaae5a6d29ca0b51f56dcc9d23a4736357b7eb2430a6262df"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/libtpms-v0.10.2.tar.gz", "-C", "$B"]]

[[steps]]
name = "autoreconf"
cwd  = "$S"
run  = [["autoreconf", "--verbose", "--force", "--install"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--with-openssl", "--with-tpm2", "--enable-static", "--disable-shared"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "install", "DESTDIR=$D"]]

[[steps]]
name = "archive-present"
cwd  = "$S"
run  = [["sh", "-c", "test -f $D/usr/lib/libtpms.a && test -f $D/usr/lib/pkgconfig/libtpms.pc || { echo VERON-LIBTPMS-NO-ARCHIVE; ls -la $D/usr/lib; exit 1; }"]]

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "libtpms"]]
expect = ["0.10.2"]
