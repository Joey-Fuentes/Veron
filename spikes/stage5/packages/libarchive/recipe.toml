name    = "libarchive"
version = "3.8.5"
group   = "build-substrate"
license = "BSD-2-Clause"

# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://github.com/libarchive/libarchive/releases/download/v3.8.5/libarchive-3.8.5.tar.xz"
sha256    = "d68068e74beee3a0ec0dd04aee9037d5757fcc651591a6dcf1b6d542fb15a703"
signature = "https://github.com/libarchive/libarchive/releases/download/v3.8.5/libarchive-3.8.5.tar.xz.asc"
crosschecked_against = []

[deps]
build        = ["zlib", "bzip2", "xz", "zstd"]
link         = ["zlib", "bzip2", "xz", "zstd"]
runtime      = ["zlib", "bzip2", "xz", "zstd"]
optional_off = ["xml2", "expat", "openssl", "lz4", "nettle", "acl", "attr"]

[declared]
configure_flags = ["--prefix=/usr", "--disable-static", "--without-xml2", "--without-expat", "--without-openssl"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. The four compression backends are ON because they \
are what libarchive is for and all four are already built. THE XAR BACKEND IS \
OFF: it wants an XML parser, and libxml2 and expat are both in this batch, so \
leaving it to detection would make libarchive's feature set depend on build \
order. --without-openssl drops the cryptographic digest support in mtree and \
xar; nothing here reads either format."""

[installs]
prefixes = ["usr/bin", "usr/include", "usr/lib", "usr/lib/pkgconfig", "usr/share/man"]
files    = 56
digest   = "9f43d0702edc34f29b1f07f03d4860fe975d72e537f867e4976be5bb1f2d08d8"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/libarchive-3.8.5.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-static", "--without-xml2", "--without-expat", "--without-openssl"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]
[guest]
test   = [["/usr/bin/bsdtar", "--version"]]
expect = ["3.8.5"]