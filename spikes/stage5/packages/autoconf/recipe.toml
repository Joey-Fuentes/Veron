name    = "autoconf"
version = "2.73"
group   = "build-substrate"
license = "GPL-2.0-or-later"

# EVERY FACT BELOW WAS MEASURED, NOT REMEMBERED. Version, digest, signing key,
# licence and build system come from `probe url https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz`.
# Nine versions were probed and all nine differed from what would have been
# written from memory, so nothing here is typed from recall.

[source]
url       = "https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz"
sha256    = "9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e"
signature = "https://ftp.gnu.org/gnu/autoconf/autoconf-2.73.tar.xz.sig"
# The key that made that signature, read from the signature itself with an
# EMPTY keyring -- the probe deliberately does not import a key fetched
# alongside the artifact it signs, because that proves nothing. Compare this
# against the project's published fingerprint, then verify locally, before
# treating the pin as trusted.
signing_key = "82F854F3CE73174B8B63174091FCC32B6769AA64"
crosschecked_against = []   # name the packagers whose digest you compared

[deps]
# THE FIRST REAL EDGES IN THE SET. autoconf is m4 with a large macro library
# on top -- it invokes m4 at runtime, not merely to build. perl comes from
# stage 4's sysroot and is a declared input rather than a package here.
build        = ["m4"]
link         = []
runtime      = ["m4"]
optional_off = []

[declared]
configure_flags = ["--prefix=/usr"]
# `make check` is enormous -- thousands of cases, and it runs the whole macro
# suite. Declared as run so the cost is visible; if it dominates the build it
# becomes a candidate for the rotation rather than every push.
verification    = "none -- upstream suites are not run; see deferral"
deferral     = """
Internals not reviewed; upstream test suite only. Depends on m4 AT RUNTIME, \
not just at build time -- autoconf without m4 installs cleanly and then fails \
on first use, which is why m4 appears in both build and runtime.

ONE TEST IS EXCLUDED, AND NOT BECAUSE AUTOCONF IS WRONG. Test 248 \
(AC_CACHE_CHECK) asserts `test config.cache -ot a-stamp-file`; busybox's \
`test` compares mtimes in whole seconds where GNU coreutils compares \
nanoseconds, so a fast build puts both files in the same second and "strictly \
older" is false. The remaining 548 run, including autoconf's own four \
declared expected failures. Adding coreutils would remove the exclusion \
entirely -- this is a data point for the glibc/GNU flavour, not a defect in \
the package.

UPSTREAM TESTS ARE NOT RUN, BY POLICY, AND THIS IS THE LARGEST VERIFICATION \
GAP IN THE SET. Running full suites in series does not scale past a handful \
of packages -- twelve of them already dominated the build, and the plan is \
150+. They were run once, at twelve packages, and the result is recorded: \
every suite that ran passed except the exclusions each recipe already names. \
Evidence now comes from the guest sanity tests, which run against the booted \
image and check that each package actually works. Re-enable a suite per \
package when there is a reason to; the step is one block."""

[installs]
prefixes = ["usr/bin", "usr/share/autoconf", "usr/share/info", "usr/share/man"]
files    = 64
digest   = "a9a3ec009c1a6af53ccb7d258cdb61247384d8e6d3f1fd3af236f3adc6b2c624"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/autoconf-2.73.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]

[guest]
test   = [["/usr/bin/autoconf", "--version"]]
expect = ["2.73"]
