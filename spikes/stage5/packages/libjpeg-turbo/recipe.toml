name    = "libjpeg-turbo"
version = "3.1.3"
group   = "text-rendering"
license = "IJG-and-BSD-3-Clause"
srcdir  = "libjpeg-turbo-3.1.3"
# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.3/libjpeg-turbo-3.1.3.tar.gz"
sha256    = "075920b826834ac4ddf97661cc73491047855859affd671d52079c6867c1c6c0"
signature = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.3/libjpeg-turbo-3.1.3.tar.gz.sig"
crosschecked_against = []

[deps]
build        = ["cmake", "ninja"]
link         = []
runtime      = []
optional_off = ["static", "java", "turbojpeg-java"]

[declared]
configure_flags = ["-DCMAKE_INSTALL_PREFIX=/usr", "-DENABLE_STATIC=OFF", "-DWITH_JPEG8=ON"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. WITH_JPEG8 provides the libjpeg 8 ABI, which is what \
most consumers expect. Signed, and the key should be compared against the \
project's published fingerprint before the pin is trusted."""

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/libjpeg-turbo-3.1.3.tar.gz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["cmake", "-S", ".", "-B", "_b", "-G", "Ninja",
         "-DCMAKE_INSTALL_PREFIX=/usr", "-DCMAKE_BUILD_TYPE=Release",
         "-DENABLE_STATIC=OFF", "-DCMAKE_INSTALL_DEFAULT_LIBDIR=lib",
         "-DWITH_JPEG8=ON"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }
[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "libjpeg"]]
expect = ["3.1.3"]