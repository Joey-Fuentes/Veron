name    = "unifdef"
version = "2.12"
group   = "build-substrate"
license = "BSD-2-Clause"
srcdir  = "unifdef-2.12"

[source]
url       = "https://dotat.at/prog/unifdef/unifdef-2.12.tar.xz"
sha256    = "43ce0f02ecdcdc723b2475575563ddb192e988c886d368260bc0a63aee3ac400"
signature = "none -- dotat.at publishes no detached signature"
crosschecked_against = []

[deps]
build        = []
link         = []
runtime      = []
optional_off = []

[declared]
configure_flags = ["prefix=/usr", "CFLAGS=-std=gnu17 -O2"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["unifdef"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball.

WHY IT IS HERE, AND IT WAS FOUND BY OPENING WPE RATHER THAN BY PLANNING. \
Source/cmake/OptionsWPE.cmake:25 is `find_package(Unifdef REQUIRED)` -- one of \
eighteen REQUIRED packages, seventeen of which this set already had. WPE \
CANNOT CONFIGURE WITHOUT IT. WebKit uses it during the build to strip #ifdef \
blocks out of generated headers.

CFLAGS=-std=gnu17 BECAUSE constexpr IS A C23 KEYWORD AND unifdef USES IT AS A \
VARIABLE. Line 205 is `static bool constexpr;` -- written when constexpr was \
an ordinary identifier. The Makefile passes no -std at all (line 14 is just \
`${CC} ${CFLAGS} ${LDFLAGS} -o unifdef unifdef.c`), so the compiler's default \
decides, and gcc 15 defaults to gnu23:

    unifdef.c:1173:19: error: expected identifier or '(' before '=' token
     1173 |         constexpr = killconsts ? false : true;

THIRD C23 CASUALTY IN THIS SET, AND EACH ARRIVED DIFFERENTLY. wlroots ASKS for \
-std=c23 in its own meson.build and was bitten by glibc making strchr \
const-generic; foot and fcft were unaffected; this one asks for nothing and is \
bitten by the compiler's default moving underneath it. A package that names no \
standard is not standard-neutral -- it inherits whatever the toolchain decides \
this year.

-std=gnu17 RATHER THAN A PATCH. The alternative is renaming the variable, \
which is a source change to a program whose entire job is textual \
transformation of C -- and unifdef 2.12 is the current release, so upstream has \
not needed to move. Pinning the standard says what the code was written \
against.

prefix DEFAULTS TO ${HOME}, WHICH IS THE WORST DEFAULT SEEN SO FAR AND IS \
HARMLESS ONLY BECAUSE IT IS SO OBVIOUS. Makefile:3 is `prefix = ${HOME}`, so \
an unqualified `make install` writes into whatever home directory the build \
happens to run as -- root's, in this sandbox. It would not fail; it would \
install to /root/bin and the package would appear to have built with nothing \
in the DESTDIR. Stated as prefix=/usr.

THERE IS NO configure AND NOTHING TO CONFIGURE. unifdef is one C file and a \
hand-written Makefile with no dependencies at all -- not even pkgconf. That is \
why [deps].build is empty, which is otherwise almost unheard of in this set.

THE FIRST DIGEST HERE WAS THE WRONG ARTIFACT, AND THE MISSING THIRD LEG IS \
EXACTLY WHY IT SURVIVED. The URL is unifdef-2.12.tar.xz. The file handed over \
was named unifdef-2_12_tar.gz -- same project, same version, DIFFERENT \
COMPRESSION, and therefore different bytes and a different sha256. The gz \
hashes to fba564a2...; that value was measured honestly off real bytes and \
then paired with an xz URL it does not belong to.

No digest was stated alongside the upload, so the usual \
measured-vs-stated-vs-pinned check was one leg short -- and the recipe SAID SO \
in this very paragraph while still shipping the mismatch. A missing leg is a \
reason to check the remaining two harder, not a footnote.

IT FAILED AT FETCH, WHICH IS THE CHEAP PLACE. The mirror had correctly fetched \
and uploaded the real .tar.xz as 43ce0f02-unifdef-2.12.tar.xz; the build then \
asked for fba564a2 and got:

    mirror: every route failed for unifdef-2.12.tar.xz
      miss    github     HTTP Error 404: Not Found

The routing is by sha256, so a wrong digest cannot silently fetch the wrong \
file -- it fetches nothing. That is the property working.

WHAT 43ce0f02 RESTS ON, STATED PLAINLY. Both MIRRORS.tsv rows agree on it -- \
the upstream fetch and the mirrored asset -- so it is two independent \
measurements of the same bytes by the mirror job. It has NOT been verified \
against a copy held here: the .tar.xz was never uploaded to this session. That \
is one leg weaker than every other pin in this set, and it should be closed by \
hashing the .tar.xz directly the next time it is to hand."""

[installs]
prefixes = ["usr/bin", "usr/share/man"]
files    = 4
digest   = "34a0e258871d4c55836d2a68b1f75fbcc94c3dc48fd71de269dc4d72d47dd955"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/unifdef-2.12.tar.xz", "-C", "$B"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J", "prefix=/usr", "CFLAGS=-std=gnu17 -O2"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "install", "prefix=/usr", "CFLAGS=-std=gnu17 -O2", "DESTDIR=$D"]]

[guest]
test   = [["/usr/bin/unifdef", "-V"]]
expect = ["2.12"]
