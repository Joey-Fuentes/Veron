name    = "swtpm"
version = "0.10.1"
group   = "system"
license = "BSD-3-Clause"
srcdir  = "swtpm-0.10.1"

# THE OTHER HALF OF A WINDOWS 11 GUEST. qemu's -tpmdev emulator speaks a
# socket to a TPM process; this is that process. `swtpm socket --tpm2
# --tpmstate dir=... --ctrl type=unixio,path=...` starts a fresh TPM 2.0
# in an empty state directory with no setup step -- swtpm_setup is only
# needed to pre-provision endorsement certificates, which Windows does
# not require -- so the bare swtpm binary is the deliverable and the
# rest ships because make installs it.
#
# gnutls, seccomp, cuse AND selinux ARE OFF BY NAME. gnutls exists only
# to build swtpm_cert, a certificate tool for the EK-provisioning path
# nothing here walks, and it would drag nettle, gmp, p11-kit and
# libtasn1 into a link that the amd64 overlay makes -all-static. seccomp
# is a sandbox for a daemon libvirt runs as a system service; here swtpm
# is a per-VM child of the launcher, killed with it. cuse wants libfuse,
# not in this set. selinux likewise.
#
# THIS BASE RECIPE IS DYNAMIC, exactly as base qemu-user is: the aarch64
# arm's glib ships no archive to link against. The amd64 overlay is the
# same recipe with -all-static on the make line and pkgconf --static on
# configure, per the qemu-user precedent.
#
# A GITHUB TAG ARCHIVE, autoreconf'd FIRST (libcap-ng shape), for the
# reason libtpms's recipe measures: the `make dist` asset the research
# inferred does not exist (mirror run 88771680471, 404 x4). The $DL name
# carries the mirror's project prefix (swtpm-v0.10.1). 0.10.1 is the
# newest release as of 2026-08-24 and requires libtpms >= 0.10.
#
# READ FROM THE PINNED TARBALL'S configure.ac (sha256 f8da11ca...), NOT
# RECALLED: --with-openssl is REQUIRED and must match libtpms's backend
# (configure.ac:567-569 errors either way if they disagree);
# --with-gnutls/--with-cuse/--with-selinux/--with-seccomp are the
# spellings, gnutls and cuse default to check, and gnutls when found
# ALSO demands certtool (configure.ac:304-307), which this set does not
# ship -- so --without-gnutls is a requirement, not a preference;
# --disable-tests (configure.ac:385) is what keeps expect, gawk, socat,
# netstat/ss and tcsd off the path AND skips the `id -u tss` check
# (configure.ac:523-535, only under have_tcsd); libtasn1, json-glib,
# glib and gthread are unconditional (configure.ac:177-255) and all in
# this set; bash is required by the PCR-bank regex check at configure
# time (configure.ac:367) and python >= 3.3 by AM_PATH_PYTHON
# (configure.ac:443) -- both declared below. swtpm_setup and
# swtpm_localca are C (src/*/Makefile.am: bin_PROGRAMS), not scripts.
#
# -Werror IS OFF BY PATCH, PRE-EMPTIVELY AND FROM THE FILE: configure.ac
# line 545 appends it unconditionally, the same author's same flag set
# that killed libtpms in run 88777336449 on this gcc's gnu23 default.
# Measured on the sibling, applied here before the plan reaches package
# 142 to learn it again. Gentoo carries the identical edit.
#
# UNBUILT AS WRITTEN; pin MEASURED by mirror run 88774599074.

[source]
url       = "https://github.com/stefanberger/swtpm/archive/refs/tags/v0.10.1.tar.gz"
sha256    = "f8da11cadfed27e26d26c5f58a7b8f2d14d684e691927348906b5891f525c684"
signature = "none detached; the v0.10.1 TAG is GPG-signed by Stefan Berger (key 75AD65802A0B4211) -- verify the tag, then pin the asset's digest"
crosschecked_against = []

[deps]
build        = ["autoconf", "automake", "libtool", "m4", "pkgconf", "bash", "python", "glib", "json-glib", "libtasn1", "libtpms", "openssl"]
link         = ["glib", "json-glib", "libtasn1"]
runtime      = ["glib", "json-glib", "libtasn1"]
optional_off = ["gnutls", "seccomp", "cuse", "selinux", "tests"]

[declared]
configure_flags = ["--prefix=/usr", "--with-openssl", "--without-gnutls", "--without-seccomp", "--without-cuse", "--without-selinux", "--disable-tests"]
verification    = "binaries-present step runs the installed swtpm --version; the Windows 11 setup screen on bare metal is the consumer-side proof"
packaged_as     = ["swtpm"]
deferral        = """
Internals not reviewed. A TPM emulator daemon over libtpms; its consumer \
is qemu -tpmdev emulator and the guest behind it. The default tss user and \
group it names in its configuration files are for swtpm_setup's certificate \
path, which nothing here uses; the daemon itself runs as whoever launches \
the VM."""

[installs]
prefixes = ["usr/bin", "usr/lib", "usr/libexec", "usr/share", "etc"]
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/swtpm-v0.10.1.tar.gz", "-C", "$B"]]

[[steps]]
name = "autoreconf"
cwd  = "$S"
run  = [["autoreconf", "--verbose", "--force", "--install"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--with-openssl", "--without-gnutls", "--without-seccomp", "--without-cuse", "--without-selinux", "--disable-tests"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "install", "DESTDIR=$D"]]

[[steps]]
name = "binaries-present"
cwd  = "$S"
run  = [["sh", "-c", "for b in swtpm swtpm_ioctl swtpm_bios; do test -x $D/usr/bin/$b || { echo VERON-SWTPM-MISSING $b; exit 1; }; done && echo VERON-SWTPM-BINARIES-PRESENT"]]

[guest]
test   = [["sh", "-c", "/usr/bin/swtpm --version | head -1"]]
expect = ["TPM emulator version 0.10.1"]
