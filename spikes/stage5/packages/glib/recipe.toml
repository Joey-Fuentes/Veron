name    = "glib"
version = "2.86.4"
group   = "text-rendering"
license = "LGPL-2.1-or-later"

# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://download.gnome.org/sources/glib/2.86/glib-2.86.4.tar.xz"
sha256    = "d4e2b5d791d5015ffd8c6971ad8e975a0a55c1a14926cdb25cf843ff00682260"
signature = "none -- download.gnome.org publishes no detached signature"
crosschecked_against = []

[deps]
# BASH IS A BUILD DEPENDENCY, discovered by building: glib's meson.build
# looks for it and crashes outright when it is missing --
#   Program bash found: NO
#   meson.build:2549:16: ERROR: Unhandled python exception
# Nothing in BLFS, Arch or the declared-dependency scan mentions it, because
# it is a build-time tool rather than a library. Only running the build finds
# this class of edge.
# pkgconf IS A REAL BUILD DEPENDENCY AND WAS INVISIBLE FOR 55 PACKAGES.
# meson's dependency() resolves through pkg-config first, so without it every
# external library lookup fails -- and in the shared build root pkgconf has
# been present since rung 11, so nothing ever noticed. stage5-isolate found it
# the moment glib was built from its declarations alone:
#
#     Did not find pkg-config by name 'pkg-config'
#     Run-time dependency libpcre2-8 found: NO (tried pkgconfig and cmake)
#     Downloading pcre2 source from https://github.com/PCRE2Project/...
#
# pcre2 WAS in the layer stack. Nothing could find it.
build        = ["meson", "ninja", "libffi", "pcre2", "zlib", "python", "bash", "pkgconf"]
link         = ["libffi", "pcre2", "zlib"]
runtime      = ["libffi", "pcre2", "zlib"]
# CORROBORATIVE DECLINE, AND THE ONLY ONE ANSWERED EMPIRICALLY. Arch's
# glib2 lists python-packaging in makedepends -- the same shape as mesa's
# `import mako`, which no .pc file can see and which cost this project a
# missing package once already.
#
# It is not needed here, and the evidence is a build rather than a reading:
# glib built green in run 54, BEFORE a `packaging` recipe existed anywhere
# in the set. Whatever Arch needs it for is not this configuration.
optional_off = ["introspection", "selinux", "libmount", "sysprof", "man-pages", "gtk_doc", "tests", "dtrace", "systemtap", "packaging"]

[declared]
configure_flags = ["-Dman-pages=disabled", "-Dgtk_doc=false", "-Dtests=false", "-Dintrospection=disabled", "-Dselinux=disabled", "-Dlibmount=disabled", "-Dsysprof=disabled"]
# THEY DO NOT USE OUR NAME. Without this the reconciler looks up
# "glib", finds no PKGBUILD, and reports the package as
# uncorroborated -- which is a false absence, not a real one.
packaged_as     = ["glib2"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. GLIB IS UNAVOIDABLE: WPE WebKit requires it, harfbuzz \
uses it, and libsoup is built on it. -Dintrospection=disabled is deliberate \
-- gobject-introspection needs a working python module stack and produces \
typelibs nothing here consumes. -Dlibmount=disabled avoids util-linux, which \
is not in the set. GIO will still expose a D-Bus API surface at build time; \
that is glib being glib, and nothing here runs a bus."""

[undeclarable]
# Lookups that no .pc name can answer, disclosed per ROADMAP.md rule 4.
# Locations come from `probe.py reconcile`; every reason is read from the
# tarball. Entries whose reason could be DERIVED -- a build file this recipe
# never invokes, an option the argv disables, an applet busybox provides --
# were drafted by `--propose`; the rest were answered by hand.
# meson.build:2547 bash (optional)
"program:bash" = "A real build dependency and DECLARED -- glib's meson.build crashes outright without it, which is why bash is in deps.build. Found by building, not by any scan."
# meson.build:2635 dtrace (conditional on dtrace_option)
"program:dtrace" = "A feature option defaulting to 'auto', so it is off because dtrace is ABSENT rather than because anyone chose. Listed in optional_off with no flag behind it; worth converting to -Ddtrace=disabled so it becomes a decision."
# meson.build:2554 env (conditional on installed_tests_enabled)
"program:env" = "Looked for only when 'tests' is on, and this recipe disables it: installed_tests_enabled"
# meson.build:2702 g-ir-scanner (conditional on get_option('introspection'))
"program:g-ir-scanner" = "Looked for only when 'introspection' is on, and this recipe disables it: get_option('introspection')"
# docs/reference/meson.build:10 gi-docgen (REQUIRED)
"program:gi-docgen" = "docs/reference/meson.build:10, inside `if get_option('documentation') and enable_gir`. documentation is a boolean defaulting to false. The subdir is entered UNCONDITIONALLY, which is why this reports REQUIRED -- the guard is one line above the lookup and invisible to a per-call scan."
# meson.build:2551 pkg-config (optional)
"program:pkg-config" = "Provided by pkgconf, built at rung 11 and on PATH for everything after it."
# meson.build:2770 rst2html5 (conditional on get_option('documentation'))
"program:rst2html5" = "required: get_option('documentation'), a boolean defaulting to false."
# meson.build:2762 rst2man (conditional on get_option('man-pages'))
"program:rst2man" = "Looked for only when 'man-pages' is on, and this recipe disables it: get_option('man-pages')"
# meson.build:2550 sh (optional)
"program:sh" = "Provided by busybox in the sandbox; the box is busybox throughout. meson.build:2550 sh (optional)"
# meson.build:224 valgrind (optional)
"program:valgrind" = "Instrumentation for the test suite. -Dtests=false."
# meson.build:2736 xgettext (conditional on get_option('nls'))
"program:xgettext" = "required: get_option('nls'), a feature defaulting to 'auto'. LOAD-BEARING: xgettext being absent is the only reason `subdir('po')` is skipped, and therefore the only reason a set with no gettext recipe gets through glib at all. -Dnls=enabled would make gettext a hard dependency."

[installs]
prefixes = ["usr/bin", "usr/include/gio-unix-2.0", "usr/include/glib-2.0", "usr/lib", "usr/lib/glib-2.0", "usr/lib/pkgconfig", "usr/libexec", "usr/share/aclocal", "usr/share/bash-completion", "usr/share/gdb", "usr/share/gettext", "usr/share/glib-2.0"]
files    = 379
digest   = "2470434f30be228bdd63c906aaa99871130414858ad7f39b29f3ae45a9392788"


[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/glib-2.86.4.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
# WHAT MAKES THIS BUILD IS THE PATCH, NOT A FLAG. See
# patches/0001-bash-completion-pkg-config-only.patch: glib's bash-completion
# lookup falls through to meson's CMake backend, which dies parsing cmake
# 4.2.3's trace output. There is NO -Dbash_completion option -- that was
# shipped as a fix and was wrong, and reading the tarball is what settled it.
#
# IT RECURRED, IN THIS FILE, ONE RUN LATER. With the patch applied run 51 got
# past meson.build:2549 and died at gio/inotify/meson.build:32 on
# `libinotify` -- same crash, same package, a different lookup. A patch per
# call site is not a smaller problem than a patch per package.
#
# THE ANSWER IS IN policy/defaults.toml, NOT HERE. $CMAKE now points at a path
# that cannot exist, so meson's CMake backend reports not-found for every
# absent optional dependency and never runs the trace parser at all. That is
# one line for the whole set rather than one patch per meson package.
#
# THIS PATCH IS KEPT ANYWAY, and the reason is not caution about glib. It is
# the only place in the tree where the two mechanisms are exercised together,
# so if the policy is ever dropped this file still builds -- and the
# cmake_backend_used() gate, not this patch, is what reports the loss.
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release",
         "-Dman-pages=disabled", "-Dgtk_doc=false", "-Dtests=false",
         "-Dintrospection=disabled", "-Dselinux=disabled",
         "-Dlibmount=disabled", "-Dsysprof=disabled"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }
[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "glib-2.0"]]
expect = ["2.86.4"]