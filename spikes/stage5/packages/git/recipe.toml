[installs]
prefixes = ["usr/bin", "usr/libexec/git-core", "usr/share/bash-completion", "usr/share/git-core"]
files    = 224
digest   = "04c89eea33b85a7fe5f9c1b969098a4291350e4d243cad7c2687954607bd1617"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/git-2.53.0.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--with-curl", "--with-expat",
         "--with-openssl", "--without-tcltk", "--without-iconv"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J", "NO_PERL=1", "NO_PYTHON=1", "NO_GETTEXT=1"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "NO_PERL=1", "NO_PYTHON=1", "NO_GETTEXT=1",
         "install"]]
[guest]
test   = [["/usr/bin/git", "--version"]]
expect = ["2.53.0"]