# Veron's time sources.
#
# NTS FIRST, AND THE REASON IS THE CERTIFICATE CHAIN. Plain NTP is
# unauthenticated: anyone on the path can move this machine's clock, and moving
# a clock backwards makes expired certificates valid again. Network Time
# Security authenticates the source over TLS, so the answer can be trusted the
# same way an HTTPS response is.
#
# TWO OPERATORS, NOT ONE. Cloudflare and Netnod are independent of each other
# and in different jurisdictions; chrony will not step the clock on a single
# source it cannot corroborate.
server time.cloudflare.com iburst nts
server nts.netnod.se       iburst nts

# THE POOL, UNAUTHENTICATED, AND ONLY AS A BOOTSTRAP. This exists to break a
# circularity: NTS needs TLS, TLS needs a roughly correct clock, and a machine
# whose RTC battery has died has neither. Without an unauthenticated source such
# a machine can never sync at all.
#
# maxpoll 16 KEEPS IT QUIET once the NTS sources are up, and chrony prefers
# authenticated sources when selecting -- so in normal operation this is
# outvoted rather than trusted. It is a real weakening of the guarantee and it
# is here deliberately, with the alternative being a machine that cannot boot
# into a working state on its own.
pool pool.ntp.org iburst maxpoll 16

# STEP THE CLOCK ONLY AT STARTUP, AND ONLY IF IT IS BADLY WRONG.
#
# makestep 1 3 means: for the first three updates, if the offset exceeds one
# second, jump rather than slew. After that the clock is only ever slewed, so
# time never runs backwards for anything already running -- which matters,
# because a backwards jump breaks make, breaks logs, and breaks anything
# measuring an interval.
makestep 1 3

# WRITE THE CORRECTION BACK TO THE RTC. The hardware clock is what the next
# boot reads before any network exists, so disciplining it is what makes the
# machine start out close rather than wherever it drifted to.
rtcsync

# THE DRIFT FILE IS HOW THIS SURVIVES A REBOOT USEFULLY. chrony measures how
# fast this particular oscillator runs and records it; on the next boot it
# applies the correction immediately rather than relearning it over hours.
driftfile /var/lib/chrony/drift

# NTS SESSION KEYS. Without this every boot renegotiates NTS from scratch --
# correct, but a round trip that need not happen. This directory is on the
# tmpfs overlay unless /persist provides it, so today the cache is lost at
# every reboot; pointing it at /persist is a small change and is not made.
ntsdumpdir /var/lib/chrony

# NO COMMAND ACCESS OVER THE NETWORK. chronyc talks over a unix socket; nothing
# should be able to ask this machine about its clock, or tell it anything,
# from outside.
cmdport 0

# LEAP SECONDS ARE SLEWED, NOT STEPPED, for the same reason as above: a
# one-second jump is still a jump.
leapsecmode slew
maxslewrate 1000
