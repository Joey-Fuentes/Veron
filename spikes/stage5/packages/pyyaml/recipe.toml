name    = "pyyaml"
version = "6.0.3"
group   = "build-substrate"
license = "MIT"

# Version, digest, layout and licence read from the tarball. `LICENSE = "MIT"`
# in setup.py, with LICENSE beside it.

[source]
url       = "https://files.pythonhosted.org/packages/05/8e/961c0007c59b8dd7729d542c61a4d537767a59645b82a0b521206e1e25c2/pyyaml-6.0.3.tar.gz"
sha256    = "d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f"
signature = "none -- PyPI publishes per-file digests, not detached signatures"
crosschecked_against = []
srcdir    = "pyyaml-6.0.3"

[deps]
build        = ["python"]
link         = []
runtime      = ["python"]
# libyaml IS NOT IN THE SET and is deliberately not added -- see below.
optional_off = ["pip", "setuptools", "wheel", "libyaml", "_yaml"]

[declared]
configure_flags = []
# THEY DO NOT USE OUR NAME. Without this the reconciler looks up
# "pyyaml", finds no PKGBUILD, and reports the package as
# uncorroborated -- which is a false absence, not a real one.
packaged_as     = ["python-yaml", "py3-yaml"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. HERE FOR MESA, AND ITS ABSENCE LIES ABOUT ITSELF. \
mesa's meson.build walks a list of python interpreters and `continue`s past \
any that cannot `import yaml`. When the list is exhausted the error raised is \
"Python <version> not found" -- which names the wrong thing entirely. A \
missing PyYAML looks like a missing Python.

THE C EXTENSION IS DELIBERATELY NOT BUILT. yaml/_yaml.pyx binds libyaml, \
which is not in this set. lib/yaml/__init__.py guards it:

    try:
        from .cyaml import *
        __with_libyaml__ = True
    except ImportError:
        __with_libyaml__ = False

so the pure-Python parser is used and __with_libyaml__ reports False \
honestly. mesa only ever does `import yaml`; nothing here asks for CLoader.

lib/_yaml/ IS DELIBERATELY NOT INSTALLED, and that is not an oversight. It is \
a compatibility stub for code that still does `import _yaml`, and read \
literally it does this when libyaml is absent:

    raise ModuleNotFoundError("No module named '_yaml'")

Installing it would put a module in site-packages that can only ever raise. \
Nothing in this set imports it."""

[installs]
prefixes = ["usr/lib/python3.14"]
files    = 34
digest   = "6524f419e4a5c70ae289ffc1a126b73a1281d1be7056b5eaa9a9ca33ac2695c2"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/pyyaml-6.0.3.tar.gz", "-C", "$B"]]

[[steps]]
name = "install"
cwd  = "$S"
# lib/yaml -- A THIRD LAYOUT. mako keeps its package at the top level,
# markupsafe and packaging use src/, pyyaml uses lib/. Four packages, three
# conventions, all read from the tarballs rather than recalled; getting one
# wrong installs nothing and fails inside mesa's configure much later.
#
# ONLY lib/yaml. lib/_yaml is left behind on purpose -- see the deferral.
why  = "copying a python package tree onto the interpreter path is not an argv"
shell = "set -eu; SITE=$(python3 -c 'import site; print(site.getsitepackages()[0])'); echo \"site-packages: $SITE\"; mkdir -p \"$D$SITE\"; cp -a lib/yaml \"$D$SITE/\"; echo '  lib/_yaml deliberately NOT installed (raises without libyaml)'; ls \"$D$SITE/yaml/\" | head -8"

[[steps]]
name = "verify-install"
cwd  = "$S"
# THE SECOND PROBE PARSES SOMETHING. `import yaml` succeeding proves the files
# landed; round-tripping a document proves the pure-Python parser is actually
# functional without the extension, which is the thing being relied on.
why  = "this is a check on an install path and on the pure-python parser, as two probes"
shell = "set -eu; SITE=$(python3 -c 'import site; print(site.getsitepackages()[0])'); PYTHONPATH=\"$D$SITE\" python3 -c 'import yaml; print(\"  yaml from\", yaml.__file__, yaml.__version__); print(\"  with_libyaml:\", yaml.__with_libyaml__)'; PYTHONPATH=\"$D$SITE\" python3 -c 'import yaml; print(\"  parsed:\", yaml.safe_load(\"a: [1, 2]\"))'"

[guest]
test   = [["/usr/bin/python3", "-c", "import yaml; print(yaml.__version__)"]]
expect = ["6.0.3"]
