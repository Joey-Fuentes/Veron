name       = "ruby"
version    = "4.0.6"
group      = "build-substrate"
license    = "BSD-2-Clause OR Ruby"
srcdir     = "ruby-4.0.6"
build_only = true

[source]
url       = "https://cache.ruby-lang.org/pub/ruby/4.0/ruby-4.0.6.tar.gz"
sha256    = "837d299e8f7ddf2be31a229a7a7e019d354979825117989acb3b32b1a9be262a"
signature = "none -- cache.ruby-lang.org publishes checksums on the release page rather than detached signatures"
crosschecked_against = []

[deps]
build        = ["pkgconf", "libyaml", "zlib", "libffi", "gmp"]
link         = ["libyaml", "zlib", "libffi", "gmp"]
runtime      = []
optional_off = ["yjit", "zjit", "openssl", "doc", "rdoc"]

[declared]
configure_flags = ["--prefix=/usr", "--disable-install-doc",
                   "--disable-install-rdoc", "--disable-yjit", "--disable-zjit",
                   "--with-out-ext=openssl", "--enable-shared"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["ruby"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 was
measured here and matches the value stated with it.

build_only = true, AND THAT IS THE POINT OF THIS PACKAGE. wpewebkit uses ruby
for CODE GENERATION and nothing else: Source/JavaScriptCore/CMakeLists.txt
lines 268, 299, 312, 319 and 470 run generator/main.rb, opcode_generator.rb,
generate_settings_extractor.rb, generate_offset_extractor.rb and asm.rb, which
between them produce the bytecode tables, the B3/Air opcodes and the LLInt --
JavaScriptCore's interpreter. Source/WebCore adds two more. Nothing in a
running Veron executes ruby, so a 30 MB interpreter has no business in a
browser appliance. Same mechanism freetype-bootstrap uses: built, staged so
later packages can use it, then excluded from the image.

THE RELEASE TARBALL IS LOAD-BEARING AND A GITHUB ARCHIVE OF THE TAG WILL NOT
DO. Upstream's own instructions split the cases: from a tarball it is
"./configure && make && make install" with a C compiler; from the git
repository "you will also need autoconf, gperf, RUBY 3.1 OR LATER, git". The
archive of v4.0.6 ships configure.ac and no configure, and no parse.c, id.h,
lex.c, revision.h or enc/trans/newline.c -- those are generated BY RUBY, so
building it from git needs a ruby that this system does not have. This tarball
carries all six; checked, not assumed. Same distinction that made libidn2's
first pin unbuildable.

--disable-yjit AND --disable-zjit, BECAUSE RUBY 4.0 IS THE FIRST RELEASE WHOSE
DEFAULT BUILD WANTS RUST. Cargo.toml declares a workspace of zjit, yjit and
jit, and configure.ac:3939 says the JITs are "enabled by default on supported
platforms if rustc 1.58.0+ is available". There is no rustc here, so both
would have resolved to off by absence -- which is exactly the kind of silent
resolution this project states instead. No Rust is a policy here, and this is
the first package to brush against it.

--with-out-ext=openssl. Upstream lists OpenSSL under "For RubyGems", not for
the interpreter, and there is no openssl in this set. Excluding the extension
outright beats letting extmk.rb probe and skip it, because a probe that
happens to fail looks identical to one that was never meant to run. WHAT THIS
COSTS IS RubyGems OVER HTTPS, which nothing here does. The generators were
checked rather than assumed: every `require` across WebKit's ruby scripts is
date, digest, erb, fileutils, json, optparse, pathname, set, shellwords,
stringio and yaml. `yaml` is psych and needs libyaml, which is why libyaml is
a link dependency; `json` and `digest` are C extensions that build without
openssl because ruby bundles its own SHA and MD5.

gmp AND libffi ARE DECLARED THOUGH THEY ARE OPTIONAL. Upstream lists them as
"optional, recommended" -- gmp accelerates Bignum, libffi builds fiddle. Both
are already in this set, so both would be found and linked whether declared or
not; declaring them makes the edge visible to the resolver and to `veron
linked` rather than leaving two silent runtime links.

--enable-shared BUILDS libruby AS A SHARED LIBRARY. The default is static,
which would make the interpreter binary large and duplicate the whole runtime
into it. Nothing here links libruby, so this is about the build product's
shape rather than about consumers.

--disable-install-doc AND --disable-install-rdoc SKIP GENERATING rdoc AND ri
DOCUMENTATION, which for ruby is a substantial share of the build time and
produces files nothing in this image will read."""

[undeclarable]
"program:gperf" = "configure probes for gperf and uses it only when regenerating lexer tables from source edits; upstream calls it 'usually unneeded'. Present in this set for glib's sake."

[installs]
prefixes = ["usr/bin", "usr/include/ruby-4.0.0", "usr/lib", "usr/lib/pkgconfig", "usr/lib/ruby", "usr/share/man"]
files    = 2914
digest   = "2e415ef24329be07feaee62f51eec3ef7cfc2821495997ea0ca512cd770671d7"

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/ruby-4.0.6.tar.gz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-install-doc",
         "--disable-install-rdoc", "--disable-yjit", "--disable-zjit",
         "--with-out-ext=openssl", "--enable-shared"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "install", "DESTDIR=$D"]]

[guest]
# build_only, SO THIS NEVER RUNS. A package excluded from the image has no
# guest to test it in. The assertion that matters is that wpewebkit's
# configure finds it, and that is wpewebkit's to make.
test   = []
expect = []
