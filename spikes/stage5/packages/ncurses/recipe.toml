name    = "ncurses"
version = "6.6"
group   = "build-substrate"
license = "MIT"

# EVERY FACT BELOW WAS MEASURED, NOT REMEMBERED. Version, digest, signing key,
# licence and build system come from `probe url https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz`.
# Nine versions were probed and all nine differed from what would have been
# written from memory, so nothing here is typed from recall.

[source]
url       = "https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz"
sha256    = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"
signature = "https://ftp.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz.sig"
# The key that made that signature, read from the signature itself with an
# EMPTY keyring -- the probe deliberately does not import a key fetched
# alongside the artifact it signs, because that proves nothing. Compare this
# against the project's published fingerprint, then verify locally, before
# treating the pin as trusted.
signing_key = "19882D92DDA4C400C22C0D56CC2AF4472167BE03"
crosschecked_against = []   # name the packagers whose digest you compared

[deps]
build        = []
link         = []
runtime      = []
optional_off = ["gpm", "libtool", "ada"]

[declared]
# KEY BUMPED 2026-08-30: G3 finds five files differing cross-machine
# (tic, tput, tset, libncursesw.so, libncurses++w.a) on a recipe that
# has not changed in a long time -- two historical builds against two
# historical sysroots, preserved by resume. The user's standard is
# deterministic, not declared-expected: this bump rebuilds it on the
# converged sysroots, accepting the cascade it drags (llvm links
# ncurses; mesa and the graphical world follow). If the files STILL
# differ after both sides rebuild fresh, the survivor is a live
# mechanism and gets dissected and pinned before this comment is
# touched again.
configure_flags = ["--with-pkg-config-libdir=/usr/lib/pkgconfig",
                   
  "--prefix=/usr", "--with-shared", "--without-debug", "--without-ada",
  "--enable-widec", "--enable-pc-files", "--without-normal",
]
# NO TEST SUITE EXISTS. The probe found no check target, and this is stated
# rather than omitted: "verification: none" is a declared deferral, whereas
# an absent field looks like nobody thought about it.
verification    = "none -- upstream suites are not run; see deferral"
deferral = """
Internals not reviewed and THERE IS NO UPSTREAM TEST SUITE to defer to, which \
makes this the weakest verification in group 1. The only evidence it works is \
the guest sanity test below and whatever links against it later.

--enable-widec builds libncursesw, not libncurses; consumers that ask for the \
narrow name need compatibility links. 157 configure options were offered and \
the seven above are choices, not defaults.

UPSTREAM TESTS ARE NOT RUN, BY POLICY, AND THIS IS THE LARGEST VERIFICATION \
GAP IN THE SET. Running full suites in series does not scale past a handful \
of packages -- twelve of them already dominated the build, and the plan is \
150+. They were run once, at twelve packages, and the result is recorded: \
every suite that ran passed except the exclusions each recipe already names. \
Evidence now comes from the guest sanity tests, which run against the booted \
image and check that each package actually works. Re-enable a suite per \
package when there is a reason to; the step is one block."""

[installs]
prefixes = ["usr/bin", "usr/include", "usr/lib", "usr/lib/pkgconfig", "usr/share/man", "usr/share/tabset", "usr/share/terminfo"]
files    = 3883
digest   = "284d542f71a1ee934d8bb894439c6e63cd9c898f0f4177edc0893811b9d34325"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/ncurses-6.6.tar.gz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
# THE ARCHIVER RECORDS THE BUILD USER, AND ONLY THIS PACKAGE'S DOES.
# G3 cross-machine (2026-08-30) found usr/lib/libncurses++w.a as the one
# static archive in the tree differing between CI and the laptop, while
# every other package's .a agreed. `cmp -l` showed sixteen differing
# bytes, all 61 vs 60 -- ASCII '1' against '0', the last digit of the
# uid/gid fields in each ar member header (1001/1001 on the runner,
# 1000/1000 on the laptop). Member names, sizes and contents were
# identical: the objects were never in question, only who built them.
#
# WHY THIS PACKAGE ALONE: modern binutils ar is deterministic by
# default, which is why nobody else's archives carry an owner, but
# ncurses' configure probes for archiver flags and picks `-curvU`
# first -- and U explicitly UNDOES deterministic mode. Pinning the
# autoconf cache variable is what settles the probe: it short-circuits
# AC_CACHE_CHECK entirely rather than racing its preference list. D is
# the inverse flag: zero uid, gid and mtime in every member header.
# ONE VARIABLE, NOT TWO. Setting cf_cv_ar_flags AND ARFLAGS made ncurses
# compose them: the c++ library link ran `ar -curvD -curvD ...` and ar
# rejected the repeat (CI, 2026-08-31, rc=2 at libncurses++w.a). The
# cache variable alone settles the probe; ARFLAGS was belt-and-braces
# that turned out to be the belt tied twice.
env  = { cf_cv_ar_flags = "-curvD" }
run  = [["./configure", "--prefix=/usr", "--with-shared", "--without-debug",
         "--without-ada", "--enable-widec", "--enable-pc-files",
         "--without-normal",
         "--with-pkg-config-libdir=/usr/lib/pkgconfig"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "ncursesw"]]
expect = ["6.6"]
