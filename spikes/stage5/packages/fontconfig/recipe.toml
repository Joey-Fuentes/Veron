name    = "fontconfig"
version = "2.17.1"
group   = "text-rendering"
license = "MIT"

# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.17.1/fontconfig-2.17.1.tar.xz"
sha256    = "9f5cae93f4fffc1fbc05ae99cdfc708cd60dfd6612ffc0512827025c026fa541"
signature = "none -- no detached signature published beside the release"
crosschecked_against = []

[deps]
# libxml2 IS NOT LINKED AND WAS DECLARED ANYWAY. fontconfig can use either
# expat or libxml2 for its XML parsing and takes exactly one; this build takes
# expat, pinned above. `link` and `runtime` feed the ledger and the image, so
# declaring libxml2 there asserted a dependency the built library does not
# have. libxml2 stays in the SET -- libarchive genuinely wants it -- it is
# just not fontconfig's.
# pkgconf IS A REAL BUILD DEPENDENCY AND WAS INVISIBLE FOR 55 PACKAGES.
# meson's dependency() resolves through pkg-config first, so without it every
# external library lookup fails -- and in the shared build root pkgconf has
# been present since rung 11, so nothing ever noticed. stage5-isolate found it
# the moment glib was built from its declarations alone:
#
#     Did not find pkg-config by name 'pkg-config'
#     Run-time dependency libpcre2-8 found: NO (tried pkgconfig and cmake)
#     Downloading pcre2 source from https://github.com/PCRE2Project/...
#
# pcre2 WAS in the layer stack. Nothing could find it.
build        = ["meson", "ninja", "freetype", "expat", "gperf", "pkgconf"]
link         = ["freetype", "expat"]
runtime      = ["freetype", "expat"]
optional_off = ["doc", "tests", "nls", "cache-build", "libxml2"]

[declared]
configure_flags = ["-Dxml-backend=expat", "-Ddoc=disabled", "-Dtests=disabled", "-Dtools=enabled", "-Dnls=disabled", "-Dcache-build=disabled"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. gperf is a build dependency here and nowhere else in \
the set -- fontconfig generates a perfect hash for its property table with \
it, which is why gperf was added in the first place. -Dcache-build=disabled \
skips building the font cache at install time: there are no fonts in the \
DESTDIR to cache, and doing it would write a file whose contents depend on \
what happened to be installed."""

[undeclarable]
# Lookups that no .pc name can answer, disclosed per ROADMAP.md rule 4.
# Locations come from `probe.py reconcile`; every reason is read from the
# tarball. Entries whose reason could be DERIVED -- a build file this recipe
# never invokes, an option the argv disables, an applet busybox provides --
# were drafted by `--propose`; the rest were answered by hand.
# meson.build:68 dependency('expat', method: 'system' | 'expat')
"config-tool:expat" = "meson.build:68 -- same shape: line 64 finds expat via pkg-config and this branch is guarded by `not xml_dep.found()`. We pin -Dxml-backend=expat."
# meson.build:42 dependency('freetype', method: 'cmake')
"config-tool:freetype" = "meson.build:42 -- a RESCUE path, reached only when the pkg-config lookup at line 38 fails. freetype ships freetype2.pc, so it does not. This is the only genuine consumer of a non-pkg-config method in the set, and it is a fallback."
# doc/meson.build:16 docbook2html (conditional on get_option('doc-html'))
"program:docbook2html" = "Looked for only when 'doc' is on, and this recipe disables it: get_option('doc-html')"
# doc/meson.build:13 docbook2man (conditional on get_option('doc-man'))
"program:docbook2man" = "Looked for only when 'doc' is on, and this recipe disables it: get_option('doc-man')"
# doc/meson.build:15 docbook2pdf (conditional on get_option('doc-pdf'))
"program:docbook2pdf" = "Looked for only when 'doc' is on, and this recipe disables it: get_option('doc-pdf')"
# doc/meson.build:14 docbook2txt (conditional on get_option('doc-txt'))
"program:docbook2txt" = "Looked for only when 'doc' is on, and this recipe disables it: get_option('doc-txt')"
# meson.build:431 gperf (optional)
"program:gperf" = "required:false because fontconfig can use a pre-generated header, but we DO supply it -- gperf is in deps.build and exists in this set for this package alone."
# meson.build:90 pytest (optional)
"program:pytest" = "Upstream test suite. -Dtests=disabled, and suites are not run here by policy."
# meson.build:574 xgettext (conditional on opt_nls)
"program:xgettext" = "Looked for only when 'nls' is on, and this recipe disables it: opt_nls"

[installs]
prefixes = ["etc/fonts", "etc/fonts/conf.d", "usr/bin", "usr/include/fontconfig", "usr/lib", "usr/lib/pkgconfig", "usr/share/fontconfig", "usr/share/gettext", "usr/share/xml"]
files    = 87
digest   = "47843bf4a56a717f1a009bc6de8cdbbd79c89187f8f4c327f9635b843409cca6"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/fontconfig-2.17.1.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
# -Dxml-backend=expat IS A DECISION, AND IT WAS NOT ONE BEFORE.
#
# The option defaults to `auto`, and fontconfig's meson.build tries expat
# first (line 64) and only reaches libxml2 if that lookup FAILS (line 73,
# guarded by `not xml_dep.found()`). So expat won because it was found, not
# because anybody chose it -- and the recipe declared libxml2 in `link` and
# `runtime`, which the build never touched. The ledger asserted a linkage
# that does not exist.
#
# THE SAME SHAPE AS wlroots' `-Dbackends=auto`: with `auto`, what the package
# becomes is decided by what happened to be installed first. Pinning it means
# a failed expat lookup is a loud error rather than a silent switch to
# libxml2 -- which would have made the old declaration accidentally correct,
# for the wrong reason, and hidden the fault permanently.
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release",
         "-Dxml-backend=expat",
         "-Ddoc=disabled", "-Dtests=disabled", "-Dtools=enabled", "-Dnls=disabled", "-Dcache-build=disabled"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }
[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "fontconfig"]]
expect = ["2.17.1"]