name    = "elfutils"
version = "0.192"
group   = "graphics-substrate"
license = "GPL-3.0-or-later AND LGPL-3.0-or-later"
srcdir  = "elfutils-0.192"

[source]
url       = "https://sourceware.org/pub/elfutils/0.192/elfutils-0.192.tar.bz2"
sha256    = "616099beae24aba11f9b63d86ca6cc8d566d968b802391334c91df54eab416b4"
signature = "PGP signed by Mark Wielaard; not verified per-build -- the pinned sha256 is the result of that audit"
crosschecked_against = []

[deps]
# zlib IS UNCONDITIONAL -- elfutils reads compressed ELF sections. bzip2 and
# xz are optional decompressors for the same purpose and both are already in
# this set, so declining them is a real choice rather than a constraint.
build        = ["zlib"]
# zstd IS DECLARED FOR THE SAME REASON bzlib AND lzma ARE PINNED OFF
# below: configure probes for all three. The recipe's author pinned two
# and the third bit on G3's first cross-machine run (2026-08-29) -- the
# laptop's libelf carried ZSTD_compressStream2/ZSTD_decompress, CI's did
# not, because zstd happened to be staged on one sysroot at build time
# and not the other. Declared and forced ON rather than off: the kernel
# modules this system ships are zstd-compressed, and libelf that can
# read zstd-compressed sections is the useful variant -- everywhere,
# identically.
link         = ["zlib", "zstd"]
runtime      = ["zlib"]
# debuginfod IS THE ONE THAT MATTERS. --enable-debuginfod builds a client that
# FETCHES DEBUG INFORMATION OVER HTTP, and libdebuginfod would then be linked
# into anything using libelf. In a system whose whole claim is that every byte
# traces to a pinned source, a library that downloads more at runtime is not a
# feature to leave at its default.
optional_off = ["debuginfod", "libdebuginfod", "nls", "demangler",
                "bzip2", "lzma", "static"]

[declared]
configure_flags = ["CFLAGS=-g -O2 -Wno-error=discarded-qualifiers",
                   "--prefix=/usr", "--disable-debuginfod",
                   "--disable-libdebuginfod", "--disable-nls",
                   "--without-bzlib", "--without-lzma", "--with-zstd",
                   "--without-libarchive", "--disable-static",
                   "--program-prefix=eu-"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["elfutils", "libelf"]
deferral        = """
Internals not reviewed. WHY IT IS HERE: mesa links libelf, and elfutils is \
what provides it. libelf appears in NO STAGE5.md group list and has no recipe \
-- the same class as hwdata and libdisplay-info: pinned and mirrored by an \
earlier sweep, then absent from every plan that was supposed to be complete. \
Found by reading mesa's meson.build, not by any tool.

--program-prefix=eu- IS UPSTREAM'S OWN CONVENTION and stated so it stays one. \
elfutils ships tools called nm, size, strip, ar and ranlib; without the prefix \
they would collide with binutils' in /usr/bin, and the manifest's collision \
check would fail the run -- which is the good outcome, but only after a build. \
With the prefix they install as eu-nm, eu-strip and so on.

LICENCE IS A GENUINE `AND`, not an OR. The tools are GPL-3.0-or-later and the \
libraries -- libelf and libdw, which are what mesa actually links -- are \
LGPL-3.0-or-later. Both apply to what ships. That distinction is the reason \
license.py reports AND separately from hwdata's OR."""

[installs]
prefixes = ["usr/bin", "usr/include", "usr/include/elfutils", "usr/lib", "usr/lib/pkgconfig", "usr/share/man"]
files    = 94
digest   = "f0d9dd0fd9afdfb49fc08be4c6cb360936b03d8ec092730524615f8b6cc537c5"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/elfutils-0.192.tar.bz2", "-C", "$B"]]

[[steps]]
name = "glibc-compat-stubs"
cwd  = "$B"
# EMPTY ARCHIVES FOR THE LIBRARIES glibc ATE. glibc >= 2.34 folded
# libdl, libpthread, librt, libutil and libanl into libc, shipping only
# runtime compat objects -- no dev names for -ldl or -lpthread to
# resolve. Upstream elfutils still passes both, and the first REAL
# rebuild of this package in the project's history (forced by the zstd
# determinism pin, 2026-08-29) died on `cannot find -ldl`, then on
# `cannot find -lpthread` after the first flag was scrubbed -- proving
# every prior elfutils binary everywhere was a checkpoint-restored
# relic of a sysroot that no longer exists. Scrubbing flags out of
# upstream Makefiles one at a time is an arms race; this is what every
# distro's glibc does instead: an empty ar archive (the literal eight
# bytes '!<arch>\n') per legacy name, so any -lfoo of the family links
# to nothing, deterministically. LIBRARY_PATH on the build step shows
# them to ld without touching the read-only sysroot; the emitted
# libraries gain no code and no DT_NEEDED from an empty archive.
run  = [["sh", "-c", "mkdir -p $B/glibc-stubs && for l in dl pthread rt util anl; do printf '!<arch>\n' > $B/glibc-stubs/lib$l.a; done"]]

[[steps]]
name = "configure"
cwd  = "$S"
# CFLAGS CARRIES ONE UN-PROMOTION, AND IT IS NOT A STYLE CHOICE.
#
# elfutils builds with -Werror from config/eu.am, and gcc 15 rejects code
# upstream compiled cleanly on the compilers it was tested against:
#
#   riscv_disasm.c:1259: error: initialization discards 'const' qualifier
#   from pointer target type [-Werror=discarded-qualifiers]
#   cc1: all warnings being treated as errors
#
# There is no --disable-werror in this configure. Automake emits
# $(AM_CFLAGS) $(CFLAGS), so a user CFLAGS lands AFTER the -Werror and can
# un-promote a specific warning -- which is why this is a configure variable
# rather than a patch.
#
# TARGETED RATHER THAN BLANKET, deliberately. `-Wno-error` alone would work
# and would also silence every future strictness gcc gains, turning a real
# incompatibility into a silence. Naming the one warning means the next one
# fails the build and gets recorded too, the way graphite2's missing
# <cstdint> did.
#
# -g -O2 is restated because setting CFLAGS at all replaces autoconf's
# default; omitting them would quietly build elfutils unoptimised.
run  = [["./configure", "--prefix=/usr", "--disable-debuginfod",
         "--disable-libdebuginfod", "--disable-nls", "--without-bzlib",
         "--without-lzma", "--with-zstd", "--without-libarchive",
         "--disable-static", "--program-prefix=eu-",
         "CFLAGS=-g -O2 -Wno-error=discarded-qualifiers"]]

[[steps]]
name = "build"
cwd  = "$S"
env  = { LIBRARY_PATH = "$B/glibc-stubs" }
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "install"]]
env  = { DESTDIR = "$D" }

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "libelf"]]
expect = ["0.192"]
