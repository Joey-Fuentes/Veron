name    = "libogg"
version = "1.3.6"
group   = "media"
license = "BSD-3-Clause"
srcdir  = "libogg-1.3.6"

[source]
url       = "https://downloads.xiph.org/releases/ogg/libogg-1.3.6.tar.xz"
sha256    = "5c8253428e181840cd20d41f3ca16557a9cc04bad4a3d04cce84808677fa1061"
signature = "none -- downloads.xiph.org publishes no detached signature"
crosschecked_against = []

[deps]
build        = ["pkgconf"]
link         = []
runtime      = []
optional_off = ["static", "docs"]

[declared]
configure_flags = ["--prefix=/usr", "--disable-static"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["libogg"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 matches \
MIRRORS.tsv on both routes.

THE BOTTOM OF THE MEDIA STACK AND IT DEPENDS ON NOTHING. libogg is the Ogg \
container; libvorbis needs it, and gst-plugins-base's ogg plugin needs both. \
It has no dependencies of its own -- not even zlib.

WHY MEDIA IS IN THIS SET AT ALL: nothing in the desktop needs it. The entire \
group exists to serve WPE, which decodes through GStreamer. Recorded here \
because a media stack in an OS that has no media player looks like scope \
creep and is a browser requirement.

--disable-static, per policy; autotools defaults --enable-static to yes."""

[installs]
prefixes = ["usr/include/ogg", "usr/lib", "usr/lib/pkgconfig", "usr/share/aclocal", "usr/share/doc"]
files    = 92
digest   = "a664f6795e969e0ed2aabddb80b336071305ca66c12b1fb3ba1980ab52a85d4b"

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/libogg-1.3.6.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-static"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "install", "DESTDIR=$D"]]

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "ogg"]]
expect = ["1.3.6"]
