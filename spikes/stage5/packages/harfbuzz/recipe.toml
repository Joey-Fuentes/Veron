name    = "harfbuzz"
version = "12.3.2"
group   = "text-rendering"
license = "MIT"

# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://github.com/harfbuzz/harfbuzz/releases/download/12.3.2/harfbuzz-12.3.2.tar.xz"
sha256    = "6f6db164359a2da5a84ef826615b448b33e6306067ad829d85d5b0bf936f1bb8"
signature = "none -- no detached signature published beside the release"
crosschecked_against = []

[deps]
# pkgconf IS A REAL BUILD DEPENDENCY AND WAS INVISIBLE FOR 55 PACKAGES.
# meson's dependency() resolves through pkg-config first, so without it every
# external library lookup fails -- and in the shared build root pkgconf has
# been present since rung 11, so nothing ever noticed. stage5-isolate found it
# the moment glib was built from its declarations alone:
#
#     Did not find pkg-config by name 'pkg-config'
#     Run-time dependency libpcre2-8 found: NO (tried pkgconfig and cmake)
#     Downloading pcre2 source from https://github.com/PCRE2Project/...
#
# pcre2 WAS in the layer stack. Nothing could find it.
build        = ["meson", "ninja", "freetype-bootstrap", "graphite2", "glib", "icu", "pkgconf"]
link         = ["freetype-bootstrap", "graphite2", "glib", "icu"]
runtime      = ["freetype", "graphite2", "glib", "icu"]
# CORROBORATIVE DECLINES. Arch enables harfbuzz's utilities and runs its
# suite; we do neither.
#   libpng -- hb-view renders to PNG. -Dutilities is not built here.
#   zlib   -- only used by those same utilities.
#   python -- the test suite driver. -Dtests=disabled.
# All three ARE in this set, so these are real choices rather than
# constraints: enabling the utilities would make them dependencies.
optional_off = ["cairo", "tests", "docs", "introspection", "chafa", "libpng", "zlib", "python"]

[declared]
configure_flags = ["-Dgraphite2=enabled", "-Dfreetype=enabled", "-Dglib=enabled", "-Dicu=enabled", "-Dcairo=disabled"]
verification    = "none -- upstream suites are not run"
deferral        = """
FREETYPE AND HARFBUZZ DEPEND ON EACH OTHER. freetype can use harfbuzz to \
improve auto-hinting of complex scripts; harfbuzz needs freetype to read the \
font files it shapes. Neither can be built first with both features on.

THE BREAK IS TWO SEPARATE RECIPES, NOT A FLAG ON ONE. `freetype-bootstrap` \
builds without harfbuzz, harfbuzz builds against it, then `freetype` rebuilds \
with harfbuzz enabled and replaces it. They are genuinely two different \
artifacts with different bytes and different capabilities, so they get two \
names, two ledger records, and the topological sort handles them with no \
special case. A `pass = 1/2` field would have needed driver support and made \
one name mean two things.

-Dcairo=disabled BREAKS A SECOND CYCLE: cairo wants freetype and harfbuzz, \
and harfbuzz can optionally use cairo for its test rendering utilities. Those \
utilities ship nothing, so disabling is free.

deps.link names freetype-bootstrap because that is what exists when this \
builds; deps.runtime names freetype because that is what will be installed \
when this runs. The distinction is real and the two fields are the only \
place it can be said."""

[undeclarable]
# Lookups that no .pc name can answer, disclosed per ROADMAP.md rule 4.
# Locations come from `probe.py reconcile`; every reason is read from the
# tarball. Entries whose reason could be DERIVED -- a build file this recipe
# never invokes, an option the argv disables, an applet busybox provides --
# were drafted by `--propose`; the rest were answered by hand.
# src/rust/meson.build:13 cargo (REQUIRED)
"program:cargo" = "src/rust/meson.build -- entered only when harfrust or fontations is enabled. Both default to 'disabled' and both gate on .enabled(). No Rust anywhere, by policy."
# src/meson.build:1009 g-ir-scanner (conditional on get_option('introspection'))
"program:g-ir-scanner" = "Looked for only when 'introspection' is on, and this recipe disables it: get_option('introspection')"
# docs/meson.build:1 gtkdoc-scan (conditional on get_option('docs'))
"program:gtkdoc-scan" = "Looked for only when 'docs' is on, and this recipe disables it: get_option('docs')"
# util/meson.build:20 help2man (optional)
"program:help2man" = "Man pages for the hb-view/hb-shape utilities, which are not built."
# src/meson.build:444 ragel (optional)
"program:ragel" = "The release tarball ships pre-generated ragel output, so the generator is never needed from a release. It would be from a git checkout."
# src/rust/meson.build:14 rustfmt (REQUIRED)
"program:rustfmt" = "Same directory, same gate as cargo."

[installs]
prefixes = ["usr/bin", "usr/include/harfbuzz", "usr/lib", "usr/lib/cmake", "usr/lib/pkgconfig"]
files    = 61
digest   = "03291a2455c6ca4c3a51ffabe6364b8e06548e30e893c441baa8fc29a163dceb"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/harfbuzz-12.3.2.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release",
         "-Dgraphite2=enabled", "-Dfreetype=enabled", "-Dglib=enabled", "-Dicu=enabled", "-Dcairo=disabled", "-Dtests=disabled", "-Ddocs=disabled", "-Dintrospection=disabled"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }
[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "harfbuzz"]]
expect = ["12.3.2"]