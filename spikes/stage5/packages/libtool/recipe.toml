name    = "libtool"
version = "2.6.2"
group   = "build-substrate"
license = "GPL-2.0-or-later"

# EVERY FACT BELOW WAS MEASURED, NOT REMEMBERED. Version, digest, signing key,
# licence and build system come from `probe url https://ftp.gnu.org/gnu/libtool/libtool-2.6.2.tar.xz`.
# Nine versions were probed and all nine differed from what would have been
# written from memory, so nothing here is typed from recall.

[source]
url       = "https://ftp.gnu.org/gnu/libtool/libtool-2.6.2.tar.xz"
sha256    = "2ef1067c16c97db930fd740cc9bc3d3ba9a583804ae5ac42cc3e8719e49e191e"
signature = "https://ftp.gnu.org/gnu/libtool/libtool-2.6.2.tar.xz.sig"
# The key that made that signature, read from the signature itself with an
# EMPTY keyring -- the probe deliberately does not import a key fetched
# alongside the artifact it signs, because that proves nothing. Compare this
# against the project's published fingerprint, then verify locally, before
# treating the pin as trusted.
signing_key = "FA26CA784BE188927F22B99F6570EA01146F7354"
crosschecked_against = []   # name the packagers whose digest you compared

[deps]
build        = ["m4"]
link         = []
runtime      = ["m4"]
optional_off = []

[declared]
configure_flags = ["--prefix=/usr", "--disable-static"]
verification    = "none -- upstream suites are not run; see deferral"
deferral        = """
Internals not reviewed; upstream test suite only. libtool installs .la files \
into every package that uses it, and those files HARDCODE PATHS -- the stage-4 \
sysroot already carries three with dead build-tree paths in them. Worth \
watching as the set grows: a .la pointing at a removed tree fails late and \
confusingly.

THREE TESTS ARE EXCLUDED AND THE CAUSE IS NOT YET KNOWN. 76 \
(runpath-in-lalib) and 129 (need_lib_prefix) fail; 187 re-runs the suite with \
a low max_cmd_len and fails only because those two do. The working hypothesis \
is that libtool's global_symbol_pipe -- nm piped through sed -- returns an \
incomplete symbol list under busybox's sed, which would match the single \
missing entry in 129 and the pattern of three earlier busybox thinnesses in \
this same batch. The libtool-symbol-pipe step gathers evidence for or against \
that. This is an OPEN ITEM, not a resolved one, and 70 of the suite's other \
failures are libtool's own declared expected failures rather than ours.

UPSTREAM TESTS ARE NOT RUN, BY POLICY, AND THIS IS THE LARGEST VERIFICATION \
GAP IN THE SET. Running full suites in series does not scale past a handful \
of packages -- twelve of them already dominated the build, and the plan is \
150+. They were run once, at twelve packages, and the result is recorded: \
every suite that ran passed except the exclusions each recipe already names. \
Evidence now comes from the guest sanity tests, which run against the booted \
image and check that each package actually works. Re-enable a suite per \
package when there is a reason to; the step is one block."""

[installs]
prefixes = ["usr/bin", "usr/include", "usr/include/libltdl", "usr/lib", "usr/share/aclocal", "usr/share/info", "usr/share/libtool", "usr/share/man"]
files    = 66
digest   = "0d284c5187f0fae5cc70294294e5d85d77ec43a6f14876e647c5370cb797fefe"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/libtool-2.6.2.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-static"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]

[guest]
test   = [["/usr/bin/libtool", "--version"]]
expect = ["2.6.2"]
