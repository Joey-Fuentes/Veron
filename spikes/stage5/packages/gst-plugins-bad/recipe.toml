name    = "gst-plugins-bad"
version = "1.28.1"
group   = "media"
license = "LGPL-2.1-or-later"
srcdir  = "gst-plugins-bad-1.28.1"

[source]
url       = "https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.1.tar.xz"
sha256    = "56c1593787f8b5550893d59e4ff29e6bcccf34973316fa55e34ce493e04313a2"
signature = "none -- gstreamer.freedesktop.org publishes no detached signature"
crosschecked_against = []

[deps]
build        = ["meson", "ninja", "pkgconf", "gstreamer", "gst-plugins-base",
                "glib", "orc"]
link         = ["gstreamer", "gst-plugins-base", "glib", "orc"]
runtime      = ["gstreamer", "gst-plugins-base", "glib", "orc"]
optional_off = ["introspection", "nls", "examples", "tests", "doc", "gpl"]

[declared]
configure_flags = ["--libdir=lib",
                   "-Dauto_features=disabled", "-Dvideoparsers=enabled",
                   "-Dintrospection=disabled",
                   "-Dnls=disabled", "-Dexamples=disabled",
                   "-Dtests=disabled", "-Ddoc=disabled", "-Dgpl=disabled",
                   "--wrap-mode=nofallback"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["gst-plugins-bad"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 matches \
MIRRORS.tsv on both routes.

248 OPTIONS, AND THIS RECIPE ENABLES ONE. That ratio is the point of \
-Dauto_features=disabled: "bad" is not lower quality, it is the module whose \
plugins have not met the project's own bar for API stability or test \
coverage, and it is where a maximalist build drags in the largest number of \
unrelated dependencies. Two things here are wanted.

videoparsers IS THE ONE THAT MATTERS: h264parse and h265parse live here, and \
without them an H.264 stream cannot be handed to a decoder in the form it \
expects. STAGE5.md's codec argument -- that H.264 decoding comes from ffmpeg \
via gst-libav, which is why gst-plugins-ugly and x264 were dropped -- depends \
on this element existing to feed it.

THERE IS NO dav1d ELEMENT HERE, AND THE FIRST VERSION OF THIS RECIPE ASSUMED \
THERE WAS. `-Ddav1d=enabled` was written and then checked: the option does not \
exist in this module, or in base, or in good -- `grep -c dav1d` returns 0 for \
all three. GStreamer's dav1ddec lives in gst-plugins-rs, which is RUST and \
therefore not available to this set at all.

THAT DOES NOT MEAN AV1 IS ABSENT. ffmpeg is built --enable-libdav1d, so AV1 \
decoding reaches the same library through gst-libav rather than through a \
native GStreamer element -- exactly the route H.264 takes. So the dav1d package \
earns its place via ffmpeg, and this module does not depend on it. The wrong \
assumption would have failed at configure with an unknown option rather than \
silently, but it would also have declared a dependency that is not real.

-Dgpl=disabled IS A LICENCE FLAG, NOT A FEATURE ONE, and it is the same shape \
as ffmpeg's --enable-gpl. Several plugins in this module are GPL and are gated \
behind it; enabling it would move the licence of what gets built. Nothing \
wanted here is behind that gate.

THE SELECTION IS PROVISIONAL. WPE's own requirements have not been read from \
its source. For this module in particular that is likely to change the answer: \
WebKit uses elements from bad for adaptive streaming (dash, hls) and for \
several codec paths, and none of those is enabled here yet. Named so it is \
found rather than discovered."""

[installs]
prefixes = ["usr/include/gstreamer-1.0", "usr/lib", "usr/lib/gstreamer-1.0", "usr/lib/pkgconfig", "usr/share/gstreamer-1.0"]
files    = 195
digest   = "e36d16367f0022bd01c2c61e239f820f5ec00c075c2e499d6a3642bf2f94b55a"

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/gst-plugins-bad-1.28.1.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release", "--libdir=lib",
         "--wrap-mode=nofallback",
         "-Dauto_features=disabled", "-Dvideoparsers=enabled",
         "-Dintrospection=disabled", "-Dnls=disabled",
         "-Dexamples=disabled", "-Dtests=disabled", "-Ddoc=disabled",
         "-Dgpl=disabled"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }

[guest]
# gst-inspect --exists CHECKS AN ELEMENT, NOT A PLUGIN, AND CANNOT CHECK A
# PLUGIN AT ALL. These tests named plugins -- playback, isomp4, matroska,
# videoparsersbad, libav -- and every one failed:
#
#     FAIL  gst-inspect-1.0 --exists --atleast-version=1.28.1 isomp4 did not run
#
# tools/gst-inspect.c:2387 is gst_registry_lookup_feature(registry, argv[1]),
# which resolves FEATURES. The plugin branch three lines further down is
# unimplemented and says so outright:
#
#     /* FIXME: support checking for plugins too */
#     g_printerr ("Checking for plugins is not supported yet\n");
#     exit_code = -1;
#
# So --exists with a plugin name is not merely wrong, it is a mode the tool
# does not have. The element names below were read out of each package's
# own sources rather than guessed: an element is what a pipeline actually
# instantiates, so asserting one proves the plugin loaded AND registered.

test   = [["/usr/bin/gst-inspect-1.0", "--exists", "--atleast-version=1.28.1", "h264parse"]]
expect = [""]
