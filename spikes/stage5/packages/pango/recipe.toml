name    = "pango"
version = "1.57.0"
group   = "text-rendering"
license = "LGPL-2.1-or-later"

# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://download.gnome.org/sources/pango/1.57/pango-1.57.0.tar.xz"
sha256    = "890640c841dae77d3ae3d8fe8953784b930fa241b17423e6120c7bfdf8b891e7"
signature = "none -- download.gnome.org publishes no detached signature"
crosschecked_against = []

[deps]
# pkgconf IS A REAL BUILD DEPENDENCY AND WAS INVISIBLE FOR 55 PACKAGES.
# meson's dependency() resolves through pkg-config first, so without it every
# external library lookup fails -- and in the shared build root pkgconf has
# been present since rung 11, so nothing ever noticed. stage5-isolate found it
# the moment glib was built from its declarations alone:
#
#     Did not find pkg-config by name 'pkg-config'
#     Run-time dependency libpcre2-8 found: NO (tried pkgconfig and cmake)
#     Downloading pcre2 source from https://github.com/PCRE2Project/...
#
# pcre2 WAS in the layer stack. Nothing could find it.
build        = ["meson", "ninja", "cairo", "harfbuzz", "fribidi", "fontconfig", "freetype", "glib", "pkgconf"]
link         = ["cairo", "harfbuzz", "fribidi", "fontconfig", "freetype", "glib"]
runtime      = ["cairo", "harfbuzz", "fribidi", "fontconfig", "freetype", "glib"]
optional_off = ["introspection", "documentation", "build-testsuite", "xft", "libthai"]

[declared]
configure_flags = ["-Dintrospection=disabled", "-Ddocumentation=false", "-Dbuild-testsuite=false", "-Dxft=disabled", "-Dcairo=enabled"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. -Dxft=disabled removes the X11 font backend, matching \
cairo. libthai is off: Thai word-breaking would be a further dependency for \
one script, and it can be added when someone needs it. labwc uses pango for \
titlebar text."""

[undeclarable]
# Lookups that no .pc name can answer, disclosed per ROADMAP.md rule 4.
# Locations come from `probe.py reconcile`; every reason is read from the
# tarball. Entries whose reason could be DERIVED -- a build file this recipe
# never invokes, an option the argv disables, an applet busybox provides --
# were drafted by `--propose`; the rest were answered by hand.
# meson.build:530 g-ir-scanner (conditional on get_option('introspection'))
"program:g-ir-scanner" = "Looked for only when 'introspection' is on, and this recipe disables it: get_option('introspection')"
# docs/meson.build:1 gi-docgen (conditional on get_option('documentation'))
"program:gi-docgen" = "Looked for only when 'documentation' is on, and this recipe disables it: get_option('documentation')"
# docs/meson.build:222 rst2html5 (conditional on get_option('documentation'))
"program:rst2html5" = "Looked for only when 'documentation' is on, and this recipe disables it: get_option('documentation')"
# docs/meson.build:221 rst2man (conditional on get_option('man-pages'))
"program:rst2man" = "required: get_option('man-pages'). Documentation is off; -Ddocumentation=false."

[installs]
prefixes = ["usr/bin", "usr/include/pango-1.0", "usr/lib", "usr/lib/pkgconfig"]
files    = 53
digest   = "b8343e4690ebee7b93afe3fdd63b1d8310a24cebbf16a732dc596aceae3ef735"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/pango-1.57.0.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release",
         "-Dintrospection=disabled", "-Ddocumentation=false", "-Dbuild-testsuite=false", "-Dxft=disabled", "-Dcairo=enabled", "-Dfreetype=enabled", "-Dfontconfig=enabled"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }
[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "pango"]]
expect = ["1.57.0"]