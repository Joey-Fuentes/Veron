name    = "cairo"
version = "1.18.4"
group   = "text-rendering"
license = "LGPL-2.1-or-later-or-MPL-1.1"

# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://www.cairographics.org/releases/cairo-1.18.4.tar.xz"
sha256    = "445ed8208a6e4823de1226a74ca319d3600e83f6369f99b14265006599c32ccb"
signature = "none -- cairographics.org publishes no detached signature"
crosschecked_against = []

[deps]
# pkgconf IS A REAL BUILD DEPENDENCY AND WAS INVISIBLE FOR 55 PACKAGES.
# meson's dependency() resolves through pkg-config first, so without it every
# external library lookup fails -- and in the shared build root pkgconf has
# been present since rung 11, so nothing ever noticed. stage5-isolate found it
# the moment glib was built from its declarations alone:
#
#     Did not find pkg-config by name 'pkg-config'
#     Run-time dependency libpcre2-8 found: NO (tried pkgconfig and cmake)
#     Downloading pcre2 source from https://github.com/PCRE2Project/...
#
# pcre2 WAS in the layer stack. Nothing could find it.
build        = ["meson", "ninja", "pixman", "freetype", "fontconfig", "libpng", "glib", "zlib", "pkgconf"]
link         = ["pixman", "freetype", "fontconfig", "libpng", "glib", "zlib"]
runtime      = ["pixman", "freetype", "fontconfig", "libpng", "glib", "zlib"]
optional_off = ["xlib", "xcb", "tests", "spectre", "symbol-lookup", "gtk2-utils", "quartz"]

[declared]
configure_flags = ["-Dxlib=disabled", "-Dxcb=disabled", "-Dglib=enabled", "-Dfreetype=enabled", "-Dfontconfig=enabled", "-Dpng=enabled", "-Dzlib=enabled"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. -Dxlib and -Dxcb DISABLED is the load-bearing pair: \
cairo would otherwise detect and link X11, and there is no X11 here by \
policy. labwc uses cairo for window decorations, which is why it is in the \
set at all."""

[undeclarable]
# Lookups that no .pc name can answer, disclosed per ROADMAP.md rule 4.
# Locations come from `probe.py reconcile`; every reason is read from the
# tarball. Entries whose reason could be DERIVED -- a build file this recipe
# never invokes, an option the argv disables, an applet busybox provides --
# were drafted by `--propose`; the rest were answered by hand.
# meson.build:602 gs (conditional on get_option('tests'))
"program:gs" = "Looked for only when 'tests' is on, and this recipe disables it: get_option('tests')"
# src/meson.build:273 sh (optional)
"program:sh" = "Provided by busybox in the sandbox; the box is busybox throughout. src/meson.build:273 sh (optional)"
# meson.build:300 ttx (optional)
"program:ttx" = "fonttools' ttx, used to build the test fonts. -Dtests=disabled."

[installs]
prefixes = ["usr/bin", "usr/include/cairo", "usr/lib", "usr/lib/cairo", "usr/lib/pkgconfig"]
files    = 35
digest   = "3ab42fba7e69dde19b76bd39fecd57cbfeab02e041d0296dd96f260193fd81dd"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/cairo-1.18.4.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release",
         "-Dxlib=disabled", "-Dxcb=disabled", "-Dtests=disabled", "-Dspectre=disabled", "-Dsymbol-lookup=disabled", "-Dglib=enabled", "-Dfreetype=enabled", "-Dfontconfig=enabled", "-Dpng=enabled", "-Dzlib=enabled"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }
[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "cairo"]]
expect = ["1.18.4"]