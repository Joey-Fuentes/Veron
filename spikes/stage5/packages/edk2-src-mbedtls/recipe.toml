name       = "edk2-src-mbedtls"
version    = "0bebf8b8"
group      = "build-substrate"
license    = "Apache-2.0 OR GPL-2.0-or-later"
build_only = true

# A SOURCE COURIER FOR A DIRECTORY THE PARSER DEMANDS, NOT CODE A BUILD
# COMPILES. Run 88511513325 measured the distinction the consumed-objects
# trial missed: CryptoPkg.dec:34-36 declares an include path inside this submodule,
# and edk2's build.py validates every declared path EXISTS before any
# module compiles -- absent, the build dies in metadata at 2 seconds
# ("error 000E: File/directory not found"). A container rebuild with only
# the dec-declared set planted and seven other submodules emptied passed
# metadata and reached the identical compile frontier, which is the
# sufficiency proof. Pin from run 88505453858; $DL name computed by
# mirror.artifact_name itself (project-prefixed: the sha begins with a digit).

[source]
url       = "https://github.com/ARMmbed/mbedtls/archive/0bebf8b8c7f07abe3571ded48a11aa907a1ffb20.tar.gz"
sha256    = "61ac65f6362f898677b2a4cf2a769b41e4aee0985cb45f046d3b719388e5be59"
signature = "none -- archive-by-commit; the commit is the pin, measured at run 88505453858"
crosschecked_against = []

[deps]
build        = []
link         = []
runtime      = []
optional_off = []

[declared]
configure_flags = []
verification    = "edk2-firmware's metadata pass with this planted is the test"
deferral        = "Vendored third-party source; reviewed by edk2 upstream at submodule-bump time, not here."

[installs]
prefixes = ["usr/src/edk2"]
files    = 1
digest   = "93c4aac3a11888dfeed52a6b9735fcc4905047859131bde5c99a49cdfc812e63"
[[steps]]
name = "stage"
cwd  = "$B"
run  = [["sh", "-c", "install -D -m644 $DL/mbedtls-0bebf8b8c7f07abe3571ded48a11aa907a1ffb20.tar.gz $D/usr/src/edk2/mbedtls.tar.gz"]]

[guest]
# build_only bytes-courier; edk2-firmware consuming it is the test.
