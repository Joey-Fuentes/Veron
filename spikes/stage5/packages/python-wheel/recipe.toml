name    = "python-wheel"
version = "0.48.0"
group   = "build-substrate"
license = "MIT"

# THE SMALLER TWIN OF python-setuptools; read that recipe for the whole
# argument. One extra irony worth recording: setuptools >= 70.1 no longer
# needs this package at all (upstream wheel's own README says install it
# "only if you intend to use the wheel command line tool"), but qemu's
# pythondeps.toml [tooling] group checks for the DISTRIBUTION by name with
# accepted >= 0.34.2, so its absence fails configure regardless of whether
# any code path imports it. 33 KB buys the check.
#
# The .whl is published via PyPI trusted publishing with a sigstore
# attestation (transparency entry 2426854769); the sha below matches the
# attested subject digest.

[source]
url       = "https://files.pythonhosted.org/packages/2e/29/69cfbb602cd91690c55d38ba9fe53e6a7e76a6fa647bf38f19c138d25449/wheel-0.48.0-py3-none-any.whl"
sha256    = "3217dcc807155e45db462d7ef2431f5ddda0d7273b700d05a67b271ceb1287ab"
signature = "sigstore -- attested subject digest, transparency entry 2426854769 (pypi.org/project/wheel/#files)"
crosschecked_against = []

[deps]
build        = ["python"]
link         = []
runtime      = ["python"]
optional_off = []

[declared]
configure_flags = []
verification    = "install-time import against $D asserts the version importlib.metadata reports"
deferral        = """
Internals not reviewed; pure python. The wheel CLI entry point is not \
installed -- import surface only, which is all the [tooling] check reads."""

[installs]
prefixes = ["usr/lib/python3.14"]
files    = 21
digest   = "0f73a620bc4b8dd69200f542d2be935e4d4e4c2f017eaf4a7ffbea3007108c86"
[[steps]]
name = "install"
cwd  = "$B"
run  = [["sh", "-c", "mkdir -p $D/usr/lib/python3.14/site-packages && python3 -m zipfile -e $DL/wheel-0.48.0-py3-none-any.whl $D/usr/lib/python3.14/site-packages/"]]

[[steps]]
name = "bytecode"
cwd  = "$B"
# DETERMINISTIC BYTECODE, WRITTEN ON PURPOSE. G3's first cross-machine run
# (2026-08-29) found this package's .pyc files differing between CI and a
# laptop -- the wheel ships none; the import check below was writing
# __pycache__ into $D as a SIDE EFFECT, stamped with extraction-time
# mtimes. checked-hash invalidation (PEP 552) embeds the source's hash
# instead of its mtime, and -s/-p make the recorded path /usr/... rather
# than the build tree's. The import check then runs with bytecode writing
# OFF, so verification can never again alter what it verifies.
run  = [["sh", "-c", "python3 -m compileall -q --invalidation-mode checked-hash -s $D -p / $D/usr/lib/python3.14/site-packages"]]

[[steps]]
name = "importable-or-die"
cwd  = "$B"
env  = { PYTHONDONTWRITEBYTECODE = "1" }
run  = [["sh", "-c", "PYTHONPATH=$D/usr/lib/python3.14/site-packages python3 -c 'import importlib.metadata as m; v=m.version(\"wheel\"); assert v==\"0.48.0\", v; import wheel; print(\"wheel\", v)'"]]
[guest]
test   = [["python3", "-c", "import importlib.metadata as m; print(m.version('wheel'))"]]
expect = ["0.48.0"]
