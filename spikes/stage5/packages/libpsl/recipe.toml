name    = "libpsl"
version = "0.21.5"
group   = "browser-substrate"
license = "MIT"
srcdir  = "libpsl-0.21.5"

[source]
url       = "https://github.com/rockdaboot/libpsl/releases/download/0.21.5/libpsl-0.21.5.tar.gz"
sha256    = "1dcc9ceae8b128f3c0b3f654decd0e1e891afc6ff81098f227ef260449dae208"
signature = "none -- no detached signature published beside the release"
crosschecked_against = []

[deps]
build        = ["meson", "ninja", "pkgconf", "python", "icu"]
link         = ["icu"]
runtime      = ["icu"]
optional_off = ["docs", "tests"]

[declared]
configure_flags = ["-Druntime=libicu", "-Dbuiltin=true", "-Ddocs=false",
                   "-Dtests=false", "--wrap-mode=nofallback"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["libpsl"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 matches \
MIRRORS.tsv on both routes.

WHAT IT IS FOR: the Public Suffix List, which is how a browser knows that a \
cookie set for `.co.uk` is an attack and one set for `.example.co.uk` is not. \
libsoup declares it at meson.build:160.

-Druntime=libicu SOLVES THE libidn2 PROBLEM RATHER THAN INHERITING IT. The \
option is a combo over ['libidn2', 'libicu', 'libidn', 'no', 'auto'] and \
defaults to auto -- which would prefer libidn2, the one package in this batch \
that cannot currently be built (its pin is a GitLab archive with no configure \
and a bootstrap that fetches gnulib). icu IS in this set already, for \
harfbuzz's sake, and provides the same IDNA/UTS-46 handling. So naming libicu \
turns a blocker into a dependency that is already satisfied.

THAT ALSO MAKES THE CHOICE VISIBLE. At `auto` the IDNA backend would be \
decided by which library happened to be installed -- and the answer would \
change the day libidn2 lands, silently, with cookie-domain handling as the \
thing that moved.

-Dbuiltin=true IS THE DEFAULT AND IS KEPT DELIBERATELY. It compiles a snapshot \
of the suffix list INTO the library rather than reading /usr/share/publicsuffix \
at runtime. For a read-only image with no updater that is the right shape -- \
but it means THE LIST AGES WITH THE PIN. A suffix list from 0.21.5 will be \
wrong about new TLDs, and the fix is a version bump rather than a data file. \
Stated so nobody is surprised."""

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/libpsl-0.21.5.tar.gz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release",
         "--wrap-mode=nofallback",
         "-Druntime=libicu", "-Dbuiltin=true", "-Ddocs=false",
         "-Dtests=false"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "libpsl"]]
expect = ["0.21.5"]
