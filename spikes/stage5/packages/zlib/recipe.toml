name    = "zlib"
version = "1.3.2"
group   = "build-substrate"
license = "Zlib"

# EVERY FACT BELOW WAS MEASURED, NOT REMEMBERED. Version, digest, signing key,
# licence and build system come from `probe url https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.xz`.
# Nine versions were probed and all nine differed from what would have been
# written from memory, so nothing here is typed from recall.

[source]
url       = "https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.xz"
sha256    = "d7a0654783a4da529d1bb793b7ad9c3318020af77667bcae35f95d0e42a792f3"
signature = "https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.xz.asc"
# The key that made that signature, read from the signature itself with an
# EMPTY keyring -- the probe deliberately does not import a key fetched
# alongside the artifact it signs, because that proves nothing. Compare this
# against the project's published fingerprint, then verify locally, before
# treating the pin as trusted.
signing_key = "5ED46A6721D365587791E2AA783FCD8E58BCAFBA"
crosschecked_against = []   # name the packagers whose digest you compared

[deps]
build        = []
link         = []
runtime      = []
optional_off = []

[declared]
# zlib ships BOTH autotools and cmake. Choosing matters and is recorded: the
# hand-written configure is what upstream documents and what every distro
# uses, and adding cmake here would put a second large build system into
# group 1 for one package.
build_system_chosen = "configure (not the bundled cmake)"
configure_flags = ["--prefix=/usr"]
verification    = "none -- upstream suites are not run; see deferral"
deferral        = """
Internals not reviewed; upstream test suite only. zlib's configure is a \
hand-written shell script, not autoconf, so it accepts none of the usual \
--disable flags -- there is nothing optional to turn off and nothing detected \
from the environment.

UPSTREAM TESTS ARE NOT RUN, BY POLICY, AND THIS IS THE LARGEST VERIFICATION \
GAP IN THE SET. Running full suites in series does not scale past a handful \
of packages -- twelve of them already dominated the build, and the plan is \
150+. They were run once, at twelve packages, and the result is recorded: \
every suite that ran passed except the exclusions each recipe already names. \
Evidence now comes from the guest sanity tests, which run against the booted \
image and check that each package actually works. Re-enable a suite per \
package when there is a reason to; the step is one block."""

[installs]
prefixes = ["usr/include", "usr/lib", "usr/lib/pkgconfig", "usr/share/man"]
files    = 8
digest   = "100b702368b72b888fe1e0f1252cf580c0c5c39fda0ba11a712932e465c2c252"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/zlib-1.3.2.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "zlib"]]
expect = ["1.3.2"]
