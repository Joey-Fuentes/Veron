name    = "gmp"
version = "6.3.0"
group   = "tls"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"
srcdir  = "gmp-6.3.0"

[source]
url       = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz"
sha256    = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
signature = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz.sig"
crosschecked_against = []

[deps]
build        = ["pkgconf", "m4"]
link         = []
runtime      = []
optional_off = ["cxx", "fat", "static"]

[declared]
configure_flags = ["--prefix=/usr", "--disable-static", "--enable-cxx=no",
                   "--build=aarch64-veron-linux-gnu",
                   "--host=aarch64-veron-linux-gnu"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["gmp"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 matches \
MIRRORS.tsv on both routes.

WHY IT IS HERE: nettle's public-key half (hogweed) links gmp, and gnutls \
requires hogweed. It is three packages below the browser and none of the three \
is optional.

THE VENDOR FIELD IS veron, NOT unknown, AND GETTING IT WRONG BROKE THE BUILD \
OUTRIGHT. configure died with:

    checking compiler gcc -O2 -pedantic ... no, long long reliability test 1
    configure: error: could not find a working compiler

-- which reads as a broken toolchain and is nothing of the kind. \
configure:1338 is

    ac_tool_prefix=
    test -n "$host_alias" && ac_tool_prefix=$host_alias-

so PASSING --host AT ALL SETS A TOOL PREFIX, and every tool is then looked for \
under it. `aarch64-unknown-linux-gnu-gcc` does not exist in this sysroot; \
`aarch64-veron-linux-gnu-gcc` does, along with -g++, -ar, -nm and -ranlib. The \
wrong vendor pointed the entire toolchain lookup at names nothing answers to.

A FIRST DIAGNOSIS OF THIS BLAMED C23 AND WAS WRONG. gmp's test program at \
configure:6564 declares `void g(){}` and calls it with six arguments, which \
C23 forbids -- a real hazard, and not this one. Compiling that exact program \
with the actual stage-4 compiler settles it:

    aarch64-veron-linux-gnu-gcc 15.2.0
    gcc -O2 -pedantic -c <gmp's test program>   ->  rc=0

Clean at the default standard. The language was never the problem; the \
compiler simply was not being found. The stage-4 toolchain is aarch64-veron-linux-gnu-gcc -- its \
libdir is /usr/lib/gcc/aarch64-veron-linux-gnu and every driver in the sysroot \
carries that prefix. Writing aarch64-unknown-linux-gnu asserts a host the \
compiler does not agree it targets, and gmp's configure ECHOED IT BACK \
unchallenged:

    checking build system type... aarch64-unknown-linux-gnu
    checking host system type... aarch64-unknown-linux-gnu

-- which looks like confirmation and is only repetition. autoconf compares \
build against host to decide whether it is cross-compiling; it does not check \
either against the compiler.

That selects microarchitecture-specific assembly paths. So the SAME SOURCE on \
two different aarch64 machines produces DIFFERENT BINARIES -- a Neoverse \
runner and a Cortex-A57 laptop would each get code tuned for themselves, and \
files.tsv would differ with nothing in the recipe having changed. Naming a \
generic triple stops config.guess from looking.

THIS IS THE FIRST PACKAGE IN THE SET WHERE THE BUILD MACHINE'S CPU MODEL COULD \
CHANGE THE ARTIFACT. Others read the host's filesystem (dhcpcd's passwd probe, \
libcap's ldd) or its installed libraries (ffmpeg's autodetect); this one reads \
its silicon.

--enable-cxx=no IS THE DEFAULT AND IS STATED. The C++ bindings would add \
libgmpxx, which nothing here uses, and would make libstdc++ a runtime \
dependency of the TLS stack.

--enable-fat IS NOT PASSED. It builds runtime CPU dispatch, which would be \
another answer to the tuning problem -- one binary carrying every variant. It \
is x86-oriented in practice and larger; pinning the triple is the smaller fix.

DUAL-LICENSED LGPL-3.0-or-later OR GPL-2.0-or-later, a genuine OR at the \
recipient's choice."""

[undeclarable]
"program:m4" = "gmp's build generates code with m4 during compilation, not merely during autoreconf. From the stage-4 sysroot."

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/gmp-6.3.0.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-static", "--enable-cxx=no",
         "--build=aarch64-veron-linux-gnu",
         "--host=aarch64-veron-linux-gnu"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "install", "DESTDIR=$D"]]

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "gmp"]]
expect = ["6.3.0"]
