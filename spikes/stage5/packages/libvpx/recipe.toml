name    = "libvpx"
version = "1.16.0"
group   = "media"
license = "BSD-3-Clause"
srcdir  = "libvpx-1.16.0"

[source]
url       = "https://github.com/webmproject/libvpx/archive/v1.16.0/libvpx-1.16.0.tar.gz"
sha256    = "7a479a3c66b9f5d5542a4c6a1b7d3768a983b1e5c14c60a9396edc9b649e015c"
signature = "none published -- GitHub archive, digest is ours"
crosschecked_against = []

[deps]
build        = ["pkgconf"]
link         = []
runtime      = []
# --enable-shared IS OPT-IN AND --enable-static IS THE DEFAULT. Both stated.
optional_off = ["examples", "tools", "docs", "unit-tests"]

[declared]
configure_flags = ["--prefix=/usr", "--enable-shared", "--disable-static",
                   "--disable-examples", "--disable-tools", "--disable-docs",
                   "--enable-vp8", "--enable-vp9", "--enable-pic"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["libvpx"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 matches \
MIRRORS.tsv on both routes.

ITS configure IS HAND-WRITTEN, NOT autoconf, AND THE DEFAULTS RUN THE OTHER \
WAY. `--enable-shared` is opt-IN here and `--disable-static` must be asked for \
-- the reverse of the autotools convention used everywhere else in this set. \
An unqualified build produces a static archive only, which would be linked \
into ffmpeg and then invisible to `veron linked` for the same reason utf8proc \
would have been.

--enable-pic IS STATED. Without it a static-leaning build can produce objects \
that will not link into a shared ffmpeg, and the failure appears at ffmpeg's \
link step rather than here.

VP8 AND VP9 ARE BOTH ENABLED, DELIBERATELY. VP9 is what WebM serves today and \
VP8 is still present in WebRTC-era content; neither is large enough to argue \
about, and enabling them by name means an upstream default change cannot \
quietly drop one.

BLFS CROSS-CHECK, AND IT CHANGED TWO THINGS. multimedia/libvpx.html agrees on \
--enable-shared and --disable-static, and adds two steps this recipe did not \
have: a dedicated build directory, because "the libvpx developers recommend \
building in a dedicated build directory", and `sed -i 's/cp -p/cp/'` on \
build/make/Makefile to correct installed ownership and permissions. Both are \
now here. BLFS also documents --disable-vp8 and --disable-vp9 as OPT-OUT \
switches, confirming both codecs are on by default -- the --enable-vp8 and \
--enable-vp9 passed here are therefore statements rather than changes.

NO ASSEMBLER DEPENDENCY ON THIS ARCHITECTURE. configure's --as option offers \
yasm or nasm and defaults to auto, but those are x86 assemblers; the aarch64 \
paths are .S files handled by the C compiler. So there is nothing to declare \
here that would be required on x86 -- worth writing down, because a recipe \
that builds on ARM and fails on x86 for a missing nasm is the kind of thing \
that looks like a regression later."""

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/libvpx-1.16.0.tar.gz", "-C", "$B"]]

[[steps]]
name = "fix-install-mode"
cwd  = "$S"
shell = "sed -i 's/cp -p/cp/' build/make/Makefile"
why = """
libvpx's install rules use `cp -p`, which preserves the SOURCE file's ownership
and permissions rather than applying the install target's. BLFS carries this
same sed and explains it as correcting "the ownership and permissions of
installed files". It matters more here than there: every path in the image is
recorded in files.tsv with its mode, and a library whose permissions came from
whatever the tarball happened to carry is a mode nobody chose.
"""

[[steps]]
name = "configure"
cwd  = "$S"
# OUT OF TREE, ON UPSTREAM'S OWN ADVICE. BLFS: "The libvpx developers recommend
# building in a dedicated build directory." The first version of this recipe
# built in-tree, which libvpx tolerates rather than supports.
run  = [["sh", "-c", "mkdir -p _b && cd _b && ../configure --prefix=/usr --enable-shared --disable-static --disable-examples --disable-tools --disable-docs --enable-vp8 --enable-vp9 --enable-pic"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-C", "_b", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "-C", "_b", "install", "DESTDIR=$D"]]

[guest]
test   = [["/usr/bin/pkgconf", "--modversion", "vpx"]]
expect = ["1.16.0"]
