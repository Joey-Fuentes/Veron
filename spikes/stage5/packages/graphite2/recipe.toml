name    = "graphite2"
version = "1.3.14"
group   = "text-rendering"
license = "LGPL-2.1-or-later"
srcdir  = "graphite2-1.3.14"
# Version, digest, signature and build system measured by `probe url`.

[source]
url       = "https://github.com/silnrsi/graphite/releases/download/1.3.14/graphite2-1.3.14.tgz"
sha256    = "f99d1c13aa5fa296898a181dff9b82fb25f6cc0933dbaa7a475d8109bd54209d"
signature = "none -- no detached signature published beside the release"
crosschecked_against = []

[deps]
build        = ["cmake", "ninja"]
link         = []
runtime      = []
# CORROBORATIVE DECLINE. Arch's graphite runs the test suite, which is
# python-driven. -DGRAPHITE2_NTRACING and tests are off here.
optional_off = ["comparerenderer", "docs", "tests", "python"]

[declared]
configure_flags = ["-DCMAKE_POLICY_VERSION_MINIMUM=3.5", "-DCMAKE_INSTALL_PREFIX=/usr", "-DBUILD_SHARED_LIBS=ON", "-DGRAPHITE2_COMPARE_RENDERER=OFF"]
# THEY DO NOT USE OUR NAME. Without this the reconciler looks up
# "graphite2", finds no PKGBUILD, and reports the package as
# uncorroborated -- which is a false absence, not a real one.
packaged_as     = ["graphite"]
verification    = "none -- upstream suites are not run"
deferral        = """
Internals not reviewed. Smart-font shaping for scripts harfbuzz cannot handle \
alone; harfbuzz links it. COMPARE_RENDERER is a test harness that wants \
freetype and libicu and produces nothing that ships."""

[installs]
prefixes = ["usr/bin", "usr/include/graphite2", "usr/lib", "usr/lib/pkgconfig", "usr/share/graphite2"]
files    = 12
digest   = "4b857c998a4d53aa23527a9178c962fec164a540039cbef738c23c97e1992701"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/graphite2-1.3.14.tgz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
# CMAKE, NOT AUTOTOOLS. graphite2 ships only a CMakeLists, which is why it
# sits after cmake in the order despite being a small library.
#
# -DCMAKE_POLICY_VERSION_MINIMUM=3.5 IS WHAT MAKES THIS CONFIGURE AT ALL.
# Line 1 of the tarball's CMakeLists.txt is
#
#     CMAKE_MINIMUM_REQUIRED(VERSION 2.8.0 FATAL_ERROR)
#
# and cmake 4.0 REMOVED compatibility with anything below 3.5 -- a hard
# error, not a deprecation warning, raised before a single other line is
# read. graphite2 1.3.14 is from 2018 and has had no release since, so this
# is not a pin that can be moved forward; the variable is the escape hatch
# cmake 4.0 shipped for exactly this case.
#
# DECLARED PER-PACKAGE, DELIBERATELY, AND NOT IN policy/. $CMAKE is global
# because it states something about THIS SYSTEM -- pkg-config is how
# dependencies are discovered. This is a fact about ONE OLD TARBALL, and
# hoisting it to policy would silently configure every future pre-3.5
# package the same way instead of making each one say so. The set should
# have to name its antiques.
run  = [["cmake", "-S", ".", "-B", "_b", "-G", "Ninja",
         "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
         "-DCMAKE_INSTALL_PREFIX=/usr", "-DCMAKE_BUILD_TYPE=Release",
         "-DBUILD_SHARED_LIBS=ON", "-DGRAPHITE2_COMPARE_RENDERER=OFF"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }
[guest]
# 3.0.1, NOT 1.3.14 -- MEASURED BY THE BOOT, NOT ASSUMED. `pkgconf
# --modversion graphite2` reports the ABI version, set at CMakeLists.txt:91
# as `set(version 3.0.1)`, which is what lands in graphite2.pc. The release
# version 1.3.14 appears nowhere in the .pc file.
#
# harfbuzz asks for `graphite2 >= 1.2.0` and 3.0.1 satisfies it, so nothing
# downstream changes -- but the guest test asserted a number this package
# never publishes, and only a booted image with the full set could say so.
test   = [["/usr/bin/pkgconf", "--modversion", "graphite2"]]
expect = ["3.0.1"]