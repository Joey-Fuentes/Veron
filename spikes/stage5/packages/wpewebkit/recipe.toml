sha256    = "bcfc6c91db7659dcf24f6ff79ad27ac1eae1bc61dca0dbfee154706926740b3b"
signature = "none -- wpewebkit.org publishes .asc signatures; not yet pinned here"
crosschecked_against = []

# WHAT ONE COMPILE JOB COSTS HERE -- AND WHERE THE MONSTER ACTUALLY LIVED.
# Three kernel logs on an 8 GiB machine, all naming WebCore bundles of
# generated JS-DOM bindings: 4.62 GiB (-O3), 5.13 GiB (-O2, bundle 8),
# 2.58 GiB (-O2, bundle 4 + global collector caps -- which also took CI
# from 150-190 min to 305 by taxing all ~8700 TUs to shrink a handful).
# Research plus reading the bundler settled the mechanism: the binding
# bundles hold the SAME 8 files as everyone else, but each generated
# JS*.cpp is individually enormous. Patch 0004 therefore bundles WebCore
# JS* files at 3 per TU -- sparse, the inverse of the script's unused
# dense feature -- leaving every other TU at upstream size and upstream
# cost. With patch 0003's collector caps on those same bundles (the
# Debian/Igalia device for exactly this, ~40% peak reduction on record),
# predicted worst is ~1.5-1.9 GiB.
#
# JavaScriptCore's standalone JIT giants (DFGSpeculativeJIT*, FTL, BBQ,
# Parser -- upstream's own @no-unify list) are the same monster class and
# killed the first -j3 run at object 1913; patch 0005 puts the identical
# collector caps on exactly that list.
#
# 2026-08-29 EARLY MORNING, THE MODEL MET build.ninja: 535 commands carry
# the collector caps, 527 carry -O1 -- the property patches LAND. The
# -j2 kill was an ORDINARY dom/ bundle at 3.5 GiB (-O2, GCC 15.2) beside
# a 2.8 GiB sibling: plain bundles range higher than the 3.0 the
# ram_per_job comment assumed. Patch 0003 now caps the collector on ALL
# WebCore bundles (JS ones additionally -O1); measured-in-the-wild ~40%
# cuts put the worst pair near 4.5-5 GiB in 6.8 available.
#
# THE CI LINK FAILURE OF 2026-08-29 (undefined nameLiteral, CommonVM,
# DOMWrapperWorld symbols after 210 min) was patch 0004's own defect, now
# fixed IN the patch: bundle filenames hashed the directory while the
# counter reset per PREFIX, so sparse and default groups sharing a
# directory overwrote each other's UnifiedSource files and the earlier
# group's code silently left the build. Filenames now hash the prefix
# with one persistent counter per key -- collision-free under any
# interleaving, proven by simulation before shipping.
#
# THE EVENING'S THREE FACTS, read off the machine instead of modeled:
# MemTotal is 7251 MiB (iGPU carve-out; ~6.8 GiB available), the compiler
# is GCC 15.2.0, and a THREE-file sparse bindings bundle led by
# JSDOMWindow.cpp was killed at anon-rss 4.9 GiB WITH collector caps
# already applied -- live IR, immune to GC tuning and to bundling. Patch
# 0003 therefore compiles the binding bundles at -O1 (recorded there),
# which attacks the live IR itself: ~1.2-1.8 GiB predicted peak, faster
# compiles on every machine, a runtime cost confined to DOM-binding
# crossings.
#
# 3000 -- RAISED FROM 2000 AFTER THE -j3 RUN'S KILL (2026-08-28, object
# 7397): with the bindings sparse and JSC capped, the biggest remaining
# unit is an ORDINARY WebCore unified bundle at an estimated 2.5-3.0 GiB,
# and three of those together outgrew the machine. Two fit by
# measurement: 2 x 3.0 = 6.0 in ~7. This is not the -j2 that died on
# 2026-08-28 morning -- that death was the 5.13 GiB bindings bundle,
# which patch 0004 has since removed from existence. An 8 GiB machine
# derives 2 jobs; a 16 GiB runner still derives 4 (16000/3000=5, capped
# by cores and the recipe), so CI is untouched. If a kernel log shows a
# kill at -j2, the anon-rss on the named file replaces the estimate --
# raise this, never lower -j in the step. Scheduling only: the bytes do
# not depend on the count.
[build]
ram_per_job_mib = 3700
# 3700, THE CLOSING NUMBER OF THE MEMORY CAMPAIGN (2026-08-29): the same
# dom/ bundle died AGAIN with the collector caps verified ON its compile
# line -- like the bindings, its weight is live IR, beyond GC tuning. On
# a machine reporting 7251 MiB this derives ONE job: the largest
# remaining TU (~3.5 GiB, ordinary bundle, was 6.2 before the campaign)
# runs alone in ~6.8 GiB available, and nothing can be co-scheduled
# against it. A 16 GiB runner still derives 4 (16000/3700=4): CI shape
# unchanged. Every cheaper configuration was tried and measured to
# death; the kernel logs are quoted above. If this machine ever gains
# swap or the toolchain's live-IR appetite shrinks, lower this and the
# same recipe speeds up -- the bytes never depended on it.

