                   "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["wpewebkit"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 matches \
MIRRORS.tsv on both routes. This is the largest build in the project: 136 \
minutes and rc=0, measured on a hosted runner with 107 GB free, which is the \
number that decided self-hosted runners were not needed.

OPENING THIS TARBALL ANSWERED THREE QUESTIONS THAT HAD BEEN OPEN FOR SEVERAL \
BATCHES, AND THE ANSWERS ARE IN Source/cmake/OptionsWPE.cmake:12-27 -- eighteen \
find_package(... REQUIRED) lines:

  libgcrypt IS REQUIRED (line 17). Its recipe was written saying "why it is \
  here is not established". It is established now.
  libhyphen IS REQUIRED (line 262). USE_LIBHYPHEN defaults ON and a missing \
  Hyphen_FOUND is a FATAL_ERROR.
  libtasn1 IS REQUIRED DIRECTLY (line 19), not only through gnutls.
  RUBY IS REQUIRED AND NEITHER AUDIT FOUND IT, WHICH IS THE WORST MISS OF
  THE THREE. WebKitCommon.cmake:205 is `find_package(Ruby 2.5 QUIET)` --
  QUIET, not REQUIRED -- with the fatal check written out by hand eleven
  lines later, so a grep for `find_package(... REQUIRED)` cannot match it.
  Upstream even explains the shape: "We cannot check for Ruby_FOUND because
  it is set only when the full package is installed and the only thing we
  need is the interpreter." And BLFS lists Ruby-4.0.1 under Required on the
  webkitgtk page whose -D flags were read while its dependency list was not.
  Two checks, both looking at the wrong thing. It generates JavaScriptCore's
  bytecode tables, B3/Air opcodes and the LLInt; there is no browser without
  it. It is build_only, so it does not ship.

  unifdef IS REQUIRED (line 25) AND DID NOT EXIST -- not a package, not \
  pinned, not in the sysroot. It was found only by reading this file, and WPE \
  cannot configure without it.

AND TWO PINS REMAIN UNEXPLAINED. json-c appears NOWHERE in this source tree, \
and neither does nss or nspr -- the only NSS-adjacent hit is a comment about \
OpenSSL for SFrame encryption in GStreamerChecks.cmake. Those three artifacts \
are pinned and no consumer has been found for any of them. json-c's recipe \
says so; nss and nspr have no recipe and should not get one until something \
asks for them.

THE FIRST VERSION OF THIS RECIPE AUDITED OptionsWPE.cmake:12-27 AND STOPPED \
THERE, WHICH IS WHY IT WOULD NOT HAVE BUILT. Those are the unconditional \
find_package lines; the file continues for another 300, and two of the \
conditional blocks are reached with their conditions ON by default:

    :301  if (ENABLE_XSLT)            find_package(LibXslt 1.1.13 REQUIRED)
    :305  if (ENABLE_WPE_LEGACY_API)  find_package(WPE REQUIRED)

NEITHER libxslt NOR libwpe IS PINNED -- zero rows in MIRRORS.tsv for both. So \
configure would have run for however long it takes to reach line 301 and then \
stopped. Reading the top of a file and treating it as the whole story is the \
same mistake qemu's recipe made with `configure --help`.

-DENABLE_XSLT=OFF DROPS XSLT STYLESHEET PROCESSING, which is a document \
transformation feature almost nothing on the modern web uses, and costs a \
pinned package plus its own libxml2 version constraint.

-DENABLE_WPE_PLATFORM=ON WITH -DENABLE_WPE_LEGACY_API=OFF IS THE INTERESTING \
ONE. OptionsWPE.cmake:170 is a FATAL_ERROR unless at least one of the two is \
enabled, so this is a choice between platform layers rather than a way to \
avoid both. The legacy API needs libwpe, an external library. WPEPlatform is \
in-tree and its requirements (lines 311-323) are LibInput, Udev, Wayland and \
WaylandProtocols -- ALL FOUR ALREADY IN THIS SET. So the new layer costs \
nothing and the old one costs a pin.

DRM, WAYLAND AND HEADLESS ARE ALL KEPT. Each defaults ON and each is a \
backend WPEPlatform can render through: DRM for a bare framebuffer, Wayland \
for a session under labwc, headless for a test with no display. Veron will \
use the Wayland one; the other two cost little and headless is what a CI \
render check would want.

BLFS HAS NO wpewebkit PAGE -- ONLY webkitgtk -- AND CROSS-CHECKING AGAINST IT \
ANYWAY FOUND THREE FATAL_ERRORs. x/webkitgtk.html is the GTK port, but the two \
share Source/cmake, so its flag list is worth diffing even though the ports \
differ. Four flags it passes were missing here, and three of them stop the \
build outright:

  USE_WOFF2 defaults ON (OptionsWPE.cmake:283) and line 286 is
      message(FATAL_ERROR "libwoff2dec is required for USE_WOFF2")
    libwoff2 is not pinned -- zero rows in MIRRORS.tsv. WOFF2 is a web font
    container; without it @font-face falls back to the other formats.

  USE_LIBBACKTRACE defaults ON (line 121) and line 467 is
      message(FATAL_ERROR "libbacktrace is required for USE_LIBBACKTRACE")
    Also unpinned. It symbolises crash backtraces, which is a debugging aid.

  USE_SYSPROF_CAPTURE defaults ON (line 130) and FindSysProfCapture.cmake
    looks for sysprof-capture-4 by pkg-config. Unpinned. It is tracing
    instrumentation.

  ENABLE_MINIBROWSER defaults ON already; it is stated because MiniBrowser is
    the only host program this image has for the library, and leaving the one
    executable that can open a page to a default is not a decision.

CMAKE_SKIP_INSTALL_RPATH=ON COMES FROM BLFS TOO. Without it cmake bakes the \
build tree's library paths into the installed binaries -- the same class of \
build-host leakage as libgpg-error's --disable-rpath and libcap's ldd \
derivation.

PERL IS REQUIRED AND IS ALREADY HERE. WebKitCommon.cmake:196-197 wants Perl \
5.10+ and the English, FindBin and JSON::PP modules, unconditionally. The \
stage-4 sysroot ships perl 5.44 with all three -- checked, not assumed -- so \
this needs no package.

FOUR DEFAULTS ARE ON AND EACH IS A HARD FAILURE HERE, NOT A DEGRADATION:

  ENABLE_JOURNALD_LOG    default ON (line 110). Line 384: "libsystemd or \
                         libelogind are needed for ENABLE_JOURNALD_LOG" --
                         FATAL_ERROR. Veron has dinit and no journal.
  ENABLE_SPEECH_SYNTHESIS default ON (line 57). Line 231: LibSpiel needed,
                         FATAL_ERROR. Not in this set.
  ENABLE_GAMEPAD         default ON (line 74), wants libmanette 0.2.4.
  ENABLE_INTROSPECTION   default ON (line 109), and ENABLE_DOCUMENTATION
                         DEPENDS on it (line 138) -- so documentation cannot
                         be left on with introspection off.

THE SANDBOX COSTS TWO THINGS THAT WERE NOT FOUND BY THE FIRST THREE AUDITS, \
AND ONE OF THEM IS NOT A PACKAGE. Source/cmake/BubblewrapSandboxChecks.cmake \
makes ENABLE_BUBBLEWRAP_SANDBOX fatal without libseccomp, bwrap AND \
xdg-dbus-proxy. Those checks are hand-written `if (NOT X) message(FATAL_ERROR)` \
blocks, which a grep for `find_package(... REQUIRED)` does not match -- and \
BLFS lists libseccomp and xdg-dbus-proxy under Recommended on the webkitgtk \
page whose flag list was read while its dependency list was not.

  libseccomp IS PINNED AND PACKAGED. It installs the syscall filter, which is
  the sandbox itself; BubblewrapLauncher.cpp is the only consumer.

  bwrap IS ALREADY HERE, from the bubblewrap package.

  xdg-dbus-proxy IS NOT PINNED, AND -DDBUS_PROXY_EXECUTABLE NAMES A PATH
  INSTEAD. BubblewrapSandboxChecks.cmake:19 is `if (NOT DEFINED
  DBUS_PROXY_EXECUTABLE)`, so defining it skips the find_program entirely.
  That is not a dodge, because the code path that would RUN the proxy is dead
  here -- XDGDBusProxy.cpp:67 is

      const char* dbusAddress = g_getenv("DBUS_SESSION_BUS_ADDRESS");
      if (!dbusAddress)
          return std::nullopt;

  and Veron has no dbus, so that variable is never set. The proxy exists to
  mediate a session bus for a sandboxed process; with no bus there is nothing
  to mediate.

  THE DAY VERON GAINS dbus, THIS BECOMES A REAL GAP. The path named here
  would not exist, sandboxed processes would lose bus access, and the failure
  would appear at runtime rather than at build. Recorded so the connection is
  findable from either end.

ENABLE_BUBBLEWRAP_SANDBOX IS ON AND IS KEPT ON, DELIBERATELY. Line 144 turns it \
on for Linux, and it is the reason bubblewrap and libcap are in this set at \
all: WPE runs its web and network processes in a bwrap sandbox. Turning it off \
would be trading the single most valuable mitigation a browser has for a \
smaller dependency list.

WEBDRIVER AND MEDIA_STREAM ARE OFF. WebDriver is browser automation for \
testing; MEDIA_STREAM is getUserMedia, which needs camera and microphone \
capture this system cannot provide and which was already the reason WebRTC was \
declined when x264 left the set.

THE GStreamer PLUGIN SELECTION IS STILL PROVISIONAL AND THIS RECIPE DOES NOT \
SETTLE IT. gst-plugins-base, good, bad and libav are declared as runtime \
dependencies because a browser needs demuxers and decoders at play time, not \
link time. Which specific plugins WPE requires is not stated in \
OptionsWPE.cmake in a form that can be read mechanically, and the honest \
position is that the sets chosen in those four recipes are a reasoned minimum \
that a first render will test.

IT HAS NEVER RENDERED A PAGE. 136 minutes and rc=0 is a compile. And the shell \
does not exist -- MiniBrowser is a bare view with keyboard shortcuts and no \
URL bar, so the chrome is Veron's to write. Both facts are already in \
STAGE5.md and neither is changed by this recipe."""

[undeclarable]
"program:unifdef" = "Source/cmake/OptionsWPE.cmake:25 -- find_package(Unifdef REQUIRED). Strips #ifdef blocks from generated headers at build time. From the unifdef package, which exists because of this line."
"program:gperf" = "WebKit generates perfect hash functions for its HTML/CSS token tables at build time."
"pkg:Journald" = "Source/cmake/OptionsWPE.cmake:382 -- find_package(Journald), FATAL_ERROR at :384 without libsystemd or libelogind. Neither is in this set and neither will be; ENABLE_JOURNALD_LOG=OFF."
"pkg:LibSpiel" = "OptionsWPE.cmake:229 -- required by ENABLE_SPEECH_SYNTHESIS, which defaults ON. Not in this set."
"pkg:Manette" = "OptionsWPE.cmake:336 -- required by ENABLE_GAMEPAD, which defaults ON. Not in this set."

[installs]
prefixes = ["usr/include/wpe-webkit-2.0", "usr/lib", "usr/lib/pkgconfig", "usr/lib/wpe-webkit-2.0", "usr/libexec/wpe-webkit-2.0", "usr/share/wpe-webkit-2.0"]
files    = 153
digest   = "f562d7c5ecc636e03f0653b121a6674acff57db9260c1eb222f3175f0f355a60"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/wpewebkit-2.52.5.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
# THE MEMORY PLAN, IN FULL, BECAUSE -j1 WAS NOT ENOUGH. An 8 GiB laptop at
# -j1 was OOM-killed 370 minutes in: cc1plus on GeneratedSerializers.cpp at
# total-vm:6348256kB, anon-rss:6210700kB (kernel log, 2026-08-27). One
# translation unit outgrew the machine, so no job count fixes it -- the unit
# of work has to shrink. Four levers, all of them flags or patches, so CI and
# the laptop build the same bytes:
#
#   -DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG (and _C_): cmake's Release
#     default for GNU is -O3 -DNDEBUG; nothing in Source/cmake overrides it,
#     so -O3 was an accident of the generator, not a decision. -O2 is what
#     Fedora and Debian ship WebKit with; it cuts cc1plus peak RSS roughly a
#     third on the largest units and compile time with it. -DNDEBUG is kept:
#     dropping it would turn every ASSERT on and change far more than bytes.
#
#   REMOVED, AND THE REMOVALS ARE PART OF THE RECORD: global ggc collector
#     caps and -DWEBKIT_UNIFIED_BUNDLE_SIZE (patch 0001 still carries the
#     knob, unused). Both were tried; together they took CI from 150-190
#     min to 305 by taxing every translation unit on every machine. The
#     8 GiB fit comes from ram_per_job_mib deriving -j2 -- see the [build]
#     comment for the kernel-log measurements and the CI bill behind this
#     shape -- plus patch 0003, which reinstates the collector caps
#     SURGICALLY: only on WebCore's JS-DOM binding bundles, the measured
#     5.13 GiB monsters, identified by bundle CONTENT so the match
#     survives regeneration. A few dozen slowed TUs cost CI minutes, not
#     the hours the global caps did, and cap the -j2 worst case.
#
#   patches/0002 compiles GeneratedSerializers.cpp (and its two siblings) at
#     -O1 with tight ggc caps. It is generated IPC marshalling glue -- every
#     encoder/decoder in one file -- and is the file the kernel named. -O1
#     there is a cost nobody will measure at runtime and ~5 GiB of peak RSS
#     nobody pays at build time.
#
# WEBKIT_NINJA_LINK_MAX=1: read by WebKitCommon.cmake at configure time to
# size ninja's link pool. The Release default is FOUR concurrent links;
# libWPEWebKit-2.0.so is a 170 MB output whose single BFD link is the
# largest non-compile consumer in the build. One link at a time, always --
# this is the same job-pool mechanism tools/veron's scheduler note says
# CMake users cannot inject from outside, reached through the knob WebKit
# itself exposes for it.
env  = { WEBKIT_NINJA_LINK_MAX = "1" }
run  = [["cmake", "-S", ".", "-B", "_b", "-G", "Ninja",
         "-DCMAKE_INSTALL_PREFIX=/usr", "-DCMAKE_INSTALL_LIBDIR=lib", "-DCMAKE_BUILD_TYPE=Release",
         "-DPORT=WPE",
         "-DENABLE_JOURNALD_LOG=OFF", "-DENABLE_INTROSPECTION=OFF",
         "-DENABLE_DOCUMENTATION=OFF", "-DENABLE_GAMEPAD=OFF",
         "-DENABLE_SPEECH_SYNTHESIS=OFF", "-DENABLE_WEBDRIVER=OFF",
         "-DENABLE_MEDIA_STREAM=OFF", "-DENABLE_BUBBLEWRAP_SANDBOX=ON",
         "-DUSE_LIBHYPHEN=ON", "-DENABLE_PDFJS=OFF",
         "-DUSE_SYSTEM_MALLOC=ON", "-DENABLE_XSLT=OFF",
         "-DENABLE_WPE_PLATFORM=ON", "-DENABLE_WPE_LEGACY_API=OFF",
         "-DENABLE_WPE_PLATFORM_DRM=ON",
         "-DENABLE_WPE_PLATFORM_WAYLAND=ON",
         "-DENABLE_WPE_PLATFORM_HEADLESS=ON",
                   "-DUSE_WOFF2=OFF",
                   "-DUSE_LIBBACKTRACE=OFF",
                   "-DUSE_SYSPROF_CAPTURE=OFF",
                   "-DENABLE_MINIBROWSER=ON",
                   "-DCMAKE_SKIP_INSTALL_RPATH=ON",
                   "-DDBUS_PROXY_EXECUTABLE=/usr/bin/xdg-dbus-proxy",
                   "-DUSE_ATK=OFF", "-DUSE_AVIF=OFF", "-DUSE_JPEGXL=OFF",
                   "-DUSE_GSTREAMER_GL=OFF",
                   "-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG",
                   "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "-j4"]]
# -j4 BECAUSE NINJA IGNORES policy jobs = 1 AND DEFAULTS TO nproc + 2.
#
# Every other package here runs `make -j$J` with J pinned to 1, and
# policy/defaults.toml says why: "PINNED, NOT DETECTED. Parallelism changes
# output bytes for some builds. `nproc` would make the image depend on the
# runner it happened to land on."
#
# `ninja -C _b` takes no -j, so it uses its OWN default -- nproc + 2. AND THAT
# IS TRUE OF EVERY MESON PACKAGE HERE, not just this one: roughly forty
# recipes invoke ninja with no -j, so `jobs = 1` has never applied to any of
# them. It has gone unnoticed because those packages are small enough that
# parallel and serial produce the same bytes and neither exhausts the runner.
# wpewebkit is the first package large enough for the difference to matter.
#
# THAT IS A REAL HOLE IN THE POLICY'S CLAIM and it is recorded here rather
# than quietly fixed: adding -j to forty recipes would move forty package keys
# and discard the checkpoint, which is a change to make deliberately and not
# in the middle of a browser bring-up.
#
# On a 4-core runner ninja's default is six concurrent
# WebKit unified-source compiles, each of which can want more than 2 GB. The
# run died at 62 minutes with exit 143 -- SIGTERM, no message, no
# `##[error] The operation was canceled`, and none of the three timeouts
# reached. That is what a runner going away looks like, not a timeout.
#
# 4 IS A MEASUREMENT, not a guess: wpewebkit has been built on this runner
# class at -j4 before, successfully.
#
# WHY NOT -j1, WHICH WOULD MATCH THE POLICY. A serial WebKit build runs into
# many hours and past any sane budget. The honest position is that this
# package trades the policy's determinism claim for a fixed, STATED constant
# -- deterministic across runners because it does not read nproc, which is
# the property jobs = 1 actually exists to protect.
#
# THE SECOND BUDGET, AND THE ONE THAT ACTUALLY STOPPED THE RUN BEFORE THIS.
#
# There are two independent timeouts and widening the workflow's did nothing
# for this one. tools/veron has DEFAULT_STEP_TIMEOUT = 1800 -- thirty minutes
# PER STEP, enforced by subprocess.run -- and the first wpewebkit compile that
# ever configured died on it:
#
#     [25m] still running: ninja -C _b
#     TIMED OUT after 30 min: ninja -C _b
#     VERON-BUILD-FAIL  wpewebkit: step 'build' rc=124
#
# rc=124 is `timeout`'s exit code, not GitHub cancelling a job.
#
# 21600 IS SIX HOURS AND IS DELIBERATELY LOOSE. llvm carries 7200 with the
# comment "the only step in this project that needs more than the default
# hour" -- that is no longer true. wpewebkit is the largest thing here by a
# wide margin and HAS NEVER COMPLETED A COMPILE, so there is no measurement to
# size this from. It sits under the workflow's 270-minute step budget, which
# is the limit that will actually bind: this one exists to stop a HUNG step,
# not to bound a long one.
#
# NARROW IT ONCE THERE IS A NUMBER, the same as the workflow budget.
timeout = 21600

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }

[guest]
# WHAT THESE ASSERT, AND WHAT THEY DELIBERATELY DO NOT.
#
# A .pc file proves a build installed something. It does not prove the browser
# can run, and this package has never rendered a page -- 136 minutes and rc=0
# is a compile. These tests raise the floor from "a file exists" to "the parts
# a running browser needs are present and loadable", and stop there; actually
# rendering is the screenshot step's job, once there is a binary to point it
# at.
#
# THE HELPER PROCESSES ARE THE POINT. WebKit is multi-process: the library in
# a host program spawns WPEWebProcess and WPENetworkProcess from
# LIBEXEC_INSTALL_DIR, which OptionsWPE.cmake:214 sets to
# /usr/libexec/wpe-webkit-2.0. If those are missing or unloadable the library
# still links, the .pc still resolves, and the first page load fails at
# runtime with nothing to attribute it to.
#
# `|| true` BECAUSE grep -c EXITS 1 WHEN THE COUNT IS ZERO. The first run of
# this test reported
#
#     FAIL  wpewebkit: ldd ... | grep -c 'not found' did not run
#
# on a build where the answer was CORRECT: grep printed 0, and exited 1
# because it matched nothing. The harness reads the exit status, so a passing
# condition was reported as a failure. The expectation "0" was right and the
# pipeline's status was the wrong thing to gate on.
#
# ldd IS USED RATHER THAN --version BECAUSE THESE BINARIES TAKE NO ARGUMENTS
# WORTH RUNNING. A helper process launched by hand does nothing useful and may
# block; `ldd` answers the question that matters -- does the loader resolve
# every DT_NEEDED -- without executing anything.
test   = [["/usr/bin/pkgconf", "--modversion", "wpe-webkit-2.0"],
          ["/bin/sh", "-c",
           "test -s /usr/share/veron/test.html && echo testpage-present"],
          ["/bin/sh", "-c",
           "test -x /usr/libexec/wpe-webkit-2.0/WPEWebProcess && echo webprocess-present"],
          ["/bin/sh", "-c",
           "test -x /usr/libexec/wpe-webkit-2.0/WPENetworkProcess && echo networkprocess-present"],
          ["/bin/sh", "-c",
           "ldd /usr/libexec/wpe-webkit-2.0/WPEWebProcess 2>&1 | grep -c 'not found' || true"],
          ["/bin/sh", "-c",
           "test -x /usr/libexec/wpe-webkit-2.0/MiniBrowser && echo minibrowser-present"]]
expect = ["2.52.5", "testpage-present", "webprocess-present", "networkprocess-present", "0",
          "minibrowser-present"]
