[declared]
configure_flags = ["-DCMAKE_INSTALL_PREFIX=/usr", "-DCMAKE_INSTALL_LIBDIR=lib", "-DCMAKE_BUILD_TYPE=Release",
                   "-DPORT=WPE", "-DENABLE_JOURNALD_LOG=OFF",
                   "-DENABLE_INTROSPECTION=OFF", "-DENABLE_DOCUMENTATION=OFF",
                   "-DENABLE_GAMEPAD=OFF", "-DENABLE_SPEECH_SYNTHESIS=OFF",
                   "-DENABLE_WEBDRIVER=OFF", "-DENABLE_MEDIA_STREAM=OFF",
                   "-DENABLE_BUBBLEWRAP_SANDBOX=ON", "-DUSE_LIBHYPHEN=ON",
                   "-DENABLE_PDFJS=OFF", "-DUSE_SYSTEM_MALLOC=ON",
                   "-DENABLE_XSLT=OFF", "-DENABLE_WPE_PLATFORM=ON",
                   "-DENABLE_WPE_LEGACY_API=OFF",
                   "-DENABLE_WPE_PLATFORM_DRM=ON",
