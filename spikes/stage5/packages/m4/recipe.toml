name    = "m4"
version = "1.4.21"
group   = "build-substrate"
license = "GPL-3.0-or-later"

# EVERY FACT BELOW WAS MEASURED, NOT REMEMBERED. Version, digest, signing key,
# licence and build system come from `probe url https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz`.
# Nine versions were probed and all nine differed from what would have been
# written from memory, so nothing here is typed from recall.

[source]
url       = "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz"
sha256    = "f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"
signature = "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz.sig"
# The key that made that signature, read from the signature itself with an
# EMPTY keyring -- the probe deliberately does not import a key fetched
# alongside the artifact it signs, because that proves nothing. Compare this
# against the project's published fingerprint, then verify locally, before
# treating the pin as trusted.
signing_key = "71C2CC22B1C4602927D2F3AAA7A16B4A2527436A"
crosschecked_against = []   # name the packagers whose digest you compared

[deps]
build        = []
link         = []
runtime      = []
optional_off = ["libsigsegv", "libiconv", "gettext"]

[declared]
configure_flags = ["--prefix=/usr", "--disable-nls"]
verification    = "make check"
deferral        = """
Internals not reviewed; upstream test suite only. libsigsegv, libiconv and \
libintl are all searched for by configure and would be linked if present -- \
none is in this system, so disabling them makes the absence a decision rather \
than an accident of what the box contained."""

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/m4-1.4.21.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-nls",
         "--without-libsigsegv-prefix", "--without-libiconv-prefix",
         "--without-libintl-prefix"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
# THE FULL SUITE, WITH THE CAUSE FIXED RATHER THAN THE TEST DELETED.
#
# This hung for 66 minutes and then failed test-execute.sh and
# test-posix_spawn_file_actions_addchdir. The cause was not m4, and not any of
# the namespace theories: bwrap already brings loopback up inside
# --unshare-net, and it already runs its own PID 1 to reap zombies. It was
# SIGPIPE arriving as SIG_IGN from the CI runner and being inherited into
# every child. gnulib's test-execute needs a child to DIE of SIGPIPE; ignored,
# the child survives, exits 71, and the pipe never tears down -- which is both
# the failure and the hang. The driver now resets it before spawning anything.
#
# The per-test timeout stays as a SAFETY NET, not as the fix. If something
# still hangs it fails in 60 seconds with a name rather than stalling a job,
# and a gnulib unit test needing over a minute is a bug either way.
name = "check"
cwd  = "$S"
timeout = 900
run  = [["make", "check", "VERBOSE=yes",
         "LOG_COMPILER=timeout", "LOG_FLAGS=60",
         "SH_LOG_COMPILER=timeout", "SH_LOG_FLAGS=60"]]

[[steps]]
# Runs only if check fails. The newest .log files are what was executing when
# time ran out; test-suite.log is absent when the harness never finished, so
# this reads both and assumes neither.
name = "why-it-failed"
cwd  = "$S/tests"
timeout = 120
on_failure = true
why = "a diagnostic is a pipeline of greps over log files, not an argv"
shell = "echo '--- newest logs (what was running) ---'; ls -t *.log 2>/dev/null | head -4; for f in $(ls -t *.log 2>/dev/null | head -3); do echo \"== $f\"; tail -25 \"$f\"; done; echo; echo '--- test-suite.log ---'; tail -50 test-suite.log 2>/dev/null || echo '(harness did not finish)'"

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]

[guest]
test   = [["/usr/bin/m4", "--version"]]
expect = ["1.4.21"]
