name    = "m4"
version = "1.4.21"
group   = "build-substrate"
license = "GPL-3.0-or-later"

# EVERY FACT BELOW WAS MEASURED, NOT REMEMBERED. Version, digest, signing key,
# licence and build system come from `probe url https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz`.
# Nine versions were probed and all nine differed from what would have been
# written from memory, so nothing here is typed from recall.

[source]
url       = "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz"
sha256    = "f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"
signature = "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz.sig"
# The key that made that signature, read from the signature itself with an
# EMPTY keyring -- the probe deliberately does not import a key fetched
# alongside the artifact it signs, because that proves nothing. Compare this
# against the project's published fingerprint, then verify locally, before
# treating the pin as trusted.
signing_key = "71C2CC22B1C4602927D2F3AAA7A16B4A2527436A"
crosschecked_against = []   # name the packagers whose digest you compared

[deps]
build        = []
link         = []
runtime      = []
optional_off = ["libsigsegv", "libiconv", "gettext"]

[declared]
configure_flags = ["--prefix=/usr", "--disable-nls"]
verification    = "make check"
deferral        = """
Internals not reviewed; upstream test suite only. libsigsegv, libiconv and \
libintl are all searched for by configure and would be linked if present -- \
none is in this system, so disabling them makes the absence a decision rather \
than an accident of what the box contained."""

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/m4-1.4.21.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-nls",
         "--without-libsigsegv-prefix", "--without-libiconv-prefix",
         "--without-libintl-prefix"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
# NAME THE NEXT TEST WITHOUT RUNNING IT. The suite stops after
# `PASS: test-error.sh` every time. The order is not alphabetical guesswork --
# it is the TESTS variable in tests/Makefile.
#
# ANSWERED: the entries after test-error are
#     test-execute-main  test-execute-child  test-execute-script
# so the hang is gnulib's `execute` module, which spawns child processes and
# waits on them. Kept as a step because the order shifts between gnulib
# vintages and the next package to hang should not need this rediscovered.
name = "which-test-is-next"
cwd  = "$S/tests"
timeout = 60
why = "reading the TESTS order out of a Makefile is grep work, not an argv"
shell = "tr ' ' '\\n' < Makefile | grep -n 'test-[a-z0-9-]*' | sed -n '/test-error/,+10p'"

[[steps]]
name = "check"
cwd  = "$S"
# 60 SECONDS PER TEST, NOT PER SUITE. automake runs every test through
# LOG_COMPILER, so `timeout -v 60` turns a hanging test into an ordinary FAIL
# with an exit status and a .log file. The suite then RUNS TO COMPLETION and
# names every hanging test at once, instead of one per CI round trip.
#
# A gnulib unit test that needs more than 60 seconds is already a bug, so this
# does not mask a slow machine -- it converts a hang into evidence.
timeout = 1800
# BUSYBOX SYNTAX, NOT GNU. The sysroot's `timeout` is a busybox applet:
#   timeout [-s SIG] [-k KILL_SECS] SECS PROG ARGS
# GNU's `-v` does not exist there, and passing it made every single test fail
# instantly with "invalid option -- 'v'" -- instrumentation that broke the
# thing it was measuring. This is the busybox-vs-GNU difference in practice:
# not a missing applet, a thinner one.
env = { LOG_COMPILER = "timeout", LOG_FLAGS = "60" }
run  = [["make", "check", "VERBOSE=yes"]]

[[steps]]
# WHATEVER FAILED, SAY WHAT IT WAS. Runs only when a previous step failed,
# which is exactly when the evidence exists and when the run would otherwise
# have thrown it away.
name = "why-it-failed"
cwd  = "$S/tests"
timeout = 120
on_failure = true
why = "a diagnostic is a pipeline of greps over log files, not an argv"
shell = "echo '=== test-suite.log ==='; tail -80 test-suite.log 2>/dev/null; echo; echo '=== non-passing test logs ==='; grep -lE '^(FAIL|ERROR)' *.log 2>/dev/null | head -10 | while read f; do echo \"--- $f\"; tail -30 \"$f\"; done"

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]

[guest]
test   = [["/usr/bin/m4", "--version"]]
expect = ["1.4.21"]
