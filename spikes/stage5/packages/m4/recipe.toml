name    = "m4"
version = "1.4.21"
group   = "build-substrate"
license = "GPL-3.0-or-later"

# EVERY FACT BELOW WAS MEASURED, NOT REMEMBERED. Version, digest, signing key,
# licence and build system come from `probe url https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz`.
# Nine versions were probed and all nine differed from what would have been
# written from memory, so nothing here is typed from recall.

[source]
url       = "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz"
sha256    = "f25c6ab51548a73a75558742fb031e0625d6485fe5f9155949d6486a2408ab66"
signature = "https://ftp.gnu.org/gnu/m4/m4-1.4.21.tar.xz.sig"
# The key that made that signature, read from the signature itself with an
# EMPTY keyring -- the probe deliberately does not import a key fetched
# alongside the artifact it signs, because that proves nothing. Compare this
# against the project's published fingerprint, then verify locally, before
# treating the pin as trusted.
signing_key = "71C2CC22B1C4602927D2F3AAA7A16B4A2527436A"
crosschecked_against = []   # name the packagers whose digest you compared

[deps]
build        = []
link         = []
runtime      = []
optional_off = ["libsigsegv", "libiconv", "gettext"]

[declared]
configure_flags = ["--prefix=/usr", "--disable-nls"]
verification    = "none -- upstream suites are not run; see deferral"
deferral        = """
Internals not reviewed; upstream test suite only. libsigsegv, libiconv and \
libintl are all searched for by configure and would be linked if present -- \
none is in this system, so disabling them makes the absence a decision rather \
than an accident of what the box contained.

THE VENDORED GNULIB SUITE IS NOT RUN BY DEFAULT, and that is a real \
reduction in verification rather than housekeeping. Of its 184 tests, 182 \
pass; test-execute.sh and test-posix_spawn_file_actions_addchdir fail, and \
something after the latter hangs in a way a per-test timeout cannot kill, \
because busybox timeout signals only the direct child while these tests leave \
grandchildren holding the log pipe. Ruled out by evidence, not argument: \
namespaces (bwrap sets up loopback and reaps PID 1 itself), SIGPIPE (Python \
restores dispositions in children), and a missing shell (/bin/sh exists). \
The tests exercise GNULIB, not m4, and the same vendored copy ships in \
autoconf, automake and libtool -- so this belongs to the sandbox and is \
tracked by the opt-in `gnulib-suite` step, reachable with `veron build \
--optional`.

UPSTREAM TESTS ARE NOT RUN, BY POLICY, AND THIS IS THE LARGEST VERIFICATION \
GAP IN THE SET. Running full suites in series does not scale past a handful \
of packages -- twelve of them already dominated the build, and the plan is \
150+. They were run once, at twelve packages, and the result is recorded: \
every suite that ran passed except the exclusions each recipe already names. \
Evidence now comes from the guest sanity tests, which run against the booted \
image and check that each package actually works. Re-enable a suite per \
package when there is a reason to; the step is one block."""

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/m4-1.4.21.tar.xz", "-C", "$B"]]

[[steps]]
name = "configure"
cwd  = "$S"
run  = [["./configure", "--prefix=/usr", "--disable-nls",
         "--without-libsigsegv-prefix", "--without-libiconv-prefix",
         "--without-libintl-prefix"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["make", "-j$J"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["make", "DESTDIR=$D", "install"]]

[guest]
test   = [["/usr/bin/m4", "--version"]]
expect = ["1.4.21"]
