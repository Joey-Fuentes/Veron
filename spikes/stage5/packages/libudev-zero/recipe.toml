name    = "libudev-zero"
version = "1.0.3"
group   = "input"
license = "ISC"
srcdir  = "libudev-zero-1.0.3"

[source]
url       = "https://github.com/illiliti/libudev-zero/archive/1.0.3/libudev-zero-1.0.3.tar.gz"
sha256    = "0bd89b657d62d019598e6c7ed726ff8fed80e8ba092a83b484d66afb80b77da5"
signature = "none published -- GitHub archive, digest is ours"
crosschecked_against = []

[deps]
# NOTHING. A plain Makefile, no configure, no meson, no external library. That
# is the point of the package: it is a reimplementation of libudev's API with
# none of systemd behind it.
build        = []
link         = []
runtime      = []
optional_off = ["static"]

[declared]
configure_flags = []
verification    = "none -- upstream suites are not run"
packaged_as     = ["libudev-zero"]
deferral        = """
Internals not reviewed. WHY THIS AND NOT systemd's libudev: libinput opens \
with `dep_udev = dependency('libudev')` -- unconditional, no `required: \
false`, no option to turn off. So SOMETHING must provide libudev.pc, and the \
alternatives are systemd or eudev. systemd is the dependency tail this whole \
project declines; libudev-zero is one Makefile and no daemon.

WHAT IT COSTS, restated after machine #1 collected the debt (2026-08-16):
the monitor IS implemented upstream -- on netlink group 0x4, a private
rebroadcast channel -- and stays deaf until a device manager FEEDS it. The
"helper" step above builds upstream's own feeder; hotplug-handler execs it
per uevent, so the running session finally hears devices that arrive after
start. The original text below predicted the discovery exactly: "it will
stop being invisible the first time somebody expects a hotplugged keyboard
to work." It was a mouse.

install DEPENDS ON install-static AS WELL AS install-shared, so libudev.a \
ships whether or not anything links it. There is no --disable-static to pass; \
the Makefile has no options at all.

THE PATCH: EV_ABS WAS THE `else` OF EV_REL, AND THAT COST US EVERY POINTER.
patches/0001 makes the two capability tests independent. Without it,
set_properties_from_evdev at udev_device.c:457 enters the EV_REL branch for any
device with a scroll wheel, fails the REL_X/REL_Y test inside it, and never
reaches the EV_ABS block -- so an absolute pointer with a wheel gets ID_INPUT=1
and NO TYPE, and libinput ignores it without saying so.

That is exactly the QEMU virtio-tablet: REL=100 is REL_WHEEL alone, ABS=3 is
ABS_X|ABS_Y, and KEY includes BTN_LEFT. The symptom was a desktop with a
working keyboard, a visible cursor, and no way to move it -- and a libinput log
naming only the keyboard and gpio-keys, with NO rejection line for the tablet
at all, because it was never considered.

REAL udev DOES NOT HAVE THIS BUG: its input_id builtin tests the capability
bits independently. So the failure is unique to systems that use this library
INSTEAD OF the udev daemon -- which is to say, systems shaped like this one."""

[installs]
prefixes = ["usr/include", "usr/lib", "usr/lib/pkgconfig"]
files    = 5
digest   = "a3e51d8aefa83fd4db91a178ff39002940e0834cc58b3ad7498381680db605cc"
[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/libudev-zero-1.0.3.tar.gz", "-C", "$B"]]

[[steps]]
name = "build"
cwd  = "$S"
# CC=gcc, BECAUSE THE Makefile DECLARES `.POSIX:` ON LINE 2.
# That switches make to POSIX-conformant defaults, where CC is `c99` rather
# than GNU make's `cc` -- and there is no c99 in the sysroot:
#
#     make: c99: No such file or directory
#     make: *** [Makefile:25: udev.o] Error 127
#
# The Makefile assigns CC nowhere, so the compiler came entirely from make's
# builtin. Naming it here removes the last thing about this build that was
# decided by which make ran it.
run  = [["make", "-j$J", "CC=gcc"]]

[[steps]]
name = "install"
cwd  = "$S"
# CC again: install-shared depends on libudev.so.1, so `make install` will
# relink if anything is out of date.
run  = [["make", "install", "PREFIX=/usr", "CC=gcc"]]
env  = { DESTDIR = "$D" }

[[steps]]
name = "helper"
cwd  = "$S"
# THE FEED FOR THE MONITOR THE DEFERRAL SAID WAS MISSING. Upstream DOES
# implement udev_monitor -- on netlink group 0x4, its OWN rebroadcast
# channel, and the README requires a device manager to feed it: "simply
# executing helper.c for each uevent", with CONFIG_UEVENT_HELPER named as
# a supported method. Our hotplug-handler is exactly that hook. helper.c
# ships in this pinned tarball; the Makefile builds only the library, so
# it is compiled here and installed where the handler execs it. Proven
# need on machine #1, 2026-08-16: mouse replug dead, session blind to
# every device that arrives after start.
run  = [["mkdir", "-p", "$D/usr/libexec"],
        ["gcc", "-O2", "-o", "$D/usr/libexec/udev-zero-helper", "contrib/helper.c"]]

[guest]
# 251, NOT THE PACKAGE VERSION AND NOT A GUESS. libudev.pc reports the
# systemd libudev API version it emulates -- Makefile:46 substitutes
# @VERSION@ with a literal 251 -- and consumers version-check against that,
# not against libudev-zero's own 1.0.3.
#
# The 243 that was here before came from neither: I wrote a plausible systemd
# version without opening the Makefile, and the booted image said so:
#
#   FAIL  libudev-zero: got [251], want [243]
#
# Same as this package's licence, which I recorded as MIT when the LICENSE
# file, the Makefile header and every SPDX tag say ISC.
test   = [["/usr/bin/pkgconf", "--modversion", "libudev"]]
expect = ["251"]
