name    = "gst-plugins-base"
version = "1.28.1"
group   = "media"
license = "LGPL-2.1-or-later"
srcdir  = "gst-plugins-base-1.28.1"

[source]
url       = "https://gstreamer.freedesktop.org/src/gst-plugins-base/gst-plugins-base-1.28.1.tar.xz"
sha256    = "1446a4c2a92ff5d78d88e85a599f0038441d53333236f0c72d72f21a9c132497"
signature = "none -- gstreamer.freedesktop.org publishes no detached signature"
crosschecked_against = []

[deps]
build        = ["meson", "ninja", "pkgconf", "gstreamer", "glib", "orc",
                "libogg", "libvorbis", "opus", "alsa-lib", "pango", "cairo"]
link         = ["gstreamer", "glib", "orc", "libogg", "libvorbis", "opus",
                "alsa-lib"]
runtime      = ["gstreamer", "glib", "orc", "libogg", "libvorbis", "opus",
                "alsa-lib"]
optional_off = ["x11", "xshm", "xvideo", "xi", "gl", "theora", "tremor",
                "cdparanoia", "libvisual", "pango", "iso-codes",
                "introspection", "nls", "examples", "tests", "doc"]

[declared]
configure_flags = ["--libdir=lib",
                   "-Dauto_features=disabled", "-Dorc=enabled",
                   "-Dapp=enabled", "-Daudioconvert=enabled",
                   "-Daudioresample=enabled", "-Dplayback=enabled",
                   "-Dtypefind=enabled", "-Dvideoconvertscale=enabled",
                   "-Dvolume=enabled", "-Dogg=enabled", "-Dopus=enabled",
                   "-Dvorbis=enabled", "-Dalsa=enabled",
                   "-Dx11=disabled", "-Dgl=disabled", "-Dpango=disabled",
                   "-Dintrospection=disabled", "-Dnls=disabled",
                   "-Dexamples=disabled", "-Dtests=disabled",
                   "-Ddoc=disabled", "--wrap-mode=nofallback"]
verification    = "none -- upstream suites are not run"
packaged_as     = ["gst-plugins-base"]
deferral        = """
Internals not reviewed. Read out of the pinned tarball, whose sha256 matches \
MIRRORS.tsv on both routes.

THE PLUGIN SELECTION IS PROVISIONAL AND THIS IS THE HONEST STATEMENT OF IT. \
69 options here, 111 in good and 248 in bad -- 466 across the three, and what \
WPE actually requires has NOT been read from wpewebkit's source, because that \
tarball has not been opened yet. The set enabled below is a reasoned minimum \
for a browser: the app plugins WebKit feeds through, the audio conversion \
chain, playback/decodebin, typefinding, video scaling, and the codecs this \
batch already builds. IT MAY BE WRONG IN BOTH DIRECTIONS -- missing something \
WPE needs, or carrying something it does not -- and the way to settle it is to \
read WPE's cmake for the plugins it names, not to guess harder here.

-Dauto_features=disabled IS WHAT MAKES THAT SAFE TO GET WRONG. With it, a \
plugin that is not named is not built, so a missing one is a clear failure at \
WPE's configure rather than a silently degraded pipeline. Without it, every \
option would resolve against whatever is installed and the difference between \
"we chose this" and "this happened" would disappear across 466 switches.

x11, xshm, xvideo AND xi ARE ALL DISABLED and would otherwise be `auto`. There \
is no X11 in this set; these would have failed to find headers and quietly \
turned themselves off, which is the right outcome by the wrong mechanism.

gl IS DISABLED, AND THAT IS A DECISION TO REVISIT. GStreamer's GL elements \
would let video frames stay on the GPU. WPE may well want them, and this set \
now HAS mesa, libepoxy and EGL -- so this is a real capability being declined \
for now rather than one that is unavailable. Named here so it is found when \
WPE's requirements are read.

pango IS DISABLED even though pango is in this set: it is for rendering \
subtitle overlays, which a browser draws itself.

alsa IS ENABLED and is the only reason alsa-lib is in the media batch -- this \
is the sink that turns decoded audio into sound. Untestable in CI; there is no \
audio device in the boot test."""

[installs]
prefixes = ["usr/include/gstreamer-1.0/gst/allocators", "usr/include/gstreamer-1.0/gst/app", "usr/include/gstreamer-1.0/gst/audio", "usr/include/gstreamer-1.0/gst/fft", "usr/include/gstreamer-1.0/gst/pbutils", "usr/include/gstreamer-1.0/gst/riff", "usr/include/gstreamer-1.0/gst/rtp", "usr/include/gstreamer-1.0/gst/rtsp", "usr/include/gstreamer-1.0/gst/sdp", "usr/include/gstreamer-1.0/gst/tag", "usr/include/gstreamer-1.0/gst/video", "usr/lib", "usr/lib/gstreamer-1.0", "usr/lib/pkgconfig", "usr/share/gst-plugins-base/1.0"]
files    = 195
digest   = "eca05dfb0f3bf22668a5907f3366a59b37fd6428f4ad59de108b9826c630f899"

[[steps]]
name = "unpack"
cwd  = "$B"
run  = [["tar", "-xf", "$DL/gst-plugins-base-1.28.1.tar.xz", "-C", "$B"]]

[[steps]]
name = "setup"
cwd  = "$S"
run  = [["meson", "setup", "_b", "--prefix=/usr", "--buildtype=release", "--libdir=lib",
         "--wrap-mode=nofallback",
         "-Dauto_features=disabled", "-Dorc=enabled", "-Dapp=enabled",
         "-Daudioconvert=enabled", "-Daudioresample=enabled",
         "-Dplayback=enabled", "-Dtypefind=enabled",
         "-Dvideoconvertscale=enabled", "-Dvolume=enabled", "-Dogg=enabled",
         "-Dopus=enabled", "-Dvorbis=enabled", "-Dalsa=enabled",
         "-Dx11=disabled", "-Dgl=disabled", "-Dpango=disabled",
         "-Dintrospection=disabled", "-Dnls=disabled", "-Dexamples=disabled",
         "-Dtests=disabled", "-Ddoc=disabled"]]

[[steps]]
name = "build"
cwd  = "$S"
run  = [["ninja", "-C", "_b"]]

[[steps]]
name = "install"
cwd  = "$S"
run  = [["ninja", "-C", "_b", "install"]]
env  = { DESTDIR = "$D" }

[guest]
# gst-inspect --exists CHECKS AN ELEMENT, NOT A PLUGIN, AND CANNOT CHECK A
# PLUGIN AT ALL. These tests named plugins -- playback, isomp4, matroska,
# videoparsersbad, libav -- and every one failed:
#
#     FAIL  gst-inspect-1.0 --exists --atleast-version=1.28.1 isomp4 did not run
#
# tools/gst-inspect.c:2387 is gst_registry_lookup_feature(registry, argv[1]),
# which resolves FEATURES. The plugin branch three lines further down is
# unimplemented and says so outright:
#
#     /* FIXME: support checking for plugins too */
#     g_printerr ("Checking for plugins is not supported yet\n");
#     exit_code = -1;
#
# So --exists with a plugin name is not merely wrong, it is a mode the tool
# does not have. The element names below were read out of each package's
# own sources rather than guessed: an element is what a pipeline actually
# instantiates, so asserting one proves the plugin loaded AND registered.

# gst-inspect PROVES A PLUGIN LOADED, which a .pc version does not. If orc or a
# codec failed to resolve, the plugin is absent from the registry and this says
# so -- the difference between "the file installed" and "GStreamer can use it".
test   = [["/usr/bin/pkgconf", "--modversion", "gstreamer-plugins-base-1.0"],
          ["/usr/bin/gst-inspect-1.0", "--exists", "--atleast-version=1.28.1", "playbin"]]
expect = ["1.28.1", ""]
