[source]
name     = "musl"
version  = "1.2.5"
url      = "https://musl.libc.org/releases/musl-1.2.5.tar.gz"
mirrors  = ["https://github.com/bminor/musl/archive/refs/tags/v1.2.5.tar.gz"]
sha256   = "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4"
license  = "MIT"

# Measured by tools/fetch-pinned.sh, then pinned. A mismatch
# from here on is a signal, not a shrug.

[substitutions]
# DECLARED, not silent. See spikes/stage3/patches/tcc-arm64-asm/README.md.
#
# dropped_asm IS EMPTY, AND USED NOT TO BE. Nine aarch64 .s files were listed
# here on the grounds that "tcc's arm64 assembler cannot assemble these; musl
# ships portable C for each, so the C fallback is used". Measured on
# 2026-07-31 by spikes/stage4/bridge/rungs.sh, which attempts each file rather
# than assuming: ALL NINE ASSEMBLE. 0 refused. musl then builds 1349 of 1349
# sources and a hosted hello world links and runs.
#
# BOTH HALVES OF THE OLD CLAIM WERE WRONG, and the second half was the
# dangerous one. There is no portable C for `__set_thread_area` -- it is
# `msr tpidr_el0, x0`, which cannot be written in C -- so dropping it left the
# thread pointer unset, __init_tls silently did nothing, and the first access
# to errno segfaulted. A static binary linked cleanly and died on startup:
#
#     rung 3: 80 KB, statically linked, no interpreter, SIGNAL 11
#
# That cost several rounds and looked like a codegen fault every time.
#
# The likely history is that this list predates the five-patch arm64 assembler
# series in spikes/stage3/patches/tcc-arm64-asm/ and was never re-measured
# against it. Re-measure before adding anything back here.
dropped_asm = []
dropped_c = ["src/complex/*.c"]   # tcc: "_Complex is not yet supported" (66 sites)

# arch/aarch64/bits/float.h IS REWRITTEN, and that was not recorded here until
# now. mc-tcc's long double is eight bytes (tcc-microc patch 0001); musl's
# aarch64 header declares LDBL_MANT_DIG 113. Every `#if LDBL_MANT_DIG == 113`
# arm in musl's math then runs a 113-bit algorithm over a 64-bit value. The
# replacement is musl's OWN long-double-is-double configuration -- the values
# every architecture where that holds already ships -- so this selects a
# configuration musl supports rather than inventing a fourth. Written by
# spikes/stage4/bridge/rungs.sh at rung 2.
rewritten_headers = ["arch/aarch64/bits/float.h"]

# mallocng's OBJECTS ARE NAMED ON THE LINK LINE, not left to libc.a. musl
# selects its allocator with `#define malloc __libc_malloc_impl`
# (mallocng/glue.h:23), so mallocng defines that symbol STRONGLY while
# lite_malloc.c has a weak_alias for it and the only definition of the public
# `malloc`. tcc binds the weak one, so malloc came from __simple_malloc -- a
# bump allocator writing no header -- while free came from mallocng, which
# read that header and dereferenced a null meta pointer. Measured with the
# gcc-built tcc control as well: it does the same, so this is a tcc
# limitation both arms share and not a defect in mc-tcc.
link_order = ["src/malloc/mallocng/*.o named explicitly, ahead of libc.a"]

[verification]
runtime = "4-rung ladder passes: raw _start syscall, crt+libc startup, malloc, stdio"
built   = "1349/1349 sources compile under tcc on aarch64; hosted hello world links and runs in a busybox-only box (stage3-to-stage4-reference, 2026-07-31)"
note    = "libc.a lacks complex math. This is NOT a complete musl and must not be described as one."
