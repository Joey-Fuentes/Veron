# EVERY REMAINING STAGE-4 INPUT, NAMED. Versions read from the workflow's own
# env block (4-toolchain-kernel-amd64.yml) on 2026-08-16 -- the one place they
# were already pinned. Hashes follow the minting doctrine: sha256 = "" until
# tools/mirror-sources.sh (or the first enforced fetch) prints the measured
# hash, which is then committed here. NOTHING in this file is guessed: a
# wrong URL fails loudly at mirror time and gets corrected, never papered over.
#
# Already pinned elsewhere (do not duplicate): gcc 4.7.4 / 4.8.5 / 10.2.0
# (gcc.toml), gmp/mpfr/mpc (prereqs.toml), musl (musl.toml), busybox has
# busybox.toml -- CHECK it before trusting this file's entry and delete
# whichever is the duplicate.

