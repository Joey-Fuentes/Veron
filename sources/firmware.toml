# Firmware and microcode for the GENERIC live-boot kernel (stage 4's kernel
# work). The tree ships COMPLETE on the squashfs, zstd-compressed, with
# WHENCE and every LICENCE.* preserved -- that is the redistribution
# requirement. Drivers load it at module time (CONFIG_FW_LOADER_COMPRESS_ZSTD);
# nothing is compiled into vmlinuz (CONFIG_EXTRA_FIRMWARE stays off: linking
# non-GPL blobs into the kernel image is a GPL problem).
#
# PROVENANCE OF THESE HASHES: read on 2026-08-16 from kernel.org's
# PGP-SIGNED sha256sums.asc in each directory -- not from memory, not from a
# report. tools/verify-source.sh re-checks them on every fetch regardless.

[[source]]
name     = "linux-firmware"
version  = "20260810"          # newest dated release (published 2026-08-10)
url      = "https://www.kernel.org/pub/linux/kernel/firmware/linux-firmware-20260810.tar.xz"
mirrors  = ["https://mirrors.edge.kernel.org/pub/linux/kernel/firmware/linux-firmware-20260810.tar.xz"]
sha256   = "ac17c34fe73756926a961fbafadf8d8f07a3bd2dd2f4ea31a0fb5d50c714a49a"
license  = "Redistributable per WHENCE; per-vendor LICENCE.* files govern"
role     = "complete firmware tree for the generic live kernel (squashfs); 619 MB xz"

