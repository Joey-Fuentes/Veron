# Linux From Scratch books — reference material for the stage 4/5 sysroots.
# See sources/README.md: url + hash + license, nothing enters a build unnamed.
#
# THESE ARE NOT BUILD INPUTS. Nothing in this repository compiles an LFS book.
# They are pinned because we take VERSION SETS and CONFIGURE RECIPES from them,
# and three runs were lost to versions chosen from memory instead:
#   gcc 13.2 + glibc 2.39   glibc died on -Werror=attributes
#   busybox 1.36.1          gcc 14 promoted two warnings to errors
#   m4 1.4.20               gnulib emitted _Generic where gcc 15.2 rejects it
# The whole value of a book is that somebody has run that exact combination end
# to end. A pin here is what makes "the book says so" checkable.
#
# WHY FIVE. One per rung of the ladder, plus one that cannot be built.
#
#   4.7.4 + aarch64 backend  ->  g++ 4.7  ->  10.2.0  ->  15.2.0 / 16.1.0
#     ^ 7.5's environment                       ^ 10.0     ^ 13.0   ^ r13.0-156
#
# 4.8.5 does NOT need a book: it is the transplant DONOR. We copy
# gcc/config/aarch64, gcc/common/config/aarch64, libgcc/config/aarch64,
# config.sub and config.guess out of the tarball and never build it. 4.8.2 is a
# different matter -- it is the compiler that currently builds the period
# sysroot, and 7.5 is its book.

[[book]]
version  = "7.3"
file     = "spikes/stage4/books/LFS-BOOK-7_3_tar.bz2"
sha256   = "376f460217dfa06ec8801324c39a4391a852b1857315fe66dae98f31de1aaa6b"
gcc      = "4.7.2"
glibc    = "2.17"
binutils = "2.23.1"
linux    = "3.8.1"
role     = "reference only -- describes a 4.7-era system"
note     = """
Cannot be built on aarch64: gcc 4.7.2 has no aarch64 backend, which is the
entire reason spikes/stage3's transplant exists. Kept because it is the only
description of the environment our transplanted 4.7.4 is native to.
"""

[[book]]
version  = "7.5"
file     = "spikes/stage4/books/LFS-BOOK-7_5_tar.bz2"
sha256   = "0bd7d7e7d56a13a2cb55e4a875f15f81063e4ac4589ab83525feab9e0a2a1644"
gcc      = "4.8.2"
glibc    = "2.19"
binutils = "2.24"
linux    = "3.13.3"
role     = "the period sysroot -- .github/workflows/hermetic-gcc47.yml"
note     = """
The earliest LFS whose cross compiler can target aarch64, and therefore the
earliest period sysroot buildable here. Also the 4.8 book.

glibc 2.19 predates the struct ucontext -> ucontext_t rename (2.26), which is
what makes this the only environment where the libgcc ICE recorded in
stage4/GCC-BACKPORT.md can be tested rather than patched around.
"""

[[book]]
version  = "10.0"
file     = "spikes/stage4/books/LFS-BOOK-10_0_tar.xz"
sha256   = "3b07207b010fe973684dd2afaf2cc9c4d2cd4cb7c31c8234b346afeeba063cca"
gcc      = "10.2.0"
glibc    = "2.32"
binutils = "2.35"
linux    = "5.8.3"
role     = "rung 2 -- .github/workflows/hermetic-gcc10.yml"
note     = """
GCC's own prerequisites: "versions prior to 10.5 allow bootstrapping with an
ISO C++98 compiler". So the whole 10.x series up to 10.4 is reachable from
g++ 4.7, and 10.2.0 was chosen over live-bootstrap's 10.4.0 for one reason --
10.2.0 has a book and 10.4.0 does not. A tested surrounding set beats being at
the top of the permitted range, and 10.2 provides the C++14 that rung 3 needs
just as well as 10.4 would.

This is now the ONLY number in the tree. An earlier workflow built 10.4.0
while this manifest said 10.2.0, so the rung named here was not the rung any
code built. hermetic-gcc10 builds 10.2.0 and hermetic-gcc47 hands off to
10.2.0.
"""

[[book]]
version  = "13.0"
file     = "spikes/stage4/books/LFS-BOOK-13_0_tar.xz"
sha256   = "4c659e5fb346378a0fe73dfb235f45f283a598d9b7d7904f49cdeeae14193413"
gcc      = "15.2.0"
glibc    = "2.43"
binutils = "2.46.0"
linux    = "6.18.10"
role     = "the modern baseline -- .github/workflows/hermetic-gcc15.yml"

[[book]]
version  = "r13.0-156-systemd"
file     = "spikes/stage4/books/LFS-BOOK-r13_0-156-systemd_tar.bz2"
sha256   = "f9bf98d193029ef04caeacf873cb36f2f37aa3a6b983f3bfe5d155e177f99af6"
gcc      = "16.1.0"
glibc    = "2.43"
binutils = "2.46.1"
linux    = "7.1.3"
role     = "bleeding edge -- .github/workflows/hermetic-gcc16.yml"
note     = """
A DEVELOPMENT SNAPSHOT, NOT A RELEASE, and it is not fully reproducible from
upstream: it pins MPC 1.4.1, which is present on neither mirrors.kernel.org nor
ftp.gnu.org. hermetic-gcc16 therefore builds with MPC 1.3.1 -- LFS 13.0's pin, far
past gcc's minimum of 0.8.0, and mirrored. Tracking a development book means
occasionally being pinned to something unpublished; recorded here so the
substitution is visible rather than discovered as a 404.

Its recipe differs from 13.0 in exactly two places, which is itself worth
noting: --disable-fixincludes on both gcc passes, and --enable-kernel=5.10
instead of 5.4. Two major gcc releases apart, chapter 5 is otherwise unchanged.
"""

[license]
spdx = "CC-BY-NC-SA-2.0"
note = """
The LFS book is CC BY-NC-SA 2.0, which is NOT the licence the rest of this
repository carries. The books are vendored as reference documentation and
nothing in them is compiled or redistributed as part of a build. The
non-commercial clause is worth being aware of before any of this is packaged.
"""

[missing]
note = """
No book covers gcc 4.8.5, and none is needed -- it is the transplant donor and
is never built. If that ever changes, 7.5 is the closest (4.8.2).
"""
