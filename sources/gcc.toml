# gcc — the entry point to the compiler leg.
# See sources/README.md: url + hash + license, nothing enters a build unnamed.
#
# THE COMPILER LEG, PINNED IN LADDER ORDER. 4.7.4 is the tree that is built;
# 4.8.5 contributes its aarch64 backend and its config.sub/config.guess and is
# never built itself. 10.2.0 is the rung 4.7 exists to reach, and was added when
# stage4-complete began fetching it directly rather than inheriting it from
# hermetic-gcc10. Everything fetched is pinned.
#
# 15.2.0 IS NOT HERE YET, AND THAT IS NOT AN OVERSIGHT. No run has measured it:
# rung 1 has never finished, so rung 2 has never fetched it. It goes in when a
# run prints its hash, not before. See sources/prereqs.toml for the same rule
# applied to gmp/mpfr/mpc and for the list of what is still outstanding.

[[source]]
name     = "gcc"
version  = "4.7.4"
url      = "https://mirrors.kernel.org/gnu/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2"
mirrors  = ["https://ftpmirror.gnu.org/gcc/gcc-4.7.4/gcc-4.7.4.tar.bz2"]
sha256   = "92e61c6dc3a0a449e62d72a38185fda550168a86702dea07125ebd3ec3996282"
license  = "GPL-3.0-or-later"
role     = "the tree that is built -- the last gcc written in C"

[[source]]
name     = "gcc"
version  = "4.8.5"
url      = "https://mirrors.kernel.org/gnu/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2"
mirrors  = ["https://ftpmirror.gnu.org/gcc/gcc-4.8.5/gcc-4.8.5.tar.bz2"]
sha256   = "22fb1e7e0f68a63cee631d85b20461d1ea6bda162f03096350e38c8d427ecf23"
license  = "GPL-3.0-or-later"
role     = "donor -- gcc/config/aarch64, gcc/common/config/aarch64, libgcc/config/aarch64, config.sub, config.guess"

[[source]]
name     = "gcc"
version  = "10.2.0"
url      = "https://mirrors.kernel.org/gnu/gcc/gcc-10.2.0/gcc-10.2.0.tar.xz"
mirrors  = ["https://ftpmirror.gnu.org/gcc/gcc-10.2.0/gcc-10.2.0.tar.xz"]
sha256   = "b8dd4368bb9c7f0b98188317ee0254dd8cc99d1e3a18d0ff146c855fe16c1d8c"
license  = "GPL-3.0-or-later"
role     = "the rung the whole choice of 4.7 exists for -- built by g++ 4.7"
note     = """
10.2.0 AND NOT 10.4.0, and this is the same number tcc-builds-gcc-arm64 pins in
its env: block. gcc's own prerequisites put the ceiling for an ISO C++98
bootstrap compiler above the whole 10.x series, so the choice inside that range
is free -- and 10.2.0 is the version LFS 10.0 documents, which means a tested
set of everything around it. sources/lfs.toml records this as the only 10.x
number in the tree; do not drift it.

.tar.xz, NOT .tar.bz2. GNU stopped shipping bz2 tarballs after the 4.x/5.x era,
which is why 4.7.4 and 4.8.5 above are .tar.bz2 and this is not. An earlier
stage4-complete asked for gcc-10.2.0.tar.bz2 with a curl that lacked -f, got a
404 page written into the cache file, and failed hours later in tar.
"""

# WHERE 10.2.0'S HASH COMES FROM. Measured, like the two above: read off
# mirrors.kernel.org by stage4-complete run 81907665505 on 2026-07-27, which
# reported it as an UNPINNED finding rather than silently accepting it.

# LICENSE NOTE. The compiler proper is GPL-3.0-or-later. libgcc and the other
# runtime libraries additionally carry the GCC Runtime Library Exception
# (SPDX: GCC-exception-3.1). Nothing in this leg builds libgcc yet, but the
# distinction has to be recorded before anything ships a runtime.

# WHERE THESE HASHES COME FROM. Both were measured, not transcribed:
# tools/fetch-pinned.sh was invoked with "-" for the expected
# hash, which makes it PRINT the sha256 of what it fetched rather than verify
# one. The two values above are what tcc-builds-gcc-arm64 read off
# mirrors.kernel.org on 2026-07-25. Inventing a plausible hash would have been
# worse than leaving the field empty, so the workflow was written to produce
# one instead.
#
# To re-verify from scratch, pass "-" again and compare what it prints.

[verification]
measured_by = ".github/workflows/tcc-builds-gcc-arm64.yml"
measured_on = "2026-07-25"
built_by    = "gcc 13 (host) and tcc 0.9.28rc HEAD@5ec0e6f8, both configure rc=0 build rc=0"

# WHY 4.8.5 AND NOT 4.8.0 for the donor: gcc-backend-backport-probe measured the
# backend<->middle-end interface delta with the vax backend as a control, and it
# is IDENTICAL across 4.7.4->4.8.0 and 4.7.4->4.8.5 (15 files, 76+, 72-). The
# interface did not move within the 4.8 series, so 4.8.5's backend is no further
# from 4.7 than 4.8.0's while carrying ~1,800 lines of fixes to a port that was
# one release old.

[transplant]
tool     = "spikes/stage4/probes/backport-aarch64.sh"
adapters = ["tools/expand_int_iterators.py", "tools/port_gcc47_api.py"]
record   = "spikes/stage4/GCC-BACKPORT.md"
